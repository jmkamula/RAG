# Canonical doc mapping: PII / Client Data Handling Process →
# A.5.34 PII protection (anchor) + classification + access +
# deletion adjacencies.
#
# Tenants commonly maintain a single end-to-end "Data Handling
# Process" or "Client Data Handling Procedure" describing the
# Collect → Classify → Restrict-access → Process → Store →
# Delete lifecycle for personally identifiable information.
# This umbrella anchors such docs to A.5.34 (PII protection)
# with cross-coverage on classification (A.5.12), access
# (A.5.15), and deletion (A.8.10).
#
# Authored 2026-06-24 after the extractor's unconditional
# unbound drop (commit b4bf331) surfaced this doc shape with
# no specific mapping coverage. The previous extraction produced
# 10 unbound findings spread across A.5.1/2/12/15/31/34/36/37,
# A.8.2/10 — most from referential mentions, not real evidence.
# Narrowing scope here forces the LLM to focus on per-MUST
# binding for the PII-handling lifecycle.

