slug: employee_lifecycle
title: "Employee Lifecycle (Onboarding to Offboarding)"
description: |
  Human resources security across the employment cycle covering
  ISO 27001 Annex A.6 (people controls) + access + asset lifecycle
  (A.5.11 return, A.5.16-18 identity + access rights). Load-bearing
  bundle — HR events drive most identity + access change traffic.
primary_framework: multi
display_order: 45
auditor_expects: |
  Auditors sample joiners and leavers and trace: joiner — screening
  (A.6.1) + signed terms (A.6.2) + NDA (A.6.6) + awareness training
  (A.6.3) + identity provisioning (A.5.16-17); leaver — return of
  assets (A.5.11) + revocation (A.5.16-18) + post-employment
  responsibilities (A.6.5) + disciplinary evidence if applicable
  (A.6.4).

leaves:
  # Pre-employment
  - leaf_id: req:A.6.1:screening_procedure
    role: primary_procedure
    workflow_order: 1

  - leaf_id: req:A.6.1:screening_record_register
    role: primary_register
    workflow_order: 2

  # Terms + NDA
  - leaf_id: req:A.6.2:employment_terms_template
    role: form
    workflow_order: 3

  - leaf_id: req:A.6.6:nda_template
    role: form
    workflow_order: 4

  # Awareness
  - leaf_id: req:A.6.3:security_awareness_programme
    role: primary_procedure
    workflow_order: 5

  - leaf_id: req:A.6.3:training_completion_register
    role: log
    workflow_order: 6

  # Identity + access provisioning
  - leaf_id: req:A.5.16:identity_management_procedure
    role: primary_procedure
    workflow_order: 7

  - leaf_id: req:A.5.17:authentication_information_procedure
    role: primary_procedure
    workflow_order: 8

  - leaf_id: req:A.5.18:access_rights_procedure
    role: primary_procedure
    workflow_order: 9

  # Offboarding
  - leaf_id: req:A.5.11:return_of_assets_procedure
    role: primary_procedure
    workflow_order: 10

  - leaf_id: req:A.5.11:per_leaver_return_record
    role: evidence
    workflow_order: 11

  - leaf_id: req:A.5.16:identity_revocation_record
    role: evidence
    workflow_order: 12

  - leaf_id: req:A.6.5:post_employment_responsibilities
    role: primary_procedure
    workflow_order: 13

  # Disciplinary (edge case)
  - leaf_id: req:A.6.4:disciplinary_process
    role: supporting_prerequisite
    workflow_order: 14
