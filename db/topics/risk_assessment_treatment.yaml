slug: risk_assessment_treatment
title: "Risk Assessment & Treatment Cycle"
description: |
  The full risk lifecycle mandated by ISO 27001 clauses 6.1.2
  (risk assessment methodology), 6.1.3 (risk treatment + SoA),
  8.2 (operational risk assessment), and 8.3 (risk treatment
  execution). The most-audited clause set in ISO 27001.
primary_framework: ISO27001:2022
display_order: 30
auditor_expects: |
  Auditors first ask for the documented methodology (6.1.2), then
  the risk register showing it's been applied, then the SoA
  (6.1.3) with justifications, then the risk treatment plan with
  ownership + due dates, then evidence of operational execution
  (8.2 + 8.3). Missing SoA justification-per-control is the #1
  finding on Stage-1 audits.

leaves:
  # 6.1.2 — methodology + first-run register
  - leaf_id: req:6.1.2:risk_methodology_scope
    role: primary_procedure
    workflow_order: 1
    role_note: |
      The documented methodology — criteria for likelihood, impact,
      risk acceptance thresholds. Written once, referenced everywhere.

  - leaf_id: req:6.1.2:risk_assessment
    role: primary_procedure
    workflow_order: 2

  - leaf_id: req:6.1.2:risk_register
    role: primary_register
    workflow_order: 3

  # 6.1.3 — treatment + SoA
  - leaf_id: req:6.1.3:treatment_methodology_scope
    role: primary_procedure
    workflow_order: 4

  - leaf_id: req:6.1.3:risk_treatment_plan
    role: primary_register
    workflow_order: 5

  - leaf_id: req:6.1.3:statement_of_applicability
    role: primary_register
    workflow_order: 6
    role_note: |
      The Statement of Applicability — a first-look audit
      artefact. Every Annex A control listed with in-scope decision
      + justification. Certifiers reject SoAs where every control
      is just "applicable" with no reasoning.

  # 8.2 + 8.3 — operational execution
  - leaf_id: req:8.2:assessment_trigger_procedure
    role: primary_procedure
    workflow_order: 7
    role_note: |
      When to re-run risk assessment: significant change, incident,
      new asset, control failure. Prevents the "annual freeze"
      failure mode where risk assessments happen once a year only.

  - leaf_id: req:8.2:operational_risk_assessment_record
    role: log
    workflow_order: 8

  - leaf_id: req:8.3:treatment_execution_procedure
    role: primary_procedure
    workflow_order: 9

  - leaf_id: req:8.3:operational_risk_treatment_record
    role: log
    workflow_order: 10
