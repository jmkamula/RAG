slug: incident_response
title: "Security Incident Response Lifecycle"
description: |
  End-to-end incident handling from event detection through
  post-incident review. Covers ISO 27001 A.5.24-27 (preparation,
  event assessment, response, post-incident) + GDPR Art.33-34
  (regulatory notification) + A.6.8 (event reporting culture).
primary_framework: multi
display_order: 20
auditor_expects: |
  Auditors want to see this bundle exercised in real conditions.
  Common findings on immature ISMS: (1) no formal event-triage
  criteria (A.5.25); (2) incident register incomplete or missing
  closure notes (A.5.26); (3) no evidence of framework drills
  (A.5.24); (4) breach-notification decision workflow absent
  (Art.33). A working bundle demonstrates the incident capability
  under scrutiny.

leaves:
  # Preparation layer — A.5.24
  - leaf_id: req:A.5.24:incident_response_procedure
    role: primary_procedure
    workflow_order: 1
    role_note: |
      The plan itself. Defines roles, escalation paths, RACI, and
      decision authorities. Prerequisite to executing anything else.

  - leaf_id: req:A.5.24:incident_response_team_register
    role: supporting_prerequisite
    workflow_order: 2
    role_note: |
      Named on-call responders + contact details. Fresh (updated on
      HR changes) — stale roster is a common finding.

  - leaf_id: req:A.5.24:framework_exercise_record
    role: review_record
    workflow_order: 3
    role_note: |
      Evidence of drills / tabletop exercises. Auditors look for
      at least annual; A.5.24 wants demonstrable readiness.

  # Event assessment — A.5.25
  - leaf_id: req:A.5.25:event_assessment_procedure
    role: primary_procedure
    workflow_order: 4
    role_note: |
      The triage decision criteria — what qualifies as an incident
      vs. an event. Load-bearing for the 72h Art.33 clock.

  - leaf_id: req:A.5.25:event_triage_log
    role: log
    workflow_order: 5

  # Response + closure — A.5.26
  - leaf_id: req:A.5.26:incident_response_procedure
    role: primary_procedure
    workflow_order: 6

  - leaf_id: req:A.5.26:incident_register
    role: primary_register
    workflow_order: 7
    role_note: |
      One row per incident with severity, timeline, root cause,
      containment actions, closure decision.

  - leaf_id: req:A.5.26:incident_closure_record
    role: evidence
    workflow_order: 8

  # GDPR notification lane — Art.33
  - leaf_id: req:Art.33:notification_procedure
    role: supporting_cross_framework
    workflow_order: 9
    role_note: |
      The 72h decision workflow for when an incident is a personal
      data breach requiring SA notification. Coordinated with A.5.26
      closure.

  - leaf_id: req:Art.33:breach_notification
    role: form
    workflow_order: 10
    role_note: |
      The notification letter template (SA + affected subjects).
