slug: supplier_onboarding
title: "Supplier / Processor Onboarding"
description: |
  End-to-end vendor onboarding covering ISO 27001 A.5.19-A.5.23
  (supplier security requirements + agreements + supply-chain
  management) + GDPR Art.28 (processor obligations). The bundle
  a procurement team runs on every new vendor.
primary_framework: multi
display_order: 40
auditor_expects: |
  Auditors sample suppliers and ask: show me the agreement (A.5.20
  + Art.28), show me the risk assessment (A.5.19), show me the
  ongoing review record (A.5.22), and — for processors — show me
  the DPA (Art.28) with the Art.28(3) mandatory clauses.

leaves:
  # Onboarding gate
  - leaf_id: req:A.5.19:supplier_risk_procedure
    role: primary_procedure
    workflow_order: 1
    role_note: |
      Pre-onboarding due diligence: what security assessment does
      each supplier category get before contract signature.

  - leaf_id: req:A.5.19:supplier_register
    role: primary_register
    workflow_order: 2

  # Contract layer
  - leaf_id: req:A.5.20:supplier_agreement_security_template
    role: form
    workflow_order: 3
    role_note: |
      Master security addendum bolted onto every supplier
      agreement. Reduces per-supplier drafting to filling blanks.

  - leaf_id: req:A.5.20:coverage_register
    role: log
    workflow_order: 4

  # GDPR processor lane
  - leaf_id: req:Art.28:data_processing_agreement
    role: form
    workflow_order: 5
    role_note: |
      DPA template with Art.28(3) mandatory content — subject
      matter, duration, nature/purpose, types of PII, obligations.
      EDPB 07/2020 has the authoritative content list.

  - leaf_id: req:Art.28:processor_register
    role: primary_register
    workflow_order: 6

  # Ongoing review
  - leaf_id: req:A.5.22:supplier_review_record
    role: review_record
    workflow_order: 7

  - leaf_id: req:A.5.22:review_schedule_register
    role: log
    workflow_order: 8

  # Supply chain (A.5.21 — often overlooked)
  - leaf_id: req:A.5.21:ict_supply_chain_procedure
    role: supporting_prerequisite
    workflow_order: 9

  # Offboarding
  - leaf_id: req:A.5.19:offboarding_record
    role: evidence
    workflow_order: 10

  # ISO 27701 processor-side extension (B.8.x) — for cloud tenants
  # this is the primary supplier-onboarding surface, not the ISO
  # 27001 A.5.x supplier controls alone. B.8.2.1 (customer agreement)
  # is the operational anchor of GDPR Art.28 in the PIMS layer.
  - leaf_id: req:B.8.2.1:customer_agreement_procedure
    role: supporting_iso_mirror
    workflow_order: 11
    role_note: |
      ISO 27701 processor extension. PIMS discipline for the
      customer agreement that operationalizes GDPR Art.28. When
      the tenant is a processor for downstream customers, this
      is the primary contractual gate.

  - leaf_id: req:B.8.2.5:customer_information_procedure
    role: supporting_iso_mirror
    workflow_order: 12
    role_note: |
      ISO 27701 processor extension. Customer information + audit
      support — how the processor supports the customer's own
      compliance obligations under Art.28.

  - leaf_id: req:B.8.2.6:processor_ropa_register
    role: supporting_iso_mirror
    workflow_order: 13
    role_note: |
      ISO 27701 processor extension. Processor RoPA per GDPR
      Art.30(2). Distinct from the controller RoPA — mirrors
      records_of_processing bundle from the processor side.

  # Ship 54'.a addendum — controller-side PIMS anchors for
  # processor engagement + joint-controller arrangements
  - leaf_id: req:A.7.2.6:processor_contract_procedure
    role: supporting_iso_mirror
    workflow_order: 14
    role_note: |
      ISO 27701 controller extension. Contracts with PII
      processors — the controller-side operational discipline
      that produces the DPA required by GDPR Art.28.

  - leaf_id: req:A.7.2.7:joint_controller_procedure
    role: supporting_iso_mirror
    workflow_order: 15
    role_note: |
      ISO 27701 controller extension. Joint PII controller
      arrangements — where responsibility is shared, GDPR Art.26
      requires a transparent arrangement documented under this
      procedure.
