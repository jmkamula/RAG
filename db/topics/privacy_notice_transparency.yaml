slug: privacy_notice_transparency
title: "Privacy Notice & Transparency"
description: |
  How your organisation informs data subjects about processing —
  the privacy notice at collection (Art.13/14), the transparency
  discipline (Art.12), and the ability to modify or withdraw
  choices (Art.7(3), A.7.3.4). Distinct from DSR (which is reactive
  request handling) — this is the proactive information layer.
primary_framework: ISO27701:2019
display_order: 12
auditor_expects: |
  Regulators check: (1) the current privacy notice exists and is
  accessible at the point of data collection; (2) it contains all
  Art.13 or Art.14 mandatory items (identity, purposes, basis,
  recipients, retention, rights, source, transfers); (3) notice
  distribution is evidenced — showing the notice existed at time
  of collection, not retrofit; (4) the withdrawal / preference-
  modification mechanism works and is documented.

leaves:
  # GDPR obligations
  - leaf_id: req:Art.12:transparency_procedure
    role: primary_procedure
    workflow_order: 1
    role_note: |
      Transparency — Art.12 requires information provided under
      Art.13-14 to be concise, transparent, intelligible, in
      clear + plain language.

  - leaf_id: req:Art.13:privacy_notice
    role: primary_procedure
    workflow_order: 2
    role_note: |
      Direct-collection privacy notice — mandated content per
      Art.13(1) + Art.13(2).

  - leaf_id: req:Art.14:privacy_notice
    role: primary_procedure
    workflow_order: 3
    role_note: |
      Indirect-collection privacy notice — Art.14 applies when
      PII is received from a source other than the data subject.
      Different timing constraints from Art.13.

  - leaf_id: req:Art.13:publication_record
    role: log
    workflow_order: 4

  # ISO 27701 controller extensions
  - leaf_id: req:A.7.3.1:obligations_procedure
    role: supporting_iso_mirror
    workflow_order: 5
    role_note: |
      ISO 27701 controller extension. Determining and fulfilling
      obligations to PII principals — umbrella procedure that the
      privacy notice and other rights mechanisms sit inside.

  - leaf_id: req:A.7.3.2:notice_content_procedure
    role: supporting_iso_mirror
    workflow_order: 6
    role_note: |
      ISO 27701 controller extension. Determining information for
      PII principals — the WHAT of the privacy notice.

  - leaf_id: req:A.7.3.3:notice_delivery_procedure
    role: supporting_iso_mirror
    workflow_order: 7
    role_note: |
      ISO 27701 controller extension. Providing information to PII
      principals — the HOW / WHEN of notice delivery.

  - leaf_id: req:A.7.3.3:notice_delivery_log
    role: log
    workflow_order: 8

  - leaf_id: req:A.7.3.4:consent_withdrawal_procedure
    role: supporting_iso_mirror
    workflow_order: 9
    role_note: |
      ISO 27701 controller extension. Providing mechanism to modify
      or withdraw consent — operationalizes Art.7(3).

  - leaf_id: req:A.7.3.4:withdrawal_event_register
    role: primary_register
    workflow_order: 10

  # ISO 27001 program layer
  - leaf_id: req:A.5.14:information_transfer_policy
    role: supporting_iso_mirror
    workflow_order: 0
    role_note: |
      ISO 27001 program layer. Information transfer policy —
      broader discipline that privacy notice delivery fits within.
