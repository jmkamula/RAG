slug: consent_and_lawful_basis
title: "Consent & Lawful Basis Lifecycle"
description: |
  How your organisation establishes and documents the lawful basis
  for every processing operation — and, where consent is the basis,
  how consent is obtained, refreshed, and withdrawn. Covers GDPR
  Art.6-9 (lawfulness + special categories) via the ISO 27701
  A.7.2 controller controls.
primary_framework: ISO27701:2019
display_order: 15
auditor_expects: |
  A supervisory authority looks for: (1) the mapping of every
  processing operation to a specific Art.6 lawful basis, with
  Art.9 conditions where special categories are processed; (2)
  documented consent capture records where consent is the basis
  (Art.7(1) burden of proof rests on the controller); (3) a
  working withdrawal mechanism (Art.7(3)); (4) evidence that
  special-category processing has documented Art.9(2) exceptions.

leaves:
  # GDPR obligations
  - leaf_id: req:Art.6:lawful_basis_determination_procedure
    role: primary_procedure
    workflow_order: 1
    role_note: |
      Lawfulness of processing — the anchor obligation. Every
      processing activity gets mapped to one of six lawful bases.

  - leaf_id: req:Art.6:lawful_basis_register
    role: primary_register
    workflow_order: 2

  - leaf_id: req:Art.7:consent_management_procedure
    role: primary_procedure
    workflow_order: 3
    role_note: |
      Conditions for consent (when consent is the chosen basis).
      Includes Art.7(3) withdrawal + Art.7(1) documentation.

  - leaf_id: req:Art.7:consent_register
    role: primary_register
    workflow_order: 4

  # Special-category and child data (obligation lane refinements)
  - leaf_id: req:Art.9:special_category_authorisation_procedure
    role: supporting_prerequisite
    workflow_order: 5
    role_note: |
      Special categories require both an Art.6 basis AND an Art.9
      exception. This procedure documents which Art.9(2) exception
      applies per relevant processing operation.

  - leaf_id: req:Art.8:child_consent_procedure
    role: supporting_prerequisite
    workflow_order: 6
    role_note: |
      Children's data — Art.8 age-verification + parental consent
      requirements when information society services are offered
      directly to children.

  # ISO 27701 controller extensions — the operational discipline
  - leaf_id: req:A.7.2.1:purpose_procedure
    role: supporting_iso_mirror
    workflow_order: 7
    role_note: |
      ISO 27701 controller extension. Identify and document purpose
      — PIMS discipline for recording WHY each processing operation
      exists. Prerequisite to lawful-basis mapping.

  - leaf_id: req:A.7.2.2:lawful_basis_procedure
    role: supporting_iso_mirror
    workflow_order: 8
    role_note: |
      ISO 27701 controller extension. Operationalizes GDPR Art.6
      in the PIMS.

  - leaf_id: req:A.7.2.3:consent_process_procedure
    role: supporting_iso_mirror
    workflow_order: 9

  - leaf_id: req:A.7.2.4:consent_capture_procedure
    role: supporting_iso_mirror
    workflow_order: 10

  - leaf_id: req:A.7.2.4:consent_record_register
    role: supporting_iso_mirror
    workflow_order: 11
    role_note: |
      ISO 27701 controller extension. The audit-defensible consent
      register required by Art.7(1) "burden of proof."

  # ISO 27001 program layer
  - leaf_id: req:A.5.34:privacy_and_pii_protection_policy
    role: supporting_iso_mirror
    workflow_order: 0
    role_note: |
      ISO 27001 program layer. The PII protection policy declares
      the tenant's commitment to lawful-basis discipline that
      this bundle operationalizes.
