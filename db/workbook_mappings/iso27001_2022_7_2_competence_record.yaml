      - fingerprint: [training]
        binds_to: "item:7.2:basis_of_competence"
      - fingerprint: [qualification]
        binds_to: "item:7.2:basis_of_competence"
      - fingerprint: [certification]
        binds_to: "item:7.2:basis_of_competence"
      - fingerprint: [education]
