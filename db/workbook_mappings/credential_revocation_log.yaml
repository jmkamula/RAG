# Canonical workbook mapping: credential revocation / reissue log → A.5.17
# credential revocation evidence.
#
# Per-credential record: credential_id, trigger_type (rotation / compromise /
# identity_termination), effective_time vs actual_timestamp (SLA),
# replacement issuance, residual session check, paired A.5.16 identity link.

schema_version: 1
mapping_id: workbook.iso.A_5_17.credential_revocation_log

sheet_name_fingerprints:
  - tokens: [credential, revocation]
  - tokens: [credential, reissue]
  - tokens: [credential, rotation]
  - tokens: [password, reset]
  - tokens: [token, revocation]
  - tokens: [key, rotation]

header_row_hints: [1, 2]
min_data_rows: 1

passes:

  - pass_name: credential_revocation
    target_control: "A.5.17"
    target_evidence_requirement: "req:A.5.17:credential_revocation_record"
    target_evidence_type: revocation_record
    freshness:
      column_fingerprint: [effective, time]
      alternative_fingerprints:
        - [revocation, date]
        - [date]
      days: 90
    required_columns:
      - fingerprint: [credential, ref]
        binds_to: "item:A.5.17:rev_credential_ref"
        alternative_fingerprints:
          - [credential, id]
          - [token, id]
      - fingerprint: [trigger, type]
        binds_to: "item:A.5.17:rev_trigger_type"
        alternative_fingerprints:
          - [trigger]
          - [reason]
      - fingerprint: [effective, time]
        binds_to: "item:A.5.17:rev_effective_time"
        alternative_fingerprints:
          - [effective, date]
          - [date]
    optional_columns:
      - fingerprint: [actual, timestamp]
        binds_to: "item:A.5.17:rev_actual_timestamp"
        coverage: partial
      - fingerprint: [replacement]
        binds_to: "item:A.5.17:rev_replacement"
        coverage: partial
      - fingerprint: [residual, check]
        binds_to: "item:A.5.17:rev_residual_check"
        coverage: partial
      - fingerprint: [identity, pair]
        binds_to: "item:A.5.17:rev_identity_pair"
        coverage: partial
      - fingerprint: [identity, ref]
        binds_to: "item:A.5.17:rev_identity_pair"
        coverage: partial

cross_control_links:
  - control: "A.5.16"
    rationale: "Identity-pair MUST enforces bidirectional A.5.16/A.5.17 lifecycle"
  - control: "A.5.18"
    rationale: "Access revocation pairs with credential revocation"

confidence_weights:
  sheet_name: 0.5
  required_columns: 0.4
  row_count: 0.1
