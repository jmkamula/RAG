# Canonical workbook mapping: ISMS manual change log → 4.4 evidence.

schema_version: 1
mapping_id: workbook.iso.4_4.isms_manual_change_log

sheet_name_fingerprints:
  - tokens: [isms, manual, change]
  - tokens: [manual, change]
  - tokens: [isms, change, log]
  # Removed `[doc, change, control]` 2026-06-11: matched workbook
  # self-metadata sheets ("This Doc Chng Control" sign-off block)
  # via "doc"+"change"+"control" tokens. Workbook front-matter
  # isn't ISMS-wide change evidence; it's the workbook file's own
  # version history. Tightened to ISMS-specific fingerprints only.
  #
  # Earlier 2026-06-10 removal of `[doc, chng, control]` covered the
  # tenant-abbreviation half of the problem — see
  # [[doc-mappings-no-tenant-specific]].

header_row_hints: [1, 2]
min_data_rows: 1

passes:

  - pass_name: isms_manual_change
    target_control: "4.4"
    target_evidence_requirement: "req:4.4:isms_manual_change_record"
    target_evidence_type: change_record
    freshness:
      column_fingerprint: [date]
      alternative_fingerprints:
        - [approval, date]
      days: 365
    required_columns:
      - fingerprint: [trigger]
        binds_to: "item:4.4:chg_trigger"
        alternative_fingerprints:
          - [reason]
      - fingerprint: [summary]
        binds_to: "item:4.4:chg_summary"
        alternative_fingerprints:
          - [description]
          - [change, summary]
      - fingerprint: [approval]
        binds_to: "item:4.4:chg_approval"
        alternative_fingerprints:
          - [approved, by]
    optional_columns:
      - fingerprint: [impact]
        binds_to: "item:4.4:chg_impact"
        coverage: partial

confidence_weights:
  sheet_name: 0.5
  required_columns: 0.4
  row_count: 0.1
