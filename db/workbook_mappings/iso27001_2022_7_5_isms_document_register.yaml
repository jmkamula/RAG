# Generated by scripts/generate_register_yamls.py
# Tier 3 register sweep — bulk-generated scaffold. Per-leaf tuning may refine
# sheet fingerprints and column bindings as real tenant data lands.

schema_version: 1
mapping_id: workbook.ISO27001_2022.7_5.isms_document_register

sheet_name_fingerprints:
  - tokens: [isms, document, register]
  - tokens: [isms, document, reg]
  - tokens: [isms, doc, register]
  - tokens: [isms, doc, reg]
  - tokens: [document, register]
  - tokens: [document, reg]
  - tokens: [doc, register]
  - tokens: [doc, reg]

header_row_hints: [1, 2]
min_data_rows: 1

passes:

  - pass_name: isms_document_register
    target_control: "7.5"
    target_evidence_requirement: "req:7.5:isms_document_register"
    target_evidence_type: register
    freshness:
      column_fingerprint: [approval, date]
      alternative_fingerprints:
        - [date]
      days: 365
    required_columns:
      - fingerprint: [doc, id]
        binds_to: "item:7.5:reg_doc_id"
      - fingerprint: [title]
        binds_to: "item:7.5:reg_title"
    optional_columns:
      - fingerprint: [owner]
        binds_to: "item:7.5:reg_owner"
        coverage: partial
      - fingerprint: [version]
        binds_to: "item:7.5:reg_version"
        coverage: partial
      - fingerprint: [approval, date]
        binds_to: "item:7.5:reg_approval_date"
        coverage: partial
      - fingerprint: [next, review]
        binds_to: "item:7.5:reg_next_review"
        coverage: partial
      - fingerprint: [classification]
        binds_to: "item:7.5:reg_classification"
        coverage: partial

    # Ship 90'.a — LLM-proposed cite_columns (curator sweep).
    cite_columns:
      - fingerprint: [doc, link]
        binds_to: "item:7.5:reg_doc_id"
        cite_kind: internal_document
        verification_days: 365

    # Sample-row anchor: document registers carry approval-date / next-
    # review-date columns that should contain real dates. A title-match
    # without real dates is a false positive.
    sample_value_anchors:
      - column_fingerprint: [approval, date]
        alternative_fingerprints:
          - [next, review]
        value_pattern: iso_date
        min_match_ratio: 0.7
        confidence_boost: 0.10
        confidence_penalty: -0.25

confidence_weights:
  sheet_name: 0.5
  required_columns: 0.4
  row_count: 0.1
