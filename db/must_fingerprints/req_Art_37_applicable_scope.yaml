# Per-MUST fingerprint catalog for req:Art.37:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.37:applicable_scope"
target_control: "Art.37"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.37:scope_voluntary_assessment"
    description: "Voluntary-designation assessment — even when not mandatory, did the org choose to designate (rationale recorded)"
    excerpt_keywords:
      - [voluntary, designation]
      - [dpo, designation, rationale]
      - [designation, assessment]
      - [organization, choose, designate]
      - [designation, not, mandatory]

  - must_id: "item:Art.37:scope_ms_law_overlay"
    description: "MS law overlay — Art.37.4 second sentence (MS may require designation in additional cases)"
    excerpt_keywords:
      - [memberstate, require, designation]
      - [additional, cases, designation]
      - [art37, four, sentence]
      - [ms, law, overlay]
      - [designation, data, protection, officer]

  - must_id: "item:Art.37:scope_criteria_test"
    description: "Art.37.1 criteria test operationalised (a public authority / b core activities = systematic monitoring large-scale / c core activities = large-scale special category)"
    excerpt_keywords:
      - [public, authority]
      - [core, activities]
      - [systematic, monitoring]
      - [large, scale]
      - [special, category]
      - [designation, criteria]

