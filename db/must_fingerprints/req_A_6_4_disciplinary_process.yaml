schema_version: 1
target_evidence_requirement: "req:A.6.4:disciplinary_process"
target_control: "A.6.4"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.4:owner"
    description: "Named owner of the procedure (HR with InfoSec partner)"
    excerpt_keywords:
      - [named, owner]
      - [procedure, owner]
      - [hr, partner]
      - [information, security, owner]
      - [responsible, procedure]

  - must_id: "item:A.6.4:communicated"
    description: "Communicated to personnel and interested parties (in employment contract, code of conduct, intranet, awareness training)"
    excerpt_keywords:
      - [communicated, personnel]
      - [employment, contract]
      - [code, conduct]
      - [intranet, access]
      - [awareness, training]
      - [interested, parties]

  - must_id: "item:A.6.4:action_range"
    description: "Range of actions defined (verbal warning, written warning, suspension, termination, legal referral, regulator notification where mandatory)"
    excerpt_keywords:
      - [verbal, warning]
      - [written, warning]
      - [suspension, termination]
      - [legal, referral]
      - [regulator, notification]

  - must_id: "item:A.6.4:decision_authority"
    description: "Decision authority named (HR + line management + Legal as appropriate; escalation to executive for senior personnel)"
    excerpt_keywords:
      - [decision, authority]
      - [hr, line, management]
      - [legal, review]
      - [escalation, executive]
      - [senior, personnel, decision]

  - must_id: "item:A.6.4:investigation_step"
    description: "Investigation step before action, with right of explanation (procedural fairness — drives employment-tribunal defensibility)"
    excerpt_keywords:
      - [investigation, step]
      - [right, explanation]
      - [procedural, fairness]
      - [disciplinary, process]
      - [employment, tribunal]
      - [investigation, before, action]

  - must_id: "item:A.6.4:violation_scope"
    description: "Scope of violations covered (policy breach, negligence, deliberate misuse, repeated non-compliance with awareness training, deliberate circumvention of security controls)"
    excerpt_keywords:
      - [policy, breach]
      - [deliberate, misuse]
      - [repeated, noncompliance]
      - [security, controls, circumvention]
      - [awareness, training, noncompliance]
      - [negligence, violation]

  - must_id: "item:A.6.4:formalised"
    description: "Formalised in writing with HR + Legal review (drives consistent application; ad-hoc disciplinary action is a fairness / employment-tribunal risk)"
    excerpt_keywords:
      - [disciplinary, process, written]
      - [hr, legal, review]
      - [formalised, disciplinary, action]
      - [consistent, application, disciplinary]
      - [employment, tribunal, risk]
      - [fairness, disciplinary, procedure]

