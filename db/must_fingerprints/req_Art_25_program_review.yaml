# Per-MUST fingerprint catalog for req:Art.25:program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.25:program_review"
target_control: "Art.25"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.25:rev_certification_validity"
    description: "If Art.25.3 certification used — certification still in validity period"
    excerpt_keywords:
      - [certification, validity, period]
      - [art25, certification, valid]
      - [certification, review, date]
      - [validity, certification, checked]
      - [certification, still, valid]

  - must_id: "item:Art.25:rev_defaults_currency"
    description: "Defaults register currency check (cross-leaf — defaults still match deployed system state)"
    excerpt_keywords:
      - [defaults, register]
      - [review, defaults]
      - [defaults, currency, check]
      - [system, state, match]
      - [reviewed, periodically]
      - [defaults, crossleaf, check]

  - must_id: "item:Art.25:rev_coverage"
    description: "Design-coverage check — every in-scope design activity had a DPbD review"
    excerpt_keywords:
      - [design, review]
      - [dataprotection, bydefault]
      - [dpbd, coverage]
      - [reviewed, design, activity]
      - [scope, design]
      - [dataprotection, bydesign]

  - must_id: "item:Art.25:rev_reviewer"
    description: "Reviewer identity (DPO + product + engineering)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, review]
      - [product, reviewer]
      - [engineering, review]
      - [reviewed, engineering]

  - must_id: "item:Art.25:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [reviewed, period]
      - [review, schedule]

