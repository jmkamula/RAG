# Per-MUST fingerprint catalog for req:Art.28:processor_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.28:processor_register"
target_control: "Art.28"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.28:reg_security_check"
    description: "Per-row Art.32-equivalent security assurance source (certification / audit report / questionnaire)"
    excerpt_keywords:
      - [security, assurance, source]
      - [processor, security, check]
      - [certification, audit, report]
      - [audit, questionnaire]
      - [art32, equivalent, security]

  - must_id: "item:Art.28:reg_subprocessors"
    description: "Per-row authorised sub-processor list (or 'none')"
    excerpt_keywords:
      - [authorised, subprocessor, list]
      - [per, processor, record]
      - [subprocessor, name, contact]
      - [processor, data, agreement]
      - [subprocessor, approval, date]

  - must_id: "item:Art.28:reg_dpa_version"
    description: "Per-row DPA version + execution date"
    excerpt_keywords:
      - [dpa, version]
      - [dpa, execution, date]
      - [processor, dpa, version]
      - [agreement, version, date]
      - [per, processor, dpa]
      - [execution, date, recorded]

  - must_id: "item:Art.28:reg_data_categories"
    description: "Per-row data categories processed (cross-link to Art.30 RoPA)"
    excerpt_keywords:
      - [data, categories]
      - [processing, categories]
      - [categories, recorded]
      - [categories, processed]
      - [categories, per, processor]

  - must_id: "item:Art.28:reg_processor_id"
    description: "Processor identifier per row (entity name, jurisdiction)"
    excerpt_keywords:
      - [processor, identifier]
      - [entity, name]
      - [processor, jurisdiction]
      - [per, processor, record]
      - [processor, registered, name]

