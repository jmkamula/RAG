# Per-MUST fingerprint catalog for req:A.7.3.1:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.3.1:applicable_scope"
target_control: "A.7.3.1"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.3.1:scope_exclusions"
    description: "Excluded jurisdictions / subjects with rationale"
    excerpt_keywords:
      - [excluded, jurisdictions]
      - [excluded, subjects]
      - [scope, exclusions]
      - [not, applicable]
      - [exclusion, criteria]
      - [jurisdictions, excluded, rationale]

  - must_id: "item:A.7.3.1:scope_subject_categories"
    description: "Subject categories per jurisdiction (customers / employees / minors / patients / etc.)"
    excerpt_keywords:
      - [subject, categories]
      - [applicable, jurisdictions]
      - [data, subjects]
      - [customers, employees]
      - [minors, patients]
      - [scope, includes]

  - must_id: "item:A.7.3.1:scope_jurisdictions"
    description: "Applicable jurisdictions listed with basis per row"
    excerpt_keywords:
      - [applicable, jurisdictions]
      - [jurisdiction, basis]
      - [listed, jurisdictions]
      - [scope, applicable]
      - [jurisdictions, per, row]

