# Per-MUST fingerprint catalog for req:A.5.26:incident_response_procedure
#
# Reviewed-from-skeleton 2026-06-14. The heaviest leaf in batch 3: 12 MUSTs
# covering distinct incident-response steps. v2 raw produced 95 false-
# positive proposals — generic "incident" vocabulary fanned out everywhere.
# Each MUST tightened with phase-specific anchors.

schema_version: 1
target_evidence_requirement: "req:A.5.26:incident_response_procedure"
target_control: "A.5.26"
target_standard: "ISO27001:2022"

