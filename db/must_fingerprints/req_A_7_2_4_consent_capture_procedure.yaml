schema_version: 1
target_evidence_requirement: "req:A.7.2.4:consent_capture_procedure"
target_control: "A.7.2.4"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.2.4:proc_unambiguous_test"
    description: "Unambiguous test — clear affirmative action, no pre-ticked boxes, no consent by silence"
    excerpt_keywords:
      - [clear, affirmative, consent]
      - [no, pre, ticked, boxes]
      - [consent, silence]
      - [unambiguous, consent, test]
      - [explicit, consent, given]

  - must_id: "item:A.7.2.4:proc_specific_test"
    description: "Specific test — one consent per purpose (or granular per-purpose selection)"
    excerpt_keywords:
      - [obtain, record, consent]
      - [consent, per, purpose]
      - [granular, consent, selection]
      - [consent, capture, procedure]
      - [recorded, consent, purpose]

  - must_id: "item:A.7.2.4:proc_freely_given_test"
    description: "Freely-given test — no detriment for refusal, no bundled coercion"
    excerpt_keywords:
      - [freely, given, consent]
      - [no, detriment, refusal]
      - [consent, without, coercion]
      - [consent, freely, provided]
      - [refusal, does, not, penalize]
      - [consent, obtained, voluntarily]

  - must_id: "item:A.7.2.4:proc_pre_consent_information"
    description: "Pre-consent information delivery per §7.3.3 (linked to A.7.3.3)"
    excerpt_keywords:
      - [preconsent, information, provided]
      - [consent, information, delivered]
      - [shall, provide, information]
      - [information, prior, consent]
      - [preconsent, details, explained]

  - must_id: "item:A.7.2.4:proc_demonstration_pathway"
    description: "Demonstration pathway — subject requests proof of consent, org retrieves record within stated SLA"
    excerpt_keywords:
      - [subject, proof, consent]
      - [retrieve, consent, record]
      - [consent, record, sla]
      - [request, consent, demonstrate]
      - [within, sla, retrieve]
      - [obtain, record, consent]

  - must_id: "item:A.7.2.4:proc_record_fields"
    description: "Per-consent record fields (subject identifier + timestamp + purposes consented to + artifact version consented to + collection mechanism)"
    excerpt_keywords:
      - [consent, record, fields]
      - [subject, identifier, record]
      - [timestamp, consent, record]
      - [purposes, consented, record]
      - [artifact, version, consented]
      - [collection, mechanism, consent]

