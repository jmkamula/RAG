# Per-MUST fingerprint catalog for req:Art.29:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.29:applicable_scope"
target_control: "Art.29"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.29:scope_subprocessor_boundary"
    description: "Sub-processor boundary — sub-processors are Art.28 territory not Art.29"
    excerpt_keywords:
      - [subprocessor, art28]
      - [processing, under, controller]
      - [processor, authority]
      - [scope, processing, controller]
      - [excluded, subprocessor, art29]

  - must_id: "item:Art.29:scope_processor_role"
    description: "Org-role classification — does the org act as processor for any customer (Art.29 binds the org's own staff in that capacity)?"
    excerpt_keywords:
      - [acts, processor]
      - [processor, role]
      - [under, authority]
      - [processing, behalf]
      - [customer, data, processor]
      - [org, processor, staff]

  - must_id: "item:Art.29:scope_personnel_categories"
    description: "Personnel categories in scope (employees + contractors + embedded third-party staff)"
    excerpt_keywords:
      - [personnel, categories]
      - [employees, contractors]
      - [thirdparty, staff]
      - [scope]
      - [applies, personnel]

