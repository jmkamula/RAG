# Per-MUST fingerprint catalog for req:A.5.29:continuity_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.5.29:continuity_program_review"
target_control: "A.5.29"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.29:rev_actions"
    description: "Action items captured (e.g"
    excerpt_keywords:
      - [action, items, captured]
      - [review, action, items]
      - [update, communication, paths]
      - [expand, test, scope]
      - [retire, stale, fallback]
      - [add, scenario]

  - must_id: "item:A.5.29:rev_real_divergence"
    description: "Real-disruption divergence analysis (where actual disruptions diverged from the plan — what was missing? what assumed? what proved unnecessary?)"
    excerpt_keywords:
      - [real, disruption, analysis]
      - [divergence, plan]
      - [disruption, event, review]
      - [lessons, learned]
      - [plan, assumptions, validated]
      - [disruption, response, evaluation]

  - must_id: "item:A.5.29:rev_fallback_validity"
    description: "Fallback-validity check (sample of fallbacks re-validated: would they actually work? are dependencies still in place? are owners still in role?)"
    excerpt_keywords:
      - [fallback, validity, check]
      - [sample, fallbacks, revalidated]
      - [dependencies, still, in place]
      - [owners, still, role]
      - [periodic, continuity, review]
      - [fallback, revalidation, process]

  - must_id: "item:A.5.29:rev_test_results"
    description: "Test-result analysis (last N tests reviewed; gaps surfaced; remediation per gap; ratio of scenarios tested vs total)"
    excerpt_keywords:
      - [test, results, analysis]
      - [reviewed, test, scenarios]
      - [gaps, remediation]
      - [ratio, scenarios, tested]
      - [periodic, continuity, review]

  - must_id: "item:A.5.29:rev_scenario_currency"
    description: "Scenario-currency audit (each scenario in the register re-validated: still plausible? still relevant? new scenarios that should be added?)"
    excerpt_keywords:
      - [scenario, review]
      - [periodic, scenario, validation]
      - [scenario, currency, audit]
      - [reviewed, scenarios, register]
      - [scenario, revalidated, plausible]

  - must_id: "item:A.5.29:rev_reviewer"
    description: "Reviewer identity (CISO + BCP-program owner + Legal where regulatory comms scope; supplier-management lead where supplier-dep scenarios in scope)"
    excerpt_keywords:
      - [reviewer, identity]
      - [ciso, reviewer]
      - [bcpprogram, owner]
      - [legal, reviewer]
      - [suppliermanagement, lead]

  - must_id: "item:A.5.29:rev_date"
    description: "Review date within the planned 180-day interval"
    excerpt_keywords:
      - [review, date]
      - [periodic, review]
      - [review, interval]
      - [review, planned, date]
      - [review, within, days]
      - [review, 180, days]

