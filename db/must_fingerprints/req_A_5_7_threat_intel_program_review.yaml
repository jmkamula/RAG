schema_version: 1
target_evidence_requirement: "req:A.5.7:threat_intel_program_review"
target_control: "A.5.7"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.7:rev_actions"
    description: "Action items captured for the program (e.g"
    excerpt_keywords:
      - [action, items, captured]
      - [program, review, actions]
      - [threat, intelligence, actions]
      - [review, action, items]
      - [update, threat, feeds]
      - [analysis, cadence, tune]

  - must_id: "item:A.5.7:rev_missed"
    description: "Missed-event analysis (events surfaced by A.5.25 triage or A.5.27 lessons that intel didn't flag in advance)"
    excerpt_keywords:
      - [missed, event, analysis]
      - [threat, intelligence, review]
      - [event, triage, analysis]
      - [lessons, learned, review]
      - [periodic, threat, review]

  - must_id: "item:A.5.7:rev_consumer_feedback"
    description: "Consumer feedback collected from named consumers (sec ops, A.5.21 supplier risk, A.5.25 detection, exec briefing)"
    excerpt_keywords:
      - [consumer, feedback]
      - [periodic, review]
      - [threat, intelligence]
      - [security, operations]
      - [supplier, risk]
      - [executive, briefing]

  - must_id: "item:A.5.7:rev_products_delivered"
    description: "Products delivered count and distribution evidenced (proves the program ran, not just the procedure existed)"
    excerpt_keywords:
      - [products, delivered]
      - [threat, intelligence, products]
      - [program, review]
      - [delivery, count]
      - [evidenced, distribution]
      - [periodic, review]

  - must_id: "item:A.5.7:rev_feed_value"
    description: "Feed-value analysis per source (which feeds delivered actionable IOCs / advisories; which were dropped)"
    excerpt_keywords:
      - [feed, value, analysis]
      - [threat, intelligence, feed]
      - [actionable, ioc]
      - [feed, source, review]
      - [periodic, review, feed]
      - [dropped, feed, assessment]

  - must_id: "item:A.5.7:rev_reviewer"
    description: "Reviewer identity (program owner + InfoSec lead jointly)"
    excerpt_keywords:
      - [program, owner]
      - [information, security, lead]
      - [reviewer, identity]
      - [jointly, responsible]
      - [review, owner]
      - [review, lead]

  - must_id: "item:A.5.7:rev_date"
    description: "Review date within the planned 180-day interval"
    excerpt_keywords:
      - [review, date]
      - [periodic, review]
      - [planned, interval]
      - [review, within, interval]
      - [review, scheduled]
      - [review, 180, days]

