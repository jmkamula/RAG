schema_version: 1
target_evidence_requirement: "req:Art.19:notification_program_review"
target_control: "Art.19"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.19:rev_exception_validity"
    description: "Exception validity sample — claimed impossibility/disproportionality grounds still hold"
    excerpt_keywords:
      - [exception, validity]
      - [impossibility, grounds]
      - [disproportionality, grounds]
      - [review, exception]
      - [exception, still, hold]
      - [exception, validity, review]

  - must_id: "item:Art.19:rev_event_coverage"
    description: "Event coverage check — every Art.16/17/18 event has a register row OR documented exception"
    excerpt_keywords:
      - [event, coverage]
      - [register, row]
      - [documented, exception]
      - [art16, event]
      - [art17, event]
      - [art18, event]

  - must_id: "item:Art.19:rev_reviewer"
    description: "Reviewer identity (DPO)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, reviewer]
      - [review, conducted]
      - [review, performed, dpo]
      - [data, protection, officer]
      - [review, responsible, person]

  - must_id: "item:Art.19:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

