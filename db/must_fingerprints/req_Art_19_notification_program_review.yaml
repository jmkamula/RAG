# Per-MUST fingerprint catalog for req:Art.19:notification_program_review
#
# Reviewed-from-skeleton 2026-06-14. GDPR Art.19 program review.

schema_version: 1
target_evidence_requirement: "req:Art.19:notification_program_review"
target_control: "Art.19"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.19:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [art, 19, program, review, date]
      - [art, 19, reviewed, on]

  - must_id: "item:Art.19:rev_reviewer"
    description: "Reviewer identity (DPO)"
    excerpt_keywords:
      - [art, 19, reviewed, by, dpo]
      - [art, 19, dpo, review]

  - must_id: "item:Art.19:rev_event_coverage"
    description: "Event coverage check"
    excerpt_keywords:
      - [art, 19, event, coverage, audit]
      - [art, 16, 17, 18, event, register, row]

  - must_id: "item:Art.19:rev_exception_validity"
    description: "Exception validity sample"
    excerpt_keywords:
      - [art, 19, exception, validity]
      - [art, 19, impossibility, still, holds]
      - [art, 19, disproportionality, still, holds]
