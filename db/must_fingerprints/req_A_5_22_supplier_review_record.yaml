      - [scope, of, supplier, review]
      - [supplier, security, practices, reviewed]
      - [changes, since, last, supplier, review]

  - must_id: "item:A.5.22:rev_performance"
    description: "Service performance monitored against agreement"
    excerpt_keywords:
      - [supplier, sla, performance]
      - [service, performance, vs, agreement]
      - [supplier, sla, breach]
      - [supplier, performance, measured]

  - must_id: "item:A.5.22:rev_incidents"
    description: "Information exchanged about InfoSec incidents"
    excerpt_keywords:
      - [supplier, incident, review]
      - [joint, incident, review, supplier]
      - [supplier, infosec, incidents]
      - [incident, information, exchanged, supplier]

  - must_id: "item:A.5.22:rev_problems"
    description: "Identified problems / incidents managed through to resolution"
