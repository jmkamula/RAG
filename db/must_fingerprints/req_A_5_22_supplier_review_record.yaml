# Per-MUST fingerprint catalog for req:A.5.22:supplier_review_record
#
# Reviewed-from-skeleton 2026-06-14. Per-supplier review record (12 MUSTs).

schema_version: 1
target_evidence_requirement: "req:A.5.22:supplier_review_record"
target_control: "A.5.22"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.22:rev_scope"
    description: "Scope of review (security practices, service delivery, changes since last review)"
