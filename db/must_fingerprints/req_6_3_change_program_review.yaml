# Per-MUST fingerprint catalog for req:6.3:change_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:6.3:change_program_review"
target_control: "6.3"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:6.3:rev_boundary_check"
    description: "A.8.32 boundary check — no technical changes mis-routed to 6.3, no ISMS changes mis-routed to A.8.32"
    excerpt_keywords:
      - [boundary, check]
      - [technical, changes, misrouted]
      - [isms, changes, misrouted]
      - [change, program, review]
      - [review, boundary]
      - [misrouted, changes]

  - must_id: "item:6.3:rev_silent_changes"
    description: "Silent-change sweep — verify no scope / policy / roles changes happened without a register entry"
    excerpt_keywords:
      - [silent change, register entry]
      - [scope change, register]
      - [policy change, register]
      - [roles change, register]
      - [change review, no undocumented]
      - [reviewed, change register]

  - must_id: "item:6.3:rev_register_currency"
    description: "Register currency check — every approved change reached implementation OR was withdrawn"
    excerpt_keywords:
      - [register, currency]
      - [approved, change, implementation]
      - [change, reached, implementation]
      - [change, withdrawn]
      - [currency, check]
      - [approved, change, status]

  - must_id: "item:6.3:rev_reviewer"
    description: "Reviewer identity (ISMS Manager + change-management lead)"
    excerpt_keywords:
      - [reviewer, identity]
      - [isms, manager]
      - [change management, lead]
      - [reviewed]
      - [review, responsible]
      - [review, leadership]

  - must_id: "item:6.3:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

