    description: "Findings propagated to policy / scope"
    excerpt_keywords:
      - [findings, policy]
      - [findings, scope]
      - [review, findings]
      - [policy, updated]
      - [scope, updated]

  - must_id: "item:A.8.23:rev_override_trending"
    description: "Override-volume trending (spikes may indicate category over-blocking or coverage gap)"
