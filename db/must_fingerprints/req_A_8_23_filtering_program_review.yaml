      - [coverage, gap, monitor]
      - [reviewed, periodically, override]

  - must_id: "item:A.8.23:rev_category_currency"
    description: "Category-list currency check (new malicious-content categories added; obsolete categories retired)"
    excerpt_keywords:
      - [category list, currency check]
      - [web filtering, periodic review]
      - [malicious content, category update]
      - [obsolete categories, retired]
      - [review, category currency]
      - [filtering program, category changes]

  - must_id: "item:A.8.23:rev_reviewer"
    description: "Reviewer identity (Security Operations + Legal/HR for category boundaries)"
    excerpt_keywords:
