# Per-MUST fingerprint catalog for req:Art.30:data_flow_inventory
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.30:data_flow_inventory"
target_control: "Art.30"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.30:dfi_retention"
    description: "Retention period per system or per data category — feeds Art.30.1.f"
    excerpt_keywords:
      - [retention, period]
      - [data, category, retention]
      - [system, retention, period]
      - [processing, activity, retention]
      - [records, processing, retention]
      - [retention, per, system]

  - must_id: "item:Art.30:dfi_transfers"
    description: "Third-country transfers identified per flow with safeguards (SCCs, adequacy, BCRs) — feeds Art.30.1.e"
    excerpt_keywords:
      - [thirdcountry, transfer]
      - [transfer, safeguard]
      - [standard, contractual, clauses]
      - [adequacy, decision]
      - [binding, corporate, rules]
      - [processing, activity, record]

  - must_id: "item:Art.30:dfi_recipients"
    description: "External recipients identified per flow (processors, joint controllers, third parties) — feeds Art.30.1.d"
    excerpt_keywords:
      - [external, recipients]
      - [processing, activities, recipients]
      - [third, party, recipients]
      - [processors, joint, controllers]
      - [data, flow, recipients]
      - [art30, recipients]

  - must_id: "item:Art.30:dfi_flows"
    description: "Data flows between systems documented (sources, destinations, integration mechanism)"
    excerpt_keywords:
      - [data, flow, documented]
      - [source, destination, flow]
      - [integration, mechanism, flow]
      - [processing, activity, record]
      - [flow, between, systems]

  - must_id: "item:Art.30:dfi_systems"
    description: "Systems holding personal data enumerated (production systems, SaaS, backups, analytics, archives)"
    excerpt_keywords:
      - [personal, data, systems]
      - [production, systems, personal]
      - [saas, systems, data]
      - [backup, systems, personal]
      - [analytics, systems, data]
      - [archives, systems, personal]

