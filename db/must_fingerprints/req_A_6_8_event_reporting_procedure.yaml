schema_version: 1
target_evidence_requirement: "req:A.6.8:event_reporting_procedure"
target_control: "A.6.8"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.8:owner"
    description: "Named owner of the procedure (typically InfoSec on-call with HR + Legal partners for sensitive cases)"
    excerpt_keywords:
      - [named, owner]
      - [procedure, owner]
      - [information, security, owner]
      - [responsible, person]
      - [incident, response, owner]
      - [security, event, owner]

  - must_id: "item:A.6.8:handoff_to_triage"
    description: "Handoff to triage process (A.5.25 assessment-and-decision) on receipt — drives traceability from report through to closure"
    excerpt_keywords:
      - [handoff, triage]
      - [event, reporting, handoff]
      - [traceability, report, closure]
      - [receipt, handoff, process]
      - [assessment, decision, handoff]

  - must_id: "item:A.6.8:no_blame"
    description: "No-blame / non-retaliation statement encourages honest reporting (drives reporting culture; under-reporting is the #1 risk for incident programs)"
    excerpt_keywords:
      - [no blame, reporting culture]
      - [non retaliation, incident reporting]
      - [encourages honest, security event]
      - [under reporting, risk]
      - [no blame, incident program]

  - must_id: "item:A.6.8:timeliness"
    description: "Timeliness expectation (e.g"
    excerpt_keywords:
      - [asap, reporting]
      - [within, hours, awareness]
      - [timely, incident, report]
      - [immediate, notification]
      - [active, attack, indicators]

  - must_id: "item:A.6.8:what_to_report"
    description: "What to report — observed events, suspected events, near-misses (no judgement required at reporting stage; over-reporting is preferred to under-reporting)"
    excerpt_keywords:
      - [information, security, event]
      - [suspected, security, event]
      - [near, miss, event]
      - [observed, security, incident]
      - [event, reporting, procedure]
      - [security, incident, report]

  - must_id: "item:A.6.8:audience"
    description: "Procedure addresses all personnel (employees, contractors, third parties with access)"
    excerpt_keywords:
      - [all, personnel]
      - [employees, contractors]
      - [third, parties, access]
      - [applicable, staff]
      - [includes, contractors]
      - [personnel, responsible, reporting]

  - must_id: "item:A.6.8:channels"
    description: "Multiple reporting channels offered (email, hotline, portal, manager, ticket system) — drives discoverability and accessibility under various conditions including when normal tooling is unavailable"
    excerpt_keywords:
      - [reporting, channels]
      - [email, hotline]
      - [ticket, system]
      - [report, manager]
      - [reporting, portal]
      - [accessible, under, conditions]

