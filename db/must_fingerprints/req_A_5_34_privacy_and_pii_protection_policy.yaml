  - must_id: "item:A.5.34:owner"
    description: "Named owner of the privacy program (DPO / Privacy Officer)"
    excerpt_keywords:
      - [dpo, designated]
      - [data, protection, officer]
      - [privacy, officer, named]
      - [privacy, program, owner]
      - [chief, privacy, officer]
