# Per-MUST fingerprint catalog for req:A.5.34:privacy_and_pii_protection_policy
#
# Reviewed-from-skeleton 2026-06-14. Policy-leaf patterns can be more
# permissive — policy documents legitimately describe these elements.
# But several MUSTs cross-reference specific articles/controls; lean
# on those refs for stronger anchors.

schema_version: 1
target_evidence_requirement: "req:A.5.34:privacy_and_pii_protection_policy"
target_control: "A.5.34"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.34:applicable_laws"
    description: "Applicable privacy laws identified"
    excerpt_keywords:
      - [gdpr]
      - [uk, gdpr]
      - [hipaa]
      - [ccpa]
      - [lgpd]
      - [pipeda]
      - [applicable, privacy, laws]

  - must_id: "item:A.5.34:lawful_basis"
    description: "Lawful basis discipline"
    excerpt_keywords:
      - [lawful, basis, identified]
      - [legal, basis, processing]
      - [consent, contract, legal, obligation]
      - [vital, interests]
      - [public, task]
      - [legitimate, interests]

  - must_id: "item:A.5.34:data_subject_rights"
    description: "Data subject rights enabled"
    excerpt_keywords:
      - [data, subject, rights]
      - [access, rectification, erasure]
      - [portability, restriction, objection]
      - [dsar, intake]
      - [response, sla]
      - [subject, access, request]

  - must_id: "item:A.5.34:retention_minimisation"
    description: "Retention and data minimisation requirements"
    excerpt_keywords:
      - [data, minimisation]
      - [data, minimization]
      - [retain, only, as, long, as]
      - [collect, only, what, necessary]
      - ["A.5.33"]
      - [retention, minimisation]

  - must_id: "item:A.5.34:security_controls_ref"
    description: "References security controls applied to PII"
    excerpt_keywords:
