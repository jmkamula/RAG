      - ["A.5.15"]
      - ["A.8.3"]
      - [encryption, pii]
      - [pii, access, control]
      - [pii, security, controls]

  - must_id: "item:A.5.34:breach_handling"
    description: "Breach handling reference (A.5.24/A.5.26 + GDPR Art.33/34)"
    excerpt_keywords:
      - ["A.5.24"]
      - ["A.5.26"]
      - ["Art.33"]
      - ["Art.34"]
      - [72, hour, notification]
      - [supervisory, authority, notification]
      - [breach, notification]

  - must_id: "item:A.5.34:transfer_restrictions"
    description: "Cross-border transfer discipline"
    excerpt_keywords:
