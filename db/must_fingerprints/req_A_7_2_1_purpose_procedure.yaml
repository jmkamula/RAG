# Per-MUST fingerprint catalog for req:A.7.2.1:purpose_procedure
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.2.1:purpose_procedure"
target_control: "A.7.2.1"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.2.1:proc_downstream_notice"
    description: "Downstream notice — purpose changes propagate to notice + consent + RoPA + PIA"
    excerpt_keywords:
      - [downstream, notice]
      - [purpose, changes, propagate]
      - [notify, consent]
      - [update, ropa]
      - [pia, assessment]
      - [communicate, purpose, change]

  - must_id: "item:A.7.2.1:proc_change_control"
    description: "Change-control — extending or changing a purpose requires re-review + potentially new consent (§7.2.2)"
    excerpt_keywords:
      - [change, control]
      - [extend, purpose]
      - [change, purpose]
      - [re, review]
      - [new, consent]
      - [consent, required]

  - must_id: "item:A.7.2.1:proc_review_signoff"
    description: "Review + signoff step (DPO + legal counsel) before purpose enters production register"
    excerpt_keywords:
      - [review, signoff]
      - [dpo, legal, counsel]
      - [purpose, production, register]
      - [signoff, before, register]
      - [reviewed, dpo]

  - must_id: "item:A.7.2.1:proc_specificity_test"
    description: "Specificity test — purpose statements must be sufficiently clear + detailed for use in §7.3.2 notice + §7.2.3 consent"
    excerpt_keywords:
      - [purpose, statement]
      - [sufficiently, clear]
      - [detailed, purpose]
      - [document, purpose]
      - [purpose, identification]
      - [used, consent]

  - must_id: "item:A.7.2.1:proc_documentation_fields"
    description: "Documentation fields per purpose (purpose text, categories of PII, categories of subjects, retention, recipients, legal basis link)"
    excerpt_keywords:
      - [document, purpose, fields]
      - [purpose, categories, pii]
      - [categories, subjects, retention]
      - [legal, basis, link]
      - [recipients, documented]
      - [purpose, identification, procedure]

  - must_id: "item:A.7.2.1:proc_intake_trigger"
    description: "Intake triggers listed (new product launch, new processing activity, new data source, new integration)"
    excerpt_keywords:
      - [intake, trigger]
      - [new, product, launch]
      - [new, processing, activity]
      - [new, data, source]
      - [new, integration]

