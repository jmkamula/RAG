# Per-MUST fingerprint catalog for req:A.5.20:supplier_agreement_security_template
#
# Reviewed-from-skeleton 2026-06-14. Contract template clause patterns —
# 14 MUSTs covering distinct contractual elements. Each MUST has tight
# vocabulary specific to that clause type to avoid generic policy text
# matching multiple MUSTs (the v2 fan-out problem with 26 false-positive
# proposals on a single DPA-related policy clause).

schema_version: 1
target_evidence_requirement: "req:A.5.20:supplier_agreement_security_template"
target_control: "A.5.20"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.20:minimum_requirements"
    description: "Minimum security requirements (controls baseline, certifications expected)"
    excerpt_keywords:
