# Per-MUST fingerprint catalog for req:Art.24:privacy_programme_charter
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.24:privacy_programme_charter"
target_control: "Art.24"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.24:charter_review_cadence"
    description: "Review cadence stated (annual minimum)"
    excerpt_keywords:
      - [review, cadence]
      - [annual, review]
      - [review, frequency]
      - [minimum, annual]
      - [charter, review]
      - [review, periodicity]

  - must_id: "item:Art.24:charter_approval"
    description: "Approved by top management with date"
    excerpt_keywords:
      - [approved, top management]
      - [management, approval, date]
      - [charter, approved, date]
      - [signed, management]
      - [approval, date, record]

  - must_id: "item:Art.24:charter_owner"
    description: "Named programme owner (typically DPO or Chief Privacy Officer)"
    excerpt_keywords:
      - [programme, owner]
      - [named, privacy, officer]
      - [data, protection, officer]
      - [chief, privacy, officer]
      - [privacy, programme, charter]
      - [responsibility, controller]

  - must_id: "item:Art.24:charter_governance"
    description: "Governance forum cadence (privacy steering committee, frequency, attendees)"
    excerpt_keywords:
      - [privacy, steering, committee]
      - [governance, forum, cadence]
      - [meeting, frequency, attendees]
      - [steering, committee, meetings]
      - [governance, meeting, schedule]

  - must_id: "item:Art.24:charter_scope"
    description: "Scope of the privacy programme (which legal entities, processing activities, geographies)"
    excerpt_keywords:
      - [scope, privacy, programme]
      - [applies, legal, entities]
      - [processing, activities, covered]
      - [geographical, scope]
      - [within, scope, privacy]
      - [privacy, programme, coverage]

  - must_id: "item:Art.24:charter_purpose"
    description: "Statement of GDPR compliance objective + accountability commitment"
    excerpt_keywords:
      - [gdpr, compliance, objective]
      - [accountability, commitment]
      - [privacy, programme, charter]
      - [controller, responsibility]
      - [data, protection, commitment]

