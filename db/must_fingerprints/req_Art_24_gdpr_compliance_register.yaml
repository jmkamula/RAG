schema_version: 1
target_evidence_requirement: "req:Art.24:gdpr_compliance_register"
target_control: "Art.24"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.24:reg_last_assessed"
    description: "Per-row last-assessed date (drives staleness)"
    excerpt_keywords:
      - [last, assessed, date]
      - [assessment, date, record]
      - [date, last, reviewed]
      - [compliance, last, assessed]
      - [record, last, assessment]

  - must_id: "item:Art.24:reg_owner"
    description: "Per-row owner"
    excerpt_keywords:
      - [data, controller, owner]
      - [record, owner, identified]
      - [processing, activity, owner]
      - [controller, responsible, person]
      - [owner, contact, details]

  - must_id: "item:Art.24:reg_status"
    description: "Per-row implementation status (implemented / partial / planned / N/A)"
    excerpt_keywords:
      - [implementation, status]
      - [status, per, row]
      - [compliance, status]
      - [planned, implemented]
      - [partial, status]

  - must_id: "item:Art.24:reg_implementing_artefact"
    description: "Per-row link to the implementing artefact (procedure / policy / register / DPA / certification)"
    excerpt_keywords:
      - [implementing, artefact]
      - [linked, procedure]
      - [policy, reference]
      - [data, processing, agreement]
      - [certification, document]
      - [compliance, register]

  - must_id: "item:Art.24:reg_applicability"
    description: "Per-row applicability assessment (in scope / N/A with reason)"
    excerpt_keywords:
      - [applicability, assessment]
      - [scope]
      - [not, applicable, reason]
      - [scope, determination]
      - [processing, activities, scope]

  - must_id: "item:Art.24:reg_article_id"
    description: "Per-row GDPR article identifier"
    excerpt_keywords:
      - [gdpr, article, id]
      - [article, identifier]
      - [regulation, article, number]
      - [processing, record, article]
      - [compliance, article, reference]

