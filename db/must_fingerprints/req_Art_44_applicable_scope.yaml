# Per-MUST fingerprint catalog for req:Art.44:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.44:applicable_scope"
target_control: "Art.44"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.44:scope_excluded_flows"
    description: "Excluded flows (purely-internal within EU/EEA; transit-only; non-personal data)"
    excerpt_keywords:
      - [excluded, flows]
      - [purelyinternal, within, eueea]
      - [transitonly, data]
      - [nonpersonal, data]
      - [excluded, scope]
      - [internal, transfer, excluded]

  - must_id: "item:Art.44:scope_eu_eea"
    description: "EU/EEA boundary — which destinations are within / outside the GDPR territorial scope"
    excerpt_keywords:
      - [applies, eea]
      - [within, gdpr, scope]
      - [outside, eu, territory]
      - [transfer, third]
      - [scope, gdpr]
      - [eu, eea, boundary]

  - must_id: "item:Art.44:scope_transfer_definition"
    description: "Operational definition of 'transfer' per EDPB 05/2021 three cumulative criteria"
    excerpt_keywords:
      - [transfer, definition]
      - [edpb, criteria]
      - [cumulative, criteria]
      - [operational, definition]
      - [personal, data, transfer]
      - [crossborder, transfer]

