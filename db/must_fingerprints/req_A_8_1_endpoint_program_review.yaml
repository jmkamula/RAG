# Per-MUST fingerprint catalog for req:A.8.1:endpoint_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.8.1:endpoint_program_review"
target_control: "A.8.1"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.8.1:rev_register_update"
    description: "Changes propagated to the policy / register"
    excerpt_keywords:
      - [periodic, review]
      - [policy, updated]
      - [register, updated]
      - [review, date]
      - [changes, propagated]
      - [update, register]

  - must_id: "item:A.8.1:rev_scope_check"
    description: "Cross-check against the applicable scope — any new class or vendor missing"
    excerpt_keywords:
      - [scope, applicable]
      - [crosscheck, scope]
      - [new, vendor, missing]
      - [scope, check]
      - [periodic, review, scope]

  - must_id: "item:A.8.1:rev_compliance_sample"
    description: "Sample-based compliance verification across the register (encryption / patching / EDR coverage)"
    excerpt_keywords:
      - [sample based, compliance verification]
      - [endpoint device, compliance review]
      - [encryption status, patching level]
      - [edr coverage, sample audit]
      - [periodic review, compliance sample]
      - [register record, verification sample]

  - must_id: "item:A.8.1:rev_reviewer"
    description: "Reviewer identity (IT lead + InfoSec lead jointly)"
    excerpt_keywords:
      - [reviewer, identity]
      - [it, lead, review]
      - [infosec, lead, review]
      - [joint, review]
      - [reviewed, lead]

  - must_id: "item:A.8.1:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [periodic, review]
      - [review, scheduled]
      - [next, review]
      - [review, within, interval]

