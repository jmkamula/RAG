# Per-MUST fingerprint catalog for req:4.1:context_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:4.1:context_program_review"
target_control: "4.1"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:4.1:rev_scope_check"
    description: "Cross-check against the applicable-domains scope — any new domain that should be covered"
    excerpt_keywords:
      - [scope, applicable, domains]
      - [crosscheck, scope]
      - [new, domain, covered]
      - [scope, review, date]
      - [review, scope, coverage]

  - must_id: "item:4.1:rev_risk_handoff"
    description: "Confirmation that handoff to 6.1.2 risk assessment occurred for material issues"
    excerpt_keywords:
      - [handoff, risk, assessment]
      - [risk, assessment, 6.1.2]
      - [confirmation, handoff]
      - [material, issues, handoff]
      - [reviewed, risk, handoff]

  - must_id: "item:4.1:rev_register_currency"
    description: "Register currency check — every row reviewed for continued relevance, new issues added"
    excerpt_keywords:
      - [register, currency]
      - [row, reviewed]
      - [continued, relevance]
      - [new, issues, added]
      - [review, date]
      - [reviewed, periodically]

  - must_id: "item:4.1:rev_reviewer"
    description: "Reviewer identity (ISMS Manager + executive sponsor)"
    excerpt_keywords:
      - [reviewer, identity]
      - [isms, manager]
      - [executive, sponsor]
      - [review, conducted]
      - [review, manager]
      - [review, team, members]

  - must_id: "item:4.1:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [scheduled, review, date]

