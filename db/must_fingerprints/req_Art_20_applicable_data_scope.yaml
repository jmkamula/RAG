# Per-MUST fingerprint catalog for req:Art.20:applicable_data_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.20:applicable_data_scope"
target_control: "Art.20"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.20:scope_exclusions"
    description: "Out-of-scope activities (basis legal obligation / vital interests / public task / legitimate interests; manual processing)"
    excerpt_keywords:
      - [outofscope, activities]
      - [legal, obligation]
      - [vital, interests]
      - [public, task]
      - [legitimate, interests]
      - [manual, processing]

  - must_id: "item:Art.20:scope_data_categorisation"
    description: "Categorisation rules — what counts as 'provided by' the subject vs derived/observed (EDPB Guidelines WP242 reference)"
    excerpt_keywords:
      - [provided, data, subject]
      - [derived, data, categories]
      - [observed, data, scope]
      - [data, categorisation, rules]
      - [edpb, guidelines, wp242]
      - [portable, data, scope]

  - must_id: "item:Art.20:scope_in_scope_activities"
    description: "Art.30 RoPA activities in scope (basis consent / contract AND automated)"
    excerpt_keywords:
      - [activities, scope]
      - [processing, based, consent]
      - [processing, based, contract]
      - [automated, processing]
      - [scope, includes, activities]
      - [scope, processing]

