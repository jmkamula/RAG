schema_version: 1
target_evidence_requirement: "req:Art.23:restrictions_program_review"
target_control: "Art.23"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.23:rev_subject_notice_compliance"
    description: "Subject-notice compliance — where Art.23.2.h applies, notice was delivered"
    excerpt_keywords:
      - [subject notice, compliance]
      - [notice, delivered]
      - [art23, subject notice]
      - [review, subject notice]
      - [compliance, reviewed]
      - [notice, review date]

  - must_id: "item:Art.23:rev_invocation_audit"
    description: "Invocation audit — sampled register rows reviewed for proportionality and Art.23.2 safeguard compliance"
    excerpt_keywords:
      - [invocation, audit]
      - [sampled, register, rows]
      - [reviewed, proportionality]
      - [art23, safeguard, compliance]
      - [audit, review, date]
      - [review, cadence]

  - must_id: "item:Art.23:rev_law_currency"
    description: "Law currency — every cited MS law still in force; any new restricting law surfaced"
    excerpt_keywords:
      - [law, currency]
      - [cited, law, inforce]
      - [restricting, law, surfaced]
      - [review, law, currency]
      - [law, still, inforce]
      - [new, restricting, law]

  - must_id: "item:Art.23:rev_reviewer"
    description: "Reviewer identity (DPO + legal counsel)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, review]
      - [legal, counsel]
      - [reviewed, dpo]
      - [reviewed, legal]
      - [review, conducted]

  - must_id: "item:Art.23:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [review, within, interval]
      - [next, review]
      - [reviewed, period]
      - [review, schedule]

