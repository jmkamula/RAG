# Per-MUST fingerprint catalog for req:Art.30:ropa_annual_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.30:ropa_annual_review"
target_control: "Art.30"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.30:rev_gaps"
    description: "Gaps identified (missing activity, outdated retention, undocumented transfer) with remediation owner and target date"
    excerpt_keywords:
      - [gaps, identified]
      - [missing, activity]
      - [outdated, retention]
      - [undocumented, transfer]
      - [remediation, owner]
      - [target, date]

  - must_id: "item:Art.30:rev_register_update"
    description: "Changes propagated back to the live register with reference to this review"
    excerpt_keywords:
      - [changes, propagated]
      - [review, reference]
      - [register, update]
      - [live, register]
      - [periodic, review]
      - [review, record]

  - must_id: "item:Art.30:rev_outcome"
    description: "Per-activity outcome (no change / amended / retired) recorded"
    excerpt_keywords:
      - [periodic, review, outcome]
      - [reviewed, activity, record]
      - [processing, activity, status]
      - [no, change, recorded]
      - [amended, record, entry]
      - [retired, processing, activity]

  - must_id: "item:Art.30:rev_reviewer"
    description: "Reviewer identity and role (DPO, privacy lead, or delegated equivalent)"
    excerpt_keywords:
      - [reviewer, identity]
      - [review, performed]
      - [privacy, lead]
      - [data, protection, officer]
      - [reviewer, role]
      - [delegated, equivalent]

  - must_id: "item:Art.30:rev_date"
    description: "Review date within the planned interval (typically within 12 months of last review)"
    excerpt_keywords:
      - [review, date]
      - [next, review]
      - [reviewed, annually]
      - [review, interval]
      - [last, review]
      - [planned, review]

