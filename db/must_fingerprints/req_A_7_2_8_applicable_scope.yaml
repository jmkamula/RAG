# Per-MUST fingerprint catalog for req:A.7.2.8:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.2.8:applicable_scope"
target_control: "A.7.2.8"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.2.8:scope_exclusions"
    description: "Exclusions — anonymous / aggregate processing not in RoPA with rationale"
    excerpt_keywords:
      - [anonymous, processing]
      - [aggregate, data]
      - [excluded, ropa]
      - [not, ropa]
      - [processing, excluded]
      - [exclusions, rationale]

  - must_id: "item:A.7.2.8:scope_coverage_test"
    description: "Coverage test — RoPA rowcount reconciles against A.7.2.1 purpose register + system inventory"
    excerpt_keywords:
      - [ropa, coverage]
      - [purpose, register]
      - [system, inventory]
      - [rowcount, reconciles]
      - [processing, pii]
      - [coverage, test]

  - must_id: "item:A.7.2.8:scope_covered_activities"
    description: "Covered activities enumerated (all processing activities the org performs)"
    excerpt_keywords:
      - [covered, activities]
      - [processing, activities]
      - [activities, performed]
      - [scope, includes]
      - [processing, scope]
      - [activities, enumerated]

