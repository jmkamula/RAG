      - [consent, withdrawal, cascade]
      - [notify, third, parties]
      - [update, authorised, users]
      - [propagation, systems]
      - [consent, modification, propagate]

  - must_id: "item:A.7.3.4:proc_response_sla"
    description: "Response-time SLA stated + honoured"
