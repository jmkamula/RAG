# Per-MUST fingerprint catalog for req:A.7.2.5:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.2.5:applicable_scope"
target_control: "A.7.2.5"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.2.5:scope_exclusions"
    description: "Out-of-scope processing (low-risk / legacy) with rationale"
    excerpt_keywords:
      - [outofscope, processing]
      - [lowrisk, processing]
      - [legacy, processing]
      - [processing, excluded]
      - [processing, not, applicable]
      - [processing, scope, exclusion]

  - must_id: "item:A.7.2.5:scope_org_indicators"
    description: "Org-specific high-risk indicators (novel tech / vulnerable subjects / large-scale)"
    excerpt_keywords:
      - [highrisk, indicators]
      - [novel, technology]
      - [vulnerable, subjects]
      - [largescale, processing]
      - [privacy, impact, assessment]
      - [applicable, pia, triggers]

  - must_id: "item:A.7.2.5:scope_sa_lists"
    description: "SA-published mandatory-DPIA lists per applicable jurisdiction (Art.35.4)"
    excerpt_keywords:
      - [applicable, jurisdiction]
      - [mandatory, dpia, lists]
      - [published, sa]
      - [art35, dpi]
      - [dpi, assessment, lists]

  - must_id: "item:A.7.2.5:scope_art35_3_mandatory"
    description: "Art.35.3 mandatory categories mapped (systematic evaluation + Art.9/10 large-scale + systematic public monitoring)"
    excerpt_keywords:
      - [art35, mandatory, categories]
      - [systematic, evaluation]
      - [art9, large scale]
      - [art10, public, monitoring]
      - [privacy, impact, assessment]

