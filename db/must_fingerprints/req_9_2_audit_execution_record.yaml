      - [nonconformities, recorded]
      - [conformities, noted]
      - [audit, observations]
      - [findings, list]
      - [internal, audit, record]

  - must_id: "item:9.2:rec_date"
    description: "Per-audit execution date"
    excerpt_keywords:
