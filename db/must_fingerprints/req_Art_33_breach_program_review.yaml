schema_version: 1
target_evidence_requirement: "req:Art.33:breach_program_review"
target_control: "Art.33"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.33:rev_exercise_link"
    description: "A.5.24 exercise integration — Art.33 procedure exercised within the year (table-top or live)"
    excerpt_keywords:
      - [breach, notification, exercise]
      - [tabletop, exercise, conducted]
      - [live, exercise, performed]
      - [annual, breach, review]
      - [exercise, integration, procedure]

  - must_id: "item:Art.33:rev_severity_audit"
    description: "Severity-gate audit — sampled 'no-notify' decisions reviewed for defensibility against Art.33.1 risk threshold"
    excerpt_keywords:
      - [severity gate, audit]
      - [no notify, decision, reviewed]
      - [art33, risk, threshold]
      - [breach notification, supervisory authority]
      - [sampled, no notify, defensibility]

  - must_id: "item:Art.33:rev_72h_compliance"
    description: "72h-compliance audit — every required notification met the SLA (or had documented Art.33.1 delay reason)"
    excerpt_keywords:
      - [72h, notification]
      - [breach, notification, sla]
      - [notification, within, 72h]
      - [documented, delay, reason]
      - [art33, notification, requirement]
      - [sla, compliance, audit]

  - must_id: "item:Art.33:rev_reviewer"
    description: "Reviewer identity (DPO + legal + incident-response lead)"
    excerpt_keywords:
      - [data protection officer]
      - [incident response lead]
      - [legal counsel reviewer]
      - [breach notification reviewer]
      - [reviewed by dpo]
      - [reviewer identity confirmed]

  - must_id: "item:Art.33:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

