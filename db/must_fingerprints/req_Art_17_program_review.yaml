      - [immutable, records, flagged]
      - [backup, handling, review]
      - [review, backup, cycle]
      - [purge, backup, process]

  - must_id: "item:Art.17:rev_sla_compliance"
    description: "SLA compliance (Art.12.3 one-month)"
    excerpt_keywords:
