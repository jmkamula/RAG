# Per-MUST fingerprint catalog for req:Art.49:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.49:applicable_scope"
target_control: "Art.49"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.49:scope_repetitive_test"
    description: "Operational interpretation of 'non-repetitive' for last-resort derogation"
    excerpt_keywords:
      - [nonrepetitive, derogation]
      - [lastresort, derogation]
      - [specific, situations]
      - [applies, derogation]
      - [repetitive, processing]

  - must_id: "item:Art.49:scope_excluded"
    description: "Derogations explicitly NOT relied on (rationale)"
    excerpt_keywords:
      - [derogations, not, applied]
      - [derogations, excluded, scope]
      - [derogations, explicitly, excluded]
      - [not, rely, derogations]
      - [derogations, excluded, rationale]

  - must_id: "item:Art.49:scope_derogations_used"
    description: "Derogations actually relied on enumerated (most orgs: a explicit consent + b contract; some: e legal claims)"
    excerpt_keywords:
      - [derogations, relied]
      - [explicit, consent]
      - [contract, basis]
      - [legal, claims]
      - [derogations, used]
      - [specific, situations]

