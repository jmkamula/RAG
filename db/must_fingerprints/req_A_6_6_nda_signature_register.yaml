# Per-MUST fingerprint catalog for req:A.6.6:nda_signature_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.6.6:nda_signature_register"
target_control: "A.6.6"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.6:reg_expiry_or_active"
    description: "Per-row status (active / expired-with-surviving-obligations / superseded-by-new-version)"
    excerpt_keywords:
      - [nda, status]
      - [agreement, expiry, date]
      - [confidentiality, agreement, active]
      - [nda, expired, obligations]
      - [version, superseded, nda]

  - must_id: "item:A.6.6:reg_signature_method"
    description: "Per-row signature method (wet / e-signature platform reference — ensures non-repudiation)"
    excerpt_keywords:
      - [signature, method]
      - [wet, signature]
      - [esignature, platform]
      - [nonrepudiation, ensured]
      - [signed, date]
      - [signature, reference]

  - must_id: "item:A.6.6:reg_signature_date"
    description: "Per-row signature date (proves signing happened BEFORE access granted per A.5.18)"
    excerpt_keywords:
      - [signature, date]
      - [nda, signed, date]
      - [date, access, granted]
      - [signed, before, access]
      - [confidentiality, agreement, date]

  - must_id: "item:A.6.6:reg_template_version"
    description: "Per-row template version (drives currency check — old-version signers may need re-signing on material template changes)"
    excerpt_keywords:
      - [nda, template, version]
      - [signature, register, version]
      - [template, version, record]
      - [nda, version, tracked]
      - [signed, nda, version]

  - must_id: "item:A.6.6:reg_variant"
    description: "Per-row NDA variant (employee / contractor / supplier-bilateral / M&A / visitor — matches the template variant_tiers SHOULD)"
    excerpt_keywords:
      - [nda, variant]
      - [nda, type]
      - [agreement, variant]
      - [nda, template, variant]
      - [nda, category]
      - [nda, classification]

  - must_id: "item:A.6.6:reg_signatory_id"
    description: "Per-row signatory identifier (links to identity register A.5.16 for employees; supplier register A.5.19 for contractors; visitor-log for visitors)"
    excerpt_keywords:
      - [signatory, identifier]
      - [nda, signature, register]
      - [employee, id]
      - [supplier, id]
      - [visitor, log]
      - [identity, register]

