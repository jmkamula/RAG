      - [exec, briefing, channel]
      - [risk, owner, distribution]
      - [intel, dissemination]

  - must_id: "item:A.5.7:control_use"
    description: "Use into technical controls (firewall blocklists, IDS rules, EDR indicators, vulnerability prioritisation)"
    excerpt_keywords:
      - [firewall, blocklist]
      - [ids, rules]
      - [edr, indicators]
      - [vulnerability, prioritisation]
      - [intel, into, controls]

  - must_id: "item:A.5.7:risk_feedback"
    description: "Feedback loop into the risk register"
    excerpt_keywords:
