# Per-MUST fingerprint catalog for req:A.5.34:privacy_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.5.34:privacy_program_review"
target_control: "A.5.34"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.34:rev_register_update"
    description: "Changes propagated back to the live register with reference to this review"
    excerpt_keywords:
      - [review, register, update]
      - [changes, propagated, register]
      - [periodic, privacy, review]
      - [live, register, updated]
      - [reference, review, register]

  - must_id: "item:A.5.34:rev_dpia_review"
    description: "DPIA completion status reviewed (any high-risk processing without a completed DPIA flagged; DPIAs older than 24 months refreshed where processing material to lifecycle changed)"
    excerpt_keywords:
      - [dpia, completion, status]
      - [highrisk, processing, dpia]
      - [dpia, reviewed, periodically]
      - [dpia, refreshed, twentyfour, months]
      - [processing, material, lifecycle]
      - [dpia, review, date]

  - must_id: "item:A.5.34:rev_transfer_validity"
    description: "Transfer-mechanism validity check (SCCs current edition, adequacy decisions still standing — e.g"
    excerpt_keywords:
      - [transfer mechanism, validity check]
      - [sccs, current edition]
      - [adequacy decision, still standing]
      - [schrems, shifts]
      - [bcrs, unchanged]
      - [stale mechanism, remediation]

  - must_id: "item:A.5.34:rev_breach_history"
    description: "Breach history for the period (every personal-data breach in scope confirmed handled per Art.33 72h notification + Art.34 data-subject notification where required; lessons fed into A.5.27)"
    excerpt_keywords:
      - [breach, history]
      - [personaldata, breach, handled]
      - [art33, notification]
      - [art34, notification]
      - [lessons, fed, a527]
      - [periodic, review]

  - must_id: "item:A.5.34:rev_dsar_metrics"
    description: "DSAR metrics review (volumes, response times against SLA, refusal/extension rates, complaints to supervisory authority) — operational privacy health"
    excerpt_keywords:
      - [dsar, metrics, review]
      - [response, times, sla]
      - [refusal, rates]
      - [extension, rates]
      - [complaints, supervisory, authority]
      - [privacy, health, operational]

  - must_id: "item:A.5.34:rev_scope_check"
    description: "Cross-check against the privacy applicability scope — any new jurisdiction, regulated activity, data subject category that should add register entries"
    excerpt_keywords:
      - [privacy, applicability, scope]
      - [new, jurisdiction]
      - [regulated, activity]
      - [data, subject, category]
      - [register, entries]
      - [scope, check]

  - must_id: "item:A.5.34:rev_register_check"
    description: "Per-activity outcome (verified / amended / retired / new added) with lawful-basis-still-valid and retention-still-adequate confirmation"
    excerpt_keywords:
      - [periodic, review]
      - [outcome, verified]
      - [lawful, basis, valid]
      - [retention, still, adequate]
      - [activity, status, confirmed]
      - [review, amended, retired]

  - must_id: "item:A.5.34:rev_reviewer"
    description: "Reviewer identity and role recorded (DPO or Privacy Officer + InfoSec lead jointly; legal-counsel sign-off where law has shifted materially)"
    excerpt_keywords:
      - [reviewer, identity]
      - [privacy, officer, review]
      - [dpo, reviewer]
      - [legal, counsel, signoff]
      - [information, security, lead]
      - [review, role, recorded]

  - must_id: "item:A.5.34:rev_date"
    description: "Review date within the planned interval (typically within 12 months of last review)"
    excerpt_keywords:
      - [review, date]
      - [next, review]
      - [reviewed, annually]
      - [review, interval]
      - [review, period]
      - [last, review]

