# Per-MUST fingerprint catalog for req:Art.15:dsar_response
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.15:dsar_response"
target_control: "Art.15"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.15:identity_check"
    description: "Identity verification step recorded (proportionate to sensitivity per Art.12.6) — modern baseline treats Art.12.6 as MUST not SHOULD when reasonable doubt is the default posture for unauthenticated ch"
    excerpt_keywords:
      - [identity, verification]
      - [verification, recorded]
      - [identity, check]
      - [reasonable, doubt]
      - [unauthenticated, channels]
      - [proportionate, verification]

  - must_id: "item:Art.15:sla_met"
    description: "Structured SLA-met flag per response — boolean against the Art.12.3 1-month clock (or extended clock where Art.12.3 extension was formally invoked); analogous to A.5.16:rev_sla_met"
    excerpt_keywords:
      - [sla, met]
      - [response, within, month]
      - [data, subject, access]
      - [request, response, time]
      - [art123, extension, invoked]
      - [compliance, response, deadline]

  - must_id: "item:Art.15:copy"
    description: "Copy of the personal data undergoing processing provided to the data subject"
    excerpt_keywords:
      - [copy, personal, data]
      - [data, subject, access]
      - [provided, data]
      - [personal, data, processing]
      - [access, request, response]

  - must_id: "item:Art.15:transfer_safeguards"
    description: "Where data is transferred to a third country or international organisation, the appropriate safeguards under Art.46"
    excerpt_keywords:
      - [data, transferred, third, country]
      - [transfer, appropriate, safeguards]
      - [international, organisation, transfer]
      - [art46, transfer, safeguards]
      - [third, country, safeguards]
      - [transfer, third, country]

  - must_id: "item:Art.15:automated_decision"
    description: "Existence of automated decision-making / profiling, with meaningful information on logic and consequences where applicable"
    excerpt_keywords:
      - [automated, decision, profiling]
      - [meaningful, information, logic]
      - [decision, making, process]
      - [profiling, consequences, explained]
      - [logic, automated, decision]
      - [impact, automated, profiling]

  - must_id: "item:Art.15:source"
    description: "Source of the personal data where not collected from the data subject (any available information)"
    excerpt_keywords:
      - [personal, data, source]
      - [data, not, collected]
      - [source, provided, thirdparty]
      - [information, origin, personaldata]
      - [data, obtained, source]

  - must_id: "item:Art.15:timing"
    description: "Responded within one calendar month of receipt OR Art.12.3 two-month extension formally applied with notification"
    excerpt_keywords:
      - [responded, one, month]
      - [response, within, calendar, month]
      - [two, month, extension]
      - [extension, formally, applied]
      - [notification, extension]
      - [art123, two, month]

  - must_id: "item:Art.15:complaint"
    description: "Right to lodge a complaint with a supervisory authority"
    excerpt_keywords:
      - [right, complaint]
      - [lodge, complaint]
      - [complaint, supervisory, authority]
      - [data, subject, complaint]
      - [file, complaint]
      - [complaint, submitted]

  - must_id: "item:Art.15:rights"
    description: "Existence of rights to rectification, erasure, restriction and objection"
    excerpt_keywords:
      - [right, rectification]
      - [right, erasure]
      - [right, restriction]
      - [right, objection]
      - [data, subject, rights]
      - [exercise, rights]

  - must_id: "item:Art.15:retention"
    description: "Envisaged storage period or criteria used to determine it"
    excerpt_keywords:
      - [storage, period]
      - [retention, period]
      - [criteria, determine, storage]
      - [data, retention, policy]
      - [retention, criteria]
      - [storage, duration]

  - must_id: "item:Art.15:recipients"
    description: "Recipients or categories of recipients (including any in third countries)"
    excerpt_keywords:
      - [categories, recipients]
      - [recipients, third, countries]
      - [data, subject, access]
      - [disclosed, recipients]
      - [transfer, third]
      - [recipient, categories, included]

  - must_id: "item:Art.15:purposes"
    description: "Purposes of the processing"
    excerpt_keywords:
      - [purposes, processing]
      - [processing, purpose]
      - [data, processing, purposes]
      - [lawful, processing, purposes]
      - [processing, activities, purposes]

  - must_id: "item:Art.15:categories"
    description: "Categories of personal data concerned"
    excerpt_keywords:
      - [categories, personal, data]
      - [types, personal, data]
      - [data, subject, categories]
      - [categories, data, concerned]

  - must_id: "item:Art.15:confirmation"
    description: "Confirmation that personal data is or is not processed"
    excerpt_keywords:
      - [confirmation, personal data]
      - [data subject, access request]
      - [processed, personal data]
      - [right of access, confirmation]
      - [response, data subject]
      - [access request, confirmation]

