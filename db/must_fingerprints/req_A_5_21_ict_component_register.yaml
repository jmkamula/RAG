    excerpt_keywords:
      - [ict, component, register]
      - [component, column]
      - [vendor, product, version, column]
      - [ict, service, register]

  - must_id: "item:A.5.21:reg_owner"
    description: "Named internal owner per component"
    excerpt_keywords:
