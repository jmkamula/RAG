      - [ict, component, owner, per]
      - [architecture, team, owner]
      - [platform, team, owner]

  - must_id: "item:A.5.21:reg_critical_flag"
    description: "Critical-component flag per row"
    excerpt_keywords:
      - [critical, component, flag]
      - [critical, flag, column]
      - [critical, per, row]
