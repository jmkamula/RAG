      - [pii, collection, channel]
      - [email, collected]
      - [web, collected]
      - [contact, point, parity]
      - [phone, fax, fallback]

  - must_id: "item:A.7.3.1:proc_accessibility"
    description: "Accessibility standard — accessible + timely means (WCAG-align, language accessibility, response-time SLA)"
    excerpt_keywords:
      - [accessible, timely]
      - [wcag, compliant]
      - [response, time, sla]
      - [language, accessibility]
      - [shall, provide, accessibility]

  - must_id: "item:A.7.3.1:proc_fulfilment_means"
    description: "Fulfilment means enumerated per obligation (which subject-rights channel handles each right — access / rectification / erasure / portability / objection)"
    excerpt_keywords:
      - [fulfilment, means]
      - [obligation, channel]
      - [subjectrights, access]
      - [rectification, erasure]
