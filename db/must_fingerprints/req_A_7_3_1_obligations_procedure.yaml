    excerpt_keywords:
      - [obligation, catalog]
      - [applicable, jurisdiction]
      - [pii, principal, obligation]
      - [legal, requirement, citation]
      - [gdpr, ccpa, lgpd]
      - [fulfill, obligation, procedure]

