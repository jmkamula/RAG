schema_version: 1
target_evidence_requirement: "req:A.7.3.1:obligations_procedure"
target_control: "A.7.3.1"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.3.1:proc_documented_extent"
    description: "Documented extent — subject-facing description of which obligations are fulfilled + how"
    excerpt_keywords:
      - [documented, extent]
      - [fulfil, obligation]
      - [pii, principal, obligation]
      - [subject, facing, description]
      - [obligations, fulfilled]
