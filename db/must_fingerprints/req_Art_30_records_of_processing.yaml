    description: "If the org also acts as processor, processor-side records per Art.30.2.a-d are included or kept as a parallel register"
    excerpt_keywords:
      - [processor, records]
      - [processing, activities, processor]
      - [records, processing, article 30]
      - [processor, register]
      - [processing, records, parallel]
      - [art30, processor, records]

  - must_id: "item:Art.30:security"
    description: "General description of technical and organisational security measures"
    excerpt_keywords:
      - [technical security measures]
      - [organisational security measures]
      - [security controls implemented]
      - [data protection measures]
      - [security risk assessment]
      - [security policy compliance]

  - must_id: "item:Art.30:retention"
    description: "Envisaged time limits for erasure per category"
    excerpt_keywords:
      - [retention, period]
      - [time, limits, erasure]
      - [data, category, retention]
      - [storage, duration]
      - [erasure, timeframe]
      - [retention, schedule]

  - must_id: "item:Art.30:transfers"
    description: "Transfers to third countries or international organisations with safeguards identified"
