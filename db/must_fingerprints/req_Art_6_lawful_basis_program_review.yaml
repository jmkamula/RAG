# Per-MUST fingerprint catalog for req:Art.6:lawful_basis_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.6:lawful_basis_program_review"
target_control: "Art.6"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.6:rev_regulator_guidance"
    description: "Regulator-guidance sweep — EDPB / supervisory authority guidance updates considered for impact"
    excerpt_keywords:
      - [regulator, guidance]
      - [edpb, guidance]
      - [supervisory, authority]
      - [guidance, updates]
      - [impact, assessment]
      - [review, date]

  - must_id: "item:Art.6:rev_basis_appropriateness"
    description: "Basis-appropriateness sample — high-volume / high-sensitivity activities re-evaluated for whether the chosen basis still fits"
    excerpt_keywords:
      - [basis, appropriateness]
      - [review, lawful, basis]
      - [re evaluated, processing, basis]
      - [high volume, processing]
      - [high sensitivity, data]
      - [lawful basis, reviewed]

  - must_id: "item:Art.6:rev_register_currency"
    description: "Register currency check — every Art.30 RoPA activity has a current Art.6 basis assignment"
    excerpt_keywords:
      - [register, currency]
      - [ropa, activity, basis]
      - [art6, lawful, basis]
      - [current, basis, assignment]
      - [review, register, currency]
      - [art30, record, processing]

  - must_id: "item:Art.6:rev_reviewer"
    description: "Reviewer identity (DPO or Privacy Lead)"
    excerpt_keywords:
      - [reviewer, identity]
      - [data, protection, officer]
      - [privacy, lead]
      - [reviewed]
      - [review, conducted, dpo]

  - must_id: "item:Art.6:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [review, within, interval]
      - [scheduled, review, date]
      - [review, period]
      - [next, review]

