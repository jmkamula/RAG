# Per-MUST fingerprint catalog for req:4.4:isms_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:4.4:isms_program_review"
target_control: "4.4"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:4.4:rev_change_log"
    description: "Cross-check against change records — every actual change in the year is logged"
    excerpt_keywords:
      - [change, log]
      - [change, record]
      - [logged, change]
      - [annual, change, review]
      - [reviewed, change, log]

  - must_id: "item:4.4:rev_map_currency"
    description: "Process map currency check (cross-leaf coherence)"
    excerpt_keywords:
      - [process map, currency check]
      - [review, process map]
      - [process map, updated]
      - [cross leaf, coherence]
      - [map currency, reviewed]
      - [process map, review date]

  - must_id: "item:4.4:rev_currency"
    description: "Currency check — manual still matches how the ISMS actually runs"
    excerpt_keywords:
      - [isms, manual, review]
      - [manual, currency, check]
      - [review, current, isms]
      - [isms, manual, updated]
      - [manual, matches, isms]
      - [review, frequency, manual]

  - must_id: "item:4.4:rev_reviewer"
    description: "Reviewer identity (ISMS Manager + top management sponsor)"
    excerpt_keywords:
      - [reviewer, identity]
      - [isms, manager]
      - [top, management, sponsor]
      - [reviewed]
      - [management, reviewer]

  - must_id: "item:4.4:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review date]
      - [planned interval]
      - [next review]
      - [reviewed annually]
      - [review frequency]
      - [review schedule]

