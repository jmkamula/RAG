# Per-MUST fingerprint catalog for req:A.5.17:credential_revocation_record
#
# Reviewed-from-skeleton 2026-06-14. Per-credential revocation record.
# Mirrors A.5.16/A.5.18 patterns.

schema_version: 1
target_evidence_requirement: "req:A.5.17:credential_revocation_record"
target_control: "A.5.17"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.17:rev_credential_ref"
    description: "Credential identifier per record"
    excerpt_keywords:
      - [credential, revoked, ref]
      - [credential, instance, revoked]
      - [api, key, revoked]
      - [token, revoked]
      - [revoked, credential, id]

  - must_id: "item:A.5.17:rev_trigger_type"
    description: "Trigger type per record"
    excerpt_keywords:
      - [credential, revocation, trigger]
      - [identity, termination, credential]
      - [rotation, due, trigger]
      - [compromise, detected, trigger]
      - [lost, token, revocation]

  - must_id: "item:A.5.17:rev_effective_time"
    description: "Effective time per record"
    excerpt_keywords:
      - [credential, revocation, effective]
      - [credential, took, effect]
      - [immediate, on, compromise]
      - [revocation, effective, time]

  - must_id: "item:A.5.17:rev_actual_timestamp"
    description: "Actual revocation timestamp per record"
    excerpt_keywords:
      - [credential, revoked, on]
      - [credential, revocation, timestamp]
      - [actual, credential, revocation]
      - [compromise, revocation, sla]

  - must_id: "item:A.5.17:rev_identity_pair"
    description: "Cross-reference to paired A.5.16 identity revocation record"
    excerpt_keywords:
      - ["A.5.16"]
      - [identity, revocation, paired]
      - [credential, identity, pair]
      - [paired, identity, revocation]

  - must_id: "item:A.5.17:rev_replacement"
    description: "Replacement-issued status per record where applicable"
    excerpt_keywords:
      - [credential, replacement, issued]
      - [rotation, replacement, credential]
      - [forced, re, enrolment]
      - [replacement, credential, status]

  - must_id: "item:A.5.17:rev_residual_check"
    description: "Residual-access check per record (sessions invalidated, refresh tokens revoked, cached credentials purged)"
    excerpt_keywords:
      - [sessions, invalidated]
      - [refresh, tokens, revoked]
      - [cached, credentials, purged]
      - [residual, access, credential]
