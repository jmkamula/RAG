# Per-MUST fingerprint catalog for req:A.5.10:periodic_review
#
# Reviewed-from-skeleton 2026-06-14. AUP review record.

schema_version: 1
target_evidence_requirement: "req:A.5.10:periodic_review"
target_control: "A.5.10"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.10:review_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [aup, review, date]
      - [acceptable, use, reviewed, on]
      - [aup, last, reviewed]

  - must_id: "item:A.5.10:review_reviewer"
    description: "Reviewer identity"
    excerpt_keywords:
      - [aup, reviewed, by]
      - [acceptable, use, reviewer]
      - [hr, legal, aup, review]

  - must_id: "item:A.5.10:review_outcome"
    description: "Outcome captured"
    excerpt_keywords:
      - [aup, no, change]
      - [aup, amended]
      - [aup, re, issued]
      - [acceptable, use, outcome]

  - must_id: "item:A.5.10:review_use_patterns"
    description: "Use-pattern check (new technologies / behaviours)"
    excerpt_keywords:
      - [aup, new, technology]
      - [aup, new, behaviour]
      - [aup, use, pattern, change]
      - [byod, expansion, aup]
