# Per-MUST fingerprint catalog for req:Art.46:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.46:applicable_scope"
target_control: "Art.46"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.46:scope_tia_methodology"
    description: "TIA methodology (EDPB six-step / template-based / ad-hoc per transfer)"
    excerpt_keywords:
      - [transfer impact, assessment methodology]
      - [edpb, six step]
      - [template based, transfer assessment]
      - [risk assessment, transfer]
      - [transfer, safeguards, methodology]
      - [ad hoc, transfer, assessment]

  - must_id: "item:Art.46:scope_mechanism_mix"
    description: "Mechanism mix in use (SCCs predominantly / some BCRs / any ad-hoc clauses)"
    excerpt_keywords:
      - [appropriate, safeguards]
      - [standard, contractual, clauses]
      - [binding, corporate, rules]
      - [transfer, mechanism, mix]
      - [applicable, safeguards, scope]

  - must_id: "item:Art.46:scope_non_adequate_transfers"
    description: "Non-adequate transfers enumerated (cross-link to Art.44 register filtered by mechanism=Art.46)"
    excerpt_keywords:
      - [nonadequate, transfers]
      - [transfers, subject, safeguards]
      - [art46, transfers]
      - [transfers, appropriate, safeguards]
      - [crosslink, art44, register]
      - [mechanism, art46]

