# Per-MUST fingerprint catalog for req:A.7.14:disposal_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.14:disposal_program_review"
target_control: "A.7.14"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.7.14:rev_register_update"
    description: "Changes propagated to the procedure / scope"
    excerpt_keywords:
      - [periodic, disposal, review]
      - [procedure, update]
      - [scope, change]
      - [review, date]
      - [next, review]
      - [reviewed, periodically]

  - must_id: "item:A.7.14:rev_certificate_audit"
    description: "Certificate audit (sample-based verification that retained certificates match register entries)"
    excerpt_keywords:
      - [certificate, audit]
      - [audit, sample, verification]
      - [retained, certificates, register]
      - [certificate, audit, review]
      - [audit, match, register]
      - [periodic, audit, certificate]

  - must_id: "item:A.7.14:rev_completeness"
    description: "Completeness check — every retired asset (from A.5.9) has a matching disposal_record"
    excerpt_keywords:
      - [retired, asset]
      - [disposal, record]
      - [completeness, check]
      - [periodic, review]
      - [matching, disposal, record]
      - [asset, disposal, review]

  - must_id: "item:A.7.14:rev_reviewer"
    description: "Reviewer identity (IT + InfoSec + Legal where regulatory disposal applies)"
    excerpt_keywords:
      - [reviewer, identity]
      - [it, security, reviewer]
      - [information, security, reviewer]
      - [legal, reviewer]
      - [regulatory, disposal, review]
      - [disposal, reviewer]

  - must_id: "item:A.7.14:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [periodic, review]
      - [review, scheduled]
      - [next, review]
      - [review, frequency]

