schema_version: 1
target_evidence_requirement: "req:A.7.3.8:applicable_scope"
target_control: "A.7.3.8"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.3.8:scope_derived_data"
    description: "Derived/inferred data handling — original PII in scope; derived analytics + third-party enrichment typically out of scope"
    excerpt_keywords:
      - [derived, data, scope]
      - [original, pii, included]
      - [analytics, derived, excluded]
      - [thirdparty, enrichment, excluded]
      - [pii, scope]

  - must_id: "item:A.7.3.8:scope_art_20_universe"
    description: "Art.20 (portability) universe — subset where basis=consent OR contract AND processing is automated"
    excerpt_keywords:
      - [art20, portability]
      - [basis, consent]
      - [basis, contract]
      - [processing, automated]
      - [scope, applicable]
      - [subset, universe]

  - must_id: "item:A.7.3.8:scope_art_15_universe"
    description: "Art.15.3 (copy) universe — all subjects with PII processed"
    excerpt_keywords:
      - [applies, pii, processed]
      - [scope, all, subjects]
      - [providing, copy, pii]
      - [subject, personal, data]
      - [pii, processed, universe]

