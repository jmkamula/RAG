# Per-MUST fingerprint catalog for req:6.1.3:risk_treatment_plan
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:6.1.3:risk_treatment_plan"
target_control: "6.1.3"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:6.1.3:approval"
    description: "Risk owners' approval of the plan AND acceptance of residual risks recorded"
    excerpt_keywords:
      - [risk, owner, approval]
      - [approval, risk, treatment]
      - [residual, risk, acceptance]
      - [plan, approval, recorded]
      - [risk, treatment, plan]

  - must_id: "item:6.1.3:owners"
    description: "Risk treatment owners identified per treated risk"
    excerpt_keywords:
      - [risk, treatment, owner]
      - [treatment, plan, owner]
      - [identified, risk, owner]
      - [assigned, risk, owner]
      - [risk, treatment, responsible]
      - [owner, per, risk]

  - must_id: "item:6.1.3:residual"
    description: "Residual risk identified per treated risk"
    excerpt_keywords:
      - [residual, risk, identified]
      - [treated, risk, assessment]
      - [risk, treatment, plan]
      - [risk, treatment, residual]

  - must_id: "item:6.1.3:soa_ref"
    description: "Reference to the live Statement of Applicability (the SoA leaf)"
    excerpt_keywords:
      - [statement, applicability]
      - [live, soa]
      - [soa, reference]
      - [reference, statement, applicability]
      - [current, soa]
      - [applicability, statement, live]

  - must_id: "item:6.1.3:controls"
    description: "Controls determined to implement the chosen options"
    excerpt_keywords:
      - [risk, treatment, plan]
      - [implemented, controls]
      - [chosen, risk, options]
      - [control, measures, implemented]
      - [risk, treatment, controls]
      - [selected, risk, controls]

  - must_id: "item:6.1.3:options"
    description: "Risk treatment options selected for each risk"
    excerpt_keywords:
      - [risk, treatment, options]
      - [selected, risk, treatment]
      - [risk, treatment, plan]
      - [treatment, options, documented]
      - [risk, treatment, measures]

