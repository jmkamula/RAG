# Per-MUST fingerprint catalog for req:A.5.33:records_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.5.33:records_program_review"
target_control: "A.5.33"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.33:rev_register_update"
    description: "Changes propagated back to the live schedule with reference to this review"
    excerpt_keywords:
      - [periodic, review]
      - [review, schedule]
      - [changes, propagated]
      - [review, reference]
      - [live, schedule]
      - [schedule, updated]

  - must_id: "item:A.5.33:rev_legal_hold_status"
    description: "Active legal-hold status reviewed (which classes/rows currently held, by whom, on what basis, expected release trigger) — stale unreleased holds remediated"
    excerpt_keywords:
      - [legalhold, status, review]
      - [held, whom]
      - [release, trigger]
      - [stale, holds, remediated]
      - [classes, held, review]
      - [periodic, legalhold, review]

  - must_id: "item:A.5.33:rev_disposal_audit"
    description: "Disposal audit — sample of classes past retention end-date confirmed disposed (certificate of destruction present) or held under documented legal hold; overruns flagged for remediation"
    excerpt_keywords:
      - [disposal, audit]
      - [retention, enddate]
      - [certificate, destruction]
      - [legal, hold]
      - [overruns, flagged]
      - [remediation, required]

  - must_id: "item:A.5.33:rev_scope_check"
    description: "Cross-check against the records-categories scope — any new business activity / legal driver / data category that should add classes"
    excerpt_keywords:
      - [records, scope]
      - [business, activity, scope]
      - [legal, driver, scope]
      - [data, category, scope]
      - [scope, crosscheck]
      - [new, records, category]

  - must_id: "item:A.5.33:rev_schedule_check"
    description: "Per-class outcome (verified / amended / retired / new added) with retention-still-adequate and protection-class-still-adequate confirmation"
    excerpt_keywords:
      - [periodic, records, review]
      - [retention, still, adequate]
      - [protection, class, adequate]
      - [outcome, verified]
      - [review, schedule]
      - [amended, retired, added]

  - must_id: "item:A.5.33:rev_reviewer"
    description: "Reviewer identity and role recorded (records manager / compliance lead with legal-counsel sign-off where material)"
    excerpt_keywords:
      - [reviewer, identity]
      - [reviewer, role]
      - [records, manager]
      - [compliance, lead]
      - [legal, counsel, signoff]
      - [review, signed, off]

  - must_id: "item:A.5.33:rev_date"
    description: "Review date within the planned interval (typically within 12 months of last review)"
    excerpt_keywords:
      - [review, date]
      - [next, review]
      - [reviewed, annually]
      - [review, interval]
      - [review, period]
      - [planned, review]

