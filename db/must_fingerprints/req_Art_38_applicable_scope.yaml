# Per-MUST fingerprint catalog for req:Art.38:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.38:applicable_scope"
target_control: "Art.38"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.38:scope_coi_matrix"
    description: "COI matrix — which other roles DPO cannot also hold (CISO / security architect / product owner of PII flows / etc.)"
    excerpt_keywords:
      - [data protection officer, cannot hold]
      - [conflict of interest, matrix]
      - [dpo role, restrictions]
      - [excluded roles, dpo]
      - [dpo, not permitted]
      - [separation of duties, dpo]

  - must_id: "item:Art.38:scope_resource_envelope"
    description: "Resource envelope (budget category + escalation threshold for additional spend)"
    excerpt_keywords:
      - [resource, envelope]
      - [budget, category]
      - [escalation, threshold]
      - [additional, spend]
      - [spend, limit]
      - [budget, threshold]

  - must_id: "item:Art.38:scope_forums"
    description: "Forums DPO is invited to (board, exec committee, change-management, incident response, vendor onboarding)"
    excerpt_keywords:
      - [dpo, invited, forum]
      - [board, exec, committee]
      - [change, management, forum]
      - [incident, response, forum]
      - [vendor, onboarding, forum]

