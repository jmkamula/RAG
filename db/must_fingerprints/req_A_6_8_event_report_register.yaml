# Per-MUST fingerprint catalog for req:A.6.8:event_report_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.6.8:event_report_register"
target_control: "A.6.8"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.8:reg_closure_date"
    description: "Per-row closure date (every report reaches a closed state, no open-forever)"
    excerpt_keywords:
      - [closure, date]
      - [event, report, closed]
      - [report, closure, status]
      - [record, closure, date]
      - [incident, closure, date]

  - must_id: "item:A.6.8:reg_triage_outcome"
    description: "Per-row triage outcome (incident-confirmed → A.5.26 register; false-positive-closed; near-miss-filed-for-trend; pending-investigation)"
    excerpt_keywords:
      - [triage, outcome]
      - [incident, confirmed]
      - [false, positive, closed]
      - [near, miss, trend]
      - [pending, investigation]
      - [event, report, register]

  - must_id: "item:A.6.8:reg_summary"
    description: "Per-row content summary (one-line headline + classification — observed / suspected / near-miss)"
    excerpt_keywords:
      - [event, summary]
      - [incident, classification]
      - [observed, event]
      - [suspected, incident]
      - [nearmiss, event]
      - [report, headline]

  - must_id: "item:A.6.8:reg_report_timestamp"
    description: "Per-row report timestamp (drives timeliness analysis — gap between event time and report time)"
    excerpt_keywords:
      - [report, timestamp]
      - [event, report, time]
      - [logged, date, time]
      - [recorded, timestamp]
      - [reporting, date, time]

  - must_id: "item:A.6.8:reg_reporter"
    description: "Per-row reporter identity or 'anonymous' (anonymous reports are first-class; non-attribution is the point of the option)"
    excerpt_keywords:
      - [reporter, identity]
      - [anonymous, report]
      - [report, submitted, anonymous]
      - [reporter, name]
      - [identity, not, required]

  - must_id: "item:A.6.8:reg_channel"
    description: "Per-row channel used (drives channel-mix analysis — are some channels under-used?)"
    excerpt_keywords:
      - [event, channel]
      - [report, channel]
      - [channel, used]
      - [channel, recorded]
      - [channel, entry]
      - [channel, logged]

  - must_id: "item:A.6.8:reg_report_id"
    description: "Per-row report identifier (links to A.5.25 triage record where the report was triaged)"
    excerpt_keywords:
      - [report, identifier]
      - [event, report, id]
      - [report, reference]
      - [triage, record]
      - [report, entry, id]

