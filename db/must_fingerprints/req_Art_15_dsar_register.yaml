# Per-MUST fingerprint catalog for req:Art.15:dsar_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.15:dsar_register"
target_control: "Art.15"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.15:reg_outcome"
    description: "Outcome per row (fulfilled / partial under Art.15.4 / refused under Art.12.5 with reason)"
    excerpt_keywords:
      - [access, request, outcome]
      - [request, status, fulfilled]
      - [partial, response, art15]
      - [refused, request, reason]
      - [dsar, register, outcome]

  - must_id: "item:Art.15:reg_timing_flag"
    description: "Timing compliance flag (within 1 month / extended per Art.12.3 / late)"
    excerpt_keywords:
      - [response, within, one, month]
      - [extended, deadline, art123]
      - [timing, compliance, flag]
      - [late, response, record]
      - [data, subject, access, request]
      - [response, deadline, tracked]

  - must_id: "item:Art.15:reg_response_date"
    description: "Date the response was issued"
    excerpt_keywords:
      - [response, date]
      - [date, issued]
      - [response, issued]
      - [date, recorded]
      - [response, logged]

  - must_id: "item:Art.15:reg_scope"
    description: "Scope of the request as understood (full Art.15 / specific data set / repeat copy)"
    excerpt_keywords:
      - [scope, request]
      - [access, right, scope]
      - [data, subject, request]
      - [request, type]
      - [full, art15]
      - [specific, data, set]

  - must_id: "item:Art.15:reg_requester"
    description: "Requester identity (verified) or pseudonymous reference where verification used a token"
    excerpt_keywords:
      - [requester, identity]
      - [verified, requester]
      - [pseudonymous, reference]
      - [identity, verification]
      - [token, verification]

  - must_id: "item:Art.15:reg_received_date"
    description: "Request received date (the start of the Art.12.3 clock) per row"
    excerpt_keywords:
      - [request, received, date]
      - [date, request, logged]
      - [received, date, record]
      - [date, request, entry]
      - [request, timestamp, record]

