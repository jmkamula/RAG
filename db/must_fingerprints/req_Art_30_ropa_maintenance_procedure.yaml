      - [dpia, required, before]
      - [processing, activity, assessment]
      - [register, entry, finalised]
      - [prior, dpia, completion]

  - must_id: "item:Art.30:proc_dpa_gate"
    description: "Linkage to Art.28 DPA process — adding a new processor cannot complete without DPA and register update"
    excerpt_keywords:
      - [adding, new, processor]
      - [processor, agreement, update]
      - [dpa, register, update]
      - [process, cannot, complete]
      - [linked, art28, dpa]
      - [register, updated, processor]

  - must_id: "item:Art.30:proc_update_path"
    description: "Path from trigger to register entry stated (who notifies, who reviews, who approves the entry)"
    excerpt_keywords:
      - [triggered]
      - [shall, notify]
      - [reviewed]
      - [approved]
      - [responsible]
      - [entry, approval]

  - must_id: "item:Art.30:proc_triggers"
    description: "Update triggers enumerated (new system, new purpose, new processor, new third-country transfer, retention change, DPIA outcome)"
