# Per-MUST fingerprint catalog for req:Art.85:program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.85:program_review"
target_control: "Art.85"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.85:rev_subject_rights_audit"
    description: "Subject-rights audit — confirm derogations are not over-applied (residual rights still honoured where not legitimately derogated)"
    excerpt_keywords:
      - [subject rights, audit]
      - [derogations, over applied]
      - [residual rights, honoured]
      - [review, derogation]
      - [audit, compliance]
      - [freedom of expression, processing]

  - must_id: "item:Art.85:rev_scope_coverage"
    description: "Scope coverage — every in-scope activity has a derogation basis (or explicit decision to NOT invoke Art.85 for it)"
    excerpt_keywords:
      - [in scope, derogation basis]
      - [scope coverage, art85]
      - [activities covered, derogation]
      - [derogation basis, explicit decision]
      - [scope activities, art85 derogation]

  - must_id: "item:Art.85:rev_law_currency"
    description: "Member State law currency check — every cited national-law provision still in force; new MS implementations swept in"
    excerpt_keywords:
      - [member state, law currency]
      - [national law, still in force]
      - [law provision, reviewed annually]
      - [new implementation, swept in]
      - [law currency, periodic review]
      - [review, member state, law]

  - must_id: "item:Art.85:rev_reviewer"
    description: "Reviewer identity (DPO + legal counsel + editorial/academic lead)"
    excerpt_keywords:
      - [reviewer, identity]
      - [data, protection, officer]
      - [legal, counsel]
      - [editorial, lead]
      - [academic, lead]
      - [reviewed]

  - must_id: "item:Art.85:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

