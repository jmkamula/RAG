# Per-MUST fingerprint catalog for req:Art.33:applicable_scope
#
# Reviewed-from-skeleton 2026-06-14. GDPR Art.33 scope note.

schema_version: 1
target_evidence_requirement: "req:Art.33:applicable_scope"
target_control: "Art.33"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.33:scope_breach_definition"
    description: "Operational definition of 'personal data breach' per Art.4(12)"
    excerpt_keywords:
      - ["Art.4"]
      - [personal, data, breach, definition]
      - [art, 4, 12, breach, definition]
      - [breach, of, security, definition]

  - must_id: "item:Art.33:scope_excluded_events"
    description: "Excluded events"
    excerpt_keywords:
      - [art, 33, excluded, events]
      - [security, event, not, personal, data]
      - [art, 33, near, miss, excluded]

  - must_id: "item:Art.33:scope_high_risk_overlay"
    description: "High-risk overlay (when Art.34 also triggers)"
    excerpt_keywords:
      - ["Art.34"]
      - [art, 33, art, 34, boundary]
      - [breach, high, risk, overlay]

  - must_id: "item:Art.33:scope_lead_sa"
    description: "Lead supervisory authority identified"
    excerpt_keywords:
      - ["Art.56"]
      - [lead, supervisory, authority, identified]
      - [art, 56, main, establishment, sa]
