# Per-MUST fingerprint catalog for req:Art.33:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.33:applicable_scope"
target_control: "Art.33"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.33:scope_excluded_events"
    description: "Excluded events (security events NOT involving personal data; minor near-misses)"
    excerpt_keywords:
      - [excluded, events]
      - [security, events, excluded]
      - [not, personal, data]
      - [minor, near, misses]
      - [events, not, involving, personal]
      - [scope, excludes, events]

  - must_id: "item:Art.33:scope_high_risk_overlay"
    description: "High-risk overlay (when Art.34 subject notification ALSO triggers — boundary to Art.34 leaf)"
    excerpt_keywords:
      - [highrisk, notification]
      - [art33, art34, trigger]
      - [subject, notification, required]
      - [personal, data, breach]
      - [supervisory, authority, notified]

  - must_id: "item:Art.33:scope_lead_sa"
    description: "Lead supervisory authority identified per main-establishment rules (Art.56)"
    excerpt_keywords:
      - [lead, supervisory, authority]
      - [main, establishment, rules]
      - [identified, lead, authority]
      - [art56, lead, authority]
      - [supervisory, authority, identified]

  - must_id: "item:Art.33:scope_breach_definition"
    description: "Operational definition of 'personal data breach' per Art.4(12) — breach of security leading to accidental/unlawful destruction/loss/alteration/unauthorised disclosure/access"
    excerpt_keywords:
      - [personal, data, breach]
      - [breach, security, incident]
      - [unauthorised, disclosure, access]
      - [accidental, loss, alteration]
      - [destruction, loss, breach]
      - [security, breach, definition]

