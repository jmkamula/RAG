# Per-MUST fingerprint catalog for req:10.1:improvement_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:10.1:improvement_program_review"
target_control: "10.1"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:10.1:rev_closure_quality"
    description: "Closure-quality check — closed actions have effectiveness assessment, not just 'marked complete'"
    excerpt_keywords:
      - [closure, effectiveness]
      - [closed, actions, assessment]
      - [marked, complete, checked]
      - [action, closure, quality]
      - [effectiveness, review]
      - [closure, quality, check]

  - must_id: "item:10.1:rev_dimension_coverage"
    description: "Dimension coverage — improvements span suitability AND adequacy AND effectiveness (not just one)"
    excerpt_keywords:
      - [improvements, suitability, adequacy]
      - [improvements, adequacy, effectiveness]
      - [dimension, coverage, improvements]
      - [review, improvement, effectiveness]
      - [continual, improvement, coverage]

  - must_id: "item:10.1:rev_signal_capture"
    description: "Signal-capture check — every in-scope trigger source produced at least one action OR explicit 'no opportunities this cycle' rationale"
    excerpt_keywords:
      - [signal, capture]
      - [trigger, source]
      - [action, taken]
      - [no, opportunities]
      - [cycle, review]
      - [scope]

  - must_id: "item:10.1:rev_reviewer"
    description: "Reviewer identity (ISMS Manager + executive sponsor)"
    excerpt_keywords:
      - [reviewer, identity]
      - [isms, manager]
      - [executive, sponsor]
      - [review, conducted]
      - [reviewed, manager]

  - must_id: "item:10.1:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

