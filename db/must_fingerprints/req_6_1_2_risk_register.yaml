# Per-MUST fingerprint catalog for req:6.1.2:risk_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:6.1.2:risk_register"
target_control: "6.1.2"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:6.1.2:reg_last_assessed"
    description: "Last assessment date per row (drives staleness)"
    excerpt_keywords:
      - [last, assessment, date]
      - [risk, assessment, date]
      - [assessment, date, record]
      - [date, last, assessed]
      - [risk, register, date]

  - must_id: "item:6.1.2:reg_treatment_status"
    description: "Treatment status per row (accept / mitigate / transfer / avoid; link to 6.1.3 plan)"
    excerpt_keywords:
      - [treatment, status]
      - [risk, treatment, plan]
      - [risk, treatment, status]
      - [treatment, option]
      - [treatment, decision]
      - [treatment, approach]

  - must_id: "item:6.1.2:reg_scoring"
    description: "Likelihood + consequence scores per row applied per the procedure's criteria"
    excerpt_keywords:
      - [likelihood, score]
      - [consequence, score]
      - [risk, score]
      - [scoring, criteria]
      - [risk, assessment, score]
      - [score, applied]

  - must_id: "item:6.1.2:reg_owner"
    description: "Risk owner per row"
    excerpt_keywords:
      - [risk, owner]
      - [owner, assigned]
      - [risk, responsible]
      - [assigned, risk]
      - [risk, ownership]
      - [owner, per, record]

  - must_id: "item:6.1.2:reg_description"
    description: "Risk description per row (asset, threat, vulnerability)"
    excerpt_keywords:
      - [risk, description]
      - [asset, threat, vulnerability]
      - [risk, register]
      - [identified, risk]
      - [threat, description]

  - must_id: "item:6.1.2:reg_risk_id"
    description: "Unique risk identifier per row"
    excerpt_keywords:
      - [risk, identifier]
      - [unique, risk, id]
      - [risk, reference]
      - [risk, record, id]
      - [risk, entry, id]

