# Per-MUST fingerprint catalog for req:Art.34:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.34:applicable_scope"
target_control: "Art.34"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.34:scope_art33_boundary"
    description: "Boundary with Art.33 — Art.33 fires lower (any breach of personal data not 'unlikely to result in risk'); Art.34 fires higher (high risk only)"
    excerpt_keywords:
      - [art33, art34, boundary]
      - [personal, data, breach]
      - [high, risk]
      - [unlikely, result, risk]
      - [communication, data, subject]

  - must_id: "item:Art.34:scope_exception_criteria"
    description: "Art.34.3 exception criteria operationalised (encryption deemed appropriate / risk-mitigation measures / disproportionate effort definition)"
    excerpt_keywords:
      - [art34, exception, criteria]
      - [encryption, deemed, appropriate]
      - [risk, mitigation, measures]
      - [disproportionate, effort, definition]
      - [personal, data, breach]
      - [communication, data, subject]

  - must_id: "item:Art.34:scope_high_risk_test"
    description: "High-risk test operational criteria (likelihood × severity × number affected × category sensitivity)"
    excerpt_keywords:
      - [highrisk, test, criteria]
      - [likelihood, severity, risk]
      - [number, affected, data]
      - [category, sensitivity]
      - [risk, assessment, threshold]
      - [operational, criteria, risk]

