# Per-MUST fingerprint catalog for req:A.6.3:training_completion_register
#
# Used by rag/intake/leaf_driven_scan.py to back-bind existing approved
# findings to specific MUSTs they semantically satisfy but weren't tagged
# with at extraction time. The scanner only considers findings already
# attributed to the parent control (A.6.3) — never cross-control —
# and surfaces proposals to Stage-1 for HITL review.

schema_version: 1
target_evidence_requirement: "req:A.6.3:training_completion_register"
target_control: "A.6.3"
target_standard: "ISO27001:2022"

must_fingerprints:
  # Each MUST has 1+ excerpt_keyword sets. A finding's excerpt matches
  # if ANY one keyword set is fully present (all tokens in the set
  # found as substrings in the excerpt, case-insensitive).

  - must_id: "item:A.6.3:reg_personnel_id"
    description: "Per-row personnel identifier"
    excerpt_keywords:
      - [employee]
      - [staff]
      - [personnel]
      - [user, name]
      - [full, name]
      - [partner, name]
      - [trainee]

  - must_id: "item:A.6.3:reg_completion_date"
    description: "Per-row completion date"
    excerpt_keywords:
      - [completion, date]
      - [completion, time]
      - [date, delivered]
      - [completed, date]
      - [training, completed]
      - [completed]

  - must_id: "item:A.6.3:reg_module_id"
    description: "Per-row training module / course / programme identifier"
    excerpt_keywords:
      - [training, title]
      - [course, name]
      - [course, title]
      - [module, name]
      - [module, id]
      - [module, title]
      - [training, name]
      - [course, id]
      - [training, id]
      - [training, type]

  - must_id: "item:A.6.3:reg_score"
    description: "Per-row assessment score"
    excerpt_keywords:
      - [score]
      - [grade]
      - [assessment, result]
      - [evaluation, result]
      - [assessment, score]
      - [test, result]
      - [pass, fail]

  - must_id: "item:A.6.3:reg_next_due"
    description: "Per-row next-due date"
    excerpt_keywords:
      - [next, due]
      - [next, review]
      - [next, training]
      - [next, date]
      - [renewal, date]
      - [refresh, date]

  - must_id: "item:A.6.3:reg_status"
    description: "Per-row current / overdue / waived status"
    excerpt_keywords:
      - [overall, status]
      - [training, status]
      - [completion, status]
      - [status]
      - [acknowledgment, statement]
      - [acknowledgement, statement]
