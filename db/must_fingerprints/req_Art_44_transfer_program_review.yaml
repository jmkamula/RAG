# Per-MUST fingerprint catalog for req:Art.44:transfer_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.44:transfer_program_review"
target_control: "Art.44"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.44:rev_silent_transfer_sweep"
    description: "Silent-transfer sweep — verify no new vendor or service-shape change created an unflagged transfer"
    excerpt_keywords:
      - [silenttransfer, sweep]
      - [transfer, reviewed]
      - [vendor, transfer, change]
      - [service, shape, change]
      - [unflagged, transfer]
      - [next, review]

  - must_id: "item:Art.44:rev_mechanism_validity"
    description: "Mechanism-validity sample — Art.45 adequacy decisions, Art.46 SCCs, Art.47 BCRs all current versions / approvals"
    excerpt_keywords:
      - [adequacy, decision]
      - [standard, contractual, clauses]
      - [binding, corporate, rules]
      - [mechanism, validity]
      - [current, version]
      - [approval, status]

  - must_id: "item:Art.44:rev_register_currency"
    description: "Register currency — every flagged transfer in last-assessment freshness window"
    excerpt_keywords:
      - [transfer, review, date]
      - [last, assessment, window]
      - [flagged, transfer, register]
      - [review, currency]
      - [assessment, freshness, period]

  - must_id: "item:Art.44:rev_reviewer"
    description: "Reviewer identity (DPO + legal counsel + procurement)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, review]
      - [legal, counsel, review]
      - [procurement, reviewer]
      - [review, conducted]

  - must_id: "item:Art.44:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [reviewed, periodically]

