      - [sig, subscription, basis]
      - [sig, named, individual, attendance]
      - [sig, community, access]

  - must_id: "item:A.5.6:topics_shared"
    description: "Topics or threat categories that drive each engagement"
    excerpt_keywords:
      - [sig, topic, column]
      - [sig, threat, category]
      - [sig, drives, engagement]

  - must_id: "item:A.5.6:last_engaged"
    description: "Last-engaged date per entry"
    excerpt_keywords:
      - [sig, last, engaged]
      - [sig, event, attended, date]
      - [sig, briefing, received, date]

  - must_id: "item:A.5.6:owner"
