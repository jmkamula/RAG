# Per-MUST fingerprint catalog for req:Art.43:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.43:applicable_scope"
target_control: "Art.43"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.43:scope_jurisdictions"
    description: "Jurisdictions covered"
    excerpt_keywords:
      - [covered, jurisdictions]
      - [applicable, jurisdictions]
      - [scope, jurisdiction]
      - [jurisdiction, coverage]
      - [territories, covered]

  - must_id: "item:Art.43:scope_accreditation"
    description: "Accreditation scope + source (SA / NAB)"
    excerpt_keywords:
      - [accreditation, scope]
      - [scope, source]
      - [certification, body, accreditation]
      - [national, accreditation, body]
      - [scope, defined, accreditation]
      - [scope, accredited, standard]

  - must_id: "item:Art.43:scope_schemes_issued"
    description: "Schemes the body issues against"
    excerpt_keywords:
      - [certification, schemes, issued]
      - [scope, schemes, body]
      - [schemes, issued, against]
      - [certification, body, scope]

