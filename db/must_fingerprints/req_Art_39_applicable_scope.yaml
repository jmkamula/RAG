# Per-MUST fingerprint catalog for req:Art.39:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.39:applicable_scope"
target_control: "Art.39"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.39:scope_additional_tasks"
    description: "Additional tasks beyond Art.39.1 (if any) consistent with Art.38.6 no-conflict-of-interest rule"
    excerpt_keywords:
      - [additional, tasks]
      - [art38, conflict, interest]
      - [data, protection, officer]
      - [tasks, beyond, art39]
      - [no, conflict, interest]

  - must_id: "item:Art.39:scope_risk_prioritisation"
    description: "Risk-based prioritisation criteria (per Art.39.2 due regard to risk)"
    excerpt_keywords:
      - [risk based, prioritisation criteria]
      - [due regard, risk]
      - [art39, tasks, risk]
      - [risk assessment, prioritisation]
      - [data protection officer, risk]
      - [prioritise, tasks, risk]

  - must_id: "item:Art.39:scope_tasks_assigned"
    description: "Tasks formally assigned to DPO (mapping to Art.39.1 a-e)"
    excerpt_keywords:
      - [tasks, assigned, dpo]
      - [duties, data, protection, officer]
      - [responsibilities, dpo, defined]
      - [art39, tasks, assigned]
      - [data, protection, officer, scope]
      - [dpo, mandate, tasks]

