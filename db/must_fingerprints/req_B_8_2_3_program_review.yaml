      - [isolation, audit]
      - [marketing, systems, verified]
      - [owncontroller, pii]
      - [audit, marketing, pii]
      - [verified, use, pii]

  - must_id: "item:B.8.2.3:rev_reviewer"
    description: "Reviewer identity (DPO + Marketing Lead)"
    excerpt_keywords:
