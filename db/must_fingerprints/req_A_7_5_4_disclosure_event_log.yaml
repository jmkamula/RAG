  - must_id: "item:A.7.5.4:reg_timestamp"
    description: "Timestamp per row"
    excerpt_keywords:
      - [timestamp, record]
      - [disclosure, timestamp]
      - [pii, timestamp]
      - [event, timestamp]
      - [logged, timestamp]
