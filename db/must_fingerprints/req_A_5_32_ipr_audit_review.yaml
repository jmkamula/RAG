# Per-MUST fingerprint catalog for req:A.5.32:ipr_audit_review
#
# Reviewed-from-skeleton 2026-06-14. IPR audit review record.

schema_version: 1
target_evidence_requirement: "req:A.5.32:ipr_audit_review"
target_control: "A.5.32"
target_standard: "ISO27001:2022"

must_fingerprints:
