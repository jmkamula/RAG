      - [licence, audit, by, procurement]
      - [legal, ipr, audit]
      - [engineering, ipr, audit]

  - must_id: "item:A.5.32:audit_entitlement"
    description: "Entitlement check"
    excerpt_keywords:
      - [licence, entitlement, check]
      - [deployed, seats, vs, licence]
      - [licence, allowance, audit]
      - [licence, exception, remediated]

  - must_id: "item:A.5.32:audit_opensource"
    description: "Open-source attribution and licence-obligation check"
    excerpt_keywords:
