    description: "Audit date within the planned interval"
    excerpt_keywords:
      - [ipr, audit, date]
      - [ipr, audit, cadence]
      - [licence, audit, date]

  - must_id: "item:A.5.32:audit_reviewer"
    description: "Reviewer identity and role (procurement / legal / engineering)"
    excerpt_keywords:
