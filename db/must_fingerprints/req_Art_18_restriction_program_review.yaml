# Per-MUST fingerprint catalog for req:Art.18:restriction_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.18:restriction_program_review"
target_control: "Art.18"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.18:rev_art19_compliance"
    description: "Art.19 notification compliance — recipient notifications fired for new/lifted restrictions"
    excerpt_keywords:
      - [notification, recipient]
      - [restriction, processing]
      - [art19, notification]
      - [recipient, notified]
      - [restriction, lifted]
      - [notification, compliance]

  - must_id: "item:Art.18:rev_exception_compliance"
    description: "Exception compliance — restricted records only used per Art.18.2 exceptions"
    excerpt_keywords:
      - [exception, compliance]
      - [restricted, records]
      - [art18, exceptions]
      - [restriction, processing]
      - [review, exception]
      - [compliance, review]

  - must_id: "item:Art.18:rev_active_restrictions"
    description: "Active-restrictions check — every active row still has a valid Art.18.1 ground"
    excerpt_keywords:
      - [active, restriction]
      - [restriction, valid, ground]
      - [art18, restriction]
      - [restriction, review, date]
      - [reviewed, restriction]
      - [restriction, status]

  - must_id: "item:Art.18:rev_reviewer"
    description: "Reviewer identity (DPO + ops lead)"
    excerpt_keywords:
      - [reviewer identity]
      - [dpo and ops]
      - [reviewed by dpo]
      - [ops lead reviewer]
      - [reviewer role]
      - [reviewer and dpo]

  - must_id: "item:Art.18:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [review, within, interval]
      - [next, review]
      - [review, scheduled]
      - [review, period]

