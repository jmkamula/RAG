schema_version: 1
target_evidence_requirement: "req:A.6.4:disciplinary_case_register"
target_control: "A.6.4"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.4:reg_closure_date"
    description: "Per-case closure date"
    excerpt_keywords:
      - [case, closure, date]
      - [disciplinary, case, closed]
      - [closure, date, recorded]
      - [case, closure, timestamp]
      - [case, closed]
      - [closure, date, entry]

  - must_id: "item:A.6.4:reg_decision_authority"
    description: "Per-case decision authority (named role)"
    excerpt_keywords:
      - [decision, authority]
      - [named, role]
      - [case, decision]
      - [disciplinary, decision, authority]
      - [decision, maker, role]

  - must_id: "item:A.6.4:reg_action_taken"
    description: "Per-case action taken (matches the action_range categories; 'no action' is a valid outcome where investigation didn't substantiate)"
    excerpt_keywords:
      - [disciplinary, action, taken]
      - [case, action, recorded]
      - [action, range, category]
      - [investigation, outcome, action]
      - [no, action, recorded]

  - must_id: "item:A.6.4:reg_investigation_outcome"
    description: "Per-case investigation outcome (substantiated / not-substantiated / partially-substantiated)"
    excerpt_keywords:
      - [investigation, outcome]
      - [case, investigation, result]
      - [substantiated, notsubstantiated]
      - [partiallysubstantiated, investigation]
      - [disciplinary, case, outcome]

  - must_id: "item:A.6.4:reg_violation_type"
    description: "Per-case violation type (matches the procedure's violation_scope categories)"
    excerpt_keywords:
      - [violation, type]
      - [case, violation]
      - [disciplinary, violation, category]
      - [violation, scope]
      - [register, violation, type]

  - must_id: "item:A.6.4:reg_case_id"
    description: "Per-case unique identifier (anonymised externally; internal traceability to personnel record preserved)"
    excerpt_keywords:
      - [case, unique, identifier]
      - [disciplinary, case, register]
      - [case, id, record]
      - [anonymised, external]
      - [internal, traceability, personnel]

