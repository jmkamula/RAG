# Per-MUST fingerprint catalog for req:Art.36:consultation_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.36:consultation_program_review"
target_control: "Art.36"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.36:rev_advice_handling"
    description: "Advice handling sample — SA written advice incorporated or formally rejected with rationale recorded"
    excerpt_keywords:
      - [written, advice]
      - [advice, formally, rejected]
      - [rationale, recorded]
      - [advice, incorporated]
      - [sample, advice, handling]

  - must_id: "item:Art.36:rev_waiting_compliance"
    description: "Waiting-period compliance — no processing started before SA waiting period elapsed"
    excerpt_keywords:
      - [waiting, period]
      - [prior, consultation]
      - [processing, started]
      - [waiting, period, elapsed]
      - [compliance, waiting]
      - [consultation, period]

  - must_id: "item:Art.36:rev_escalation_audit"
    description: "Escalation audit — every Art.35 DPIA flagging residual high risk has a corresponding Art.36 consultation row"
    excerpt_keywords:
      - [art36, prior, consultation]
      - [escalation, audit]
      - [art35, dpia, residual, risk]
      - [consultation, record]
      - [review, escalation]
      - [high, risk, flag]

  - must_id: "item:Art.36:rev_reviewer"
    description: "Reviewer identity (DPO + legal)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, legal]
      - [review, conducted]
      - [review, performed]
      - [data, protection, officer]

  - must_id: "item:Art.36:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

