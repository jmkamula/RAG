      - [isms, manager]
      - [lead, auditor]
      - [review, manager]
      - [corrective, action, review]

  - must_id: "item:10.2:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

