    description: "ISMS-change pattern check — high-volume NC areas drove 6.3 ISMS changes where systemic causes warranted it"
    excerpt_keywords:
      - [nc change, pattern check]
      - [isms change, systemic cause]
      - [corrective action, review date]
      - [nonconformity, trend analysis]
      - [change pattern, high volume]
      - [reviewed, corrective action]

  - must_id: "item:10.2:rev_recurrence_check"
    description: "Recurrence check — closed NCs sampled for whether the same nature recurred (effectiveness failure signal)"
    excerpt_keywords:
      - [recurrence, check]
      - [closed, nonconformity]
      - [corrective, action, effectiveness]
      - [sampled, nonconformity]
      - [reviewed, recurrence]
      - [effectiveness, failure, signal]

  - must_id: "item:10.2:rev_root_cause_quality"
    description: "Root-cause-quality sample — sampled NCs reviewed for blame-free systemic analysis (not 'human error' as the only cause)"
    excerpt_keywords:
      - [rootcause, analysis]
      - [nonconformity, reviewed]
      - [systemic, analysis]
      - [blamefree, approach]
      - [corrective, action]
      - [sampled, nonconformities]

  - must_id: "item:10.2:rev_closure_progress"
    description: "Closure-progress check — open NCs aging beyond expected closure time escalated"
    excerpt_keywords:
