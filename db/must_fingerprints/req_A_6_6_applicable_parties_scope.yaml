# Per-MUST fingerprint catalog for req:A.6.6:applicable_parties_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.6.6:applicable_parties_scope"
target_control: "A.6.6"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.6:scope_jurisdictions"
    description: "Jurisdictions covered (where signatories sign / where info is protected — drives governing-law clause and enforceability)"
    excerpt_keywords:
      - [jurisdictions, covered]
      - [applicable, jurisdictions]
      - [governing, law, clause]
      - [enforceability, agreement]
      - [signatories, jurisdiction]
      - [scope, jurisdiction]

  - must_id: "item:A.6.6:scope_variant_mapping"
    description: "Party-to-variant mapping (employees → light employee NDA; contractors → contractor NDA; suppliers → bilateral; M&A → heavy)"
    excerpt_keywords:
      - [party, nda]
      - [employee, nda]
      - [contractor, nda]
      - [supplier, nda]
      - [m&a, nda]
      - [confidentiality, agreement]

  - must_id: "item:A.6.6:scope_trigger_threshold"
    description: "Trigger threshold per category (which info-class triggers NDA — typically access to confidential class and above; some orgs all-access)"
    excerpt_keywords:
      - [trigger, threshold]
      - [information, classification]
      - [confidential, access]
      - [nda, trigger]
      - [applicable, parties]
      - [access, level]

  - must_id: "item:A.6.6:scope_party_categories"
    description: "Party categories enumerated (employees, contractors, suppliers, visitors, M&A counterparties, partners with joint-development)"
    excerpt_keywords:
      - [party, categories]
      - [employees, contractors]
      - [suppliers, visitors]
      - [joint, development, partners]
      - [m&a, counterparties]

