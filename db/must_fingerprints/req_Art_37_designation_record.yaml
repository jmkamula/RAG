# Per-MUST fingerprint catalog for req:Art.37:designation_record
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.37:designation_record"
target_control: "Art.37"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.37:reg_publication_evidence"
    description: "Per-row publication evidence (privacy notice URL + SA notification confirmation)"
    excerpt_keywords:
      - [publication, evidence]
      - [privacy, notice, url]
      - [notification, confirmation]
      - [data, protection, officer]
      - [designation, record]

  - must_id: "item:Art.37:reg_employment_type"
    description: "Per-row employment type (internal staff / external service contract)"
    excerpt_keywords:
      - [employment, type]
      - [internal, staff]
      - [external, service, contract]
      - [per, row]
      - [designation, record]

  - must_id: "item:Art.37:reg_designation_date"
    description: "Per-row designation date"
    excerpt_keywords:
      - [designation, date]
      - [dpo, designation, record]
      - [designation, timestamp]
      - [appointed, date]

  - must_id: "item:Art.37:reg_qualifications_evidence"
    description: "Per-row qualifications evidence (CV / certifications / professional experience)"
    excerpt_keywords:
      - [qualifications, evidence]
      - [curriculum, vitae]
      - [professional, experience]
      - [certifications, provided]
      - [dpo, qualifications]
      - [evidence, record]

  - must_id: "item:Art.37:reg_dpo_identity"
    description: "DPO identity per row"
    excerpt_keywords:
      - [dpo, identity]
      - [data, protection, officer]
      - [designation, record]
      - [dpo, contact, details]
      - [officer, name, record]
      - [dpo, assigned, per]

