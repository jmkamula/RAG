# Per-MUST fingerprint catalog for req:Art.32:program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.32:program_review"
target_control: "Art.32"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.32:rev_iso_alignment"
    description: "ISO 27001 alignment — implementing controls (A.5.24/A.8.x) still in force; any reductions challenged for Art.32 impact"
    excerpt_keywords:
      - [iso27001, alignment]
      - [implementing, controls]
      - [controls, a524]
      - [controls, a8]
      - [reductions, challenged]
      - [art32, impact]

  - must_id: "item:Art.32:rev_register_currency"
    description: "Register currency — every Art.30 RoPA activity covered with current measures"
    excerpt_keywords:
      - [register, currency]
      - [ropa, activity, current]
      - [art32, security, measures]
      - [art30, register, updated]
      - [processing, activity, current]
      - [security, measures, reviewed]

  - must_id: "item:Art.32:rev_appropriateness"
    description: "Appropriateness re-assessment — measures still proportionate given current threat landscape and tech state-of-art"
    excerpt_keywords:
      - [appropriateness, reassessment]
      - [security, measures, proportionate]
      - [threat, landscape, review]
      - [technology, state, art]
      - [reviewed, annually]
      - [risk, assessment]

  - must_id: "item:Art.32:rev_reviewer"
    description: "Reviewer identity (DPO + CISO + Risk lead)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, review]
      - [ciso, reviewer]
      - [risk, lead, review]
      - [security, program, review]
      - [reviewed, dpo]

  - must_id: "item:Art.32:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

