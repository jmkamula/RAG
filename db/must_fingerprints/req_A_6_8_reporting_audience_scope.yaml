schema_version: 1
target_evidence_requirement: "req:A.6.8:reporting_audience_scope"
target_control: "A.6.8"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.8:scope_jurisdictions"
    description: "Jurisdictions covered (whistleblower-protection law variations — EU Whistleblower Directive, US Sarbanes-Oxley, sectoral protections)"
    excerpt_keywords:
      - [covered, jurisdictions]
      - [whistleblower, protection, law]
      - [eu, whistleblower, directive]
      - [us, sarbanesoxley]
      - [sectoral, protections]
      - [applicable, jurisdictions]

  - must_id: "item:A.6.8:scope_sensitive_paths"
    description: "Sensitive-case escalation paths stated (insider-threat suspicion → InfoSec-only intake bypassing line management; whistleblower-territory → independent intake)"
    excerpt_keywords:
      - [escalation, path]
      - [insiderthreat, intake]
      - [whistleblower, independent, intake]
      - [bypassing, line, management]
      - [sensitivecase, escalation]
      - [informationsecurity, event, reporting]

  - must_id: "item:A.6.8:scope_channel_surfacing"
    description: "Channel-surfacing per segment (employees see it in onboarding training + intranet; contractors see it at onboarding briefing; visitors see it in lobby; customers in T&Cs)"
    excerpt_keywords:
      - [information, security, event, reporting]
      - [channel, surfacing, segment]
      - [employees, onboarding, training]
      - [contractors, onboarding, briefing]
      - [visitors, lobby, information]
      - [customers, terms, conditions]

  - must_id: "item:A.6.8:scope_audience_segments"
    description: "Audience segments enumerated (employees, contractors, suppliers' staff with access, visitors, customers in some sectors — anyone who might observe an event)"
    excerpt_keywords:
      - [audience, segments]
      - [employees, contractors]
      - [suppliers, staff]
      - [visitors, customers]
      - [access, observe]
      - [event, reporting]

