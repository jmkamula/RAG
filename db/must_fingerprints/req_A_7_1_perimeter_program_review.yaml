# Per-MUST fingerprint catalog for req:A.7.1:perimeter_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.1:perimeter_program_review"
target_control: "A.7.1"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.7.1:rev_register_update"
    description: "Changes propagated to the live register"
    excerpt_keywords:
      - [periodic, review]
      - [register, update]
      - [review, date]
      - [changes, propagated]
      - [live, register]
      - [review, register]

  - must_id: "item:A.7.1:rev_scope_check"
    description: "Cross-check against the applicable-sites scope — any new site or sub-let that should add a register entry"
    excerpt_keywords:
      - [periodic, perimeter, review]
      - [scope, applicable, sites]
      - [new, site, entry]
      - [sublet, register, entry]
      - [crosscheck, scope]
      - [site, scope, register]

  - must_id: "item:A.7.1:rev_walkthrough"
    description: "Physical walkthrough conducted per site (sample-based for multi-site orgs) — barriers verified present and functional"
    excerpt_keywords:
      - [physical, walkthrough]
      - [site, barriers]
      - [barriers, verified]
      - [periodic, review]
      - [walkthrough, conducted]
      - [sample, site]

  - must_id: "item:A.7.1:rev_reviewer"
    description: "Reviewer identity (Facilities lead + InfoSec lead jointly)"
    excerpt_keywords:
      - [reviewer, identity]
      - [facilities, lead]
      - [infosec, lead]
      - [reviewed, jointly]
      - [periodic, review]
      - [review, team]

  - must_id: "item:A.7.1:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [periodic, review]
      - [next, review]
      - [review, within, interval]

