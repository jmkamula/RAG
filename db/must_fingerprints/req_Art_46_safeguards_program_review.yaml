# Per-MUST fingerprint catalog for req:Art.46:safeguards_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.46:safeguards_program_review"
target_control: "Art.46"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.46:rev_supplementary_audit"
    description: "Supplementary measures audit — applied measures (encryption keys, pseudonymisation, etc.) actually in place at vendor"
    excerpt_keywords:
      - [supplementary, measures, audit]
      - [encryption, keys, applied]
      - [pseudonymisation, measures, vendor]
      - [audit, review, vendor]
      - [measures, actually, in place]

  - must_id: "item:Art.46:rev_tia_currency"
    description: "TIA currency — TIAs refreshed where third-country law has changed materially"
    excerpt_keywords:
      - [thirdcountry, law, changed]
      - [transfer, impact, assessment]
      - [reviewed, annually]
      - [tia, refreshed]
      - [appropriate, safeguards]
      - [material, change, law]

  - must_id: "item:Art.46:rev_sccs_version"
    description: "SCCs version audit — any old-version SCCs identified for migration"
    excerpt_keywords:
      - [sccs, version]
      - [standard contractual clauses, version]
      - [sccs, audit]
      - [contractual clauses, migration]
      - [review, sccs, version]
      - [identified, oldversion, sccs]

  - must_id: "item:Art.46:rev_reviewer"
    description: "Reviewer identity (DPO + legal counsel)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, legal, counsel]
      - [reviewed, dpo]
      - [reviewed, legal]
      - [review, conducted]

  - must_id: "item:Art.46:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [reviewed, periodically]
      - [review, schedule]

