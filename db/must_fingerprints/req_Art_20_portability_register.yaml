schema_version: 1
target_evidence_requirement: "req:Art.20:portability_register"
target_control: "Art.20"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.20:reg_delivery_date"
    description: "Per-row delivery date (within Art.12.3 SLA)"
    excerpt_keywords:
      - [delivery, date]
      - [request, delivery, date]
      - [portability, request, date]
      - [recorded, delivery, date]
      - [sla, delivery, date]

  - must_id: "item:Art.20:reg_destination"
    description: "Per-row destination (export to subject / direct controller transmission)"
    excerpt_keywords:
      - [destination, export]
      - [data, portability, destination]
      - [subject, data, destination]
      - [direct, controller, destination]
      - [export, controller]

  - must_id: "item:Art.20:reg_format_delivered"
    description: "Per-row delivered format"
    excerpt_keywords:
      - [delivered, format]
      - [data, portability, format]
      - [requested, format]
      - [format, provided]
      - [record, delivered, format]

  - must_id: "item:Art.20:reg_applicability_decision"
    description: "Per-row applicability decision (in-scope / out-of-scope with grounds)"
    excerpt_keywords:
      - [applicability, decision]
      - [in scope, grounds]
      - [out scope, grounds]
      - [portability, request, register]
      - [scope, determination]

  - must_id: "item:Art.20:reg_request_id"
    description: "Per-row request id (Art.12 register cross-reference)"
    excerpt_keywords:
      - [request, id]
      - [portability, request, reference]
      - [data, portability, id]
      - [request, identifier]
      - [register, request, id]

