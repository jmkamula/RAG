# Per-MUST fingerprint catalog for req:Art.27:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.27:applicable_scope"
target_control: "Art.27"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.27:scope_art27_2_exception"
    description: "Art.27.2 exception assessment (occasional processing + no special-category-large-scale + low risk → no representative needed)"
    excerpt_keywords:
      - [art27, exception, assessment]
      - [occasional, processing, exception]
      - [no, representative, needed]
      - [specialcategory, large, scale]
      - [decision, recorded]
      - [low, risk, processing]

  - must_id: "item:Art.27:scope_member_state_target"
    description: "MS targeted (Art.27.3 — representative MUST be in one of these)"
    excerpt_keywords:
      - [member, state, target]
      - [representative, located, member]
      - [controller, processor, representative]
      - [not, established, union]
      - [art27, representative, member]
      - [targeted, member, state]

  - must_id: "item:Art.27:scope_establishment"
    description: "Establishment analysis — where the controller/processor is established + why Art.3.2 applies (offering goods/services OR monitoring behaviour in Union)"
    excerpt_keywords:
      - [controller, established]
      - [processor, established]
      - [offering, goods, services]
      - [monitoring, behaviour]
      - [article, 3.2, applies]
      - [establishment, union]

