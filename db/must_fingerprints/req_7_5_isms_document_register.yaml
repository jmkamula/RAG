# Per-MUST fingerprint catalog for req:7.5:isms_document_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:7.5:isms_document_register"
target_control: "7.5"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:7.5:reg_classification"
    description: "Information classification per row (cross-link to A.5.12)"
    excerpt_keywords:
      - [document, classification]
      - [information, classification, level]
      - [classification, category]
      - [document, register, classification]
      - [classification, per, record]

  - must_id: "item:7.5:reg_next_review"
    description: "Next review date per row (drives staleness alerts)"
    excerpt_keywords:
      - [next, review, date]
      - [document, register, review]
      - [review, date, record]
      - [scheduled, next, review]
      - [review, due, date]

  - must_id: "item:7.5:reg_approval_date"
    description: "Last approval date per row"
    excerpt_keywords:
      - [approval, date]
      - [document, approval, date]
      - [last, approval, date]
      - [approval, date, recorded]

  - must_id: "item:7.5:reg_version"
    description: "Current version per row"
    excerpt_keywords:
      - [document, version]
      - [current, version]
      - [version, number]
      - [version, record]
      - [document, revision]
      - [revision, number]

  - must_id: "item:7.5:reg_owner"
    description: "Document owner per row"
    excerpt_keywords:
      - [document, owner]
      - [owner, per, row]
      - [responsible, document]
      - [document, custodian]
      - [record, owner]
      - [assigned, document, owner]

  - must_id: "item:7.5:reg_title"
    description: "Document title per row"
    excerpt_keywords:
      - [document, title]
      - [title, per, record]
      - [record, document, title]
      - [document, name]
      - [title, column]
      - [document, register]

  - must_id: "item:7.5:reg_doc_id"
    description: "Unique document identifier per row"
    excerpt_keywords:
      - [document, identifier]
      - [unique, document, id]
      - [document, reference]
      - [document, register]
      - [record, document, id]

