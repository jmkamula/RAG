# Per-MUST fingerprint catalog for req:A.7.3.2:notice_artifact_register
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.3.2:notice_artifact_register"
target_control: "A.7.3.2"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.3.2:reg_signoff"
    description: "DPO + Legal signoff per version"
    excerpt_keywords:
      - [dpo, signoff]
      - [legal, approval]
      - [version, signed]
      - [signoff, record]
      - [dpo, legal, approval]

  - must_id: "item:A.7.3.2:reg_version_effective"
    description: "Version + effective date per row"
    excerpt_keywords:
      - [version, effective, date]
      - [record, version, date]
      - [effective, date, column]
      - [version, number, date]

  - must_id: "item:A.7.3.2:reg_field_coverage"
    description: "Field coverage per row (which A.7.3.2 fields the notice covers)"
    excerpt_keywords:
      - [pii, principal, field]
      - [notice, covers, information]
      - [covered, pii, data]
      - [per, row, field]
      - [information, relating, principal]

  - must_id: "item:A.7.3.2:reg_audience"
    description: "Target audience per row (public / customer / employee / minor / EU / US / etc.)"
    excerpt_keywords:
      - [target, audience]
      - [audience, per, row]
      - [pii, principal]
      - [public, customer]
      - [employee, minor]
      - [eu, us]

  - must_id: "item:A.7.3.2:reg_notice_id"
    description: "Unique notice identifier per row"
    excerpt_keywords:
      - [notice, identifier]
      - [unique, notice, id]
      - [notice, id, column]
      - [per, row, notice]
      - [record, notice, id]

