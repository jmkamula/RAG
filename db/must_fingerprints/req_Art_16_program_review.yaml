# Per-MUST fingerprint catalog for req:Art.16:program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.16:program_review"
target_control: "Art.16"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.16:rev_art19_audit"
    description: "Art.19 audit — recipient notifications fired (or exceptions documented)"
    excerpt_keywords:
      - [art19, audit]
      - [recipient, notification]
      - [notification, exceptions]
      - [audit, exceptions, documented]
      - [review, art19, notifications]

  - must_id: "item:Art.16:rev_systems_completeness"
    description: "Systems-completeness check — sampled requests reached every system in scope"
    excerpt_keywords:
      - [systems, completeness, check]
      - [sampled, requests, systems]
      - [requests, reached, systems]
      - [systems, scope]
      - [review, systems, completeness]
      - [completeness, check, sampled]

  - must_id: "item:Art.16:rev_sla_compliance"
    description: "SLA compliance (Art.12.3 one-month)"
    excerpt_keywords:
      - [sla, compliance]
      - [response, within, one, month]
      - [rectification, request, response]
      - [review, sla, compliance]
      - [art16, rectification, sla]

  - must_id: "item:Art.16:rev_reviewer"
    description: "Reviewer identity (DPO)"
    excerpt_keywords:
      - [reviewer, identity]
      - [data, protection, officer]
      - [reviewed, dpo]
      - [dpo, responsible]
      - [review, conducted, dpo]
      - [reviewer, contact, details]

  - must_id: "item:Art.16:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [review, within, interval]
      - [next, review]
      - [reviewed, period]
      - [review, schedule]

