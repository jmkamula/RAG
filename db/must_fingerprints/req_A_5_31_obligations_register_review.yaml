# Per-MUST fingerprint catalog for req:A.5.31:obligations_register_review
#
# Reviewed-from-skeleton 2026-06-14. Review-record patterns for the
# legal/regulatory obligations register audit cycle.

schema_version: 1
target_evidence_requirement: "req:A.5.31:obligations_register_review"
target_control: "A.5.31"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.31:rev_date"
    description: "Review date within the planned interval (within 6 months of last review)"
    excerpt_keywords:
      - [obligations, register, review, date]
      - [reviewed, obligations, on]
      - [6, month, review]
      - [obligations, reviewed, on]

  - must_id: "item:A.5.31:rev_reviewer"
    description: "Reviewer identity and role recorded (compliance lead with legal-counsel sign-off where material)"
    excerpt_keywords:
      - [compliance, lead, reviewed]
      - [legal, counsel, sign, off]
      - [obligations, reviewed, by]
      - [reviewer, compliance, lead]

  - must_id: "item:A.5.31:rev_per_entry"
    description: "Per-entry outcome (verified / amended / retired / new added)"
    excerpt_keywords:
      - [per, entry, outcome]
      - [obligation, verified]
      - [obligation, amended]
      - [obligation, retired]
      - [new, obligation, added]
      - [per, obligation, decision]

  - must_id: "item:A.5.31:rev_register_update"
    description: "Changes propagated back to the live register"
    excerpt_keywords:
      - [register, updated, after, review]
      - [register, change, log]
      - [obligations, register, refreshed]
      - [propagated, to, register]

  - must_id: "item:A.5.31:rev_horizon"
    description: "Forward-looking section — obligations entering force in the next 12-24 months"
    excerpt_keywords:
      - [horizon, scan]
      - [obligations, entering, force]
      - [forthcoming, regulation]
      - [12, 24, months, horizon]
      - [upcoming, regulation]

  - must_id: "item:A.5.31:rev_scope_check"
    description: "Cross-check against the applicable-obligations scope"
    excerpt_keywords:
      - [scope, cross, check]
      - [applicability, cross, check]
      - [scope, change, since, last]
      - [new, applicability, identified]
