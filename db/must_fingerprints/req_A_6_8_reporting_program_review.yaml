# Per-MUST fingerprint catalog for req:A.6.8:reporting_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.6.8:reporting_program_review"
target_control: "A.6.8"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.8:rev_register_update"
    description: "Changes propagated to the procedure / scope with reference to this review"
    excerpt_keywords:
      - [periodic, review]
      - [review, update]
      - [procedure, change]
      - [scope, change]
      - [review, reference]
      - [update, propagated]

  - must_id: "item:A.6.8:rev_acknowledgment_rate"
    description: "Acknowledgment rate to reporters (where reporter known) — drives reporter satisfaction and ongoing willingness to report"
    excerpt_keywords:
      - [acknowledgment, rate]
      - [reporter, satisfaction]
      - [willingness, report]
      - [periodic, review]
      - [event, reporting]
      - [acknowledgment, reporters]

  - must_id: "item:A.6.8:rev_triage_handoff"
    description: "Triage handoff check — every report reached A.5.25 triage; no reports lost in the handoff; cycle time from report to triage measured"
    excerpt_keywords:
      - [triage, handoff]
      - [report, triage, cycle]
      - [no, reports, lost]
      - [triage, check]
      - [cycle, time, measured]

  - must_id: "item:A.6.8:rev_channel_mix"
    description: "Channel-mix analysis (which channels are being used; under-used channels may need awareness promotion or retirement)"
    excerpt_keywords:
      - [channel, mix, analysis]
      - [underused, channels]
      - [channel, usage, review]
      - [awareness, promotion]
      - [channel, performance]
      - [periodic, report, review]

  - must_id: "item:A.6.8:rev_volume_trend"
    description: "Volume trend analysis (report rate per segment — sudden drops may indicate under-reporting; sudden spikes may indicate a campaign or a known issue surfacing)"
    excerpt_keywords:
      - [volume, trend, analysis]
      - [report, rate, segment]
      - [sudden, drops, reporting]
      - [sudden, spikes, issue]
      - [trend, volume, report]
      - [analysis, report, segment]

  - must_id: "item:A.6.8:rev_reviewer"
    description: "Reviewer identity (InfoSec lead + HR partner; Legal for whistleblower-territory cases)"
    excerpt_keywords:
      - [reviewer, identity]
      - [information, security, lead]
      - [hr, partner]
      - [legal, reviewer]
      - [whistleblower, cases]

  - must_id: "item:A.6.8:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, scheduled]
      - [review, period]
      - [review, frequency]

