      - [transfers, not, authorised]
      - [disclosures, not, authorised]
      - [absent, art49, derogation]

  - must_id: "item:Art.48:scope_agreements"
    description: "International agreements catalogued (US-EU MLAT, sector-specific agreements)"
    excerpt_keywords:
      - [international, agreements]
      - [us, eu, mlat]
      - [sector, specific, agreements]
      - [agreements, catalogued]
      - [transfers, not, authorised]
      - [foreign, authority, scope]

  - must_id: "item:Art.48:scope_authority_types"
    description: "Foreign authority types in scope (law enforcement / national security / tax / regulatory)"
    excerpt_keywords:
      - [foreign, authority, types]
      - [law, enforcement]
      - [national, security]
      - [tax, authority]
      - [regulatory, authority]
      - [scope]

