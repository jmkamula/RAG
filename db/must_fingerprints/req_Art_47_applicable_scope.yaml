# Per-MUST fingerprint catalog for req:Art.47:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.47:applicable_scope"
target_control: "Art.47"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.47:scope_extension"
    description: "New-entity onboarding rule — how a newly-acquired or newly-spun-up entity joins the BCRs (or moves to alternative safeguard)"
    excerpt_keywords:
      - [newlyacquired, entity]
      - [newlyspunup, entity]
      - [entity, joins, bcr]
      - [scope, applies, entity]
      - [alternative, safeguard]
      - [onboarding, process]

  - must_id: "item:Art.47:scope_entities"
    description: "Bound entities enumerated (jurisdictions + roles)"
    excerpt_keywords:
      - [binding, corporate, rules]
      - [applicable, jurisdictions]
      - [covered, entities]
      - [roles, included]
      - [scope, bound, entities]
      - [entities, within, scope]

  - must_id: "item:Art.47:scope_intra_group_flows"
    description: "Intra-group flows covered (controller-to-controller / controller-to-processor)"
    excerpt_keywords:
      - [intra group, data flows]
      - [controller to controller]
      - [controller to processor]
      - [covered intra group]
      - [scope intra group]
      - [intra group, processing activities]

