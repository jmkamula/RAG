# Per-MUST fingerprint catalog for req:Art.10:criminal_data_program_review
#
# Reviewed-from-skeleton 2026-06-14. GDPR Art.10 program review.

schema_version: 1
target_evidence_requirement: "req:Art.10:criminal_data_program_review"
target_control: "Art.10"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.10:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [criminal, data, review, date]
      - [art, 10, program, reviewed, on]

  - must_id: "item:Art.10:rev_reviewer"
    description: "Reviewer identity (DPO + legal counsel)"
    excerpt_keywords:
      - [criminal, data, reviewed, by, dpo]
      - [criminal, data, legal, counsel, review]

  - must_id: "item:Art.10:rev_law_currency"
    description: "Member State law currency check"
    excerpt_keywords:
      - [member, state, law, currency]
      - [criminal, ms, law, in, force]
      - [new, ms, authorisation, criminal]

  - must_id: "item:Art.10:rev_access_audit"
    description: "Access audit"
    excerpt_keywords:
      - [criminal, data, access, audit]
      - [restricted, access, criminal]
      - [no, broad, access, criminal, data]

  - must_id: "item:Art.10:rev_retention_audit"
    description: "Retention audit"
    excerpt_keywords:
      - [criminal, data, retention, audit]
      - [past, retention, criminal, purged]
      - [criminal, data, retention, limit, audit]
