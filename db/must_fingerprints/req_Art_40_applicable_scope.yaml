# Per-MUST fingerprint catalog for req:Art.40:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.40:applicable_scope"
target_control: "Art.40"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.40:scope_excluded"
    description: "Codes considered but not adhered to (rationale)"
    excerpt_keywords:
      - [codes, not, adhered]
      - [excluded, code]
      - [code, conduct, excluded]
      - [codes, considered, excluded]
      - [scope, excludes, codes]

  - must_id: "item:Art.40:scope_chosen_codes"
    description: "Codes chosen for adherence with rationale"
    excerpt_keywords:
      - [codes, chosen]
      - [adherence, codes]
      - [codes, rationale]
      - [chosen, justification]
      - [scope, codes]
      - [applicable, codes]

  - must_id: "item:Art.40:scope_sector_codes"
    description: "Sector codes available (cloud, healthcare, advertising, etc.)"
    excerpt_keywords:
      - [sector, codes]
      - [applicable, code, scope]
      - [codes, conduct]
      - [industry, codes]
      - [code, conduct]
      - [sector, specific, codes]

