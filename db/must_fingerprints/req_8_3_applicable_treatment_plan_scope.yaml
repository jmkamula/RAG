# Per-MUST fingerprint catalog for req:8.3:applicable_treatment_plan_scope
#
# Reviewed-from-skeleton 2026-06-14. ISMS clause 8.3 scope note.

schema_version: 1
target_evidence_requirement: "req:8.3:applicable_treatment_plan_scope"
target_control: "8.3"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:8.3:scope_active_items"
    description: "Active treatment items in scope enumerated"
    excerpt_keywords:
      - [active, treatment, items]
      - [treatment, current, cycle]
      - [active, risk, treatment, list]

  - must_id: "item:8.3:scope_deferred_items"
    description: "Deferred items listed with deferral rationale"
    excerpt_keywords:
      - [deferred, treatment, items]
      - [treatment, deferral, rationale]
      - [deferred, treatment, next, cycle]

  - must_id: "item:8.3:scope_accepted_items"
    description: "Accepted-residual items listed"
    excerpt_keywords:
      - ["6.1.3"]
      - [accepted, residual, risk]
      - [residual, signed, off]
      - [accepted, risk, no, treatment]
