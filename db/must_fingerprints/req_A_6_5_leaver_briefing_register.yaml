schema_version: 1
target_evidence_requirement: "req:A.6.5:leaver_briefing_register"
target_control: "A.6.5"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.6.5:reg_obligations_covered"
    description: "Per-row covered obligations list (confidentiality + IP + non-poach + non-compete where applicable per jurisdiction)"
    excerpt_keywords:
      - [covered, obligations]
      - [confidentiality, agreement]
      - [intellectual, property]
      - [non, compete]
      - [non, poach]
      - [jurisdiction, applicable]

  - must_id: "item:A.6.5:reg_acknowledgment"
    description: "Per-row signed acknowledgment evidence (digital signature / signed PDF / recorded receipt of intranet artefact)"
    excerpt_keywords:
      - [signed, acknowledgment]
      - [digital, signature]
      - [signed, pdf]
      - [recorded, receipt]
      - [acknowledgment, evidence]
      - [leaver, briefing, register]

  - must_id: "item:A.6.5:reg_briefer"
    description: "Per-row briefer identity (HR partner; line manager joins for role-change cases)"
    excerpt_keywords:
      - [briefer, identity]
      - [hr, partner]
      - [line, manager]
      - [role, change]
      - [leaver, briefing]
      - [briefing, register]

  - must_id: "item:A.6.5:reg_briefing_date"
    description: "Per-row briefing date (typically last working day or shortly after; for role change, at point of role transition)"
    excerpt_keywords:
      - [briefing, date]
      - [last, working, day]
      - [role, transition]
      - [date, recorded]
      - [employee, departure]
      - [change, employment]

  - must_id: "item:A.6.5:reg_trigger"
    description: "Per-row trigger (termination / contract end / role change within org / retirement)"
    excerpt_keywords:
      - [termination, date]
      - [contract, end]
      - [role, change]
      - [employee, leaving]
      - [retirement, date]
      - [leaver, record]

  - must_id: "item:A.6.5:reg_leaver_id"
    description: "Per-row leaver identifier (links to identity register A.5.16; cross-link to A.5.11 return-of-assets record + A.5.16 identity revocation)"
    excerpt_keywords:
      - [leaver, identifier]
      - [identity, register]
      - [return, assets]
      - [revocation, record]
      - [leaver, reference]
      - [assets, return, record]

