# Per-MUST fingerprint catalog for req:A.5.18:access_rights_register

schema_version: 1
target_evidence_requirement: "req:A.5.18:access_rights_register"
target_control: "A.5.18"
target_standard: "ISO27001:2022"

must_fingerprints:
