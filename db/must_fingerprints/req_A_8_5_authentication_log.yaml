# Per-MUST fingerprint catalog for req:A.8.5:authentication_log
#
# Reviewed-from-skeleton 2026-06-14. Authentication monitoring log.

schema_version: 1
target_evidence_requirement: "req:A.8.5:authentication_log"
target_control: "A.8.5"
target_standard: "ISO27001:2022"

must_fingerprints:
