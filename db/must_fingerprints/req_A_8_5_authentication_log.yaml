  - must_id: "item:A.8.5:log_impossible_travel"
    description: "Impossible-travel / geo-anomaly detection"
    excerpt_keywords:
      - [impossible, travel]
      - [geo, anomaly, authentication]
      - [auth, geo, anomaly, detection]

  - must_id: "item:A.8.5:log_mfa_anomalies"
    description: "MFA-prompt fatigue / push-bombing detection"
    excerpt_keywords:
      - [mfa, prompt, fatigue]
      - [push, bombing, detection]
      - [mfa, anomaly, detection]

  - must_id: "item:A.8.5:log_retention"
    description: "Retention period defined and enforced"
