# Per-MUST fingerprint catalog for req:A.7.2.1:applicable_scope
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.7.2.1:applicable_scope"
target_control: "A.7.2.1"
target_standard: "ISO27701:2019"

must_fingerprints:
  - must_id: "item:A.7.2.1:scope_exclusions"
    description: "Out-of-scope activities (anonymous analytics, aggregate reporting) with rationale"
    excerpt_keywords:
      - [outofscope, activities]
      - [anonymous, analytics]
      - [aggregate, reporting]
      - [scope, exclusions]
      - [excluded, activities]
      - [rationale, provided]

  - must_id: "item:A.7.2.1:scope_pii_test"
    description: "Operational test for 'involves PII processing' (identifiability + processing operation)"
    excerpt_keywords:
      - [involves, pii, processing]
      - [personal, identifiable, information]
      - [scope, processing, activities]
      - [processing, operation, pii]
      - [applicable, processing, scope]

  - must_id: "item:A.7.2.1:scope_activities"
    description: "In-scope processing activities enumerated"
    excerpt_keywords:
      - [processing, activities]
      - [scope]
      - [scope, activities]
      - [applicable, processing]
      - [activities, enumerated]

