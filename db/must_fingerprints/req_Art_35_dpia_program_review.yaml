schema_version: 1
target_evidence_requirement: "req:Art.35:dpia_program_review"
target_control: "Art.35"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.35:rev_review_cadence"
    description: "Review-cadence audit — DPIAs refreshed per Art.35.11 when processing changed"
    excerpt_keywords:
      - [dpia, review]
      - [review, cadence]
      - [processing, changed]
      - [art35, dpia]
      - [dpia, refreshed]

  - must_id: "item:Art.35:rev_art36_audit"
    description: "Art.36 escalation audit — residual-high-risk DPIAs escalated to SA where required"
    excerpt_keywords:
      - [art36, escalation, audit]
      - [residual, high, risk, dpia]
      - [dpia, escalated, supervisory, authority]
      - [audit, dpia]
      - [escalation, sa]
      - [reviewed, escalation]

  - must_id: "item:Art.35:rev_advice_quality"
    description: "DPO-advice quality sample — advice substantive, not rubber-stamp"
    excerpt_keywords:
      - [dpo, advice, quality]
      - [advice, substantive, review]
      - [review, dpo, feedback]
      - [advice, rubberstamp, avoid]
      - [quality, sample, assessment]

  - must_id: "item:Art.35:rev_coverage"
    description: "Coverage check — every in-scope activity has a current DPIA OR documented Art.35.5 white-list justification"
    excerpt_keywords:
      - [coverage, dpia]
      - [inscope, activity, dpia]
      - [documented, article, 355]
      - [dpia, current]
      - [whitelist, justification]
      - [art35, coverage]

  - must_id: "item:Art.35:rev_reviewer"
    description: "Reviewer identity (DPO + executive sponsor + lead privacy engineer)"
    excerpt_keywords:
      - [reviewer, identity]
      - [dpo, reviewer]
      - [executive, sponsor]
      - [lead, privacy, engineer]
      - [review, dpo]
      - [review, sponsor, identity]

  - must_id: "item:Art.35:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [review, date]
      - [planned, interval]
      - [next, review]
      - [review, within, interval]
      - [review, scheduled]
      - [review, period]

