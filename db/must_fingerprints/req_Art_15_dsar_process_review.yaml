# Per-MUST fingerprint catalog for req:Art.15:dsar_process_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:Art.15:dsar_process_review"
target_control: "Art.15"
target_standard: "GDPR:2016/679"

must_fingerprints:
  - must_id: "item:Art.15:rev_identity_pair_30"
    description: "Bidirectional Art.15 ↔ Art.30 RoPA pair check — every system the review period's DSARs actually queried is captured in the data flow inventory; every system the inventory lists was reachable when DSAR"
    excerpt_keywords:
      - [dsar, review]
      - [data, flow, inventory]
      - [system, reachable]
      - [review, period]
      - [inventory, drift]
      - [access, request]

  - must_id: "item:Art.15:rev_corrective"
    description: "Corrective actions to the procedure with owner and target date"
    excerpt_keywords:
      - [corrective, actions]
      - [action, owner, date]
      - [procedure, corrective, review]
      - [target, date, action]
      - [review, corrective, actions]

  - must_id: "item:Art.15:rev_defects"
    description: "Defects identified (late responses, refusals, supervisory-authority complaints) referenced"
    excerpt_keywords:
      - [defects, identified]
      - [late, responses]
      - [supervisory, authority, complaints]
      - [refusals, recorded]
      - [review, defects]
      - [data, subject, access]

  - must_id: "item:Art.15:rev_timing"
    description: "Timing metric — percentage within one month, count of extensions used, count of late responses"
    excerpt_keywords:
      - [response, within, one, month]
      - [extensions, used]
      - [late, responses]
      - [percentage, responses, timely]
      - [count, extensions]
      - [response, time, metric]

  - must_id: "item:Art.15:rev_volume"
    description: "Volume metric — number of DSARs received in the review period"
    excerpt_keywords:
      - [dsar, volume]
      - [number, dsars, received]
      - [review, period, dsar]
      - [dsar, requests, count]
      - [volume, dsars]
      - [dsar, received, during]

  - must_id: "item:Art.15:rev_reviewer"
    description: "Reviewer identity and role (DPO, privacy lead, or delegated equivalent)"
    excerpt_keywords:
      - [reviewer, identity]
      - [reviewer, role]
      - [dpo, reviewer]
      - [privacy, lead]
      - [delegated, equivalent]

  - must_id: "item:Art.15:rev_date"
    description: "Review date within the planned interval (typically within 12 months of last review)"
    excerpt_keywords:
      - [review, date]
      - [next, review]
      - [reviewed, annually]
      - [review, interval]
      - [periodic, review]
      - [within, months]

