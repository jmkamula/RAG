# Per-MUST fingerprint catalog for req:A.5.37:procedures_program_review
#
# Reviewed-from-skeleton 2026-06-14. Operating-procedures program audit.

schema_version: 1
target_evidence_requirement: "req:A.5.37:procedures_program_review"
target_control: "A.5.37"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.37:rev_date"
    description: "Review date within the planned interval"
    excerpt_keywords:
      - [operating, procedures, review, date]
      - [procedures, program, reviewed, on]

  - must_id: "item:A.5.37:rev_reviewer"
    description: "Reviewer identity (operations lead + InfoSec lead)"
    excerpt_keywords:
      - [operating, procedures, reviewed, by]
