# Per-MUST fingerprint catalog for req:A.5.37:procedures_program_review
# LLM-authored by Ship 80'.b (curator sweep 2026-08-18).
# Pure LLM-authored keywords + rescued Ship 38'.b curator
# additions if present. Skeleton heuristics from
# gen_leaf_scan_catalog were intentionally discarded.

schema_version: 1
target_evidence_requirement: "req:A.5.37:procedures_program_review"
target_control: "A.5.37"
target_standard: "ISO27001:2022"

must_fingerprints:
  - must_id: "item:A.5.37:rev_register_update"
    description: "Changes propagated back to the live register with reference to this review"
    excerpt_keywords:
      - [register, update]
      - [review, reference]
      - [changes, propagated]
      - [periodic, review]
      - [live, register]
      - [review, date]

  - must_id: "item:A.5.37:rev_emergency_review"
    description: "Emergency-use procedure review — confirmed available and accurate for DR/incident scenarios (these are the procedures where stale = catastrophic)"
    excerpt_keywords:
      - [emergency, procedure, review]
      - [disaster, recovery, procedure]
      - [incident, response, plan]
      - [reviewed, annually]
      - [procedure, availability, confirmed]
      - [accuracy, emergency, procedure]

  - must_id: "item:A.5.37:rev_accuracy_sample"
    description: "Accuracy sampling — operator walked through a sample procedure end-to-end? procedure matches current system reality (UI screenshots current, commands work, dependencies still valid)"
    excerpt_keywords:
      - [accuracy, sampling]
      - [procedure, matches, system]
      - [operator, walked, sample]
      - [review, procedure, accuracy]
      - [system, reality, current]
      - [ui, screenshots, current]

  - must_id: "item:A.5.37:rev_scope_check"
    description: "Cross-check against the applicable-facilities scope — any new system / SaaS environment / facility class that should add procedures"
    excerpt_keywords:
      - [scope, applicable, facilities]
      - [new, system, scope]
      - [saas, environment, scope]
      - [facility, class, scope]
      - [procedures, scope, check]
      - [scope, crosscheck, procedures]

  - must_id: "item:A.5.37:rev_register_check"
    description: "Per-procedure outcome (verified / amended / retired / new added) with availability-mechanism-still-works confirmation"
    excerpt_keywords:
      - [periodic, review]
      - [operating, procedure, review]
      - [review, outcome]
      - [procedure, status]
      - [availability, confirmation]
      - [review, verified]

  - must_id: "item:A.5.37:rev_reviewer"
    description: "Reviewer identity and role recorded (operations lead + InfoSec lead jointly)"
    excerpt_keywords:
      - [reviewer, identity]
      - [reviewer, role]
      - [operations, lead]
      - [infosec, lead]
      - [review, conducted]
      - [review, lead]

  - must_id: "item:A.5.37:rev_date"
    description: "Review date within the planned interval (typically within 12 months of last review)"
    excerpt_keywords:
      - [review, date]
      - [next, review]
      - [reviewed, annually]
      - [review, interval]
      - [periodic, review]
      - [review, within, months]

