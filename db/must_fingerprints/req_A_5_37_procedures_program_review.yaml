      - [procedure, per, row, outcome]
      - [procedure, verified, amended, retired]
      - [procedure, new, added, audit]

  - must_id: "item:A.5.37:rev_register_update"
    description: "Changes propagated back to the live register"
    excerpt_keywords:
      - [procedures, register, updated, after, review]
