# Per-MUST fingerprint catalog for req:A.5.21:supply_chain_review
#
# Reviewed-from-skeleton 2026-06-14. ICT supply-chain review patterns.

schema_version: 1
target_evidence_requirement: "req:A.5.21:supply_chain_review"
target_control: "A.5.21"
target_standard: "ISO27001:2022"

must_fingerprints:
