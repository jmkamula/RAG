      - [isp, approving, role]
      - [isp, ceo, board, chair]
      - [delegated, authority, isp]

  - must_id: "item:5.2:app_scope_at_approval"
    description: "Scope statement (4.3) version that was in effect at approval"
    excerpt_keywords:
      - ["4.3"]
