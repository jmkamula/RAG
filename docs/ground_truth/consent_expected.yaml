  - must_id: item:Art.7:rev_register_currency
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: |
      No register-currency check against in-scope activities.
  - must_id: item:Art.7:rev_reviewer
    verdict: partial
    confidence: medium
    quote: Doc header "Reviewed by: PIMS Manager".
    notes: MUST wants DPO or Privacy Lead + product lead. Partial.
  - must_id: item:Art.7:rev_withdrawal_sla
    verdict: satisfies
    confidence: high
    quote: |
      Section 5: "Consent withdrawals must be processed promptly
