# Ship 77'.c — Consent Management Procedure Ground Truth (first pass)
#
# Method: same as ropa_expected.yaml. Refined principle applied:
# enumerate at LEAF level, not control level. A.5.34 bulk treatment
# for this doc is justified because the consent doc doesn't build
# a PII processing register (unlike RoPA which does).
#
# Doc-note: Section 1 cites "ISO/IEC 27701:2019 control A.7.5.5"
# which doesn't exist. Correct refs are A.7.2.3 (consent obtaining),
# A.7.3.4 (withdrawal), A.7.3.5 (objection). Scored against all three.
#
# Wrong-mechanism note: A.7.3.5 (objection) is Art.21 mechanism —
# different from consent withdrawal (Art.7.3). Doc's opt-out language
# is CCPA/CPRA opt-out ≠ Art.21 objection. Most A.7.3.5 MUSTs are
# not_satisfies for that reason (wrong mechanism, not wrong artefact).

document:
  upload_id: 10287fa5-f757-420b-98a4-ee9e34d02d25
  filename: Consent Management Procedure.docx
  extracted_by: claude_first_pass
  extracted_at: 2026-08-17
  markdown_chars: 5945
  doc_type: procedure

# ── Art.7 (GDPR — Conditions for consent) ────────────────────────────
# 4 leaves × 20 MUSTs. This is the doc's PRIMARY target.

art_7_expected:

  # req:Art.7:applicable_activities_scope — 3 MUSTs
  - must_id: item:Art.7:scope_consent_activities
    verdict: satisfies
    confidence: high
    quote: |
      Section 2 enumerates: "Non-essential cookies", "Newsletter",
      "Other voluntary activities" — consent-required. Also lists
      non-consent bases (essential cookies + contact forms +
      legitimate interest).
  - must_id: item:Art.7:scope_overlap_rules
    verdict: partial
    confidence: medium
    quote: |
      Section 2: "The organization distinguishes between processing
      that relies on consent and processing that relies on other
      lawful bases." Distinguishes but no explicit overlap rules.
  - must_id: item:Art.7:scope_special_overlay
    verdict: partial
    confidence: medium
    quote: |
      Section 2: "special category data (Art. 9(2)(a) GDPR for
      special categories)". Recognizes but doesn't detail stricter
      capture requirements.

  # req:Art.7:consent_management_procedure — 6 MUSTs
  - must_id: item:Art.7:capture_mechanism
    verdict: satisfies
    confidence: high
    quote: |
      Section 3 principles (freely given / specific / informed /
      unambiguous / documented / revocable) + Section 4 Steps 1-3
      capture lifecycle.
  - must_id: item:Art.7:demonstrability
    verdict: satisfies
    confidence: high
    quote: |
      Section 6 Consent Register Fields: "Date/Time of Consent",
      "Method of Consent", "version of the consent text and policy".
  - must_id: item:Art.7:distinguishable
    verdict: partial
    confidence: medium
    quote: |
      Section 3 lists principles but doesn't explicitly say the
      consent request must be distinguishable from other matters
      (Art.7.2 requirement for separate, clear-language statement).
  - must_id: item:Art.7:no_conditionality
    verdict: satisfies
    confidence: high
    quote: |
      Section 3: "Freely given: Not tied to unrelated services or terms".
  - must_id: item:Art.7:owner
    verdict: satisfies
    confidence: high
    quote: Doc header "Owner: DPO".
  - must_id: item:Art.7:withdrawal_mechanism
    verdict: satisfies
    confidence: medium
    quote: |
      Section 5 + Withdrawal section: "clear and accessible opt-out
      link or contact method" + multiple channels. Doesn't
