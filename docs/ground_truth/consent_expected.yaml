# ── A.7.3.5 (ISO 27701 — Providing mechanism to object) ──────────────
# 4 leaves × 19 MUSTs.
# WRONG MECHANISM: A.7.3.5 is about Art.21 objection — different
# legal mechanism from Art.7.3 consent withdrawal (which A.7.3.4
# covers). Consent doc's "opt-out" language is CCPA/CPRA, not Art.21.
# Most A.7.3.5 MUSTs are not_satisfies for wrong-mechanism reasons,
# not wrong-artefact reasons.

a_7_3_5_expected:

  # req:A.7.3.5:applicable_scope — 4 MUSTs
  - must_id: item:A.7.3.5:scope_legitimate_interests
    verdict: satisfies
    confidence: medium
    quote: |
      Section 2: "Essential cookies (Cloudflare, PHPSESSID):
      Processed on the basis of legitimate interest (Art. 6(1)(f))"
      + "Website contact form inquiries: Processed on the basis of
      legitimate interest". Accidental coverage — the consent doc
      enumerates non-consent bases while explaining scope.
  - must_id: item:A.7.3.5:scope_marketing_processing
    verdict: satisfies
    confidence: medium
    quote: |
      Section 2: "Newsletter or marketing communications ...
      Require consent prior to sending". Marketing enumerated.
      Same accidental coverage.
  - must_id: item:A.7.3.5:scope_public_task
    verdict: not_satisfies
    confidence: high
    quote: ""
  - must_id: item:A.7.3.5:scope_research_stats
    verdict: not_satisfies
    confidence: high
    quote: ""

  # req:A.7.3.5:objection_procedure — 5 MUSTs
  # All wrong-mechanism.
  a_7_3_5_objection_procedure_bulk:
    verdict: not_satisfies
    confidence: high
    rationale: |
      Objection (Art.21) is a different mechanism from consent
      withdrawal (Art.7.3). Doc covers withdrawal, not objection.
      All 5 procedure MUSTs (absolute_objection, balancing_test,
      channel_consistency, information_provision, response_sla)
      not_satisfies/high.

  # req:A.7.3.5:objection_register — 5 MUSTs
  # Wrong-mechanism.
  a_7_3_5_objection_register_bulk:
    verdict: not_satisfies
    confidence: high
    rationale: |
      Consent register ≠ objection event register. All 5 register
      MUSTs (event_id, objection_type, propagation_status,
      resolution, subject_id, timestamp) not_satisfies/high.
      (Note: doc has consent event register, but that's for
      consent withdrawals under Art.7.3, not Art.21 objections.)

  # req:A.7.3.5:program_review — 5 MUSTs
  - must_id: item:A.7.3.5:rev_absolute_audit
