  - must_id: item:A.7.3.5:rev_notification_audit
    verdict: not_satisfies
    confidence: high
    quote: ""
  - must_id: item:A.7.3.5:rev_reviewer
    verdict: partial
    confidence: low
    quote: PIMS Manager.

# ── A.5.34 (ISO 27001 — Privacy and PII Protection) ──────────────────
# All 4 leaves wrong-artefact for a consent doc.
# Note: unlike RoPA, the consent doc does NOT build a PII processing
# register (per-activity view). Consent register ≠ PII processing
# register. Bulk not_satisfies is correct here.

a_5_34_expected:
  bulk_not_satisfies: all_27_musts
  rationale: |
    Consent doc is not a PII processing register (Consent Register
    is per-consent-record, not per-processing-activity — different
    grain), not a Privacy Policy, not an Applicability Scope
    statement, not a Program Review. Bulk not_satisfies/high.

