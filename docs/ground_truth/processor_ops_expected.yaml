# Ship 77'.c — Processor Operations Procedure Ground Truth (first pass)
#
# Compact format: 213 candidate MUSTs across 12 refs (Art.28 + 11 B.8.x).
# Doc explicitly cites each of these controls per section heading, so
# every one is in scope for measurement. Per-leaf verdicts + per-MUST
# only where individual verdicts diverge from the leaf-level pattern.
#
# The doc is SUBSTANTIALLY MORE DETAILED than DPIA/RoPA/Consent — it
# describes procedures + registers for 10 processor controls in
# depth. Coverage is high on procedure MUSTs and register field
# MUSTs; program-review MUSTs are usually not_satisfies (doc is a
# procedure, not a program-review artefact).
#
# Doc-typo note: Section 3 header says "A.8.3.1" and Section 4 says
# "A.8.3.2 / B.8.4.2". A.8.3.x doesn't exist; the intended refs are
# B.8.3.x (processor) mirrors. Scored against the correct B.8.x
# controls based on section CONTENT.

document:
  upload_id: 453c55b3-1863-4461-90cb-f7ad058029f2
  filename: Processor Operations Procedures.docx
  extracted_by: claude_first_pass
  extracted_at: 2026-08-17
  markdown_chars: 15408
  doc_type: procedure

# ── Art.28 (GDPR — Processor) ────────────────────────────────────────
# 4 leaves × 21 MUSTs. Doc's overarching GDPR anchor.

art_28_expected:

  # req:Art.28:applicable_processors_scope — 3 MUSTs
  # The doc IS the processor procedure itself; scope is stated in
  # Section 2 but doesn't build the processor-inventory artefact.
  - must_id: item:Art.28:scope_controller_vs_processor
    verdict: satisfies
    confidence: high
    quote: |
      Section 2: "Applies to all services where Arion Networks acts
      as a processor or subprocessor of personal data on behalf of
      a client (controller). Includes consulting services, SaaS
      tools, custom deployments, subprocessed workstreams..."
  - must_id: item:Art.28:scope_exclusions
    verdict: not_satisfies
    confidence: high
    quote: ""
  - must_id: item:Art.28:scope_processor_types
    verdict: partial
    confidence: medium
    quote: |
      Section 2 gives service types (consulting / SaaS / custom /
      subprocessed) but not per-processor-type coverage.

  # req:Art.28:data_processing_agreement — 8 MUSTs
  # DPA reference is in the doc (DOC065 mentioned in multiple places)
  # but the doc IS the procedure, not the DPA itself. DPA MUSTs are
  # about what the DPA covers. Doc references but doesn't build DPA.
  - must_id: item:Art.28:assistance
    verdict: satisfies
    confidence: high
    quote: |
      Section 6.2 (DPIA assistance), 8.1 (DSR platform capabilities),
      8.2 (support assistance). Comprehensive assistance framework.
  - must_id: item:Art.28:audit
    verdict: satisfies
    confidence: high
    quote: |
      Section 6.3 Audit Cooperation: "Customer audit rights per DPA
      ... Response time: Within 15 business days ... Remote audit:
      60 days notice, coordinated by DP&RM, max 2 days duration".
  - must_id: item:Art.28:confidentiality
    verdict: partial
    confidence: medium
    quote: |
      Section 3.1: "Staff with access to customer data are trained
      that data may only be used for documented purposes." Weak
      confidentiality reference — no explicit confidentiality
      obligations statement.
  - must_id: item:Art.28:deletion
    verdict: satisfies
    confidence: high
    quote: |
      Section 4: "complete and secure deletion of PII unless otherwise
      agreed" + 5-step procedure + 4.3 documentation.
  - must_id: item:Art.28:instructions
    verdict: satisfies
    confidence: high
    quote: |
      Section 6.1: "Documented instructions include DPA and service
      agreement, Customer's platform configuration and feature
      usage, Written requests..."
  - must_id: item:Art.28:rights
    verdict: satisfies
    confidence: high
    quote: |
      Section 8: "Obligations to PII Principals — Arion Networks
      provides customers with means to fulfill data subject requests"
      + platform capabilities + support assistance.
  - must_id: item:Art.28:security
    verdict: partial
    confidence: medium
    quote: |
      Section 3 log entries include "Security measures applied" +
      Section 4.2 return-transfer security measures. Not a
      comprehensive Art.32-equivalent statement.
  - must_id: item:Art.28:subprocessors
    verdict: satisfies
    confidence: high
    quote: |
      Section 11 (initial disclosure + new subprocessor notification)
      + Section 12 (change notification with 30-day objection window).

  # req:Art.28:processor_program_review — 5 MUSTs (mostly not_satisfies —
  # doc is procedure not review)
  - must_id: item:Art.28:rev_date
    verdict: partial
    confidence: low
    quote: |
      Doc-control header dates blank ("Reviewed on: [empty]",
      "Next Review Date: [empty]"). Doc mentions annual review
      generally but for Arion's OWN log, not for processor program.
  - must_id: item:Art.28:rev_dpa_currency
    verdict: not_satisfies
    confidence: high
    quote: ""
  - must_id: item:Art.28:rev_reviewer
    verdict: partial
    confidence: low
    quote: Doc header "Reviewed by: PIMS Manager".
  - must_id: item:Art.28:rev_security_currency
    verdict: not_satisfies
    confidence: high
    quote: ""
  - must_id: item:Art.28:rev_subprocessor_audit
    verdict: not_satisfies
    confidence: high
    quote: ""

  # req:Art.28:processor_register — 5 MUSTs (matches Section 3 log)
  - must_id: item:Art.28:reg_data_categories
    verdict: satisfies
    confidence: high
    quote: Section 3 log field "PII Categories: Data types involved".
  - must_id: item:Art.28:reg_dpa_version
    verdict: not_satisfies
    confidence: medium
    quote: ""
    notes: Log fields don't include DPA version + execution date per row.
  - must_id: item:Art.28:reg_processor_id
    verdict: satisfies
    confidence: high
    quote: Section 3 log field "Client ID + Customer Name".
  - must_id: item:Art.28:reg_security_check
    verdict: partial
    confidence: medium
    quote: |
      Log field "Security Controls" per row (encryption / segregation
      / MFA) but no explicit Art.32-equivalent assurance source.
  - must_id: item:Art.28:reg_subprocessors
    verdict: satisfies
    confidence: high
    quote: Section 3 log field "Subprocessors: Any used in processing chain".

