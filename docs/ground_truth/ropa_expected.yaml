# ── Self-review notes ────────────────────────────────────────────────
#
# Second-look issues caught:
#
#   1. Data flow inventory MUSTs — I called them all partial. The
#      RoPA fields provide the same raw data (systems, recipients,
#      transfers, retention). Is that enough to satisfy the
#      data_flow_inventory MUSTs, or is it "wrong artefact" like
#      A.5.34? I chose partial as the middle ground. Reviewer
#      should decide: are per-activity RoPA fields = data-flow
#      inventory? If NO, flip all 5 to not_satisfies.
#
#   2. Doc typo — Section 1 cites "ISO/IEC 27701:2019 A.8.2.1 and
#      A.8.2.2" which don't exist in the catalog. Correct refs
#      are A.7.2.1/2.2 (controller side) or B.8.2.1/2.2 (processor
#      side). I scored against A.7.2.8 + B.8.2.6 (the RoPA record
#      MUSTs) based on Section 2's dual-role scope claim. This
#      might be too generous — if the auditor rejects the doc's
#      typo, we'd only score against Art.30. Reviewer's call.
#
#   3. proc_dpa_gate on Art.30 — I called not_satisfies (Art.28
#      DPA gate not mentioned). But the doc has "Data Recipients"
#      + "Subprocessors" fields which implicitly require DPAs.
#      Weak — could be partial. Leaving as not_satisfies but flag.
#
#   4. Processor-side MUSTs (B.8.2.6) — the doc CLAIMS processor
#      scope (Section 2) but doesn't have processor-specific
#      fields except "Controller or Processor Role" flag. Most
#      B.8.2.6 MUSTs are correctly not_satisfies BECAUSE the doc's
#      processor coverage is nominal, not substantive. Consistent
#      with my A.5.34 wrong-artefact logic — the doc names the
#      scope but doesn't build the artefact.
#
# Low-confidence rows to review first:
#   - Art.30 dfi_* (5 MUSTs, partial/medium) — hinges on
#     policy question #1 above
#   - A.7.2.8:proc_secure_maintenance (partial/low)
#   - B.8.2.6:ropa_processing_categories (partial/low)
#   - B.8.2.6:ropa_processor_dpo (partial/low)
#   - B.8.2.6:scope_customer_engagements (partial/low)
#   - B.8.2.6:proc_onboarding_trigger (partial/low)
#   - B.8.2.6:proc_secure_maintenance (partial/low)
#
# Medium-confidence borderline calls:
#   - Art.30:processor_records (partial — doc claims processor
#     coverage but doesn't build the artefact)
#   - Art.30:rev_reviewer (partial — is single PIMS Manager OK?)
#   - A.7.2.8:ropa_owner + ropa_transfer_safeguards + rev_reviewer +
#     proc_retire_activity (partials)
#   - B.8.2.6:rev_reviewer (partial)
#
# Auditor policy questions:
#   - Does RoPA (per-activity view) also count as data flow
#     inventory (per-flow view)? Affects 5 MUSTs.
#   - Does a doc that CLAIMS scope but doesn't build the artefact
#     count as satisfying the scope MUSTs? Affects B.8.2.6.
#   - Are per-activity RoPA fields = per-activity register entries?
#     Affects most records_of_processing MUSTs.
