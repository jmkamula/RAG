# ── Self-review notes ────────────────────────────────────────────────
#
# Second-pass revisions applied (2026-08-17):
#
#   1. A.5.34:pii_processing_register (8 MUSTs) flipped from bulk
#      not_satisfies to per-MUST verdicts. This leaf IS the same
#      artefact as the RoPA. My first-pass bulk treatment for all
#      27 A.5.34 MUSTs was wrong — only 3 of the 4 leaves are
#      wrong-artefact. The register leaf directly overlaps with
#      Art.30's records_of_processing.
#      Impact: +7 satisfies, +1 partial, -8 not_satisfies.
#
#   2. Art.30:controller_name flipped from not_satisfies/high to
#      partial/medium. Section 1 line 21 identifies "Arion Networks
#      s.r.o." (controller name) + doc-header shows DPO exists.
#      Contact details missing → partial reflects the split.
#
# Second-look issues NOT changed but flagged:
#
#   3. Data flow inventory MUSTs — I called them all partial. The
#      RoPA fields provide the raw data (systems, recipients,
#      transfers, retention) but as per-activity, not per-flow.
#      Reviewer decides: does per-activity view count as data-flow
#      inventory? If strict-no, flip all 5 to not_satisfies. Analog
#      to the A.5.34:pii_processing_register question above but
#      different resolution — the register leaf IS the same
#      artefact, the flow inventory leaf arguably isn't.
#
#   4. Doc typo — Section 1 cites "ISO/IEC 27701:2019 A.8.2.1 and
#      A.8.2.2" (don't exist). Correct refs: A.7.2.x or B.8.2.x.
#      Scored A.7.2.8 + B.8.2.6 (the RoPA record MUSTs) based on
#      Section 2's dual-role claim + the fact that the doc IS a
#      RoPA regardless of typo. Consistent with the DPIA principle:
