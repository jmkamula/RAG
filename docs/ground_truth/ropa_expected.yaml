# ── A.5.34 bulk not_satisfies ────────────────────────────────────────
# RoPA procedure is NOT the privacy policy artefact. All 27 A.5.34
# MUSTs are wrong-artefact false positives. Enumerated for extractor
# diff usability.

a_5_34_expected:
  bulk_not_satisfies: all_27_musts
  rationale: |
    Same as DPIA: RoPA is a per-activity register procedure, not a
    Privacy Policy nor a Privacy Applicability Scope statement nor a
    Privacy Program Review. Any A.5.34 finding on this doc is a
    false positive for the extractor.
  # Full enumeration same as dpia_expected.yaml (see for the list).
  # Not repeated here to keep this file scannable; extractor
  # comparison scripts will treat all A.5.34 MUSTs as not_satisfies
  # for this doc by default.

