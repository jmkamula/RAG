# ── A.5.34 (ISO 27001 — Privacy and PII Protection) ──────────────────
# 4 leaves × 27 MUSTs. IMPORTANT SECOND-PASS CORRECTION:
#
# A.5.34 has 4 leaves. Only 3 of them are wrong-artefact for a RoPA:
#   - privacy_and_pii_protection_policy   (8 MUSTs) — wrong (policy)
#   - privacy_applicability_scope         (5 MUSTs) — wrong (scope stmt)
#   - privacy_program_review              (9 MUSTs) — wrong (program review)
#
# The 4th leaf — pii_processing_register (8 MUSTs) — IS THE SAME
# ARTEFACT as the RoPA. Its MUSTs directly overlap with Art.30's
# records_of_processing MUSTs. My first-pass bulk not_satisfies for
# all 27 was wrong — the register leaf gets per-MUST treatment.

a_5_34_expected:

  # req:A.5.34:pii_processing_register — 8 MUSTs
  # SAME ARTEFACT as RoPA. Per-MUST verdicts mirror Art.30 register
  # verdicts because MUST text is essentially the same.
  - must_id: item:A.5.34:pii_inventory
    verdict: satisfies
    confidence: high
    quote: RoPA field "Categories of PII: Types of personal data involved"
  - must_id: item:A.5.34:reg_controls_applied
    verdict: satisfies
    confidence: high
    quote: RoPA field "Technical & Organizational Measures"
  - must_id: item:A.5.34:reg_data_subjects
    verdict: satisfies
    confidence: high
    quote: RoPA field "Categories of Data Subjects"
  - must_id: item:A.5.34:reg_lawful_basis
    verdict: satisfies
    confidence: high
    quote: RoPA field "Legal Basis: Lawful basis (e.g. consent, contract, legal obligation)"
  - must_id: item:A.5.34:reg_owner_per_activity
    verdict: partial
    confidence: medium
    quote: |
      Section 5 Step 1: "business owner must notify the Data
      Protection & Risk Manager". Owner exists but not as a
      register field per activity.
  - must_id: item:A.5.34:reg_purposes
    verdict: satisfies
    confidence: high
    quote: RoPA field "Purpose of Processing"
  - must_id: item:A.5.34:reg_retention
    verdict: satisfies
    confidence: high
    quote: RoPA field "Retention Period"
  - must_id: item:A.5.34:reg_transfers
    verdict: satisfies
    confidence: high
    quote: RoPA field "International Transfers"

  # req:A.5.34:privacy_and_pii_protection_policy — 8 MUSTs
  # Wrong artefact: RoPA procedure ≠ privacy policy.
  a_5_34_privacy_policy_bulk_not_satisfies:
    verdict: not_satisfies
    confidence: high
    rationale: |
      RoPA doc is not the privacy policy artefact. Applicable
      MUSTs: applicable_laws, breach_handling, data_subject_rights,
      lawful_basis, owner, retention_minimisation,
      security_controls_ref, transfer_restrictions. All 8 →
      not_satisfies/high.

  # req:A.5.34:privacy_applicability_scope — 5 MUSTs
  # Wrong artefact. Note: scope_controller_role is borderline because
  # the RoPA has "Controller or Processor Role" per activity, which
  # is register-level not scope-statement-level. Reviewer may argue
  # it belongs in the register leaf. Left as not_satisfies for
  # consistency with the artefact classification.
  a_5_34_scope_bulk_not_satisfies:
    verdict: not_satisfies
    confidence: high
    rationale: |
      RoPA doc is not a Privacy Applicability Scope statement.
      Applicable MUSTs: scope_controller_role, scope_data_subjects,
      scope_jurisdictions, scope_privacy_laws,
      scope_regulated_activities. All 5 → not_satisfies/high.
      Reviewer flag: scope_controller_role is arguably captured by
      the RoPA "Controller or Processor Role" field — depends on
      whether that's a scope statement or a register annotation.

  # req:A.5.34:privacy_program_review — 9 MUSTs
  # Wrong artefact. RoPA has its own review (Section 5 Step 4 +
  # Section 7) but that reviews the RoPA REGISTER, not the whole
  # privacy program.
  a_5_34_program_review_bulk_not_satisfies:
    verdict: not_satisfies
    confidence: high
    rationale: |
      RoPA doc reviews itself, not the whole privacy program.
      Applicable MUSTs: rev_breach_history, rev_date, rev_dpia_review,
      rev_dsar_metrics, rev_register_check, rev_register_update,
      rev_reviewer, rev_scope_check, rev_transfer_validity. All 9 →
      not_satisfies/high.

