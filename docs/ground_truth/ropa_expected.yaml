# Ship 77'.c — RoPA Ground Truth (first pass, awaiting review)
#
# Method: same as dpia_expected.yaml. I walk every candidate MUST for
# Art.30 (main) + A.7.2.8 (27701 controller mirror) + B.8.2.6 (27701
# processor mirror) + A.5.34 (privacy program — bulk not_satisfies as
# wrong artefact). Each MUST classified as satisfies / partial /
# not_satisfies with quote + confidence.
#
# Doc-note: doc Section 1 cites "ISO/IEC 27701:2019 A.8.2.1 and A.8.2.2".
# Those refs don't exist in the catalog. Almost certainly a typo for
# B.8.2.1 + B.8.2.2 (processor purposes + customer agreement). The
# doc scope (Section 2) explicitly says "either PII Controller or
# Processor" so both A.7.2.8 (controller RoPA record) and B.8.2.6
# (processor RoPA record) are the correct ISO 27701 mirrors. That's
# what I score against.

document:
  upload_id: 28d9086c-37a1-4dce-b129-a3afd4e5bb18
  filename: Records of Processing Activities.docx
  extracted_by: claude_first_pass
  extracted_at: 2026-08-17
  n_sections: 8
  markdown_chars: 3600
  doc_type: procedure

# ── Art.30 (GDPR — Records of Processing Activities) ─────────────────
# 4 leaves × 24 MUSTs

art_30_expected:

  # req:Art.30:data_flow_inventory — 5 MUSTs
  # These MUSTs are about a data-flow-first inventory (per-flow view).
  # The RoPA is a per-activity view — different shape but overlapping
  # data. Section 4 RoPA fields include Systems, Recipients, Transfers,
  # Retention — those cover the RAW DATA but not the flow-inventory
  # ARTEFACT. Same logic as A.5.34 vs DPIA: overlapping content ≠
  # same artefact. I called these partial (not not_satisfies) because
  # RoPA fields DO contain the information; a lenient auditor might
  # accept RoPA as satisfying data flow inventory via double-duty.
  - must_id: item:Art.30:dfi_flows
    verdict: partial
    confidence: medium
    quote: |
      Section 4 lists "Systems Involved" + "Data Recipients" +
      "International Transfers" fields per activity. Provides the
      raw flow data but not organized as a flow inventory.

  - must_id: item:Art.30:dfi_recipients
    verdict: partial
    confidence: medium
    quote: RoPA field "Data Recipients: Internal or external recipients"

  - must_id: item:Art.30:dfi_retention
    verdict: partial
    confidence: medium
    quote: RoPA field "Retention Period: Timeframe for keeping the data"

  - must_id: item:Art.30:dfi_systems
    verdict: partial
    confidence: medium
    quote: RoPA field "System(s) Involved: Information systems where the processing occurs"

  - must_id: item:Art.30:dfi_transfers
    verdict: partial
    confidence: medium
    quote: RoPA field "International Transfers: Details of transfers outside the EU/EEA"

  # req:Art.30:records_of_processing — 9 MUSTs (the main register)
  - must_id: item:Art.30:categories_data
    verdict: satisfies
    confidence: high
    quote: RoPA field "Categories of PII: Types of personal data involved"

  - must_id: item:Art.30:categories_ds
    verdict: satisfies
    confidence: high
    quote: RoPA field "Categories of Data Subjects: Whose data is being processed"

  - must_id: item:Art.30:controller_name
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: |
      Art.30.1.a requires per-activity controller name + contact
      details + DPO. RoPA field list (Section 4) doesn't include
      any of these. Doc-header Owner: DPO is meta-header, not
      per-activity record.

  - must_id: item:Art.30:processor_records
    verdict: partial
    confidence: medium
    quote: |
      Section 2 Scope: "either PII Controller or Processor" +
      Section 4 field "Controller or Processor Role". Doc claims
      to cover processor side but processor-specific fields
      (customer instruction, Art.30.2.a-d requirements) aren't
      called out separately.

  - must_id: item:Art.30:purposes
    verdict: satisfies
    confidence: high
    quote: RoPA field "Purpose of Processing: Why the data is being processed"

  - must_id: item:Art.30:recipients
    verdict: satisfies
    confidence: high
    quote: RoPA field "Data Recipients"

  - must_id: item:Art.30:retention
    verdict: satisfies
    confidence: high
    quote: RoPA field "Retention Period"

  - must_id: item:Art.30:security
    verdict: satisfies
    confidence: high
    quote: RoPA field "Technical & Organizational Measures: Description of security and privacy controls"

  - must_id: item:Art.30:transfers
    verdict: satisfies
    confidence: high
    quote: RoPA field "International Transfers"

  # req:Art.30:ropa_annual_review — 5 MUSTs
  - must_id: item:Art.30:rev_date
    verdict: satisfies
    confidence: high
    quote: |
      Doc-control header "Next Review Date: 20 Nov 2026" +
      Section 7 "reviewed annually or upon regulatory change" +
      Section 5 Step 4 "Annually by default".

  - must_id: item:Art.30:rev_gaps
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: No mechanism for capturing gaps during review.

  - must_id: item:Art.30:rev_outcome
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: No per-activity review outcome (no change / amended / retired).

  - must_id: item:Art.30:rev_register_update
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: No explicit register-update propagation from review.

  - must_id: item:Art.30:rev_reviewer
    verdict: partial
    confidence: medium
    quote: |
      Doc-control header "Reviewed by: PIMS Manager" — single
      reviewer. MUST wants DPO / privacy lead / delegated
      equivalent. Borderline — PIMS Manager can be that
      delegated equivalent.

  # req:Art.30:ropa_maintenance_procedure — 5 MUSTs
  - must_id: item:Art.30:proc_dpa_gate
    verdict: not_satisfies
    confidence: high
    quote: ""
    notes: |
      Art.28 DPA gate not mentioned. Section 5 Step 4 mentions DPIA
      gate but not DPA (data processing agreement with new processor).

  - must_id: item:Art.30:proc_dpia_gate
    verdict: satisfies
    confidence: high
    quote: |
      Section 5 Step 4: "High-risk processing activities identified
      during RoPA review must undergo DPIA per DOC042H before
      implementation."

  - must_id: item:Art.30:proc_maintainer
    verdict: satisfies
    confidence: high
    quote: |
      Section 5 Step 1-3 "Data Protection & Risk Manager coordinates
      + notifies" — named maintainer role.

  - must_id: item:Art.30:proc_triggers
    verdict: satisfies
    confidence: high
    quote: |
      Section 5 Step 4: "Annually by default. Immediately if
      significant change occurs in processing, system, or legal
      basis" — triggers enumerated.

  - must_id: item:Art.30:proc_update_path
    verdict: satisfies
    confidence: high
    quote: |
      Section 5 Process (5 steps): Initiation → Data Collection →
      Documentation → Review → Audit & Reporting. Clear path from
      trigger to register entry.

