# ── Self-review findings ─────────────────────────────────────────────
#
# On second look I found:
#   1. Missing framework — added Art.36 (doc references it in
#      References but I had only scored Art.35 in first pass).
#   2. Confidence bump — Art.35:dpo_advice medium → high (DPO absent
#      from Section 5 Roles list; only in doc header as Owner).
#   3. Enumerated A.5.34 explicitly (was bulk_not_satisfies list-all
#      placeholder before) so extractor outputs can diff cleanly.
#   4. Flagged consistency issue — Art.35:art36_escalation called
#      satisfies but Art.36:trigger_detection called partial on the
#      SAME evidence. Reviewer should decide: either both satisfies
#      or both partial. My gut: both partial (loose Consult language
#      doesn't explicitly name Art.36).
#
# Low-confidence rows to review first:
#   - Art.35:rev_coverage (partial, confidence low)
#   - A.7.2.5:rev_coverage_check (partial, confidence low)
#   - Art.36:trigger_detection (partial, confidence low — see #4)
