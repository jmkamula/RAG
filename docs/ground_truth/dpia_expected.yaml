# Ship 77'.b — DPIA Ground Truth (first pass, awaiting review)
#
# Method: I (Claude) manually walked every candidate MUST for Art.35 +
# A.7.2.5 + A.5.34 (privacy program) against the doc's 165 lines / 6305
# chars. Each MUST classified as:
#
#   satisfies      — Doc contains substantive text meeting the MUST
#   partial        — Doc addresses the MUST but incompletely or ambiguously
#   not_satisfies  — Doc silent or contradicts the MUST
#
# `confidence` reflects how sure I am of the verdict (high / medium / low).
# Low-confidence rows are high-priority review items.
#
# Doc path: /data/uploads/00000000-0000-0000-0000-000000000001/5f59f505-....docx
# 9 sections + doc-control header. Purpose section explicitly cites Art.35 +
# A.7.2.5. References cite GDPR Art.35-36 + ISO 27701 A.7.2.5.
#
# Reviewer instructions: comment on any row (flip verdict, tighten quote,
# add notes). Aim: consensus verdict for each MUST. This becomes the
# absolute ground truth that both consensus + critic-verifier will be
# measured against.

