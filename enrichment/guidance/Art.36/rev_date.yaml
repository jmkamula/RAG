must_id: item:Art.36:rev_date
control_ref: Art.36
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Prior Consultation Program in a dated log or register.
- Confirm the review date falls within the interval specified in your documented review schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach supporting evidence, such as meeting minutes or a signed review checklist, to the review entry.
