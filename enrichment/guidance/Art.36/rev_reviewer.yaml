must_id: item:Art.36:rev_reviewer
control_ref: Art.36
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and the legal counsel.
- Record the date each reviewer completed their assessment in the program review documentation.
- Retain written confirmation, such as a signed or digitally acknowledged statement, from both the DPO
  and legal counsel that they have reviewed the prior consultation program.
- Avoid listing roles or teams only; ensure each reviewer is named as an individual, not just as "Legal"
  or "DPO team".
