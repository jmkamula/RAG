must_id: item:Art.36:reg_submission_date
control_ref: Art.36
standard_id: GDPR:2016/679
must_text: Per-row submission date to SA
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date each prior consultation was submitted to the Supervisory Authority in a dedicated
  column of the Prior Consultation Register.
- Name the person responsible for each submission, listing a specific individual rather than a team or
  department.
- Retain a copy of the submission confirmation or acknowledgment from the Supervisory Authority alongside
  each register entry.
- Cross-reference each register entry with the relevant Data Protection Impact Assessment to verify the
  timing and necessity of the consultation.
