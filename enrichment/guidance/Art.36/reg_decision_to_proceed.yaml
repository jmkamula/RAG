must_id: item:Art.36:reg_decision_to_proceed
control_ref: Art.36
standard_id: GDPR:2016/679
must_text: Per-row controller decision after SA advice (proceed / modify / abandon)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the supervisory authority's advice for each consultation entry, including the date and any specific
  recommendations received.
- Document the controller's decision for each row as "proceed," "modify," or "abandon," referencing the
  supervisory authority's advice.
- Name the individual controller who made each decision, avoiding generic labels like "the team" or "management."
- Date each controller decision to show when the response to the supervisory authority's advice was made.
- Retain any supporting documentation or correspondence that influenced the controller's decision for
  each entry.
