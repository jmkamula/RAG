must_id: item:Art.36:sa_advice_handling
control_ref: Art.36
standard_id: GDPR:2016/679
must_text: SA written advice handling — incorporated or formally rejected with rationale
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and content of the supervisory authority’s written advice received during prior consultation
  in a dedicated log or register.
- Document the specific decision to incorporate or formally reject each point of advice, including a clear
  rationale for any rejection.
- Name the individual who made the final decision on handling the advice, ensuring this is a specific
  person and not a group or department.
- Retain copies of all correspondence with the supervisory authority, including the original advice and
  any follow-up communications.
- Cross-reference each decision and rationale to the relevant section of your data processing documentation
  or risk assessment.
