must_id: item:A.5.13:rev_date
control_ref: A.5.13
standard_id: ISO27001:2022
must_text: Review date within the planned annual interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent labelling program review date in a central log, listing the specific day, month,
  and year.
- Name the individual responsible for scheduling and conducting the annual review, specifying their full
  name and job title.
- Document the planned next review date, confirming it falls within 12 months of the previous review.
- Retain a signed or approved record of the review meeting or decision, including all participants and
  the date.
- Avoid listing the review owner as a group or department; specify a single accountable person.
