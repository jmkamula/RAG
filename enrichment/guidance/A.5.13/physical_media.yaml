must_id: item:A.5.13:physical_media
control_ref: A.5.13
standard_id: ISO27001:2022
must_text: Physical media labelling rules (paper documents, removable storage, archive boxes; cross-link
  to A.7.10)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document labelling rules for all physical media types, including paper documents, removable storage,
  and archive boxes, in the Information Labelling Procedure.
- Cross-reference the Information Labelling Procedure to the physical media handling requirements described
  in your A.7.10 procedure or policy.
- Name the owner of the labelling procedure as a specific individual, not a team or department.
- Record the date of the most recent review and approval of the labelling procedure by the designated
  owner.
