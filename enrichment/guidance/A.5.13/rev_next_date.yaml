must_id: item:A.5.13:rev_next_date
control_ref: A.5.13
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the labelling program in the review documentation, using a specific
  calendar date.
- Record the name of the person responsible for scheduling the next review, not just a team or department.
- Document the date the current review was completed to show the review cycle is being followed.
- Attach evidence of management approval for the planned review date, such as a signed or emailed confirmation.
