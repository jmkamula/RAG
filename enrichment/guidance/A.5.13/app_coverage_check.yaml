must_id: item:A.5.13:app_coverage_check
control_ref: A.5.13
standard_id: ISO27001:2022
must_text: Coverage verification per record (sample re-checked post-enablement; legacy items remediated)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and name of the person who verified that each platform's labelling application is enabled
  and functioning as intended.
- Document a sample of items re-checked after labelling was enabled, including item identifiers, check
  dates, and verifier names.
- List all legacy items identified without correct labelling and describe the remediation actions taken,
  including completion dates.
- Name the responsible individual for ongoing labelling compliance, avoiding generic titles like "IT team"
  or "admins".
- Retain evidence of periodic spot checks and remediation activities, such as screenshots or logs, with
  clear timestamps.
