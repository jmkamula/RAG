must_id: item:A.5.13:reg_coverage_pct
control_ref: A.5.13
standard_id: ISO27001:2022
must_text: Coverage percentage per row (% of items in this system that carry a label — sampled or auto-measured)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the total number of items in each system and the number of items carrying a label in the Labelling
  Coverage Register.
- Calculate and enter the coverage percentage for each row, showing the proportion of labelled items out
  of the total items for that system.
- Date each entry and name the person responsible for the data, so the source of the coverage figures
  is clear.
- Attach or reference the sampling or measurement method used for each system, so the calculation process
  can be verified.
- Name the owner as a specific individual — not a team or department — for each system’s labelling coverage
  entry.
