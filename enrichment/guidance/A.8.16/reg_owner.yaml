must_id: item:A.8.16:reg_owner
control_ref: A.8.16
standard_id: ISO27001:2022
must_text: Per-detection named owner (detection engineer)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each detection use-case entry, avoiding generic labels like
  "the team" or "security department".
- Record the full name and job title of the assigned detection engineer next to each detection use-case
  in the register.
- Document the date when each owner was assigned responsibility for their respective detection use-case.
- Review and update the register whenever ownership changes, ensuring the current owner's details are
  always accurate and up to date.
