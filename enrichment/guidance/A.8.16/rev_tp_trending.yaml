must_id: item:A.8.16:rev_tp_trending
control_ref: A.8.16
standard_id: ISO27001:2022
must_text: True-positive rate trending review per detection
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the true-positive rate for each detection method in a dated monitoring review report, including
  calculations and data sources used.
- Chart the trend of true-positive rates over time for each detection, attaching visual graphs or tables
  to the review report.
- Assign a named individual to analyze and sign off on the interpretation of true-positive rate trends
  for each detection method.
- Record any actions or adjustments taken in response to negative or flat true-positive rate trends, including
  dates and responsible persons.
- Name the owner of the periodic monitoring review as a specific individual, not a team or department.
