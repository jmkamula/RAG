must_id: item:A.8.16:scope_exclusions
control_ref: A.8.16
standard_id: ISO27001:2022
must_text: Exclusion rationale + compensating controls
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all systems and areas excluded from monitoring, specifying each by name and location in a dated
  monitoring scope document.
- State the business or technical reason for each exclusion, referencing supporting evidence such as risk
  assessments or management decisions.
- Describe compensating controls implemented for each exclusion, including control type, responsible person,
  and date of implementation.
- Name the owner of the monitoring scope as a specific individual, not a team or department, in the documented
  scope.
- Obtain and retain formal approval of the monitoring scope, exclusions, and compensating controls, signed
  and dated by a senior manager.
