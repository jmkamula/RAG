must_id: item:A.8.16:alert_routing
control_ref: A.8.16
standard_id: ISO27001:2022
must_text: Alert routing to Security Operations / on-call (severity-tiered)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the alert routing process, showing how alerts are classified by severity and which team or
  individual receives each tier.
- Name the Security Operations or on-call responder for each severity level, listing specific individuals
  rather than generic roles or teams.
- Record the date and method of the most recent test of the alert routing procedure, including who verified
  the results.
- Attach a sample alert notification showing actual routing to the correct recipient based on severity.
