must_id: item:A.7.6:reg_purpose
control_ref: A.7.6
standard_id: ISO27001:2022
must_text: Per-session purpose (maintenance / audit / deep-clean / visitor / emergency)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific purpose for each secure area work session in the register, clearly stating if it
  is maintenance, audit, deep-clean, visitor, or emergency.
- Name the individual authorising each session’s purpose, ensuring the register lists a real person, not
  a role or department.
- Enter the date and time for every session alongside its purpose to provide a complete chronological
  record.
- Avoid using vague or generic session purposes like "work" or "access" in the register; specify the exact
  reason for entry each time.
