must_id: item:A.7.6:rev_next_date
control_ref: A.7.6
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Secure Work Program in the review schedule document, making
  sure the date is clearly visible and unambiguous.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a team or department.
- Document the date when the next review date was last updated, and retain this record alongside the review
  schedule.
- Cross-reference the review schedule with meeting minutes or calendar invites that confirm the next review
  date has been communicated to relevant stakeholders.
