must_id: item:A.7.6:reg_personnel
control_ref: A.7.6
standard_id: ISO27001:2022
must_text: Per-session personnel (including third parties, escorts, supervisors)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full names of all individuals present during each secure area work session, including employees,
  third parties, escorts, and supervisors.
- Document the date, start time, and end time for every secure area work session in the register.
- Assign a specific individual as the session supervisor and enter their name in the register for each
  session.
- Capture signatures or electronic acknowledgments from all listed personnel to confirm their attendance
  at each session.
- Avoid listing groups or roles such as "maintenance team" or "visitors"—enter each attendee’s name individually
  for every session.
