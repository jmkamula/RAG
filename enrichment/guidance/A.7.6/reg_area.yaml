must_id: item:A.7.6:reg_area
control_ref: A.7.6
standard_id: ISO27001:2022
must_text: Per-session secure area
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date, time, and purpose of each work session held in the secure area in the register immediately
  after the session concludes.
- List the full names of all individuals present during each session, including visitors and staff, in
  the session register.
- Assign a named session supervisor for each entry, ensuring the register identifies a specific individual
  rather than a generic role or team.
- Confirm each session entry is signed or electronically acknowledged by the session supervisor to verify
  accuracy and completeness.
- Cross-reference each session entry with relevant access logs or visitor sign-in sheets to demonstrate
  alignment with physical entry records.
