must_id: item:A.7.6:reg_session_id
control_ref: A.7.6
standard_id: ISO27001:2022
must_text: Per-session unique identifier
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique session identifier to each secure area work session and record it in the register at
  the start of the session.
- Document the session identifier alongside the session date, time, and names of all participants in the
  register entry.
- Cross-reference the session identifier in any related incident or access logs to maintain traceability
  between records.
- Avoid using generic or repeated identifiers; generate each session identifier so it cannot be confused
  with any other session.
