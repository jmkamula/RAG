must_id: item:B.8.2.6:rev_next_date
control_ref: B.8.2.6
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Processor RoPA Program in the program document or review
  log.
- Name the individual responsible for scheduling and conducting the next review, listing their full name
  and job title.
- Record the date this next review date was last set or updated, referencing the meeting minutes or approval
  email.
- Avoid leaving the next review date blank or marked as "TBD"—enter a specific calendar date.
