must_id: item:B.8.2.6:ropa_subprocessor_list
control_ref: B.8.2.6
standard_id: ISO27701:2019
must_text: Subprocessor list per row (Art.30.2 + Art.28.2)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each subprocessor as a separate row in your Records of Processing Activities, including their full
  legal name and contact details.
- Document the specific processing activities each subprocessor performs, matching these to the relevant
  data processing purpose.
- State the lawful basis and contract reference for each subprocessor, linking to the signed agreement
  or Data Processing Addendum.
- Name the owner of the RoPA as a specific individual, not a team or department, to avoid ambiguity about
  responsibility.
- Record the date each subprocessor entry was last reviewed or updated to show ongoing oversight.
