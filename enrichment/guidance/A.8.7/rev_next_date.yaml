must_id: item:A.8.7:rev_next_date
control_ref: A.8.7
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Malware Protection Program in the official review schedule
  document.
- Record the date the schedule was last updated, along with the name of the person who made the update.
- Name the individual responsible for conducting the next review, not just a team or department.
- Attach the schedule to the most recent review meeting minutes or decision record for cross-reference.
