must_id: item:A.8.7:rev_register_update
control_ref: A.8.7
standard_id: ISO27001:2022
must_text: Findings propagated to register / procedure / awareness content
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each malware protection program review finding in a central findings register, including the
  date and the reviewer’s full name.
- Update relevant procedures or awareness materials to reflect any changes or lessons learned, attaching
  the review finding as supporting evidence.
- Cross-reference each finding in the register to the specific procedure or awareness content it influenced,
  using document titles and version numbers.
- Name the individual responsible for propagating findings, avoiding generic labels like "IT team" or
  "Security department."
