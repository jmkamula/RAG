must_id: item:A.7.3:reg_last_assessed
control_ref: A.7.3
standard_id: ISO27001:2022
must_text: Per-room last assessment date
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each room by unique name or number in the Room Register to clearly identify all areas requiring
  assessment.
- Record the date of the most recent security assessment for each room in a dedicated column of the Room
  Register.
- Name the individual who performed each room's last assessment, ensuring a specific person is listed
  rather than a team or department.
- Review the Room Register quarterly and update any rooms missing a last assessment date to avoid gaps
  in assessment records.
