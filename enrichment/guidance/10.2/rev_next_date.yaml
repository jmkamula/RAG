must_id: item:10.2:rev_next_date
control_ref: '10.2'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the NC/CA Program in the review documentation, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Retain the review document with the stated next review date in a location accessible to auditors and
  relevant stakeholders.
- Cross-reference the review date with your organisation’s compliance calendar to confirm alignment with
  other scheduled reviews.
