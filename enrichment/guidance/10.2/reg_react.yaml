must_id: item:10.2:reg_react
control_ref: '10.2'
standard_id: ISO27001:2022
must_text: Per-row immediate-reaction record (containment / correction)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the immediate action taken for each nonconformity in a dedicated column of the Nonconformity
  Register, including the date and responsible person.
- Describe the specific containment or correction applied for each incident, avoiding vague entries like
  "fixed" or "handled."
- Name the individual who authorized or performed the immediate action for every row, not just a team
  or department.
- Attach supporting evidence, such as emails or incident tickets, to each register entry to show the action
  was actually carried out.
