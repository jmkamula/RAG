must_id: item:10.2:rev_reviewer
control_ref: '10.2'
standard_id: ISO27001:2022
must_text: Reviewer identity (ISMS Manager + lead auditor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the ISMS Manager and lead auditor as the reviewers in the NC/CA Program Review document, using
  their full names and job titles.
- Record the date each reviewer completed their review, ensuring the dates are clearly visible next to
  their names.
- Obtain signatures or electronic approval from both the ISMS Manager and lead auditor on the final review
  record.
- Avoid listing the reviewer as a group or department; specify individuals to meet accountability requirements.
