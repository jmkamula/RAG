must_id: item:10.2:effectiveness
control_ref: '10.2'
standard_id: ISO27001:2022
must_text: Review effectiveness of corrective action taken
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a specific individual to review each corrective action’s effectiveness, recording their name
  and the date of the review in the procedure log.
- Document the method used to assess whether the corrective action resolved the nonconformity, including
  evidence such as test results or follow-up audit findings.
- Record the outcome of the effectiveness review, clearly stating whether the corrective action was successful
  or if further action is needed.
- Avoid closing corrective actions without documented evidence of effectiveness—do not rely on verbal
  confirmation or assumptions.
