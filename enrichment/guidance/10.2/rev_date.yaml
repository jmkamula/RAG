must_id: item:10.2:rev_date
control_ref: '10.2'
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the NC/CA Program in a dated meeting note or review log entry.
- Confirm the planned review interval is documented in a policy or schedule, with a clear frequency stated
  in months or years.
- Cross-reference the actual review date against the planned interval to show the review occurred on time.
- Name the reviewer as a specific individual in the review record, not as a team or department.
