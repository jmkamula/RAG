must_id: item:Art.24:rev_next_date
control_ref: Art.24
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the accountability program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review within the
  same document.
- Confirm the review document is dated and version-controlled to show when the next review date was set.
- Avoid leaving the next review date blank or using vague terms like "annually"—specify an exact date.
