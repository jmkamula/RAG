must_id: item:Art.24:reg_last_assessed
control_ref: Art.24
standard_id: GDPR:2016/679
must_text: Per-row last-assessed date (drives staleness)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date each entry in the GDPR Compliance Register was last assessed in a dedicated column visible
  per row.
- Name the individual responsible for each assessment, ensuring their full name is listed and not just
  a team or department.
- Update the last-assessed date immediately after each review or change to the relevant row’s information.
- Retain previous versions of the register to show a history of assessment dates for each entry.
