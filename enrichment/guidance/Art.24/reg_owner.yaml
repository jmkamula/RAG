must_id: item:Art.24:reg_owner
control_ref: Art.24
standard_id: GDPR:2016/679
must_text: Per-row owner
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each row in the GDPR Compliance Register, avoiding generic
  labels like "the team" or department names.
- Record the date when each owner was assigned responsibility for their respective entry in the register.
- Document the contact details for each owner so they can be reached for follow-up or clarification.
- Review the register quarterly and update ownership details if roles or responsibilities have changed.
