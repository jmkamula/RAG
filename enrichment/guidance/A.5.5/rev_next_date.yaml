must_id: item:A.5.5:rev_next_date
control_ref: A.5.5
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for authority contacts in the review log, using a clear and specific
  calendar date.
- Record the name of the person responsible for scheduling the next review, not just a team or department.
- Document the date this next review date was last updated, ensuring the entry is not left blank or undated.
- Cross-reference the review log entry with the most recent completed review to show continuity in planning.
