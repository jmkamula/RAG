must_id: item:A.5.5:owner
control_ref: A.5.5
standard_id: ISO27001:2022
must_text: Named owner responsible for the register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Authority Contact Register, avoiding generic titles like
  "IT" or "the team".
- Record the owner's full name and job title in the register, along with the date of assignment.
- Document a signed acknowledgement from the named owner confirming their responsibility for maintaining
  the register.
- Review and update the register annually, recording the review date and any changes to ownership.
