must_id: item:A.6.7:rev_next_date
control_ref: A.6.7
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Remote Working Programme in the review document, using a
  clear and specific calendar date.
- Record the date of the most recent review alongside the planned next review date in the same document
  for traceability.
- Name the responsible individual for scheduling the next review, avoiding generic titles like "the team"
  or "management".
- Approve the review document with a dated signature from the designated programme owner to confirm the
  stated next review date.
