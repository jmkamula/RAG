must_id: item:A.6.7:access
control_ref: A.6.7
standard_id: ISO27001:2022
must_text: Access control requirements
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific access control measures required for remote working, such as multi-factor authentication
  and device restrictions, in the policy document.
- Name the individual responsible for approving and updating remote access permissions, listing their
  full name and job title.
- Document the process for granting, reviewing, and revoking remote access, including required approvals
  and review frequency, in a dated procedure.
- Record the date and version number on the Remote Working Policy to show it reflects current access control
  requirements.
- Specify that generic or shared accounts must not be used for remote access, and include this prohibition
  explicitly in the policy text.
