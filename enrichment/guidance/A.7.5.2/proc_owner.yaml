must_id: item:A.7.5.2:proc_owner
control_ref: A.7.5.2
standard_id: ISO27701:2019
must_text: Named owner (DPO + Trust)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Transfer Destinations Documentation Procedure as a specific individual, such as
  the Data Protection Officer, not a generic team or department.
- Record the owner's full name, job title, and contact details in the procedure document, with the date
  of assignment clearly shown.
- Obtain the owner's signature or written confirmation acknowledging responsibility for maintaining and
  updating the procedure.
- Review the procedure annually and document the review date and reviewer’s name in the procedure history
  section.
