must_id: item:A.7.5.2:proc_subcontractor_inclusion
control_ref: A.7.5.2
standard_id: ISO27701:2019
must_text: Subcontractor destinations included — countries where subcontracted processing occurs
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each subcontractor that processes personal data, including the full legal name and contact details,
  in your transfer destinations documentation.
- Record the specific countries where each subcontractor processes personal data, not just the subcontractor’s
  head office location.
- Attach a dated confirmation from each subcontractor specifying where personal data processing physically
  occurs.
- Name the owner as a specific individual responsible for maintaining and updating the list, not a generic
  team or department.
- Review and update the documentation at least annually, recording the date and the person who performed
  the review.
