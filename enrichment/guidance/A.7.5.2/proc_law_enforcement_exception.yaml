must_id: item:A.7.5.2:proc_law_enforcement_exception
control_ref: A.7.5.2
standard_id: ISO27701:2019
must_text: Law enforcement exception — cases where destinations cannot be specified in advance (§7.5.2
  last paragraph)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure that law enforcement requests may require data transfers to unspecified destinations,
  as permitted under applicable law.
- Document each instance where data is transferred to an unspecified destination at law enforcement request,
  including the date, authority, and legal basis.
- Name a specific individual responsible for authorizing and recording law enforcement data transfer exceptions—do
  not list a team or department.
- Retain copies of all correspondence or legal orders from law enforcement that justify each exception
  to standard transfer destination documentation.
