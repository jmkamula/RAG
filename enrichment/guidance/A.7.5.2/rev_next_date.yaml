must_id: item:A.7.5.2:rev_next_date
control_ref: A.7.5.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Destinations Program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling the next review alongside the planned date.
- Confirm the review document is dated and version-controlled to show when the next review date was last
  set.
- Name the next review date explicitly—do not use vague terms like "annually" or "TBD" that lack a concrete
  date.
