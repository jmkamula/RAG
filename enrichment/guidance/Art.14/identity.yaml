must_id: item:Art.14:identity
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Identity and contact details of controller
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the full legal name of the data controller responsible for the processing in the privacy notice.
- Document the controller’s physical address and at least one direct contact method, such as an email
  or phone number, in the notice.
- Name a specific individual or role as the contact for data protection queries—do not use only generic
  terms like “the team” or “admin.”
- Record the date the privacy notice was last updated to show when the contact details were reviewed.
