must_id: item:Art.14:categories
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Categories of personal data obtained (NOT in Art.13 since subject knows; required in Art.14)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all categories of personal data obtained from third parties in the privacy notice, using clear
  and specific terms for each category.
- State the source of each data category, naming the organisation or type of third party where possible.
- Confirm that the categories listed are not generic or boilerplate; tailor them to reflect only data
  actually obtained from external sources.
- Record the date the privacy notice was last updated to include these categories, and keep a copy of
  previous versions for reference.
