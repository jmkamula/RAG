must_id: item:Art.14:reg_lawful_basis
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Lawful basis per row (Art.6 entry id)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each data source entry in the Art.14 Source Register to a specific lawful basis by recording
  the related Art.6 entry ID.
- Document the lawful basis in clear, plain language that matches the wording used in your Art.6 register.
- Assign responsibility for maintaining the cross-references to a named individual, not a group or department.
- Record the date each cross-reference was last reviewed or updated in the register.
- Avoid using generic or placeholder lawful basis entries such as "TBD" or "various"—each row must have
  a specific, valid basis.
