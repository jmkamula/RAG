must_id: item:Art.14:dpo
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: DPO contact details if applicable
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Data Protection Officer (DPO) as a specific individual, including their full name and job title,
  not just a generic role.
- Document the DPO’s direct contact details, such as a dedicated email address and phone number, in the
  privacy notice.
- State the date the privacy notice was last updated to show when the DPO contact details were reviewed.
- Confirm the DPO’s contact information matches what is registered with your supervisory authority or
  official company records.
