must_id: item:Art.14:reg_exception
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Per-row Art.14.5 exception cited where notice is not provided (proportionate-impossibility
  / disclosure-by-law / confidentiality)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific Art.14.5 exception for each data source row where notice was not provided, using
  clear language matching the regulation's categories.
- Cite the legal basis or confidentiality rule by name and reference for each row marked as "disclosure-by-law"
  or "confidentiality".
- State the reason for "proportionate-impossibility" with a brief, concrete explanation unique to each
  data source, avoiding generic or copy-paste text.
- Name the reviewer who confirmed the exception and enter the review date for each applicable row.
- Avoid leaving any exception field blank or marked as "N/A" where notice was not provided; incomplete
  entries will be flagged by auditors.
