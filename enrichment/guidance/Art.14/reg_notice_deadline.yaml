must_id: item:Art.14:reg_notice_deadline
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Notice deadline met per row (within 1 month / first communication / first disclosure)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date when each individual's personal data was obtained from a third party in the Art.14 Source
  Register.
- Document the date when the privacy notice was provided to each individual, specifying the method of
  communication used.
- Cross-reference each entry to confirm the notice was given within one month, or at the time of first
  communication or disclosure, whichever came first.
- Name the responsible person for each notification entry as a specific individual, not a team or department.
- Retain evidence of the actual notice sent, such as a copy of the email or letter, linked to the corresponding
  register entry.
