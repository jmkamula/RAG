must_id: item:Art.14:scope_source_types
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Source types enumerated (data brokers, public records, affiliates, enrichment vendors, customer
  lists)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all types of third-party sources from which personal data is obtained, such as data brokers, public
  records, affiliates, enrichment vendors, and customer lists.
- Name each third-party source type in a documented inventory, including a brief description of the data
  collected from each type.
- Date the inventory and include the name of the person responsible for maintaining and updating the list.
- Specify each source type individually—do not use vague categories like "external sources" or "partners"
  without further detail.
