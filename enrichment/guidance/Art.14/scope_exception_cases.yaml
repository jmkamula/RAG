must_id: item:Art.14:scope_exception_cases
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Art.14.5 exceptions explicitly mapped (proportionate-impossibility / legal-disclosure-restriction
  / confidentiality obligation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all third-party sources from which you collect personal data, including the specific type of data
  obtained from each.
- Document for each third-party source whether an Article 14.5 exception applies, citing the relevant
  clause and providing a brief justification.
- Name the decision-maker who determined the applicability of each exception, ensuring this is a specific
  individual and not a group or department.
- Record the date when each exception determination was made and reference supporting evidence, such as
  legal advice or correspondence.
- Avoid using generic statements like "not applicable" or "impossible" without a clear, documented explanation
  tied to a specific exception.
