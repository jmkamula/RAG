must_id: item:Art.14:source
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Source from which the personal data originate (Art.14-specific — distinguishing feature vs
  Art.13)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific source or sources from which each category of personal data was obtained in the privacy
  notice.
- Name the source as a specific organisation, public register, or individual — not a generic term like
  "third party" or "external provider".
- Record the date when the privacy notice was last updated to reflect any changes in data sources.
- Cross-reference the data source information in the privacy notice with your data mapping or records
  of processing activities.
