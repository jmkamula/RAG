must_id: item:Art.14:rights
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Data subject rights enumerated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each data subject right under GDPR Article 15–22 in the privacy notice, using clear and simple
  language.
- Reference the exact GDPR articles for each right so an auditor can cross-check the legal basis.
- State how individuals can exercise their rights, naming a specific contact person or email address.
- Include the date the privacy notice was last updated to show the information is current.
