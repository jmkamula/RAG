must_id: item:Art.14:recipients
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Recipients or categories of recipients
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all organisations or individuals who will receive the personal data, using their full legal names
  where possible.
- Specify categories of recipients only if naming each recipient is not practical, and describe each category
  clearly and specifically.
- Document the decision rationale if you choose to use categories instead of named recipients, including
  who approved this approach and when.
- State the date the privacy notice was last updated to show when the recipient information was most recently
  reviewed.
- Name the owner of the privacy notice as a specific individual, not a team or department.
