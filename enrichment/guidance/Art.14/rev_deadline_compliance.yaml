must_id: item:Art.14:rev_deadline_compliance
control_ref: Art.14
standard_id: GDPR:2016/679
must_text: Deadline compliance audit — notice deadlines met per Art.14.3
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date each privacy notice was provided to individuals whose data was obtained indirectly,
  matching the timeline required by Article 14.3.
- Document the method used to deliver each privacy notice, such as email or postal mail, and retain evidence
  of successful delivery.
- Name the person responsible for monitoring and tracking privacy notice deadlines, ensuring this is a
  specific individual rather than a team or department.
- Review a sample of recent cases to confirm that notices were sent within one month of data receipt,
  or at the first communication or disclosure, as required.
- Retain copies of all privacy notices and related correspondence, including timestamps, to demonstrate
  compliance with Article 14.3 deadlines.
