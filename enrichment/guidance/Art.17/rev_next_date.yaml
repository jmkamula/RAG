must_id: item:Art.17:rev_next_date
control_ref: Art.17
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Article 17 Erasure Program in the program documentation.
- Record the date in a version-controlled document or register, showing when the next review is scheduled.
- Name a specific individual responsible for scheduling and conducting the next review, not a team or
  department.
- Cross-reference the stated review date with meeting minutes or a decision log where the date was agreed.
