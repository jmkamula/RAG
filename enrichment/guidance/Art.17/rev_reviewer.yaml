must_id: item:Art.17:rev_reviewer
control_ref: Art.17
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + ops lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and the operational
  lead by full name and job title.
- Record the date when the erasure program review was completed, ensuring the entry is included in the
  official review log.
- Document the review outcome and any decisions made, attaching the signed statement from both the DPO
  and the operational lead.
- Avoid listing generic roles or teams as reviewers; always specify named individuals to meet accountability
  requirements.
