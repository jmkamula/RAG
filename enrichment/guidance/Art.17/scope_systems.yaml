must_id: item:Art.17:scope_systems
control_ref: Art.17
standard_id: GDPR:2016/679
must_text: Systems enumerated (cross-ref to A.5.34:pii_inventory + A.8.10:scope_systems + Art.30 RoPA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference your list of systems holding personal data to your Article 30 Records of Processing
  Activities and confirm all are included.
- Document each system by name, owner, and location in a table, linking to your personal data inventory
  and system scope records.
- State the legal basis for processing personal data in each system, referencing the relevant entry in
  your Records of Processing Activities.
- Name the system owner as a specific individual, not a team or department, for each system listed.
- Record the date of your most recent review of the systems list and retain evidence of who conducted
  the review.
