must_id: item:Art.17:scope_change_drivers
control_ref: Art.17
standard_id: GDPR:2016/679
must_text: Trigger list (new PII store, new processor, public-data disclosure)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all systems and services where personal data is stored, including cloud providers, databases, and
  third-party processors, with names and last update dates.
- Document each trigger event that requires updating the erasure scope, such as adding a new system, onboarding
  a new processor, or public data disclosure.
- Assign a named individual responsible for reviewing and updating the applicable systems scope whenever
  a trigger event occurs.
- Record each update to the scope in a dated change log, including the trigger event and the systems or
  processors affected.
- Specify each system and processor by unique name—do not use generic terms like "various databases" or
  "external vendors."
