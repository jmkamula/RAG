must_id: item:Art.25:proc_certification
control_ref: Art.25
standard_id: GDPR:2016/679
must_text: Approved-certification reliance (Art.25.3) where the org uses a certification mechanism
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific certification mechanism relied upon, including the certifying body and scope, in your
  Data Protection by Design Procedure.
- Document the date of certification approval and retain a copy of the official certificate or attestation
  from the certifying body.
- Assign a named individual responsible for monitoring continued compliance with the certification requirements,
  not just a team or department.
- Record any limitations or exclusions of the certification that affect your data protection measures
  within the procedure documentation.
- State the process for periodic review and renewal of the certification, including scheduled review dates
  and responsible parties.
