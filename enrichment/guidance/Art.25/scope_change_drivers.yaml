must_id: item:Art.25:scope_change_drivers
control_ref: Art.25
standard_id: GDPR:2016/679
must_text: Trigger list (new product line, new processor type, regulatory guidance change)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all events that require a Data Protection by Design (DPbD) review, such as launching new product
  lines, changing processors, or regulatory updates.
- Document the date each trigger was last reviewed and updated in your compliance register.
- Assign a named individual responsible for monitoring and updating the trigger list, not a generic team
  or department.
- Cross-reference each trigger to relevant supporting evidence, such as meeting minutes or regulatory
  bulletins, to show why it was included.
