must_id: item:A.7.2.8:proc_change_capture
control_ref: A.7.2.8
standard_id: ISO27701:2019
must_text: Change-capture — activity changes trigger RoPA update within stated SLA
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the maximum allowed time (SLA) for updating the Record of Processing Activities after a change
  in processing activity is identified.
- Assign a named individual responsible for monitoring changes in processing activities and initiating
  RoPA updates.
- Document each change event with the date, nature of the change, and the date the RoPA was updated.
- Record evidence of periodic reviews to confirm that all changes have been captured and RoPA updates
  occurred within the stated SLA.
- Name the RoPA owner as a specific individual, not a team or department, to avoid auditor concerns about
  unclear accountability.
