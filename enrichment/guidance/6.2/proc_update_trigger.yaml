must_id: item:6.2:proc_update_trigger
control_ref: '6.2'
standard_id: ISO27001:2022
must_text: Update trigger stated (policy change, risk-result change, party requirement change)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific events that trigger a review or update of security objectives, such as policy changes,
  new risk assessment results, or external party requirements.
- Document the date when the update triggers were last reviewed and approved within the Security Objective-Setting
  Procedure.
- Name the individual responsible for monitoring and initiating updates when a trigger event occurs, avoiding
  generic titles like "the team" or "management".
- Cross-reference each trigger to the relevant section of your risk register, policy change log, or contractual
  requirement to show alignment.
