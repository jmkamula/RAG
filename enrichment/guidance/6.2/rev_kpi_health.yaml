must_id: item:6.2:rev_kpi_health
control_ref: '6.2'
standard_id: ISO27001:2022
must_text: KPI health check — measurements actually flowing for measurable objectives
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each measurable security objective alongside its defined key performance indicator (KPI) in a dated
  objectives register.
- Record the most recent measurement data for every KPI, showing actual results against the target for
  each objective.
- Attach evidence of regular KPI data collection, such as automated reports or screenshots, with clear
  timestamps.
- Name the person responsible for collecting and reviewing KPI data for each objective—avoid generic roles
  like "the team."
- Document the date and outcome of the latest objectives program review, including any actions taken based
  on KPI results.
