must_id: item:6.2:rev_alignment
control_ref: '6.2'
standard_id: ISO27001:2022
must_text: Alignment check — objectives still consistent with current 5.2 policy + 6.1.2 risk results
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each information security objective against the current version of your information
  security policy and latest risk assessment results in a dated review document.
- Document any changes in business context, threats, or risk treatment decisions that affect the relevance
  of existing objectives in meeting policy requirements.
- Record the names and roles of all participants involved in the objectives review, ensuring each is a
  specific individual, not just a department or team.
- State the date of the review and explicitly confirm whether each objective remains aligned or requires
  revision, with supporting rationale for each decision.
- Retain a signed summary of the review outcomes, including any required updates to objectives, as evidence
  of management approval.
