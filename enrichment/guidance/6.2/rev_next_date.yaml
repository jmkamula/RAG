must_id: item:6.2:rev_next_date
control_ref: '6.2'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for each information security objective in the Objectives Program
  Review document.
- Record the date in a clearly labeled, dedicated column or field within the review document.
- Name the reviewer or responsible person who set the next review date, including their full name and
  role.
- Avoid leaving the review date blank or using vague terms like "TBD" or "ongoing"—enter a specific calendar
  date.
