must_id: item:Art.47:reg_transfers
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Per-row transfers covered (link to Art.44 register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each data transfer listed in the BCR Coverage Register to its corresponding entry in
  the Article 44 Transfer Register by unique identifier.
- Record the lawful basis for each transfer in the BCR Coverage Register, matching the justification stated
  in the Article 44 Transfer Register.
- Name a specific individual responsible for maintaining the BCR Coverage Register, avoiding generic roles
  like "the team" or "compliance department."
- Confirm that every transfer row in the BCR Coverage Register includes a direct link or reference to
  the relevant Article 44 record.
