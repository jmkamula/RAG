must_id: item:Art.47:scope_change_drivers
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Trigger list (M&A, divestment, regulatory change)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all events that could trigger a review of Binding Corporate Rules (BCRs), such as mergers, acquisitions,
  divestments, or regulatory changes, in a dated document.
- Assign a named individual responsible for monitoring and updating the trigger list, ensuring their name
  and contact details appear on the document.
- Record the date of the most recent trigger list review and the reviewer’s name to demonstrate regular
  assessment.
- Reference the trigger list in your BCR policy documentation, linking it to the section on scope and
  applicability.
- Specify each trigger clearly; avoid vague entries like "business changes" that do not detail the actual
  event.
