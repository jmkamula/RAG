must_id: item:Art.47:reg_jurisdiction
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Per-row jurisdiction of entity
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the legal jurisdiction for each entity in the BCR Coverage Register, specifying the country or
  region where the entity is established.
- Name the entity using its full legal name, avoiding abbreviations or group-level labels that could cause
  ambiguity.
- Cross-reference each entity’s jurisdiction entry with supporting registration documents, such as business
  licenses or incorporation certificates.
- Date each entry to show when the jurisdiction information was last confirmed or updated.
