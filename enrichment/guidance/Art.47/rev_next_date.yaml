must_id: item:Art.47:rev_next_date
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the BCR program in the review document, using a clear and specific
  calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review within the
  same document.
- Confirm the review date is not left as "TBD," "annual," or a vague timeframe, but is an exact date.
- Retain the dated and version-controlled review document in a location accessible to relevant stakeholders.
