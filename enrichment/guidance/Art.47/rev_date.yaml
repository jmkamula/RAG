must_id: item:Art.47:rev_date
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Binding Corporate Rules (BCR) program in a dated document
  or review log.
- Confirm the planned review interval for the BCR program is clearly stated in a policy or schedule.
- Cross-reference the actual review date against the planned interval to verify it falls within the required
  timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Retain evidence of the completed review, such as meeting minutes or a signed review report, showing
  the date and participants.
