must_id: item:Art.47:legally_binding
control_ref: Art.47
standard_id: GDPR:2016/679
must_text: Legally binding intra-group instrument referenced (BCR-C for controllers / BCR-P for processors)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific intra-group agreement that makes the Binding Corporate Rules legally binding, such
  as an intercompany contract or group policy.
- Document the date, version, and signatories of the referenced instrument in the Binding Corporate Rules
  Procedure.
- Cross-reference the relevant section of the intra-group agreement within the Binding Corporate Rules
  document to show how binding effect is achieved.
- Attach a copy of the signed intra-group instrument to the Binding Corporate Rules Procedure for direct
  evidence.
- Name the owner as a specific individual responsible for maintaining the referenced instrument, not as
  a group or department.
