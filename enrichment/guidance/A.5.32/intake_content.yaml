must_id: item:A.5.32:intake_content
control_ref: A.5.32
standard_id: ISO27001:2022
must_text: Third-party content licensing (images, fonts, datasets, AI training data) — intake confirms
  permitted use and records terms
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the source, type, and intended use of each third-party content item in an intake log, including
  images, fonts, datasets, and AI training data.
- Record the specific licensing terms or permissions for each item, including usage limits, attribution
  requirements, and any restrictions, in the same intake log.
- Attach a copy of the original license agreement or permission statement to the intake record for each
  third-party content item.
- Name the individual who reviewed and approved the permitted use for each item, ensuring a specific person
  is listed rather than a team or department.
- Confirm the intake record is dated and version-controlled so that changes to licensing terms or permitted
  use can be traced over time.
