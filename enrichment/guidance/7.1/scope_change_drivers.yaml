must_id: item:7.1:scope_change_drivers
control_ref: '7.1'
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new ISMS initiative, certification scope expansion, M&A)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all resource categories currently in scope, referencing a dated document or register approved by
  the ISMS owner.
- Document a trigger list that includes events like new ISMS initiatives, scope expansions, or mergers
  and acquisitions, with clear definitions for each.
- Assign a named individual responsible for monitoring these triggers and updating the scope when an event
  occurs.
- Record each scope review decision with the date, the trigger event, and the names of those who approved
  any changes.
- Specify the owner as a named person, not a team or department, to avoid ambiguity in accountability.
