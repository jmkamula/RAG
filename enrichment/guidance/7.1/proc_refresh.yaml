must_id: item:7.1:proc_refresh
control_ref: '7.1'
standard_id: ISO27001:2022
must_text: Refresh cadence stated (annual planning cycle + significant-change trigger)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific annual month or date when ISMS resource needs are reviewed and planned in the procedure
  document.
- Describe the process for triggering an out-of-cycle review when significant organisational or risk changes
  occur, with clear examples.
- Name the individual responsible for initiating both scheduled and triggered reviews—avoid listing a
  team or department as the owner.
- Record the date the procedure was last updated to reflect the current review cadence and triggers.
