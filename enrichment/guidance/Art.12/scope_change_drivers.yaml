must_id: item:Art.12:scope_change_drivers
control_ref: Art.12
standard_id: GDPR:2016/679
must_text: Trigger list for re-scoping (new channel, new product surface, accessibility update)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current channels through which users can exercise their GDPR rights, including web forms, email
  addresses, and phone numbers, in a dated document.
- Document a trigger list specifying events that require re-evaluating the rights channels, such as launching
  a new product, adding a channel, or updating accessibility features.
- Assign a named individual responsible for reviewing the trigger list at least annually and after any
  significant product or channel change.
- Record each review of the trigger list with the review date, reviewer’s name, and any actions taken
  or decisions made.
- Name the responsible owner as a specific person, not a group or generic title, to avoid ambiguity in
  accountability.
