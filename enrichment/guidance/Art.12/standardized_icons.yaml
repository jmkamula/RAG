must_id: item:Art.12:standardized_icons
control_ref: Art.12
standard_id: GDPR:2016/679
must_text: Standardised icons used where helpful (Art.12.7)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify each section of your privacy notice where standardised icons could clarify information for
  users.
- Select icons that are officially recognised or widely accepted for data protection topics, documenting
  the source and meaning of each.
- Record the date each icon was added or updated in your procedure, including the name of the person responsible.
- Name the owner as a specific individual responsible for reviewing and updating icons, not as "the team"
  or a department.
- Retain a copy of the published notice showing the icons in use, with a version number and publication
  date.
