must_id: item:Art.12:rev_date
control_ref: Art.12
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your Transparency Program in a dated document or system entry.
- Name the reviewer as a specific individual responsible for the review, not a group or department.
- Cross-reference the review date against your documented review schedule to confirm it falls within the
  planned interval.
- Retain evidence of the completed review, such as meeting minutes or a signed review checklist.
