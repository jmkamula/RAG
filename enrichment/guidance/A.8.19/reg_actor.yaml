must_id: item:A.8.19:reg_actor
control_ref: A.8.19
standard_id: ISO27001:2022
must_text: Per-install authorised actor (privileged role assignment)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the authorised individual responsible for each software installation in the register, using their
  full name—not just a role or team.
- Record the date and time when each privileged role was assigned for software installation, ensuring
  the entry is specific and current.
- Document the approval for each privileged role assignment with a signed or digitally approved record
  from a designated authority.
- Cross-reference each register entry with supporting documentation, such as access request forms or ticket
  numbers, to verify authorisation.
