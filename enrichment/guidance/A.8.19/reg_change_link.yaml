must_id: item:A.8.19:reg_change_link
control_ref: A.8.19
standard_id: ISO27001:2022
must_text: Per-install cross-link to A.8.32 change record where applicable
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each software installation entry to the relevant A.8.32 change record by including the
  unique change record ID in the register.
- Document the date and name of the person entering the cross-link to provide a clear audit trail for
  each installation.
- Review the register to confirm that no installation entry is missing a change record reference where
  a formal change process was required.
- Name the responsible owner for maintaining the register as a specific individual, not a team or department.
