must_id: item:A.8.32:scope
control_ref: A.8.32
standard_id: ISO27001:2022
must_text: Scope — which change classes require formal CM (production / customer-facing / security-relevant
  / cross-system)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each class of change that requires formal change management, such as production, customer-facing,
  security-relevant, and cross-system, in a dedicated section of the procedure.
- Document clear inclusion and exclusion criteria for each change class, with concrete examples for both,
  in the change management procedure.
- Assign a specific individual as the procedure owner; do not use generic titles like "the team" or a
  department.
- Record the date of the most recent review and approval of the change management procedure, including
  the approver’s name and signature.
