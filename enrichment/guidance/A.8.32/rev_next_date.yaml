must_id: item:A.8.32:rev_next_date
control_ref: A.8.32
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Change Management Program in the program document or review
  schedule.
- Record the decision on the review date in meeting minutes or a change log, including the date and names
  of participants.
- Name the responsible individual who set the next review date, avoiding generic titles like "the team"
  or "IT."
- Cross-reference the stated review date in the program document with your organization's master compliance
  calendar.
