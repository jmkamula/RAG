must_id: item:A.8.32:reg_target
control_ref: A.8.32
standard_id: ISO27001:2022
must_text: Per-change target (system / config / data; cross-link to A.5.9 asset register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each change in the Change Register with a clear description of the target, specifying if it affects
  a system, configuration, or data.
- Cross-reference the affected target in the Change Register to its unique entry in the A.5.9 asset register,
  using the asset identifier.
- Name the owner of each change as a specific individual responsible for the update, avoiding generic
  labels like "IT team" or "Operations."
- Date each change entry to show when the change was logged and when it was implemented.
