must_id: item:A.5.27:rev_next_date
control_ref: A.5.27
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the lessons-learned program in the official review schedule document.
- Record the date of the last completed review alongside the next planned review date in the same document.
- Name the individual responsible for scheduling and conducting the next review, listing their full name
  and role.
- Avoid leaving the next review date blank or marked as "TBD"—enter a specific calendar date.
