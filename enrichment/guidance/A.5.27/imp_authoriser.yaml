must_id: item:A.5.27:imp_authoriser
control_ref: A.5.27
standard_id: ISO27001:2022
must_text: Authoriser per record (proportional to scope of the change)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual as the authoriser for each improvement action, matching their authority to
  the scale and impact of the change.
- Record the authoriser’s full name and job title directly on each per-lesson improvement action record.
- State the date on which the authoriser approved the action within the same record.
- Avoid listing groups, teams, or roles as authorisers; specify a single accountable person for each action.
