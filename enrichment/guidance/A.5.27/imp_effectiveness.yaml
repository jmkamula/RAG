must_id: item:A.5.27:imp_effectiveness
control_ref: A.5.27
standard_id: ISO27001:2022
must_text: Effectiveness check planned or done (post-update validation that the change actually addressed
  the root cause)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and method you will use to check if the improvement action fixed the original issue
  in each lesson record.
- Assign a named individual responsible for carrying out the effectiveness check, not just a team or department.
- Document the results of the effectiveness check, including evidence that the root cause was addressed,
  in the improvement action record.
- Attach any supporting evidence, such as test results or user feedback, that demonstrates the change
  resolved the issue.
