must_id: item:A.5.27:risk_register_update
control_ref: A.5.27
standard_id: ISO27001:2022
must_text: Risk-assessment update step where lessons reveal previously-unrecognised exposures
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific lessons learned from each information security incident in a dated incident report,
  including any newly identified risks.
- Update the formal risk assessment record to include each previously-unrecognised exposure, referencing
  the related incident report and date of update.
- Assign a named individual to review and approve the risk assessment update, recording their name and
  approval date in the risk register.
- Avoid leaving the risk assessment update unsigned or attributing it to a group; name a specific person
  responsible for the change.
