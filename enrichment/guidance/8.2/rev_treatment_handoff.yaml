must_id: item:8.2:rev_treatment_handoff
control_ref: '8.2'
standard_id: ISO27001:2022
must_text: Treatment handoff — every new risk found flows to 6.1.3 / 8.3 treatment
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each new risk identified during operational assessments in a dated risk register entry, including
  a clear description of the risk.
- Assign a named individual responsible for initiating risk treatment actions for each new risk, referencing
  clause 6.1.3 or 8.3 as appropriate.
- Document the handoff of each risk to the treatment process with a dated handover note or email, specifying
  the recipient and next steps.
- Cross-reference each risk entry to its corresponding treatment plan or action log, ensuring traceability
  from identification to treatment.
- Name the owner of each risk as a specific person, not a team or department, to avoid ambiguity in accountability.
