must_id: item:8.2:rev_date
control_ref: '8.2'
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Operational Assessment Program in a dated log or register.
- State the planned review interval in months or years, as approved by management, in the same log or
  register.
- Confirm the actual review date falls within the documented planned interval by cross-referencing both
  dates in the log.
- Name the reviewer as a specific individual, not a group or department, in the review record.
