must_id: item:B.8.2.4:scope_change_drivers
control_ref: B.8.2.4
standard_id: ISO27701:2019
must_text: Trigger list (new legislation enacted / new product configuration surface)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all triggers that require updating instructions, including new legislation enactment and new product
  configuration surfaces, in a dated document.
- Name a specific individual responsible for monitoring and updating the trigger list, avoiding generic
  roles like "the team" or "IT".
- Record each time the trigger list is reviewed or updated, including the review date and the reviewer’s
  name.
- Cross-reference the trigger list in the instruction context scope document to show it is actively used
  and maintained.
