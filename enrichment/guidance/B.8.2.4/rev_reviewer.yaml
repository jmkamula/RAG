must_id: item:B.8.2.4:rev_reviewer
control_ref: B.8.2.4
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Legal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and a Legal representative.
- Record the date each reviewer completed their assessment in the program review document.
- Obtain a physical or electronic signature from both the Data Protection Officer and the Legal reviewer
  on the final review record.
- Attach evidence of reviewer qualifications, such as a current DPO appointment letter and legal credentials,
  to the review documentation.
- Avoid listing reviewers as "the team" or "Legal Department"; always specify named individuals to meet
  accountability requirements.
