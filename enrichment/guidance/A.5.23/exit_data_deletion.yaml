must_id: item:A.5.23:exit_data_deletion
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: Data deletion confirmation from the CSP (attestation, log, or audit-trail evidence)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Request a formal, dated attestation from the cloud service provider confirming deletion of all tenant
  data after service exit or migration.
- Obtain supporting evidence such as system logs or audit trails from the provider that show deletion
  actions and timestamps.
- Name the responsible individual at the provider who authorized or performed the data deletion, avoiding
  generic titles or group names.
- Retain all correspondence and documentation related to the deletion request and confirmation in a dedicated,
  easily retrievable location.
