must_id: item:A.5.23:rev_next_date
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the cloud service posture in the review log or tracking document.
- Record the name of the person responsible for scheduling the next review, ensuring a specific individual
  is listed.
- Document the date the next review was set, making sure it is clearly visible and not left blank or marked
  "TBD".
- Retain a copy of the most recent review record showing the scheduled next review date for auditor reference.
