must_id: item:A.5.23:forensic_support
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: Forensic / digital-evidence support expectations from the CSP
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific forensic and digital evidence support services expected from the cloud service provider
  in the policy document, including response times and data access.
- Name the individual responsible for liaising with the cloud service provider on forensic matters, listing
  their full name and job title.
- Document the process for requesting and preserving digital evidence from the cloud service provider,
  including required formats and chain-of-custody steps.
- Reference the relevant contract clauses or service level agreements that address forensic support, ensuring
  these are not left as generic or boilerplate statements.
