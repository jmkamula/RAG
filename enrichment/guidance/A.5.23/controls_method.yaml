must_id: item:A.5.23:controls_method
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: How CSP-side controls will be obtained, evaluated and used (attestation review, API checks,
  configuration discovery)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific person responsible for obtaining and reviewing cloud service provider (CSP) control
  attestations, not just a team or department.
- Document the process for collecting and storing CSP compliance reports, such as SOC 2 or ISO certificates,
  with dates of each review.
- Record the methods used to evaluate CSP controls, including API checks or configuration discovery, in
  a dated assessment log.
- State how findings from CSP control evaluations are used to update internal risk assessments, referencing
  the most recent review date.
