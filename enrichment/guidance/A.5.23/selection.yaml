must_id: item:A.5.23:selection
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: Cloud service selection criteria
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List the specific criteria your organisation uses to select cloud services, such as security certifications,
  data location, and contractual terms, in your policy document.
- Reference the date and version of the policy section where these selection criteria are formally described.
- Name the individual or role responsible for approving and updating the cloud service selection criteria,
  avoiding generic titles like "IT team."
- Attach or link to a completed example of a cloud service evaluation checklist that demonstrates the
  criteria being applied to a real provider.
