must_id: item:A.5.23:responsibilities
control_ref: A.5.23
standard_id: ISO27001:2022
must_text: Roles and responsibilities for cloud service use and management (internal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner responsible for managing cloud service use, avoiding generic
  titles like "IT" or "the team".
- Document the roles and responsibilities for all internal users and administrators of cloud services
  in the policy, including decision-making authority.
- Record the date the roles and responsibilities section was last reviewed and updated, and keep a copy
  of the previous version.
- Assign responsibility for monitoring compliance with cloud service procedures to a named person, and
  list this assignment in the policy.
