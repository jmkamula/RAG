must_id: item:Art.46:reg_authorisation
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: Per-row SA authorisation reference (Art.46.3)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific authorisation reference from the relevant supervisory authority for each data transfer
  entry in the Safeguards Register.
- State the date the authorisation was granted for each transfer, matching the official documentation
  from the supervisory authority.
- Attach or cross-reference the official authorisation document or correspondence for each entry, ensuring
  it is accessible for review.
- Name the authorising supervisory authority and the individual or office that issued the authorisation,
  avoiding generic labels like "regulator" or "compliance team."
