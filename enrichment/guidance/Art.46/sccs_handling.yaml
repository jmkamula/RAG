must_id: item:Art.46:sccs_handling
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: SCCs handling — current 2021/914 EU SCCs version (modules 1-4) used + correct module per relationship
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific version and module(s) of the EU Standard Contractual Clauses (SCCs) used in each international
  data transfer agreement.
- Document the legal relationship for each transfer—controller, processor, or sub-processor—and match
  it to the correct SCC module in a dated record.
- Attach a copy of the signed 2021/914 SCCs for each relevant transfer, showing all completed annexes
  and signatures.
- Confirm that no outdated SCC templates (pre-2021/914) are in use by cross-referencing all agreements
  against a current SCC register.
- Assign a named individual responsible for updating SCCs if the Commission issues a new version, avoiding
  generic ownership like "the legal team".
