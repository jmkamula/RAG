must_id: item:Art.46:scope_tia_methodology
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: TIA methodology (EDPB six-step / template-based / ad-hoc per transfer)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific TIA (Transfer Impact Assessment) methodology used for each data transfer, such as
  EDPB six-step, template-based, or ad-hoc, in a documented record.
- Document the rationale for selecting the chosen TIA methodology, referencing relevant data transfer
  scenarios and any unique risk factors considered.
- Record the date and version of the TIA methodology applied for each transfer to provide clear evidence
  of the assessment timeline.
- Assign a named individual responsible for conducting and approving each TIA, avoiding generic titles
  or group ownership.
- Attach the completed TIA assessment, including all steps and findings, to the corresponding data transfer
  record for traceability.
