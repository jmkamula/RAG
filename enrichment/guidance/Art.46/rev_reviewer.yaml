must_id: item:Art.46:rev_reviewer
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and a designated
  legal counsel by full name and title.
- Record the date the Safeguards Program Review was completed, ensuring it is clearly visible on the review
  document.
- Sign the review document with handwritten or digital signatures from both the Data Protection Officer
  and legal counsel.
- Retain copies of the reviewers’ professional qualifications or appointment letters to confirm their
  roles and authority.
