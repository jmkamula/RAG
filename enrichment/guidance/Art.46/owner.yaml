must_id: item:Art.46:owner
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: Named owner (DPO + legal counsel + procurement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Appropriate Safeguards Procedure as a specific individual, listing their full
  name and job title.
- Document the involvement of the Data Protection Officer, legal counsel, and procurement lead by recording
  their names and roles in the procedure.
- Record the date each owner reviewed and approved the current version of the procedure in a version control
  table.
- Avoid listing a group or department as the owner; only list named individuals with responsibility for
  the procedure.
