must_id: item:Art.46:rev_date
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your safeguards program in a dated document or review log.
- Confirm the planned review interval is clearly stated in your safeguards program documentation.
- Cross-reference the actual review date against the planned interval to show the review occurred on schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain evidence of the completed review, such as meeting minutes or a signed review summary.
