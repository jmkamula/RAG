must_id: item:Art.46:reg_supplementary_measures
control_ref: Art.46
standard_id: GDPR:2016/679
must_text: Per-row supplementary measures applied (where TIA required)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each data transfer requiring a Transfer Impact Assessment (TIA) as a separate row in the Safeguards
  Register, including the destination country.
- Document the specific supplementary measures applied for each transfer, such as encryption or contractual
  clauses, in a dedicated column.
- Name the individual responsible for approving each supplementary measure, using their full name rather
  than a generic role or team.
- Enter the date when each supplementary measure was implemented or reviewed, ensuring no row is left
  undated.
- Attach or cross-reference the completed TIA for each transfer, making sure it is not missing or listed
  as "pending".
