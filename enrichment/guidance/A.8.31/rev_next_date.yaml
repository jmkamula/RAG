must_id: item:A.8.31:rev_next_date
control_ref: A.8.31
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Environment Separation Program in the official review schedule
  document.
- Record the date in a version-controlled document or register that is accessible to relevant stakeholders.
- Name the individual responsible for scheduling and conducting the next review, using their full name
  and job title.
- Avoid leaving the next review date as "TBD" or blank, as auditors will flag missing or vague planning
  details.
