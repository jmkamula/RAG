must_id: item:A.8.31:reg_purpose
control_ref: A.8.31
standard_id: ISO27001:2022
must_text: Per-row purpose (dev / test / staging / production / sandbox / training)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each environment row in the register with a clear, specific purpose such as 'development', 'testing',
  'staging', 'production', 'sandbox', or 'training'.
- State the business function or system associated with each environment to clarify its operational context.
- Name the owner for each environment as a specific individual, not a team or department.
- Record the date each environment was last reviewed or updated in the register.
- Cross-reference each environment entry with supporting documentation that describes its separation from
  other environments.
