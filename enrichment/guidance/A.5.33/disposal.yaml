must_id: item:A.5.33:disposal
control_ref: A.5.33
standard_id: ISO27001:2022
must_text: Disposal procedure at end of retention (secure destruction method per media type, certificate
  of destruction, witness for high-sensitivity classes — cross-link to A.8.10 information deletion)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the disposal procedure for each media type, specifying secure destruction methods such as shredding,
  degaussing, or cryptographic erasure.
- Cross-reference the disposal procedure to the information deletion requirements described in your A.8.10
  control documentation.
- Record the date, method, and responsible individual for each disposal event in a destruction log.
- Attach a certificate of destruction for each batch of disposed records, and require a named witness
  signature for high-sensitivity information.
- Name the owner of the disposal process as a specific individual, not a team or department.
