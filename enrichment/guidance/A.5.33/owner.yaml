must_id: item:A.5.33:owner
control_ref: A.5.33
standard_id: ISO27001:2022
must_text: Named owner of the procedure (typically records manager / legal counsel / InfoSec lead jointly)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Records Retention and Protection Policy, such as the
  records manager, legal counsel, or InfoSec lead.
- Document the owner's full name and job title on the policy's cover page or header section.
- Record the date the ownership was assigned or last reviewed directly on the policy document.
- Avoid listing a group, team, or department as the owner; always specify an accountable person.
