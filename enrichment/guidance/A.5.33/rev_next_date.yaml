must_id: item:A.5.33:rev_next_date
control_ref: A.5.33
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Records Protection Program in the review documentation, using
  a clear and specific calendar date.
- Name the individual responsible for scheduling and leading the next review, including their full name
  and job title.
- Record the date the current review was completed to provide context for the next scheduled review.
- Avoid using vague phrases like "next quarter" or "TBD"—enter an exact date to prevent auditor findings.
