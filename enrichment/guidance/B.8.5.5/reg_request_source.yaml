must_id: item:B.8.5.5:reg_request_source
control_ref: B.8.5.5
standard_id: ISO27701:2019
must_text: Request source per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the name of the individual or organisation that made each disclosure request directly in the
  corresponding row of the register.
- Document the date each disclosure request was received next to the request source for clear traceability.
- State the method by which the request was received (e.g., email, phone, letter) in the same row as the
  request source.
- Name the request source specifically; do not use generic terms like "external party" or "customer."
