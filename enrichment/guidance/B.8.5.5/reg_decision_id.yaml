must_id: item:B.8.5.5:reg_decision_id
control_ref: B.8.5.5
standard_id: ISO27701:2019
must_text: Unique decision identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique identifier to each disclosure decision entry in the register, using a sequential or
  otherwise non-repeating numbering system.
- Record the unique identifier directly in the first column of each row to prevent confusion or accidental
  duplication.
- Cross-reference each identifier with related documentation, such as approval emails or meeting minutes,
  to support traceability.
- Confirm that no two disclosure decisions in the register share the same identifier by running a duplicate
  check after each new entry.
- Name the register owner as a specific individual responsible for maintaining the uniqueness of identifiers,
  not as a team or department.
