must_id: item:A.8.23:rev_category_currency
control_ref: A.8.23
standard_id: ISO27001:2022
must_text: Category-list currency check (new malicious-content categories added; obsolete categories retired)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to be responsible for maintaining the list of web filtering categories, recording
  their name and assignment date.
- Document the current list of web filtering categories in use, including the date of the latest update
  or review.
- Cross-reference the documented category list against recent threat intelligence or vendor updates to
  identify any new or obsolete categories.
- Record the results of the review, noting any categories added or retired, with the date and the reviewer’s
  name.
- Name the reviewer as a specific person, not a group or department, to avoid ambiguity in accountability.
