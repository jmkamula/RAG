must_id: item:B.8.5.6:rev_pre_use_audit
control_ref: B.8.5.6
standard_id: ISO27701:2019
must_text: Pre-use audit — sampled subcontractor onboardings verified against disclosure record
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a responsible individual to oversee the subcontractor disclosure program and document their full
  name and role in the program record.
- Record the date and outcome of each sampled subcontractor onboarding audit in a central log before the
  subcontractor is engaged.
- Cross-reference each sampled onboarding with the corresponding disclosure record to confirm all required
  information matches and is complete.
- Retain evidence of the pre-use audit, such as checklists or signed attestations, for each sampled subcontractor
  in a dedicated folder.
- Specify the sample selection method and document it, avoiding vague descriptions like "randomly chosen"
  without supporting details.
