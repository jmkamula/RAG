must_id: item:B.8.5.6:proc_owner
control_ref: B.8.5.6
standard_id: ISO27701:2019
must_text: Named owner (Trust + Legal)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Subcontractor Disclosure Procedure, avoiding generic
  titles like "the team" or "Legal Department".
- Document the owner's full name and current job title within the procedure document, ensuring the information
  is visible on the cover or title page.
- Record the date when the owner was assigned responsibility, and update this date whenever ownership
  changes.
- Retain written confirmation from both Trust and Legal functions agreeing to the named owner, such as
  a signed email or approval record.
