must_id: item:B.8.5.6:rev_date
control_ref: B.8.5.6
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Subcontractor Disclosure Program in a dated log or review
  register.
- Name the reviewer as a specific individual responsible for conducting the program review, not a group
  or department.
- Cross-reference the documented review date against the planned review interval to confirm it falls within
  the required timeframe.
- Retain evidence of the review, such as meeting minutes or a signed review summary, showing the review
  was completed as scheduled.
