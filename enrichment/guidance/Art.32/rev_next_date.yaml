must_id: item:Art.32:rev_next_date
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the security program in your official documentation, using a
  clear and specific calendar date.
- Record the date in a version-controlled document, such as a security program review log or meeting minutes.
- Name the individual responsible for scheduling and conducting the next review, listing their full name
  and role.
- Avoid leaving the next review date blank or using vague terms like "annually" or "TBD"—always use a
  specific future date.
