must_id: item:Art.32:scope_authority_compliance
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Art.32.4 — persons acting under authority (employees, contractors, processors) bound by instructions
  or law
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all employees, contractors, and processors with access to personal data in a dated register maintained
  by the data protection officer or equivalent.
- Document the specific written instructions or legal obligations each person is bound by, referencing
  signed contracts, NDAs, or internal policies.
- Obtain and retain signed acknowledgements from each person confirming they have read and understood
  their data handling obligations.
- Name the responsible manager for monitoring compliance as a specific individual, not a team or department.
- Review and update the register and acknowledgements at least annually, recording the review date and
  the reviewer’s name.
