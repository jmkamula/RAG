must_id: item:Art.32:scope_processing_activities
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Processing activities in scope (cross-link to Art.30 RoPA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all processing activities that involve personal data, using the same names and descriptions as
  in your Article 30 Record of Processing Activities (RoPA).
- Cross-reference each processing activity to its corresponding entry in the Article 30 RoPA, including
  a direct link or unique identifier.
- Confirm the date of your most recent RoPA review and record the name of the person who approved the
  current scope.
- Name the owner responsible for maintaining the Art.32 scope as a specific individual, not a team or
  department.
- Document any changes to the scope with a dated summary and the name of the person authorizing the update.
