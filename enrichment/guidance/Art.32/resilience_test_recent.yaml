must_id: item:Art.32:resilience_test_recent
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Test executed within the freshness window (last 12 months)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent resilience and restoration test in a log that is accessible to auditors.
- Name the individual responsible for executing and documenting the test, ensuring a specific person is
  listed rather than a team or department.
- Attach the detailed test results, including any issues found and actions taken, to the test record.
- Confirm that the test date falls within the last 12 months by cross-referencing the log with the current
  date.
- Retain evidence of management review or sign-off on the test results, including a dated signature or
  approval.
