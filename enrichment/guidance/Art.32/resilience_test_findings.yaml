must_id: item:Art.32:resilience_test_findings
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Findings recorded and remediated or accepted
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the findings of each resilience and restoration test in a dated report, including specific issues
  identified and their potential impact.
- Assign each finding to a named individual responsible for remediation or formal acceptance, avoiding
  generic roles or team names.
- Document the remediation actions taken for each finding, or record a signed risk acceptance decision
  by an authorised manager if not remediated.
- Retain evidence of follow-up, such as completion dates or closure notes, for all findings to demonstrate
  that actions were tracked to resolution.
