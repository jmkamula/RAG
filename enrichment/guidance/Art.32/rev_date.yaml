must_id: item:Art.32:rev_date
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent security program review date in a central log, including the name of the reviewer
  and the completion date.
- Document the planned review interval in a formal schedule, specifying exact dates or frequency for future
  reviews.
- Cross-reference the actual review date against the planned interval to confirm it falls within the required
  timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Retain a copy of the signed review report or meeting minutes as evidence of the completed review.
