must_id: item:Art.32:reg_risk_assessment
control_ref: Art.32
standard_id: GDPR:2016/679
must_text: Per-row risk-to-rights-and-freedoms assessment (likelihood + severity)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record for each processing activity a clear description of the potential impact on individuals’ rights
  and freedoms, including both likelihood and severity.
- Assign a specific named individual who performed the risk assessment for each row, and include the assessment
  date.
- State the rationale for the likelihood and severity ratings in plain language, avoiding generic or copy-paste
  justifications.
- Cross-reference each risk assessment entry to supporting documentation, such as Data Protection Impact
  Assessments or incident logs, where available.
- Name the risk owner as a specific person, not a team or department, to avoid auditor concerns about
  unclear accountability.
