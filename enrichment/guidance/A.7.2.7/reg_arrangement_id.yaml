must_id: item:A.7.2.7:reg_arrangement_id
control_ref: A.7.2.7
standard_id: ISO27701:2019
must_text: Unique arrangement identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique identifier to each joint controller arrangement and record it in a dedicated column
  of the register.
- Document the date each identifier is created to provide a clear timeline for each arrangement entry.
- Cross-reference each identifier with supporting documentation, such as contracts or agreements, to enable
  easy traceability.
- Name the responsible individual who generates and maintains the identifiers, avoiding generic labels
  like "the team" or "admin".
