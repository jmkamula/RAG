must_id: item:A.7.2.7:rev_date
control_ref: A.7.2.7
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Joint Controller Program in a dated document or meeting minutes.
- State the planned review interval in months or years within the same document for clear reference.
- Confirm the next scheduled review date is set and documented, matching the stated interval.
- Name the reviewer or responsible individual as a specific person, not a group or department.
- Attach evidence of the completed review, such as a signed summary or updated program document, to the
  review record.
