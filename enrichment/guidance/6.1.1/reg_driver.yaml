must_id: item:6.1.1:reg_driver
control_ref: 6.1.1
standard_id: ISO27001:2022
must_text: Per-row driver (4.1 issue id, 4.2 party requirement id, risk id, opportunity id)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each planned action row to a specific issue, party requirement, risk, or opportunity
  by recording its unique identifier in a dedicated column.
- Name the source clause or requirement for each identifier, ensuring it matches the relevant section
  of your context or interested party register.
- Record the date each cross-reference was added or updated, so auditors can confirm the traceability
  is current.
- Name the responsible individual for maintaining these references, not just a team or department, to
  avoid ambiguity.
