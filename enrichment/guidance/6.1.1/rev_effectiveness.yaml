must_id: item:6.1.1:rev_effectiveness
control_ref: 6.1.1
standard_id: ISO27001:2022
must_text: Effectiveness summary across completed actions
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Summarize the results of all completed actions from the planning program in a dated review document.
- State for each action whether the intended outcome was achieved, referencing supporting evidence or
  metrics where possible.
- Assign a named individual to approve the effectiveness summary, capturing their name and date of approval.
- Avoid using generic statements like "actions completed as planned" without specific results or evidence
  for each action.
