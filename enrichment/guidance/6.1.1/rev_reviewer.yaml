must_id: item:6.1.1:rev_reviewer
control_ref: 6.1.1
standard_id: ISO27001:2022
must_text: Reviewer identity (ISMS Manager + executive sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the ISMS Manager and executive sponsor as the designated reviewers in the Planning Program Review
  document, using their full names and job titles.
- Record the date each reviewer completed their review by adding a dated signature or electronic approval
  in the review section.
- Attach evidence of the review, such as meeting minutes or approval emails, that clearly reference the
  specific Planning Program Review.
- Avoid listing the reviewer as a group or department; always specify individual names to meet accountability
  requirements.
