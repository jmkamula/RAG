must_id: item:A.6.8:no_blame
control_ref: A.6.8
standard_id: ISO27001:2022
must_text: 'No-blame / non-retaliation statement encourages honest reporting (drives reporting culture;
  under-reporting is the #1 risk for incident programs)'
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure that staff can report security events without fear of blame or retaliation, using
  clear and direct language.
- Name a specific person or role responsible for upholding the no-blame policy, not a generic team or
  department.
- Record the date the no-blame statement was last reviewed and approved by management.
- Retain evidence of staff communication or training that highlights the no-blame reporting policy.
