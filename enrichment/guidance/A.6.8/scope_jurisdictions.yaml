must_id: item:A.6.8:scope_jurisdictions
control_ref: A.6.8
standard_id: ISO27001:2022
must_text: Jurisdictions covered (whistleblower-protection law variations — EU Whistleblower Directive,
  US Sarbanes-Oxley, sectoral protections)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all countries and regions where your organisation operates or has employees, including subsidiaries
  and remote workers, in a dated document.
- Cross-reference each jurisdiction with the specific whistleblower-protection laws that apply, such as
  the EU Directive or US Sarbanes-Oxley, in a compliance matrix.
- Name a specific individual responsible for maintaining and updating the list of jurisdictions and legal
  references, avoiding generic titles like "Legal Team".
- Record the date of the most recent review and update of the reporting audience scope, attaching evidence
  of legal review or external advice if obtained.
