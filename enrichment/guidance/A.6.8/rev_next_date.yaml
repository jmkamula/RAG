must_id: item:A.6.8:rev_next_date
control_ref: A.6.8
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Periodic Reporting Program in the review documentation, using
  a specific day, month, and year.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a department or team.
- Confirm the review documentation is dated and version-controlled to show when the next review date was
  last set.
- Attach evidence of approval for the scheduled review date, such as a signed or emailed confirmation
  from the program owner.
