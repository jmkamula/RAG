must_id: item:A.8.18:rev_findings_update
control_ref: A.8.18
standard_id: ISO27001:2022
must_text: Findings propagated to register / scope
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each finding from the periodic privileged utility programs review in a central findings register
  with the date and reviewer’s name.
- Cross-reference each finding to the relevant asset or system within the scope to show where action is
  needed.
- Assign responsibility for each finding to a named individual, not a generic team or department.
- Document the status and resolution actions for each finding, including dates of updates and completion.
