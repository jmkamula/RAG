must_id: item:B.8.4.3:proc_owner
control_ref: B.8.4.3
standard_id: ISO27701:2019
must_text: Named owner (Platform Ops + Security Engineering)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Processor Transmission Controls Procedure, not a team
  or department.
- Record the owner's full name and job title in the procedure document, with the date of assignment clearly
  shown.
- Document the process for updating the owner information whenever there is a change in responsibility.
- Retain evidence of formal approval of the named owner, such as a signed or digitally approved record.
