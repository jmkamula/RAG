must_id: item:B.8.4.3:rev_next_date
control_ref: B.8.4.3
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the processor transmission program in a documented schedule or
  review log entry.
- Record the name of the person responsible for conducting the next review alongside the planned review
  date.
- Confirm the review schedule is approved and dated by a designated manager or data protection officer.
- Name the review owner as a specific individual, not a group or department, to avoid ambiguity in responsibility.
