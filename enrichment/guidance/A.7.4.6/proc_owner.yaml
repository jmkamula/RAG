must_id: item:A.7.4.6:proc_owner
control_ref: A.7.4.6
standard_id: ISO27701:2019
must_text: Named owner (Infrastructure + Application Ops)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Temporary Files Disposal Procedure, not a team or department.
- Record the owner's full name and job title in the header section of the procedure document.
- Document the date the owner was assigned responsibility within the procedure or an associated responsibility
  matrix.
- Confirm the owner has acknowledged their responsibility by collecting their signature or written confirmation
  on the procedure.
