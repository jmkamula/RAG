must_id: item:A.7.4.6:rev_next_date
control_ref: A.7.4.6
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Temp Files Program in the review documentation, making sure
  the date is specific and not left blank.
- Name the individual responsible for scheduling the next review, listing their full name and role in
  the program documentation.
- Record the date when the current review was completed, providing a clear reference point for the next
  scheduled review.
- Avoid using vague terms like "annual" or "as needed"—always enter a concrete calendar date for the next
  planned review.
