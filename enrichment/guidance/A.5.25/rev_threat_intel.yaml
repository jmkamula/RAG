must_id: item:A.5.25:rev_threat_intel
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: External threat intelligence input considered (link to A.5.7)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the most recent event triage program review, including the date and a summary of how external
  threat intelligence was considered.
- Name the individual responsible for incorporating external threat intelligence into the review, ensuring
  a specific person is listed rather than a team or department.
- Cross-reference the external threat intelligence sources used, such as vendor feeds or industry alerts,
  in the review documentation.
- Record any changes made to triage procedures as a result of external threat intelligence, noting the
  rationale and date of each change.
- State how the review aligns with control A.5.7 by explicitly linking relevant findings or actions in
  the review report.
