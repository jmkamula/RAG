must_id: item:A.5.25:log_decision
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Triage decision per row (close as false positive / file as near-miss / escalate to A.5.26)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the triage decision for each security event in the log, clearly stating if it is closed as a
  false positive, filed as a near-miss, or escalated.
- Name the individual who made each triage decision, avoiding generic entries like "the team" or "IT department."
- Date each triage decision entry to show when the determination was made.
- Cross-reference escalated events to the corresponding record or ticket in the A.5.26 process for traceability.
