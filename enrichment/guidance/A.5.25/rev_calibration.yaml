must_id: item:A.5.25:rev_calibration
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Calibration outcome (detection sources / criteria / scale adjusted with rationale)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific individual responsible for leading the periodic event triage program review, avoiding
  generic roles like "security team."
- Document the date, attendees, and scope of each triage program review meeting in a formal meeting record.
- Record any changes made to detection sources, criteria, or severity scales, including the rationale
  for each adjustment, in the review minutes.
- Cross-reference updated triage procedures or calibration outcomes with the relevant version-controlled
  documentation or system configuration records.
- Retain evidence of management approval for the calibration outcome, such as a signed or digitally approved
  decision document.
