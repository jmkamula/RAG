must_id: item:A.5.25:assessment_criteria
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Assessment criteria (impact, scope, certainty) for classifying severity
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document clear, specific criteria for impact, scope, and certainty used to classify the severity of
  security events in the procedure.
- Name the individual responsible for reviewing and updating the assessment criteria, listing their full
  name and role in the document.
- State the version number and approval date of the procedure to show when the assessment criteria were
  last reviewed.
- Cross-reference each severity level with a real-world example relevant to your organisation, avoiding
  generic or boilerplate scenarios.
