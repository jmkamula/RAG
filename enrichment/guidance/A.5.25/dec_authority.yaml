must_id: item:A.5.25:dec_authority
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Triage decision authority per record (named role or person)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual or specific role responsible for each triage decision directly in the event record.
- Record the date and time when the triage decision was made for every event.
- Document the rationale behind each triage decision in the event record, referencing relevant criteria
  or policies.
- Avoid using vague authorities such as "the team" or "IT department"—ensure a clear, accountable person
  or role is listed for each event.
