must_id: item:A.5.25:legal_advisory
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Considers who may need to be informed (legal, operational, comms) even at triage stage
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the procedure steps that require identifying all relevant parties to inform during initial
  security event triage, including legal, operational, and communications contacts.
- Name the specific roles or individuals responsible for notifying each party, avoiding generic labels
  like "the team" or "management."
- Record a dated example or template notification showing how and when each stakeholder group would be
  informed during triage.
- State the criteria or triggers in the procedure that determine when each type of stakeholder must be
  informed, with clear references to those sections.
