must_id: item:A.5.25:rev_reviewer
control_ref: A.5.25
standard_id: ISO27001:2022
must_text: Reviewer identity (SecOps lead + InfoSec lead jointly)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name both the SecOps lead and InfoSec lead as joint reviewers in the program review document, listing
  their full names and job titles.
- Record the date when the periodic event triage program review was completed in the official review log.
- Obtain signatures or digital approvals from both the SecOps lead and InfoSec lead on the final review
  record.
- Avoid listing only job roles or teams as reviewers; always specify named individuals for clear accountability.
