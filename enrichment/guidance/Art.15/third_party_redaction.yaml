must_id: item:Art.15:third_party_redaction
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Where other people's rights would be affected, redaction or partial-response justification
  noted
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the reason for any redaction or partial response in the data subject access request file, including
  reference to the specific rights affected.
- Name the individual who approved the redaction or limitation, ensuring this is a specific person and
  not a generic team or department.
- Attach a dated copy of the redacted or partial response sent to the requester, showing exactly what
  was withheld.
- Document the assessment process used to balance the data subject’s rights with those of other individuals,
  including any legal or policy references.
