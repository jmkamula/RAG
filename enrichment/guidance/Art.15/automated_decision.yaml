must_id: item:Art.15:automated_decision
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Existence of automated decision-making / profiling, with meaningful information on logic and
  consequences where applicable
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State clearly in the response whether any automated decision-making or profiling involving the data
  subject’s personal data exists.
- Describe, in plain language, the logic involved in any automated decision-making or profiling processes
  that apply to the data subject.
- Summarize the potential consequences or outcomes for the data subject resulting from such automated
  decisions or profiling.
- Name a specific contact person for follow-up questions, not a generic team or department.
- Date and sign the response to confirm when and by whom the information was provided.
