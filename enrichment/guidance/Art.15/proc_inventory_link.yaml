must_id: item:Art.15:proc_inventory_link
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Linkage to the data flow inventory (req:Art.30:data_flow_inventory) — fulfillment cannot operate
  without knowing where personal data lives; the procedure must name the inventory as the authoritative
  source
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Reference the data flow inventory by full title and location within the DSAR Handling Procedure as the
  single source for identifying personal data locations.
- Cross-reference the most recent version of the data flow inventory, including its version number and
  last update date, within the procedure document.
- Name the owner of the data flow inventory as a specific individual, not a team or department, in the
  procedure.
- State that all DSAR fulfillment steps must consult the data flow inventory before processing any request,
  and record this requirement in the procedure.
