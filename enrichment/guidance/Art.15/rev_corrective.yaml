must_id: item:Art.15:rev_corrective
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Corrective actions to the procedure with owner and target date
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each corrective action identified during the DSAR process review in a dated log entry.
- Assign a named individual as the owner for every corrective action, avoiding generic labels like "team"
  or "department".
- State a specific target completion date for each corrective action in the log.
- Record evidence of owner acknowledgment, such as a signature or email confirmation, for each assigned
  corrective action.
