must_id: item:Art.15:rev_next_date
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the DSAR process in a documented schedule or review log, using
  a clear and specific calendar date.
- Record the name of the individual responsible for conducting the next review, not just a team or department.
- Retain evidence of the last review and the decision on the next review date, such as meeting minutes
  or a signed review form.
- Avoid listing the review date as "TBD" or "ongoing"—use a definite, checkable future date.
