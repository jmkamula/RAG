must_id: item:Art.15:recipients
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Recipients or categories of recipients (including any in third countries)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all recipients or categories of recipients who have received or will receive the data, including
  any third-country organisations, in the response letter.
- Name the specific third countries involved if data was transferred outside the EEA, rather than stating
  only "outside the EEA" or "international".
- Attach a dated record showing how recipient information was gathered and verified for the data subject’s
  request.
- Retain a copy of the final response sent to the data subject, showing the named recipients or categories
  and countries, for audit purposes.
