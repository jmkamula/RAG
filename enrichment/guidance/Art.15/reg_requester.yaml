must_id: item:Art.15:reg_requester
control_ref: Art.15
standard_id: GDPR:2016/679
must_text: Requester identity (verified) or pseudonymous reference where verification used a token
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full name and contact details of the individual submitting the data subject access request
  in the DSAR register.
- Document the method used to verify the requester’s identity, including the type of identification checked
  and the date of verification.
- Assign a unique pseudonymous reference or token in the register if identity was verified using a token-based
  process.
- Name the staff member who completed the identity verification, ensuring this is a specific individual
  and not a team or department.
- Retain a dated entry in the DSAR register showing the outcome of the identity verification before processing
  the request.
