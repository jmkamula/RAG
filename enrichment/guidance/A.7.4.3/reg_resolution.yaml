must_id: item:A.7.4.3:reg_resolution
control_ref: A.7.4.3
standard_id: ISO27701:2019
must_text: Resolution per row (corrected / cannot-correct-with-reason / erased / pending)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- Record the resolution status for each incident row as "corrected", "cannot-correct-with-reason", "erased",
  or "pending" in the Accuracy Incident Register.
- State the specific reason in the register if an incident is marked as "cannot-correct-with-reason",
  avoiding generic or vague explanations.
- Name the individual responsible for resolving each incident in a dedicated column of the register.
- Enter the date when the resolution was completed for each incident row in the register.
