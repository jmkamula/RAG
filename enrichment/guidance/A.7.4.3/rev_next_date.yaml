must_id: item:A.7.4.3:rev_next_date
control_ref: A.7.4.3
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Accuracy Program in the review document, using a clear and
  specific calendar date.
- Record the name of the person responsible for scheduling the next review, listing a specific individual
  rather than a team or department.
- Sign and date the review document to confirm when the next review date was set and by whom.
- Attach the previous review schedule to show that review dates are regularly updated and not simply carried
  over without consideration.
