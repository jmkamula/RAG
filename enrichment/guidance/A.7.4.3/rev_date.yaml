must_id: item:A.7.4.3:rev_date
control_ref: A.7.4.3
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Accuracy Program in a dated log or review report.
- State the planned review interval for the Accuracy Program in a documented schedule or policy.
- Confirm the actual review date falls within the planned interval by cross-referencing the review log
  and the schedule.
- Name the reviewer as a specific individual in the review documentation, not as a team or department.
- Retain evidence of the completed review, such as a signed review report or meeting minutes, for auditor
  examination.
