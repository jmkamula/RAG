must_id: item:A.5.6:proc_disengagement
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Disengagement path for dormant or low-value memberships (avoid paying for unused subscriptions)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a clear disengagement process in the SIG Engagement Procedure, including steps for identifying
  and exiting dormant or low-value memberships.
- Assign a named individual responsible for regularly reviewing all SIG memberships and initiating disengagement
  when criteria are met.
- Record the date and outcome of each membership review in a log, including the decision to continue or
  disengage.
- Name the owner as a specific individual in the procedure—avoid listing a team or department as responsible.
- Retain evidence of completed disengagement actions, such as cancellation confirmations or exit correspondence,
  for each terminated membership.
