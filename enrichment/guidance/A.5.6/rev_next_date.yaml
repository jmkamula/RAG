must_id: item:A.5.6:rev_next_date
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned SIG engagement review date in the review record, using a specific calendar date
  rather than a vague timeframe.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Document the date when the next review date was last updated to show it is current and actively managed.
- Retain the most recent review record where the next planned review date is clearly visible and unambiguous.
