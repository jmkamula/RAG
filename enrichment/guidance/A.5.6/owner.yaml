must_id: item:A.5.6:owner
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Named owner responsible for the register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Special Interest Group and Professional Forum Register,
  not a team or department.
- Record the owner's full name and job title directly on the first page of the register.
- Document the date the owner was assigned responsibility in the register for clear traceability.
- Review the register annually and update the owner’s details if there has been a change in responsibility.
