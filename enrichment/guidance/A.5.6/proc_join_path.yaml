must_id: item:A.5.6:proc_join_path
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Path to join a new SIG (business case linked to risk-topic scope, approval, budget allocation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for joining a new SIG, including how to submit a business case linked
  to the relevant risk-topic scope.
- Name the approver for SIG membership as a specific individual, not a group or generic title.
- Record the date and outcome of each SIG membership approval decision in a central, version-controlled
  register.
- Attach evidence of budget allocation approval, such as a signed funding request or email confirmation,
  to each SIG engagement record.
- Cross-reference each SIG engagement with the associated risk-topic in your risk register to show alignment.
