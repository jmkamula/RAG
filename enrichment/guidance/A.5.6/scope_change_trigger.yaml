must_id: item:A.5.6:scope_change_trigger
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Trigger for re-scoping (new tech adoption, new sector entry, emerging threat class)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific events that require re-scoping, such as adoption of new technology, entry into
  a new sector, or identification of an emerging threat.
- Assign a named individual responsible for monitoring and initiating re-scoping when a trigger event
  occurs.
- Record the date and details of each re-scoping review in a central log, including the trigger event
  that prompted it.
- Name the trigger events clearly and specifically—avoid using vague terms like "significant change" without
  concrete examples.
