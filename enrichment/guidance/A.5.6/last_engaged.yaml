must_id: item:A.5.6:last_engaged
control_ref: A.5.6
standard_id: ISO27001:2022
must_text: Last-engaged date per entry (event attended, briefing received, working group meeting)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent event, briefing, or meeting attended for each group or forum entry
  in the register.
- Name the individual who attended or received the engagement, linking them to the corresponding date
  and group entry.
- Cross-reference supporting evidence, such as meeting invites or attendance records, for each last-engaged
  date listed in the register.
- Enter specific dates only; avoid vague entries like "recently" or leaving the field blank, as these
  will be flagged by auditors.
