must_id: item:A.6.6:reg_template_version
control_ref: A.6.6
standard_id: ISO27001:2022
must_text: Per-row template version (drives currency check — old-version signers may need re-signing on
  material template changes)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact NDA template version used for each signature entry in the register, using a unique
  version identifier and approval date.
- Cross-reference each NDA template version in the register to its corresponding stored, approved document
  to confirm authenticity.
- Name the NDA template version owner as a specific individual, not a generic role or team, for each version
  entry.
- Flag any register entries missing a template version or using an outdated version for review and potential
  re-signing.
