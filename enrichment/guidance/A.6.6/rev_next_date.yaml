must_id: item:A.6.6:rev_next_date
control_ref: A.6.6
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date directly on the NDA template document in a clearly visible location.
- Name the responsible individual for the next review, avoiding generic titles like "Legal Team" or "HR
  Department".
- Record the date this review schedule was last updated in a change log or document history section.
- Retain evidence of communication to relevant stakeholders about the scheduled review date, such as an
  email or meeting note.
