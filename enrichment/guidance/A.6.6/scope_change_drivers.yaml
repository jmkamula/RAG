must_id: item:A.6.6:scope_change_drivers
control_ref: A.6.6
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new party category — e.g. open-source-contributor NDA, gig workers,
  new geography)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current party categories in scope, including employees, contractors, vendors, and any unique
  groups such as gig workers or open-source contributors.
- Document a trigger list that specifies events requiring re-scoping, such as onboarding a new party type,
  expanding to a new country, or launching a new partnership model.
- Assign a named individual responsible for monitoring business changes and initiating scope review when
  a trigger event occurs.
- Record the date of the most recent scope review and the outcome, including any new party categories
  added or considered.
- Name the owner as a specific person, not a generic group or department, to avoid ambiguity in accountability.
