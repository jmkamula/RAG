must_id: item:Art.34:rev_date
control_ref: Art.34
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Subject Communication Program in a dated log or review tracker.
- Name the reviewer as a specific individual responsible for conducting the program review, not a group
  or department.
- Cross-reference the documented review date with the planned review interval stated in your policy to
  confirm it falls within the required timeframe.
- Retain a copy of the signed review summary or meeting minutes as evidence of the completed review.
