must_id: item:Art.34:rev_decision_defensibility
control_ref: Art.34
standard_id: GDPR:2016/679
must_text: High-risk decision defensibility — sampled decisions reviewed against criteria
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual responsible for reviewing high-risk data breach communication decisions, ensuring
  a specific person is listed rather than a group or department.
- Document the review process for sampled subject communication decisions, including the date, reviewer,
  and criteria used for assessment.
- Record the outcome of each sampled decision review, clearly stating whether the decision met the established
  criteria and noting any corrective actions taken.
- Retain evidence of sampled decisions and their reviews, such as meeting minutes or signed review forms,
  for future audit reference.
