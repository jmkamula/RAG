must_id: item:Art.34:proc_owner
control_ref: Art.34
standard_id: GDPR:2016/679
must_text: Named owner (DPO + legal counsel)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Subject Communication Procedure as a specific individual, listing both the Data
  Protection Officer and the legal counsel by full name.
- Document the appointment of these owners in the procedure, including the date of assignment and their
  current contact details.
- Record formal acceptance of ownership by both individuals with signed and dated statements attached
  to the procedure document.
- Avoid listing a team, department, or role title alone as the owner—use named individuals to meet accountability
  requirements.
