must_id: item:A.8.13:reg_outcome
control_ref: A.8.13
standard_id: ISO27001:2022
must_text: Per-test outcome (success / partial / failure)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date, time, and system or data set involved for each restore test in the Restore Test Register.
- Document the outcome of each test as "success," "partial," or "failure" with a brief description of
  any issues encountered.
- Name the individual who performed and validated each restore test, ensuring a specific person is listed
  rather than a team or department.
- Retain supporting evidence for each test, such as screenshots or logs, and cross-reference these in
  the register entry.
