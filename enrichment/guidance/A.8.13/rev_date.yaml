must_id: item:A.8.13:rev_date
control_ref: A.8.13
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent backup program review date in a log or register, clearly showing when the review
  took place.
- State the planned review interval for the backup program in a documented schedule or policy.
- Confirm that the actual review date falls within the documented planned interval, and note any deviations
  with an explanation.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain the signed or approved review outcome as evidence of completion.
