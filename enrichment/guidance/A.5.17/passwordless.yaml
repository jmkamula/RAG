must_id: item:A.5.17:passwordless
control_ref: A.5.17
standard_id: ISO27001:2022
must_text: Passwordless / phishing-resistant authentication noted where deployed (FIDO2, passkeys) — direction-of-travel
  statement
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure where passwordless or phishing-resistant authentication methods like FIDO2 or
  passkeys are currently deployed, including system names and deployment dates.
- Document the organization's intention to expand passwordless or phishing-resistant authentication, specifying
  planned systems and estimated timelines.
- Name a specific individual responsible for overseeing the implementation and tracking of passwordless
  authentication initiatives.
- Avoid using generic statements such as "passwordless authentication is encouraged"; instead, provide
  concrete examples and deployment details.
