must_id: item:A.5.17:rev_reviewer
control_ref: A.5.17
standard_id: ISO27001:2022
must_text: Reviewer identity (IT identity-lead + InfoSec lead jointly; vault custodian where vault discipline
  is in scope)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name both the IT identity lead and the Information Security lead as joint reviewers in the review record
  for each periodic authentication-information program review.
- Record the vault custodian as an additional reviewer in the review log when vault-related authentication
  information is included in the program scope.
- Document the full names and job titles of all reviewers—do not use generic labels like "the team" or
  "IT department."
- Capture the date each reviewer completed their review and include their electronic or physical signature
  in the review artefact.
