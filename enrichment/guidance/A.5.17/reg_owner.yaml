must_id: item:A.5.17:reg_owner
control_ref: A.5.17
standard_id: ISO27001:2022
must_text: Named owner per row (human owner accountable for this credential type — covers governance,
  escalation, retirement decisions)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each credential type listed in the register, avoiding group
  or department names.
- Record the full name and current job title of each owner next to the corresponding credential entry
  in the register.
- Document the date each owner was assigned responsibility for their credential type in the register.
- Review the register quarterly and update owner assignments if there have been role or personnel changes.
