must_id: item:A.5.17:reg_credential_type
control_ref: A.5.17
standard_id: ISO27001:2022
must_text: Each credential type captured with a unique identifier (user_password / admin_password / api_key
  / service_token / cert / mfa_factor / break_glass)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each credential type in the register with a clear, unique identifier such as "user_password" or
  "api_key" next to each entry.
- Assign a specific individual as the register owner; avoid generic labels like "IT team" or "security
  group".
- Record the date each credential type was added or updated in the register to show current and historical
  visibility.
- Cross-reference each credential entry with its related system or application to demonstrate complete
  coverage and traceability.
