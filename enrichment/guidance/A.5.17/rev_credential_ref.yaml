must_id: item:A.5.17:rev_credential_ref
control_ref: A.5.17
standard_id: ISO27001:2022
must_text: Credential identifier per record (links to credential register entry; specific instance, not
  just type)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique identifier of each credential being revoked or reissued in the revocation/reissue
  log, matching the entry in the credential register.
- Cross-reference the credential identifier in the revocation/reissue record with the corresponding credential
  register entry to confirm traceability.
- Name the individual who authorized the revocation or reissue, ensuring the record does not list only
  a team or department.
- Date each revocation or reissue action in the record to provide a clear timeline of credential changes.
