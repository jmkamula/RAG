must_id: item:8.1:reg_outsourced_flag
control_ref: '8.1'
standard_id: ISO27001:2022
must_text: Per-row flag where the process is outsourced (cross-link to A.5.19/A.5.20 supplier evidence)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Add a dedicated column in the Operational Execution Register to flag each process as 'outsourced' or
  'internal' per row.
- Cross-reference each outsourced process to supporting supplier evidence from controls A.5.19 and A.5.20
  using a document link or reference number.
- Name the responsible individual who verified the outsourcing status for each process, rather than leaving
  the field blank or using a generic title.
- Record the date when each outsourcing flag and supplier cross-link was last reviewed or updated in the
  register.
