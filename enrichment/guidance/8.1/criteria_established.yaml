must_id: item:8.1:criteria_established
control_ref: '8.1'
standard_id: ISO27001:2022
must_text: Criteria established for ISMS-relevant processes
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific criteria used to measure the effectiveness of each information security process
  in your Operational Planning and Control Procedure.
- Name the individual responsible for defining and approving these criteria, ensuring a specific person
  is listed rather than a team or department.
- Record the date each set of criteria was last reviewed and updated, providing clear evidence of regular
  review.
- Cross-reference each criterion with the relevant process in your ISMS documentation, showing how each
  requirement is addressed.
