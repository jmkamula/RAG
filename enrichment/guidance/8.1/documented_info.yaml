must_id: item:8.1:documented_info
control_ref: '8.1'
standard_id: ISO27001:2022
must_text: Documented information retained as evidence the processes were carried out as planned
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each completed operational process step in a log, including the date, responsible person, and
  reference to the relevant procedure.
- Attach supporting records, such as checklists or system reports, to confirm each process was executed
  according to the documented procedure.
- Name the process owner as a specific individual, not a generic role or team, in each record of completed
  activity.
- Retain signed or digitally approved evidence for each process, showing explicit confirmation that all
  planned steps were followed.
