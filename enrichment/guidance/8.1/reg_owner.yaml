must_id: item:8.1:reg_owner
control_ref: '8.1'
standard_id: ISO27001:2022
must_text: Process owner per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the process owner for each row, avoiding generic labels like "the team"
  or department names.
- Record the full name and job title of each process owner directly in the corresponding row of the Operational
  Execution Register.
- Document the date when each process owner was assigned responsibility in the register for traceability.
- Review the register quarterly and update any changes in process ownership, keeping a dated record of
  each review.
