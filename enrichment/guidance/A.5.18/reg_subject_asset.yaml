must_id: item:A.5.18:reg_subject_asset
control_ref: A.5.18
standard_id: ISO27001:2022
must_text: Subject-to-asset rights mapping (who has access to what — drives review and the orphan-access
  check)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each user or account by full name or unique identifier, mapping them directly to the specific systems,
  applications, or data assets they can access.
- Record the date each access right was granted, the reason for access, and the name of the authorising
  person for each entry.
- Cross-reference each access entry with the corresponding employment or contract status to identify and
  flag orphaned or outdated accounts.
- Name the register owner as a specific individual responsible for updates—not as "IT", "the team", or
  a department.
- Review and update the register at least quarterly, recording the review date and the reviewer’s name
  for each cycle.
