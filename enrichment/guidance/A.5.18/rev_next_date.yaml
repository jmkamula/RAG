must_id: item:A.5.18:rev_next_date
control_ref: A.5.18
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned access rights review date in the access review log or tracking document.
- Name the person responsible for scheduling and conducting the next review, listing them as a specific
  individual.
- Record the method used to determine the review frequency, such as referencing a policy or risk assessment.
- Retain evidence of communication informing relevant staff of the upcoming review date, such as an email
  or meeting note.
