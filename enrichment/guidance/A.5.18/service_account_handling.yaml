must_id: item:A.5.18:service_account_handling
control_ref: A.5.18
standard_id: ISO27001:2022
must_text: Service account / non-human identity handling stated (provisioning, owner attribution, periodic
  re-attestation — service accounts are the weakest spot in most access programs)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure how service accounts are created, including approval steps and required documentation
  for each new account.
- Name a specific individual as the owner for each service account—do not use generic roles like "IT team"
  or "system administrator".
- Document the process for periodic review and re-attestation of all service accounts, including frequency
  and responsible person.
- Record how deprovisioning of unused or obsolete service accounts is handled, with a log of actions taken
  and dates.
