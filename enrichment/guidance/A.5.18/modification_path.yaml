must_id: item:A.5.18:modification_path
control_ref: A.5.18
standard_id: ISO27001:2022
must_text: Path for modification of access on role or responsibility change (joiner-mover-leaver flows;
  mover is the typically-missed leg)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a clear process for modifying user access when an employee changes roles or responsibilities,
  including required approvals and timeframes.
- Name the individual responsible for updating access rights during role changes, specifying their job
  title and contact details.
- Record each access modification request and its completion date in an access log, referencing the specific
  user and new role.
- Include a step for promptly reviewing and removing old access permissions that are no longer needed
  after a role change.
- Specify the mover process distinctly—do not combine it with joiner or leaver steps, as auditors flag
  missing or unclear mover procedures.
