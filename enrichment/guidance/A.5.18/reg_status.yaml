must_id: item:A.5.18:reg_status
control_ref: A.5.18
standard_id: ISO27001:2022
must_text: Status field per row (active / suspended / revoked) — drives the review's orphan check and
  the revocation_record lifecycle close-out
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- Add a "Status" field to each row in the Access Rights Register, using only "active", "suspended", or
  "revoked" as values.
- Record the current status for every user or account entry, updating the field immediately when access
  changes.
- Name the person responsible for updating status fields as a specific individual, not a team or department.
- Retain a dated record of each status change, including who made the update and the reason for the change.
- Cross-reference each "revoked" status with the corresponding revocation record to confirm lifecycle
  closure.
