must_id: item:A.5.26:cls_evidence_archive
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Evidence package archived per record (link to A.5.28 evidence store)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the closure of each security incident with a dated summary, including actions taken and outcome,
  in an incident closure record.
- Attach or link all supporting evidence files directly to the corresponding incident closure record,
  ensuring each file is uniquely identifiable.
- Cross-reference each incident closure record to its archived evidence package in the A.5.28 evidence
  store, using a persistent link or unique identifier.
- Name the incident owner as a specific individual responsible for the closure and evidence linkage, not
  as a team or department.
- Retain a log showing the date and method of archiving for each evidence package, confirming preservation
  steps were completed.
