must_id: item:A.5.26:cls_authoriser
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Closure authority per record (named role)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a specific individual by name and job title as the closure authority for each incident record.
- Record the date and time when the closure authority reviews and approves the incident closure in the
  incident log.
- Require the closure authority to sign or electronically acknowledge each incident closure, creating
  a traceable approval record.
- Avoid listing closure authority as a group, department, or generic role; always name a single accountable
  person.
