must_id: item:A.5.26:exercise_freq
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Tabletop or simulation frequency stated (semi-annual or more often); A.5.24 is the formal home
  for the exercise programme
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the required frequency for incident response tabletop or simulation exercises in the procedure,
  specifying "at least semi-annually" or a more frequent interval.
- Cross-reference the exercise programme in section A.5.24 within the incident response procedure, clearly
  linking the two documents.
- Name a specific individual responsible for scheduling and coordinating the exercises, avoiding generic
  titles like "the team" or "IT department".
- Record the date of the most recent tabletop or simulation exercise in the procedure or an attached log.
