must_id: item:A.5.26:cls_lessons_handoff
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Handoff reference into A.5.27 lessons register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique incident identifier and closure date in the incident closure record for traceability.
- Cross-reference the incident closure record to the corresponding entry in the lessons learned register
  required by A.5.27.
- Name the individual responsible for updating the lessons learned register, ensuring it is not left as
  a generic team or department.
- Attach evidence of the handoff, such as an email or ticket update, showing the incident was communicated
  for lessons capture.
