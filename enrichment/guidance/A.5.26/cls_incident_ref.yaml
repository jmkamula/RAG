must_id: item:A.5.26:cls_incident_ref
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Incident identifier per record (links to the incident register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique incident identifier from the incident register on each incident closure record to
  enable direct cross-referencing.
- Cross-reference each closure record with the corresponding entry in the incident register, confirming
  both records match the identifier and incident details.
- Name the responsible individual who completed the closure record, including their full name and the
  date of record completion.
- Avoid using generic or missing identifiers; ensure every closure record links to a specific, registered
  incident.
