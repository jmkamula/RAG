must_id: item:A.5.26:communication
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Internal and external communication criteria specified (who is informed, when, by whom)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State, in the procedure, the specific roles or named individuals responsible for notifying internal
  and external parties during an incident.
- Document clear criteria for when each internal and external party must be informed, including examples
  of incident types and severity thresholds.
- Record, in the procedure, the communication channels and methods to be used for each party, such as
  email, phone, or formal report.
- Name the owner as a specific individual responsible for overseeing incident communications — do not
  use a team or department name.
