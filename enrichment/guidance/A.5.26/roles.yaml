must_id: item:A.5.26:roles
control_ref: A.5.26
standard_id: ISO27001:2022
must_text: Roles and responsibilities for incident response defined (Incident Manager, security team,
  comms lead, legal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each incident response role by title and name a specific individual responsible for each, including
  Incident Manager, security team lead, communications lead, and legal contact.
- Document the responsibilities for each role in the incident response procedure, linking each responsibility
  to the named individual.
- Record the date the procedure was last reviewed and approved by management, with the approver’s name
  and signature.
- Avoid using generic terms like "the team" or "IT department"—assign all roles to named persons with
  current contact details.
- Cross-reference the procedure with your organisational chart to confirm all named individuals are current
  staff members.
