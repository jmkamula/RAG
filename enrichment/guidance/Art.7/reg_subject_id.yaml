must_id: item:Art.7:reg_subject_id
control_ref: Art.7
standard_id: GDPR:2016/679
must_text: Subject identifier per row (pseudonymous or direct identifier)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a unique subject identifier for each consent entry, using either a pseudonymous code or a direct
  identifier as appropriate.
- Document the method used to generate or assign each identifier, and retain this documentation alongside
  the consent register.
- Confirm that each row in the register links unambiguously to a single data subject, without duplicate
  or missing identifiers.
- Avoid using generic labels like "user" or "customer" as identifiers; use a value traceable to a specific
  individual or pseudonym.
