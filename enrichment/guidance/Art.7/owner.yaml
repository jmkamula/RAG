must_id: item:Art.7:owner
control_ref: Art.7
standard_id: GDPR:2016/679
must_text: Named owner of the procedure (DPO or Privacy Lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Consent Management Procedure as a specific individual, such as the Data Protection
  Officer or Privacy Lead, not a group or team.
- Record the owner's full name and job title in the header or cover page of the Consent Management Procedure
  document.
- Document the date the owner was assigned responsibility for the procedure within the procedure document
  or an associated responsibility register.
- Review and update the named owner whenever there is a change in personnel or roles, recording the date
  of each update.
