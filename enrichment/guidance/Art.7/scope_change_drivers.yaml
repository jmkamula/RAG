must_id: item:Art.7:scope_change_drivers
control_ref: Art.7
standard_id: GDPR:2016/679
must_text: Trigger list for re-scoping (new feature requiring consent, basis change for an existing activity)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current activities requiring user consent, including the specific data processed and the purpose
  for each activity, in a dated document.
- Document a trigger list that includes events such as launching a new feature or changing the legal basis
  for an existing consent activity.
- Assign a named individual responsible for monitoring business changes and initiating re-scoping when
  a trigger event occurs.
- Record each time the trigger list is reviewed or updated, including the date and the person who made
  the changes.
- Name the owner as a specific person, not a group or department, to avoid ambiguity in accountability.
