must_id: item:Art.7:rev_date
control_ref: Art.7
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your consent program in a dated log or review register entry.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Cross-reference the documented review date against your planned review schedule to confirm it falls
  within the required interval.
- Retain a signed or approved record of the review decision, showing completion and acceptance by the
  responsible person.
