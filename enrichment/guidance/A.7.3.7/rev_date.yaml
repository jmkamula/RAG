must_id: item:A.7.3.7:rev_date
control_ref: A.7.3.7
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Third-Party Notification Program in a dated log or register.
- Name the individual responsible for conducting the review, ensuring a specific person is listed rather
  than a team or department.
- Document the planned review interval for the program and cross-reference it with the actual review date
  to confirm alignment.
- Retain a signed or approved record of the review outcome, such as meeting minutes or a summary report.
