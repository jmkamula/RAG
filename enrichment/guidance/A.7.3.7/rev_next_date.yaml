must_id: item:A.7.3.7:rev_next_date
control_ref: A.7.3.7
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Third-Party Notification Program in the program documentation.
- Record the date of the last review and the person responsible for scheduling the next review in a dated
  log.
- Name the owner as a specific individual responsible for confirming the next review date, not a group
  or department.
- Cross-reference the stated review date in the program documentation with the organisation’s compliance
  calendar to ensure consistency.
