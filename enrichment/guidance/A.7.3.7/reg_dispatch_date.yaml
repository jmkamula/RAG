must_id: item:A.7.3.7:reg_dispatch_date
control_ref: A.7.3.7
standard_id: ISO27701:2019
must_text: Dispatch date per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date each third-party notification was sent in a dedicated "Dispatch Date" column for
  every entry in the register.
- Confirm each dispatch date is supported by an email sent receipt, courier tracking, or other timestamped
  delivery evidence.
- Name the person responsible for sending each notification in the register, listing their full name rather
  than a team or department.
- Review the register regularly to ensure no row is missing a dispatch date or contains placeholder text
  like "TBD" or "N/A".
