must_id: item:A.5.11:reg_asset_list
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Per-leaver asset list (link to A.5.9 asset register entries assigned to this person)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each leaver’s full name, job title, and departure date in the Leaver Asset Return Register.
- List all assets assigned to the leaver, referencing the unique asset IDs from the main asset register
  for each item.
- Cross-reference each asset entry in the leaver register to its corresponding record in the A.5.9 asset
  register, including asset description and assignment date.
- Name the asset return as completed only when a specific individual has signed and dated the return for
  each asset, not using generic group sign-off.
- Retain a copy of the completed and signed leaver asset return record for each departing individual.
