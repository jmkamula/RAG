must_id: item:A.5.11:exception_process
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Exception process for outstanding assets (work-from-home, contractor delays, lost-in-transit)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a step-by-step exception process in the Return of Assets Procedure for handling delayed, lost,
  or outstanding assets, including remote and contractor scenarios.
- Assign a named individual responsible for tracking and resolving each outstanding asset, listing their
  name and contact details in the asset register.
- Record the reason for each exception, the actions taken, and the expected resolution date in a dated
  log or ticketing system entry.
- Obtain written approval from a manager for any exception granted, attaching the signed or emailed approval
  to the asset record.
- Name the owner as a specific individual — do not use generic terms like "the team" or "IT department"
  in the procedure or records.
