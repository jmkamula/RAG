must_id: item:A.5.11:reg_leaver_id
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Each leaver/role-changer captured with a unique identifier (employee or contractor id; do not
  store sensitive PII beyond what HR retains)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each leaver or role-changer in the Asset Return Register using their unique employee or contractor
  ID, not their full name.
- Cross-reference each entry in the register with the official HR leaver or role-change notification,
  including the notification date.
- State explicitly in the register that no sensitive personal information beyond the unique identifier
  is stored for each entry.
- Name the register owner as a specific individual responsible for its maintenance, not a team or department.
