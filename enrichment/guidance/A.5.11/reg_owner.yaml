must_id: item:A.5.11:reg_owner
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Return owner per row (typically the leaver's line manager + IT custody handler)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the asset return owner for each entry as a specific individual, such as the leaver's line manager
  or IT custody handler.
- Record the full name and job title of the return owner next to each asset listed in the register.
- Document the date when the asset was returned and the owner confirmed receipt, using a signed or initialled
  entry.
- Avoid listing generic roles like "IT" or "the team" as the owner; always specify a named person for
  each asset.
