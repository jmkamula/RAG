must_id: item:A.5.11:rev_date
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Review date within the planned annual interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the asset-return program in a dated log or register.
- Confirm the planned annual review interval is documented in the asset-return program procedure or policy.
- Name the reviewer as a specific individual responsible for the latest review, not a group or department.
- Cross-reference the review record with supporting meeting minutes or a signed review checklist to verify
  completion.
- Flag any review dates that fall outside the planned annual interval and document corrective actions
  taken.
