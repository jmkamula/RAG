must_id: item:A.5.11:rev_workforce_shift
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Workforce-model shift considered (e.g. step-change in remote-work proportion or contractor
  mix that changes risk surface)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the date and scope of each asset-return program review, including any assessment of changes
  in workforce model or remote work proportion.
- Name the reviewer who evaluated whether a shift in contractor mix or remote work has altered the asset
  risk profile.
- Record the specific workforce-model changes considered, such as increased remote staff or new contractor
  arrangements, in the review meeting minutes.
- State any resulting updates or decisions about the asset-return process in a signed and dated action
  log.
- Name the owner as a specific individual responsible for the review, not a group or department.
