must_id: item:A.5.11:reg_status
control_ref: A.5.11
standard_id: ISO27001:2022
must_text: Status per row (pending / in_progress / complete / exception / written_off) updated as items
  are returned
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- Record the status of each asset in the Leaver Asset Return Register as soon as its return process changes.
- 'Update the status field per asset row to reflect one of these values: pending, in_progress, complete,
  exception, or written_off.'
- Name the responsible individual who updates each status, not just a team or department.
- Date each status update entry to show when the change was made.
- Review the register regularly to confirm no asset row is missing a current status.
