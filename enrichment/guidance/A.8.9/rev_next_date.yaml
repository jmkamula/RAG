must_id: item:A.8.9:rev_next_date
control_ref: A.8.9
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the configuration program in the review schedule document, making
  sure the date is clear and specific.
- Record the name of the person responsible for scheduling the next review, listing them as an individual
  rather than a team or department.
- Document the date this review schedule was last updated, keeping a version history or change log for
  reference.
- Attach evidence of management approval for the scheduled review date, such as a signed or emailed confirmation.
