must_id: item:A.8.9:scope_change_drivers
control_ref: A.8.9
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new asset class, new vendor, new platform)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current asset classes, vendors, and platforms included in your configuration management scope
  in a dated document.
- Document a trigger list that specifies events requiring a scope review, such as onboarding a new asset
  class, vendor, or technology platform.
- Assign a named individual responsible for monitoring changes and initiating re-scoping when a trigger
  event occurs.
- Record each scope review decision with the date, the trigger event, and the names of those who approved
  the updated scope.
- Name the responsible owner as a specific person, not a team or department, to avoid ambiguity in accountability.
