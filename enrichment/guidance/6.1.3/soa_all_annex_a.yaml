guidance:
- List all 93 Annex A controls from ISO27001:2022 in your Statement of Applicability, ensuring none are
  missing or combined.
- Assign a unique identifier to each control entry that matches the numbering and naming used in the ISO27001:2022
  standard.
- Record the date the Statement of Applicability was last updated to reflect the current version and coverage.
- Name the owner responsible for maintaining the Statement of Applicability as a specific individual,
  not a team or department.
