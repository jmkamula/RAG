must_id: item:6.1.3:rev_reviewer
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Reviewer identity (Risk Manager + ISMS Manager + risk owners as needed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer by full name and job title in the Risk Treatment Program Review document.
- Record the date each reviewer completed their review next to their name in the document.
- Sign the review document physically or electronically to confirm each reviewer’s participation.
- Name the owner as a specific individual — do not list "the team," a department, or a generic role.
