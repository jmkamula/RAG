must_id: item:6.1.3:scope_options_catalog
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Treatment options catalog (modify / share / avoid / retain — ISO 31000 4-option model)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all four risk treatment options—modify, share, avoid, retain—in your risk treatment methodology,
  using the exact terms from ISO 31000.
- Document a clear definition for each treatment option, showing how your organisation interprets and
  applies each one.
- Reference the specific section and version of ISO 31000 used, including the publication year, in your
  methodology document.
- Name the person who approved the treatment options catalog, ensuring it is a named individual rather
  than a group or department.
- Date the latest update to the treatment options catalog, avoiding undated or obsolete versions.
