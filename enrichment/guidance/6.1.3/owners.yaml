must_id: item:6.1.3:owners
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Risk treatment owners identified per treated risk
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the treatment owner for each risk in the Risk Treatment Plan, avoiding
  generic labels like "IT team" or "management."
- Record the date each treatment owner is assigned to a risk within the plan to provide a clear timeline
  of responsibility.
- Document the contact details of each treatment owner in the plan to allow direct follow-up during audits
  or reviews.
- Cross-reference each risk entry with the corresponding treatment action and owner in the plan to ensure
  all treated risks have a named owner.
