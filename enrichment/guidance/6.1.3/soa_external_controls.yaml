must_id: item:6.1.3:soa_external_controls
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: External / additional controls beyond Annex A listed where used (sectoral, contractual)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all external or additional security controls used that are not from Annex A, including those required
  by contracts or sector-specific regulations.
- Name the source or authority for each external control, such as a specific regulation, customer contract,
  or industry guideline.
- Record the rationale for including each additional control in the Statement of Applicability, referencing
  the relevant business or compliance need.
- Specify each control individually; do not use generic descriptions like "various customer requirements"
  or "industry standards" without detail.
- Date and sign the Statement of Applicability to confirm that the list of external controls is current
  and formally approved.
