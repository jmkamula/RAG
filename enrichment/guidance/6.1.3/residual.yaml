must_id: item:6.1.3:residual
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Residual risk identified per treated risk
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each treated risk in the Risk Treatment Plan alongside a clear description of the remaining, or
  residual, risk after controls are applied.
- Record the date when the residual risk was assessed and the name of the person who performed the assessment.
- Assign a specific individual as the owner of each residual risk, avoiding generic labels like "IT" or
  "the team".
- Document the rationale for accepting or further treating each residual risk, referencing supporting
  evidence or risk criteria where applicable.
