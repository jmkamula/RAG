must_id: item:6.1.3:rev_plan_progress
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Plan progress check — every treatment item status updated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual responsible for updating each risk treatment item's status in the risk register.
- Record the current status and progress of every risk treatment item in the risk register, including
  completion dates or revised timelines.
- Cross-reference each updated risk treatment item with related controls or requirements, such as section
  8.3, in the register.
- Document the date of the most recent review and the reviewer’s name for every risk treatment item status
  update.
- Avoid leaving any risk treatment item status as “unknown,” “pending,” or blank—update each item with
  a clear, current status.
