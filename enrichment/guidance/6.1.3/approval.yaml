must_id: item:6.1.3:approval
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Risk owners' approval of the plan AND acceptance of residual risks recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each risk owner as a specific individual responsible for approving the risk treatment plan, avoiding
  generic titles or group names.
- Record the risk owner's explicit approval of the risk treatment plan with a dated signature or documented
  electronic confirmation.
- Document the acceptance of each residual risk by the named risk owner, including a dated statement or
  signed acceptance form.
- Retain all approval and acceptance records together with the final version of the risk treatment plan
  for audit reference.
