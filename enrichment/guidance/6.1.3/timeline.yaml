must_id: item:6.1.3:timeline
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Target completion dates per treatment item
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each risk treatment action in the Risk Treatment Plan with a clear, specific target completion
  date for every item.
- Assign responsibility for each treatment action to a named individual, not a team or department.
- Record the date the Risk Treatment Plan was last reviewed and approved by management, with names of
  approvers.
- Update the plan to reflect any changes to completion dates, keeping previous versions for reference.
