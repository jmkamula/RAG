must_id: item:6.1.3:rev_next_date
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Risk Treatment Program in the program document or register.
- Record the date of the last review alongside the next planned review date for clear tracking.
- Name the individual responsible for scheduling and conducting the next review, specifying their full
  name and role.
- Avoid leaving the next review date blank or marked as “TBD”; always enter a specific calendar date.
