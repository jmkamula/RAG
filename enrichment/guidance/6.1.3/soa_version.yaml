must_id: item:6.1.3:soa_version
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Version number and approval date stated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the current version number clearly on the cover page of the Statement of Applicability document.
- Record the approval date prominently on the first page, next to or below the version number.
- Name the approver as a specific individual, not a group or department, and include their full name and
  title.
- Retain a copy of the signed approval page showing both the version number and approval date.
