must_id: item:6.1.3:soa_justification
control_ref: 6.1.3
standard_id: ISO27001:2022
must_text: Justification per control (why included / why excluded)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each control from Annex A in your Statement of Applicability, including both those you have adopted
  and those you have excluded.
- Document a clear, specific justification for every control, stating why it is included or excluded in
  your context.
- Name the person responsible for approving each justification, ensuring it is a named individual and
  not a group or department.
- Record the date when each justification was last reviewed or updated in the Statement of Applicability.
- Avoid using generic or copy-paste justifications that could apply to any organisation; tailor each explanation
  to your actual business and risks.
