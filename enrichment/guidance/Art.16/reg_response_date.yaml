must_id: item:Art.16:reg_response_date
control_ref: Art.16
standard_id: GDPR:2016/679
must_text: Per-row response date (Art.12.3 SLA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date each rectification request is received in the register, linking it to the specific request
  entry.
- Enter the date of your formal response to each rectification request in a dedicated column for response
  dates.
- Cross-reference the response date with supporting correspondence or notification sent to the data subject.
- Name the staff member responsible for responding to each request, using their full name rather than
  a generic team or department.
- Review the register regularly to confirm no requests have missing or undated response entries.
