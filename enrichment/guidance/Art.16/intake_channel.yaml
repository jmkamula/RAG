must_id: item:Art.16:intake_channel
control_ref: Art.16
standard_id: GDPR:2016/679
must_text: Intake channel published and accessible to data subjects
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Publish a clear contact method, such as a dedicated email address or web form, on your privacy notice
  for individuals to request data corrections.
- State the intake channel’s location and instructions in plain language within your privacy policy or
  data rights section on your website.
- Record the date when the intake channel was made publicly available and keep a screenshot or archived
  copy as evidence.
- Name a specific individual responsible for monitoring and responding to rectification requests, not
  just a generic team or department.
