must_id: item:Art.16:rev_reviewer
control_ref: Art.16
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Data Protection Officer (DPO) as the reviewer for the rectification program in the review documentation.
- Record the DPO’s full name and job title on the signed review report for each rectification program
  review cycle.
- Document the date the DPO completed the review and include their signature or digital approval in the
  review record.
- Avoid listing the reviewer as "the team", "compliance", or any non-specific group; always identify a
  single, accountable individual.
