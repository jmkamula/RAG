must_id: item:B.8.3.1:proc_sla
control_ref: B.8.3.1
standard_id: ISO27701:2019
must_text: Response-time SLA per support-request type stated + honoured
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the maximum response time for each type of customer subject-rights request in the documented procedure,
  with clear timeframes in days or hours.
- Assign a named individual responsible for monitoring and ensuring timely responses to each request type,
  listing their full name and role.
- Record the actual response date for each subject-rights request in a tracking log, alongside the request
  type and received date.
- Retain evidence of response communications sent to customers, including timestamps, to demonstrate that
  response times met the stated SLA.
- Specify response times as exact numbers—do not use vague terms like "as soon as possible" or "promptly,"
  which auditors will flag.
