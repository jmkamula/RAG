must_id: item:B.8.3.1:reg_customer_id
control_ref: B.8.3.1
standard_id: ISO27701:2019
must_text: Requesting customer identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique customer identifier for each subject rights request in a dedicated column of the register.
- Confirm that every entry in the register links to a specific customer identifier, not just a name or
  generic label.
- Cross-reference each customer identifier with supporting documentation to verify accuracy and traceability.
- Avoid using placeholders like "unknown" or "various" as customer identifiers; specify the exact identifier
  assigned to each request.
