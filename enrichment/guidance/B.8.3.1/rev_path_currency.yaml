must_id: item:B.8.3.1:rev_path_currency
control_ref: B.8.3.1
standard_id: ISO27701:2019
must_text: Support-path currency — technical paths remain functional after product changes
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the current technical support paths in a dated register, including contact methods and escalation
  steps.
- Record the date and outcome of the most recent review confirming support paths remain functional after
  any product changes.
- Assign a named individual responsible for verifying and updating support paths following each product
  update or release.
- Attach evidence of tested support paths, such as screenshots or logs, showing successful use after the
  latest product change.
- Name the owner as a specific individual — not a team or generic department — in all support path documentation.
