must_id: item:B.8.3.1:proc_owner
control_ref: B.8.3.1
standard_id: ISO27701:2019
must_text: Named owner (Product + Trust)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Customer Subject-Rights Support Procedure, not a team
  or department.
- Record the owner's full name and job title in the header or cover page of the procedure document.
- Document the date the owner accepted responsibility for the procedure, keeping this record with the
  procedure file.
- Review and update the named owner information annually, noting the review date and reviewer’s name in
  the procedure document.
