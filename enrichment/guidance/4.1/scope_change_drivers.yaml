must_id: item:4.1:scope_change_drivers
control_ref: '4.1'
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new sector entry, geographic expansion, regulator change)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all events that would require a scope review, such as entering a new sector, expanding geographically,
  or changes in regulatory oversight.
- Document the trigger list in a dated, approved scope management procedure or policy, referencing the
  specific ISO27001:2022 control.
- Assign a named individual responsible for monitoring business changes and initiating re-scoping when
  a trigger event occurs.
- Record each scope review decision with the date, the trigger event, and the names of participants in
  meeting minutes or a change log.
- Specify trigger events clearly—avoid vague terms like "significant change" without examples, as auditors
  flag unclear or generic triggers.
