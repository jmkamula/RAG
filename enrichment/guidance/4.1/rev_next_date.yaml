must_id: item:4.1:rev_next_date
control_ref: '4.1'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the context program in a dedicated section of the review document.
- Record the name of the individual responsible for scheduling and leading the next review.
- Confirm the review date is specific and not listed as "TBD" or "annually" without an actual calendar
  date.
- Retain a dated copy of the context program review document showing the stated next review date.
