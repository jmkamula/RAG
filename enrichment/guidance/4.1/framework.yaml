must_id: item:4.1:framework
control_ref: '4.1'
standard_id: ISO27001:2022
must_text: Framework reference stated (SWOT, PESTLE, ISO 31000 5.4, or equivalent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the chosen framework by name in the Issue Identification Framework document, such as SWOT, PESTLE,
  ISO 31000 5.4, or another equivalent.
- Reference the specific section or clause of the framework used, including version or publication date,
  within the framework documentation.
- Attach or link to the full text or summary of the referenced framework in the appendix or supporting
  materials.
- Name the framework owner as a specific individual responsible for maintaining framework relevance and
  updates, not a generic team or department.
