must_id: item:4.1:owner
control_ref: '4.1'
standard_id: ISO27001:2022
must_text: Named owner of the register (typically ISMS Manager)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Internal and External Issues Register as a specific individual, such as the ISMS
  Manager, not a team or department.
- Record the owner's full name and job title directly on the first page of the register, along with the
  date of assignment.
- Document the process for updating the register, including how the owner is notified of changes and their
  responsibility for review.
- Retain evidence of the owner's acceptance of responsibility, such as a signed or emailed confirmation
  from the named individual.
