must_id: item:7.2:effectiveness
control_ref: '7.2'
standard_id: ISO27001:2022
must_text: Evaluation that competence actions were effective
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific competence actions taken for each staff member in a dated record, including training,
  certifications, or mentoring activities.
- Record the method used to evaluate whether each competence action improved relevant skills or knowledge,
  such as tests, observations, or performance reviews.
- State the outcome of each evaluation, clearly indicating whether the competence action was effective
  for the intended role or responsibility.
- Name the evaluator as a specific individual, not a generic title or department, and include their signature
  and date on the evaluation record.
- Retain evidence of any follow-up actions taken if competence was found lacking, such as additional training
  or reassignment, in the same record.
