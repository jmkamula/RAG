must_id: item:7.2:proc_evidence_types
control_ref: '7.2'
standard_id: ISO27001:2022
must_text: Evidence types accepted (formal certification, on-job demonstration, attested experience)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all accepted evidence types for competence, such as formal certification, on-job demonstration,
  and attested experience, in the written procedure.
- Document the process for evaluating each evidence type, including who is responsible for assessment
  and how decisions are recorded.
- Name the assessor as a specific individual, not a generic title or department, in each competence determination
  record.
- Retain dated records showing which evidence type was used for each employee’s competence determination.
