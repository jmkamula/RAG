must_id: item:A.5.30:rev_date
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Review date within the planned 180-day interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent ICT Readiness Program review date in a central log, showing it falls within the
  planned 180-day interval.
- Assign a named individual responsible for scheduling and conducting each review, listing them in the
  review documentation.
- Attach a signed or approved summary of the review findings, including the date, to demonstrate completion
  within the required timeframe.
- Cross-reference the review date against the planned review schedule to confirm no interval exceeds 180
  days.
- Specify the review owner by name, not by role or team, to avoid ambiguity in accountability.
