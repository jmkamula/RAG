must_id: item:A.5.30:reg_asset_link
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Asset-link per row (cross-link to A.5.9 asset register entries that constitute this service)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each ICT service in the continuity register to its supporting asset entries in the A.5.9
  asset register using unique asset IDs.
- Record the date of the last cross-link review for each ICT service to show the register is kept current.
- Name the person responsible for maintaining the cross-links, listing a specific individual rather than
  a team or department.
- Document any changes to asset-service relationships with a dated entry and reference to the updated
  asset register row.
