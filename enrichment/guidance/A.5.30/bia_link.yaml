must_id: item:A.5.30:bia_link
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: BIA-link explicit (RTO/RPO targets traceable to the Business Impact Assessment — not arbitrarily
  chosen numbers; cross-link to A.5.29 scenario register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each system's RTO and RPO targets in the ICT Readiness Plan to the specific Business
  Impact Assessment section where they are justified.
- Record the date and version of the Business Impact Assessment used to set each RTO and RPO, ensuring
  traceability to the latest approved assessment.
- Link each scenario in the ICT Readiness Plan to the corresponding entry in the scenario register required
  by control A.5.29.
- Name the person responsible for maintaining these cross-references as a specific individual, not a team
  or department.
- Document any changes to RTO or RPO targets with a signed statement explaining the BIA-driven rationale
  for the adjustment.
