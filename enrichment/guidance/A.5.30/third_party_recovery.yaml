must_id: item:A.5.30:third_party_recovery
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Third-party-dependent recovery noted (where recovery relies on supplier action — cross-link
  to A.5.22 supplier review)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify all business processes in your continuity plan that depend on third-party suppliers for recovery,
  listing each supplier by name.
- Document the specific recovery actions required from each supplier, including expected response times
  and contact details, in the plan.
- Cross-reference each third-party dependency in your continuity plan to the corresponding supplier review
  record maintained under control A.5.22.
- Name the responsible individual who will coordinate with each supplier during recovery, avoiding generic
  roles like "IT team" or "management."
- Review and update the continuity plan annually, recording the date and approver’s name for each update.
