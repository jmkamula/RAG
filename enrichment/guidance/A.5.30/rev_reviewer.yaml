must_id: item:A.5.30:rev_reviewer
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Reviewer identity (CTO/IT-ops head + BCP-program owner + InfoSec lead jointly; CFO sign-off
  where critical-service RTO has financial impact)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer as a specific individual by title and full name, avoiding generic roles like "the
  team" or "IT department".
- Record the date and outcome of the ICT Readiness Program review in a formal meeting minute or review
  log.
- Obtain signatures or written confirmation from the CTO or IT-ops head, BCP-program owner, and InfoSec
  lead on the review record.
- Secure CFO sign-off on the review record if any critical-service recovery time objective has a financial
  impact, attaching supporting analysis if applicable.
