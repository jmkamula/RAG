must_id: item:A.5.30:recovery_procedures
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Recovery procedures documented per ICT service (step-by-step, runbook-style — not 'restart
  the system' aspirational text)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document step-by-step recovery procedures for each ICT service, using clear instructions that a technically
  competent person could follow without assumptions.
- Name the responsible individual for each ICT service recovery procedure, avoiding generic titles like
  "IT team" or "Support staff".
- Record the date each recovery procedure was last reviewed or tested, attaching evidence of the review
  or test outcome.
- Cross-reference each recovery procedure to the relevant business continuity plan section, showing alignment
  with overall organizational priorities.
- Attach any required scripts, configuration files, or checklists directly to the procedure, not just
  referenced as "available on request".
