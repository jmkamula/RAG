must_id: item:A.5.30:rec_signoff
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Signoff per record (recovery owner + BCP-program owner; exec sponsor where critical-service
  real recovery)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the details of each recovery event, including date, time, and actions taken, in a dedicated recovery
  event log.
- Name the recovery owner and BCP-program owner as specific individuals for each event, avoiding generic
  titles or group names.
- Obtain and retain signatures from both the recovery owner and BCP-program owner on each recovery event
  record.
- Secure an additional signoff from the executive sponsor for any recovery event involving a critical
  service, with a clear date and name.
- Store all signed recovery event records in a central, access-controlled location for future reference.
