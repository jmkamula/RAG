must_id: item:A.5.30:failover
control_ref: A.5.30
standard_id: ISO27001:2022
must_text: Failover / redundancy arrangements for critical services (active-active / active-passive /
  cold-standby per service tier)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify each critical service and document its failover or redundancy arrangement, specifying whether
  it is active-active, active-passive, or cold-standby.
- Name the responsible individual for maintaining and testing each failover arrangement, avoiding generic
  titles like "IT team" or "Operations".
- Record the most recent test date and outcome for each failover or redundancy setup, including any issues
  found and actions taken.
- Attach supporting diagrams or configuration records that clearly show how failover or redundancy is
  implemented for each critical service.
- Review and update the documented arrangements at least annually, capturing the reviewer's name and the
  date of each review.
