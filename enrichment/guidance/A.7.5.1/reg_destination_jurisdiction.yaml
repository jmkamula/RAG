must_id: item:A.7.5.1:reg_destination_jurisdiction
control_ref: A.7.5.1
standard_id: ISO27701:2019
must_text: Destination jurisdiction per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the destination jurisdiction for each data transfer entry in the register, specifying the exact
  country or region involved.
- Cross-reference each row with supporting documentation that confirms the legal basis for transferring
  data to that jurisdiction.
- Name the person responsible for verifying the accuracy of each jurisdiction entry, listing their full
  name and role.
- Avoid using vague terms like "international" or "overseas"—state the precise jurisdiction for every
  transfer.
