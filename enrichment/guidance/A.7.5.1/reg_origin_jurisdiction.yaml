must_id: item:A.7.5.1:reg_origin_jurisdiction
control_ref: A.7.5.1
standard_id: ISO27701:2019
must_text: Origin jurisdiction per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the origin jurisdiction for each data transfer entry in the register, specifying the exact country
  or region where the data originates.
- Cross-reference each origin jurisdiction entry with supporting documentation, such as contracts or data
  flow maps, to verify accuracy.
- Name the individual responsible for entering and updating origin jurisdiction information, ensuring
  a specific person is listed rather than a team or department.
- Review the register periodically to confirm that all new and existing entries include a clearly stated
  origin jurisdiction.
