must_id: item:A.7.14:rev_next_date
control_ref: A.7.14
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Periodic Disposal Program in the program document or review
  schedule.
- Record the date in a version-controlled document that is accessible to relevant stakeholders.
- Name the individual responsible for scheduling and conducting the next review, using their full name
  and job title.
- Avoid leaving the review date blank or using vague terms like "annually"—enter a specific calendar date.
