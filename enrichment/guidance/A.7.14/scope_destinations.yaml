must_id: item:A.7.14:scope_destinations
control_ref: A.7.14
standard_id: ISO27001:2022
must_text: Destination scenarios (recycler / charity donation / re-sale / internal re-use / certified
  destruction)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all possible end destinations for disposed equipment, including recycler, charity donation, re-sale,
  internal re-use, and certified destruction, in the disposal scope document.
- Name the responsible individual who approves each disposal scenario, avoiding generic titles like "IT"
  or "the team."
- Record the criteria used to select each destination scenario, referencing specific legal, contractual,
  or organisational requirements in the documentation.
- Attach dated evidence of the most recent review and approval of the disposal scope by a named manager.
