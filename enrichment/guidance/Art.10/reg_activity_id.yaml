must_id: item:Art.10:reg_activity_id
control_ref: Art.10
standard_id: GDPR:2016/679
must_text: Activity identifier per row (links to Art.30 RoPA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique activity identifier to each row in the Criminal Data Processing Register that matches
  the format used in your Article 30 Record of Processing Activities.
- Cross-reference each activity identifier in the Criminal Data Processing Register with the corresponding
  entry in your Article 30 processing record.
- Document the date each activity identifier was created or updated in the register.
- Name the person responsible for maintaining the activity identifiers, listing a specific individual
  rather than a team or department.
- Retain a version history of the register showing changes to activity identifiers and their links to
  Article 30 records.
