must_id: item:Art.10:rev_next_date
control_ref: Art.10
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Criminal Data Program in the review documentation, using
  a clear and specific future calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review alongside
  the planned date.
- Update the review schedule immediately if the planned date changes, and retain a dated record of the
  update.
- Avoid leaving the next review date blank or marked as "TBD"—always enter a concrete date.
