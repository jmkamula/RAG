must_id: item:Art.10:reg_approval
control_ref: Art.10
standard_id: GDPR:2016/679
must_text: Per-row approval signature + date
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each instance of criminal data processing as a separate row in the register, including the purpose
  and legal basis for processing.
- Assign a specific individual with authority to review and approve each row, avoiding generic titles
  like "the team" or "department."
- Sign and date each row upon approval, using a handwritten or secure digital signature traceable to the
  approver.
- Retain the signed and dated register entries in a secure location, accessible for audit and verification
  purposes.
