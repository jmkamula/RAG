must_id: item:Art.10:reg_ropa_xref
control_ref: Art.10
standard_id: GDPR:2016/679
must_text: Per-row cross-reference to Art.30 RoPA entry
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each criminal data processing activity in the register to its corresponding Article
  30 Record of Processing Activities (RoPA) entry by unique identifier.
- Document the date and name of the person who completed each cross-reference to ensure traceability.
- Attach a copy or direct link to the relevant RoPA entry for each row, not just a generic reference to
  the RoPA as a whole.
- Name the owner responsible for maintaining these cross-references as a specific individual, not a team
  or department.
- Review the register quarterly and record the date and reviewer’s name to confirm all cross-references
  remain accurate and up to date.
