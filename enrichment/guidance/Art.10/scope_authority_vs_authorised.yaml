must_id: item:Art.10:scope_authority_vs_authorised
control_ref: Art.10
standard_id: GDPR:2016/679
must_text: Official-authority vs specific-authorisation split — which activities fall in each
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each processing activity involving criminal offence data, stating whether it relies on 'official
  authority' or 'specific authorisation' under Member State law.
- Reference the exact section of Member State law that provides the legal basis for each activity, including
  statute name and article.
- Name the responsible individual who determined the legal basis split, avoiding generic titles like "the
  team" or "compliance department".
- Date the record where the legal basis for each activity was assigned, ensuring the document reflects
  the most recent review.
