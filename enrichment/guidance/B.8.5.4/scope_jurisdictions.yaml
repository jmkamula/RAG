must_id: item:B.8.5.4:scope_jurisdictions
control_ref: B.8.5.4
standard_id: ISO27701:2019
must_text: Jurisdictions where the org may receive legally-binding requests
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all countries and regions where your organisation operates, stores data, or has users, in a dated
  document approved by a named executive.
- Document each jurisdiction where your organisation may receive legally-binding requests, referencing
  relevant business activities or data processing locations.
- Name the individual responsible for maintaining and updating the jurisdiction list, avoiding generic
  titles like "Legal Team" or "Compliance Department."
- Review and update the jurisdiction list at least annually, recording the review date and the reviewer’s
  name.
