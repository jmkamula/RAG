must_id: item:B.8.5.4:reg_request_id
control_ref: B.8.5.4
standard_id: ISO27701:2019
must_text: Unique request identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique identifier to each disclosure request as you enter it in the register, using a sequential
  or otherwise non-repeating format.
- Record the unique identifier in a dedicated column for every row, ensuring no two requests share the
  same identifier.
- Cross-reference each identifier with supporting documentation for the request, such as correspondence
  or legal notices, to confirm traceability.
- Review the register regularly to confirm there are no duplicate or missing identifiers, documenting
  the date and name of the reviewer.
