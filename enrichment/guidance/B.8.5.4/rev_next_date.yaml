must_id: item:B.8.5.4:rev_next_date
control_ref: B.8.5.4
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Disclosure Request Program in a clearly visible section of
  the review document.
- Record the date the current review was completed, ensuring it is distinct from the next planned review
  date.
- Name the individual responsible for scheduling the next review, using their full name rather than a
  role or team.
- Confirm that the next planned review date is within the review frequency stated in your policy or procedure.
- Avoid leaving the next review date field blank or marked "TBD"—auditors will flag missing or non-specific
  dates.
