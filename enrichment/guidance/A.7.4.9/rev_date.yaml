must_id: item:A.7.4.9:rev_date
control_ref: A.7.4.9
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the transmission program in a dated log or register entry.
- State the planned review interval for the transmission program in a documented schedule or policy.
- Confirm the actual review date falls within the documented planned interval by cross-referencing the
  review log and schedule.
- Name the reviewer as a specific individual in the review record, not as a team or department.
