must_id: item:A.7.4.9:rev_next_date
control_ref: A.7.4.9
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the transmission program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Document the date when the current review was completed to provide context for the scheduled next review.
- Attach evidence of management acknowledgement, such as a dated signature or email confirmation, for
  the next planned review date.
