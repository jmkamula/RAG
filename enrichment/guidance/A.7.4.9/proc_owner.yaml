must_id: item:A.7.4.9:proc_owner
control_ref: A.7.4.9
standard_id: ISO27701:2019
must_text: Named owner (Infrastructure + Security Engineering)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the PII Transmission Controls Procedure, not a team or department.
- Document the owner's full name and job title within the procedure's header or title page.
- Record the date the owner was assigned responsibility in the procedure document.
- Obtain the owner's signature or written confirmation acknowledging their responsibility for the procedure.
