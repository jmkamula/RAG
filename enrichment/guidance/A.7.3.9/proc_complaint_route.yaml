must_id: item:A.7.3.9:proc_complaint_route
control_ref: A.7.3.9
standard_id: ISO27701:2019
must_text: Complaint route — subjects informed of right to complain to SA (Art.77 route)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure that data subjects are informed of their right to lodge a complaint with the
  relevant supervisory authority, referencing GDPR Article 77.
- Document the exact wording used to notify data subjects about this right, including the supervisory
  authority’s contact details.
- Include a step requiring periodic review of the notification text to ensure it remains accurate and
  references the correct authority.
- Name the person responsible for maintaining and updating this section of the procedure as a specific
  individual, not a generic role or team.
