must_id: item:Art.38:reg_budget_approval
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: Per-row budget approval / spend evidence (Art.38.2 resources)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual responsible for DPO budget decisions in each register row, avoiding generic
  titles like "management" or "the team".
- Record the specific budget amount allocated for DPO activities per row, including the date of approval.
- Attach or cross-reference supporting evidence for each spend, such as invoices, contracts, or purchase
  orders, linked to the corresponding register entry.
- Document the approval of each budget or spend item with the approver’s full name, signature (physical
  or electronic), and approval date.
