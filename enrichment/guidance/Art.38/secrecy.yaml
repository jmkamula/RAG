must_id: item:Art.38:secrecy
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: Confidentiality / secrecy obligations of DPO documented (Art.38.5)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the DPO’s confidentiality and secrecy obligations in a written procedure, referencing Article
  38.5 of the GDPR.
- Name the DPO as a specific individual in the procedure, not as a generic role or department.
- Record the date the confidentiality obligations were last reviewed and approved by senior management.
- Obtain the DPO’s signed acknowledgment of their confidentiality and secrecy obligations, and retain
  this record.
