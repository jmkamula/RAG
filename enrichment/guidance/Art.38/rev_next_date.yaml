must_id: item:Art.38:rev_next_date
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the DPO Position Program in the review documentation, using a
  clear and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a team or department.
- Confirm that the stated review date is visible in the most recent version of the DPO Position Program
  documentation.
- Retain a copy of the previous review record showing the last review date and the decision for the next
  planned review.
