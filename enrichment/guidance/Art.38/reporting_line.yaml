must_id: item:Art.38:reporting_line
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: DPO reporting line — directly to highest management level (Art.38.3)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Data Protection Officer (DPO) and the specific individual or role at the highest management
  level to whom they report.
- Document the formal reporting structure in an organisational chart, showing a direct line from the DPO
  to top management.
- Record the date and content of the most recent meeting or report delivered by the DPO directly to the
  highest management level.
- Attach a signed statement from the highest management level confirming the DPO’s direct reporting line
  as described in the procedure.
- Avoid describing the reporting line vaguely or using generic terms like “senior management” without
  naming the specific role or individual.
