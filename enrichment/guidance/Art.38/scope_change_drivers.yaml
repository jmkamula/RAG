must_id: item:Art.38:scope_change_drivers
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: Trigger list (org restructure, DPO transition, new business line)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all organisational changes that could impact the DPO’s role, such as restructures, DPO transitions,
  or launching new business lines, in a dated document.
- Document the process for reviewing and updating the DPO’s position scope whenever a trigger event from
  the list occurs.
- Assign responsibility for monitoring these trigger events to a named individual, not a generic team
  or department.
- Record each instance when the trigger list is reviewed or updated, including the date and the person
  who performed the review.
