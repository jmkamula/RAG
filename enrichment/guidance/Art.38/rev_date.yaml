must_id: item:Art.38:rev_date
control_ref: Art.38
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Data Protection Officer (DPO) position program in a dated
  log or review report.
- Cross-reference the recorded review date with your documented review schedule to confirm it falls within
  the planned interval.
- Name the reviewer as a specific individual responsible for the program review, not a group or department.
- Retain the signed or approved review report as evidence of the completed review and its timing.
