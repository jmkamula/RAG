must_id: item:4.3:rev_next_date
control_ref: '4.3'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the ISMS scope program in the documented review schedule.
- Record the review date in a dated and version-controlled document approved by management.
- Name the person responsible for conducting the next review as a specific individual, not a team or department.
- Cross-reference the stated review date with your organisation’s master compliance calendar to confirm
  alignment.
