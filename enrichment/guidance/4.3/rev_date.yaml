must_id: item:4.3:rev_date
control_ref: '4.3'
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent ISMS scope program review in a central document or register.
- State the planned review interval for the ISMS scope program in a documented schedule or policy.
- Confirm that the actual review date falls within the planned interval by cross-referencing the schedule
  and the review record.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
