must_id: item:4.3:boundaries
control_ref: '4.3'
standard_id: ISO27001:2022
must_text: Boundaries of the ISMS defined
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the physical locations, business units, and systems included and excluded from the ISMS in a dated
  scope statement document.
- Name the person responsible for defining and maintaining the ISMS scope as a specific individual, not
  a group or department.
- Reference supporting documents, such as organizational charts or asset inventories, that justify the
  boundaries described in the scope statement.
- Obtain formal approval of the scope statement by a named senior manager, with signature and date.
