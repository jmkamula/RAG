must_id: item:A.8.5:bl_mfa_scope
control_ref: A.8.5
standard_id: ISO27001:2022
must_text: MFA scope — universal for privileged + remote + cross-tenant; risk-based elsewhere (modern
  baseline; phishing-resistant MFA preferred)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name all systems and applications in scope, listing which require multi-factor authentication for privileged,
  remote, and cross-tenant access.
- Document the risk assessment that justifies any exceptions to universal multi-factor authentication,
  including the rationale and date of review.
- Specify the preferred use of phishing-resistant multi-factor authentication methods, referencing implementation
  details or vendor documentation where applicable.
- Assign a specific individual as the owner of the secure authentication baseline, avoiding generic titles
  like "IT team" or "security group."
- Record the date the secure authentication baseline was last approved by management, including the approver’s
  name and signature.
