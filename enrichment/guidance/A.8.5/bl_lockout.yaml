must_id: item:A.8.5:bl_lockout
control_ref: A.8.5
standard_id: ISO27001:2022
must_text: Lockout / throttling configured for failed attempts
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the current lockout or throttling settings for failed authentication attempts, including thresholds
  and durations, in your secure authentication baseline record.
- Name the person responsible for configuring and maintaining lockout or throttling controls as a specific
  individual, not a team or department.
- Record the date and outcome of the most recent test or review confirming lockout or throttling activates
  after the defined number of failed attempts.
- Retain screenshots or system logs showing a failed login sequence triggering lockout or throttling,
  with visible timestamps.
