must_id: item:A.8.5:bl_password_standard
control_ref: A.8.5
standard_id: ISO27001:2022
must_text: Password standard configured (length, breach-list checking, no rotation unless compromise —
  NIST 800-63B alignment)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the minimum password length and complexity requirements in a dated Secure Authentication Baseline
  policy aligned with NIST 800-63B.
- Record the technical configuration settings that enforce password length and breach-list checking in
  your authentication system’s admin console, including screenshots.
- Confirm that password rotation is only triggered by suspected compromise, not on a fixed schedule, in
  both policy and system configuration.
- Name the policy owner as a specific individual responsible for authentication standards, not a generic
  team or department.
- Retain evidence of the last review and approval of the Secure Authentication Baseline, including the
  approver’s name and approval date.
