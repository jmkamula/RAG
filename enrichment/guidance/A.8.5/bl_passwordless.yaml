must_id: item:A.8.5:bl_passwordless
control_ref: A.8.5
standard_id: ISO27001:2022
must_text: Passwordless / phishing-resistant authentication available for privileged users
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the authentication methods available to privileged users, specifying which are passwordless
  or phishing-resistant, in a dated technical baseline.
- Name the privileged user groups and list the individuals who are required to use passwordless or phishing-resistant
  authentication.
- Record the date when passwordless or phishing-resistant authentication was enabled for each privileged
  user group.
- Retain evidence of communication to privileged users about the requirement to use passwordless or phishing-resistant
  authentication, such as an email or announcement.
- Name the owner as a specific individual responsible for maintaining and updating the secure authentication
  baseline, not as a team or department.
