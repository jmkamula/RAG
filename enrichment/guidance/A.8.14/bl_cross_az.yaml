must_id: item:A.8.14:bl_cross_az
control_ref: A.8.14
standard_id: ISO27001:2022
must_text: Cross-AZ / cross-region distribution for cloud-hosted services (modern baseline; single-AZ
  insufficient)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the cloud-hosted services that require redundancy, listing each service and its current deployment
  architecture with date of assessment.
- Record the specific regions and availability zones where each service is deployed, including screenshots
  or configuration exports as evidence.
- Name the individual responsible for maintaining and reviewing the redundancy baseline, avoiding generic
  roles like "IT" or "the team".
- Confirm that no critical service is deployed in a single availability zone by cross-referencing deployment
  records with the redundancy requirement.
- Retain approval of the redundancy baseline by a named senior manager, including the date and version
  of the approved document.
