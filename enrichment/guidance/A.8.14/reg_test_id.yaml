must_id: item:A.8.14:reg_test_id
control_ref: A.8.14
standard_id: ISO27001:2022
must_text: Per-test unique identifier
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique identifier to each failover test entry before the test begins, using a sequential or
  timestamp-based numbering system.
- Record the unique identifier alongside the test date, test scope, and responsible individual in the
  Failover Test Register.
- Cross-reference the unique identifier in all related test documentation, such as test plans, results,
  and incident logs.
- Name the test owner as a specific individual for each entry, avoiding generic labels like "IT team"
  or "Operations".
