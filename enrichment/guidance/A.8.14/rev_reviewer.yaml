must_id: item:A.8.14:rev_reviewer
control_ref: A.8.14
standard_id: ISO27001:2022
must_text: Reviewer identity (Site Reliability + Infrastructure + business-service owners)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer as a specific individual from Site Reliability, Infrastructure, and the relevant
  business-service owner in the review record.
- Record the date each reviewer completed their review in the periodic redundancy program review log.
- Retain evidence of each reviewer's input, such as comments or sign-off, attached to the review documentation.
- Avoid listing groups or roles only; specify named persons to clearly show individual accountability.
