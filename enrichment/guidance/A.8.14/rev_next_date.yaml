must_id: item:A.8.14:rev_next_date
control_ref: A.8.14
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the redundancy program in the most recent review report or meeting
  minutes.
- Record the name of the individual responsible for scheduling the next review alongside the planned date.
- Confirm the review date is specific and future-dated, not left as "TBD" or "annually" without a calendar
  date.
- Retain a copy of the dated document where the next review date is clearly stated and approved.
