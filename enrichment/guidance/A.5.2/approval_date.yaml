must_id: item:A.5.2:approval_date
control_ref: A.5.2
standard_id: ISO27001:2022
must_text: Approval date recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the approving top management individual by full name and job title in the roles and responsibilities
  allocation document.
- Record the approval date clearly next to the signature or approval statement within the document.
- Sign the allocation document physically or electronically to confirm formal approval by top management.
- Avoid leaving the approval date field blank or using undated templates, as auditors will flag missing
  or unclear approval dates.
