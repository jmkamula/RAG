must_id: item:A.5.2:approval_authority
control_ref: A.5.2
standard_id: ISO27001:2022
must_text: Statement of the signatory's authority to approve (delegation chain if not CEO)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the approving individual by full name and job title, ensuring they are a specific person rather
  than a group or department.
- Document the signatory’s authority to approve by referencing the relevant delegation letter, board resolution,
  or organisational chart.
- State the date of approval clearly on the document to establish when the roles and responsibilities
  allocation was authorised.
- Attach or cross-reference the delegation chain if the signatory is not the CEO, showing the flow of
  authority from the top level.
