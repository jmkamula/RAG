must_id: item:A.5.2:comm_onboarding
control_ref: A.5.2
standard_id: ISO27001:2022
must_text: Communication built into joiner onboarding so new role-holders are briefed on appointment
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Update the onboarding checklist to include a step for briefing new role-holders on their information
  security responsibilities, with the checklist owner named.
- Record the date and name of each new joiner who receives the roles and responsibilities briefing in
  a central log.
- Attach a signed or acknowledged copy of the briefing document to each new joiner’s personnel file as
  evidence of communication.
- Name the individual responsible for delivering the briefing, avoiding generic titles like "HR" or "the
  team".
