must_id: item:A.5.2:review_outcome
control_ref: A.5.2
standard_id: ISO27001:2022
must_text: Outcome of the review (no change / amended to vN / role added or removed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual responsible for conducting the roles and responsibilities
  review, not a generic title or team.
- Record the date the review was completed in the review log or register.
- State the outcome of the review clearly, specifying if there was no change, an amendment with the new
  version number, or a role added or removed.
- Attach supporting evidence, such as updated role descriptions or approval emails, to the review record
  for any amendments or changes made.
- Sign or formally approve the review record to confirm the accuracy and completion of the review process.
