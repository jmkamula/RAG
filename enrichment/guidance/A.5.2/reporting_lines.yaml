must_id: item:A.5.2:reporting_lines
control_ref: A.5.2
standard_id: ISO27001:2022
must_text: Reporting and escalation lines stated (who each role reports to)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each information security role in the matrix with the full name and job title of the person currently
  holding the role.
- State the direct reporting line for each role by naming the specific individual or position to whom
  the role reports.
- Document the escalation path for each role by specifying who issues must be escalated to, using named
  individuals or unique job titles.
- Avoid using generic terms like "the team" or "management" for reporting or escalation; always specify
  a named person or unique position.
