must_id: item:A.5.1:review_outcome
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Outcome of the review (no change / amended to vN / retired)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date the information security policy review was completed in a dated entry on the review
  record.
- State the outcome of the review as "no change," "amended to vN," or "retired," and include the version
  number if amended.
- Name the reviewer as a specific individual responsible for the review, not a group or department.
- Sign or otherwise formally approve the review outcome to show it was authorized by the appropriate person.
