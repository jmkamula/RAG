must_id: item:A.5.1:roles
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Roles and responsibilities for information security
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the information security policy, avoiding generic titles
  like "the team" or "IT department".
- Document each key information security role and its responsibilities in the policy, listing job titles
  and a summary of duties.
- Record the date the policy was last reviewed and approved by senior management, including the approver’s
  full name and signature.
- Cross-reference the policy with an up-to-date organisational chart to show alignment between named roles
  and actual staff positions.
