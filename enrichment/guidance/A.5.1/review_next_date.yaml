must_id: item:A.5.1:review_next_date
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date in the policy review record, using a clear and specific calendar
  date.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Confirm that the stated review date aligns with your organisation’s defined policy review cycle or schedule.
- Retain the dated review record in a location accessible to relevant stakeholders for reference during
  audits.
