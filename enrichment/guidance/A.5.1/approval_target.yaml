must_id: item:A.5.1:approval_target
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Reference to the specific policy version being approved
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific policy version, including version number and date, in the approval document to clearly
  identify what is being approved.
- Record the approval date alongside the policy version reference in the approval record.
- Assign the approval to a named individual in top management, not a group or generic title.
- Retain a copy of the signed approval document that explicitly references the approved policy version.
