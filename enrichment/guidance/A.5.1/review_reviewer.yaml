must_id: item:A.5.1:review_reviewer
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Reviewer identity and role
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full name of the person who conducted the policy review in the review record.
- State the reviewer’s official job title or role next to their name in the review documentation.
- Name the reviewer as a specific individual — do not use group names, generic titles, or departments.
- Date the review entry to show when the individual completed their assessment.
