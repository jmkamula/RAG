must_id: item:A.5.1:approval_signatory
control_ref: A.5.1
standard_id: ISO27001:2022
must_text: Signatory at top-management level (CEO, board chair, or delegated equivalent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the signatory as a specific top management individual, such as the CEO or board chair, on the policy
  approval page.
- Record the approval date next to the signature to show when top management formally endorsed the information
  security policy.
- Retain a signed copy of the approved policy in a central repository accessible for audit and reference.
- Document any delegation of approval authority in meeting minutes or a formal memo, including the name
  and title of the delegate.
