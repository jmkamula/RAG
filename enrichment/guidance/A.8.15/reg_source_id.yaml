must_id: item:A.8.15:reg_source_id
control_ref: A.8.15
standard_id: ISO27001:2022
must_text: Per-source identifier (system / app / network device)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each log source in the register with a unique identifier that clearly distinguishes it from all
  other sources.
- Specify the type of each log source, such as system, application, or network device, alongside its unique
  identifier.
- Name the owner of each log source as a specific individual, not a team or department, in the register.
- Record the date each log source was added or updated in the register for traceability.
- Cross-reference each identifier in the register with the actual system or device configuration to confirm
  accuracy.
