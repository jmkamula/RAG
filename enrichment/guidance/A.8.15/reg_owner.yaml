must_id: item:A.8.15:reg_owner
control_ref: A.8.15
standard_id: ISO27001:2022
must_text: Per-source named owner (system / app owner)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each log source entry, avoiding generic labels like "IT"
  or "the team".
- Record the owner's full name and job title next to each log source in the register.
- Document the date when each owner was assigned responsibility for their log source.
- Review and update the register at least annually, retaining a dated record of each review.
