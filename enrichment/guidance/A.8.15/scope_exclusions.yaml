must_id: item:A.8.15:scope_exclusions
control_ref: A.8.15
standard_id: ISO27001:2022
must_text: Exclusion rationale + compensating controls per excluded class
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all system and data classes considered for logging, including those ultimately excluded, in a dated
  logging scope document.
- State the specific rationale for excluding each class from logging, referencing relevant risk assessments
  or business justifications.
- Describe any compensating controls applied to each excluded class, such as monitoring or manual review,
  in the same document.
- Name the individual responsible for approving each exclusion and compensating control, avoiding generic
  titles or group names.
- Retain signed approval records for all exclusions and compensating controls, including the date of decision.
