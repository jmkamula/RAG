must_id: item:A.8.1:scope_classes
control_ref: A.8.1
standard_id: ISO27001:2022
must_text: Endpoint classes enumerated (laptop / desktop / mobile / tablet / contractor-owned)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all endpoint device types in use, such as laptops, desktops, mobile phones, tablets, and contractor-owned
  devices, in a dated inventory document.
- Name the person responsible for maintaining the endpoint inventory as a specific individual, not a team
  or department.
- Record the date when the endpoint scope was last reviewed and updated, and keep a copy of the review
  decision.
- Cross-reference each endpoint class with relevant security controls in your asset register to show how
  each is managed.
