must_id: item:A.8.29:rev_pen_test_feedback
control_ref: A.8.29
standard_id: ISO27001:2022
must_text: Pen-test outcomes feeding back into procedure / scope / training
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the date and results of the most recent penetration test in your security testing program review
  file.
- Record any changes made to security procedures, scope, or staff training that directly resulted from
  penetration test findings, with clear links to the test report.
- Name the individual responsible for reviewing penetration test outcomes and updating relevant procedures
  or training materials.
- Attach evidence of communication to staff about updated procedures or training, such as a dated email
  or training attendance record.
- Avoid referencing generic lessons learned; specify how each pen-test outcome led to a concrete update
  in your documented processes.
