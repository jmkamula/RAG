must_id: item:A.8.29:rev_reviewer
control_ref: A.8.29
standard_id: ISO27001:2022
must_text: Reviewer identity (Security Engineering + Engineering leads)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer by full name and job title, specifying both a Security Engineering lead and an Engineering
  lead for each review cycle.
- Record the date each review was completed and link it to the corresponding periodic security testing
  program documentation.
- Sign the review outcome using a digital or handwritten signature from both designated leads to confirm
  their participation.
- Avoid listing generic roles or teams as reviewers; always identify specific individuals responsible
  for the review.
