must_id: item:A.8.29:rev_next_date
control_ref: A.8.29
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the security testing program in the documented review schedule.
- Record the name of the individual responsible for scheduling and conducting the next review.
- Update the review schedule immediately after each review to reflect the new planned date.
- Specify the review date as a calendar date, not just a vague timeframe like "quarterly" or "annually".
