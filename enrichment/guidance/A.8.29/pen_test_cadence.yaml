must_id: item:A.8.29:pen_test_cadence
control_ref: A.8.29
standard_id: ISO27001:2022
must_text: Third-party penetration-testing cadence (annual + on significant change for customer-facing
  PII-touching apps; modern baseline)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the required frequency for third-party penetration testing as at least annually and after significant
  changes to customer-facing applications handling personal data.
- Name the specific individual responsible for scheduling and overseeing third-party penetration tests,
  not a team or generic role.
- Document each completed penetration test with the test date, scope, third-party provider, and summary
  of findings in a central register.
- Retain signed engagement agreements and final reports from third-party testers for each annual and post-change
  test.
- Record the decision and rationale for what qualifies as a "significant change" to ensure consistent
  application of the testing trigger.
