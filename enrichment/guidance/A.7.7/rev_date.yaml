must_id: item:A.7.7:rev_date
control_ref: A.7.7
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Clear Desk / Clear Screen Program in a dated log or review
  register.
- State the planned review interval for the program in a documented schedule or policy, specifying the
  frequency in months or years.
- Compare the actual review date against the planned interval and document any deviations or missed reviews
  in the same record.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
