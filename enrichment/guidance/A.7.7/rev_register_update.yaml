must_id: item:A.7.7:rev_register_update
control_ref: A.7.7
standard_id: ISO27001:2022
must_text: Changes propagated to the policy
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and outcome of the most recent Clear Desk / Clear Screen program review in a formal
  meeting summary or review log.
- Name the individual responsible for updating the policy based on review findings, specifying their full
  name and job title.
- Document specific changes made to the Clear Desk / Clear Screen policy, referencing the review findings
  that prompted each change.
- Retain a copy of the updated policy with a new version number and revision date, signed or approved
  by the designated authority.
- Avoid using generic statements like "policy updated as needed"—detail the actual amendments and their
  effective dates.
