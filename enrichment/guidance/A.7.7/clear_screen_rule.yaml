must_id: item:A.7.7:clear_screen_rule
control_ref: A.7.7
standard_id: ISO27001:2022
must_text: Clear-screen rule (screen lock on leaving, automatic lockout after N minutes)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the required screen lock behavior in the policy, including both manual lock on leaving and automatic
  lockout after a set number of minutes.
- Name the specific time limit for automatic screen lockout, such as "10 minutes," rather than using vague
  terms like "after a short period."
- Assign responsibility for enforcing and monitoring the clear-screen rule to a named individual, not
  a team or department.
- Record the date the policy was last reviewed and approved by a named manager or policy owner.
- Document the technical method used to enforce automatic screen lockout, such as system settings or group
  policies, with screenshots or configuration logs.
