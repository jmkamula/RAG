must_id: item:A.7.5:rev_date
control_ref: A.7.5
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Environmental Protection Program in a dated log or review
  tracker.
- Name the person responsible for scheduling and conducting the review as a specific individual, not a
  group or department.
- Document the planned review interval in months or years, as approved by management, within the program
  documentation.
- Attach evidence of the completed review, such as a signed review report or meeting minutes, showing
  the actual review date.
- Cross-reference the review date against the planned interval to confirm it falls within the required
  timeframe.
