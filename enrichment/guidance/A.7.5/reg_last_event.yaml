must_id: item:A.7.5:reg_last_event
control_ref: A.7.5
standard_id: ISO27001:2022
must_text: Per-row last actual event of this threat type (drives re-assessment cadence)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and description of the most recent actual event for each threat type in a dedicated
  column of the threat register.
- Name the person responsible for updating each row with the latest event information, using their full
  name rather than a generic role.
- Cross-reference each event entry with supporting incident reports or logs to verify accuracy and provide
  traceable evidence.
- Update the register promptly after any new event occurs, ensuring no row is left with an undated or
  generic "never" entry.
