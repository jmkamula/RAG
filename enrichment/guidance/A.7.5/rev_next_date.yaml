must_id: item:A.7.5:rev_next_date
control_ref: A.7.5
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Environmental Protection Program in the review schedule or
  meeting minutes.
- Record the date the last review was completed, along with the names of participants, in a dated review
  log.
- Name the individual responsible for scheduling and conducting the next review, listing them by full
  name and job title.
- Avoid leaving the next review date blank or marked as "TBD"—specify an exact calendar date.
