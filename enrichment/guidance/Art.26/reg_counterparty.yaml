must_id: item:Art.26:reg_counterparty
control_ref: Art.26
standard_id: GDPR:2016/679
must_text: Per-row joint-controller counterparty
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each joint controller relationship as a separate row, naming the specific counterparty organisation
  involved in the arrangement.
- Record the full legal name and primary contact details for each joint controller counterparty in the
  corresponding row.
- State the start date of the joint controller relationship for each entry, ensuring the date is clearly
  documented.
- Name the owner of the register as a specific individual, not a team or department, in a dedicated column.
