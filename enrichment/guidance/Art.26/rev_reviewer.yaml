must_id: item:Art.26:rev_reviewer
control_ref: Art.26
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and legal counsel.
- Record the date each reviewer completed their assessment of the Joint Controller Program, capturing
  this in a version-controlled review log.
- Document the review comments or sign-off from both the Data Protection Officer and legal counsel, attaching
  their signatures or digital approvals.
- Avoid listing roles or departments only; ensure each review entry clearly identifies the actual person
  responsible for the review.
