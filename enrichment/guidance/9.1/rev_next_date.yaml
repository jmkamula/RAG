must_id: item:9.1:rev_next_date
control_ref: '9.1'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the monitoring program in the review documentation, using a clear
  and specific calendar date.
- Name the individual responsible for conducting the next review, listing their full name and job title
  in the program review record.
- Record the date when the current review was completed, ensuring it is clearly visible in the monitoring
  program documentation.
- Avoid leaving the next review date as "TBD" or "annually"—always specify an exact date to prevent auditor
  findings.
