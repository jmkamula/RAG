must_id: item:B.8.2.5:rev_audit_rights_audit
control_ref: B.8.2.5
standard_id: ISO27701:2019
must_text: Audit rights audit — customer audits requested + granted per contract tier
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each customer audit request with the requestor’s name, date received, and contract tier referenced
  in a central register.
- Record the organisation’s response to each audit request, including approval or denial, the decision
  date, and the individual who made the decision.
- Cross-reference each granted audit with the relevant contract clause that outlines the customer’s audit
  rights for their tier.
- Name the decision-maker for each audit request as a specific individual, not a group or department.
- Retain supporting correspondence for each audit request and response, including emails and signed agreements,
  in an auditable repository.
