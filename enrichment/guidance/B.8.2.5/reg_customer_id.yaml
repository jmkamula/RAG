must_id: item:B.8.2.5:reg_customer_id
control_ref: B.8.2.5
standard_id: ISO27701:2019
must_text: Requesting customer identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a unique customer identifier in each row of the Customer Audit + Information Support Register
  to clearly link requests to individual customers.
- Cross-reference each customer identifier with supporting documentation that verifies the customer's
  identity and scope of the request.
- Name the requester as a specific individual, not a generic role or department, to avoid ambiguity in
  audit records.
- Date each entry to show when the customer request was logged and processed.
