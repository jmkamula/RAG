must_id: item:A.5.16:rev_trigger_type
control_ref: A.5.16
standard_id: ISO27001:2022
must_text: Trigger type per record (termination / contract_end / suspension_to_disable / incident_revocation
  / orphan_cleanup)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- 'Record the trigger type for each identity revocation event, selecting from the approved list: termination,
  contract_end, suspension_to_disable, incident_revocation, or orphan_cleanup.'
- Document the date and time when the revocation was actioned for each identity in the revocation record.
- Name the individual who authorized the revocation, ensuring a specific person is listed rather than
  a team or department.
- Cross-reference each revocation record with the relevant supporting documentation, such as termination
  notice or incident report.
- Avoid using generic or undefined trigger types; only use the specified categories to prevent auditor
  rejection of the record.
