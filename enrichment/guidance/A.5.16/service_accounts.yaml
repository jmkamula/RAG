must_id: item:A.5.16:service_accounts
control_ref: A.5.16
standard_id: ISO27001:2022
must_text: Service / shared / non-human account governance (named human owner, expiry, scope, monitoring)
  — promoted from SHOULD because this is the weakest spot in most identity hygiene programs
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each service, shared, or non-human account in the identity
  register, avoiding generic roles or teams.
- Record the intended scope and permitted activities for each account in a dated entry within the identity
  lifecycle management procedure.
- Document an explicit expiry or review date for every service, shared, or non-human account, and update
  the register when extensions are granted.
- Log evidence of periodic monitoring for unusual activity on these accounts, including the date reviewed
  and the reviewer’s name.
- Retain approval records for the creation, renewal, or decommissioning of each account, signed and dated
  by the designated owner.
