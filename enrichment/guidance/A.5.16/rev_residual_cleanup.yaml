must_id: item:A.5.16:rev_residual_cleanup
control_ref: A.5.16
standard_id: ISO27001:2022
must_text: Residual-cleanup status per record (mailbox forwarding configured, file-share access transferred
  or revoked, group memberships cleared)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the status of mailbox forwarding for each departing user, including the date forwarding was configured
  or explicitly not required.
- Document whether all file-share access for the individual has been transferred to another user or revoked,
  listing specific shares and actions taken.
- List all group memberships held by the user and confirm the date each was removed or reassigned, referencing
  supporting system logs.
- Name the responsible person who verified and signed off on the completion of all residual-cleanup actions
  for each identity.
- Avoid leaving any cleanup status fields blank or marked as "N/A" without explanation, as auditors will
  flag incomplete records.
