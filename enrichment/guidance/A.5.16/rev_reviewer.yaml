must_id: item:A.5.16:rev_reviewer
control_ref: A.5.16
standard_id: ISO27001:2022
must_text: Reviewer identity (IT identity-lead + HR partner + InfoSec lead jointly)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the IT identity-lead, HR partner, and InfoSec lead as individual reviewers in the review record,
  not as roles or teams.
- Record the date each reviewer completed their portion of the periodic identity-management program review
  in the official review log.
- Require each named reviewer to sign or electronically acknowledge their participation and agreement
  with the review findings.
- Retain the completed review document with all reviewer names and signatures in a central, access-controlled
  repository.
