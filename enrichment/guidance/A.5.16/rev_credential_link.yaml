must_id: item:A.5.16:rev_credential_link
control_ref: A.5.16
standard_id: ISO27001:2022
must_text: Cross-reference to A.5.17 credential-revocation record (paired event; both must complete to
  close the loop)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference the per-identity revocation record to the specific credential-revocation record by unique
  identifier or ticket number.
- Record the date and time when both the identity and credential revocation actions are completed.
- Name the individual responsible for verifying that both records are present and matched before closing
  the revocation event.
- Attach evidence of the completed credential-revocation record; do not rely on verbal confirmation or
  unchecked status fields.
- Document any discrepancies or delays between identity and credential revocation, including actions taken
  to resolve them.
