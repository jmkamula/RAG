must_id: item:6.3:rev_next_date
control_ref: '6.3'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the ISMS Change Program in the review documentation, using a
  clear and specific calendar date.
- Record the date in a section labeled "Next Review Date" within the official ISMS Change Program Review
  document.
- Name the reviewer or responsible individual for the next review, avoiding generic titles like "the team"
  or "management."
- Retain a dated copy of the review document showing both the most recent and next planned review dates.
