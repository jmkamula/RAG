must_id: item:A.8.34:reg_scope
control_ref: A.8.34
standard_id: ISO27001:2022
must_text: Per-engagement scope description (systems / data / techniques agreed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific systems, data sets, and testing techniques agreed for each audit engagement in the
  register entry for that engagement.
- Name the individual who approved the engagement scope, including their full name and role, not just
  a department or team.
- Document the date when the engagement scope was agreed and entered into the register.
- Attach or cross-reference any supporting correspondence or signed agreements that detail the scope for
  each engagement.
