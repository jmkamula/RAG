must_id: item:A.8.34:scope_systems
control_ref: A.8.34
standard_id: ISO27001:2022
must_text: Operational systems in scope (drawn from A.5.9 asset register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all operational systems included in the audit scope, using their exact names as recorded in your
  asset register.
- Cross-reference each system in the audit scope list to its corresponding entry in the A.5.9 asset register,
  including asset ID or unique identifier.
- Name the individual responsible for confirming the accuracy and completeness of the operational systems
  list, avoiding generic roles or team names.
- Record the date when the audit testing scope was finalized and approved, ensuring this matches supporting
  documentation.
