must_id: item:A.8.34:scope_exclusions
control_ref: A.8.34
standard_id: ISO27001:2022
must_text: Exclusion rationale (routine application testing via A.8.29; non-operational test-bed work)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific systems, applications, or environments excluded from A.8.34 testing in a dated scope
  document.
- Document the rationale for each exclusion, referencing routine application testing under A.8.29 or non-operational
  test-bed activities.
- Name the individual who approved each exclusion, avoiding generic roles like "the team" or "IT department".
- Cross-reference the exclusion rationale to supporting records or policies that demonstrate the boundary
  between A.8.34 and A.8.29.
