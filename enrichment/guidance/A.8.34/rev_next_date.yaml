must_id: item:A.8.34:rev_next_date
control_ref: A.8.34
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Audit Testing Protection Program in the review documentation,
  using a clear and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a team or department.
- Document the date when the current review was completed, providing a timeline reference for the next
  scheduled review.
- Attach evidence of management approval or sign-off for the stated next review date, such as a signed
  meeting minute or email confirmation.
