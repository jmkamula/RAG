must_id: item:A.8.34:time_windows
control_ref: A.8.34
standard_id: ISO27001:2022
must_text: Time-window discipline (avoid peak business hours / change-freezes / customer events)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the approved time windows for audit testing in the policy, referencing specific hours or dates
  that avoid peak business periods and change-freeze windows.
- Document the process for scheduling audit activities, including a requirement to check for conflicts
  with customer events or critical business operations.
- Name the individual responsible for approving audit testing schedules, ensuring this is a specific person
  rather than a team or department.
- Retain records of all audit testing approvals, including date, time window, and evidence of conflict
  checks, in a central repository.
- Cross-reference the policy with the organisation’s change-freeze calendar and major event schedule to
  show alignment of audit windows.
