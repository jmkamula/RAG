must_id: item:A.8.27:rev_date
control_ref: A.8.27
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent architecture principles review date in a central log, clearly showing when the
  review took place.
- State the planned review interval in months or years within the architecture principles documentation.
- Confirm the next scheduled review date is set and documented, matching the stated interval.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach meeting notes or a signed summary from the latest review as evidence of completion.
