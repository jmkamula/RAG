must_id: item:A.8.27:principles
control_ref: A.8.27
standard_id: ISO27001:2022
must_text: Principles enumerated (defence-in-depth / least-privilege / fail-safe-defaults / separation-of-concerns
  / complete-mediation / zero-trust direction)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each required security principle explicitly in the policy, using clear language for defence-in-depth,
  least-privilege, fail-safe-defaults, separation-of-concerns, complete-mediation, and zero-trust.
- Name the author of the policy as a specific individual, not a group or department.
- Record the date the policy was last reviewed and updated, showing it reflects current security approaches.
- Reference supporting documents or standards that inform or expand on each principle, such as architecture
  diagrams or engineering guidelines.
