must_id: item:A.8.27:reg_context
control_ref: A.8.27
standard_id: ISO27001:2022
must_text: Per-pattern applicable context (when to use this pattern)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific business scenarios or systems where each reference architecture pattern should be
  used in the register entry.
- Document the date when the applicable context for each pattern was last reviewed or updated in the register.
- Name the person responsible for defining and updating the applicable context for each pattern, using
  a specific individual rather than a team or department.
- Cross-reference any supporting policy or guideline that describes the decision criteria for applying
  each pattern within the register entry.
