must_id: item:A.8.27:rev_next_date
control_ref: A.8.27
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the architecture principles in a dated document, such as the
  review meeting minutes or a tracked action log.
- Name the person responsible for scheduling the next review as a specific individual, not a group or
  department.
- Record the decision on the review date in a central register or governance calendar that is accessible
  to relevant stakeholders.
- Retain evidence of communication about the next review date, such as an email or calendar invite sent
  to all participants.
