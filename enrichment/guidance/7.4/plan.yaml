must_id: item:7.4:plan
control_ref: '7.4'
standard_id: ISO27001:2022
must_text: Communication plan document referenced
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Reference the current communication plan document by title and version number within the ISMS Communication
  Procedure.
- State the location where the communication plan document is stored, including the file path or document
  management system link.
- Name the owner of the communication plan as a specific individual, not a group or department.
- Record the date when the communication plan was last reviewed or updated within the procedure.
