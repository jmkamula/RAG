must_id: item:7.4:rev_next_date
control_ref: '7.4'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the communication program in the review document, using a clear
  and specific calendar date.
- Record the decision on the next review date in meeting minutes or an approval log, including the names
  of participants and the date of agreement.
- Name the responsible individual who will oversee the next review, avoiding generic titles like "the
  team" or "management."
- Cross-reference the stated review date in the communication program with the organisation's compliance
  calendar or tracking system.
