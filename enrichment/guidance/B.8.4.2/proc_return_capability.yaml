must_id: item:B.8.4.2:proc_return_capability
control_ref: B.8.4.2
standard_id: ISO27701:2019
must_text: Return capability — export PII to customer in structured format at end of service
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the procedure for exporting personal data to customers at contract end, including file formats
  and transfer methods, in a dated, approved policy.
- Assign a named individual responsible for managing and authorizing each PII export, recording their
  name and approval date for each instance.
- Record each PII export event in a log, capturing customer name, export date, data format, and confirmation
  of successful transfer.
- Name the export file formats specifically—do not use vague terms like "standard format"—to show clarity
  and suitability for customer use.
