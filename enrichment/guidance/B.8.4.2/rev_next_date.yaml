must_id: item:B.8.4.2:rev_next_date
control_ref: B.8.4.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the End-of-Service Program in the review documentation, using
  a specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Retain a copy of the most recent review document showing the stated next review date and responsible
  person’s signature.
- Avoid leaving the next review date blank or using vague terms like “annually”; specify the exact date.
