must_id: item:B.8.4.2:reg_completion_date
control_ref: B.8.4.2
standard_id: ISO27701:2019
must_text: Completion date per row (return delivered / disposal complete)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the actual completion date for each end-of-service action in the register, matching the date
  when return or disposal was finalized.
- Name the responsible individual who confirmed the completion, ensuring a specific person is listed rather
  than a team or department.
- Attach supporting evidence, such as a signed receipt or disposal certificate, to each register entry
  to verify the action was completed.
- Review the register regularly to confirm that no row is missing a completion date or supporting documentation.
