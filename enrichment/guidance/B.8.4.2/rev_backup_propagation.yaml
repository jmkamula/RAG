must_id: item:B.8.4.2:rev_backup_propagation
control_ref: B.8.4.2
standard_id: ISO27701:2019
must_text: Backup propagation audit — sampled disposals verified to have propagated to backup tiers
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the person responsible for verifying that data disposals are propagated to all backup tiers in
  the End-of-Service Program Review.
- Document a sample set of recent data disposals, including unique identifiers and disposal dates, in
  a dated review log.
- Record evidence from backup system logs or reports showing that each sampled disposal was also deleted
  from backup storage.
- Cross-reference the sampled disposals with backup deletion confirmations to demonstrate end-to-end propagation.
- State the verification date and reviewer’s name; avoid unsigned or undated review records, which auditors
  will flag as insufficient.
