must_id: item:B.8.2.1:rev_next_date
control_ref: B.8.2.1
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Customer Agreement Program in the document, using a clear
  and specific calendar date.
- Record the date of the most recent review alongside the planned next review date to show the review
  cycle.
- Name the individual responsible for scheduling and conducting the next review, not just a team or department.
- Retain a signed or approved version of the document showing the stated next review date.
