must_id: item:B.8.2.1:rev_reviewer
control_ref: B.8.2.1
standard_id: ISO27701:2019
must_text: Reviewer identity (Legal + DPO + Sales Ops)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer for each role—Legal, Data Protection Officer, and Sales Operations—as a specific individual
  in the program review record.
- Record the date each reviewer completed their review in the agreement program review log.
- Obtain a signature or written confirmation from each named reviewer to evidence their participation
  in the review.
- Avoid listing roles or teams as reviewers; always identify individuals by full name to prevent ambiguity.
