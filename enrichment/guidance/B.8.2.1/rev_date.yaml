must_id: item:B.8.2.1:rev_date
control_ref: B.8.2.1
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Customer Agreement Program in a dated document or meeting
  minutes.
- State the planned review interval for the Customer Agreement Program in a documented schedule or policy.
- Confirm the next scheduled review date is within the documented interval by cross-referencing the last
  review date and the interval.
- Name the reviewer as a specific individual, not a group or department, in the review record.
