must_id: item:6.1.2:rev_date
control_ref: 6.1.2
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your risk assessment program in a dated log or register entry.
- State the planned review interval for the risk assessment program in a documented schedule or policy.
- Confirm the next scheduled review date is within the planned interval by cross-referencing the last
  review date and the documented interval.
- Name the reviewer as a specific individual, not a group or department, in the review record.
