must_id: item:A.7.12:rev_reviewer
control_ref: A.7.12
standard_id: ISO27001:2022
must_text: Reviewer identity (Facilities + Network lead + InfoSec)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Facilities lead, Network lead, and Information Security lead as individual reviewers in the
  cabling program review record.
- Record the date each reviewer completed their assessment on the periodic cabling program review document.
- Obtain a signature or written confirmation from each named reviewer to evidence their participation
  in the review.
- Avoid listing reviewers as teams or departments; specify full names and job titles for clear accountability.
