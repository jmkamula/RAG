must_id: item:A.7.12:periodic_inspection
control_ref: A.7.12
standard_id: ISO27001:2022
must_text: Periodic physical inspection schedule (drift prevention)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a physical inspection schedule for all critical cabling, including inspection frequency and
  responsible individuals, in your Cabling Security Procedure.
- Name the inspection owner as a specific person, not a team or department, to avoid ambiguity in accountability.
- Record each completed inspection with the date, inspector’s name, and any findings in a maintained inspection
  log.
- Review and update the inspection schedule annually, noting the review date and the reviewer’s name in
  the procedure.
