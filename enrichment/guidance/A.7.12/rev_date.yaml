must_id: item:A.7.12:rev_date
control_ref: A.7.12
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent cabling program review date in a central register, clearly showing when the review
  took place.
- State the planned review interval for the cabling program in a documented schedule approved by a named
  responsible individual.
- Confirm the next scheduled review date is within the documented interval by cross-referencing the last
  review date and the planned frequency.
- Name the reviewer as a specific individual in the review record, avoiding generic titles like "IT team"
  or "Facilities".
