must_id: item:A.5.37:rev_next_date
control_ref: A.5.37
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date in the operating procedures program document, listing it clearly
  in a dedicated section.
- Record the date of the most recent review alongside the planned next review date for clear tracking
  of review cycles.
- Name the individual responsible for scheduling and conducting the next review, avoiding generic titles
  like "the team" or "management".
- Retain a copy of the approved program document showing the next planned review date and responsible
  person’s name.
