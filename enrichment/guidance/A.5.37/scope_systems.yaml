must_id: item:A.5.37:scope_systems
control_ref: A.5.37
standard_id: ISO27001:2022
must_text: Systems in scope enumerated (production applications, databases, key infrastructure components
  — drives 'which facilities need a procedure')
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all production applications, databases, and key infrastructure components in a dated document labeled
  as the current scope of information processing facilities.
- Name the person responsible for maintaining the scope list as a specific individual, not a team or department.
- Cross-reference each listed facility with its physical or logical location and relevant owner to enable
  traceability.
- Record the approval of the scope document by a named senior manager, including the date of sign-off.
