must_id: item:Art.23:reg_right_restricted
control_ref: Art.23
standard_id: GDPR:2016/679
must_text: Per-row right restricted (Art.12-22 + Art.34)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific right(s) being restricted for each entry, referencing the relevant GDPR article number
  (e.g., Art.15 for access).
- Document the legal basis or justification for each restriction, citing the applicable law or regulation
  authorizing it.
- Record the start and end dates for each restriction applied, ensuring both are clearly visible in the
  register.
- Assign a named individual responsible for authorizing and reviewing each restriction, avoiding generic
  roles like "the team".
- Confirm that each row in the register is access-restricted so only authorized personnel can view or
  edit the details.
