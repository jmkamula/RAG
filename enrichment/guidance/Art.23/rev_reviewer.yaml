must_id: item:Art.23:rev_reviewer
control_ref: Art.23
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying the Data
  Protection Officer and the legal counsel.
- Record the date each reviewer completed their review in the program documentation.
- Obtain a signature or written confirmation from both the Data Protection Officer and legal counsel to
  evidence their participation.
- Avoid listing generic roles such as "the team" or "Legal Department" as reviewers; specify named individuals
  only.
