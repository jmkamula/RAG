must_id: item:Art.23:rev_subject_notice_compliance
control_ref: Art.23
standard_id: GDPR:2016/679
must_text: Subject-notice compliance — where Art.23.2.h applies, notice was delivered
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify each situation where Article 23.2.h restrictions apply and list the affected data subjects
  by name or unique identifier in a dated log.
- Document the exact notice content delivered to each data subject, including the method and date of delivery,
  in a central register.
- Retain a copy of the notice delivery confirmation, such as an email receipt or signed letter, for each
  data subject.
- Name the individual responsible for delivering subject notices as a specific person, not a team or department.
- Record any cases where notice was not delivered and document the legal justification, referencing the
  relevant Article 23.2.h provision.
