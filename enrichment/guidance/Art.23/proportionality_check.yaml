must_id: item:Art.23:proportionality_check
control_ref: Art.23
standard_id: GDPR:2016/679
must_text: Necessity-and-proportionality check per Art.23.1 (essence of fundamental rights respected)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific legal basis and purpose for each restriction in the Member State Restrictions
  Procedure, referencing the relevant national law and Article 23.1.
- Record a written assessment explaining why each restriction is necessary and proportionate, including
  how the essence of fundamental rights is respected.
- Name the individual responsible for conducting and signing off on the necessity-and-proportionality
  check, ensuring this is a specific person, not a team or department.
- Attach the dated approval of the necessity-and-proportionality assessment to the procedure, signed by
  a designated senior decision-maker.
- Review and update the assessment whenever the restriction or its legal basis changes, keeping a version
  history with dates and responsible persons.
