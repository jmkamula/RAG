must_id: item:A.7.3.10:rev_intervention_test
control_ref: A.7.3.10
standard_id: ISO27701:2019
must_text: Human-intervention pathway test
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual responsible for overseeing human intervention in automated decisions, avoiding
  generic titles like "the team" or "IT department".
- Document the process by which data subjects can request human review of automated decisions, including
  clear instructions and contact details.
- Record an example request for human intervention and the steps taken to address it, including dates
  and outcomes.
- Review and update the human-intervention pathway at least annually, capturing the review date and the
  reviewer’s name.
