must_id: item:A.7.3.10:reg_subject_id
control_ref: A.7.3.10
standard_id: ISO27701:2019
must_text: Subject identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a unique identifier for each data subject involved in an automated decision event in a dedicated
  column of the register.
- Cross-reference each subject identifier with supporting documentation, such as consent forms or case
  files, to confirm accuracy.
- Name the subject identifier using a consistent format, avoiding generic terms like "user" or "customer"
  that could apply to multiple individuals.
- Date each register entry to enable clear traceability of when the automated decision event occurred.
