must_id: item:A.7.3.10:proc_objection_pathway
control_ref: A.7.3.10
standard_id: ISO27701:2019
must_text: Objection pathway — subjects can object to automated decision-making
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the process by which individuals can object to automated decisions, including contact details
  and submission steps, in a documented procedure.
- Name a specific individual responsible for handling objections, listing their full name and job title
  in the procedure.
- Record the date the objection pathway was last reviewed and updated, ensuring the document is not undated
  or marked as "draft."
- Retain a sample completed objection form or record showing how an objection was received, processed,
  and resolved.
- Publish the objection pathway in a location accessible to all data subjects, such as your privacy notice
  or website.
