must_id: item:Art.9:proc_explicit_consent
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: For Art.9.2.a explicit-consent route — additional capture requirements beyond Art.7 baseline
  (e.g. specific to each category)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the explicit consent form used for each special category of data, ensuring it clearly states
  the specific category being processed.
- Record the date, time, and method of consent capture for each individual, linking this evidence to the
  relevant data category.
- Name the individual who obtained the consent, avoiding generic references such as "the team" or "staff".
- Retain a copy of the consent record alongside the corresponding processing activity in your data register.
- Review the consent language to confirm it includes a clear explanation of why each special category
  is needed and how it will be used.
