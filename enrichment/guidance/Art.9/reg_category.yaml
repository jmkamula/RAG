must_id: item:Art.9:reg_category
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Art.9.1 category per row (which special category)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each instance of special category data processing as a separate row in the register, specifying
  the exact special category under Article 9.1.
- Reference the relevant Article 9.1 category by its full description, not just a number or generic label.
- Record the date each entry was added or last reviewed to show ongoing accuracy and maintenance.
- Name the responsible individual for each row, avoiding group or department names as the owner.
