must_id: item:Art.9:proc_owner
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Named owner of the procedure (DPO)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Data Protection Officer (DPO) as the specific owner of the Special Category Processing Authorisation
  Procedure in the document header.
- Record the DPO’s full name and job title, avoiding generic references like "the team" or "compliance
  department".
- Date the procedure document to show when the DPO was assigned as the owner.
- Retain a signed acknowledgement from the DPO confirming their responsibility for the procedure.
