must_id: item:Art.9:rev_reviewer
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + executive sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and the executive
  sponsor by full name and job title.
- Record the date each reviewer completed the program review in a dated log or approval form.
- Obtain a signature or written confirmation from both the Data Protection Officer and the executive sponsor
  to evidence their participation.
- Avoid listing generic roles or groups such as "the team" or "management" instead of named individuals.
