must_id: item:Art.9:reg_activity_id
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Activity identifier per row (links to Art.30 RoPA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique activity identifier to each row in the Special Category Processing Register that directly
  links to the corresponding entry in the Article 30 Record of Processing Activities.
- Document the identifier in a dedicated column, ensuring it is consistently formatted and not reused
  for different processing activities.
- Cross-reference each identifier with the relevant Art.30 RoPA entry, providing a direct lookup path
  for auditors.
- Name the activity owner as a specific individual for each row, avoiding generic titles like "team" or
  "department."
