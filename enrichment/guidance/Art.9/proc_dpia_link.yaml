must_id: item:Art.9:proc_dpia_link
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Link to Art.35 DPIA — special-category processing usually triggers DPIA
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each special category processing activity to its corresponding Data Protection Impact
  Assessment (DPIA) by including the DPIA title and completion date in the authorisation record.
- Document the legal basis and necessity for processing special category data, citing the specific GDPR
  Article 9 condition relied upon in each case.
- Name the individual responsible for approving the special category processing and DPIA linkage, providing
  their full name and approval date.
- Attach or link the completed DPIA report to the authorisation procedure documentation for each special
  category processing activity.
- Avoid referencing a DPIA in generic terms; specify the unique DPIA relevant to the particular processing
  activity, not a template or example.
