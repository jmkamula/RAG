must_id: item:Art.9:scope_change_drivers
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Trigger list for re-scoping (HR system change capturing new category, new healthcare line)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List specific events that require re-scoping, such as adding new HR data fields or launching a new healthcare
  service line, in a dated document.
- Assign a named individual responsible for monitoring these trigger events and updating the scope when
  necessary.
- Record each time the trigger list is reviewed or updated, including the reviewer's name and the date
  of the change.
- Avoid using generic triggers like "system changes"—describe concrete examples relevant to your organisation's
  data processing activities.
