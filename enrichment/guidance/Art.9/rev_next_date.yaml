must_id: item:Art.9:rev_next_date
control_ref: Art.9
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Special Category Program in the review document, using a
  clear and specific calendar date.
- Name the individual responsible for conducting the next review, listing their full name and job title
  in the document.
- Record the date the review schedule was last updated, ensuring this is visible alongside the next planned
  review date.
- Avoid leaving the next review date blank or using vague terms like "annually" or "TBD"; always specify
  an exact date.
