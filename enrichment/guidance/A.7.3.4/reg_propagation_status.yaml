must_id: item:A.7.3.4:reg_propagation_status
control_ref: A.7.3.4
standard_id: ISO27701:2019
must_text: Propagation status per row (downstream systems notified / third parties informed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and time each consent modification or withdrawal is logged in the register.
- Name the specific downstream systems or third parties notified for each entry, using actual system or
  organisation names.
- Document the date and method of notification sent to each downstream system or third party per consent
  change.
- Confirm and record the acknowledgement or confirmation of receipt from each notified party for every
  consent update.
- Avoid using generic terms like "all systems" or "relevant parties"—list each notified entity explicitly
  per register entry.
