must_id: item:A.7.3.4:scope_jurisdiction_variance
control_ref: A.7.3.4
standard_id: ISO27701:2019
must_text: Jurisdiction-specific variations (some jurisdictions restrict when withdrawal is possible)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify all activities in your organisation that rely on individual consent as a legal basis for processing
  personal data.
- Document the specific jurisdictions where each consent-based activity occurs, referencing authoritative
  legal sources for each location.
- State the local legal rules for consent withdrawal in each jurisdiction, including any restrictions
  or exceptions that apply.
- Cross-reference each activity with its applicable jurisdictional withdrawal rules in a dated register
  or matrix.
- Name a specific individual responsible for maintaining and updating this scope — do not list a team
  or department.
