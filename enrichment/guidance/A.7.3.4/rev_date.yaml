must_id: item:A.7.3.4:rev_date
control_ref: A.7.3.4
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent Withdrawal Program Review in a central log, clearly showing when
  the review took place.
- Name the individual responsible for scheduling reviews, ensuring a specific person is listed rather
  than a team or department.
- Document the planned review interval in months or years, referencing the approved schedule or policy.
- Confirm the next scheduled review date is within the documented interval from the last review, and note
  this in the review log.
- Retain evidence of the review meeting, such as a signed attendance sheet or minutes, with the actual
  review date clearly visible.
