must_id: item:A.7.3.4:reg_timestamp
control_ref: A.7.3.4
standard_id: ISO27701:2019
must_text: Timestamp per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date and time for each consent modification or withdrawal entry in the register.
- Confirm that each timestamp is automatically generated by the system or manually entered by a named
  individual.
- Review the register to ensure no entry is missing a timestamp; incomplete rows should be flagged and
  corrected immediately.
- Name the person responsible for maintaining the register as a specific individual, not a team or department.
