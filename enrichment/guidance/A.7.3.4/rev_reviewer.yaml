must_id: item:A.7.3.4:rev_reviewer
control_ref: A.7.3.4
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Engineering)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual holding the Data Protection Officer (DPO) role and a named
  person from Engineering on the review record.
- Record the date each reviewer completed their assessment of the Withdrawal Program in the review documentation.
- Sign the review outcome by both the DPO and the Engineering representative to confirm their participation
  and agreement.
- Attach supporting evidence, such as meeting minutes or review notes, that reference both reviewers’
  contributions and decisions.
