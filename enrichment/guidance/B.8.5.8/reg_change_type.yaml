must_id: item:B.8.5.8:reg_change_type
control_ref: B.8.5.8
standard_id: ISO27701:2019
must_text: Change type per row (add / replace / remove)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the change type for each subcontractor entry as "add", "replace", or "remove" in a dedicated
  column of the register.
- Name the individual responsible for updating the register on each row, ensuring accountability for every
  change recorded.
- Date each change entry to provide a clear timeline of subcontractor updates and modifications.
- Avoid using vague terms like "update" or "change" in the change type column; specify only "add", "replace",
  or "remove".
