must_id: item:B.8.5.8:rev_next_date
control_ref: B.8.5.8
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Subcontractor Change Program in the review documentation,
  using a clear and specific calendar date.
- Record the name of the person responsible for scheduling and conducting the next review, not just their
  job title or department.
- Document the date when the current review was completed to show the timeline between reviews.
- Avoid leaving the next review date blank or stating vague terms like "annually"—use an exact date to
  meet auditor expectations.
