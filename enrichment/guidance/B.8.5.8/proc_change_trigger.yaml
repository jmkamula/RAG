must_id: item:B.8.5.8:proc_change_trigger
control_ref: B.8.5.8
standard_id: ISO27701:2019
must_text: Change trigger — every subcontractor addition or replacement triggers notification workflow
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each new or replaced subcontractor in a change log entry, including the date, name of subcontractor,
  and reason for change.
- Trigger a notification workflow immediately upon logging the subcontractor change, capturing the date
  and recipients of the notification.
- Name the responsible individual who initiates the notification workflow for each subcontractor change,
  not a generic team or department.
- Retain copies of all sent notifications and related correspondence as evidence of timely communication
  for each subcontractor addition or replacement.
