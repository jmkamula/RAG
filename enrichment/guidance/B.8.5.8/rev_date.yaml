must_id: item:B.8.5.8:rev_date
control_ref: B.8.5.8
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Subcontractor Change Program in a dated log or register entry.
- State the planned review interval in months or years within the program documentation.
- Compare the last review date to the planned interval and document whether the review occurred on schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach evidence of the completed review, such as meeting minutes or a signed review checklist, to the
  program file.
