must_id: item:A.6.3:rev_next_date
control_ref: A.6.3
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the awareness programme in the documented review record or meeting
  minutes.
- Name the individual responsible for scheduling and conducting the next review, including their full
  name and job title.
- Record the date the current review was completed to show the timeline between reviews.
- Avoid leaving the next review date blank or stating it as "TBD"—always enter a specific calendar date.
