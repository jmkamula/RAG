must_id: item:A.6.3:reg_module_id
control_ref: A.6.3
standard_id: ISO27001:2022
must_text: Per-row training module identifier (links to the curriculum catalogue)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique identifier for each completed training module in the register, matching the format
  used in your official curriculum catalogue.
- Cross-reference each identifier in the register with the corresponding entry in the curriculum catalogue
  to confirm accuracy and traceability.
- Name the training module in the register exactly as it appears in the curriculum catalogue to avoid
  confusion or mismatches.
- Avoid using generic or incomplete module names; always use the full, specific identifier and title from
  the curriculum catalogue.
