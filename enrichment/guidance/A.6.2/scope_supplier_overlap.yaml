must_id: item:A.6.2:scope_supplier_overlap
control_ref: A.6.2
standard_id: ISO27001:2022
must_text: Supplier-worker overlap noted (contractors brought in via suppliers may sign supplier-NDA +
  org-NDA both — cross-link to A.5.20 supplier agreement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all worker categories, including direct employees, contractors, and supplier-provided personnel,
  in a dated scope document approved by a named manager.
- Cross-reference each supplier-provided worker category in the scope document to the relevant supplier
  agreement documented under control A.5.20.
- Record which NDA(s) each worker category is required to sign, specifying if both supplier and organisation
  NDAs are applicable.
- Attach copies of signed NDAs for a sample of supplier-provided workers, showing both agreements where
  dual-signing is required.
- Name the owner of the scope document as a specific individual, not a generic role or department.
