must_id: item:A.6.2:scope_change_drivers
control_ref: A.6.2
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new worker category — gig workers, M&A bringing new categories,
  new geography with distinct employment law)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current worker categories by name and date in a controlled document, ensuring each category
  is clearly defined and distinct.
- Document a trigger list that specifies events requiring re-scoping, such as mergers, new worker types,
  or expansion into new legal jurisdictions.
- Assign a named individual responsible for monitoring changes and initiating re-scoping when a trigger
  event occurs.
- Record each review of the worker categories scope with the review date, reviewer’s name, and any changes
  made.
- Name the owner as a specific person, not a team or department, to avoid ambiguity in accountability.
