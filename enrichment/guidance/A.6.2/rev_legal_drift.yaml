must_id: item:A.6.2:rev_legal_drift
control_ref: A.6.2
standard_id: ISO27001:2022
must_text: Employment-law drift check per jurisdiction (legal counsel input)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named legal counsel to review employment terms templates for each jurisdiction, recording their
  name and date of review.
- Document the specific laws or regulations checked for each jurisdiction in a review log, referencing
  relevant legal sources.
- Record legal counsel’s written confirmation that current templates align with all applicable employment
  laws in each jurisdiction.
- Name the reviewer as a specific individual, not a generic title or team, to avoid ambiguity in responsibility.
- Retain copies of previous and updated templates, along with review records, to show changes and legal
  input over time.
