must_id: item:B.8.5.7:rev_next_date
control_ref: B.8.5.7
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Subcontractor Engagement Program in the review documentation,
  using a specific day, month, and year.
- Record the name of the person responsible for scheduling the next review, listing a specific individual
  rather than a team or department.
- Document the date when the current review was completed to demonstrate the review cycle and planning.
- Attach evidence of management approval for the stated next review date, such as a signed or emailed
  confirmation.
