must_id: item:B.8.5.7:scope_change_drivers
control_ref: B.8.5.7
standard_id: ISO27701:2019
must_text: Trigger list (new subprocessor category / new business unit)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current subprocessor categories and business units involved in personal data processing in
  a dated document reviewed at least annually.
- Record each time a new subprocessor category or business unit is added, including the date and the person
  authorizing the change.
- Name the individual responsible for maintaining and updating the engagement scope; do not use a group
  or department name.
- Cross-reference each update to the engagement scope with supporting documentation, such as contracts
  or organizational charts, showing the change.
