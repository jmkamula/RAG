must_id: item:A.8.8:scope_coverage_pct
control_ref: A.8.8
standard_id: ISO27001:2022
must_text: Target coverage percentage per class (with rationale for gaps)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all asset classes in scope for vulnerability management, referencing your asset inventory with
  unique identifiers and descriptions.
- State the target coverage percentage for vulnerability management for each asset class, specifying exact
  percentages and not general ranges.
- Document a clear rationale for any asset class with less than 100% coverage, including specific business
  or technical reasons.
- Name the individual responsible for approving the asset scope and coverage targets, ensuring this is
  a specific person and not a group or department.
- Record the date when the asset scope and coverage targets were last reviewed and approved, attaching
  the signed or digitally authorized record.
