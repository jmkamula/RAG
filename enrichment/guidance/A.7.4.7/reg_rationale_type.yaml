must_id: item:A.7.4.7:reg_rationale_type
control_ref: A.7.4.7
standard_id: ISO27701:2019
must_text: Rationale type per row (legal / regulatory / business)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List the rationale for each retention period in the register, specifying if it is legal, regulatory,
  or business for every row.
- Reference the specific law, regulation, or business policy that supports each rationale, including the
  name and section where possible.
- Name the person responsible for assigning and reviewing rationales in the register, using a specific
  individual’s name rather than a role or team.
- Date each entry or update to the rationale column to show when the rationale was last reviewed or confirmed.
