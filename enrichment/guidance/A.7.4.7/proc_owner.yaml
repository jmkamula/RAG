must_id: item:A.7.4.7:proc_owner
control_ref: A.7.4.7
standard_id: ISO27701:2019
must_text: Named owner (DPO + Records Management)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the PII Retention Procedure as a specific individual, such as the Data Protection
  Officer and the Records Manager, not a generic team.
- Document the full names, job titles, and contact details of both owners within the procedure document.
- Record the date when the ownership assignment was last reviewed or updated in the procedure.
- Obtain a signed acknowledgement from both named owners confirming their acceptance of responsibility
  for the procedure.
