must_id: item:7.5:rev_next_date
control_ref: '7.5'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date clearly on the front page of the Document Control Program, using
  day, month, and year.
- Record the name of the person responsible for scheduling the next review, ensuring it is a specific
  individual, not a team or department.
- Retain a dated record of the last review meeting or approval, showing when the next review date was
  set.
- Cross-reference the stated next review date in the program with your central compliance calendar or
  tracking tool.
