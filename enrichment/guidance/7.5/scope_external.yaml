must_id: item:7.5:scope_external
control_ref: '7.5'
standard_id: ISO27001:2022
must_text: External-origin classes in scope (regulator guidance, supplier policies referenced, framework
  docs)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all document classes of external origin that are referenced or required by your information security
  management system, such as regulator guidance or supplier policies.
- Record the source, title, and version or publication date for each external document class included
  in your scope register.
- Cross-reference each external document class to the relevant internal policy, procedure, or control
  where it is used or cited.
- Name a specific individual as the owner responsible for maintaining the list of external document classes—do
  not use a team or department as owner.
- Review and update the external document class list at least annually, recording the review date and
  reviewer’s name.
