must_id: item:7.5:reg_next_review
control_ref: '7.5'
standard_id: ISO27001:2022
must_text: Next review date per row (drives staleness alerts)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the next scheduled review date for each document in a dedicated column of the ISMS Document Register.
- Name the person responsible for each document’s review as a specific individual, not a team or department.
- Update the review date immediately after each document review or revision, capturing the new date in
  the register.
- Retain previous review dates in an audit log or version history to show a clear record of document maintenance.
