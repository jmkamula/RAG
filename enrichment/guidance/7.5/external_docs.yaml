must_id: item:7.5:external_docs
control_ref: '7.5'
standard_id: ISO27001:2022
must_text: Control of documented information of external origin determined necessary
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all documents of external origin that are necessary for your management system in a dated register,
  including source and purpose.
- Assign a specific individual as the owner responsible for reviewing and updating each external document
  listed.
- Record the review date and approval of each external document by the assigned owner in the register.
- Specify the method for verifying the authenticity and validity of each external document in the register.
- Name the owner as a specific person, not a group or department, to avoid ambiguity in responsibility.
