must_id: item:Art.13:identity
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Identity and contact details of controller
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the full legal name of your organisation as the data controller in the privacy notice.
- List a specific contact person or role, along with a direct email address or phone number, for data
  protection queries.
- Name the owner as a specific individual or role — do not use generic terms like "the team" or "management".
- Record the date the privacy notice was last updated and display it clearly on the document.
