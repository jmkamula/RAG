must_id: item:Art.13:rev_content_currency
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Content currency check — notice reflects current Art.30 RoPA + Art.6 basis register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference the latest privacy notice content with the current Article 30 Record of Processing Activities
  to confirm all processing activities are accurately described.
- Match each processing purpose in the privacy notice to its lawful basis as listed in the Article 6 lawful
  basis register, ensuring alignment.
- Document the date of the most recent review and update of both the privacy notice and the referenced
  registers.
- Name the reviewer as a specific individual responsible for confirming the privacy notice reflects the
  current registers—avoid listing a team or department.
- Retain a copy of the reviewed privacy notice alongside the referenced registers as evidence of the currency
  check.
