must_id: item:Art.13:rev_date
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the privacy notice program in a dated log or tracking document.
- State the planned review interval for the privacy notice program in a documented schedule or policy.
- Confirm the actual review date falls within the planned interval by cross-referencing the review log
  and the documented schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
