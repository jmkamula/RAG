must_id: item:Art.13:rev_next_date
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date clearly within the privacy notice document, using a specific day,
  month, and year.
- Record the decision on the review date in meeting minutes or an approval log, including the name of
  the approver and the date of approval.
- Name the responsible individual for the next review, avoiding generic titles like "the team" or "management".
- Retain a copy of the privacy notice showing the stated next review date as published or distributed
  to users.
