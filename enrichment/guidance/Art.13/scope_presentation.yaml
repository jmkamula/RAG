must_id: item:Art.13:scope_presentation
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Presentation method per point (link, modal, layered display, paper hand-out)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each personal data collection point and describe the exact method used to present privacy information,
  such as link, modal, layered display, or paper hand-out.
- Capture a screenshot or photo for each digital or physical collection point, showing how the privacy
  notice is made accessible to users.
- Record the date each presentation method was last reviewed or updated, along with the name of the person
  responsible for the review.
- Name the owner as a specific individual responsible for maintaining the accuracy and accessibility of
  privacy information at each collection point.
