must_id: item:Art.13:rec_effective_date
control_ref: Art.13
standard_id: GDPR:2016/679
must_text: Per-row effective date stated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the effective date for each privacy notice version in a dedicated column of the publication record.
- Record the date in a consistent, unambiguous format such as YYYY-MM-DD for each entry.
- Confirm that no row is missing an effective date; do not leave any date field blank or marked "TBA".
- Name the person responsible for updating effective dates in the record, listing their full name, not
  just a role or team.
