must_id: item:A.5.24:ex_participants
control_ref: A.5.24
standard_id: ISO27001:2022
must_text: Participant list per record (links to IR team register entries; observers noted separately)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full names and roles of all exercise participants in each activation record, matching them
  to entries in the incident response team register.
- Cross-reference each participant’s entry with a unique identifier or link to their corresponding record
  in the incident response team register.
- List observers separately from active participants, clearly marking their observer status in the activation
  record.
- Name each participant and observer as a specific individual—avoid using group names or generic titles
  like "IT team" or "staff".
