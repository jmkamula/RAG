must_id: item:A.5.24:rev_date
control_ref: A.5.24
standard_id: ISO27001:2022
must_text: Review date within the planned 180-day interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Incident Management Framework in a dated document or register
  entry.
- Name the reviewer as a specific individual responsible for the review, not a group or department.
- Cross-reference the planned 180-day review interval in the review record to confirm the review occurred
  within the required timeframe.
- Retain a copy of the reviewed Incident Management Framework with version number and review date clearly
  marked.
