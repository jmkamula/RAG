must_id: item:A.5.24:ex_scenario
control_ref: A.5.24
standard_id: ISO27001:2022
must_text: Scenario per record (what was simulated; severity; in-scope assets; threat-actor archetype)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific scenario simulated in each exercise record, describing the incident type and context
  in clear, non-generic terms.
- List all in-scope assets involved in the exercise, referencing asset identifiers or names as recorded
  in your asset inventory.
- Specify the severity level assigned to the simulated scenario, using your organisation’s defined severity
  scale and date the assignment.
- Identify the threat-actor archetype used in the simulation, naming the type (e.g. insider, external
  hacker) rather than using vague terms like “attacker.”
- Avoid using boilerplate scenario descriptions that could apply to any organisation; tailor each record
  to your actual environment and risks.
