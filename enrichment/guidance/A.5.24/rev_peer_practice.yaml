must_id: item:A.5.24:rev_peer_practice
control_ref: A.5.24
standard_id: ISO27001:2022
must_text: Peer/industry practice scan (notable incidents in the sector; how peers responded; lessons
  applicable)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to lead the peer and industry practice scan, recording their name and the
  review period in a dated document.
- Document at least three notable incidents from your sector in the past year, including sources and dates
  for each incident.
- Summarize how peers responded to each incident, citing specific actions and referencing published reports
  or official statements.
- Record lessons learned that are relevant to your organisation, explicitly linking each lesson to your
  current incident management framework.
- Name the reviewer who approved the scan results, ensuring their signature and the approval date are
  included—avoid unsigned or undated reviews.
