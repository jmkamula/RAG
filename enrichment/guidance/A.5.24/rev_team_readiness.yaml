must_id: item:A.5.24:rev_team_readiness
control_ref: A.5.24
standard_id: ISO27001:2022
must_text: Team-readiness audit (training currency across responders; coverage gaps where a tier is under-staffed;
  backup-named compliance)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the dates and topics of the most recent incident response training sessions attended by each
  responder on a central training log.
- Name a primary and backup responder for each incident response tier, listing specific individuals rather
  than generic roles or teams.
- Record any incident response tier that is currently under-staffed or missing backup coverage, along
  with an action plan and responsible person.
- Confirm that all listed responders have acknowledged their current responsibilities in writing, with
  a dated signature or electronic confirmation.
