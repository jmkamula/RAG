must_id: item:Art.40:exit_provisions
control_ref: Art.40
standard_id: GDPR:2016/679
must_text: Exit provisions — how withdrawal from the code is handled
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for an organisation to formally withdraw from the code, including
  required notifications and timelines, in a dated procedure.
- Name the individual responsible for managing withdrawal requests, listing their full name and job title
  in the procedure.
- Record all withdrawal requests and related correspondence in a central log, including dates and outcomes.
- State the consequences of withdrawal, such as loss of certification or public notice, in a clearly marked
  section of the procedure.
- Specify that withdrawal decisions and notifications must be in writing—do not rely on verbal agreements
  or undocumented emails.
