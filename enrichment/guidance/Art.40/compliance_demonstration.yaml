must_id: item:Art.40:compliance_demonstration
control_ref: Art.40
standard_id: GDPR:2016/679
must_text: Compliance demonstration approach (code-specific evidence requirements)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific evidence types required by the code of conduct to demonstrate compliance, such as
  logs, reports, or signed attestations.
- Document the procedure for collecting, reviewing, and storing each evidence type, including responsible
  individuals and review timelines.
- Cross-reference each evidence requirement to the relevant section of the code of conduct, showing how
  compliance is mapped to specific controls.
- Record the approval date and version of the adherence procedure, ensuring it is not left undated or
  marked as "draft."
- Assign a named individual, not a team or department, as the owner responsible for maintaining and updating
  the adherence procedure.
