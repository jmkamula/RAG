must_id: item:Art.40:rev_next_date
control_ref: Art.40
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Code Adherence Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the person responsible for scheduling the next review, not just a team or department.
- Update the review log or register to include the planned review date, ensuring it is visible alongside
  previous and current review entries.
- Avoid leaving the next review date blank or marked as "TBD"—always specify an actual date to prevent
  auditor findings.
