must_id: item:Art.40:reg_code_id
control_ref: Art.40
standard_id: GDPR:2016/679
must_text: Per-row code identifier (name + association + approval reference)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full name of each code of conduct in a dedicated column for every entry in the register.
- Document the association or organisation responsible for each code, listing the specific legal entity
  rather than a generic group or team.
- Enter the formal approval reference for each code, including the approving body’s name and the dated
  approval document or decision.
- Cross-reference each code entry to its supporting approval documentation, such as a signed letter or
  published decision, stored in your compliance repository.
- Avoid using placeholders like “TBD” or missing approval details, as auditors will flag incomplete or
  non-specific register entries.
