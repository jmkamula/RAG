must_id: item:10.1:reg_owner
control_ref: '10.1'
standard_id: ISO27001:2022
must_text: Per-row owner
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a specific individual as the owner for each improvement action row, using full name rather than
  a team or department.
- Record the date each owner is assigned to an action, ensuring the register shows when accountability
  was established.
- Document contact details for each owner in the register, so their responsibility can be verified if
  needed.
- Update the register promptly if ownership changes, keeping a history of previous owners and dates of
  change.
