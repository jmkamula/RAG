must_id: item:10.1:scope_10_2_boundary
control_ref: '10.1'
standard_id: ISO27001:2022
must_text: 10.2 boundary — NCs route to 10.2 NC/CA, NOT to 10.1; observations and opportunities route
  here
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the types of improvement triggers included in this scope, such as observations and opportunities,
  excluding nonconformities and corrective actions.
- Document the process for routing nonconformities and corrective actions directly to the 10.2 process,
  not to 10.1.
- Assign a specific individual as the owner of the improvement triggers scope, avoiding generic roles
  like "the team" or "management."
- Record examples of actual improvement triggers processed under 10.1, showing they are not nonconformities
  or corrective actions.
- Cross-reference the documented triggers and routing decisions with the relevant sections of your management
  system to show clause alignment.
