must_id: item:10.1:rev_next_date
control_ref: '10.1'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Continual Improvement Program in the review documentation,
  using a clear and specific calendar date.
- Record the name of the person responsible for scheduling and conducting the next review in the same
  document.
- Confirm the review date is approved and signed off by a named manager or program owner, with the date
  of approval included.
- Avoid leaving the next review date blank, marked as "TBD," or using vague terms like "annually" without
  a specific date.
