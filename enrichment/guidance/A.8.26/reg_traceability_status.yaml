must_id: item:A.8.26:reg_traceability_status
control_ref: A.8.26
standard_id: ISO27001:2022
must_text: Per-row traceability status (requirements-to-test-cases coverage %)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each application security requirement as a separate row in the register, including a unique identifier
  and clear description.
- Cross-reference each requirement to its corresponding test cases by listing test case identifiers in
  the same row.
- Calculate and record the percentage of test cases covering each requirement in a dedicated column for
  traceability status.
- Name the person responsible for maintaining the register as a specific individual, not a team or department.
- Date and save each update to the register to provide a clear history of traceability status changes.
