must_id: item:A.5.10:approval_authority
control_ref: A.5.10
standard_id: ISO27001:2022
must_text: Statement of the signatory's authority (delegation chain if not top-management)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual who approved the Acceptable Use Policy, including their job title and department,
  in the approval record.
- State the signatory’s authority to approve the policy, referencing their position in the organisational
  hierarchy or delegation letter.
- Attach a copy of the delegation of authority document if the signatory is not top management.
- Record the approval date and retain the signed or electronically approved policy document.
