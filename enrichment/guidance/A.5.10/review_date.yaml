must_id: item:A.5.10:review_date
control_ref: A.5.10
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Acceptable Use Policy in a policy register or tracking document.
- Name the individual responsible for scheduling and conducting the policy review, not just a team or
  department.
- Document the planned review interval in months or years within the policy itself or a related schedule.
- Confirm the next scheduled review date falls within the documented interval from the last completed
  review.
- Retain evidence of the review, such as meeting minutes or a signed approval, with a clear date and reviewer’s
  name.
