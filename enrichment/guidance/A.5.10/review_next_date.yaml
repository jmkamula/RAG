must_id: item:A.5.10:review_next_date
control_ref: A.5.10
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Acceptable Use Policy in the policy document itself, using
  a clear and specific calendar date.
- Record the next review date in your policy review schedule or register, with a reference to the Acceptable
  Use Policy version.
- Name a specific individual responsible for tracking and initiating the next review, not a team or department.
- Retain evidence of the last review meeting or approval, showing the decision on the next review date
  and who agreed it.
