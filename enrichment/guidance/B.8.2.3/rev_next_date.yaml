must_id: item:B.8.2.3:rev_next_date
control_ref: B.8.2.3
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Marketing Use Program in the review document, using a specific
  calendar date.
- Record the name of the person responsible for scheduling the next review, not just their job title or
  team.
- Sign and date the review document to confirm when the next review date was set.
- Avoid leaving the next review date blank or using vague terms like "annually" or "TBD"—use a concrete
  date.
