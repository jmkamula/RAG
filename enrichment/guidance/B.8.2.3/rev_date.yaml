must_id: item:B.8.2.3:rev_date
control_ref: B.8.2.3
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Marketing Use Program in a dated entry, clearly visible in
  the program review log.
- State the planned review interval for the Marketing Use Program in a documented schedule or policy,
  with the interval explicitly defined in months or years.
- Confirm that the actual review date falls within the documented planned interval by cross-referencing
  the review log and the schedule.
- Name the reviewer as a specific individual responsible for the review, avoiding generic titles like
  "team" or "department".
