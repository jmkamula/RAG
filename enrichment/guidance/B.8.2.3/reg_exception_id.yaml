must_id: item:B.8.2.3:reg_exception_id
control_ref: B.8.2.3
standard_id: ISO27701:2019
must_text: Unique exception identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique identifier to each exception entry in the register, using a sequential number or code
  that does not repeat.
- Record the assigned identifier directly in the first column of each row for clear visibility and traceability.
- Cross-reference the unique identifier in any related documentation or approval records to maintain consistent
  linkage.
- Avoid using generic labels like "N/A" or leaving the identifier field blank, as auditors will flag missing
  or non-unique entries.
