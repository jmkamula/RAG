must_id: item:B.8.4.1:scope_shared_paths
control_ref: B.8.4.1
standard_id: ISO27701:2019
must_text: Shared paths where cross-tenant temp file leakage is possible (with mitigation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify all shared storage paths or directories where temporary files are created or accessed by multiple
  tenants.
- Document the technical controls or configurations in place that prevent one tenant from accessing another
  tenant’s temporary files.
- Record the date and name of the person responsible for verifying that these controls are functioning
  as intended.
- Name the owner as a specific individual responsible for ongoing monitoring of shared temp file locations
  — do not list a team or department.
- Retain evidence of periodic checks or test results that demonstrate no cross-tenant access to temporary
  files is possible.
