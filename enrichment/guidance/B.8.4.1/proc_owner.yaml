must_id: item:B.8.4.1:proc_owner
control_ref: B.8.4.1
standard_id: ISO27701:2019
must_text: Named owner (Platform Ops)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Processor Temp Files Disposal Procedure as a specific individual in Platform Ops,
  not as "the team" or the department.
- Document the owner's full name and job title in the header or approval section of the procedure.
- Record the date the owner was assigned responsibility within the procedure or in a change log.
- Review and update the named owner whenever there is a change in personnel or role within Platform Ops.
