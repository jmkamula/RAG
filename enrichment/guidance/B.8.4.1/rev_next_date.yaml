must_id: item:B.8.4.1:rev_next_date
control_ref: B.8.4.1
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Processor Temp Files Program in the program documentation,
  using a clear and specific calendar date.
- Record the name of the individual responsible for conducting the next review, not just a role or department.
- Document the date this review schedule was last updated, ensuring it is not left blank or marked as
  "TBD".
- Attach evidence of management acknowledgement, such as a dated email or signed document confirming the
  scheduled review date.
