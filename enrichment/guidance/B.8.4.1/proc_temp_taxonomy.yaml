must_id: item:B.8.4.1:proc_temp_taxonomy
control_ref: B.8.4.1
standard_id: ISO27701:2019
must_text: Temp file taxonomy (customer-facing multi-tenant apps + shared infrastructure + integration
  middleware)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all types of temporary files generated by customer-facing multi-tenant applications, shared infrastructure,
  and integration middleware in a dated taxonomy document.
- Name a specific individual responsible for maintaining and updating the temporary file taxonomy, avoiding
  generic roles like "IT team" or "Operations".
- Cross-reference each temporary file type to its associated business process and data retention policy
  in the taxonomy document.
- Record the location and access permissions for each temporary file type, including details on shared
  or segregated storage locations.
- Review and update the taxonomy document at least annually, capturing the review date and the name of
  the reviewer.
