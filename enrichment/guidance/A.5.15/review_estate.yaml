must_id: item:A.5.15:review_estate
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Estate-alignment check — new systems / cloud services added since last review reflected in
  policy
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all systems and cloud services currently in use, including those added since the last review, in
  a dated inventory document.
- Cross-reference each new system or service against the existing Access Control Policy to confirm inclusion
  or note required updates.
- Document any policy changes made to address new systems or services, including the date and the name
  of the person approving the update.
- Name the reviewer as a specific individual responsible for the estate-alignment check, not a group or
  department.
- Retain a signed and dated record of the completed review, showing alignment between the policy and the
  current system inventory.
