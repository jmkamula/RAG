must_id: item:A.5.15:rbac
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Role-based access control as the default model with stated exceptions (attribute-based, individual
  grants)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the access control policy that role-based access control is the default model for all systems
  and applications.
- List any exceptions to role-based access, specifying where attribute-based or individual access is granted,
  and explain the business justification for each.
- Name the policy owner as a specific individual responsible for maintaining and reviewing the access
  control policy.
- Record the date of the latest policy approval and the name of the approving authority in the policy
  document.
- Avoid using generic statements such as "access is granted as needed" without specifying the model and
  exceptions.
