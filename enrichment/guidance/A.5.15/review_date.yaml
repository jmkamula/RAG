must_id: item:A.5.15:review_date
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Access Control Policy in a version-controlled document or
  policy register.
- State the planned review interval for the Access Control Policy in the policy document, such as "annually"
  or "every 18 months."
- Name the reviewer as a specific individual, not a group or department, in the review record or meeting
  minutes.
- Confirm that the actual review date falls within the stated interval by cross-referencing the last review
  date and the planned interval.
- Retain evidence of the completed review, such as signed meeting minutes or a dated approval email from
  the named reviewer.
