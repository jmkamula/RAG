must_id: item:A.5.15:review_reviewer
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Reviewer identity and role (typically CISO with IT and identity-management input)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, such as the CISO, in the policy review record—avoid listing
  only a team or department.
- Document the reviewer’s official role and department in the review log alongside their name.
- Record the date the access control policy review was completed in a version-controlled document or register.
- List contributors from IT and identity-management by name and role in the review documentation.
- Sign the review record electronically or physically to confirm the reviewer’s approval and accountability.
