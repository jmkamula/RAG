must_id: item:A.5.15:comm_channel
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Channel used (manager briefing, IT admin training, intranet publication)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact communication channel used to share the access control policy, such as manager briefing,
  IT admin training, or intranet publication.
- Document the date the policy was communicated and the name of the person responsible for delivering
  the communication.
- List the intended audience or recipients for each communication channel, specifying roles or named individuals
  where possible.
- Retain a copy or screenshot of the communication as evidence, such as an email, meeting agenda, or intranet
  post.
- Name the communication owner as a specific individual, not a generic group or department.
