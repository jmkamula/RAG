must_id: item:A.5.15:approval_authority
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Statement of the signatory's authority (delegation chain if not top-management)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual who approved the Access Control Policy, including their full name and job title,
  on the approval record.
- Document the date the Access Control Policy was approved in a signed approval record.
- State the signatory’s authority to approve the policy, referencing their position or a formal delegation
  document if not top management.
- Attach the delegation of authority document if the signatory is not a member of top management.
- Avoid using generic titles like "the team" or "management" as the signatory; specify a single, accountable
  person.
