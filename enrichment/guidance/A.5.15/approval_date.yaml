must_id: item:A.5.15:approval_date
control_ref: A.5.15
standard_id: ISO27001:2022
must_text: Approval date recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual manager or executive who approved the Access Control Policy, avoiding generic titles
  or group names.
- Record the exact date on which the Access Control Policy was formally approved in the policy document
  or approval record.
- Retain a signed or digitally authenticated copy of the approval showing both the approver’s name and
  the approval date.
- Cross-reference the approval date in your policy register or document management system to ensure consistency
  across records.
