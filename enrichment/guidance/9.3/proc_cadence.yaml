must_id: item:9.3:proc_cadence
control_ref: '9.3'
standard_id: ISO27001:2022
must_text: Cadence stated (annual minimum + trigger-based interim reviews)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the planned frequency of management reviews in the procedure, specifying at least annual reviews
  as a minimum requirement.
- List specific events that will trigger interim management reviews, such as significant security incidents
  or major changes to the ISMS.
- Name the individual responsible for scheduling and initiating management reviews, avoiding generic roles
  like "the team" or "management."
- Record the date the procedure was last updated to show the cadence statement is current and actively
  maintained.
