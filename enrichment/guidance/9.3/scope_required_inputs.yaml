must_id: item:9.3:scope_required_inputs
control_ref: '9.3'
standard_id: ISO27001:2022
must_text: Required inputs enumerated per clause 9.3.2 a-g (audit results, NC status, monitoring, objectives,
  party feedback, opportunities for improvement, changes)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each required management review input from ISO 27001:2022 clause 9.3.2 a-g in the meeting agenda
  or minutes.
- Record the date and attendees of the management review meeting where these inputs were discussed.
- Document specific outputs and decisions made for each input, referencing the corresponding clause letter.
- Attach relevant supporting documents, such as audit reports or feedback summaries, to the review record
  for each input.
- Name the meeting owner as a specific individual, not a group or department, in the review documentation.
