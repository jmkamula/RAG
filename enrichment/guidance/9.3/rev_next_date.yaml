must_id: item:9.3:rev_next_date
control_ref: '9.3'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned management review date in the review program document, clearly showing the intended
  schedule for future reviews.
- Record the date as a specific calendar date, not just a month, quarter, or year, to avoid ambiguity.
- Name the individual responsible for scheduling and initiating the next review, listing their full name
  and role.
- Retain a copy of the approved review program with the next planned review date visible and unaltered.
