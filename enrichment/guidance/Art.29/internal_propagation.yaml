must_id: item:Art.29:internal_propagation
control_ref: Art.29
standard_id: GDPR:2016/679
must_text: Internal propagation — how instructions reach engineering / support / ops who actually touch
  data
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for how data handling instructions are communicated from management
  to engineering, support, and operations teams in a dated procedure.
- Name the specific individual responsible for relaying instructions to each team, avoiding generic titles
  like "the team" or "IT department".
- Record examples of actual instructions sent to these teams, including the date, sender, and recipient,
  to show the process in action.
- Retain acknowledgements from team members confirming receipt and understanding of instructions, with
  names and dates included.
