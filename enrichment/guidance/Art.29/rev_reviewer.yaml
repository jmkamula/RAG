must_id: item:Art.29:rev_reviewer
control_ref: Art.29
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + HR + ops lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- 'Name the reviewer as a specific individual for each role: Data Protection Officer, HR representative,
  and operations lead.'
- Record the date each reviewer completed their review in the Processing Under Authority Program Review
  log.
- Document each reviewer’s signature or written confirmation of their participation in the review.
- Retain the completed review document with all reviewer identities and confirmations in a central, access-controlled
  location.
