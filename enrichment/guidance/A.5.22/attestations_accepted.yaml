must_id: item:A.5.22:attestations_accepted
control_ref: A.5.22
standard_id: ISO27001:2022
must_text: Third-party attestations accepted in lieu of direct audit (with criteria)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific criteria your organisation uses to accept third-party attestations instead of
  direct audits in a dated policy or procedure.
- Record each supplier’s attestation, including the issuing body, date, and scope, in your supplier review
  records.
- Name the decision-maker who approved acceptance of each attestation in place of a direct audit, and
  retain their documented approval.
- State the reason for accepting the attestation over a direct audit for each supplier, referencing the
  documented criteria.
- Name the supplier contact and the exact attestation provided—do not list only “certificate on file”
  or generic statements.
