must_id: item:A.5.22:sch_cadence
control_ref: A.5.22
standard_id: ISO27001:2022
must_text: Cadence per supplier (proportional to tier — high-tier monthly, low-tier annually, etc.)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each supplier in the register with an assigned risk tier, showing how you determined the tier for
  transparency.
- Specify the review frequency for each supplier in the register, matching the cadence to the assigned
  risk tier.
- Name a specific individual responsible for conducting each supplier review, avoiding generic roles like
  "the team" or "IT".
- Record the last completed review date and the next scheduled review date for every supplier in the register.
- Attach evidence of completed reviews, such as signed review checklists or meeting minutes, linked to
  each supplier entry.
