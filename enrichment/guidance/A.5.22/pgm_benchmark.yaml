must_id: item:A.5.22:pgm_benchmark
control_ref: A.5.22
standard_id: ISO27001:2022
must_text: External benchmarking or industry-practice input considered
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the sources of external benchmarking data or industry best practices reviewed during the supplier
  review program meta-review, including publication names and dates.
- Record how these external inputs influenced your supplier review criteria or processes, citing specific
  examples or changes made.
- Name the individual responsible for gathering and evaluating external benchmarking information, ensuring
  this is a specific person rather than a team or department.
- Attach copies or links to the referenced external reports, benchmarking studies, or industry guidelines
  used in the meta-review.
- State the date when the external benchmarking input was last reviewed and incorporated into your supplier
  review program.
