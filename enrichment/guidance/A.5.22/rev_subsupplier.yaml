must_id: item:A.5.22:rev_subsupplier
control_ref: A.5.22
standard_id: ISO27001:2022
must_text: Supplier's own supplier relationships reviewed (sub-supplier / fourth-party oversight)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify each supplier's use of sub-suppliers or fourth parties in a documented supplier inventory,
  listing names and services provided.
- Request and retain written confirmation from each supplier describing how they assess and manage their
  own sub-suppliers' information security.
- Record the date and outcome of your review of each supplier’s sub-supplier oversight, including any
  identified risks or gaps.
- Name the reviewer as a specific individual, not a group or department, in each review record.
- Attach evidence, such as supplier audit reports or security questionnaires, that demonstrate the supplier’s
  oversight of their sub-suppliers.
