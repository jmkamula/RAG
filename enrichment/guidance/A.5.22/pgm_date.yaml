must_id: item:A.5.22:pgm_date
control_ref: A.5.22
standard_id: ISO27001:2022
must_text: Meta-review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent meta-review in the Supplier Review Program register, ensuring it
  is clearly visible and unambiguous.
- State the planned review interval for meta-reviews in a documented schedule, referencing the policy
  or procedure that defines this interval.
- Compare the actual meta-review date against the planned interval and document the result, noting any
  deviations and corrective actions taken.
- Name the responsible individual who conducted the meta-review, avoiding generic titles like "the team"
  or "procurement department".
- Retain the signed meta-review summary report, including the date and reviewer’s name, as evidence of
  completion within the required timeframe.
