must_id: item:5.2:rev_reviewer
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Reviewer identity (ISMS Manager + top management sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the ISMS Manager and a top management sponsor as the reviewers in the policy review record, using
  their full names and job titles.
- Record the date each reviewer completed their review on the policy review document or tracking log.
- Obtain a signature or written approval from both the ISMS Manager and top management sponsor on the
  final review record.
- Avoid listing a group, department, or generic title as reviewer; always specify named individuals for
  clear accountability.
