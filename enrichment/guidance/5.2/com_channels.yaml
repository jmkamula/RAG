must_id: item:5.2:com_channels
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Distribution channels stated (intranet, onboarding pack, all-hands, signed acknowledgement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all distribution channels used to communicate the information security policy, such as intranet,
  onboarding pack, all-hands meetings, or email.
- Document the date and method each channel was used to share the policy, creating a dated communication
  log or record.
- Name the person responsible for managing each distribution channel, ensuring an individual is identified
  rather than a team or department.
- Collect signed or electronic acknowledgements from recipients, storing these as evidence of receipt
  and understanding.
