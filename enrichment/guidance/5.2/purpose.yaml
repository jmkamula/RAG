must_id: item:5.2:purpose
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Appropriate to the purpose of the organisation
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the organisation’s core business activities and information security objectives in the policy’s
  opening section, referencing the current business plan or mission statement.
- Document how the policy addresses specific risks and regulatory requirements relevant to your industry,
  citing recent risk assessments or legal obligations.
- Name the policy owner as a specific individual with decision-making authority, not a department or generic
  role.
- Record the date of the most recent review and approval by top management, attaching meeting minutes
  or a signed approval page.
- Cross-reference the policy with other key documents, such as the risk register or compliance obligations
  list, to show alignment with organisational needs.
