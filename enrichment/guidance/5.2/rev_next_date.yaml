must_id: item:5.2:rev_next_date
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date clearly in the information security policy document.
- Record the date in a version control log or policy register alongside the current policy version.
- Name the individual responsible for scheduling and conducting the next review in the policy document.
- Avoid leaving the next review date blank or stating "as needed"—use a specific future date.
