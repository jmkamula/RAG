must_id: item:5.2:app_date
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Approval date stated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the approval date clearly on the information security policy approval record.
- Record the approval date as a full date, including day, month, and year, not just month or year.
- Confirm the approval date matches the date on the signed approval document.
- Retain the approval record with the stated date in a location accessible for audit review.
