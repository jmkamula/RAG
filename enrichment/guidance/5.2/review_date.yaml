must_id: item:5.2:review_date
control_ref: '5.2'
standard_id: ISO27001:2022
must_text: Review date or frequency stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next scheduled review date or a clear review frequency directly on the first page of the Information
  Security Policy.
- Name the person or role responsible for conducting the review, ensuring it is a specific individual
  and not a generic group.
- Record the date when the current version of the policy was last reviewed and approved.
- Avoid using vague terms like "as needed" or "periodically" for the review frequency; specify an exact
  interval such as "annually" or "every 24 months."
