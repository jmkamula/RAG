must_id: item:A.7.4:scope_change_drivers
control_ref: A.7.4
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new site, new building wing, employee-privacy regulator action)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List specific events that require re-scoping, such as opening a new site, expanding to a new building
  wing, or receiving regulator feedback.
- Document the trigger list in a dated monitoring scope procedure, and store the procedure in your central
  policy repository.
- Name the person responsible for reviewing the trigger list annually, recording their name and review
  date in the procedure.
- Avoid using vague triggers like "significant change"; describe concrete events so an auditor can clearly
  see when re-scoping is required.
