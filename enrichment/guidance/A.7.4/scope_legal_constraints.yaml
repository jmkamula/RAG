must_id: item:A.7.4:scope_legal_constraints
control_ref: A.7.4
standard_id: ISO27001:2022
must_text: Legal constraints on monitoring (changing-area exclusions, employee-privacy minima per jurisdiction)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific laws and regulations that limit monitoring in each jurisdiction where you operate,
  listing them in your monitoring scope document.
- Document any areas excluded from monitoring, such as changing rooms or restrooms, with a dated justification
  referencing the relevant legal requirement.
- State the minimum employee privacy standards required by law for each location, and cross-reference
  these to your monitoring procedures.
- Assign a named individual responsible for reviewing legal updates on monitoring restrictions at least
  annually, recording the review date and outcome.
- Avoid using generic statements like "monitoring complies with all laws"—instead, provide detailed, location-specific
  legal references in your documentation.
