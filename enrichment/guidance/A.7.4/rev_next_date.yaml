must_id: item:A.7.4:rev_next_date
control_ref: A.7.4
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Periodic Monitoring Program in the review schedule document.
- Record the date in a version-controlled document that is accessible to relevant stakeholders.
- Name the individual responsible for confirming and updating the next review date in the same document.
- Avoid leaving the next review date field blank or stating "TBD"—enter a specific calendar date.
