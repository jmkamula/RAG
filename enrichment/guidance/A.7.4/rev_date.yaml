must_id: item:A.7.4:rev_date
control_ref: A.7.4
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the monitoring program in a dated log or register entry.
- Document the planned review interval in months or years within the monitoring program documentation.
- Confirm the next scheduled review date is calculated and listed, based on the documented interval.
- Name the reviewer as a specific individual responsible for the last and upcoming reviews, not as a team
  or department.
- Retain a signed or approved record of the review completion, showing the date and reviewer’s name.
