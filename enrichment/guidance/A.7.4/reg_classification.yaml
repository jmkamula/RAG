must_id: item:A.7.4:reg_classification
control_ref: A.7.4
standard_id: ISO27001:2022
must_text: Per-event classification (true-positive / false-positive / requires-investigation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each monitoring event in the register with a unique identifier, event timestamp, and a brief
  description of the detected activity.
- Assign a classification to every event as "true-positive", "false-positive", or "requires-investigation"
  in a dedicated column of the register.
- Name the individual who made the classification decision for each event, avoiding generic roles like
  "SOC team" or "IT department".
- Date each classification entry to show when the decision was made or updated.
- Document any changes in classification status, including the reason for reclassification and the name
  of the person authorizing the change.
