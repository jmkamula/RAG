must_id: item:A.7.2.4:rev_retrievability
control_ref: A.7.2.4
standard_id: ISO27701:2019
must_text: Retrievability test — sampled consent events retrieved within stated SLA
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Select a random sample of recent consent events from your consent log, noting the unique identifiers
  and dates for each event.
- Retrieve each sampled consent record from your system within the time period defined in your documented
  service level agreement (SLA).
- Record the retrieval times and outcomes for each consent event in a dated test results log, including
  any failures or delays.
- Name the individual responsible for conducting and signing off the retrievability test, ensuring this
  is a specific person rather than a team or department.
- Retain evidence of the test, such as screenshots or exported records, alongside the test log for future
  auditor review.
