must_id: item:A.7.2.4:proc_withdrawal_link
control_ref: A.7.2.4
standard_id: ISO27701:2019
must_text: Withdrawal pathway link (per §7.3.4 modify/withdraw consent)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the exact location of the withdrawal pathway link within the consent capture process, including
  a screenshot and URL or interface reference.
- Cross-reference the withdrawal pathway link in your consent recording procedure, citing the relevant
  section of ISO27701:2019 §7.3.4.
- Name the person responsible for maintaining the withdrawal pathway link and updating procedures when
  changes occur.
- Confirm that the withdrawal pathway link is active and functional by recording the date and result of
  the most recent test.
- Avoid using generic or placeholder links; provide a working, organisation-specific withdrawal pathway
  that users can access directly.
