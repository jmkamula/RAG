must_id: item:A.7.2.4:rev_next_date
control_ref: A.7.2.4
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Consent Capture Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the person responsible for scheduling and conducting the next review within the same
  document.
- Confirm the review documentation is dated and version-controlled, showing when the next review date
  was last set.
- Name the owner as a specific individual — not a team or department — to avoid ambiguity in accountability.
