must_id: item:Art.21:intake_channel
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Intake channel via Art.12 procedure
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the intake channel for right to object requests in your documented procedure, matching the contact
  method described in your Article 12 process.
- Document the process steps showing how right to object requests are received, logged, and acknowledged
  using the same intake channel as other data subject rights.
- Cross-reference your right to object procedure with your Article 12 procedure by including a section
  or appendix that links the two documents.
- Assign a specific individual as the responsible contact for managing requests, avoiding generic roles
  like "the team" or "Data Protection Office".
