must_id: item:Art.21:scope_direct_marketing
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Direct-marketing activities enumerated (any basis — Art.21.2 right is absolute)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all direct-marketing activities your organisation conducts, including email, phone, SMS, and postal
  campaigns, in a dated document.
- State the legal basis claimed for each direct-marketing activity, referencing the relevant GDPR article
  for each entry.
- Name a specific individual responsible for maintaining and updating the direct-marketing activities
  list, avoiding generic roles like "marketing team".
- Cross-reference each direct-marketing activity to the corresponding entry in your Record of Processing
  Activities (ROPA) for traceability.
- Retain evidence of when and how each direct-marketing activity was last reviewed for GDPR compliance,
  such as meeting minutes or review logs.
