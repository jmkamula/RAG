must_id: item:Art.21:rev_date
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Objection Program in a dated log or review register entry.
- Confirm the planned review interval is documented in the program’s governance policy or schedule.
- Cross-reference the actual review date against the planned interval to verify it falls within the required
  timeframe.
- Name the reviewer as a specific individual in the review record, not as a group or department.
- Retain evidence of the completed review, such as a signed review report or meeting minutes with the
  review date.
