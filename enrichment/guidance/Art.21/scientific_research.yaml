must_id: item:Art.21:scientific_research
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Scientific-research / statistical-purposes overlay (Art.21.6 — public-interest task derogation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific public-interest research or statistical purpose that justifies processing personal
  data despite an objection, including legal or policy references.
- Name the individual decision-maker who determines if the public-interest task overrides the objection,
  ensuring this is not a generic title or group.
- Record each objection received, the assessment made, and the final decision with dates and supporting
  evidence in a dedicated register.
- Retain a copy of the communication sent to the data subject explaining the outcome of their objection
  and the reasons for any derogation applied.
