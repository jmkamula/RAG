must_id: item:Art.21:rev_next_date
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Objection Program in the review documentation, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling and leading the next review in the same
  document.
- Confirm the review date is not left blank or marked as "TBD"—auditors will flag missing or vague dates.
- Retain a copy of the dated and signed review schedule as part of your compliance records.
