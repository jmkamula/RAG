must_id: item:Art.21:reg_objection_type
control_ref: Art.21
standard_id: GDPR:2016/679
must_text: Per-row objection type (direct marketing absolute / legitimate interests balancing / scientific
  research)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific objection type for each entry in the register, choosing from direct marketing, legitimate
  interests, or scientific research.
- Document the date the objection was received alongside the objection type for every row in the register.
- Name the individual who classified the objection type for each entry, ensuring a specific person is
  listed rather than a team or department.
- Review each register entry to confirm that the objection type field is never left blank or marked as
  "other".
