must_id: item:A.5.29:must_continue
control_ref: A.5.29
standard_id: ISO27001:2022
must_text: Security controls that must continue operating during disruption (named explicitly — encryption,
  access control, audit logging at minimum)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all security controls that must remain active during disruption, including encryption, access control,
  and audit logging, in a dated disruption plan document.
- Name a specific individual responsible for maintaining each listed control during disruption, avoiding
  vague assignments like "IT team" or "Security group."
- Document the method for verifying each control’s continued operation during disruption, such as periodic
  checks or automated alerts, with evidence of recent test results.
- Record the date and outcome of the most recent test or simulation demonstrating these controls functioned
  as intended during a disruption scenario.
- Obtain written approval of the disruption plan, including the named controls, from a senior manager,
  with a signature and date.
