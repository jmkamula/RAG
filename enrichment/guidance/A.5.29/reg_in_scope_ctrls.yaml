must_id: item:A.5.29:reg_in_scope_ctrls
control_ref: A.5.29
standard_id: ISO27001:2022
must_text: In-scope controls per row (which security controls this scenario specifically impacts; cross-link
  to A.5.9 asset register for assets at risk)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each disruption scenario to specific security controls it impacts, listing relevant
  ISO27001 control numbers in a dedicated column.
- Link each scenario to affected assets by referencing unique asset IDs from the A.5.9 asset register
  in the register row.
- Name the responsible owner for each scenario as a specific individual, not a team or department.
- Record the date each scenario entry was last reviewed or updated in the register.
- Avoid generic or boilerplate control references; specify only those controls directly impacted by the
  scenario.
