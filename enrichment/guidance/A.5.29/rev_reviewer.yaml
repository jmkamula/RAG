must_id: item:A.5.29:rev_reviewer
control_ref: A.5.29
standard_id: ISO27001:2022
must_text: Reviewer identity (CISO + BCP-program owner + Legal where regulatory comms scope; supplier-management
  lead where supplier-dep scenarios in scope)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- Name each reviewer as a specific individual by full name and job title in the review record.
- Record the date each reviewer completed their review and any comments or findings in the review documentation.
- Document the involvement of Legal if regulatory communications are within the review scope, and the
  supplier-management lead if supplier dependencies are included.
- Avoid listing groups or teams as reviewers; ensure only named individuals are recorded for each required
  role.
- Retain a signed or digitally acknowledged statement from each reviewer confirming their participation
  in the periodic review.
