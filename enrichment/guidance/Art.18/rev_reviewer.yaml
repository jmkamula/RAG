must_id: item:Art.18:rev_reviewer
control_ref: Art.18
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + ops lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as the Data Protection Officer and the operations lead, listing their full names and
  job titles in the review record.
- Record the date when the review was completed by both the Data Protection Officer and the operations
  lead.
- Obtain signatures or written confirmation from both reviewers on the final review document.
- Avoid listing a group or department as the reviewer; always specify individual names for accountability.
