must_id: item:A.7.3.8:rev_next_date
control_ref: A.7.3.8
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Copy Provision Program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Sign and date the review document to confirm when the next review date was set and by whom.
- Retain previous versions of the review document to show a history of planned and actual review dates.
