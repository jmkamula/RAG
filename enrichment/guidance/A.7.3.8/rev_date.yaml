must_id: item:A.7.3.8:rev_date
control_ref: A.7.3.8
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Copy Provision Program in a dated document or system entry.
- State the planned review interval in months or years within the program documentation.
- Compare the actual review date to the planned interval and document the result in the review log.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach evidence of the completed review, such as meeting minutes or a signed checklist, to the program
  file.
