must_id: item:A.7.4.4:rev_reviewer
control_ref: A.7.4.4
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Privacy Engineering)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and a Privacy Engineering representative.
- Record the date each reviewer completed their assessment of the minimization program in a dated review
  log or meeting minutes.
- Document each reviewer's comments or findings in the review record, ensuring their input is clearly
  attributed to them.
- Obtain a physical or electronic signature from both the Data Protection Officer and Privacy Engineering
  reviewer on the final review document.
