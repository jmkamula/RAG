must_id: item:A.7.4.4:proc_mechanism_map
control_ref: A.7.4.4
standard_id: ISO27701:2019
must_text: Mechanism map — de-identification / pseudonymisation / aggregation / generalisation / suppression
  per activity
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each processing activity involving personal data, referencing the activity name and responsible
  owner in a dated register.
- Describe the specific minimization mechanism used for each activity, such as de-identification, pseudonymisation,
  aggregation, generalisation, or suppression.
- Attach or link supporting technical documentation or process descriptions that detail how each mechanism
  is implemented for the corresponding activity.
- Name the owner as a specific individual responsible for maintaining and updating the mechanism map —
  do not use generic roles or teams.
- Review and update the mechanism map annually, recording the review date and the reviewer’s name in the
  register.
