must_id: item:A.7.4.4:rev_date
control_ref: A.7.4.4
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the data minimization program in a central log or register.
- State the planned review interval for the minimization program in a documented schedule or policy.
- Confirm that the actual review date falls within the planned interval by cross-referencing the review
  log and the schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain evidence of the completed review, such as meeting minutes or a signed review report, dated accordingly.
