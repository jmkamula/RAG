must_id: item:A.7.1:rev_reviewer
control_ref: A.7.1
standard_id: ISO27001:2022
must_text: Reviewer identity (Facilities lead + InfoSec lead jointly)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name both the Facilities lead and the Information Security lead as joint reviewers in the Perimeter
  Program Review document.
- Record the full names and job titles of both reviewers on the review sign-off page, avoiding generic
  labels like "the team" or "management".
- Document the date when both leads completed the review, ensuring the date is clearly visible on the
  review record.
- Obtain signatures or electronic approvals from both leads on the final review document to confirm joint
  participation.
