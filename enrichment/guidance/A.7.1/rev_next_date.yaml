must_id: item:A.7.1:rev_next_date
control_ref: A.7.1
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Perimeter Program in the review document, using a clear and
  specific calendar date.
- Record the decision on the review date in meeting minutes or an action log, including the names of those
  present and the date of agreement.
- Name the individual responsible for scheduling and leading the next review, avoiding generic titles
  like "the team" or "security department."
- Cross-reference the stated review date in the Perimeter Program Review schedule or calendar entry to
  ensure consistency across records.
