must_id: item:A.5.14:comm_onboarding
control_ref: A.5.14
standard_id: ISO27001:2022
must_text: Distribution at onboarding for new personnel evidenced (induction pack, mandatory module covering
  transfer rules + approved channels)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the inclusion of the Information Transfer Policy in the onboarding induction pack, listing
  the specific version and date added.
- Record completion of a mandatory training module on transfer rules and approved channels for each new
  hire, including their name and completion date.
- Name the individual responsible for updating onboarding materials, avoiding generic titles like "HR
  team" or "IT department".
- Retain signed or electronically acknowledged receipts from new personnel confirming they have received
  and understood the policy.
