guidance:
- Record the approval date of the Information Transfer Policy in the policy document itself.
- Name the approving manager as a specific individual, not a group or department.
- Retain a signed or digitally approved copy of the policy showing the approval date.
- Cross-reference the approval date in your policy register or document control log.
