must_id: item:A.5.14:review_triggers
control_ref: A.5.14
standard_id: ISO27001:2022
must_text: Ad-hoc triggers listed (new tooling rollout, regulator action against peer, incident lessons-learned
  involving a transfer breach)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List specific ad-hoc triggers for policy review, such as new tooling rollout, regulator action against
  a peer, or incidents involving transfer breaches, in the policy document.
- Document each occurrence of an ad-hoc trigger with a dated entry in the policy review log, referencing
  the relevant event or incident.
- Assign a named individual responsible for monitoring and recording ad-hoc triggers, ensuring the owner
  is not listed as a team or department.
- Record the date and outcome of each ad-hoc policy review, including any changes made, in the policy
  review log.
