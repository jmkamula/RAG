must_id: item:A.5.14:review_date
control_ref: A.5.14
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Information Transfer Policy in a policy register or on the
  policy document itself.
- Name the reviewer as a specific individual who conducted the review, not a generic role or team.
- Document the planned review interval in months or years within the policy or a linked schedule.
- Confirm that the recorded review date falls within the documented review interval by cross-referencing
  both records.
- Retain evidence of the review decision, such as meeting minutes or a signed approval, dated to match
  the recorded review date.
