must_id: item:A.5.14:review_outcome
control_ref: A.5.14
standard_id: ISO27001:2022
must_text: Outcome captured (no change / amended / re-issued) with rationale per amendment
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to lead the periodic review of the Information Transfer Policy and record
  their name and review date in the policy log.
- Document the review outcome as "no change," "amended," or "re-issued" in a dated review record linked
  to the policy version.
- State the rationale for each outcome or amendment in the review record, referencing any incidents, regulatory
  updates, or business changes considered.
- Avoid using generic statements like "reviewed as required"—provide specific details about what was examined
  and why the decision was made.
- Retain all previous review records and rationales in a central location accessible for audit, showing
  a clear history of policy decisions.
