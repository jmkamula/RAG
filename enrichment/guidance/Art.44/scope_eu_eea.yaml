must_id: item:Art.44:scope_eu_eea
control_ref: Art.44
standard_id: GDPR:2016/679
must_text: EU/EEA boundary — which destinations are within / outside the GDPR territorial scope
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all countries where personal data is transferred, including cloud storage and third-party processors,
  in a dated transfer register.
- State for each country whether it is inside or outside the EU/EEA, referencing the current European
  Commission list.
- Document the legal basis for each transfer outside the EU/EEA, such as adequacy decisions or standard
  contractual clauses, in the transfer register.
- Name the owner responsible for maintaining the transfer register as a specific individual, not a team
  or department.
- Attach evidence of regular review of the transfer register, such as a signed and dated review log.
