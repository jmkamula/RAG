must_id: item:Art.44:rev_next_date
control_ref: Art.44
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Transfer Program in the review document, using a clear and
  specific calendar date.
- Record the name of the person responsible for scheduling and conducting the next review, not just their
  job title or team.
- Document the date this review schedule was last updated, ensuring it is not left blank or marked "TBD".
- Attach any approval or sign-off confirming the next review date, such as a signed email or meeting minutes.
