must_id: item:Art.44:rev_reviewer
control_ref: Art.44
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel + procurement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer involved in the transfer program review, specifying their role as DPO, legal counsel,
  or procurement.
- Record the date each reviewer completed their review in the official transfer program review document.
- Obtain a signature or written confirmation from each reviewer to evidence their participation and agreement
  with the review outcome.
- Avoid listing groups or job titles only; identify each reviewer as a specific, named individual.
