must_id: item:Art.44:reg_owner
control_ref: Art.44
standard_id: GDPR:2016/679
must_text: Per-row owner
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of each international data transfer as a specific individual, not a team or department,
  in the register.
- Record the owner's full name and job title for each entry, ensuring clear identification in the register.
- Document the date when the owner was assigned responsibility for each transfer row in the register.
- Review the register quarterly and update owner assignments if staff changes occur, keeping the record
  current.
