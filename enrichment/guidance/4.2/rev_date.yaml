must_id: item:4.2:rev_date
control_ref: '4.2'
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Interested Parties Program in a dated log or register entry.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Confirm the review date falls within the interval defined in your documented review schedule.
- Attach a copy of the signed review summary or meeting minutes as evidence of the completed review.
