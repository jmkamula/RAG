must_id: item:4.2:scope_exclusions
control_ref: '4.2'
standard_id: ISO27001:2022
must_text: Exclusions stated explicitly with rationale (e.g. retail-consumer party type excluded for a
  B2B-only org)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all stakeholder domains considered during scoping, including those both included and excluded,
  in a dated document.
- State each excluded stakeholder domain explicitly, with a clear and specific reason for its exclusion,
  not just "not applicable."
- Name the person responsible for approving the exclusions and rationale, ensuring this is a specific
  individual, not a group or department.
- Retain a signed and dated record of the approval decision for the exclusions and rationale.
