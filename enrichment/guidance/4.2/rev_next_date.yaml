must_id: item:4.2:rev_next_date
control_ref: '4.2'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Interested Parties Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the individual responsible for scheduling and leading the next review within the
  same document.
- Confirm the review date is not left as "TBD" or a vague timeframe, as auditors will flag missing or
  unclear dates.
- Retain the dated review schedule alongside the current version of the Interested Parties Program for
  reference.
