must_id: item:4.2:proc_owner
control_ref: '4.2'
standard_id: ISO27001:2022
must_text: Named owner of the framework
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Stakeholder Identification Framework, avoiding generic
  titles like "the team" or "management".
- Record the owner's full name and job title in the framework document, including the date of assignment.
- Obtain the owner's signature or written confirmation acknowledging responsibility for maintaining and
  updating the framework.
- Retain a copy of the current framework with the named owner and assignment date in your central policy
  repository.
