must_id: item:A.8.30:rev_next_date
control_ref: A.8.30
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the outsourced development program in the review documentation.
- Record the date the current review was completed and the person responsible for scheduling the next
  review.
- Name the owner as a specific individual responsible for confirming the next review date, not a team
  or department.
- Retain a copy of the review schedule showing the next planned review date alongside previous review
  dates.
