must_id: item:A.8.30:rev_reviewer
control_ref: A.8.30
standard_id: ISO27001:2022
must_text: Reviewer identity (Engineering + Supplier Management + InfoSec)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer from Engineering, Supplier Management, and Information Security as specific individuals
  in the review record.
- Record the date each reviewer completed their assessment in the review documentation.
- Document each reviewer's comments or findings in a dedicated section, clearly attributed to their name
  and role.
- Obtain a signature or written confirmation from each reviewer to verify their participation in the review
  process.
- Avoid listing groups or teams as reviewers; always identify each responsible person by full name.
