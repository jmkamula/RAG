must_id: item:Art.27:reg_interaction_id
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Per-row interaction id
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique interaction ID to each row in the Representative Operations Record to allow precise
  tracking of individual activities.
- Record the interaction ID alongside the relevant details for each entry, ensuring there are no duplicate
  IDs across the record.
- Cross-reference each interaction ID with supporting documentation, such as emails or call logs, to demonstrate
  the link between the record and the actual event.
- Confirm that the interaction ID is present and clearly visible in every row; avoid leaving any row blank
  or using generic placeholders like "N/A".
