must_id: item:Art.27:reg_sla_met
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Per-row SLA-met flag (response within Art.12.3 cascade)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date each data subject request was received in the operations record to establish the response
  timeline.
- Document the date and method of response for each request, referencing the relevant article 12.3 deadline.
- Mark each row with a clear "SLA met" or "SLA missed" flag based on whether the response met the required
  timeframe.
- Cross-reference each response entry with supporting correspondence or system logs to verify the timing
  and content of the reply.
- Name the individual responsible for monitoring and updating the SLA status for each request, avoiding
  generic titles like "team" or "department".
