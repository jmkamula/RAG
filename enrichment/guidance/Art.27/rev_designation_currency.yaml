must_id: item:Art.27:rev_designation_currency
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Designation currency — representative still operating, mandate still valid
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the current GDPR representative as a specific individual or company, including full legal name
  and contact details, in a dated document.
- Confirm the representative’s mandate is still valid by obtaining a signed and dated statement or contract
  renewal from the representative.
- Record the start and, if applicable, end date of the representative’s appointment in a compliance register
  or tracking log.
- Attach evidence that the representative is actively operating, such as recent correspondence or meeting
  minutes within the last 12 months.
- Avoid listing the representative as “the team” or a generic department; always specify a named person
  or legal entity.
