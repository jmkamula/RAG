must_id: item:Art.27:rev_next_date
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Representative Program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a role or team.
- Sign and date the review document to confirm when the next review date was set.
- Cross-reference the stated review date with your compliance calendar or tracking tool to ensure consistency.
