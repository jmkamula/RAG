must_id: item:Art.27:mandate_scope
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Mandate covering Art.27.4 functions (point of contact for SA + subjects)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the designated GDPR representative as a specific individual or company, including full contact
  details, in a dated appointment letter.
- Document the representative’s mandate, explicitly stating responsibility to act as contact for supervisory
  authorities and data subjects under Article 27.4.
- Sign the mandate by both the organisation and the representative, with clear effective dates for the
  appointment.
- Retain correspondence or contract amendments that confirm the representative’s acceptance of their Article
  27.4 responsibilities.
- Avoid listing only a generic team or role as representative; specify a named person or legal entity
  with direct contact information.
