must_id: item:Art.27:rev_date
control_ref: Art.27
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Representative Program in a dated log or register entry.
- Document the planned review interval for the Representative Program, specifying the frequency in months
  or years.
- Cross-reference the actual review date with the planned interval to confirm the review occurred within
  the required timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review record.
