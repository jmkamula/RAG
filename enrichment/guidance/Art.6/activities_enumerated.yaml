must_id: item:Art.6:activities_enumerated
control_ref: Art.6
standard_id: GDPR:2016/679
must_text: Processing activities enumerated (links to Art.30 RoPA)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each processing activity in the Lawful Basis Register, matching the descriptions used in your Article
  30 Record of Processing Activities.
- Cross-reference every processing activity entry to its corresponding record in the Article 30 RoPA,
  using a unique identifier or link.
- State the lawful basis for each processing activity, citing the specific Article 6(1) condition relied
  upon.
- Name the owner for each processing activity as a specific individual, not a team or department.
