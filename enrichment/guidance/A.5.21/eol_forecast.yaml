must_id: item:A.5.21:eol_forecast
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Rolling 12-month EOL forecast linked back to the component register
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each ICT component in your register with its manufacturer’s published end-of-life date,
  recording the source and date checked.
- Document a rolling 12-month forecast listing all components scheduled for end-of-life, including planned
  replacement or mitigation actions and responsible individuals.
- Update the forecast quarterly, saving each version with a revision date and the name of the person who
  made the update.
- Name the forecast owner as a specific individual, not a team or department, to avoid ambiguity in responsibility.
- Retain evidence of completed replacements or mitigations, such as signed-off work orders or change records,
  linked to the forecast entry.
