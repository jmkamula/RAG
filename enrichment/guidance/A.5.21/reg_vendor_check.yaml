must_id: item:A.5.21:reg_vendor_check
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Approved-vendor / banned-vendor list check stamp per row
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the approval status for each vendor and ICT component in the register, marking clearly as "approved"
  or "banned" with the decision date.
- Name the individual who performed the vendor status check for each row, using their full name rather
  than a generic title or team.
- Record the reference to supporting documentation, such as risk assessments or due diligence reports,
  for each approval or ban decision.
- Confirm that each entry in the register includes a visible check stamp or digital equivalent showing
  the status was reviewed and verified.
