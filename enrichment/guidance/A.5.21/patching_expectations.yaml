must_id: item:A.5.21:patching_expectations
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Support and patching expectations stated for each ICT product/service
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each ICT product or service covered in the procedure, including its name, version, and supplier,
  in a dated inventory table.
- State the required support and patching timelines for each product or service, referencing supplier
  documentation or contracts as evidence.
- Assign a named individual responsible for monitoring and applying patches for each product or service,
  avoiding generic roles like "IT team."
- Attach or link to supplier support lifecycle statements or patch release schedules for each product
  or service in the procedure document.
- Record the date of the last review and update of support and patching expectations for each product
  or service in the procedure.
