must_id: item:A.5.21:reg_subsupplier
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Disclosed sub-suppliers / fourth parties per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each ICT component or vendor in the register with a separate row for clarity and traceability.
- Record all disclosed sub-suppliers or fourth parties associated with each vendor directly in the corresponding
  row.
- Name the responsible individual maintaining the register, avoiding generic titles like "IT team" or
  "Procurement."
- Date each entry or update to show when sub-supplier information was last verified or changed.
- Retain supporting documentation from vendors confirming disclosure of their sub-suppliers for each listed
  relationship.
