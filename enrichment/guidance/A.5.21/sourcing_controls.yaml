must_id: item:A.5.21:sourcing_controls
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Sourcing controls (approved vendor list, banned-vendor list, country-of-origin considerations)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document an approved vendor list that includes vendor names, contact details, and the date of last review.
- Record a banned-vendor list with clear reasons for exclusion and the date each vendor was added.
- State country-of-origin for each vendor in the approved list, referencing supporting documentation such
  as contracts or supplier declarations.
- Name the individual responsible for maintaining and updating both lists, ensuring a specific person
  is identified rather than a team or department.
- Retain evidence of management approval for both lists, such as a signed or digitally approved record
  with a date.
