must_id: item:A.5.21:incident_sharing
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Rules for sharing information about supply chain issues or compromises with suppliers and within
  own group
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the procedure for notifying suppliers and internal teams about supply chain security incidents,
  including required timelines and communication channels, in a dated policy.
- Name the person or role responsible for initiating and overseeing information sharing about supply chain
  issues in the procedure.
- Record each supply chain incident notification with the date, recipient, summary of information shared,
  and method of communication in an incident log.
- Specify in the procedure that notifications must be written and traceable—do not rely on verbal-only
  or undocumented communications.
