must_id: item:A.5.21:rev_actions
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: Action items captured per critical component (e.g. tighten monitoring, push for upgrade, replan
  replacement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each critical ICT supply chain component reviewed, referencing a unique identifier or asset tag
  for traceability.
- Record specific action items for each component, such as monitoring improvements, upgrade requests,
  or replacement plans, with clear descriptions.
- Assign a named individual responsible for each action item, avoiding generic roles like "IT team" or
  "management."
- Date each action item entry and update to show when the action was captured or revised.
- Retain meeting minutes or review logs that show discussion and decisions for each action item, signed
  or acknowledged by participants.
