must_id: item:A.5.21:rev_threat_intel
control_ref: A.5.21
standard_id: ISO27001:2022
must_text: External threat intelligence input considered (link to A.5.7)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date and source of external threat intelligence reviewed during each ICT supply chain assessment
  in a supply chain review log.
- Name the individual responsible for gathering and presenting external threat intelligence, ensuring
  a specific person is listed rather than a team or department.
- Cross-reference the supply chain review record to the relevant threat intelligence reports or alerts
  that were considered, attaching copies where possible.
- Document any supply chain risk decisions or changes made as a result of the external threat intelligence
  input, including who approved them and when.
