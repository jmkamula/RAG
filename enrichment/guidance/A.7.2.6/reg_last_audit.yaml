must_id: item:A.7.2.6:reg_last_audit
control_ref: A.7.2.6
standard_id: ISO27701:2019
must_text: Last processor audit / due-diligence date per row
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of the most recent audit or due-diligence check for each PII processor in a dedicated
  column of the contract register.
- Cross-reference each audit date entry with supporting evidence, such as an audit report or due-diligence
  checklist, stored in a named location.
- Name the reviewer who performed or confirmed the audit for each processor, using a specific individual
  rather than a team or department.
- State the next scheduled audit or review date for each processor to demonstrate ongoing oversight and
  planning.
- Avoid leaving any processor row blank or marked "N/A" for audit date, as auditors will flag missing
  or incomplete entries.
