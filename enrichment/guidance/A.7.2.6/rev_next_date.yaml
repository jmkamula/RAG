must_id: item:A.7.2.6:rev_next_date
control_ref: A.7.2.6
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the processor contract program in a documented schedule or review
  log entry.
- Record the name of the individual responsible for conducting the next review, not just a team or department.
- Confirm the review date is future-dated and aligns with your organisation’s documented review frequency
  or policy.
- Retain a copy of the review schedule or log with the stated date in a location accessible to relevant
  stakeholders.
