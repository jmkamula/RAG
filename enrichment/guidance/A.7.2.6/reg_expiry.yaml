must_id: item:A.7.2.6:reg_expiry
control_ref: A.7.2.6
standard_id: ISO27701:2019
must_text: Contract expiry / renewal date per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the contract expiry and renewal date for each PII processor in a dedicated column of the contract
  register.
- Confirm each date entry is based on the signed contract document and matches the original agreement
  or most recent amendment.
- Name the person responsible for updating contract dates in the register, ensuring a specific individual
  is listed rather than a team or department.
- Review the register quarterly and document the review date and reviewer’s name to show dates remain
  current and accurate.
