must_id: item:Art.31:rev_date
control_ref: Art.31
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the SA Cooperation Program in a dated document or meeting minutes.
- Cross-reference the recorded review date with the planned review interval stated in your compliance
  calendar or policy.
- Name the reviewer as a specific individual responsible for the review, not a group or department.
- Retain evidence of the review outcome, such as a signed summary or approval from the reviewer.
