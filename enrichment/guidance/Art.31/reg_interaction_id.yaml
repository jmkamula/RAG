must_id: item:Art.31:reg_interaction_id
control_ref: Art.31
standard_id: GDPR:2016/679
must_text: Per-row interaction id
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique interaction ID to each entry in the SA Interaction Register, ensuring no two rows share
  the same identifier.
- Record the assigned interaction ID in a dedicated column for every row, matching it to the corresponding
  interaction details.
- Cross-reference each interaction ID with supporting records or correspondence to confirm traceability.
- Name the register owner as a specific individual, not a team or department, to avoid ambiguity in responsibility.
