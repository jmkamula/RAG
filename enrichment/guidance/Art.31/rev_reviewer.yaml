must_id: item:Art.31:rev_reviewer
control_ref: Art.31
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying the Data
  Protection Officer and the legal counsel.
- Record the date each reviewer completed their review on the SA Cooperation Program Review document.
- Sign the review section with a handwritten or digital signature from both the Data Protection Officer
  and the legal counsel.
- Attach evidence of each reviewer’s current appointment, such as a copy of their designation letter or
  employment contract.
