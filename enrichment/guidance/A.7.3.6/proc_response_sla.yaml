must_id: item:A.7.3.6:proc_response_sla
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Response-time SLA stated + honoured (undue delay standard)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the maximum response time for access, correction, or erasure requests in the documented procedure,
  referencing the "without undue delay" standard.
- Assign a named individual responsible for monitoring and fulfilling requests within the stated response
  time, listing their full name and role.
- Record the date each request is received and the date it is completed in a log, ensuring both dates
  are clearly visible.
- Retain evidence of completed requests, such as confirmation emails or signed forms, showing the response
  was provided within the stated timeframe.
- Specify the response-time owner as a specific person, not a group or department, to avoid ambiguity
  in accountability.
