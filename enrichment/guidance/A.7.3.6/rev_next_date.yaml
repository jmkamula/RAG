must_id: item:A.7.3.6:rev_next_date
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the ACR Program Review in the document, using a clear and specific
  calendar date.
- Record the name of the person responsible for scheduling the next review, not just a team or department.
- Document the date this review schedule was last updated, and include the updater’s name.
- Attach evidence of approval for the stated review date, such as a signed or emailed confirmation from
  the responsible individual.
