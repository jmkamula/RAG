must_id: item:A.7.3.6:rev_reviewer
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Legal + Engineering)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewers as specific individuals from Data Protection Officer, Legal, and Engineering roles
  in the ACR Program Review document.
- Record the date each reviewer completed their review next to their name in the ACR Program Review.
- Obtain a signature or written approval from each listed reviewer to confirm their participation in the
  review process.
- Avoid listing groups or departments as reviewers; ensure only named individuals are identified for each
  required role.
