must_id: item:A.7.3.6:proc_access_flow
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Access flow — Art.15 fields + copy of PII processed (link to A.7.3.8)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for handling access requests, listing all GDPR Article 15.1 fields
  to be provided to data subjects.
- Record each access request received, including the request date, requester’s identity, and the information
  provided, in a dedicated access request log.
- Attach a sample copy of the actual personal data disclosed, showing how a data subject would receive
  their information under Article 15.3.
- Cross-reference your procedure with control A.7.3.8 to show how requests for correction or erasure are
  handled alongside access requests.
- Name the procedure owner as a specific individual, not a generic role or team, to ensure clear accountability.
