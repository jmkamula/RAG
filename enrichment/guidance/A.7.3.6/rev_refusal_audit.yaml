must_id: item:A.7.3.6:rev_refusal_audit
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Refusal audit — sampled refusals reviewed for defensibility + subject-notification of reason
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Select a random sample of recent access request refusals and record the sample size, selection date,
  and responsible reviewer in a dated log.
- Document the specific reason for each refusal in the case file, referencing the relevant policy or legal
  basis for denial.
- Confirm that a notification was sent to each data subject, stating the refusal and the reason, and retain
  a copy of the notification or delivery record.
- Name the reviewer who assessed each refusal for defensibility, ensuring the name is a specific individual
  and not a generic team or department.
- Record the date and outcome of the review for each sampled refusal, noting any corrective actions taken
  if a refusal was found to lack sufficient justification.
