must_id: item:A.7.3.6:scope_change_drivers
control_ref: A.7.3.6
standard_id: ISO27701:2019
must_text: Trigger list (new regulation / new subject category)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current regulations and subject categories relevant to your organisation in a dated document
  reviewed at least annually.
- Record the specific trigger events—such as new regulations or subject categories—that require updates
  to your ACR Contexts Scope.
- Assign a named individual responsible for monitoring changes in regulations and subject categories,
  with their name and review date documented.
- Reference each update to the ACR Contexts Scope with the date, trigger event, and the person who approved
  the change.
- Specify the owner as a named person, not a group or department, to avoid ambiguity in responsibility.
