must_id: item:A.5.35:recommendations
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Recommendations stated (with priority and owner suggestion — actionable, not abstract)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State each recommendation clearly in the review report, describing a specific action to address the
  identified issue.
- Assign a named individual as the suggested owner for each recommendation, avoiding generic roles like
  "IT" or "the team".
- Indicate the priority of each recommendation using a defined scale, such as high, medium, or low, with
  justification.
- Date and sign the report to confirm when the recommendations were made and by whom.
