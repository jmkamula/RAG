must_id: item:A.5.35:executive_summary
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Executive summary section addressed to leadership (audit-defensible communication of overall
  posture, not just the detailed findings list)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Draft an executive summary section at the start of the review report that clearly addresses the organisation’s
  leadership by name or title.
- Summarise the overall information security posture in plain language, highlighting key strengths and
  major risks identified during the review.
- Reference the date of the review and the period covered, ensuring the summary reflects the current state
  at that point in time.
- Assign authorship of the executive summary to a named individual or independent reviewer, not a generic
  team or department.
- Attach evidence that the executive summary was formally shared with leadership, such as an email confirmation
  or meeting minutes with named recipients.
