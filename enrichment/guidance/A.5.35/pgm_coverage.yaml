must_id: item:A.5.35:pgm_coverage
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Coverage check — did the schedule actually run? all planned scope areas reviewed?
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the actual review dates for each scheduled independent review in a dated log maintained by
  the program coordinator.
- Cross-reference each completed review to the planned schedule, marking any missed or rescheduled scope
  areas with reasons.
- Name the reviewer for each scope area as a specific individual, not a group or department.
- Record a summary statement confirming that all planned scope areas were reviewed, signed and dated by
  the program owner.
- Attach evidence of any corrective actions taken for missed reviews, including approval from the program
  owner.
