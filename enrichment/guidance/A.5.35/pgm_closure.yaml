must_id: item:A.5.35:pgm_closure
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Findings-closure rate across the program (open / aged / closed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the total number of findings identified during each review cycle in a dated findings log maintained
  by the program coordinator.
- Document the closure status of each finding as open, aged (with days outstanding), or closed, including
  closure dates and responsible individuals.
- Calculate and update the findings-closure rate for the program at least quarterly, showing open, aged,
  and closed findings in a summary report.
- Name a specific individual responsible for tracking and reporting findings status—do not list a team
  or department as the owner.
- Retain evidence of management review and sign-off on the findings-closure summary for each reporting
  period.
