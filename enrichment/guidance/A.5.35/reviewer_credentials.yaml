must_id: item:A.5.35:reviewer_credentials
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: External auditor accreditation or internal reviewer qualifications stated (CISA, ISO 27001
  LA/LI, sector-specific credentials)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the full name and professional accreditation or qualification of each reviewer in the report,
  such as CISA or ISO 27001 Lead Auditor.
- Attach a copy of the reviewer’s relevant certification or provide a link to a verifiable credential
  directory.
- Record the date of the most recent certification renewal or qualification update for each reviewer.
- Name the reviewer as a specific individual, not a team, department, or external firm without listing
  the responsible person.
