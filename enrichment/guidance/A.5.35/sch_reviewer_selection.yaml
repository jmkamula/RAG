must_id: item:A.5.35:sch_reviewer_selection
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Reviewer selection mechanism (external rotation, internal independence criteria, audit-firm
  framework agreement) — drives the independence guarantee
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the process used to select independent reviewers, specifying whether external rotation, internal
  independence criteria, or an audit-firm agreement is applied.
- Name the reviewer for each scheduled review as a specific individual, not as a team or department.
- Record the date and outcome of each reviewer selection decision in the Independent Review Schedule Register.
- Attach supporting evidence, such as signed agreements or documented independence checks, to each entry
  in the register.
