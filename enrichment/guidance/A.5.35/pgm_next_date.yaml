must_id: item:A.5.35:pgm_next_date
control_ref: A.5.35
standard_id: ISO27001:2022
must_text: Next planned meta-review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned meta-review date in the Periodic Independent Review Program Meta-Review document.
- Record the date in a calendar or tracking system used for compliance activities, with a reference to
  the meta-review document.
- Name the person responsible for scheduling and conducting the next meta-review, using their full name
  and job title.
- Avoid leaving the next review date as "TBD" or blank, as this would be flagged by an auditor.
