must_id: item:A.8.21:reg_mechanisms
control_ref: A.8.21
standard_id: ISO27001:2022
must_text: Per-row security mechanisms in use (matches procedure's baseline for the class)
category: must
curation_status: draft
authored_by: llm-4.1
