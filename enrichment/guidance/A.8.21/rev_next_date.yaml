must_id: item:A.8.21:rev_next_date
control_ref: A.8.21
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date in the Network Services Program Review document, using a clear and
  specific calendar date.
- Record the date of the most recent review alongside the next planned review date for clear tracking
  of review intervals.
- Name the individual responsible for scheduling the next review, avoiding generic titles like "IT" or
  "the team".
- Retain a copy of the approved review schedule, showing both past and future review dates, in a location
  accessible to auditors.
