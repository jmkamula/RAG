must_id: item:Art.42:reg_scheme
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Per-row scheme + Art.43 body
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each certification scheme in a dedicated row, clearly naming the scheme and its scope.
- List the specific certification body for each scheme, including the full legal name as approved under
  Article 43.
- Document the date each certification was granted and its current status, such as active, expired, or
  withdrawn.
- Name the certification body as a specific legal entity, not a generic term like "external auditor" or
  "certification provider".
- Cross-reference each entry to supporting documentation, such as the certificate or accreditation letter,
  stored in your records.
