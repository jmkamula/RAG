must_id: item:Art.42:rev_reviewer
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + executive sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and the executive sponsor.
- Record the date each reviewer completed their review of the certification program, creating a dated
  entry for both the DPO and executive sponsor.
- Obtain a signature or written confirmation from both the DPO and executive sponsor to evidence their
  personal review and approval.
- Avoid listing generic titles or groups such as "the team" or "management" in place of named individuals
  for reviewer identity.
