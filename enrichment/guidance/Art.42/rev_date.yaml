must_id: item:Art.42:rev_date
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the certification program in a dated log or register entry.
- Document the planned review interval for the certification program in a policy or schedule, with version
  and approval details.
- Name the reviewer as a specific individual responsible for the certification program review, not a team
  or department.
- Cross-reference the review date against the planned interval to confirm the review occurred within the
  required timeframe.
- Retain a signed or approved record of the review decision, including any findings or actions, with the
  date clearly visible.
