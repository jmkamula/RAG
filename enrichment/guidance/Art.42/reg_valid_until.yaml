must_id: item:Art.42:reg_valid_until
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Per-row validity end date (max 3 years from issue)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the issue date and calculated validity end date for each certification entry in the register,
  ensuring the end date is no more than three years after issue.
- Cross-reference each certification's validity period with the original certificate or official documentation
  to confirm accuracy.
- Name the person responsible for entering and updating certification dates as a specific individual,
  not a team or department.
- Review the register quarterly and update or flag any certifications approaching or past their validity
  end date.
