must_id: item:Art.42:evidence_assembly
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Evidence assembly per scheme's criteria (audit-ready)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify the certification scheme and document its published evidence criteria, including version number
  and publication date, in your certification procedure file.
- List all required evidence items as specified by the scheme, referencing exact document names and locations
  within your organisation.
- Assign a named individual responsible for collecting and maintaining each evidence item, recording their
  full name and contact details.
- Record the date each evidence item was last reviewed or updated to match the scheme’s current criteria.
- Avoid using generic descriptions like "all required documents"—specify each evidence item explicitly
  to prevent auditor confusion.
