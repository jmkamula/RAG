must_id: item:Art.42:rev_business_case_recheck
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Business case recheck — certification still providing value (transfer enablement / customer
  requirement / market position)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific business reasons for maintaining the certification, referencing current customer
  requirements, market trends, or contractual obligations.
- Record a dated review of how the certification supports data transfer enablement or enhances your competitive
  market position.
- Name the reviewer as a specific individual responsible for assessing the ongoing value of the certification—not
  a team or department.
- Retain meeting minutes or a signed statement confirming the decision to continue, modify, or discontinue
  the certification based on the business case recheck.
- Cross-reference the review outcome with your risk register or strategic objectives to show alignment
  with organisational priorities.
