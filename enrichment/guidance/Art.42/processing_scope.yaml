must_id: item:Art.42:processing_scope
control_ref: Art.42
standard_id: GDPR:2016/679
must_text: Processing operations within certification scope clearly defined
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all processing operations included in the certification scope in a dated document, using clear
  and specific descriptions for each activity.
- Name the boundaries of the certification scope, explicitly stating what is included and excluded from
  the assessment.
- Assign a responsible individual for maintaining and updating the processing operations list, recording
  their name and contact details.
- Reference supporting records, such as data flow diagrams or process maps, that illustrate the defined
  processing operations.
- Avoid using vague or generic terms like "all data processing"—describe each operation in detail to prevent
  auditor confusion.
