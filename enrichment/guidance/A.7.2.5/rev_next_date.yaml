must_id: item:A.7.2.5:rev_next_date
control_ref: A.7.2.5
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for your Privacy Impact Assessment (PIA) program in your review documentation.
- Record the decision on the review date in meeting minutes or an official planning document, including
  who set the date.
- Name the responsible individual who will oversee the next review, avoiding generic titles like "the
  team" or "management".
- Retain the dated document or record where the next planned review date is clearly visible.
