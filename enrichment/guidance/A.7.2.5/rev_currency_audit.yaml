must_id: item:A.7.2.5:rev_currency_audit
control_ref: A.7.2.5
standard_id: ISO27701:2019
must_text: Currency audit — PIAs older than currency threshold reviewed for material change
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual responsible for tracking the age of Privacy Impact Assessments and scheduling
  required reviews.
- Document the defined currency threshold for PIAs in a dated policy or procedure, referencing the exact
  review interval in months or years.
- Record the review date, reviewer’s name, and findings for each PIA that exceeds the currency threshold,
  noting any material changes identified.
- Retain evidence of completed reviews, such as signed review forms or updated PIA documents, in a central,
  auditable location.
- Avoid listing “ongoing” or “as needed” as review intervals; specify a concrete timeframe to prevent
  auditor findings of inadequate review controls.
