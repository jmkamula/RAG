must_id: item:A.8.4:proc_secrets_rotation
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Secrets-rotation procedure where exposed (response within hours, not days)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a step-by-step procedure for rotating secrets immediately if exposure is detected, specifying
  a response timeframe measured in hours.
- Assign a named individual or role responsible for initiating and overseeing the secrets rotation process
  upon exposure.
- Record each secrets rotation event with the date, time, reason for rotation, and the person who performed
  the action.
- Name the owner of the procedure as a specific individual, not a team or department, to avoid ambiguity
  in accountability.
- Retain evidence of communication to affected parties or systems confirming that new secrets have been
  distributed and old ones revoked.
