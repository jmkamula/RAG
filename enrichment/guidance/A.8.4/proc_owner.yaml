must_id: item:A.8.4:proc_owner
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Named procedure owner (Engineering lead with InfoSec partner)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the procedure owner as a specific individual by full name and job title, such as "Jane Smith, Engineering
  Lead," in the procedure document.
- List the InfoSec partner by full name and role alongside the Engineering Lead in the procedure's ownership
  section.
- Record the date the ownership was last reviewed or updated directly in the procedure document.
- Avoid listing the owner as "Engineering Team," "IT," or any non-person entity; use only named individuals.
