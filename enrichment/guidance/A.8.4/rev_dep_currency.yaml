must_id: item:A.8.4:rev_dep_currency
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Dependency-allowlist currency check (no abandoned libraries; vulnerable versions retired)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the current list of all third-party libraries and dependencies used in your source code, including
  version numbers and sources, in a dated inventory.
- Assign a named individual responsible for maintaining and updating the dependency inventory, ensuring
  accountability for ongoing reviews.
- Record the results of a review that checks each dependency for active maintenance and known vulnerabilities,
  including review date and reviewer’s name.
- Retire or replace any dependency identified as abandoned or vulnerable, and log the decision and actions
  taken with specific dates and responsible persons.
- Name each dependency explicitly in the review records—avoid generic entries like "various libraries"
  or "all dependencies".
