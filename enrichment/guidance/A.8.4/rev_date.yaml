must_id: item:A.8.4:rev_date
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Review date within the planned interval (≤180 days)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of each source code access review in a log or register, showing that the review occurred
  within the last 180 days.
- Name the reviewer as a specific individual responsible for conducting the periodic source code access
  review.
- Document the planned review interval in a formal schedule or procedure, specifying that reviews must
  occur at least every 180 days.
- Attach evidence of the most recent review, such as a signed checklist or meeting minutes, to demonstrate
  the review took place as scheduled.
- Avoid listing only a generic team or department as the reviewer; always identify a named person for
  each review instance.
