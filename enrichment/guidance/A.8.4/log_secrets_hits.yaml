must_id: item:A.8.4:log_secrets_hits
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Secrets-scanner findings logged with disposition (false-positive / true-positive remediated)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each secrets-scanner finding in the source code access monitoring log, including the date, scanner
  used, and specific file or repository identified.
- Document the disposition for every finding as either "false-positive" or "true-positive remediated,"
  with a brief explanation for each decision.
- Name the individual who reviewed and classified each finding, ensuring a specific person is listed rather
  than a team or generic role.
- Attach evidence of remediation for true-positive findings, such as a commit reference or ticket number
  showing the secret was removed or rotated.
- Retain a dated record of periodic reviews of the log to confirm all findings have been addressed and
  dispositions are up to date.
