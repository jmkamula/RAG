must_id: item:A.8.4:bl_secrets_scanning
control_ref: A.8.4
standard_id: ISO27001:2022
must_text: Secrets scanning active on commit + push (pre-commit hook or platform scanner)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the secrets scanning tool or platform used, including version and configuration, in a dated
  technical security register.
- Record the activation date of secrets scanning on both commit and push events, referencing supporting
  screenshots or logs.
- Name the person responsible for maintaining and updating the secrets scanning configuration as a specific
  individual, not a team or department.
- Retain sample scan results or alert logs showing detection of test secrets during both commit and push,
  with timestamps.
- Review and update the baseline annually, capturing the review date and the reviewer’s name in the change
  log.
