must_id: item:A.8.6:rev_next_date
control_ref: A.8.6
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the capacity program in the official review schedule document.
- Record the date in a version-controlled document that is accessible to relevant stakeholders.
- Name the individual responsible for scheduling and updating the next review date, rather than listing
  a team or department.
- Retain evidence of management approval for the scheduled review date, such as a signed meeting minute
  or approval email.
