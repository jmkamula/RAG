must_id: item:A.8.6:proc_demand_intake
control_ref: A.8.6
standard_id: ISO27001:2022
must_text: Demand intake from business stakeholders (new product launches, M&A, seasonal events)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner responsible for collecting and reviewing business demand forecasts,
  avoiding generic titles like "IT team" or "Operations".
- Document each demand intake request from business stakeholders, including the requester’s name, date
  submitted, and a brief description of the event or initiative.
- Record the method and frequency for gathering demand information, such as quarterly meetings or intake
  forms, in the capacity management procedure.
- Retain evidence of communication with stakeholders, such as meeting minutes or email confirmations,
  showing that demand inputs were discussed and acknowledged.
