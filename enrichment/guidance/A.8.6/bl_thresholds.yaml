must_id: item:A.8.6:bl_thresholds
control_ref: A.8.6
standard_id: ISO27001:2022
must_text: Alert thresholds defined (warning / critical) per resource class
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each monitored resource class and record the corresponding warning and critical alert thresholds
  in a dated capacity monitoring baseline document.
- Name the person responsible for setting and reviewing alert thresholds for each resource class, ensuring
  a specific individual is identified.
- Document the rationale for each threshold value, referencing relevant business, technical, or regulatory
  requirements that informed the decision.
- Approve the baseline document with a dated signature from a designated authority, confirming thresholds
  are current and authorized.
- Avoid using generic or default thresholds without justification; tailor each threshold to your environment
  and document the reasoning.
