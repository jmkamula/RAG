must_id: item:A.7.9:reg_off_since
control_ref: A.7.9
standard_id: ISO27001:2022
must_text: Per-row off-premises date (drives stale-loaner detection)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date each asset leaves the premises in a dedicated column of the off-premises asset register.
- Name the person responsible for updating the off-premises date for each asset, ensuring individual accountability.
- Cross-reference each off-premises entry with a supporting document, such as a loan form or transfer
  record, showing the same date.
- Avoid leaving the off-premises date field blank or using placeholders like "N/A" or "TBD" for any asset
  entry.
