must_id: item:A.8.28:rev_next_date
control_ref: A.8.28
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Secure Coding Program in the official review schedule document.
- Record the date the review schedule was last updated, along with the name of the person who made the
  update.
- Name the individual responsible for conducting the next review, avoiding generic titles like "the team"
  or "IT department".
- Retain a copy of the most recent review meeting minutes that reference the scheduled next review date.
