must_id: item:A.8.28:secrets_in_code
control_ref: A.8.28
standard_id: ISO27001:2022
must_text: Secrets management — no secrets in code; vaulting + pre-commit scanning required
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the approved process for storing secrets in a secure vault, including the vault technology
  and access controls, in the Secure Coding Procedure.
- Name the individual responsible for maintaining the secrets management process, avoiding generic titles
  like "the team" or "developers".
- Record the configuration and usage of automated pre-commit scanning tools that detect secrets in code,
  including tool names and activation dates.
- Retain logs or reports from pre-commit scanning runs that show detection and blocking of secrets before
  code is committed to repositories.
- State in the procedure that secrets must never be hardcoded in source code, referencing specific examples
  or past incidents if available.
