must_id: item:A.7.2.2:rev_reviewer
control_ref: A.7.2.2
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and the designated
  legal counsel by full name and job title.
- Record the date each reviewer completed their assessment on the Lawful Basis Program Review document.
- Obtain signatures or written confirmation from both the Data Protection Officer and legal counsel to
  evidence their review and approval.
- Attach any correspondence or meeting notes that show both reviewers participated in the review process.
