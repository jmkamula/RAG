must_id: item:A.7.2.2:rev_next_date
control_ref: A.7.2.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Lawful Basis Program in a dedicated section of the review
  document.
- Record the date in a way that is specific and unambiguous, using the full date format (day, month, year).
- Name the person responsible for scheduling and carrying out the next review, listing their full name
  and job title.
- Avoid leaving the review date field blank or marked "TBD," as auditors will flag missing or vague dates.
