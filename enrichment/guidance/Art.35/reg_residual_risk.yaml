must_id: item:Art.35:reg_residual_risk
control_ref: Art.35
standard_id: GDPR:2016/679
must_text: Per-row residual-risk level after mitigations
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the residual risk level for each DPIA entry after all mitigation measures have been applied,
  using clear and consistent risk categories.
- Document the date when the residual risk assessment was completed for each DPIA row.
- Name the individual who approved the final residual risk rating for each processing activity.
- Avoid leaving the residual risk field blank or marked as "TBD"—complete every row before finalizing
  the register.
