must_id: item:Art.35:reg_processing_activity
control_ref: Art.35
standard_id: GDPR:2016/679
must_text: Per-row processing activity (Art.30 RoPA cross-reference)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each DPIA entry to the corresponding processing activity in your Article 30 Record of
  Processing Activities, using a unique identifier or clear activity name.
- Document the date each DPIA was completed and the processing activity it covers, ensuring both are visible
  in the DPIA register.
- Name the processing activity owner as a specific individual, not a team or department, for each DPIA
  register entry.
- Record any updates or reviews of the DPIA, including the date and person responsible, alongside the
  original register entry.
