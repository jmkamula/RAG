must_id: item:Art.35:scope_org_criteria
control_ref: Art.35
standard_id: GDPR:2016/679
must_text: 'Org''s own ''likely high risk'' criteria (typically EDPB Guidelines 248 nine-criteria approach:
  scoring with ≥2 of 9 = DPIA required)'
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the specific criteria your organisation uses to define "likely high risk," referencing the EDPB
  nine-criteria approach in a dated document.
- Document the scoring method that triggers a DPIA, clearly stating that meeting two or more criteria
  requires a DPIA.
- Assign responsibility for applying and updating these criteria to a named individual, not a team or
  department.
- Record the date and version of your criteria and scoring method in your DPIA policy or risk assessment
  procedure.
