must_id: item:4.4:processes
control_ref: '4.4'
standard_id: ISO27001:2022
must_text: ISMS processes enumerated (planning, operation, evaluation, improvement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each ISMS process by name in the manual, covering planning, operation, evaluation, and improvement,
  with a brief description for each.
- Assign a specific individual as the owner for each ISMS process, avoiding generic roles like "the team"
  or "IT department".
- Reference supporting documents or procedures for each process, such as risk assessment or internal audit,
  by title and version date.
- Date and approve the ISMS manual or charter with a named approver to show when and by whom it was last
  authorized.
