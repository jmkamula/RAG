must_id: item:4.4:references_iso
control_ref: '4.4'
standard_id: ISO27001:2022
must_text: References ISO 27001:2022 clause structure (auditor navigation)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each section of your ISMS Manual to the corresponding ISO 27001:2022 clause number in
  the table of contents.
- Document the full ISO 27001:2022 clause titles alongside your internal section headings for clear mapping.
- State any clauses not applicable to your organisation and provide a brief justification in the manual.
- Name the person responsible for maintaining the clause mapping, listing them as a specific individual
  rather than a team or department.
- Retain a dated version history showing when clause references were last reviewed or updated.
