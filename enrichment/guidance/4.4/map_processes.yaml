must_id: item:4.4:map_processes
control_ref: '4.4'
standard_id: ISO27001:2022
must_text: All ISMS processes from the manual represented on the map
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all ISMS processes described in the manual, using their exact names and references, in a master
  table.
- Map each process from the manual to a corresponding element on the interaction map, using clear labels
  or unique identifiers.
- Cross-reference the map with the manual’s table of contents to confirm no process is missing or ambiguously
  represented.
- Name the owner of the map as a specific individual, not a generic role or team, and record their approval
  date.
- Attach a version number and revision date to the map to avoid using undated or outdated versions.
