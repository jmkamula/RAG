must_id: item:4.4:rev_next_date
control_ref: '4.4'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the ISMS Manual Program clearly in the document, using a full
  date format (day, month, year).
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a team or department.
- Update the review date field whenever the ISMS Manual Program is revised or reviewed, and retain a dated
  change log entry.
- Avoid leaving the next review date blank or using vague terms like "annually" or "TBD"; specify an exact
  future date.
