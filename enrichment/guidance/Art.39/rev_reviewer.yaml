must_id: item:Art.39:rev_reviewer
control_ref: Art.39
standard_id: GDPR:2016/679
must_text: Reviewer identity (executive sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the executive sponsor responsible for reviewing the DPO Tasks Program as a specific individual,
  not a group or department.
- Record the executive sponsor’s full name, job title, and contact details in the DPO Tasks Program Review
  document.
- Document the date the executive sponsor reviewed and approved the DPO Tasks Program, capturing their
  signature or written confirmation.
- Retain a copy of the signed or acknowledged review as part of your compliance records.
