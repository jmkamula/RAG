must_id: item:Art.39:rev_date
control_ref: Art.39
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Data Protection Officer (DPO) tasks program in a dated log
  or review report.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Document the planned review interval in writing, referencing the schedule approved by management or
  the DPO.
- Cross-reference the actual review date with the planned interval to confirm compliance with the periodic
  requirement.
- Retain evidence of the completed review, such as meeting minutes or a signed review summary, in an accessible
  location.
