must_id: item:B.8.2.2:rev_next_date
control_ref: B.8.2.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Purpose Adherence Program in the official review schedule
  document.
- Record the date in a version-controlled document that is accessible to all relevant stakeholders.
- Name the responsible individual who will oversee the next review, listing their full name and job title.
- Avoid leaving the review date blank or using vague terms like "as needed" or "TBD" in the schedule.
