must_id: item:B.8.2.2:reg_customer_audit_history
control_ref: B.8.2.2
standard_id: ISO27701:2019
must_text: Customer audit history — recent customer audits + findings
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date, scope, and customer name for each recent customer audit in the Customer Purpose Adherence
  Register.
- Document all findings or issues identified during each audit, including references to supporting evidence
  or reports.
- Assign a named individual responsible for tracking and updating the status of each audit finding.
- Attach or cross-reference copies of customer audit reports and correspondence to each entry in the register.
- Name the customer specifically for each audit — do not use generic labels like "various customers" or
  "multiple clients".
