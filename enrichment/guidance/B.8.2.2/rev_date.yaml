must_id: item:B.8.2.2:rev_date
control_ref: B.8.2.2
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Purpose Adherence Program in a dated log or register entry.
- Name the individual responsible for scheduling and conducting the review, ensuring a specific person
  is listed rather than a group or department.
- Cross-reference the documented review date against the planned review interval stated in your program
  documentation to confirm it falls within the required timeframe.
- Retain evidence of the completed review, such as a signed meeting record or review summary, showing
  the actual review took place.
