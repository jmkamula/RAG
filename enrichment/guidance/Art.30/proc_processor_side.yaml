must_id: item:Art.30:proc_processor_side
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Processor-side update path stated if org also acts as processor (Art.30.2 records)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the RoPA Maintenance Procedure how updates are made when your organisation acts as a processor,
  referencing Article 30.2 requirements.
- Name a specific individual responsible for processor-side RoPA updates, avoiding generic titles like
  "the team" or "compliance department".
- Document the process for receiving, verifying, and recording instructions from controllers regarding
  updates to processor records.
- Record the date when the processor-side update path was last reviewed and approved by a named senior
  manager.
