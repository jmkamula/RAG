must_id: item:Art.30:proc_triggers
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Update triggers enumerated (new system, new purpose, new processor, new third-country transfer,
  retention change, DPIA outcome)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each update trigger in the procedure, including new system, new purpose, new processor, new third-country
  transfer, retention change, and DPIA outcome.
- Name a specific person responsible for monitoring these triggers, not a team or department.
- Record the date the procedure was last reviewed and updated to reflect all required triggers.
- Cross-reference the procedure with your current Record of Processing Activities to confirm alignment
  with enumerated triggers.
