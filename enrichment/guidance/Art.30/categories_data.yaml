must_id: item:Art.30:categories_data
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Categories of personal data per activity
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each processing activity in your RoPA, linking it to a unique identifier and a clear description
  of the activity.
- Specify the categories of personal data collected or processed for each activity, using precise terms
  such as "employee contact details" or "customer payment information".
- Name the owner responsible for maintaining each activity's entry as a specific individual, not a team
  or department.
- Record the date each RoPA entry was last reviewed or updated to show ongoing accuracy.
