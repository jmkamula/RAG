must_id: item:Art.30:rev_reviewer
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Reviewer identity and role (DPO, privacy lead, or delegated equivalent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, including their full name and job title, on each RoPA periodic
  review record.
- State the reviewer’s role explicitly as Data Protection Officer, privacy lead, or delegated equivalent
  on the review documentation.
- Record the date the review was completed alongside the reviewer’s identity and role in the review log.
- Avoid listing the reviewer as a group or department; always specify a single accountable person.
