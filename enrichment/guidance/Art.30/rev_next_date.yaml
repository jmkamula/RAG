must_id: item:Art.30:rev_next_date
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Record of Processing Activities in a clearly labeled field
  within the review record.
- Record the name of the person responsible for scheduling the next review, ensuring a specific individual
  is listed rather than a team or department.
- Document the date the review record was last updated to show when the next review date was set.
- Attach evidence of management approval for the scheduled review date, such as a signed or emailed confirmation.
