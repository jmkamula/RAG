must_id: item:Art.30:proc_escalation
control_ref: Art.30
standard_id: GDPR:2016/679
must_text: Escalation path if maintainer is unavailable or a trigger is missed
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific backup individual who will take over RoPA maintenance duties if the primary maintainer
  is unavailable.
- Document a clear, step-by-step escalation process to follow if a scheduled RoPA update or review is
  missed.
- Record the date and method of communication used to inform all relevant staff about the escalation path.
- State the criteria that trigger escalation, such as a missed deadline or unresponsive maintainer, in
  the written procedure.
- Avoid listing a group or department as the backup; assign responsibility to a named person with contact
  details.
