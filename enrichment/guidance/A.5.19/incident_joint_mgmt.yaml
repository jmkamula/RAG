must_id: item:A.5.19:incident_joint_mgmt
control_ref: A.5.19
standard_id: ISO27001:2022
must_text: Incident and contingency handling jointly with the supplier
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a written procedure describing how your organisation and the supplier will jointly handle security
  incidents and contingency situations, including clear escalation steps.
- Name a specific individual in your organisation responsible for coordinating incident and contingency
  actions with the supplier, not just a generic team or department.
- Record evidence of joint incident response exercises or tabletop tests with the supplier, including
  dates, participants, and outcomes.
- Retain signed acknowledgement from the supplier confirming their agreement to the joint incident and
  contingency handling procedure.
