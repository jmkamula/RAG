must_id: item:A.5.19:off_authoriser
control_ref: A.5.19
standard_id: ISO27001:2022
must_text: Authoriser of the offboarding decision
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual who authorised the supplier offboarding decision in the offboarding record, using
  their full name and job title.
- Record the date the authorisation was given, ensuring it matches the documented offboarding decision.
- Obtain a signature or written confirmation from the authoriser, either digitally or on a physical document.
- Avoid listing the authoriser as a group or department; specify a single accountable person for clear
  traceability.
