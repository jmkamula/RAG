must_id: item:A.8.24:rev_date
control_ref: A.8.24
standard_id: ISO27001:2022
must_text: Review date within the planned interval (≤180 days)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the date of each cryptography program review in a central log, ensuring the interval between
  reviews does not exceed 180 days.
- Name the reviewer as a specific individual responsible for conducting and documenting the cryptography
  program review.
- Attach the signed review report or meeting minutes that confirm the review took place on the recorded
  date.
- Cross-reference the review log entry with the planned review schedule to show the review occurred within
  the required 180-day interval.
- Avoid using vague review dates such as "quarterly" or "biannually"—always specify the exact review date
  in the documentation.
