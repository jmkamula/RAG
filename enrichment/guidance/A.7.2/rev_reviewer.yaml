must_id: item:A.7.2:rev_reviewer
control_ref: A.7.2
standard_id: ISO27001:2022
must_text: Reviewer identity (Facilities + InfoSec)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Facilities and Information Security reviewers as specific individuals in the review documentation,
  not as departments or generic teams.
- Record the date each reviewer completed their assessment on the periodic entry program review form.
- Obtain a signature or written confirmation from both reviewers to verify their participation in the
  review process.
- Retain the completed review document in a central location where it can be retrieved during an audit.
