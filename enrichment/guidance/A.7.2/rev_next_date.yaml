must_id: item:A.7.2:rev_next_date
control_ref: A.7.2
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Periodic Entry Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the individual responsible for scheduling and leading the next review within the
  same document.
- Confirm the review documentation is dated and version-controlled to show when the next review date was
  last set.
- Avoid leaving the next review date blank or marked as "TBD"—always enter a concrete date to meet planning
  requirements.
