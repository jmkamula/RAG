must_id: item:A.7.2:rev_date
control_ref: A.7.2
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the entry program in a dated document, such as meeting minutes
  or a formal review log.
- State the planned review interval for the entry program in a documented schedule or policy, specifying
  the frequency in months or years.
- Cross-reference the actual review date against the planned interval to confirm the review occurred within
  the required timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
