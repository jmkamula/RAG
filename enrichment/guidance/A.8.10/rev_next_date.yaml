must_id: item:A.8.10:rev_next_date
control_ref: A.8.10
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Periodic Deletion Program in a dated document or meeting
  record.
- Name the individual responsible for scheduling and leading the next review, specifying their full name
  and role.
- Record the review date in a central compliance calendar or tracking tool accessible to relevant stakeholders.
- Avoid leaving the next review date as "TBD" or blank—auditors will flag missing or non-specific dates.
