must_id: item:A.7.2.1:rev_date
control_ref: A.7.2.1
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Purpose Documentation Program in a dated log or review register.
- State the planned review interval in a documented schedule or policy, specifying the frequency in months
  or years.
- Confirm the next scheduled review date is within the planned interval by cross-referencing the last
  review date and the documented schedule.
- Name the reviewer as a specific individual, not a group or department, in the review record.
