must_id: item:A.8.11:reversibility_rules
control_ref: A.8.11
standard_id: ISO27001:2022
must_text: Reversibility rules — when re-identification is permitted (none in non-prod by default; documented
  exceptions)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure that re-identification of masked data is never permitted in non-production environments,
  except for documented exceptions.
- Document each approved exception with a named requester, business justification, and explicit approval
  from a designated data owner.
- Name the data owner as a specific individual responsible for granting or denying re-identification requests—do
  not use a group or department.
- Record the date, scope, and duration of every re-identification exception in a central log accessible
  for audit review.
