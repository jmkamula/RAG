must_id: item:Art.33:rev_exercise_link
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: A.5.24 exercise integration — Art.33 procedure exercised within the year (table-top or live)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Schedule and conduct a table-top or live exercise of the Article 33 breach notification procedure within
  the last 12 months, recording the date and participants.
- Document the scenario, steps taken, and outcomes of the exercise in a written report signed by the exercise
  lead.
- Name the responsible individual who led the exercise — do not list a group or department as the owner.
- Retain evidence of any lessons learned or changes made to the breach notification procedure as a result
  of the exercise.
