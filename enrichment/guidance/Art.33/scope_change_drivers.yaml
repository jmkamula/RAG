must_id: item:Art.33:scope_change_drivers
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Trigger list (new SA jurisdiction added, scope change affecting main establishment)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all events that could trigger Article 33 notification, such as adding a new supervisory authority
  jurisdiction or changing the scope of processing.
- Document each trigger event with a clear description and the date it was identified in a version-controlled
  register.
- Name a specific individual responsible for monitoring and updating the trigger list, avoiding generic
  roles like "the team" or "compliance department."
- Review and update the trigger list at least annually, recording the review date and the reviewer’s name.
