must_id: item:Art.33:measures
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Measures taken or proposed to address the breach
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Describe each corrective action taken or planned to contain and mitigate the breach, listing them in
  the notification with clear, dated entries.
- Name the person responsible for implementing each measure, using their full name and role, not just
  a team or department.
- Attach supporting evidence, such as incident logs or screenshots, showing that the measures have been
  enacted or are in progress.
- State any follow-up activities or monitoring planned to prevent recurrence, including timelines and
  responsible individuals.
