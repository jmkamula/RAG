must_id: item:Art.33:rev_next_date
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Breach Notification Program in the program document or review
  log.
- Record the name of the individual responsible for scheduling the next review alongside the planned date.
- Confirm the review date is specific and not listed as "TBD" or left blank.
- Retain a dated copy of the document or log showing when the next review date was last updated.
