must_id: item:Art.33:proc_delay_handling
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Delay handling — if past 72h, reason explanation in notification (Art.33.1 last sentence)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date and time the personal data breach was discovered in the breach notification log.
- Document the date and time the supervisory authority was notified about the breach in the same log.
- State the specific reason for any notification delay beyond 72 hours in the breach notification report.
- Attach supporting evidence, such as internal emails or incident investigation notes, that justify the
  stated delay reason.
- Name the person responsible for approving the delay explanation, ensuring this is a specific individual
  and not a generic role or team.
