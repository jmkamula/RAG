must_id: item:Art.33:nature
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Nature of the breach including categories and approximate number of data subjects
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Describe the nature of the breach in clear, specific terms within the notification, avoiding generic
  or boilerplate language.
- List the categories of data subjects affected, such as customers, employees, or vendors, with enough
  detail to distinguish each group.
- Estimate and record the approximate number of data subjects impacted, providing a numeric value or justified
  range.
- Attach supporting evidence, such as incident logs or investigation summaries, that substantiate the
  stated categories and numbers.
