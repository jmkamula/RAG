must_id: item:Art.33:proc_intake
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Internal intake — how an operational security event reaches the breach-notification team (links
  to A.5.25/A.5.26 incident triage)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Describe the exact process staff must follow to report a suspected security event, including the communication
  channel and required information.
- Name the breach-notification team or lead as a specific individual, not a generic group or department.
- Cross-reference the intake step to your incident triage procedures under A.5.25 and A.5.26, showing
  how events are escalated.
- Record the date and version of the procedure document to confirm it is current and in use.
