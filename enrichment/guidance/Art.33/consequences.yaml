must_id: item:Art.33:consequences
control_ref: Art.33
standard_id: GDPR:2016/679
must_text: Likely consequences of the breach
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Describe the likely consequences of the personal data breach in the notification form, using clear,
  specific examples relevant to the affected data subjects.
- Reference supporting documentation, such as risk assessments or impact analyses, to show how you determined
  the likely consequences.
- Name the individual who performed the consequence assessment, and include the date it was completed
  in the notification record.
- Avoid using generic statements like "no risk" or "unknown impact" without documented justification,
  as auditors will flag unsupported conclusions.
