must_id: item:B.8.5.3:proc_normal_disclosures
control_ref: B.8.5.3
standard_id: ISO27701:2019
must_text: Normal-course disclosures recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each disclosure of personal data to third parties in a central log, including date, recipient,
  purpose, and data categories shared.
- Assign a named individual responsible for maintaining and updating the disclosure log, ensuring their
  name and contact details are listed.
- Record disclosures as soon as they occur, not retrospectively, to avoid missing or inaccurate entries.
- Retain evidence of each disclosure, such as email confirmations or signed agreements, attached or referenced
  in the disclosure log.
- Name the owner as a specific individual — do not list a team or department as responsible for the disclosure
  recording procedure.
