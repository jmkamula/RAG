must_id: item:B.8.5.3:proc_authority_source
control_ref: B.8.5.3
standard_id: ISO27701:2019
must_text: Source of authority captured per disclosure
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific legal, contractual, or regulatory basis authorizing each disclosure in the Processor
  Disclosure Recording Procedure.
- Record the name and role of the individual who confirmed the source of authority for each disclosure
  entry.
- State the date on which the source of authority was verified for each disclosure, ensuring it is clearly
  visible in the record.
- Name the source of authority in detail—avoid generic statements like "as required" or "per agreement"
  without referencing the exact clause or law.
