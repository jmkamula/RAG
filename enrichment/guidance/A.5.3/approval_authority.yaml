must_id: item:A.5.3:approval_authority
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Statement of the signatory's authority to approve (delegation chain if not CEO)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individual who approved the segregation matrix, specifying their full name and job title on
  the approval document.
- State the signatory’s authority to approve by referencing the relevant delegation document or company
  policy in the approval record.
- Attach or cross-reference the delegation of authority chain if the signatory is not the CEO, showing
  how approval rights were assigned.
- Record the date of approval and obtain a physical or electronic signature from the authorized individual
  on the segregation matrix document.
- Avoid listing a group or department as the approver; always identify a single accountable person as
  the signatory.
