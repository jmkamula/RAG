must_id: item:A.5.3:comm_channel
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Channel used (intranet publication, role-holder briefing, manager cascade)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact communication channel used to share the segregation matrix, such as intranet post,
  direct briefing, or manager cascade, in a dated log.
- Name the person responsible for initiating the communication, ensuring a specific individual is listed
  rather than a group or department.
- Document the date and time when the segregation matrix was communicated to relevant staff, referencing
  supporting evidence like email or meeting minutes.
- Retain a copy or screenshot of the actual communication as proof of the channel and content shared.
