must_id: item:A.5.3:review_next_date
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for segregation of duties in a documented schedule or review log
  entry.
- Record the name of the person responsible for conducting the next review alongside the planned date.
- Confirm the review schedule is approved and dated by a manager or control owner.
- Name the next review date as a specific calendar date, not a vague period like "quarterly" or "next
  year".
