must_id: item:A.5.3:review_date
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent segregation of duties review date in a register or tracking log, showing it falls
  within the planned review interval.
- Name the reviewer as a specific individual responsible for conducting the segregation of duties review,
  not a generic team or department.
- Document the planned review interval for segregation of duties in a policy or schedule, with version
  and approval date visible.
- Retain a copy of the completed review report or checklist, signed and dated by the reviewer.
