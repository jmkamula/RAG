must_id: item:A.5.3:coverage_scope
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Scope of coverage stated (functional areas, systems, processes covered by the matrix)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the specific functional areas, systems, and processes included in the Segregation of Duties Matrix
  in a clearly labeled section.
- Document the date the scope was last reviewed and updated, referencing the responsible person for the
  review.
- Name the owner of the matrix as a specific individual, not a generic role or team.
- Cross-reference the matrix scope to supporting documentation or diagrams that define the boundaries
  of each area, system, or process.
