must_id: item:A.5.3:owner
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Named owner of the matrix accountable for its maintenance
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Segregation of Duties Matrix, avoiding generic titles
  like "IT" or "the team".
- Record the owner's full name and job title directly on the first page of the matrix document.
- Document the date when ownership was last reviewed or reassigned within the matrix or in a change log.
- Retain evidence of management approval of the named owner, such as a signed or emailed confirmation.
