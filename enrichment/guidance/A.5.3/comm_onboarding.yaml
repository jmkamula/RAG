must_id: item:A.5.3:comm_onboarding
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Communication built into onboarding for new role-holders in affected positions
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the onboarding process to include a step where new role-holders receive and acknowledge the
  segregation matrix communication.
- Record the date and name of each new role-holder who receives the segregation matrix during onboarding
  in a central log.
- Retain a signed or digitally acknowledged record from each new role-holder confirming receipt and understanding
  of the segregation matrix.
- Name the individual responsible for delivering the segregation matrix communication, ensuring this is
  a specific person rather than a generic team or department.
