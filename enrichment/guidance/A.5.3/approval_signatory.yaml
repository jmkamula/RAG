must_id: item:A.5.3:approval_signatory
control_ref: A.5.3
standard_id: ISO27001:2022
must_text: Signatory at top-management level (CEO, board chair, or delegated equivalent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the approving individual as the CEO, board chair, or a specifically delegated equivalent—avoid
  using job titles like "management" or "leadership team".
- Obtain a dated signature from the named top-management individual on the segregation matrix approval
  document.
- Retain the delegation letter or record if approval authority is assigned to someone other than the CEO
  or board chair.
- Record the version number and approval date directly on the segregation matrix for clear reference.
