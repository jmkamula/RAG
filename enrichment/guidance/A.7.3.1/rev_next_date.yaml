must_id: item:A.7.3.1:rev_next_date
control_ref: A.7.3.1
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Obligations Program in a clearly visible section of the review
  document.
- Record the date the current review was completed, alongside the next planned review date, in the same
  document.
- Name the individual responsible for scheduling and conducting the next review, using their full name
  and job title.
- Avoid leaving the next review date blank or listing it as "TBD"—enter a specific calendar date.
