must_id: item:A.7.3.1:rev_reviewer
control_ref: A.7.3.1
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Legal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, explicitly identifying both the
  Data Protection Officer and a Legal representative.
- Record the date each reviewer completed their review in the obligations program review log.
- Obtain a signature or written approval from both the Data Protection Officer and the Legal representative
  on the final review document.
- Avoid listing generic roles or teams as reviewers; specify named individuals to clearly demonstrate
  accountability.
