must_id: item:A.5.20:dev_reassessment
control_ref: A.5.20
standard_id: ISO27001:2022
must_text: Trigger for reassessment when supplier or risk circumstances change
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the Supplier Agreement Deviation Register the specific triggers that require reassessment,
  such as supplier ownership changes or new risk findings.
- Record the date and details of each reassessment trigger event in the register, linking to supporting
  evidence like incident reports or supplier notifications.
- Assign a named individual responsible for monitoring supplier and risk changes, avoiding generic entries
  like "procurement team" or "management".
- Document each reassessment decision with the date, outcome, and the name of the person who approved
  the action taken.
- Cross-reference each reassessment entry to the relevant supplier agreement or risk assessment document
  to show clear linkage.
