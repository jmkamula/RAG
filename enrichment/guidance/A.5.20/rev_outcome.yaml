must_id: item:A.5.20:rev_outcome
control_ref: A.5.20
standard_id: ISO27001:2022
must_text: Outcome (no change / amended; version increment if amended)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to conduct the periodic review of the supplier agreement template and record
  their name in the review log.
- Document the review date, outcome (no change or amended), and any version increment in a tracked change
  log or version history table.
- State the rationale for any amendments made, referencing relevant changes in requirements or risks,
  in the review documentation.
- Avoid using undated or generic review entries—each review must specify the date, reviewer, and clear
  outcome.
