must_id: item:A.5.20:legal_compliance
control_ref: A.5.20
standard_id: ISO27001:2022
must_text: Legal, statutory, regulatory, contractual obligations (data protection, IP, copyright)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all relevant legal, statutory, regulatory, and contractual obligations that apply to supplier relationships
  in a dedicated section of the template.
- Reference specific data protection, intellectual property, and copyright requirements by name and applicable
  law or regulation within the agreement template.
- Assign a named individual responsible for updating the template when relevant laws or contractual obligations
  change.
- Specify obligations using clear, supplier-specific language — avoid generic or boilerplate clauses that
  could apply to any organisation.
- Record the date and version number on each template update to show when legal requirements were last
  reviewed.
