must_id: item:A.5.20:dev_expiry
control_ref: A.5.20
standard_id: ISO27001:2022
must_text: Expiry / re-papering target date for each deviation (so deviations age out rather than persist
  indefinitely)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a clear expiry or re-papering target date for each supplier agreement deviation entry in the
  register.
- Name the responsible individual for tracking and actioning each deviation’s expiry or re-papering, not
  just a team or department.
- Document the date each deviation was last reviewed to confirm ongoing relevance and update the register
  accordingly.
- Attach supporting evidence, such as approval emails or meeting minutes, showing agreement to the target
  date for each deviation.
