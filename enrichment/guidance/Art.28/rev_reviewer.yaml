must_id: item:Art.28:rev_reviewer
control_ref: Art.28
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + procurement / vendor management lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual by full name and job title, clearly identifying both the
  Data Protection Officer and the procurement or vendor management lead.
- Record the date when the Processor Program Review was completed and reviewed by each required individual.
- Obtain a signature or written confirmation from both the Data Protection Officer and the procurement
  or vendor management lead on the review document.
- Avoid listing a group, team, or generic role as the reviewer; always specify named persons responsible
  for the review.
