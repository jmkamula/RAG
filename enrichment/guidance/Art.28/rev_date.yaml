must_id: item:Art.28:rev_date
control_ref: Art.28
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your processor program in a dated log or register entry.
- Confirm the recorded review date falls within the interval specified in your documented review schedule.
- Name the reviewer as a specific individual, not a team or department, in the review record.
- Retain evidence of the completed review, such as a signed summary or meeting minutes, with the review
  date clearly visible.
