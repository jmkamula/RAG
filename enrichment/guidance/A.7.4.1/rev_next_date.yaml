must_id: item:A.7.4.1:rev_next_date
control_ref: A.7.4.1
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Collection Limitation Program in a clearly visible section
  of the review document.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a team or department.
- Document the date this review schedule was last updated to show ongoing attention to planning.
- Attach evidence of approval for the stated review date, such as a signed or emailed confirmation from
  the program owner.
