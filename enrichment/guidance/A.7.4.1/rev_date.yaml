must_id: item:A.7.4.1:rev_date
control_ref: A.7.4.1
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Collection Limitation Program in a dated log or meeting minutes.
- Name the reviewer as a specific individual responsible for the program review, not a group or department.
- Document the planned review interval in a formal schedule or policy, showing the intended frequency.
- Cross-reference the actual review date against the planned interval to confirm it falls within the required
  timeframe.
- Retain evidence of the completed review, such as a signed summary report or updated program documentation.
