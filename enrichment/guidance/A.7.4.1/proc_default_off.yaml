must_id: item:A.7.4.1:proc_default_off
control_ref: A.7.4.1
standard_id: ISO27701:2019
must_text: Privacy-by-default — optional collections disabled by default; enabled only by explicit subject
  choice
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the system settings showing all optional data collection features set to "disabled" by default,
  including screenshots with visible timestamps.
- Name the individual responsible for configuring and maintaining default data collection settings, listing
  their full name and current job title.
- Record user consent logs that show explicit enabling of optional data collection by individual data
  subjects, including date and method of consent.
- State in the procedure that optional collections cannot be enabled through pre-ticked boxes or implied
  consent, and provide a dated copy of this procedure.
- Avoid describing the default setting as "usually off" or "off by policy" without technical evidence;
  provide system configuration records as proof.
