must_id: item:5.1:rev_next_date
control_ref: '5.1'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Leadership Program in the review document, using a clear
  and specific calendar date.
- Record the name of the person responsible for scheduling the next review, not just a role or department.
- Sign and date the review document to confirm when the next review date was set and by whom.
- Attach supporting evidence, such as a calendar entry or meeting invite, showing the next review is scheduled.
