must_id: item:A.7.2.3:rev_reviewer
control_ref: A.7.2.3
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + UX + Legal)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer for each Consent Determination Program Review as a specific individual from DPO, UX,
  and Legal teams.
- Record the full names and roles of all reviewers in the review meeting minutes or on the review sign-off
  sheet.
- Confirm the date each reviewer participated in the review by including a dated signature or electronic
  approval next to their name.
- Avoid listing groups or departments as reviewers; always specify named individuals to prevent ambiguity.
