must_id: item:A.5.28:rev_next_date
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date in the Evidence-Handling Program document, using a clear and specific
  calendar date.
- Record the decision on the review date in meeting minutes or a change log, including who approved it
  and when.
- Name the responsible individual for scheduling and conducting the next review, avoiding generic roles
  like "the team".
- Cross-reference the stated review date in the program document with your compliance calendar or tracking
  tool to ensure alignment.
