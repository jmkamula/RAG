must_id: item:A.5.28:disp_method
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Closure method per record (sealed-handover with receipt OR secure-destruction method with witness)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the closure method for each package in the disposal or handover log, specifying either "sealed
  handover with receipt" or the exact secure destruction method used.
- Name the individual who witnessed the secure destruction or received the sealed package, including their
  full name and signature on the record.
- Enter the date and time of each package's closure action, ensuring the record is complete and unambiguous.
- Attach or reference the signed receipt for sealed handovers, or a signed witness statement for secure
  destruction, to each package record.
- Avoid using generic terms like "disposed" or "handled"—describe the specific closure method and responsible
  individuals for every package.
