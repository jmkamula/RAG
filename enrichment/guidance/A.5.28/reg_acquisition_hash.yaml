must_id: item:A.5.28:reg_acquisition_hash
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Acquisition hash per row (cryptographic fingerprint recorded at point of collection)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a unique cryptographic hash value for each evidence item at the time of acquisition in the custody
  register.
- Document the date, time, and name of the individual generating the hash for every evidence entry.
- Cross-reference the hash value with the original evidence file to confirm accuracy and prevent later
  disputes.
- Name the responsible person for each entry as a specific individual, not a team or department.
