must_id: item:A.5.28:acquisition
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Acquisition method per evidence type (disk imaging, log export, memory capture, photographic,
  statement)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each evidence type in your procedure, such as disk images, exported logs, memory captures, photographs,
  and witness statements, with a clear heading.
- Describe the specific acquisition method for each evidence type, including tools or techniques used,
  in a step-by-step format under each heading.
- Name the person or role responsible for carrying out each acquisition method, ensuring a specific individual
  is identified rather than a generic team or department.
- Record the date and version of the procedure document to show when the acquisition methods were last
  reviewed or updated.
- Attach or reference sample completed acquisition records for each evidence type to demonstrate the methods
  in actual use.
