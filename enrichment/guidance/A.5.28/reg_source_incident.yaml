must_id: item:A.5.28:reg_source_incident
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Source incident reference per row (links to A.5.26 incident register)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference each custody register entry with the unique incident reference number from the incident
  register required by A.5.26.
- Record the incident reference as a clickable link or clear identifier that directly matches an entry
  in the incident register.
- Confirm that every row in the custody register has a completed incident reference field; do not leave
  any row blank or marked "N/A".
- Name the individual responsible for maintaining the linkage between the custody register and the incident
  register, listing their full name and role.
- Review the custody register to ensure all incident references are current and accurately reflect updates
  or changes in the incident register.
