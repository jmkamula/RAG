must_id: item:A.5.28:disp_final_hash
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Final hash per record (handover destination hash matches register hash OR pre-destruction hash
  logged)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the final hash value of each package at the point of handover or disposal in a dedicated register,
  including the date and time.
- Confirm that the hash value at the destination matches the register hash, or log the pre-destruction
  hash if the package is destroyed.
- Name the individual responsible for verifying and recording the hash, ensuring a specific person is
  listed rather than a group or department.
- Retain evidence of the hash comparison or pre-destruction hash log, such as screenshots or signed digital
  records, for each package.
