must_id: item:A.5.28:disp_closure_date
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Closure date recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the closure date for each package directly in the disposal or handover record, using a clear
  and unambiguous date format.
- Name the person responsible for entering the closure date, ensuring a specific individual is listed
  rather than a team or role.
- Cross-reference the closure date with supporting documentation, such as a signed handover form or disposal
  confirmation, to verify accuracy.
- Avoid leaving the closure date field blank or using placeholders like "TBD" or "N/A" in the record.
