must_id: item:A.5.28:reg_retention_end
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Retention end-date per row (drives the disposal_record trigger)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record a clear retention end-date for each evidence item in the custody register, matching the required
  preservation lifecycle for that type of evidence.
- Cross-reference each retention end-date with the relevant legal, regulatory, or contractual requirement
  that determines the preservation period.
- Name the person responsible for setting and reviewing each retention end-date, ensuring a specific individual
  is listed rather than a team or department.
- Confirm that no row in the custody register is missing a retention end-date, as missing dates are a
  common audit finding.
