must_id: item:A.5.28:disp_authoriser
control_ref: A.5.28
standard_id: ISO27001:2022
must_text: Authoriser per record (proportional to closure type — counsel sign-off required for external
  handover)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the authoriser for each disposal or handover record as a specific individual, not a group or department.
- Record the closure type for each package, clearly stating whether it is an internal disposal or an external
  handover.
- Obtain and retain documented sign-off from legal counsel for every external handover, including date
  and counsel’s name.
- Cross-reference each record with supporting documentation, such as disposal certificates or handover
  receipts, to confirm completion.
