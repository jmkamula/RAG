must_id: item:Art.19:reg_omission_grounds
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Per-row omitted recipients with impossibility/disproportionality grounds where applicable
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each instance where a recipient is omitted from notification in the Recipient Notification Register,
  including the specific data subject request involved.
- State the exact grounds for omission, such as impossibility or disproportionality, for each entry in
  the register.
- Name the decision-maker responsible for determining omission for each case, listing a specific individual
  rather than a team or department.
- Date each omission entry to show when the decision was made and recorded.
- Attach supporting documentation or evidence justifying the impossibility or disproportionality for each
  omitted recipient entry.
