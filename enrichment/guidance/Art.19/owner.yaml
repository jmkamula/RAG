must_id: item:Art.19:owner
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Named owner (DPO or Privacy Lead)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Recipient Notification Procedure as a specific individual, such as the Data Protection
  Officer or Privacy Lead, in the document header.
- Record the owner's full name, job title, and contact details in the procedure to allow direct identification.
- Document the date the owner was assigned responsibility for the procedure in the version control section.
- Avoid listing a team or department as the owner; specify a single accountable person.
