must_id: item:Art.19:scope_recipient_classes
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Recipient classes enumerated (processors, joint controllers, third-country recipients, public)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all classes of recipients who may receive personal data, including processors, joint controllers,
  third-country recipients, and public authorities, in a dated document.
- Name the specific individual responsible for maintaining and updating the recipient list, avoiding generic
  roles like "the team" or "IT".
- Cross-reference each recipient class with relevant data flows or processing activities in your data
  inventory.
- Review and update the recipient classes list annually, recording the review date and the person who
  performed it.
