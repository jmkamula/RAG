must_id: item:Art.19:reg_recipient_list
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Per-row recipients notified list
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full legal name of each recipient notified about a data rectification, erasure, or restriction
  in a dedicated column for every relevant entry.
- Enter the date each recipient was notified in the same row as their name to provide a clear timeline
  of notifications.
- Name the specific method used to notify each recipient (such as email, letter, or secure portal) in
  the corresponding row.
- List each recipient individually by name or unique identifier—do not use group labels like "partners"
  or "vendors."
