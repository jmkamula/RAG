must_id: item:Art.19:rev_next_date
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Article 19 Notification Program in the program documentation.
- Record the date of the last review alongside the next planned review date in a dated log or register.
- Name the reviewer or responsible individual for the upcoming review, avoiding generic titles like "the
  team" or "compliance department".
- Confirm that the stated next review date is within your organisation’s policy timeframe for program
  reviews.
