must_id: item:Art.19:scope_excluded_recipients
control_ref: Art.19
standard_id: GDPR:2016/679
must_text: Excluded recipient categories with rationale (e.g. recipients who only received aggregate data)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all categories of potential data recipients considered for data sharing, including both included
  and excluded groups, in a dated document.
- Document the rationale for excluding each recipient category, clearly stating why they do not receive
  personal data.
- Name the person responsible for making exclusion decisions as a specific individual, not a team or department.
- Retain supporting evidence, such as data flow diagrams or access logs, that demonstrate excluded recipients
  only receive aggregate or anonymized data.
