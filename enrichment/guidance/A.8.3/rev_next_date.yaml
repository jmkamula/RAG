must_id: item:A.8.3:rev_next_date
control_ref: A.8.3
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Access Restriction Program in the review log or program document.
- Record the date the current review was completed, along with the name of the reviewer, in the same document.
- Name the responsible individual who will lead the next review, avoiding generic titles like "the team"
  or "IT department".
- Retain a copy of the document or log entry showing the next planned review date and responsible person,
  with version control if updated.
