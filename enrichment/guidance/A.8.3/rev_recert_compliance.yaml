must_id: item:A.8.3:rev_recert_compliance
control_ref: A.8.3
standard_id: ISO27001:2022
must_text: Recertification compliance check — every matrix recertified within cadence
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the date and outcome of each access matrix recertification review in a central log, including
  the reviewer’s full name.
- Assign a specific individual as the owner responsible for scheduling and confirming each periodic access
  matrix recertification.
- Cross-reference each access matrix to its latest recertification record, ensuring the review falls within
  the required cadence.
- Name the reviewer as a specific person on each recertification record—do not use group names or generic
  titles.
