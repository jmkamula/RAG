must_id: item:A.8.20:reg_zone
control_ref: A.8.20
standard_id: ISO27001:2022
must_text: Per-row zone assignment (matches A.8.22 zone model)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each network asset as a separate row in the Network Inventory Register, including a unique identifier
  and description.
- Assign a specific zone to each asset, referencing the zone names and definitions from your A.8.22 zone
  model.
- Cross-reference each asset’s assigned zone with the zone model document to confirm alignment and accuracy.
- Name the person responsible for maintaining zone assignments in the register as a specific individual,
  not a team or department.
- Record the date of the most recent review or update for each asset’s zone assignment in the register.
