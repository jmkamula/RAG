must_id: item:A.8.33:rev_date
control_ref: A.8.33
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the test information program in a dated log entry or review report.
- State the planned review interval in months or years within the program documentation or review schedule.
- Compare the actual review date to the planned interval and document the result in the review log.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach the signed or approved review summary as evidence of completion within the required timeframe.
