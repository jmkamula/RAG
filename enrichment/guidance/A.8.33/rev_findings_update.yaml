must_id: item:A.8.33:rev_findings_update
control_ref: A.8.33
standard_id: ISO27001:2022
must_text: Findings propagated to procedure / scope
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each test information program review finding in a dated log, including a clear description
  and reference to the relevant procedure or scope.
- Assign responsibility for addressing each finding to a named individual, not a group or department.
- Update the affected procedure or scope document to reflect changes, citing the specific review finding
  and date of update.
- Retain evidence of communication showing that updated procedures or scope were shared with all relevant
  staff, including dates and recipients.
- Record management approval of each procedure or scope change with a dated signature or digital confirmation.
