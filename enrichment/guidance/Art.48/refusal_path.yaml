must_id: item:Art.48:refusal_path
control_ref: Art.48
standard_id: GDPR:2016/679
must_text: Refusal path documented — when Art.48 conditions not met + Art.49 not applicable, request refused
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a step-by-step refusal process in the procedure for handling foreign authority requests that
  do not meet Article 48 or 49 requirements.
- Name the decision-maker responsible for refusal as a specific individual, not a generic role or team.
- Record each refusal decision with the request details, legal assessment, and date in a dedicated log
  or register.
- Retain copies of all correspondence related to the refusal, including the formal notification sent to
  the requesting authority.
