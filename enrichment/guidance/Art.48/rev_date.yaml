must_id: item:Art.48:rev_date
control_ref: Art.48
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Foreign Authority Program in an auditable log or register.
- Document the planned review interval in months or years, referencing the approved policy or schedule.
- Confirm the actual review date falls within the documented planned interval since the previous review.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach evidence of the completed review, such as a signed summary or meeting minutes, with the review
  date clearly shown.
