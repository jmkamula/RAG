must_id: item:Art.48:rev_next_date
control_ref: Art.48
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Foreign Authority Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review in the same
  document.
- Confirm that the stated review date is not left blank, marked as "TBD," or described in vague terms
  such as "annually."
- Retain a dated copy of the document showing when the next review date was last updated.
