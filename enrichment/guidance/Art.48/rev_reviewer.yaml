must_id: item:Art.48:rev_reviewer
control_ref: Art.48
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel + executive sponsor)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- 'Name the reviewer as a specific individual for each required role: Data Protection Officer, legal counsel,
  and executive sponsor.'
- Record the full name, job title, and contact details of each reviewer in the Foreign Authority Program
  Review document.
- Document the date each reviewer completed their review and provided input on the program.
- Obtain a signature or written confirmation from each reviewer to evidence their participation.
- Avoid listing a group, team, or department as the reviewer; always specify named individuals.
