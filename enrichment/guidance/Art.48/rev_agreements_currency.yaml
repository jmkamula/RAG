must_id: item:Art.48:rev_agreements_currency
control_ref: Art.48
standard_id: GDPR:2016/679
must_text: Agreements currency — international agreements catalogue refreshed
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Compile a current list of all international agreements involving data transfers, including agreement
  titles, counterparties, and effective dates.
- Record the last review date for each agreement in the catalogue, ensuring all entries are updated within
  the past 12 months.
- Assign a named individual responsible for maintaining and refreshing the international agreements catalogue,
  with contact details included.
- Attach copies of the most recent signed versions of each agreement to the catalogue for auditor inspection.
- Avoid listing agreements as "various" or "ongoing"—specify each agreement by name and date to prevent
  ambiguity.
