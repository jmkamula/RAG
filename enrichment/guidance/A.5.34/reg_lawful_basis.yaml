must_id: item:A.5.34:reg_lawful_basis
control_ref: A.5.34
standard_id: ISO27001:2022
must_text: Lawful basis recorded per activity (matches the policy's discipline — consent / contract /
  legal obligation / vital interests / public task / legitimate interests, with special-category Art.9
  basis where applicable)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the lawful basis for each processing activity in the PII Processing Register, using the exact
  terms defined in your data protection policy.
- Cross-reference each activity’s lawful basis entry to the relevant policy section or legal text supporting
  that basis.
- Specify the Article 9 special-category basis for any processing of sensitive personal data, not just
  the general Article 6 basis.
- Name the decision-maker who determined the lawful basis for each activity, avoiding generic references
  like "the team" or "compliance department."
- Date each lawful basis entry to show when it was last reviewed or confirmed as accurate.
