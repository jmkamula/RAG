guidance:
- Document the date and findings of each privacy and PII protection program review in a dedicated review
  log.
- Update the live privacy and PII register to reflect all approved changes, citing the specific review
  log entry as the source.
- Name the individual responsible for updating the register, avoiding generic labels like "the team" or
  "IT."
- Retain evidence of the register update, such as a version history or change log entry with timestamps
  and references to the review.
