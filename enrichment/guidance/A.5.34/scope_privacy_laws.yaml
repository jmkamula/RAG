must_id: item:A.5.34:scope_privacy_laws
control_ref: A.5.34
standard_id: ISO27001:2022
must_text: Applicable privacy laws enumerated per jurisdiction (GDPR for EU/EEA, UK GDPR for UK, CCPA
  for California residents, LGPD for Brazil, PIPEDA for Canada, sectoral laws — HIPAA, GLBA, FERPA where
  relevant)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each country or region where your organisation collects or processes personal data in a dated Privacy
  Applicability Scope document.
- Enumerate the specific privacy laws and regulations that apply to each jurisdiction, such as GDPR for
  the EU or CCPA for California.
- State the business activities or data types that trigger each law’s applicability, referencing supporting
  records or data maps where possible.
- Name a specific individual as the owner of the Privacy Applicability Scope — do not use a team or department
  as the owner.
- Review and update the document at least annually, recording the review date and the name of the reviewer.
