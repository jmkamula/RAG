must_id: item:A.5.34:rev_next_date
control_ref: A.5.34
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Privacy and PII Protection Program in a dated document, such
  as the review schedule or meeting minutes.
- Name the individual responsible for scheduling and leading the next review, listing their full name
  and role in the same document.
- Record the date this review schedule was last updated, ensuring it is clearly visible and not left blank
  or undated.
- Avoid using vague terms like “annually” or “TBD”; specify an exact calendar date for the next planned
  review.
