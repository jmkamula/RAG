must_id: item:A.5.34:scope_regulated_activities
control_ref: A.5.34
standard_id: ISO27001:2022
must_text: Regulated activities pulling in sectoral privacy regimes (healthcare → HIPAA, financial → GLBA/PSD2/DORA-privacy
  overlap, telco → ePrivacy, public sector → FERPA/government-records laws, advertising/profiling → ePrivacy)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all business activities that process personal data, specifying the sector each activity falls under
  (e.g., healthcare, finance, telecom).
- Identify and record the exact privacy laws or regulations that apply to each activity, citing the specific
  regime (e.g., HIPAA, GLBA, ePrivacy).
- Name the owner as a specific individual responsible for maintaining the privacy applicability scope,
  not a team or department.
- Date and approve the documented scope and mappings by a senior manager to confirm accuracy and accountability.
- Cross-reference the privacy applicability scope in your risk register or compliance matrix, linking
  each regulated activity to its governing law.
