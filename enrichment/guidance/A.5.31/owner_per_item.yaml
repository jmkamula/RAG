must_id: item:A.5.31:owner_per_item
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Owner named per requirement (who tracks change and compliance)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each requirement in the register, avoiding generic titles
  like "the team" or "IT department".
- Record the date the owner was assigned for each requirement to provide a clear timeline of accountability.
- Document the owner's responsibility to track changes and monitor compliance for each listed requirement
  in the register.
- Cross-reference each requirement entry with supporting evidence, such as meeting minutes or assignment
  emails, confirming the owner's acceptance.
