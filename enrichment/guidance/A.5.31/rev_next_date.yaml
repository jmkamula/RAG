must_id: item:A.5.31:rev_next_date
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the next planned review date for the legal and regulatory register in a dedicated column or field
  within the register.
- Name the individual responsible for conducting the next review, using their full name rather than a
  role or department.
- Document the date this next review date was last set or updated, ensuring it is clearly visible in the
  register.
- Avoid leaving the next review date field blank or using vague terms like "TBA" or "ongoing"—always enter
  a specific future date.
