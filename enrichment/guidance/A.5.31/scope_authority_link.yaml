must_id: item:A.5.31:scope_authority_link
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Cross-link to A.5.5 applicable-authorities scope — same drivers; shared updates
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference the list of applicable obligations in A.5.31 with the list of applicable authorities
  in A.5.5, showing clear links between each item.
- Document the date and person responsible for updating both A.5.31 and A.5.5 scopes to confirm synchronized
  reviews.
- State in the obligations scope record where shared drivers or requirements are addressed in both A.5.31
  and A.5.5.
- Name the owner for maintaining these cross-links as a specific individual, not a team or department.
- Retain version history showing when updates in one scope triggered updates in the other, with timestamps.
