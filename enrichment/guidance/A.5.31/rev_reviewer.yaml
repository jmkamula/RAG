must_id: item:A.5.31:rev_reviewer
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Reviewer identity and role recorded (compliance lead with legal-counsel sign-off where material)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full name and job title of the person who conducted the legal/regulatory register review
  in the review log.
- Document the date the review was completed and attach any supporting review notes or findings to the
  register.
- Obtain a signed statement from legal counsel for any material changes, confirming their review and approval.
- Name the compliance lead and legal counsel as specific individuals, not as generic roles or departments,
  in the review documentation.
