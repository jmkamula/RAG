must_id: item:A.5.31:rev_register_update
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Changes propagated back to the live register with reference to this review
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer who completed the periodic legal and regulatory register review, recording their full
  name and the review date.
- Document each change identified during the review, listing the specific regulation or requirement and
  the nature of the update.
- Cross-reference each change in the live register to the review record by including the review date and
  a summary of the change.
- Retain evidence of the updated live register, showing the new version number or date and the initials
  of the person who made the changes.
- Avoid using vague references like "reviewed by team" or undated entries—always specify individuals and
  dates for each update.
