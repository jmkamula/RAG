must_id: item:A.5.31:rev_horizon
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Forward-looking section — obligations entering force in the next 12-24 months that need preparation
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to monitor upcoming legal and regulatory changes relevant to your business,
  recording their name and responsibility in the register.
- Document each new or amended obligation entering force in the next 12-24 months, including the effective
  date and a summary of required actions.
- Record the date of each periodic review, the reviewer’s name, and any decisions or actions planned to
  address upcoming obligations.
- Attach evidence of proactive planning, such as meeting notes or action plans, showing how your organisation
  will prepare for these future requirements.
- Name each obligation specifically; do not use generic phrases like “pending laws” or “future regulations”
  without clear identification and source.
