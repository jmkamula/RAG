must_id: item:A.5.31:rev_per_entry
control_ref: A.5.31
standard_id: ISO27001:2022
must_text: Per-entry outcome (verified / amended / retired / new added) with compliance-approach still-adequate
  confirmation
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to lead the legal and regulatory register review, recording their name and
  the review start date in the register.
- Record the outcome for each register entry as verified, amended, retired, or new added, including the
  date and reviewer’s initials.
- State for each entry whether the current compliance approach remains adequate, documenting any changes
  or confirmations in the register.
- Attach supporting evidence for any amendments or retirements, such as updated legal texts or correspondence
  with authorities.
- Name the reviewer as a specific person for each entry — do not use generic labels like "Compliance Team"
  or "Legal Department".
