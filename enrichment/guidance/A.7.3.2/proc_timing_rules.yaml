must_id: item:A.7.3.2:proc_timing_rules
control_ref: A.7.3.2
standard_id: ISO27701:2019
must_text: Timing rules — when information is provided (prior to processing / at collection / within X
  days of request / just-in-time / periodic frequency)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the exact timing for providing privacy information, specifying whether it is before data collection,
  at collection, or within a set number of days after a request.
- Document the procedure in a dated and version-controlled file, clearly outlining each timing rule for
  different processing scenarios.
- Name the responsible individual who approves the timing rules, avoiding generic titles like "the team"
  or "management."
- Record the approval date and method for the timing rules, such as a signed decision or meeting minutes.
- Cross-reference the timing rules in your privacy notice content determination procedure to the relevant
  sections of your published privacy notices.
