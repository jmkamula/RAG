must_id: item:A.7.3.2:rev_next_date
control_ref: A.7.3.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date clearly in the Notice Content Program Review document.
- Record the date in a way that is visible and unambiguous, such as in a dedicated "Next Review Date"
  field.
- Name the individual responsible for scheduling the next review, avoiding generic titles like "team"
  or "department."
- Retain a copy of the document showing the stated next review date and responsible person for future
  reference.
