must_id: item:Art.45:scope_change_drivers
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Trigger list (new adequacy decision, repeal, vendor change of certification)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all countries where personal data is transferred and identify if an adequacy decision applies to
  each, recording the date of last review.
- Document any new adequacy decisions, repeals, or changes in vendor certification status with supporting
  evidence such as official announcements or vendor statements.
- Assign a named individual responsible for monitoring adequacy decisions and vendor certifications, ensuring
  their name and contact details are recorded.
- Record the trigger event and corresponding action taken in a dated change log to demonstrate ongoing
  monitoring and response.
- Name the adequacy status for each country specifically; do not use generic terms like "various" or "as
  applicable".
