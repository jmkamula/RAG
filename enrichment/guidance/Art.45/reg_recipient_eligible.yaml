must_id: item:Art.45:reg_recipient_eligible
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Per-row recipient-eligibility status (e.g. US-DPF active certification verified)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full legal name of each data recipient in the Adequacy Reliance Register, matching the entity
  listed in official adequacy or certification sources.
- State the specific adequacy mechanism relied upon for each recipient, such as "EU Commission Adequacy
  Decision" or "US-DPF active certification."
- Document the date on which the recipient’s eligibility status was last verified, referencing the official
  registry or certification database used.
- Name the individual responsible for verifying and updating each recipient’s eligibility status, avoiding
  generic roles like "the team" or "IT."
- Attach or link to evidence of the recipient’s current eligibility, such as a screenshot or PDF from
  the relevant adequacy or certification website.
