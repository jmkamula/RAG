must_id: item:Art.45:rev_next_date
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the adequacy program in a clearly visible section of the review
  document.
- Record the date as a full calendar date, not just a month or year, to avoid ambiguity.
- Name the person responsible for scheduling the next review, listing their full name and job title.
- Confirm the planned review date is not left blank or marked as "TBD," as auditors will flag missing
  or vague dates.
