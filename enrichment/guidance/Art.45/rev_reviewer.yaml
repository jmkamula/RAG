must_id: item:Art.45:rev_reviewer
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and the designated
  legal counsel by full name and job title.
- Record the date each reviewer completed their assessment in the adequacy program review document.
- Obtain and retain each reviewer's signature or documented electronic approval within the review record.
- Avoid listing a group or department as the reviewer; always specify named individuals for clear accountability.
