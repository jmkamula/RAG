must_id: item:Art.45:owner
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Named owner (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Adequacy Reliance Procedure as a specific individual, listing both the Data Protection
  Officer and a designated legal counsel.
- Record the full names, job titles, and contact details of the DPO and legal counsel in the procedure
  document.
- Sign and date the procedure document to confirm the named owner information is current and approved.
- Avoid listing the owner as a group, team, or department—use only named individuals for clear accountability.
