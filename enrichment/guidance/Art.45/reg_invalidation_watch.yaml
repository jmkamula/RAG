must_id: item:Art.45:reg_invalidation_watch
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Per-row invalidation-watch flag (active CJEU challenges / Commission review status)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the current adequacy status for each country in the register, including the date of the latest
  European Commission decision.
- Document any ongoing legal challenges or reviews affecting each country's adequacy status, citing the
  specific case or review reference.
- Update the invalidation-watch flag for each country row whenever a new challenge is filed or a review
  is announced, noting the date of update.
- Name a specific individual responsible for monitoring adequacy status changes and recording updates,
  not a team or department.
- Retain evidence of periodic reviews of the register, such as a dated sign-off or review log, at least
  quarterly.
