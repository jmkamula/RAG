must_id: item:Art.45:reg_transfer_id
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Per-row transfer id (Art.44 register cross-ref)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique transfer ID to each data transfer entry in the Adequacy Reliance Register.
- Cross-reference each transfer ID with the corresponding entry in the Article 44 transfer register.
- Record the date each transfer ID is assigned to ensure traceability.
- Name the owner responsible for maintaining the cross-references as a specific individual, not a team
  or department.
