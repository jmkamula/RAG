must_id: item:Art.45:rev_date
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent adequacy program review date in a central register, clearly showing the day,
  month, and year.
- Confirm the planned review interval is documented and approved by a named individual responsible for
  the adequacy program.
- Cross-reference the actual review date against the planned interval to demonstrate the review occurred
  on schedule.
- Attach evidence of the review, such as meeting minutes or a signed review report, with the corresponding
  review date.
- Name the reviewer as a specific individual—do not list a group, department, or use generic terms like
  "compliance team".
