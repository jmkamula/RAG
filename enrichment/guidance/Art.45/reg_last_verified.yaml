must_id: item:Art.45:reg_last_verified
control_ref: Art.45
standard_id: GDPR:2016/679
must_text: Per-row last-verified date
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the last date each adequacy decision was checked for validity in a dedicated "last-verified"
  column for every entry in the register.
- Name the person who performed each verification by entering their full name next to the corresponding
  date.
- Cross-reference each verification with a source document or official website used to confirm adequacy
  status, noting the URL or document title.
- Enter a specific calendar date for each verification—avoid vague entries like "recently" or "this year."
