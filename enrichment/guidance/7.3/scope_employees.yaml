must_id: item:7.3:scope_employees
control_ref: '7.3'
standard_id: ISO27001:2022
must_text: Employee coverage stated (all employees, all locations)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in a written document that all employees, at all locations, are included in the information security
  awareness program.
- Name the specific individual responsible for maintaining the awareness audience scope, not just a department
  or team.
- Record the date the audience scope was last reviewed or updated to show it is current.
- Cross-reference the audience scope document with your current employee list to confirm full coverage.
