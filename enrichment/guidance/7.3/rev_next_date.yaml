must_id: item:7.3:rev_next_date
control_ref: '7.3'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Awareness Program in the review documentation, using a clear
  and specific calendar date.
- Record the name of the person responsible for scheduling the next review, listing a specific individual
  rather than a team or department.
- Document the date when the current review was completed, providing a clear timeline for auditors to
  verify.
- Attach evidence of management approval for the stated next review date, such as a signed or emailed
  confirmation.
