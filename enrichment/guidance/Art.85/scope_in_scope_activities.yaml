must_id: item:Art.85:scope_in_scope_activities
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Activities in scope enumerated, classified by Art.85 category (journalism / academic / artistic
  / literary)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all organisational activities that could fall under journalism, academic, artistic, or literary
  purposes, with a brief description for each.
- Classify each listed activity under the relevant Art.85 category, stating the specific category name
  next to each activity.
- Name the person responsible for maintaining this scope list, ensuring a specific individual is identified
  rather than a team or department.
- Date the most recent review or update of the activities scope to provide a clear record of currency.
- Attach supporting documentation or references that justify the classification of each activity under
  its chosen Art.85 category.
