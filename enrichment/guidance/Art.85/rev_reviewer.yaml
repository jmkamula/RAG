must_id: item:Art.85:rev_reviewer
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel + editorial/academic lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer identities as specific individuals for the DPO, legal counsel, and editorial or academic
  lead in the program review record.
- Record the date each reviewer completed their review on the Art.85 Derogation Program Review document.
- Obtain a signature or written confirmation from each named reviewer to evidence their participation
  and approval.
- Avoid listing roles or teams only; ensure each reviewer is identified by full name and job title.
