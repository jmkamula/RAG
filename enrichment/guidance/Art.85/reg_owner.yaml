must_id: item:Art.85:reg_owner
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Named owner of the register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner of the Per-Jurisdiction Art.85 National Law Derogation Register,
  avoiding generic titles or teams.
- Record the owner's full name and job title in the register's metadata or cover page.
- Document the date the ownership was assigned and update this record whenever ownership changes.
- Retain evidence of management approval for the assigned owner, such as a signed or emailed confirmation.
