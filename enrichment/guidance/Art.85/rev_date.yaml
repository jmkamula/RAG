must_id: item:Art.85:rev_date
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Art.85 Derogation Program in a dated log or review schedule.
- Confirm the documented review date falls within the interval specified in your internal policy or program
  plan.
- Name the reviewer as a specific individual responsible for the most recent program review, not a group
  or department.
- Retain evidence of the completed review, such as meeting minutes or a signed review summary, with the
  review date clearly shown.
