must_id: item:Art.85:rev_law_currency
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Member State law currency check — every cited national-law provision still in force; new MS
  implementations swept in
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List every national law provision cited in your derogation program, including the full legal reference
  and date of last verification.
- Confirm each cited provision is still in force by checking the official government legal database, and
  record the verification date.
- Identify and add any new or amended Member State laws relevant to Art.85 since your last review, noting
  the date of inclusion.
- Name the reviewer as a specific individual responsible for the law currency check, not a team or department.
- Retain evidence of your legal checks, such as screenshots or downloaded pages from official sources,
  with visible dates.
