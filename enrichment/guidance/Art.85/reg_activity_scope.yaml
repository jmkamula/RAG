must_id: item:Art.85:reg_activity_scope
control_ref: Art.85
standard_id: GDPR:2016/679
must_text: Per-row activity scope (which processing this derogation covers — journalism / academic / artistic
  / literary)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific processing activity type for each row, clearly stating whether it is journalism,
  academic, artistic, or literary.
- Name the jurisdiction and corresponding national law for each derogation entry, ensuring each is matched
  to the correct processing scope.
- Assign a unique reference number to each register entry to allow easy cross-referencing with supporting
  documentation.
- Name the owner as a specific individual responsible for maintaining the register, not a team or department.
- Date each entry to show when the activity scope and derogation were last reviewed or updated.
