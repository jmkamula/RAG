must_id: item:A.7.5.3:reg_timestamp
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Timestamp per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date and time of each PII transfer in a dedicated timestamp column for every entry
  in the event log.
- Confirm that the timestamp format is consistent and includes both date and time, such as "YYYY-MM-DD
  HH:MM:SS".
- Review the log to verify that no entry is missing a timestamp; address any blank or incomplete timestamp
  fields immediately.
- Name the person responsible for maintaining the log as a specific individual, not a generic role or
  team.
