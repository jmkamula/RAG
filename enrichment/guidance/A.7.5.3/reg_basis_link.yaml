must_id: item:A.7.5.3:reg_basis_link
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Basis link per row (which A.7.5.1 basis authorised this transfer)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the unique identifier of the authorising legal basis from your A.7.5.1 register in each PII transfer
  event log entry.
- Cross-reference each transfer event to the specific policy or contract clause that permits the transfer,
  not just a generic description.
- Name the individual who approved the transfer and include the approval date in the event log entry.
- Avoid using vague basis references like "as needed" or "per policy"—link each event to a specific, documented
  authorisation.
