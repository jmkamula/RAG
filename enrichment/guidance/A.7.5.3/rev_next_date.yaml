must_id: item:A.7.5.3:rev_next_date
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Transfer Records Program in a clearly visible section of
  the review document.
- Name the individual responsible for scheduling the next review, listing their full name and role in
  the document.
- Record the date the current review was completed to show the timeline between reviews.
- Avoid leaving the next review date blank or stating "TBD"—enter a specific future date to meet planning
  expectations.
