must_id: item:A.7.5.3:reg_third_party
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Third party per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each transfer of personal data to a third party as a separate row, listing the specific recipient
  organisation by name.
- State the date and time of each transfer event in the log to provide a clear timeline for auditors.
- Name the individual who authorised each transfer in a dedicated column, avoiding generic entries like
  "team" or "department".
- Document the purpose of each transfer in the log, referencing the relevant legal or contractual basis
  for sharing data.
- Cross-reference each log entry with supporting documentation, such as a data sharing agreement or transfer
  approval record.
