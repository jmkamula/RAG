must_id: item:A.7.5.3:proc_transfer_event_capture
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Transfer event capture (to + from third parties)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document each transfer of personal data to or from third parties in a transfer log, including date,
  recipient or sender, and purpose.
- Name the individual responsible for maintaining the transfer log, ensuring a specific person is listed
  rather than a team or department.
- Record supporting evidence for each transfer, such as contracts, data sharing agreements, or correspondence
  confirming the transfer details.
- Review the transfer log regularly and sign off on its completeness and accuracy, noting the review date
  and reviewer’s name.
