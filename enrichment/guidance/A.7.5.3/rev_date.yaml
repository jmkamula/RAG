must_id: item:A.7.5.3:rev_date
control_ref: A.7.5.3
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Transfer Records Program in a dated document or system entry.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- State the planned review interval in months or years within the program documentation.
- Cross-reference the actual review date against the planned interval to confirm it falls within the required
  timeframe.
- Retain evidence of the completed review, such as meeting minutes or a signed review summary, in an accessible
  location.
