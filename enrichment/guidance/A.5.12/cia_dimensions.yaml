must_id: item:A.5.12:cia_dimensions
control_ref: A.5.12
standard_id: ISO27001:2022
must_text: Each level addresses confidentiality, integrity, and availability dimensions
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each classification level in your scheme and explicitly describe how confidentiality, integrity,
  and availability apply to that level.
- Document the definitions for confidentiality, integrity, and availability in the context of your organisation
  within the classification scheme.
- Cross-reference each classification level to specific handling requirements that address all three dimensions,
  not just confidentiality.
- Name the scheme owner as a specific individual, not a generic role or department, to avoid ambiguity.
