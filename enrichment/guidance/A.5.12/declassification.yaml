must_id: item:A.5.12:declassification
control_ref: A.5.12
standard_id: ISO27001:2022
must_text: Declassification or reclassification process
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for declassifying or reclassifying information, including required
  approvals and triggers for review.
- Name the person or role responsible for authorizing each declassification or reclassification decision,
  listing them specifically by name or unique job title.
- Record each declassification or reclassification event in a log, including the date, information asset
  identifier, and the decision-maker’s name.
- State the criteria used to determine when information should be declassified or reclassified, referencing
  any supporting policy or legal requirement.
- Avoid using generic descriptions like "as needed" or "by management" in your scheme; specify clear actions
  and responsible parties.
