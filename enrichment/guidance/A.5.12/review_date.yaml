must_id: item:A.5.12:review_date
control_ref: A.5.12
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the classification scheme in a dated log or register entry.
- State the planned review interval in months or years within the classification scheme documentation.
- Confirm the next scheduled review date is calculated and documented based on the last review and planned
  interval.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Attach evidence of the completed review, such as meeting minutes or a signed review checklist, to the
  classification scheme file.
