must_id: item:A.5.12:review_reviewer
control_ref: A.5.12
standard_id: ISO27001:2022
must_text: Reviewer identity and role (typically CISO with data-protection and business-line input)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, such as the CISO, in the review record—avoid listing only
  a team or department.
- Record the reviewer's official role and department in the review documentation to clarify their authority
  and accountability.
- Document the involvement of data-protection and business-line representatives by listing their names
  and roles in the review meeting minutes.
- Sign and date the final review outcome to provide clear evidence of when and by whom the review was
  completed.
