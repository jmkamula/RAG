must_id: item:A.5.12:approval_date
control_ref: A.5.12
standard_id: ISO27001:2022
must_text: Approval date recorded
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the person responsible for approving the classification scheme as a specific individual, not a
  group or department.
- Record the approval date directly on the classification scheme document or in a formal approval log.
- Retain a copy of the signed or digitally approved classification scheme showing the approval date and
  approver’s name.
- Cross-reference the approval record in your document control register to confirm traceability to the
  classification scheme.
