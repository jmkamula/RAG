must_id: item:A.8.22:scope_change_drivers
control_ref: A.8.22
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new tenant, new cloud region, new regulator)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List specific events that require re-scoping, such as onboarding a new tenant, adding a new cloud region,
  or changes in regulatory requirements.
- Document the trigger list in a dated and version-controlled register that is reviewed at least annually.
- Assign a named individual responsible for monitoring and updating the trigger list when relevant changes
  occur.
- Record each re-scoping decision with the date, scope changes, and the person who approved the update.
- Name the owner as a specific individual — not a team or department — to avoid ambiguity in responsibility.
