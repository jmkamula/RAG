must_id: item:A.8.22:reg_enforcement
control_ref: A.8.22
standard_id: ISO27001:2022
must_text: Per-zone enforcement-boundary description (specific firewall / ACL / policy)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each network zone in the register with a unique name and a clear description of its purpose.
- Document the specific enforcement boundary for each zone, naming the exact firewall, access control
  list, or policy that applies.
- State the date each enforcement boundary was last reviewed or updated, and record the name of the reviewer.
- Name the owner of each network zone as a specific individual, not a team or department.
- Attach or cross-reference supporting configuration files or screenshots showing the enforcement boundary
  settings for each zone.
