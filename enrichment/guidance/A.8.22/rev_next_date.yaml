must_id: item:A.8.22:rev_next_date
control_ref: A.8.22
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Network Segregation Program in the review documentation,
  using a clear and specific calendar date.
- Record the name of the person responsible for scheduling and conducting the next review in the same
  document.
- Confirm the review document is dated and version-controlled to show when the next review date was last
  set.
- Name the next review date explicitly—do not use vague terms like "annually" or "TBD" that lack a specific
  calendar date.
