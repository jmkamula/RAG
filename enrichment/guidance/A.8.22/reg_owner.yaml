must_id: item:A.8.22:reg_owner
control_ref: A.8.22
standard_id: ISO27001:2022
must_text: Per-zone named owner
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each network zone in the register, avoiding generic labels
  like "IT team" or "Network group".
- Record the date when each owner was assigned responsibility for their respective network zone.
- Document contact details for each named owner, such as email address and phone number, in the register
  entry.
- Review the register annually and update ownership details if there have been any changes, noting the
  review date.
