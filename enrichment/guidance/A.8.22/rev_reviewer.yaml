must_id: item:A.8.22:rev_reviewer
control_ref: A.8.22
standard_id: ISO27001:2022
must_text: Reviewer identity (Network Engineering + InfoSec + Application Engineering leads)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewers as the current leads for Network Engineering, Information Security, and Application
  Engineering in the review documentation.
- Record the full names and job titles of each lead who participated in the program review, along with
  the review date.
- Obtain signatures or written confirmation from each lead to verify their participation in the review
  process.
- Avoid listing groups or departments as reviewers; specify individual leads by name to ensure clear accountability.
