must_id: item:B.8.5.2:proc_owner
control_ref: B.8.5.2
standard_id: ISO27701:2019
must_text: Named owner (Trust + DPO)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the procedure owner as a specific individual, such as "Jane Smith, Data Protection Officer," not
  a team or department.
- Document the appointment of the owner in the procedure, including their full name, job title, and the
  date of assignment.
- Record the owner's acceptance of responsibility with a signed and dated statement attached to the procedure.
- Cross-reference the named owner in your organisation’s compliance register to ensure consistency across
  documentation.
