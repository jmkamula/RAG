must_id: item:B.8.5.2:reg_subprocessor_link
control_ref: B.8.5.2
standard_id: ISO27701:2019
must_text: Subprocessor link per row where destination is via a subprocessor
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each data transfer destination in the register, specifying whether the transfer is direct or via
  a subprocessor.
- Record the full legal name and contact details of the subprocessor for each destination involving a
  subprocessor.
- Cross-reference each subprocessor entry with a contract or agreement that authorizes their involvement
  in the data transfer.
- Attach the date when each subprocessor relationship was last reviewed or updated in the register.
- Name the subprocessor as a specific company, not just a generic service type or category.
