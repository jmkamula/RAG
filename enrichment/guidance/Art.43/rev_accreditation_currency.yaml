must_id: item:Art.43:rev_accreditation_currency
control_ref: Art.43
standard_id: GDPR:2016/679
must_text: Accreditation currency — SA / NAB accreditation still in force
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Obtain the most recent accreditation certificate from your national accreditation body, showing the
  accreditation is current and unexpired.
- Record the accreditation certificate’s issue and expiry dates in a central compliance register, along
  with the accrediting body’s full legal name.
- Confirm the accreditation body is listed on the official national or supranational register of recognized
  accreditation bodies.
- Name the individual responsible for monitoring accreditation status, avoiding generic titles such as
  "the team" or "compliance department."
- Retain correspondence or official notifications from the accreditation body confirming continued accreditation
  status.
