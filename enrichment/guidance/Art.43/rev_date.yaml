must_id: item:Art.43:rev_date
control_ref: Art.43
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the certification body program in a dated document or system entry.
- Confirm the planned review interval is clearly stated in a policy or schedule, with specific start and
  end dates.
- Cross-reference the actual review date with the planned interval to show the review occurred within
  the required timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
