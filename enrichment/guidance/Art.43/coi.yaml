must_id: item:Art.43:coi
control_ref: Art.43
standard_id: GDPR:2016/679
must_text: COI management (Art.43.2.e)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a written procedure that explains how conflicts of interest are identified, assessed, and managed
  during all certification activities.
- Name a specific individual responsible for overseeing conflict of interest management, rather than using
  a generic title or team name.
- Record each identified conflict of interest in a dated register, including the names of involved staff
  and the actions taken.
- Retain signed declarations from all certification staff confirming they have disclosed any potential
  conflicts of interest before each engagement.
- Review and update the conflict of interest procedure annually, and keep a dated record of each review
  and revision.
