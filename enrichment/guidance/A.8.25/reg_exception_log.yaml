must_id: item:A.8.25:reg_exception_log
control_ref: A.8.25
standard_id: ISO27001:2022
must_text: Per-project exception log (waived gates with rationale + compensating controls)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each project’s exceptions to standard development gates in the register, including the specific
  gate waived and the date of the decision.
- Document the rationale for each exception, referencing supporting evidence or risk assessments that
  justify the waiver.
- State all compensating controls implemented for each exception, listing control owners and expected
  effectiveness.
- Name the decision-maker for each exception as a specific individual, not a group or generic title.
- Retain all exception entries with version history, showing updates and closure dates for each logged
  exception.
