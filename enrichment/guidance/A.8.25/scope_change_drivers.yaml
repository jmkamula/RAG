must_id: item:A.8.25:scope_change_drivers
control_ref: A.8.25
standard_id: ISO27001:2022
must_text: Trigger list for re-scoping (new product line, new development paradigm — e.g. AI/ML)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List specific events that require SDLC scope review, such as launching a new product line or adopting
  AI/ML technologies, in a dated document.
- Assign a named individual responsible for monitoring triggers and initiating re-scoping discussions,
  recording their name and role in the document.
- Review and update the trigger list at least annually, recording the review date and participants each
  time.
- Avoid using generic triggers like "significant change" without examples; provide clear, concrete scenarios
  that apply to your organisation.
