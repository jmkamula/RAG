must_id: item:A.8.25:rev_next_date
control_ref: A.8.25
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the SDLC program in the most recent review report or tracking
  document.
- Name the individual responsible for scheduling and conducting the next review, ensuring a specific person
  is listed.
- Record the date this next review was scheduled, referencing meeting minutes or a decision log entry.
- Avoid leaving the next review date blank or stating it as "TBD"—auditors will flag missing or vague
  scheduling.
