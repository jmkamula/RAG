must_id: item:A.8.17:rev_next_date
control_ref: A.8.17
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the clock synchronization program in the documented review record.
- Record the name of the individual responsible for scheduling and conducting the next review.
- Sign and date the review record to confirm agreement on the next planned review date.
- Avoid leaving the next review date blank or stating "TBD"—enter a specific future date.
