must_id: item:B.8.5.1:proc_owner
control_ref: B.8.5.1
standard_id: ISO27701:2019
must_text: Named owner (DPO + Legal + Trust)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the owner of the Processor Cross-Jurisdiction Transfer Basis Procedure as a specific individual,
  listing both their full name and job title.
- Document the involvement of the Data Protection Officer, Legal, and Trust functions by recording their
  names and roles in the procedure document.
- Sign and date the procedure to confirm approval by the named owner and representatives from Legal and
  Trust.
- Record the review schedule and next planned review date in the procedure, assigning responsibility for
  updates to the named owner.
