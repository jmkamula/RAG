must_id: item:B.8.5.1:rev_next_date
control_ref: B.8.5.1
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Processor Transfer Basis Program in a dated document or tracking
  system entry.
- Name the individual responsible for scheduling and conducting the next review, listing their full name
  and role.
- Record the date this review schedule was last updated, ensuring it is not left blank or marked as "ongoing."
- Avoid using vague terms like "annual" or "as needed"—specify an exact calendar date for the next review.
