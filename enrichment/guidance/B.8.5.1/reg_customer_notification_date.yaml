must_id: item:B.8.5.1:reg_customer_notification_date
control_ref: B.8.5.1
standard_id: ISO27701:2019
must_text: Customer notification date per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the exact date each customer was notified about the data transfer in a dedicated column for every
  entry in the Processor Transfer Basis Register.
- Name the individual responsible for sending each customer notification, listing their full name rather
  than a team or department.
- Attach a copy or reference to the actual notification sent to each customer alongside the corresponding
  register entry.
- Confirm that no register row is left with a blank or placeholder notification date, as missing dates
  will be flagged by auditors.
