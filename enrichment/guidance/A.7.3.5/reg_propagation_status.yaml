must_id: item:A.7.3.5:reg_propagation_status
control_ref: A.7.3.5
standard_id: ISO27701:2019
must_text: Downstream propagation status
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each objection event with a unique identifier, the date received, and the specific data subject
  or stakeholder involved.
- Document the exact downstream systems, vendors, or partners notified about the objection, including
  notification dates and responsible contacts.
- State the current status of downstream propagation for each event, such as "pending," "in progress,"
  or "completed," with supporting evidence.
- Name the individual responsible for tracking and updating downstream propagation status for each objection
  event, not just a team or department.
- Retain confirmation evidence from each downstream recipient acknowledging receipt and action taken in
  response to the objection.
