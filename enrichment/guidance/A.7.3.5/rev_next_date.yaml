must_id: item:A.7.3.5:rev_next_date
control_ref: A.7.3.5
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Objection Program in the review record or meeting minutes.
- Record the name of the individual responsible for scheduling the next review alongside the planned date.
- Confirm the review date is specific and not left as "TBD" or "annually" without a calendar date.
- Retain a dated copy of the review record showing when the next review date was agreed.
