must_id: item:A.7.10:rev_date
control_ref: A.7.10
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the storage media program in a central log, including the name
  of the reviewer.
- Document the planned review interval for the storage media program, specifying the exact frequency (e.g.,
  annually, every 6 months).
- Confirm the next scheduled review date is set and falls within the documented interval from the last
  completed review.
- Name the reviewer as a specific individual, not a team or department, in the review record.
- Retain evidence of the completed review, such as a signed or digitally approved review report with the
  completion date.
