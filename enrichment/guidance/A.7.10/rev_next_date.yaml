must_id: item:A.7.10:rev_next_date
control_ref: A.7.10
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the storage media program in the official review schedule document.
- Record the name of the person responsible for scheduling and conducting the next review in the same
  document.
- Confirm the review schedule document is dated and version-controlled to show when the next review date
  was last updated.
- Name the owner as a specific individual — do not use a team name or department as the responsible party.
