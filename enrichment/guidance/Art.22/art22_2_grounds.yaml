must_id: item:Art.22:art22_2_grounds
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Art.22.2 grounds catalog — when automated decisions ARE permitted (contract necessity / Member
  State law / explicit consent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- 'List each automated decision process and specify which Art.22.2 ground applies: contract necessity,
  Member State law, or explicit consent.'
- Document the legal or contractual reference supporting each ground, including law name, contract clause,
  or consent record with date.
- Name the responsible individual who determined and approved the applicable Art.22.2 ground for each
  process.
- Attach a copy of the explicit consent form or contract excerpt where used, ensuring it is signed and
  dated.
- Avoid using generic justifications; describe the specific reason why each automated decision meets the
  chosen Art.22.2 ground.
