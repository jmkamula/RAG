must_id: item:Art.22:reg_safeguards
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Per-row Art.22.3 safeguards in place (human intervention queue, contest UI, model explanation)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record, for each automated decision process, the specific safeguard in place such as human review, contestation
  method, or model explanation.
- Name the individual responsible for monitoring each safeguard, avoiding generic roles like "the team"
  or "IT department".
- Document the date each safeguard was last tested or reviewed to confirm ongoing effectiveness.
- Attach or link to evidence of the safeguard in action, such as screenshots of the contestation interface
  or logs of human intervention.
