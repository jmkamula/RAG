must_id: item:Art.22:scope_exclusions
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Out-of-scope automated processes (with rationale — e.g. flag-for-review, recommender-no-significant-effect)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all automated decision processes in use, including a brief description and the system or tool responsible
  for each.
- Identify and record which automated processes are out of scope for Article 22, stating the specific
  rationale for each exclusion.
- Reference supporting documentation or data showing why each out-of-scope process does not have a legal
  or similarly significant effect on individuals.
- Name the responsible individual who made each out-of-scope determination; do not use only a team or
  department name.
- Date and retain the final scope determination document, ensuring it is version-controlled and accessible
  for audit review.
