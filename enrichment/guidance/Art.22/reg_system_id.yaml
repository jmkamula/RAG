must_id: item:Art.22:reg_system_id
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: System / model identifier per row
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each automated decision-making system or model in a separate row, using a unique and descriptive
  identifier for each entry.
- Document the full system or model name alongside the identifier, ensuring it matches internal documentation
  and user-facing references.
- Record the date each system or model was added to the register to provide a clear audit trail.
- Name the system or model owner as a specific individual, not a team or department, for each row in the
  register.
