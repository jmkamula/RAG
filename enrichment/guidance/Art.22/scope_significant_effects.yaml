must_id: item:Art.22:scope_significant_effects
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Test for legal or similarly significant effects (financial, employment, insurance, eligibility)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all automated decision-making processes that impact individuals, including those affecting financial
  status, employment, insurance, or eligibility for services.
- Document the specific legal or similarly significant effects for each process, referencing the relevant
  business outcome or individual impact.
- Name the responsible owner for each process as a specific individual, not a team or department.
- Record the date when each process was last reviewed for scope and impact, and retain supporting evidence
  of the review.
- Cross-reference each process to the legal basis or policy that permits automated decision-making with
  significant effects.
