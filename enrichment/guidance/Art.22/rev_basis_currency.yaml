must_id: item:Art.22:rev_basis_currency
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Basis currency check — every in-scope system still has valid Art.22.2 basis
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each automated decision-making system currently in use, including the system name, purpose, and
  date of last review.
- Document the specific Art.22.2 legal basis relied upon for each system, citing the relevant clause and
  justification.
- Confirm the validity of each legal basis by cross-referencing with up-to-date legal interpretations
  or guidance, noting the date of confirmation.
- Name the responsible individual who verified each system’s legal basis—do not use job titles, teams,
  or departments.
- Record any systems where the legal basis is unclear or expired, and document the action plan for remediation
  with assigned owners and deadlines.
