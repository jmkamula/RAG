must_id: item:Art.22:logic_disclosure
control_ref: Art.22
standard_id: GDPR:2016/679
must_text: Meaningful information about the logic involved disclosed (Art.13.2.f / 14.2.g / 15.1.h linkage)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a clear, plain-language summary explaining how the automated decision-making system works,
  including the main criteria and data used.
- Name the individual responsible for preparing and updating the explanation, ensuring this is a specific
  person and not a generic team or department.
- Record the date the explanation was last reviewed or updated, and keep previous versions for reference.
- Cross-reference the explanation in your privacy notice or data subject information materials, showing
  where individuals can access this information.
