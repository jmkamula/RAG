must_id: item:A.7.5.4:proc_retention_link
control_ref: A.7.5.4
standard_id: ISO27701:2019
must_text: Retention link to A.7.4.7
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the procedure for recording each disclosure of personally identifiable information, including
  the date, recipient, and reason for disclosure.
- Cross-reference your retention schedule to the procedure, explicitly linking how long disclosure records
  are kept to the requirements in control A.7.4.7.
- Name a specific individual responsible for maintaining and updating the disclosure recording procedure,
  avoiding generic roles like "the team" or "IT."
- Record the most recent review date and reviewer’s name on the procedure document to demonstrate its
  ongoing currency.
