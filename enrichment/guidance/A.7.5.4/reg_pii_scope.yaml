must_id: item:A.7.5.4:reg_pii_scope
control_ref: A.7.5.4
standard_id: ISO27701:2019
must_text: PII scope per row (what was disclosed)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the specific types of personally identifiable information (PII) disclosed in each event log entry,
  using clear and descriptive terms.
- Name the PII data elements per row, avoiding generic labels like "user data" or "personal info" that
  lack detail.
- Document the date and time of each disclosure event alongside the listed PII types for accurate traceability.
- Assign the responsible individual for each disclosure event, ensuring a named person is recorded, not
  just a team or department.
