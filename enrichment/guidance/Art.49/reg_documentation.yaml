must_id: item:Art.49:reg_documentation
control_ref: Art.49
standard_id: GDPR:2016/679
must_text: Per-row supporting documentation (consent capture / contract / claim doc / public-interest
  determination)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Attach a copy of the supporting document for each derogation entry, such as signed consent, contract,
  or public-interest assessment.
- Record the date and method of obtaining each supporting document, referencing the specific row in the
  Derogation Invocation Register.
- Name the individual who approved or verified the supporting documentation for each derogation, ensuring
  a specific person is listed.
- Avoid referencing generic or template documents; link only to records that directly relate to the specific
  derogation instance.
