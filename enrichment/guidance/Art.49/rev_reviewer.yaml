must_id: item:Art.49:rev_reviewer
control_ref: Art.49
standard_id: GDPR:2016/679
must_text: Reviewer identity (DPO + legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer as a specific individual, listing both the Data Protection Officer and the designated
  legal counsel by full name and job title.
- Record the date each reviewer completed their assessment in the program review document.
- Obtain and retain a signed statement or digital approval from both the DPO and legal counsel confirming
  their review of the derogations program.
- Cross-reference the reviewers’ names with your current staff directory to confirm their roles at the
  time of review.
