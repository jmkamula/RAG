must_id: item:Art.49:strict_construction
control_ref: Art.49
standard_id: GDPR:2016/679
must_text: Strict-construction discipline — EDPB Guidelines 2/2018 require narrow interpretation; derogations
  are exceptional
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the procedure that derogations are used only as exceptional measures, not as a routine or fallback
  for data transfers.
- Document the specific legal basis for each derogation, referencing the exact GDPR Article 49 paragraph
  and relevant EDPB guidance section.
- Name the decision-maker as a specific individual responsible for approving each derogation, not a group
  or department.
- Record the justification for each derogation, including why no other GDPR-compliant transfer mechanism
  was suitable, in a dated log entry.
- Attach a copy of the latest EDPB Guidelines 2/2018 to the procedure and cross-reference the relevant
  sections within the procedure text.
