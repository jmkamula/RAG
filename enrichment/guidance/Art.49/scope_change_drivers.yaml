must_id: item:Art.49:scope_change_drivers
control_ref: Art.49
standard_id: GDPR:2016/679
must_text: Trigger list (new business case requiring derogation, regulatory change)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all business cases in the past year that required a GDPR derogation, including the date and the
  specific derogation invoked.
- Record any regulatory changes in the past year that triggered a review or update of derogation use,
  with supporting documentation.
- Name the individual responsible for maintaining the derogation trigger list, ensuring this is not a
  generic team or department.
- Cross-reference each derogation trigger to the relevant policy or decision record to show the basis
  for its use.
- Document the review date and outcome for the derogation trigger list to confirm it is current and actively
  maintained.
