must_id: item:Art.37:rev_next_date
control_ref: Art.37
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the DPO Designation Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the person responsible for scheduling the next review, ensuring it is an individual,
  not a group or department.
- Document the date when the current review was completed to provide a timeline reference for the next
  planned review.
- Avoid leaving the next review date blank or using vague terms like "annually"—always specify an exact
  date.
