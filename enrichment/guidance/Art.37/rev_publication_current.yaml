must_id: item:Art.37:rev_publication_current
control_ref: Art.37
standard_id: GDPR:2016/679
must_text: Publication currency — privacy notice + SA registration still reflect current DPO contact
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Locate the current privacy notice on your website and confirm it lists the full name and contact details
  of the designated Data Protection Officer.
- Check the most recent registration or notification with your Supervisory Authority and verify the DPO
  contact information matches your privacy notice.
- Record the date when the privacy notice and Supervisory Authority registration were last updated to
  reflect any changes in DPO contact details.
- Name the DPO as a specific individual with direct contact information—do not use generic titles, group
  emails, or department names.
