must_id: item:Art.37:publication
control_ref: Art.37
standard_id: GDPR:2016/679
must_text: DPO contact published (privacy notice + SA communication per Art.37.7)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the Data Protection Officer (DPO) as a specific individual, including full name and contact details,
  in your privacy notice.
- Publish the DPO’s contact information prominently on your public-facing website and in all privacy-related
  communications.
- Document the date and method you used to notify your supervisory authority of the DPO’s appointment
  and contact details.
- Retain a copy of the communication sent to the supervisory authority as evidence of compliance with
  Article 37.7.
- Avoid listing only a generic email or department; provide a direct contact linked to a named DPO.
