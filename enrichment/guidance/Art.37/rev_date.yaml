must_id: item:Art.37:rev_date
control_ref: Art.37
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Data Protection Officer (DPO) Designation Program in a dated
  document or review log.
- State the planned review interval for the DPO Designation Program in a policy or schedule, specifying
  the frequency in months or years.
- Confirm that the actual review date falls within the planned interval by cross-referencing the review
  log and the documented schedule.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Retain evidence of the review, such as meeting minutes or a signed review checklist, showing the date
  and outcome.
