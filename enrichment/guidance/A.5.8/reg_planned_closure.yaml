must_id: item:A.5.8:reg_planned_closure
control_ref: A.5.8
standard_id: ISO27001:2022
must_text: Planned closure date per row (drives the closure-gate trigger)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Enter a planned closure date for each security action or issue listed in the Project Security Register.
- Record the name of the person responsible for setting each planned closure date next to the corresponding
  entry.
- Update the planned closure date if project timelines change, and keep a dated record of each revision.
- Avoid leaving any row with a blank or placeholder date such as "TBD" or "ongoing"; every entry must
  have a specific planned closure date.
