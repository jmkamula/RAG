must_id: item:A.5.8:reg_owner
control_ref: A.5.8
standard_id: ISO27001:2022
must_text: Project owner per row (named individual accountable for delivery + security)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the project owner for each project row as a specific individual, including full name and job title.
- Record the date each project owner is assigned in the register to show current accountability.
- Avoid listing groups, teams, or departments as project owners; use only named individuals to meet accountability
  requirements.
- Cross-reference each project owner with their contact details or personnel record to confirm identity
  and role.
