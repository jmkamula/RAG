must_id: item:A.5.8:reg_tier
control_ref: A.5.8
standard_id: ISO27001:2022
must_text: Security tier per row (drives which gates apply — full / lightweight / waived-with-justification)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a security tier to each project row in the register, using clear labels such as "full," "lightweight,"
  or "waived-with-justification."
- Record the date and name of the person who determined the security tier for each project entry.
- Document the justification for any project marked as "waived-with-justification," including a brief
  risk assessment and approval reference.
- Name the owner of the register as a specific individual, not a generic team or department.
- Cross-reference each project’s security tier to the documented criteria or policy that defines the tiering
  process.
