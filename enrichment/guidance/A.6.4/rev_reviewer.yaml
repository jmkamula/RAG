must_id: item:A.6.4:rev_reviewer
control_ref: A.6.4
standard_id: ISO27001:2022
must_text: Reviewer identity (HR lead + InfoSec lead + Legal counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the reviewer for each discipline process review as a specific individual from HR, Information Security,
  and Legal, not just by job title.
- Record the date each reviewer completed their part of the process review in a version-controlled document.
- Collect signatures or written approvals from all three named reviewers on the final review summary.
- Retain the review summary and approvals in a location accessible to auditors and management.
