must_id: item:8.3:rev_next_date
control_ref: '8.3'
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Treatment Execution Program in the review document, using
  a clear and specific calendar date.
- Record the name of the individual responsible for scheduling the next review, not just a role or department.
- Document the date the current review was completed to show the review cycle and support the planned
  next review date.
- Avoid leaving the next review date blank or using vague terms like "annually"; specify an exact date
  auditors can verify.
