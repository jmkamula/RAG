must_id: item:8.3:rev_reviewer
control_ref: '8.3'
standard_id: ISO27001:2022
must_text: Reviewer identity (Risk Manager + ISMS Manager + ops lead)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer by full name and job title in the Treatment Execution Program Review document.
- Record the date each reviewer completed their review next to their name in the document.
- Obtain a signature or written confirmation from the Risk Manager, ISMS Manager, and operations lead
  to evidence their participation.
- Avoid listing roles or teams as reviewers; specify individual people to meet accountability requirements.
