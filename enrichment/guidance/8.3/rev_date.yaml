must_id: item:8.3:rev_date
control_ref: '8.3'
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Treatment Execution Program in a dated log or register entry.
- State the planned review interval in months or years within the program documentation.
- Cross-reference the actual review date against the planned interval to confirm it falls within the required
  timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain evidence of the completed review, such as meeting minutes or a signed review checklist, with
  the corresponding date.
