must_id: item:8.3:proc_status_cadence
control_ref: '8.3'
standard_id: ISO27001:2022
must_text: Status-reporting cadence (typically monthly for active items)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the required status-reporting frequency for active treatment items in the procedure, specifying
  "monthly" or another defined interval.
- Assign a named individual responsible for preparing and submitting each status report, avoiding vague
  roles like "the team" or "management".
- Record the date of each status report submission in a log or register, ensuring each entry is linked
  to the relevant treatment item.
- Retain copies of submitted status reports, including evidence of review or acknowledgment by management,
  for each reporting period.
