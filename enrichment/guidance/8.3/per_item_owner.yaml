must_id: item:8.3:per_item_owner
control_ref: '8.3'
standard_id: ISO27001:2022
must_text: Per-treatment-item owner identified
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the owner for each operational risk treatment item, avoiding generic labels
  such as "the team" or a department.
- Record the owner's full name and job title next to each risk treatment item in the operational risk
  register.
- Document the date when the owner was assigned responsibility for each treatment item in the register.
- Review and update the owner assignment whenever there is a change in personnel or role, keeping a dated
  record of changes.
