must_id: item:A.6.1:rev_next_date
control_ref: A.6.1
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the periodic screening program in the official review schedule
  document.
- Record the date in a version-controlled document or register that tracks all review cycles for the screening
  program.
- Name the individual responsible for confirming the next review date, avoiding generic titles like "HR"
  or "the team".
- Retain evidence of the last review meeting where the next date was agreed, such as meeting minutes or
  an email confirmation.
