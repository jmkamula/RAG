must_id: item:A.7.3.3:rev_date
control_ref: A.7.3.3
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Notice Delivery Program in a dated log entry.
- Document the planned review interval in months or years within the program documentation.
- Compare the actual review date to the planned interval and note any deviations in a review tracking
  sheet.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain evidence of the review, such as meeting minutes or a signed checklist, with the corresponding
  date.
