must_id: item:A.5.4:risk_awareness
control_ref: A.5.4
standard_id: ISO27001:2022
must_text: Expectation that personnel report identified risks and incidents (link to A.6.8)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State in the management directive that all personnel are required to report identified information security
  risks and incidents promptly.
- Name the individual or role responsible for receiving and responding to reported risks and incidents
  within the directive.
- Reference the specific reporting procedure or channel personnel must use, such as an incident reporting
  form or email address.
- Specify that the directive version is dated and approved by a named member of senior management.
- Avoid using vague language such as "report as appropriate"—clearly define what must be reported and
  how.
