must_id: item:A.5.4:review_next_date
control_ref: A.5.4
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the management directive in the document header or footer.
- Record the date of the last review alongside the next planned review date in the document revision history.
- Name the individual responsible for scheduling the next review, using a specific person’s name rather
  than a role or team.
- Confirm the review schedule is approved by a named manager, with a signature and date on the document.
