must_id: item:A.5.4:comm_refresh
control_ref: A.5.4
standard_id: ISO27001:2022
must_text: Periodic re-acknowledgement referenced (annual at minimum)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the required re-acknowledgement frequency in the management directive, specifying "annual" or
  a more frequent interval.
- Document the date and method of each communication to staff, including email, intranet post, or meeting
  minutes.
- Record each individual's acknowledgement with a dated signature or electronic confirmation, not just
  a group attendance list.
- Name the responsible individual overseeing the acknowledgement process, avoiding generic titles like
  "HR" or "management team".
- Retain evidence of periodic reminders or follow-ups for staff who have not completed re-acknowledgement
  within the set timeframe.
