must_id: item:A.5.4:approval_signatory
control_ref: A.5.4
standard_id: ISO27001:2022
must_text: Signatory at top-management level (CEO, board chair, or delegated equivalent)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the signatory as a specific individual at top management level, such as the CEO, board chair, or
  formally delegated equivalent.
- Record the date the InfoSec Directive was approved and signed by the identified top management representative.
- Attach the signed and dated InfoSec Directive to your policy register or document repository for reference.
- Confirm that any delegation of signing authority is documented and includes the delegate’s name, title,
  and scope of authority.
