must_id: item:A.5.4:review_date
control_ref: A.5.4
standard_id: ISO27001:2022
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the management directive in a central log, including the name
  of the reviewer and the review outcome.
- State the planned review interval in the directive document, specifying the frequency in months or years.
- Confirm the next scheduled review date is set and documented, falling within the defined interval from
  the last completed review.
- Name the reviewer as a specific individual, not a group or department, in the review record.
- Retain evidence of the review, such as meeting minutes or a signed review checklist, showing the review
  took place on the recorded date.
