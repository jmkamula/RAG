must_id: item:A.5.36:nc_status
control_ref: A.5.36
standard_id: ISO27001:2022
must_text: Current status per NC (open / in-progress / closed / aged-overdue / risk-accepted-with-exception)
  with last-updated date
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the current status of each nonconformity in the register using clear terms such as open, in-progress,
  closed, aged-overdue, or risk-accepted-with-exception.
- Enter the last-updated date for each nonconformity status, ensuring the date field is never left blank
  or marked as "ongoing."
- Name a specific individual responsible for updating each nonconformity entry, avoiding generic roles
  like "the team" or "compliance department."
- Review the register regularly and update statuses to reflect actual progress, not leaving items in "in-progress"
  indefinitely without review.
- Retain a change log or history showing previous statuses and update dates for each nonconformity to
  demonstrate ongoing management.
