must_id: item:A.5.36:pgm_method_review
control_ref: A.5.36
standard_id: ISO27001:2022
must_text: Method effectiveness review — are the chosen methods surfacing real nonconformities, or is
  the program rubber-stamping?
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a named individual to conduct the meta-review of the compliance review program, recording their
  name and date in the review log.
- Document the specific methods used to identify nonconformities, referencing actual findings and corrective
  actions from recent compliance reviews.
- Compare the number and severity of nonconformities found over time, noting any patterns that suggest
  underreporting or superficial reviews.
- Record any adjustments made to the review methods as a result of the meta-review, including rationale
  and approval by a designated authority.
- Name the reviewer as a specific person—do not list a team, department, or leave the owner field blank.
