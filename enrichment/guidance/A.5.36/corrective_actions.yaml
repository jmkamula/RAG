must_id: item:A.5.36:corrective_actions
control_ref: A.5.36
standard_id: ISO27001:2022
must_text: Corrective actions opened per nonconformity finding (with owner, target date) — feeds the nonconformity
  register
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each nonconformity finding in a dated compliance review log, including a clear description of
  the issue identified.
- Assign a named individual as the owner responsible for addressing each nonconformity, avoiding generic
  labels like "the team" or "IT."
- Document a specific corrective action for each nonconformity, including a realistic target completion
  date.
- Cross-reference each corrective action entry to the corresponding item in the nonconformity register
  to ensure traceability.
- Retain evidence of follow-up, such as status updates or closure confirmation, signed or acknowledged
  by the assigned owner.
