must_id: item:A.5.36:pgm_a535_alignment
control_ref: A.5.36
standard_id: ISO27001:2022
must_text: Alignment check with A.5.35 independent review program (shared reviewer pool? shared finding
  register? leverage opportunities)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Cross-reference the list of reviewers for both the compliance review program and the independent review
  program, and record any individuals serving in both roles.
- Document whether findings from both programs are logged in a shared register or separate registers,
  including the location and access details for each.
- State any processes or tools that are shared between the two programs, such as scheduling systems or
  reporting templates, and provide supporting documentation.
- Name the person responsible for coordinating alignment between the two programs, ensuring this is a
  specific individual rather than a team or department.
- Record the date and outcome of the most recent meta-review that checked for alignment between the compliance
  and independent review programs.
