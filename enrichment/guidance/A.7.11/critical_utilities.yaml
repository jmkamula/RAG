must_id: item:A.7.11:critical_utilities
control_ref: A.7.11
standard_id: ISO27001:2022
must_text: Critical utilities identified (power, cooling, water, communications, gas where relevant)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all supporting utilities essential for your operations, such as power, cooling, water, communications,
  and gas, in a dated inventory document.
- Name the owner responsible for maintaining and updating the utilities inventory as a specific individual,
  not a team or department.
- Record the date and method of the most recent review of the utilities list, including any changes or
  updates made.
- Cross-reference each utility in the inventory to its corresponding continuity or contingency procedure,
  noting document titles and version numbers.
