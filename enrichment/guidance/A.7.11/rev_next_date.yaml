must_id: item:A.7.11:rev_next_date
control_ref: A.7.11
standard_id: ISO27001:2022
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the utilities program in the review documentation, specifying
  day, month, and year.
- Record the name of the individual responsible for scheduling the next review, not just a team or department.
- Document the date when the current review was completed to provide a clear timeline for the next review
  cycle.
- Cross-reference the stated next review date in the program review log or calendar to ensure consistency
  across records.
