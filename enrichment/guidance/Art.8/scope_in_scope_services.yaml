must_id: item:Art.8:scope_in_scope_services
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Services in scope enumerated (those advertised to / used by minors directly)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all information-society services your organisation offers that are accessible to or marketed towards
  individuals under 16, with service names and descriptions.
- Document the intended user age group for each listed service, including any minimum age requirements
  stated in public materials.
- Record the date this scope assessment was last reviewed and the name of the person who completed it.
- Name the owner as a specific individual responsible for maintaining and updating the services-in-scope
  list — not a team or department.
- Attach copies or screenshots of advertisements, website pages, or app store listings that show services
  are promoted to or accessible by minors.
