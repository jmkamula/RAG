must_id: item:Art.8:reg_parental_evidence
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Per-row parental-authority evidence (where parental route used)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the full name and contact details of the parent or legal guardian who provided consent in each
  register entry.
- Attach a dated copy of the evidence used to verify parental authority, such as a birth certificate or
  guardianship document, for each child.
- State the method used to confirm parental relationship for each entry, specifying the document or process
  referenced.
- Name the staff member who verified the parental authority, ensuring a specific individual is listed
  rather than a team or department.
- Retain a timestamped record of when parental authority was last checked or updated for each child in
  the register.
