must_id: item:Art.8:scope_change_drivers
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Trigger list for re-scoping (new product line touching minors, new Member State entry)
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all current information-society services offered, including details on target user age groups and
  countries of operation, in a dated register.
- Document a trigger list specifying events that require re-scoping, such as launching a new product line
  for minors or entering a new EU country.
- Assign a named individual responsible for monitoring business changes and initiating re-scoping when
  a trigger event occurs.
- Record each review of the trigger list with the review date and the reviewer’s name to show regular
  assessment.
- Name the owner of the trigger list as a specific person, not a team or department, to avoid ambiguity.
