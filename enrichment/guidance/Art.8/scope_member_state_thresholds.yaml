must_id: item:Art.8:scope_member_state_thresholds
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Member State age threshold variations (where org operates in multiple Member States)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all Member States where your service is offered and record the local legal age threshold for each
  in a dated register.
- Reference the specific national law or regulation that sets the age threshold for each Member State
  in your documentation.
- Assign a named individual responsible for monitoring changes to age threshold laws in each relevant
  Member State.
- Avoid using a single, generic age threshold for all countries; document country-specific thresholds
  to prevent auditor findings of non-compliance.
