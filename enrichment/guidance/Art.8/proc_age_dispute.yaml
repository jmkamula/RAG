must_id: item:Art.8:proc_age_dispute
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Dispute-handling pathway when claimed age differs from verified evidence
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document a clear step-by-step process for handling disputes when a claimed age does not match verified
  evidence, including escalation points.
- Assign a named individual responsible for reviewing and resolving each age dispute, recording their
  name and decision date in a dispute log.
- Record all supporting evidence and correspondence related to each dispute in a central, access-controlled
  location.
- State the resolution outcome in writing, including the rationale, and provide this to the claimant with
  a dated record.
- Name the dispute handler as a specific person, not a generic role or team, to avoid ambiguity in responsibility.
