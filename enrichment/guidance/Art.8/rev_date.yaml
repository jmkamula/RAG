must_id: item:Art.8:rev_date
control_ref: Art.8
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Child Consent Program in a dated log or review tracker.
- Document the planned review interval for the Child Consent Program, referencing the approved policy
  or schedule.
- Confirm the review was completed within the planned interval by cross-referencing the actual review
  date with the scheduled date.
- Name the reviewer as a specific individual, not a group or department, in the review record.
