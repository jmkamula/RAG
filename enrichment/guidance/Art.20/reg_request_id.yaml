must_id: item:Art.20:reg_request_id
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Per-row request id (Art.12 register cross-reference)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Assign a unique request ID to each entry in the Portability Request Register and record it in a dedicated
  column.
- Cross-reference each request ID with the corresponding entry in the Article 12 Register to enable traceability
  between records.
- Document the date each portability request is received alongside the request ID for clear chronological
  tracking.
- Name the responsible staff member handling each request by full name, not just a team or department
  label.
