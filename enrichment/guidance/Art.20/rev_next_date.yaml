must_id: item:Art.20:rev_next_date
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Portability Program in the review document, using a clear
  and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review within the
  same document.
- Sign and date the review document to confirm when the next review date was set and by whom.
- Avoid listing the next review date as "TBD" or "annually"—use a concrete date to meet auditor expectations.
