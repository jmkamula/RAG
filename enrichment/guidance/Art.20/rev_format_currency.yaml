must_id: item:Art.20:rev_format_currency
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Export format currency — chosen format still commonly used industry-wide
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the chosen data export format in the Portability Program Review, specifying the file type and
  version used.
- Name the industry standards or guidelines referenced when selecting the export format, such as CSV,
  JSON, or XML.
- Record the date of the most recent review confirming the export format is still widely used in your
  sector.
- Assign a specific individual responsible for monitoring changes in industry data export practices and
  updating the format if needed.
- Avoid using a proprietary or obsolete format—state explicitly that the format is open and recognized
  across the industry.
