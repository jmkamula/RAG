must_id: item:Art.20:export_format
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Export format documented (JSON / CSV / XML — machine-readable, structured, commonly used)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the specific export formats offered for personal data requests, listing each format by name
  (e.g., JSON, CSV, XML) in the procedure.
- State in the procedure that all formats used are machine-readable, structured, and commonly used, referencing
  relevant technical standards where applicable.
- Name the person responsible for approving any changes to export formats, identifying them as an individual,
  not a team or department.
- Attach a sample export file for each format listed, showing real or dummy data in the documented structure.
