must_id: item:Art.20:rev_date
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of your data portability program in a dated log or review register.
- Name the reviewer as a specific individual responsible for the program review, not a group or department.
- Document the planned review interval for the portability program and cross-reference it with your actual
  review dates.
- Attach evidence of the completed review, such as a signed review report or meeting minutes, to the program
  documentation.
- Flag any overdue reviews with an explanation and corrective action, rather than leaving gaps or undated
  entries.
