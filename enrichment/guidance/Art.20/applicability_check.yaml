must_id: item:Art.20:applicability_check
control_ref: Art.20
standard_id: GDPR:2016/679
must_text: Applicability assessment per request (basis = consent/contract AND automated processing)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the legal basis for each data portability request, specifying whether consent or contract applies,
  in a dated assessment record.
- Record whether the personal data in question is subject to automated processing, referencing relevant
  system or processing documentation.
- Name the individual who performed the applicability assessment for each request, avoiding group or departmental
  attributions.
- Retain a copy of the completed assessment alongside the original data portability request for future
  reference.
