must_id: item:A.7.4.5:rev_reviewer
control_ref: A.7.4.5
standard_id: ISO27701:2019
must_text: Reviewer identity (DPO + Data Ops + Infrastructure)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name each reviewer involved in the end-of-processing program review, specifying the Data Protection
  Officer, Data Operations lead, and Infrastructure lead by full name.
- Record the date each reviewer completed their review in a dated review log or meeting minutes.
- Obtain a signature or written approval from each named reviewer confirming their participation in the
  review.
- Avoid listing roles or teams only; always identify reviewers as specific, named individuals.
