must_id: item:A.7.4.5:rev_trigger_health
control_ref: A.7.4.5
standard_id: ISO27701:2019
must_text: Trigger health — end-of-processing detection functioning across activity types
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the automated or manual triggers used to detect when processing activities have ended, listing
  each activity type covered.
- Record the date and outcome of the most recent review that tested these end-of-processing triggers for
  effectiveness.
- Name the individual responsible for monitoring and updating end-of-processing detection, avoiding generic
  titles like "IT" or "the team".
- Retain logs or screenshots showing at least one detected end-of-processing event for each activity type
  within the last review cycle.
