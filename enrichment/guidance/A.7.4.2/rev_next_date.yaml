must_id: item:A.7.4.2:rev_next_date
control_ref: A.7.4.2
standard_id: ISO27701:2019
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Processing Limitation Program in the review documentation,
  using a clear and specific calendar date.
- Record the name of the individual responsible for scheduling and conducting the next review, not just
  a department or team.
- Retain the document or meeting minutes where the next review date was discussed and agreed upon, with
  all participants listed.
- Cross-reference the stated review date in the Processing Limitation Program with your organization’s
  compliance calendar or tracking tool.
