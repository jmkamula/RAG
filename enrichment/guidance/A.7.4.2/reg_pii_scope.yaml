must_id: item:A.7.4.2:reg_pii_scope
control_ref: A.7.4.2
standard_id: ISO27701:2019
must_text: PII scope per row (which fields / categories)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List each processing operation in the inventory as a separate row, clearly describing the activity being
  performed.
- Specify the exact types or categories of personal data collected or processed for each operation, such
  as name, email, or health data.
- Name the PII fields for each operation, avoiding generic terms like "user data" or "personal info" that
  lack detail.
- Record the date each row was last updated to show the inventory is current and actively maintained.
