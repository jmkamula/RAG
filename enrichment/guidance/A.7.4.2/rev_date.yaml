must_id: item:A.7.4.2:rev_date
control_ref: A.7.4.2
standard_id: ISO27701:2019
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Processing Limitation Program in a dated log or meeting minutes.
- Document the planned review interval in months or years within the program documentation or policy.
- Cross-reference the actual review date against the planned interval to confirm it falls within the required
  timeframe.
- Name the reviewer as a specific individual, not a group or department, in the review documentation.
- Retain evidence of the completed review, such as a signed summary or approval, with the date clearly
  visible.
