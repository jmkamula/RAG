must_id: item:Art.41:rev_reviewer
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Reviewer identity (executive sponsor + independent counsel)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the executive sponsor responsible for the code monitoring program review as a specific individual,
  not a group or department.
- Document the identity of the independent counsel involved in the review, including their full name and
  professional credentials.
- Record the date when both the executive sponsor and independent counsel formally acknowledged their
  roles in the review process.
- Retain signed statements from both parties confirming their participation and independence in the review.
