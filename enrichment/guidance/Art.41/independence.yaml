must_id: item:Art.41:independence
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Independence from adherents demonstrated (Art.41.2.a)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name the individuals responsible for the monitoring body’s decisions, listing their roles and confirming
  none are employed by or report to adherent organizations.
- Document the process used to select monitoring body members, including criteria that exclude current
  or recent employees of adherent organizations.
- Record a signed statement from each monitoring body member declaring no conflicts of interest with any
  adherent organization.
- Attach meeting minutes where the monitoring body’s independence was discussed and confirmed by a majority
  vote, including dates and attendees.
- Avoid describing the monitoring body as “independent” without supporting evidence—auditors will flag
  unsupported or generic claims.
