must_id: item:Art.41:reg_appeal
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Per-row appeal handling where adherent contests the outcome
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record each appeal by an adherent contesting a code monitoring outcome in a dated entry, including the
  original decision and grounds for appeal.
- Assign a named, independent reviewer to each appeal, ensuring the reviewer is not the original decision-maker.
- Document the appeal review process, including all correspondence, evidence considered, and the rationale
  for the final decision.
- State the final appeal outcome and date in the record, and notify the adherent in writing with a copy
  of the decision.
- Name the reviewer as a specific individual—do not use generic labels like "the team" or "compliance
  department".
