must_id: item:Art.41:procedures
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Procedures for assessing eligibility + monitoring + complaint handling (Art.41.2.c-d)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the step-by-step process for assessing eligibility of applicants, including required qualifications
  and decision criteria, in a dated procedure manual.
- Name the individual responsible for ongoing monitoring of code compliance, listing their full name and
  role in the procedure documentation.
- Record the complaint handling process, including intake channels, response timelines, and escalation
  steps, in a version-controlled document.
- State how and where all decisions and actions related to eligibility, monitoring, and complaints are
  logged, referencing a specific register or system.
- Specify that all owners and responsible persons are named as individuals, not as teams or departments,
  to avoid ambiguity in accountability.
