must_id: item:Art.41:scope_codes_monitored
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Codes monitored enumerated
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all codes of conduct that fall under the monitoring body’s oversight in a dated document.
- Name the specific monitoring body responsible for each code, including a named individual as the primary
  contact.
- Record the date when each code was formally accepted for monitoring by the body.
- Avoid referencing codes in generic terms; specify the exact title and version of each code in your enumeration.
