must_id: item:Art.41:transparent_procedures
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Procedures published / transparent
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Publish the Code Monitoring Body Procedure on your organisation’s public website, including the latest
  version number and publication date.
- Document the procedure’s location in a central policy register, cross-referencing the exact URL or physical
  location.
- Name a specific individual responsible for maintaining and updating the published procedure, avoiding
  generic titles or teams.
- Record the date and method of the most recent communication to stakeholders about the procedure’s availability
  and transparency.
