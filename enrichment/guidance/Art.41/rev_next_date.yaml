must_id: item:Art.41:rev_next_date
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Next planned review date stated
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- State the next planned review date for the Code Monitoring Program in the review documentation, using
  a clear and specific calendar date.
- Record the name of the person responsible for scheduling the next review, not just a role or department.
- Retain the dated record of the most recent review alongside the stated next review date in the same
  document.
- Avoid leaving the next review date blank or marked as "TBD"—always enter a definite date.
