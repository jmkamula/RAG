must_id: item:Art.41:coi_management
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: COI management (Art.41.2.e)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual responsible for managing conflicts of interest in the monitoring body, listing
  their full name and job title in the procedure.
- Document the step-by-step process for identifying, disclosing, and addressing conflicts of interest,
  including required forms or declarations.
- Record all conflict of interest disclosures and their resolutions in a dated register, accessible for
  audit and review.
- Require all monitoring body members to sign an annual statement confirming they have read and understood
  the conflict of interest procedure.
- Specify that generic or boilerplate statements about conflicts of interest are not acceptable; tailor
  the procedure to your organisation’s actual risks and structure.
