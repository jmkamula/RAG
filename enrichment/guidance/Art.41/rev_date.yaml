must_id: item:Art.41:rev_date
control_ref: Art.41
standard_id: GDPR:2016/679
must_text: Review date within the planned interval
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Record the most recent review date of the Code Monitoring Program in a dated log or register.
- Compare the recorded review date against the planned review interval stated in your compliance schedule.
- Document the name of the individual who conducted the review, not just their job title or department.
- Attach evidence of the completed review, such as a signed report or meeting minutes, to the program
  documentation.
