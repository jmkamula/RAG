must_id: item:A.5.9:asset_type
control_ref: A.5.9
standard_id: ISO27001:2022
must_text: Asset type tag (information / software / hardware / service / facility) so type-specific controls
  can be applied
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-06'
guidance:
- 'List each asset in the inventory with a unique identifier and a clearly assigned asset type: information,
  software, hardware, service, or facility.'
- Document the asset type for every entry in a dedicated column or field, ensuring the type is visible
  and unambiguous.
- Name the asset owner as a specific individual, not a team or department, for each asset listed.
- Review the inventory to confirm no asset is missing a type tag or has a generic or unclear category.
