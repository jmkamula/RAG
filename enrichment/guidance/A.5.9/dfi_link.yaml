must_id: item:A.5.9:dfi_link
control_ref: A.5.9
standard_id: ISO27001:2022
must_text: Cross-link to GDPR Art.30 data flow inventory where the asset holds personal data
category: should
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Identify each asset in your information asset inventory that holds personal data, listing them individually
  with clear asset names.
- Cross-reference each relevant asset entry to the corresponding record in your GDPR Article 30 data flow
  inventory, using a unique identifier or link.
- Record the date and name of the person responsible for verifying the cross-link between the asset inventory
  and the GDPR data flow record.
- Name the owner of each asset as a specific individual, not a generic role or team, to avoid ambiguity
  in accountability.
- Document any assets reviewed that do not hold personal data, noting this explicitly to show completeness
  of the cross-linking process.
