must_id: item:A.5.9:proc_maintainer
control_ref: A.5.9
standard_id: ISO27001:2022
must_text: Named maintainer of the register and escalation path when intake fails
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Name a specific individual as the maintainer of the asset register, listing their full name and job
  title in the procedure document.
- Document the escalation path with named roles and contact details to follow when asset intake requests
  are not completed as expected.
- Record the date the maintainer and escalation path were last reviewed or updated in the procedure.
- Avoid listing the owner as "the team" or a department; always specify a single accountable person.
