must_id: item:A.5.9:disc_scope_coverage
control_ref: A.5.9
standard_id: ISO27001:2022
must_text: Coverage statement — what categories of assets each source covers and where gaps exist (e.g.,
  personal devices, OT)
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- List all asset discovery sources and specify which asset categories each one identifies, referencing
  a dated inventory or mapping document.
- Document any asset categories not covered by current discovery sources, such as personal devices or
  operational technology, in a gap analysis record.
- Name the person responsible for maintaining the coverage statement as a specific individual, not a team
  or department.
- Review and update the coverage statement at least annually, recording the review date and the reviewer’s
  name.
