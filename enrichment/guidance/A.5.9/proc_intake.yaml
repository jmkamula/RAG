must_id: item:A.5.9:proc_intake
control_ref: A.5.9
standard_id: ISO27001:2022
must_text: Intake path — every new asset (procured, built, granted) is registered before going operational
category: must
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-05'
guidance:
- Document the intake process by listing each step required to register a new asset before it is used
  in operations.
- Assign a named individual responsible for verifying and recording each new asset in the asset register.
- Record the registration date and asset details in the asset register, linking to procurement or build
  documentation.
- Name the asset owner as a specific person, not a team or department, in the asset register entry.
- Retain evidence of completed registration, such as a signed or digitally approved intake form for each
  asset.
