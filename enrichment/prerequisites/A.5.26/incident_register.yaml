leaf_id: req:A.5.26:incident_register
control_ref: A.5.26
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The incident register must only cover incidents relevant to the defined ISMS scope. Without
    a clear scope, you can't determine which incidents belong in the register.
  good_enough: A current, approved scope statement that clearly defines the organizational and system
    boundaries for the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that incident ownership, reporting, and follow-up actions
    are tracked and accountable in the register.
  good_enough: A documented list of roles with assigned responsibilities for incident management, even
    if not fully detailed for every scenario.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets are in scope is essential for logging incidents against the correct
    systems, data, or services in the register.
  good_enough: A basic, up-to-date inventory of key assets covered by the ISMS, sufficient to link incidents
    to affected assets.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding current risks helps prioritize which incidents are significant and should be
    tracked in detail in the register.
  good_enough: A recent risk assessment identifying major threats and vulnerabilities, even if not exhaustive.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Incident severity and required response often depend on the classification of affected information;
    this must be known to record incidents accurately.
  good_enough: A documented scheme for classifying information, with at least basic categories in use.
