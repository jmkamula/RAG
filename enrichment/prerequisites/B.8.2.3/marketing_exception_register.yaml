leaf_id: req:B.8.2.3:marketing_exception_register
control_ref: B.8.2.3
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which business units, processes, and data types are covered by
    your ISMS and privacy extension. You need to know if marketing activities and customer PII are in-scope
    before tracking exceptions.
  good_enough: A documented scope that clearly includes (or excludes) marketing and customer PII processing.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know and document the specific purposes for which customer PII is processed, including
    whether marketing is a permitted purpose. This underpins any exception register.
  good_enough: A list or register of all processing purposes, with marketing explicitly addressed (even
    if the answer is "not permitted").
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: For each processing purpose, you must identify the lawful basis (e.g., consent, legitimate
    interest) before authorising marketing uses of PII. This ensures exceptions are legally justified.
  good_enough: Each purpose in the register has a mapped lawful basis, with marketing either justified
    or explicitly excluded.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of privacy and marketing responsibilities is essential to ensure only authorised
    individuals can approve or record marketing exceptions.
  good_enough: Documented roles showing who can authorise, review, and maintain the marketing exception
    register.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: You need to know which information assets contain customer PII that could be used for marketing,
    so you can accurately record exceptions.
  good_enough: An asset inventory that identifies systems and datasets containing customer PII relevant
    to marketing activities.
