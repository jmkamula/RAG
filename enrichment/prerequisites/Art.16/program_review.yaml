leaf_id: req:Art.16:program_review
control_ref: Art.16
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date record of processing activities to identify which systems and data
    flows are subject to rectification requests. Without this, you can't verify if all relevant systems
    are covered in the annual review.
  good_enough: A current RoPA exists, listing all key systems and processing activities relevant to data
    subjects’ rights.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis
  category: foundational
  rationale: Knowing the lawful basis for each processing activity is essential to determine if and how
    rectification rights apply. This ensures the review checks compliance with the correct obligations.
  good_enough: Each processing activity in the RoPA has a documented lawful basis, even if not fully mapped
    to every data flow.
- ref: Art.19
  standard_id: GDPR:2016/679
  title: Notification Obligation regarding Rectification
  category: direct
  rationale: The annual review must verify that Art.19 notifications (informing recipients of rectification)
    are being sent as required. Understanding this obligation is necessary to check if the process is
    working.
  good_enough: A basic process exists for notifying recipients of rectification, with at least one example
    or template notification on file.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a DPO is required, their involvement is key for overseeing and reviewing rectification
    processes. The review should confirm DPO oversight where applicable.
  good_enough: A DPO is designated (if required) and their contact details are documented, even if their
    involvement in reviews is still being formalized.
