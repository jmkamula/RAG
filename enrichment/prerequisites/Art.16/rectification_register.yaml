leaf_id: req:Art.16:rectification_register
control_ref: Art.16
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a clear, up-to-date record of processing activities to identify which data subjects
    and data types are in scope for rectification requests. Without this, you can't reliably track or
    evidence rectification actions.
  good_enough: A basic, current RoPA that lists all major processing activities and contact points is
    sufficient to begin drafting the rectification register.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis
  category: foundational
  rationale: Understanding the lawful basis for each processing activity helps determine if and how rectification
    requests should be handled, especially if certain requests may impact compliance with legal obligations.
  good_enough: A summary table or documented mapping of lawful bases for main processing activities is
    enough to proceed.
- ref: Art.16
  standard_id: GDPR:2016/679
  title: Right to Rectification Procedure
  category: direct
  rationale: A documented procedure for handling rectification requests is essential, as the register
    must evidence that each request was processed according to this procedure.
  good_enough: A draft or outline of the rectification request handling process (steps, roles, timelines)
    is sufficient to start building the register.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a DPO is required, their involvement in overseeing or recording rectification requests
    must be clear, as they may be responsible for maintaining the register or ensuring its accuracy.
  good_enough: A named DPO or designated privacy lead with contact details is enough to unblock the register
    drafting.
