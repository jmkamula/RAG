leaf_id: req:B.8.2.4:program_review
control_ref: B.8.2.4
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which processes, systems, and data are covered by the ISMS and
    PIMS, ensuring the program review addresses all relevant areas where infringing instructions could
    occur.
  good_enough: A clear, current scope statement exists that includes privacy management activities and
    relevant data processing operations.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Defined roles and responsibilities are essential so that review, notification, and escalation
    duties for infringing instructions are assigned and understood.
  good_enough: Documented assignments exist for who manages, reviews, and escalates infringing instruction
    issues.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Knowing the documented purposes for processing personal data is necessary to identify what
    constitutes an infringing instruction and to review whether triggers and notifications are aligned.
  good_enough: There is a maintained list of processing purposes for all relevant data activities.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The lawful basis for processing must be established to determine when an instruction is infringing
    and to ensure review and escalation mechanisms are appropriate.
  good_enough: Lawful bases for all processing activities are documented and accessible to those conducting
    the review.
