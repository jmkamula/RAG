leaf_id: req:Art.85:program_review
control_ref: Art.85
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date record of processing activities to identify which operations may require
    or rely on national-law derogations under Art.85. Without this, you can't verify if all relevant activities
    are covered.
  good_enough: A current, reasonably complete RoPA that lists all processing activities in scope for GDPR,
    with enough detail to flag those potentially affected by Art.85 derogations.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis
  category: foundational
  rationale: Understanding the lawful basis for each processing activity is essential to determine if
    a derogation under Art.85 is being used or required. This ensures no activity is missing its legal
    justification.
  good_enough: Each processing activity in the RoPA has a documented lawful basis, even if provisional,
    so you can check for any that depend on Art.85 derogations.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: A clear ISMS scope ensures you know which parts of your organization and which activities
    are subject to GDPR and, by extension, Art.85 review. This avoids missing in-scope activities.
  good_enough: A documented ISMS scope that covers all business units and activities potentially subject
    to GDPR, even if not fully detailed.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a Data Protection Officer is required, they must be involved in the Art.85 review process.
    Their designation ensures accountability and proper oversight.
  good_enough: A named DPO (or documented rationale for not appointing one) with contact details, so responsibility
    for GDPR reviews is clear.
