leaf_id: req:Art.85:derogation_application_procedure
control_ref: Art.85
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date record of all processing activities to identify which ones might fall
    under the journalism, academic, artistic, or literary expression derogations. Without this, you can't
    reliably scope or apply Art.85.
  good_enough: A current, reasonably complete RoPA that lists all processing activities and their purposes,
    even if some details are pending clarification.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Understanding and documenting the lawful basis for each processing activity is essential
    before determining if and how Art.85 derogations apply. This ensures you don't misapply derogations
    where a standard lawful basis is required.
  good_enough: Each processing activity should have a provisional lawful basis assigned, with notes on
    any uncertainties.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer Designation
  category: foundational
  rationale: If a DPO is required, their involvement is critical in reviewing and overseeing the application
    of Art.85 derogations, especially given the legal and reputational risks.
  good_enough: A named DPO or clear documented rationale for why a DPO is not required, with contact details
    or escalation path.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: Clarity on the organisational and jurisdictional scope ensures the Art.85 procedure covers
    all relevant operations and Member States, avoiding gaps in derogation application.
  good_enough: A documented scope statement that identifies the business units, jurisdictions, and activities
    covered by the ISMS and privacy program.
