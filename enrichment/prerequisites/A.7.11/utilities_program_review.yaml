leaf_id: req:A.7.11:utilities_program_review
control_ref: A.7.11
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which sites, systems, and operations are in-scope for the ISMS to determine
    which utilities (power, water, HVAC, etc.) must be covered by the review.
  good_enough: A current, approved scope statement that clearly lists all relevant physical and logical
    locations is available.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A complete asset register is essential to identify which facilities, systems, and supporting
    utilities are critical and require periodic review.
  good_enough: An up-to-date list of assets, including facilities and their dependencies on utilities,
    is maintained and accessible.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that someone is accountable for conducting and documenting
    the utilities program review.
  good_enough: Documented responsibilities exist for utilities management and review, even if not yet
    fully embedded in job descriptions.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment results help prioritize which utilities and sites require the most attention
    during the review, based on business impact.
  good_enough: A recent risk assessment exists that identifies utility-related risks for in-scope assets,
    even if mitigation actions are still in progress.
