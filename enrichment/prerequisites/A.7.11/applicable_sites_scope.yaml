leaf_id: req:A.7.11:applicable_sites_scope
control_ref: A.7.11
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need a clear ISMS scope to determine which sites are covered by the management system
    and, therefore, which sites should be considered for utility continuity planning.
  good_enough: A documented scope statement that lists all sites and business units included in the ISMS,
    even if some boundaries are still being finalized.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register helps identify which physical locations (sites) house critical
    assets, informing which sites must be included in the continuity scope.
  good_enough: A basic inventory of key sites and their major assets, not necessarily fully detailed,
    but enough to identify which locations are relevant for continuity.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment highlights which sites face significant utility-related risks, helping
    prioritize and justify their inclusion in the continuity scope.
  good_enough: A preliminary risk assessment that identifies major utility risks per site, even if some
    risk ratings or controls are still being refined.
