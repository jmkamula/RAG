leaf_id: req:B.8.5.1:program_review
control_ref: B.8.5.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which processing activities, systems, and data flows are covered
    by the ISMS and its privacy extension. Without a clear scope, you cannot determine which transfers
    or notifications must be reviewed.
  good_enough: A documented scope that explicitly includes processor activities and data transfers relevant
    to customer notifications.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the documented purposes for which personal data is processed and transferred
    to verify if notifications and change communications are aligned with those purposes.
  good_enough: A register or record listing the purposes for all relevant processing and transfers, even
    if not fully mapped to every data flow.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The review must confirm that the legal basis for each transfer is current and valid. Without
    this, you cannot assess if the basis is still appropriate or if notifications are required.
  good_enough: A list or matrix showing the lawful basis for each processing activity or transfer, even
    if some are pending legal review.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: cross_role
  rationale: Clear assignment of roles ensures that someone is accountable for maintaining transfer records,
    issuing notifications, and conducting the annual review.
  good_enough: A responsibility matrix or policy that names who is in charge of processor transfer management
    and review, even if not fully detailed.
