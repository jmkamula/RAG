leaf_id: req:A.7.4.1:applicable_scope
control_ref: A.7.4.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines the organizational and system boundaries for all information security
    and privacy controls. You cannot meaningfully define which collection contexts are in scope for privacy
    until the overall ISMS scope is clear.
  good_enough: A documented ISMS scope that clearly states the organizational units, systems, and processes
    included and excluded.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register is needed to identify all data collection points, such as forms,
    APIs, and integrations, that could be in scope for privacy controls. Without this, you risk missing
    key collection surfaces.
  good_enough: A basic inventory listing all major information assets, especially those that collect or
    process personal data.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purposes for which personal data is collected to determine which collection
    contexts are relevant and should be included in scope.
  good_enough: A summary of the main purposes for personal data collection, even if not fully detailed
    for every context.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for each collection activity helps determine which collection
    contexts are legitimate and must be documented in scope.
  good_enough: A list of lawful bases (e.g., consent, contract) mapped to each major collection context,
    even if some are provisional.
