leaf_id: req:4.4:isms_process_map
control_ref: '4.4'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: Determining the scope of the ISMS
  category: foundational
  rationale: The ISMS process map must reflect the actual boundaries and applicability of the ISMS. Without
    a clear scope, you can't accurately chart which processes are in or out.
  good_enough: The ISMS scope statement exists, is approved, and clearly defines what people, systems,
    and locations are covered.
- ref: '7.5'
  standard_id: ISO27001:2022
  title: Documented information
  category: foundational
  rationale: The process map is itself a form of documented information and must follow the organization’s
    rules for documentation. These rules ensure the map is controlled, maintained, and accessible.
  good_enough: There is a documented approach for creating, approving, and updating ISMS documents, and
    the process map can be managed under this system.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles and responsibilities
  category: direct
  rationale: The process map must show who is responsible for each process and handoff. Without defined
    roles, the map cannot assign accountability or clarify process ownership.
  good_enough: Key ISMS roles and responsibilities are documented and assigned, even if not yet fully
    embedded in job descriptions.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of duties
  category: direct
  rationale: The process map should reflect any required separation of duties to prevent conflicts of
    interest or fraud. This ensures the map aligns with security principles.
  good_enough: The main segregation points are identified and can be shown on the map, even if some details
    are still being finalized.
