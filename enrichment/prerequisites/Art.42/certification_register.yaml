leaf_id: req:Art.42:certification_register
control_ref: Art.42
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date record of processing activities to identify which processing operations
    may be subject to certification and to populate the certification register accurately.
  good_enough: A current, basic RoPA exists that lists all major processing activities, even if some details
    are pending clarification.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Knowing the lawful basis for each processing activity is essential to determine eligibility
    and scope for certification under GDPR.
  good_enough: Each processing activity in the RoPA has a stated lawful basis, even if supporting documentation
    is still being finalized.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The ISMS scope helps define organizational boundaries, ensuring the certification register
    covers all relevant entities and activities.
  good_enough: A draft ISMS scope exists that outlines which business units, locations, and systems are
    in scope for GDPR compliance.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: A designated Data Protection Officer is typically responsible for maintaining the certification
    register and ensuring its accuracy.
  good_enough: A DPO has been formally appointed and their contact details are documented, even if onboarding
    is ongoing.
