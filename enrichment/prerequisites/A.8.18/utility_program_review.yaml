leaf_id: req:A.8.18:utility_program_review
control_ref: A.8.18
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The review of privileged utility programs must be limited to systems and assets within the
    defined ISMS scope. Without a clear scope statement, you can't know which environments or applications
    require review.
  good_enough: A documented scope that identifies all relevant business units, IT systems, and assets
    covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need an up-to-date asset register to identify which systems and applications have privileged
    utility programs that require review. Missing this, you risk overlooking critical assets or reviewing
    irrelevant ones.
  good_enough: A current list of information assets, including systems where privileged utilities are
    installed, with basic ownership and location details.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The review process depends on knowing who is responsible for managing privileged utilities
    and who is authorized to use them. Without this, you can't verify or update authorized-user lists
    or assign review actions.
  good_enough: Documented roles for privileged utility management and review, with named individuals or
    teams.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding the risks associated with privileged utility programs informs the frequency,
    depth, and focus areas of the review. If risks are not assessed, the review may miss critical threats
    or over-focus on low-impact areas.
  good_enough: A recent risk assessment that identifies threats and vulnerabilities related to privileged
    utilities, even if high-level.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of data and systems helps prioritize which privileged utilities
    are most sensitive and require stricter review. Without this, you may treat all utilities the same,
    missing higher-risk areas.
  good_enough: A basic classification scheme applied to key assets, indicating which systems or data are
    sensitive or critical.
