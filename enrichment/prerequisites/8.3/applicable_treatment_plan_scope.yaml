leaf_id: req:8.3:applicable_treatment_plan_scope
control_ref: '8.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines the organizational and system boundaries for which treatment plans
    are relevant. Without a clear scope, you cannot determine which risks or treatment actions are in
    or out of scope for 8.3.
  good_enough: A documented scope statement that identifies the organizational units, assets, and processes
    covered by the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: The risk assessment identifies and evaluates risks that must be treated, deferred, or accepted.
    The treatment plan scope depends on having a current and complete risk assessment.
  good_enough: A recent risk assessment listing identified risks, their owners, and risk ratings, sufficient
    to inform treatment decisions.
- ref: '8.2'
  standard_id: ISO27001:2022
  title: Information security risk assessment
  category: direct
  rationale: The outputs of the most recent risk assessment (8.2) directly determine which risks require
    treatment and which may be accepted or deferred, forming the basis for the treatment plan scope.
  good_enough: Documented results from the latest risk assessment cycle, showing which risks are active,
    deferred, or accepted.
- ref: 6.1.3
  standard_id: ISO27001:2022
  title: Information Security Risk Treatment Plan
  category: direct
  rationale: The treatment plan (6.1.3) lists all identified risk treatment actions. 8.3’s scope note
    must reference which of these actions are currently in execution, deferred, or accepted.
  good_enough: A treatment plan document that lists all planned, ongoing, and accepted risk treatment
    actions, even if some are preliminary or pending approval.
