leaf_id: req:A.5.27:lessons_program_review
control_ref: A.5.27
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization and which processes are covered
    by the ISMS, ensuring the lessons-learned program review is relevant and comprehensive.
  good_enough: A current, approved scope statement exists that clearly identifies the organizational boundaries
    for ISMS activities.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures accountability for implementing, tracking,
    and reviewing lessons-learned actions.
  good_enough: Documented roles exist for those responsible for lessons-learned activities and reviews,
    even if not fully optimized.
- ref: A.5.27
  standard_id: ISO27001:2022
  title: Lessons-Learned from Information Security Incidents
  category: direct
  rationale: The periodic review depends on having a functioning lessons-learned process that captures
    incidents, actions, and outcomes to analyze for effectiveness.
  good_enough: There is a basic record of lessons-learned activities and outcomes from recent incidents,
    sufficient to support a review.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: foundational
  rationale: Understanding current risks and their treatment is essential to evaluate whether lessons-learned
    activities are addressing the right issues and reducing repeat incidents.
  good_enough: A recent risk assessment exists, identifying key risks and controls, even if some details
    are pending update.
