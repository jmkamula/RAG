leaf_id: req:A.5.27:lessons_register
control_ref: A.5.27
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of your organization and which processes are covered by the ISMS
    before you can meaningfully capture and track lessons learned. The register should only include incidents
    and improvements relevant to the defined scope.
  good_enough: A documented scope statement that clearly defines the organizational and process boundaries
    for the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the tone for continual improvement and establishes the expectation that lessons
    will be captured and acted upon. Without this, the register lacks authority and alignment with management
    intent.
  good_enough: A formally approved policy that references continual improvement and the need to address
    lessons learned.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Lessons learned are often tied to risk events or control failures. A current risk assessment
    provides the context needed to prioritize and act on lessons captured in the register.
  good_enough: A recent risk assessment identifying key risks and controls, even if not exhaustive, to
    inform which lessons are most critical.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that lessons are captured, tracked, and acted upon by the
    right people. Without this, register entries may lack ownership and follow-through.
  good_enough: A documented list of ISMS roles with responsibilities for incident management and continual
    improvement.
