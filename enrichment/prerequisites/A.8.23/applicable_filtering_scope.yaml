leaf_id: req:A.8.23:applicable_filtering_scope
control_ref: A.8.23
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization, devices, and networks are included in
    your ISMS before you can define which devices and traffic paths are subject to web filtering. This
    ensures your filtering scope aligns with your overall security boundaries.
  good_enough: A clear, documented scope that identifies included business units, device types, and network
    segments is available—even if not fully detailed for every edge case.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to identify which devices (corporate-managed, BYOD,
    etc.) are in play, so you can decide which are covered by web filtering controls.
  good_enough: A basic inventory of device types and key network assets exists, even if some BYOD or remote
    assets are still being catalogued.
- ref: A.8.20
  standard_id: ISO27001:2022
  title: Networks security
  category: direct
  rationale: Your network security baseline determines which network segments and traffic flows are protected,
    directly influencing which paths should be included in web filtering.
  good_enough: Documented network security controls and a map of major network segments are available,
    even if some details are still being finalized.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment helps prioritize which devices and traffic paths are most at risk and therefore
    most in need of web filtering, especially for BYOD and off-network scenarios.
  good_enough: A recent risk assessment exists that identifies key threats and risk areas for device and
    network use, even if not every scenario is exhaustively covered.
