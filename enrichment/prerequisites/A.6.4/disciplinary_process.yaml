leaf_id: req:A.6.4:disciplinary_process
control_ref: A.6.4
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which personnel, business units, and jurisdictions are in-scope for the
    ISMS before defining who the disciplinary process applies to. This ensures the procedure covers all
    relevant parties and avoids gaps.
  good_enough: A clear, documented scope that identifies the people and areas covered by the ISMS, even
    if not fully detailed, is sufficient to proceed.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The disciplinary process enforces violations of the information security policy, so the policy
    must exist and be communicated first. Otherwise, you cannot define what constitutes a violation.
  good_enough: A published, accessible information security policy that sets out key expectations for
    personnel is enough to unblock drafting the disciplinary process.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles and responsibilities is needed to determine
    who is accountable for investigating, deciding, and communicating disciplinary actions.
  good_enough: A basic roles and responsibilities matrix or list, even if not exhaustive, is sufficient
    to clarify who owns the disciplinary process steps.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Segregation of duties helps prevent conflicts of interest in the disciplinary process, ensuring
    investigations and decisions are impartial and credible.
  good_enough: A simple statement or outline of how duties are separated for sensitive processes, including
    disciplinary actions, is enough to proceed.
