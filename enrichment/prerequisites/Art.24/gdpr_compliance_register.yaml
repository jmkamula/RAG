leaf_id: req:Art.24:gdpr_compliance_register
control_ref: Art.24
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities (RoPA)
  category: foundational
  rationale: You need a clear, up-to-date record of all processing activities to accurately assess compliance
    with each GDPR article. Without this, you can't reliably map obligations to actual data practices.
  good_enough: A current, reasonably complete RoPA exists, covering all major processing activities and
    updated within the last year.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Understanding and documenting the lawful basis for each processing activity is essential
    to evaluate compliance with key GDPR requirements, especially those related to data subject rights
    and processing limitations.
  good_enough: Each processing activity in the RoPA has a documented lawful basis, even if some edge cases
    are flagged for later review.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer (DPO) Designation
  category: foundational
  rationale: If a DPO is required, their involvement is critical for maintaining and reviewing the compliance
    register. The DPO ensures ongoing oversight and helps interpret GDPR obligations.
  good_enough: A DPO is formally designated (if required) and aware of their responsibilities, or a documented
    decision exists explaining why a DPO is not needed.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: A clear ISMS scope ensures the GDPR compliance register covers all relevant business units,
    systems, and processes. This avoids gaps or overlaps in tracking GDPR obligations.
  good_enough: A documented ISMS scope exists that aligns with the organization’s GDPR-relevant activities,
    even if minor clarifications are pending.
