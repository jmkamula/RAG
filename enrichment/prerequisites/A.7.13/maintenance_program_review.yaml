leaf_id: req:A.7.13:maintenance_program_review
control_ref: A.7.13
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You must know which assets, locations, and systems are in-scope for your ISMS to determine
    which maintenance activities and providers are relevant for review.
  good_enough: A documented scope statement that clearly lists included assets and boundaries, even if
    not fully detailed, is sufficient to proceed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A current asset register is needed to identify which assets require maintenance and should
    be covered by the maintenance program review.
  good_enough: A basic, up-to-date list of key information assets and their owners is enough to start
    the review.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures you know who is responsible for maintenance, review, and
    provider management, which is essential for an effective review process.
  good_enough: A simple documented list of maintenance-related roles and their responsibilities is sufficient,
    even if not fully formalized.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding current risks helps prioritize which maintenance activities and providers are
    most critical to review for effectiveness and compliance.
  good_enough: A recent risk assessment identifying key threats and vulnerabilities related to asset maintenance
    is enough to inform the review.
