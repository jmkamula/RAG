leaf_id: req:5.1:leadership_engagement_framework
control_ref: '5.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: Leadership engagement must be anchored to the defined scope of the ISMS. Without clarity
    on what the ISMS covers, leadership cannot meaningfully demonstrate commitment or allocate resources.
  good_enough: A documented, approved scope statement that clearly identifies the boundaries and applicability
    of the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: direct
  rationale: The leadership engagement framework operationalizes the commitments made in the information
    security policy. The policy sets the direction; the framework describes how leaders enact it.
  good_enough: A published, current information security policy that has been approved by top management
    and communicated to relevant stakeholders.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear definition of roles and responsibilities is essential so that leadership knows who
    is accountable for what, and can demonstrate engagement through assigned duties and oversight.
  good_enough: A documented matrix or list showing key ISMS roles and their assigned responsibilities,
    reviewed and accepted by management.
