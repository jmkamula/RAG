leaf_id: req:A.8.3:information_access_restriction_procedure
control_ref: A.8.3
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines which information and assets are covered by access restrictions. Without
    a clear scope, you can't reliably determine what needs to be protected or included in the procedure.
  good_enough: A documented scope statement that identifies the business units, systems, and information
    types covered by the ISMS.
- ref: A.5.15
  standard_id: ISO27001:2022
  title: Access control
  category: direct
  rationale: The access control policy sets the rules and principles for restricting access, which the
    procedure must enforce. The procedure cannot be drafted until the policy is defined.
  good_enough: A published access control policy that outlines the principles, roles, and general rules
    for granting and revoking access.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: You need an up-to-date asset register to know which information and assets require access
    restrictions. The procedure must reference these assets to be effective.
  good_enough: A basic inventory of key information assets and systems, even if not fully detailed, to
    inform access restriction decisions.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: Asset classification determines the sensitivity of information and drives the level of access
    restriction needed. The procedure must align with these classifications.
  good_enough: A documented scheme that categorizes information (e.g., public, internal, confidential),
    with at least initial mapping to major asset types.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that authorisation workflows and enforcement
    mechanisms in the procedure are actionable and accountable.
  good_enough: A list of key roles (e.g., system owner, access approver) and their responsibilities related
    to access management, even if not exhaustive.
