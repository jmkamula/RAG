leaf_id: req:6.1.3:risk_treatment_program_review
control_ref: 6.1.3
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The risk treatment program review must be aligned to the defined scope of the ISMS; without
    a clear scope, you cannot determine if all relevant risks and treatments are being considered.
  good_enough: A documented scope statement that identifies the organizational boundaries and information
    assets covered by the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: The risk treatment program review depends on the latest risk assessment to verify that identified
    risks are being addressed and that residual risks remain acceptable.
  good_enough: A completed and current risk assessment with documented results, even if not perfect, that
    identifies and prioritizes information security risks.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The review must check that risk treatment activities align with the organization’s information
    security policy; without a policy, there is no baseline for acceptable risk or treatment objectives.
  good_enough: An approved information security policy that sets out the organization’s approach to managing
    information security, even if high-level.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: Reviewing risk treatment requires knowing what assets are in scope and their status; an asset
    register is essential to ensure all relevant risks and treatments are considered.
  good_enough: A basic inventory of key information assets, even if not exhaustive, that supports risk
    identification and treatment tracking.
