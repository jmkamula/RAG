leaf_id: req:A.7.4.3:program_review
control_ref: A.7.4.3
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which business units, processes, and data are covered by the
    ISMS and PIMS. You need to know what is in-scope before reviewing the effectiveness of accuracy controls.
  good_enough: A documented scope that clearly lists included assets, processes, and locations relevant
    to personal data processing.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Understanding the documented purposes for processing personal data is essential to assess
    whether accuracy controls are appropriate and effective for each purpose.
  good_enough: A maintained register or documentation showing the purposes for all personal data processing
    activities in scope.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Knowing the lawful basis for each processing activity helps determine the required level
    of accuracy and the obligations for review and remediation.
  good_enough: Each processing activity in scope has an identified and documented lawful basis.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register ensures you know which systems and data stores are subject to
    accuracy controls and should be included in the program review.
  good_enough: A current list of information assets that process or store personal data, with ownership
    assigned.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are accountable for maintaining accuracy
    controls and for conducting the annual program review.
  good_enough: Documented roles and responsibilities for personal data accuracy and review, with named
    individuals or teams.
