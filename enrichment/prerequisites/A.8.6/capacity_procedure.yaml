leaf_id: req:A.8.6:capacity_procedure
control_ref: A.8.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, services, and business units are in scope for capacity management
    before defining procedures. This ensures the procedure covers all relevant assets and avoids gaps.
  good_enough: A documented scope that clearly lists included systems and boundaries, even if not fully
    detailed, is sufficient to start drafting the procedure.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which assets require capacity monitoring
    and management. Without it, you can't define thresholds or escalation paths.
  good_enough: A basic inventory of key information systems and infrastructure assets is enough to proceed,
    even if some minor assets are still being catalogued.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that capacity monitoring, escalation, and change approvals
    are actionable and accountable within the procedure.
  good_enough: A draft or interim RACI showing who owns capacity management tasks is sufficient to unblock
    drafting the procedure.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding capacity-related risks helps prioritize which systems need stricter thresholds
    or faster escalation, shaping the procedure's focus.
  good_enough: A recent risk assessment that highlights capacity or availability risks for major systems
    is enough, even if some risks are still being evaluated.
