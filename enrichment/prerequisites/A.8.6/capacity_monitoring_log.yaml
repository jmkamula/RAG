leaf_id: req:A.8.6:capacity_monitoring_log
control_ref: A.8.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, services, and resources are in scope for capacity monitoring.
    Without a clear scope, you can't determine what should be logged or monitored.
  good_enough: A documented scope that lists the main IT assets and environments relevant to capacity
    management.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Capacity monitoring requires an up-to-date inventory of assets to know which resources need
    to be tracked for utilisation and performance.
  good_enough: A basic, current list of key infrastructure and systems that are subject to capacity monitoring.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: It must be clear who is responsible for monitoring, logging, and responding to capacity issues.
    Without this, logs may not be maintained or acted upon.
  good_enough: Named individuals or teams assigned to capacity monitoring and log management, even if
    responsibilities are high-level.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding which capacity-related risks are most significant helps prioritize what to
    monitor and log. This ensures monitoring focuses on critical resources.
  good_enough: A recent risk assessment that identifies capacity or availability as a risk area for at
    least some in-scope assets.
