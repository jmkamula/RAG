leaf_id: req:A.8.6:capacity_baseline
control_ref: A.8.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization and which systems are in-scope for the
    ISMS before you can define what resources require capacity monitoring. This ensures the baseline is
    relevant and complete.
  good_enough: A documented scope statement that clearly identifies the business units, systems, and processes
    covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A current asset register is essential to identify which information assets and supporting
    resources (servers, network devices, etc.) require capacity monitoring. Without this, you can't define
    what to baseline.
  good_enough: A list of key information assets and their supporting infrastructure, sufficient to identify
    what needs capacity monitoring.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment results help prioritize which resources are most critical to monitor for
    capacity issues, based on business impact and likelihood of resource exhaustion.
  good_enough: A recent risk assessment that highlights capacity-related risks for major assets or services.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of assets helps determine the level of monitoring and alert thresholds
    needed for different types of resources.
  good_enough: A documented scheme that classifies assets by sensitivity or criticality, applied to the
    asset register.
