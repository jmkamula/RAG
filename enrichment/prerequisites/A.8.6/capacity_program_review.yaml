leaf_id: req:A.8.6:capacity_program_review
control_ref: A.8.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which systems, processes, and assets are included in the ISMS,
    ensuring the capacity review covers all relevant areas. Without a clear scope, the review could miss
    critical infrastructure or overreach into non-relevant areas.
  good_enough: A documented scope statement that clearly lists included business units, systems, and boundaries
    is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An accurate asset register is essential to identify which assets' capacity needs to be reviewed.
    Without it, you cannot verify if all relevant assets are included in the capacity program.
  good_enough: A current list of information assets, with ownership and basic attributes, exists and is
    accessible to those conducting the review.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The risk assessment identifies which capacity-related risks are significant, helping prioritize
    which systems or services require more frequent or detailed review.
  good_enough: A recent risk assessment exists that highlights capacity-related risks for key assets or
    services.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are responsible for conducting, documenting,
    and acting on the capacity review. Ambiguity here can stall or invalidate the review process.
  good_enough: Roles for capacity management and review are assigned and documented, even if not yet fully
    embedded in job descriptions.
