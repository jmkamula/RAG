leaf_id: req:Art.44:transfer_register
control_ref: Art.44
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a complete and current record of all processing activities to identify which involve
    international data transfers. Without this, you can't reliably catalogue or justify transfers outside
    the EU/EEA.
  good_enough: A working RoPA that lists all processing activities and flags those involving international
    transfers, even if some details are pending, is sufficient to start the transfer register.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: direct
  rationale: Each international transfer must be linked to a lawful basis for processing. This ensures
    that transfers are not only tracked but also justified under GDPR.
  good_enough: A summary mapping of each processing activity (especially those involving transfers) to
    its lawful basis is enough to proceed, even if some documentation is still being finalized.
- ref: Art.44
  standard_id: GDPR:2016/679
  title: General Principle for Transfers
  category: direct
  rationale: Understanding the overarching requirements and restrictions for international transfers under
    GDPR is essential before cataloguing specific transfers and their safeguards.
  good_enough: A clear internal summary or training note on the principles of Art.44 and what constitutes
    a transfer is enough to unblock drafting the register.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer Designation
  category: foundational
  rationale: A DPO (or equivalent privacy lead) is needed to oversee, validate, and maintain the transfer
    register, ensuring accuracy and ongoing compliance.
  good_enough: A named individual responsible for GDPR oversight, even if not formally registered as DPO,
    is sufficient to begin the register process.
