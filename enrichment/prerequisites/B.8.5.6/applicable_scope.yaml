leaf_id: req:B.8.5.6:applicable_scope
control_ref: B.8.5.6
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You must know the overall boundaries of your ISMS before you can define which subcontractors
    are in scope for privacy requirements. This ensures you only include relevant parties handling customer
    PII.
  good_enough: A clear, current ISMS scope statement that identifies the organizational and process boundaries
    for information security.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register is needed to identify which information assets (including data
    flows and systems) involve subcontractors processing customer PII. Without this, you can't reliably
    determine which subcontractors are in scope.
  good_enough: A working list of information assets, including third-party relationships, with enough
    detail to spot which subcontractors handle customer PII.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: cross_role
  rationale: Clear assignment of roles and responsibilities ensures someone is accountable for identifying
    and managing subcontractors that process customer PII. This prevents gaps or overlaps in privacy oversight.
  good_enough: Documented responsibility for managing third-party privacy risks, even if it's just a named
    owner or team.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You need to know the purposes for which customer PII is processed before you can determine
    which subcontractors are involved in those processing activities. This avoids over- or under-inclusion.
  good_enough: A basic mapping of customer PII processing purposes, with enough clarity to link them to
    relevant subcontractors.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for processing customer PII helps determine which processing
    activities (and thus which subcontractors) are covered by privacy obligations.
  good_enough: A summary of lawful bases for each major customer PII processing activity, sufficient to
    inform which subcontractors are relevant.
