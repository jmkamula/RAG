leaf_id: req:B.8.5.6:subcontractor_disclosure_register
control_ref: B.8.5.6
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The Subcontractor Disclosure Register must align with the defined ISMS scope to ensure all
    relevant subcontractor relationships are captured. Without a clear scope, you risk omitting key subprocessors
    or including irrelevant ones.
  good_enough: A documented scope that clearly identifies the organizational and process boundaries relevant
    to privacy and subcontractor management.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: cross_role
  rationale: You need to know who is responsible for managing subcontractor relationships and disclosures.
    Without this, the register may lack accountability or accuracy.
  good_enough: A current list of assigned roles for privacy and vendor management, with clear responsibility
    for maintaining the subcontractor register.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: The register must reflect the specific purposes for which each subcontractor is engaged,
    as this affects disclosure obligations to customers. Missing this risks incomplete or misleading entries.
  good_enough: A summary of each subcontractor’s processing purpose(s) as documented in contracts or data
    flow diagrams.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Knowing the lawful basis for each processing activity involving a subcontractor is essential
    for transparency and compliance. This underpins what you must disclose to customers.
  good_enough: A mapped lawful basis for each subcontractor relationship, even if high-level, to inform
    register entries.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: Subcontractors often handle or access information assets; you need an up-to-date asset register
    to identify which assets are in scope for disclosure. Otherwise, you may miss relevant subcontractors.
  good_enough: A working asset register that lists key information assets and links them to relevant subprocessors.
