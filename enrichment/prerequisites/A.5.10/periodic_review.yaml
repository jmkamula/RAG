leaf_id: req:A.5.10:periodic_review
control_ref: A.5.10
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: A.5.1
  standard_id: ISO27001:2022
  title: Policies for information security
  category: direct
  rationale: The Acceptable Use Policy (AUP) is a child document of the overall information security policy
    framework. You need a current, approved parent policy to ensure the AUP review aligns with the organisation’s
    security objectives and principles.
  good_enough: A documented, approved information security policy exists and is accessible to reviewers.
    It doesn't need to be perfect, but it must set out the organisation's security intent and scope.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification of information
  category: direct
  rationale: The AUP often sets different rules for different types of information. You must have a defined
    classification scheme so reviewers can check if the AUP’s rules match the actual sensitivity and handling
    requirements of your data.
  good_enough: A basic, documented classification scheme is in place and referenced by the AUP, even if
    not fully rolled out. Reviewers can map AUP rules to information classes.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: Determining the scope of the information security management system
  category: foundational
  rationale: The scope statement defines which parts of the organisation and which assets are covered
    by the ISMS and, by extension, the AUP. Reviewers need this to know what the AUP should address.
  good_enough: A written scope statement exists, identifying the boundaries and applicability of the ISMS.
    It should be clear enough to guide what the AUP covers.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Inventory of information and other associated assets
  category: direct
  rationale: To review whether the AUP covers actual use patterns, you need an up-to-date asset inventory.
    This ensures that new technologies and platforms are considered in the review.
  good_enough: A current asset inventory exists, listing key information assets and technologies in use.
    It doesn't need to be exhaustive, but should reflect major changes since the last review.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information security policy
  category: foundational
  rationale: The AUP review must align with the organisation’s overarching security policy. Reviewers
    need to ensure the AUP supports and does not contradict the main policy.
  good_enough: A documented, approved security policy is available to reviewers. It should be up-to-date
    enough to reflect current organisational priorities.
