leaf_id: req:9.1:monitoring_measurement_procedure
control_ref: '9.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS before you can define what needs to be monitored
    and measured. The scope determines which assets, processes, and risks are relevant for monitoring.
  good_enough: A documented scope statement that clearly defines what parts of the organisation and which
    processes are covered by the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the direction and priorities for information security, which informs what
    should be monitored and measured to meet organisational objectives.
  good_enough: A formally approved information security policy that outlines the organisation’s security
    objectives and commitments.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Risk assessment identifies the key risks and controls that must be monitored to ensure the
    ISMS is effective. Without this, you cannot prioritise what to measure.
  good_enough: A completed and up-to-date risk assessment identifying major risks, controls, and risk
    owners relevant to the ISMS scope.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that monitoring and measurement tasks are owned and executed
    by the right people, as required by the procedure.
  good_enough: A documented list or matrix of ISMS roles and responsibilities, with named individuals
    or teams assigned to monitoring and measurement activities.
