leaf_id: req:9.1:monitoring_program_review
control_ref: '9.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of the organization and which processes are covered by the ISMS
    before you can meaningfully review the monitoring program. The scope defines what should be monitored.
  good_enough: A documented scope statement that clearly identifies the organizational and process boundaries
    for the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The monitoring program should be based on identified risks; without a current risk assessment,
    you can't verify if monitoring is aligned with actual threats and vulnerabilities.
  good_enough: A recent risk assessment that identifies key risks and justifies the selection of monitoring
    controls and metrics.
- ref: '9.1'
  standard_id: ISO27001:2022
  title: Monitoring, Measurement, Analysis and Evaluation Procedure
  category: direct
  rationale: You can't review the monitoring program unless there is a documented procedure describing
    what is monitored, how, and what thresholds are used.
  good_enough: A documented procedure or policy that defines what is measured, how data is collected,
    and what thresholds or criteria are used for evaluation.
- ref: '9.3'
  standard_id: ISO27001:2022
  title: Management Review
  category: direct
  rationale: The review of the monitoring program must ensure that results are actually feeding into management
    review. Without an established management review process, this linkage can't be verified.
  good_enough: Evidence that management review meetings occur and include discussion of monitoring results,
    even if the process is still maturing.
