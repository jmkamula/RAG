leaf_id: req:9.1:measurement_record
control_ref: '9.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines what parts of the organisation and which assets/processes are
    covered by the ISMS, ensuring that measurement activities are relevant and comprehensive. Without
    a clear scope, measurement records may be incomplete or misaligned.
  good_enough: A documented scope statement exists that clearly identifies the organisational boundaries
    and assets/processes in scope for the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: foundational
  rationale: Risk assessment results drive which controls and metrics are important to monitor. Measurement
    records must align with identified risks to be meaningful and actionable.
  good_enough: A recent risk assessment has been performed and documented, identifying key risks and associated
    controls to be measured.
- ref: '9.1'
  standard_id: ISO27001:2022
  title: Monitoring, Measurement, Analysis and Evaluation Procedure
  category: direct
  rationale: The procedure defines what will be measured, how, and how often. The measurement record cannot
    be created until the procedure specifies the metrics and methods.
  good_enough: A documented procedure exists specifying the metrics, measurement methods, frequency, and
    responsible parties for ISMS monitoring.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that measurement activities are carried out and records
    are maintained by accountable individuals. Without this, measurement data may be unreliable or missing.
  good_enough: Roles and responsibilities for ISMS measurement and record-keeping are assigned and communicated
    to relevant staff.
