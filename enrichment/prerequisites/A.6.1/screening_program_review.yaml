leaf_id: req:A.6.1:screening_program_review
control_ref: A.6.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which roles are in-scope for security
    controls before you can review if screening is happening at the right depth and cadence.
  good_enough: A documented scope statement that clearly identifies which business units, functions, and
    roles are covered by the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear definition of roles and responsibilities is essential to determine which positions
    require screening and at what level, as well as who is responsible for conducting and reviewing the
    screening program.
  good_enough: A current list or matrix showing key roles and their information security responsibilities,
    especially those subject to screening.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The risk assessment identifies which roles present higher risks and therefore require more
    stringent or frequent screening, and helps justify the depth and cadence of checks.
  good_enough: A recent risk assessment that identifies role-based risks relevant to personnel screening,
    even if high-level.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are segregated helps ensure that screening requirements are aligned
    with risk exposure and that no critical gaps exist in the screening register.
  good_enough: A documented approach or summary showing how duties are segregated for sensitive roles,
    sufficient to inform screening requirements.
