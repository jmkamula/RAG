leaf_id: req:A.6.1:screening_procedure
control_ref: A.6.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You must know which parts of your organization and which roles are in scope for the ISMS
    before defining who needs to be screened and how. The scope statement ensures screening procedures
    are applied to the right people and processes.
  good_enough: A documented scope statement that clearly identifies the organizational boundaries and
    functions covered by the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Screening must be proportional to the risks associated with different roles. A current risk
    assessment helps determine which positions require more stringent checks and why.
  good_enough: A recent risk assessment identifying key information security risks and mapping them to
    relevant roles or job functions.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear definition of roles and responsibilities is needed to identify which positions require
    screening and who is responsible for conducting and approving checks.
  good_enough: A roles and responsibilities matrix or document that assigns information security duties
    and identifies key job functions.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are segregated helps identify positions with elevated risk or access,
    informing the level and type of screening required.
  good_enough: A documented approach or summary showing how critical duties are separated to reduce risk,
    highlighting roles with higher trust requirements.
