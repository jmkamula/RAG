leaf_id: req:A.5.36:compliance_review_schedule
control_ref: A.5.36
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The compliance review schedule must cover all in-scope policies, rules, and standards. Without
    a clear ISMS scope, you can't reliably identify what needs to be reviewed or scheduled.
  good_enough: A documented, approved scope statement that lists the business units, processes, and assets
    included in the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: direct
  rationale: The review schedule must include the main information security policy and related documents.
    If these policies don't exist, there's nothing to schedule for review.
  good_enough: A current, accessible information security policy that is formally approved and communicated
    to relevant staff.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The schedule should account for all information assets and their associated controls. Without
    an asset register, you can't ensure all critical assets and their controls are covered in the review
    cycle.
  good_enough: A basic, up-to-date list of key information assets and owners, even if not fully detailed.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Review frequency should be risk-based. Without a risk assessment, you can't prioritize or
    justify the cadence for reviewing different controls or documents.
  good_enough: A recent risk assessment identifying major risks and assigning risk levels to key assets
    and processes.
