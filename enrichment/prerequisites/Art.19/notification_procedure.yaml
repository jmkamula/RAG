leaf_id: req:Art.19:notification_procedure
control_ref: Art.19
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date record of processing activities to know which data recipients exist
    for each processing activity. Without this, you cannot reliably identify who must be notified under
    Art.19.
  good_enough: A current, working RoPA that lists recipients for each processing activity is available,
    even if not fully detailed or automated.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis
  category: foundational
  rationale: Understanding the lawful basis for each processing activity helps determine when rectification,
    erasure, or restriction applies, and thus when notifications to recipients are triggered.
  good_enough: Each processing activity in the RoPA has a documented lawful basis, even if some edge cases
    are still being clarified.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a DPO is required, their involvement is critical in designing and overseeing notification
    procedures to ensure compliance and proper communication with recipients.
  good_enough: A DPO is appointed (if required), or a responsible person is clearly designated for data
    protection matters.
