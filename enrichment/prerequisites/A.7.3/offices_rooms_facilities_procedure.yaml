leaf_id: req:A.7.3:offices_rooms_facilities_procedure
control_ref: A.7.3
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which offices, rooms, and facilities are in-scope for your ISMS before you
    can define procedures for securing them. This ensures the procedure covers all relevant physical locations.
  good_enough: A clear, current list or description of all physical premises included in the ISMS scope
    is available.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register identifies which physical spaces and assets require protection,
    informing what needs to be covered in the securing procedure.
  good_enough: A basic inventory of physical spaces and key assets is documented, even if not fully detailed.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that responsibilities for implementing and maintaining
    physical security controls are understood and actionable in the procedure.
  good_enough: Named individuals or roles are assigned for physical security tasks, even if job descriptions
    are not fully formalized.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies threats and vulnerabilities related to physical spaces, guiding
    which controls and procedures are necessary for adequate security.
  good_enough: A recent risk assessment exists that covers physical security risks for the relevant offices
    and facilities.
