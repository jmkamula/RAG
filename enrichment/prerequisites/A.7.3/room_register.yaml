leaf_id: req:A.7.3:room_register
control_ref: A.7.3
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Room Register must only cover rooms within the defined ISMS scope. Without a clear scope,
    you can't know which sites or rooms should be included or excluded.
  good_enough: The scope statement should clearly list all physical locations and sites that fall under
    the ISMS, even if some details are high-level.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The Room Register depends on knowing which rooms exist as physical assets. An up-to-date
    asset register ensures no rooms are missed or double-counted.
  good_enough: A basic inventory of all physical rooms and spaces, with unique identifiers and locations,
    is sufficient to start the Room Register.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Each room in the register must be classified according to its information security tier.
    The classification scheme defines the tiers and criteria for assigning them.
  good_enough: A documented scheme that describes at least the main classification levels and what types
    of information or activities trigger each level.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The Room Register requires assigning ownership and responsibility for each room. Without
    defined roles, you can't allocate or track room owners.
  good_enough: A list of roles or persons responsible for physical security and asset management, with
    enough detail to assign room ownership.
