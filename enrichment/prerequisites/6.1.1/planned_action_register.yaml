leaf_id: req:6.1.1:planned_action_register
control_ref: 6.1.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization and which information assets
    are covered by the ISMS, ensuring that planned actions are relevant and appropriately targeted.
  good_enough: A documented, approved scope statement that clearly identifies the organizational boundaries
    and assets included in the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: The planned action register is driven by the risks and opportunities identified in the risk
    assessment; without this, there is no basis for meaningful planning.
  good_enough: A completed and reviewed risk assessment listing current information security risks and
    opportunities, even if not yet fully detailed.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the organization's direction and priorities for information security, guiding
    which actions are appropriate and how they should be prioritized in the register.
  good_enough: A formally approved policy that articulates the organization's information security objectives
    and commitments.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Each planned action must have an assigned owner; clear definition of roles and responsibilities
    is essential to allocate and track action items effectively.
  good_enough: A current list or matrix of ISMS roles and their assigned responsibilities, sufficient
    to assign action owners.
