leaf_id: req:6.1.1:risk_opportunity_planning
control_ref: 6.1.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.1'
  standard_id: ISO27001:2022
  title: Understanding the Organization and its Context
  category: foundational
  rationale: This clause requires the organisation to identify internal and external issues relevant to
    its purpose and information security objectives. These issues are a primary input for risk and opportunity
    planning.
  good_enough: A documented summary of key internal and external issues that could affect the ISMS, reviewed
    and agreed by management.
- ref: '4.2'
  standard_id: ISO27001:2022
  title: Understanding the Needs and Expectations of Interested Parties
  category: foundational
  rationale: Clause 6.1.1 explicitly requires consideration of stakeholder requirements, making this a
    critical input for identifying risks and opportunities.
  good_enough: A list or matrix of relevant interested parties and their information security requirements,
    with rationale for inclusion/exclusion.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: Determining the Scope of the ISMS
  category: foundational
  rationale: The scope statement defines the boundaries of the ISMS, ensuring risk and opportunity planning
    is appropriately targeted and not missing key areas.
  good_enough: A formally approved ISMS scope statement that clearly defines what is in and out of scope
    for risk management.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the direction and commitment for information security, which guides how risks
    and opportunities are approached and managed.
  good_enough: A current, approved information security policy that articulates management intent and
    is communicated to relevant staff.
