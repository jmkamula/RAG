leaf_id: req:6.1.1:applicable_inputs_scope
control_ref: 6.1.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You must know the boundaries of your ISMS—what parts of your organization, processes, and
    assets are in-scope—before you can define which planning inputs are relevant. Without this, you can't
    meaningfully decide which issues or parties feed into planning.
  good_enough: A documented scope statement that clearly lists included business units, locations, and
    technologies. It doesn't need to be perfect, but it must exist and be agreed by management.
- ref: '4.1'
  standard_id: ISO27001:2022
  title: Understanding the Organization and Its Context
  category: direct
  rationale: Identifying relevant internal and external issues is essential to determine which categories
    of issues should feed into planning. Without this, you can't specify the upstream inputs for 6.1.1.
  good_enough: A list or summary of key internal and external issues, even if high-level, that affect
    information security. It should be recent enough to reflect the current environment.
- ref: '4.2'
  standard_id: ISO27001:2022
  title: Understanding the Needs and Expectations of Interested Parties
  category: direct
  rationale: You need to know which interested parties and their requirements are relevant to your ISMS,
    as these directly inform the planning process and its scope.
  good_enough: A documented identification of key interested parties and their main information security
    requirements. It can be a simple table or list.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: direct
  rationale: The policy sets the overall direction and principles for information security, which helps
    define the cadence and triggers for planning and review.
  good_enough: A current, approved information security policy that references planning and review expectations,
    even if not fully detailed.
