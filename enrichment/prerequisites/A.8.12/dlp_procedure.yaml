leaf_id: req:A.8.12:dlp_procedure
control_ref: A.8.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organisation and which information assets are in-scope
    for DLP controls before defining operational procedures. This ensures the DLP procedure is relevant
    and comprehensive.
  good_enough: A documented scope statement that clearly identifies the business units, systems, and data
    types covered by the ISMS and DLP controls.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which information assets require DLP
    protection and where DLP controls should be applied.
  good_enough: A basic inventory listing key information assets (e.g., databases, file shares, endpoints)
    that are subject to DLP monitoring.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A data classification scheme is needed to determine which data types are sensitive and require
    DLP controls, guiding alerting and exception handling.
  good_enough: A documented scheme that defines at least the main sensitivity levels (e.g., public, internal,
    confidential) and examples relevant to your environment.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of DLP-related roles ensures that alert triage, exception handling, and
    user feedback are managed by the right people.
  good_enough: A simple matrix or list showing who is responsible for DLP operations, even if some roles
    are combined or interim.
