leaf_id: req:A.8.12:dlp_program_review
control_ref: A.8.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The DLP program review must be aligned with the defined ISMS scope to ensure all relevant
    business areas, assets, and data flows are considered. Without a clear scope, the review may miss
    critical channels or assets.
  good_enough: A documented scope statement that identifies the business units, processes, and information
    types covered by the ISMS, including those subject to DLP controls.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which information assets require DLP
    coverage and to verify that all relevant assets are included in the review.
  good_enough: A current list of information assets, including owners and data types, with enough detail
    to map DLP controls to specific assets.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The DLP program relies on data classification to set appropriate rules and priorities. Without
    a working classification scheme, it is impossible to determine if DLP controls are adequate or effective.
  good_enough: A documented classification scheme that defines categories for information (e.g., confidential,
    internal, public) and is applied to key assets.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The DLP program should address the most significant data loss risks. A recent risk assessment
    ensures the review focuses on current threats, attack patterns, and business priorities.
  good_enough: A completed risk assessment within the last 12 months that identifies data loss scenarios
    and prioritizes them for DLP coverage.
