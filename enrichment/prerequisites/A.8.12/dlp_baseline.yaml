leaf_id: req:A.8.12:dlp_baseline
control_ref: A.8.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which information assets are in-scope
    for DLP controls. Without a clear scope, you can't define a meaningful DLP baseline.
  good_enough: A documented scope that identifies the business units, locations, and information types
    covered by the ISMS, even if it's high-level.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: A current asset register ensures you know what information assets require DLP protection
    and where sensitive data resides. This is essential for configuring DLP coverage.
  good_enough: A basic inventory of key information assets, especially those handling sensitive or regulated
    data, is available and up to date.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: DLP rules depend on knowing how information is classified (e.g., confidential, internal).
    Without a classification scheme, you can't set up effective, risk-based DLP rules.
  good_enough: A documented classification scheme exists and is communicated, even if not all assets are
    fully tagged yet.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies which data loss scenarios are most critical, helping you prioritize
    DLP coverage and controls. It guides the baseline's focus.
  good_enough: A recent risk assessment that highlights key data loss risks, even if mitigation plans
    are still in progress.
