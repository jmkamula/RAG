leaf_id: req:B.8.2.1:program_review
control_ref: B.8.2.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which customers, services, and processing activities are covered
    by the ISMS and privacy extension. Without a clear scope, you cannot reliably identify which customer
    agreements require review.
  good_enough: The scope must be documented and include all relevant customer relationships and processing
    activities that fall under ISO 27701.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know and document the purposes for which personal data is processed for each customer
    to ensure agreements address the correct obligations and assistance requirements.
  good_enough: Each in-scope customer and processing activity has a documented, up-to-date purpose statement.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Agreements must reflect the lawful basis for processing, as this determines the nature of
    assistance obligations. Without this, you cannot verify if agreements are adequate.
  good_enough: Lawful basis is identified and recorded for each in-scope customer processing activity.
- ref: Art.28
  standard_id: GDPR:2016/679
  title: Processor Obligations
  category: cross_role
  rationale: Article 28 sets the minimum requirements for processor agreements, including assistance obligations.
    These legal requirements must be understood to assess if customer agreements are compliant.
  good_enough: A summary of Article 28 requirements is available and mapped to the organization's agreement
    templates or executed contracts.
