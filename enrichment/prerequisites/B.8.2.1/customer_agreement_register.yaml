leaf_id: req:B.8.2.1:customer_agreement_register
control_ref: B.8.2.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Customer PII Agreement Register must only cover customers and processing activities that
    fall within the defined scope of your ISMS and privacy extension. If the scope is unclear, you risk
    omitting required agreements or including irrelevant ones.
  good_enough: A documented scope statement that clearly identifies which customer relationships and processing
    activities are in-scope for privacy management.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You need to know the specific purposes for which PII is processed for each customer to ensure
    agreements and register entries are accurate and complete. Without this, you can't confirm that agreements
    match processing realities.
  good_enough: A list or matrix mapping each customer to the documented purposes for which their PII is
    processed.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The register must reflect that each processing activity covered by a customer agreement has
    a lawful basis. This ensures agreements are not just in place, but also legally valid.
  good_enough: A record showing the lawful basis for each customer PII processing activity, even if high-level,
    to support agreement coverage.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures someone is accountable for maintaining the register and
    for ensuring customer agreements are executed and tracked.
  good_enough: Documented assignment of responsibility for customer agreements and register upkeep, even
    if to a single named role.
