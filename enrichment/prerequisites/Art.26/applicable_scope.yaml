leaf_id: req:Art.26:applicable_scope
control_ref: Art.26
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a clear, up-to-date record of all processing activities to identify which relationships
    and data flows might involve joint controllership. Without this, it's impossible to reliably scope
    joint controllership.
  good_enough: A draft or working list of processing activities that covers all relevant data flows and
    parties, even if not fully detailed or formally signed off.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Understanding the lawful basis for each processing activity helps distinguish between controller,
    joint controller, and processor roles, which is essential for applying the EDPB Guidelines 7/2020
    test.
  good_enough: A mapping of lawful bases to each processing activity, even if some are provisional or
    pending legal review.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The ISMS scope defines the organizational and process boundaries, which supports identifying
    which entities and activities might fall under joint controllership.
  good_enough: A documented ISMS scope that at least outlines the main business units, systems, and geographies
    involved in personal data processing.
