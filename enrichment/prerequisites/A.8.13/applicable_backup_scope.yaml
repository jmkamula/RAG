leaf_id: req:A.8.13:applicable_backup_scope
control_ref: A.8.13
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The backup scope must align with the overall ISMS scope to ensure only relevant systems and
    datasets are considered. Without a clear scope statement, you can't reliably identify what needs backup
    coverage.
  good_enough: A documented, management-approved ISMS scope that lists included business units, systems,
    and locations.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need a current inventory of information assets to determine which require backup and
    to what extent. Missing or outdated asset lists will block meaningful backup scope definition.
  good_enough: An up-to-date list of key information assets (systems, datasets, applications) with basic
    ownership and criticality noted.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Classification helps prioritize backup needs by identifying which data is sensitive or critical.
    Without this, you can't set appropriate RPO tiers or justify exclusions.
  good_enough: A simple, documented scheme that labels assets/data by sensitivity or criticality, applied
    to the main asset register.
- ref: A.5.30
  standard_id: ISO27001:2022
  title: ICT Readiness for Business Continuity (BIA)
  category: direct
  rationale: The Business Impact Analysis (BIA) identifies critical processes and recovery requirements,
    which directly inform backup scope and RPO tiers. Without BIA input, backup scope may miss key business
    needs.
  good_enough: A summary of critical business processes and their required recovery times, even if not
    fully formalized.
- ref: A.5.19
  standard_id: ISO27001:2022
  title: Supplier Relationship Management
  category: direct
  rationale: If any backup responsibilities are delegated to vendors, you need clarity on supplier arrangements
    to accurately define what is vendor-managed versus in-house.
  good_enough: A list of suppliers with a note on which backup responsibilities are contractually assigned
    to them.
