leaf_id: req:A.8.13:backup_program_review
control_ref: A.8.13
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The backup program review must cover all in-scope systems and data. Without a clear ISMS
    scope, you can't confirm whether your backup coverage is complete or if critical assets are omitted.
  good_enough: A documented scope statement that lists the organizational units, locations, and information
    assets included in the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need an up-to-date asset register to know which information assets require backup and
    to verify that all relevant assets are included in the backup program.
  good_enough: A current inventory of information assets, with enough detail to identify what should be
    backed up.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Backup requirements (such as encryption or immutability) often depend on asset classification.
    Without a classification scheme, you can't confirm if backup controls are appropriate for each data
    type.
  good_enough: A documented scheme that defines classification levels and basic handling requirements
    for each level.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The backup program should be risk-driven, with restore objectives and controls aligned to
    identified risks. Without a risk assessment, you can't justify or prioritize backup measures.
  good_enough: A recent risk assessment that identifies key information risks and their impact, especially
    those related to data loss or unavailability.
