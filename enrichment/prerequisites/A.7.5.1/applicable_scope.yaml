leaf_id: req:A.7.5.1:applicable_scope
control_ref: A.7.5.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You must know the boundaries of your ISMS to accurately identify which PII flows and transfers
    are in scope for cross-jurisdictional analysis. Without a clear scope, you risk missing relevant transfers
    or including irrelevant ones.
  good_enough: A documented scope that clearly defines the organizational units, activities, and locations
    covered by the ISMS, with enough detail to map PII flows.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register is essential to identify all information assets, including PII,
    and their locations. This enables you to pinpoint which assets are subject to cross-jurisdictional
    transfers.
  good_enough: A list of information assets that includes data types, owners, and physical/logical locations,
    sufficient to trace PII movement.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: A working classification scheme ensures you can distinguish PII from other data types, which
    is necessary to focus only on relevant cross-border transfers.
  good_enough: A documented scheme that identifies PII as a distinct class, applied to assets in the register.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Knowing the purpose for processing PII helps determine the necessity and legitimacy of cross-jurisdictional
    transfers, and supports compliance with privacy obligations.
  good_enough: Documented purposes for each major PII processing activity, especially those involving
    transfers.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: You must establish the lawful basis for processing and transferring PII across jurisdictions
    to ensure each transfer is legally justified.
  good_enough: A record of lawful bases for each PII processing activity that may involve cross-border
    transfer.
