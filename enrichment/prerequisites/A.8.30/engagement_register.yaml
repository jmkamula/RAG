leaf_id: req:A.8.30:engagement_register
control_ref: A.8.30
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The engagement register must only include outsourced development activities that fall within
    the defined ISMS scope. Without a clear scope, you risk omitting relevant engagements or including
    out-of-scope ones.
  good_enough: A documented scope statement that clearly identifies which business units, processes, and
    systems are in-scope for the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need to know which information assets are being developed or handled by third parties
    to accurately catalogue outsourced engagements and link them to relevant assets.
  good_enough: A basic, up-to-date list of key information assets, with enough detail to map them to outsourced
    development activities.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that someone is responsible for maintaining the engagement
    register and for oversight of outsourced development.
  good_enough: Documented assignment of responsibility for vendor management and register upkeep, even
    if only at a high level.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding the risks associated with outsourced development helps determine which engagements
    are significant enough to track and what information should be captured in the register.
  good_enough: A recent risk assessment that identifies outsourced development as a risk area, with at
    least preliminary risk ratings.
