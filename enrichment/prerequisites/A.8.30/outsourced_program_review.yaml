leaf_id: req:A.8.30:outsourced_program_review
control_ref: A.8.30
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know whether outsourced development is in-scope for your ISMS before reviewing
    its security program. This ensures the review is relevant and covers all necessary outsourced activities.
  good_enough: A documented scope statement that explicitly includes (or excludes) outsourced development
    activities and related vendors.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is essential to identify which assets are managed or developed
    by outsourced parties, so you can target the review appropriately.
  good_enough: A current list of information assets, with outsourced assets and their responsible vendors
    clearly identified.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that someone is accountable for managing outsourced development
    and for conducting the periodic review.
  good_enough: Documented roles showing who manages outsourced vendors and who is responsible for the
    annual review process.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment helps prioritize which outsourced development activities and vendors pose
    the highest risk, guiding the focus of your review.
  good_enough: A recent risk assessment that includes risks related to outsourced development and vendor
    management.
