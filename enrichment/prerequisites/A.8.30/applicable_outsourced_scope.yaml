leaf_id: req:A.8.30:applicable_outsourced_scope
control_ref: A.8.30
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS to determine which outsourced development activities
    fall within scope. Without this, you can't reliably identify what counts as 'applicable' outsourced
    development.
  good_enough: A current, approved ISMS scope statement that clearly defines included business units,
    processes, and locations.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You must know what information assets exist and which are handled by outsourced development
    partners. This enables you to identify which outsourced activities are relevant for A.8.30.
  good_enough: A working asset register that lists key information assets and indicates ownership or management
    by third parties.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Understanding the classification of information helps determine which outsourced development
    activities are significant from a security perspective and must be included in scope.
  good_enough: A documented classification scheme that is being applied to information assets, even if
    not all assets are fully classified yet.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures accountability for identifying, managing, and documenting
    outsourced development activities.
  good_enough: Documented roles and responsibilities for ISMS management and third-party oversight, even
    if some details are still being refined.
