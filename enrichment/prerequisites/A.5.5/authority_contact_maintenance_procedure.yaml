leaf_id: req:A.5.5:authority_contact_maintenance_procedure
control_ref: A.5.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the organisational and system boundaries to identify which authorities are
    relevant and must be tracked in the contact register. Without a clear scope, you can't determine which
    authorities to maintain contact with.
  good_enough: A documented scope statement that defines the ISMS boundaries and includes all in-scope
    legal, regulatory, and contractual environments.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The procedure must specify who is responsible for maintaining authority contacts. Clear assignment
    of roles ensures accountability for keeping the register current and for activating authority engagement
    during incidents.
  good_enough: A list or matrix showing assigned responsibilities for ISMS activities, including authority
    contact maintenance, even if not fully detailed yet.
- ref: A.5.5
  standard_id: ISO27001:2022
  title: Authority Contact Register
  category: direct
  rationale: You can't maintain or update authority contacts without first having an initial register
    in place. The maintenance procedure builds on this artefact to ensure it stays accurate and actionable.
  good_enough: A draft or initial authority contact register listing relevant authorities and contact
    details, even if not fully validated.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy should set the expectation for compliance with external authorities and regulatory
    requirements, providing the context for why authority contact maintenance is necessary.
  good_enough: A current or draft policy statement referencing compliance obligations and the need to
    engage with authorities as part of the ISMS.
