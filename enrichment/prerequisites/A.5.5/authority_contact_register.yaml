leaf_id: req:A.5.5:authority_contact_register
control_ref: A.5.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Authority Contact Register must align with the defined scope of the ISMS to ensure only
    relevant authorities are included. Without a clear scope, you can't determine which authorities apply
    to your organization.
  good_enough: A documented scope statement exists that defines the organizational and operational boundaries
    for the ISMS, even if it is high-level or draft.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Knowing who is responsible for maintaining authority contacts and who acts as the point of
    contact is essential before building the register. This ensures accountability and clarity in communications.
  good_enough: A basic list of assigned ISMS roles and responsibilities exists, with at least one person
    identified for authority liaison or register maintenance.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The asset register helps identify which assets or processes are subject to regulation or
    oversight, informing which authorities are relevant. This mapping is needed to avoid missing key authorities.
  good_enough: An initial asset register exists that lists major information assets and their owners,
    even if not fully detailed or classified.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Understanding the classification of information helps determine which authorities may have
    jurisdiction or oversight, especially for regulated data types.
  good_enough: A draft or basic classification scheme is in place that distinguishes at least between
    public, internal, and regulated data.
