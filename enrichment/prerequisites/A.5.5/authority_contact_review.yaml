leaf_id: req:A.5.5:authority_contact_review
control_ref: A.5.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The authority contact register must align with the defined ISMS scope to ensure all relevant
    authorities are included and reviewed. Without a clear scope, you can't determine which authorities
    matter.
  good_enough: A documented scope statement that identifies the organizational boundaries and activities
    covered by the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of responsibility is needed to ensure someone is accountable for maintaining
    and reviewing the authority contact register. Without this, periodic reviews may not occur.
  good_enough: A current list of assigned roles showing who is responsible for maintaining and reviewing
    authority contacts.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The authority contact register is often linked to key information assets and their regulatory
    context. An up-to-date asset register helps identify which authorities are relevant for each asset.
  good_enough: A basic, up-to-date inventory of key information assets with notes on regulatory or authority
    relevance.
- ref: A.5.5
  standard_id: ISO27001:2022
  title: Contact with Authorities
  category: direct
  rationale: The existence of an authority contact register is a prerequisite for reviewing its accuracy
    and maintenance. You can't review what doesn't exist.
  good_enough: A documented register or list of relevant authority contacts, even if it's a simple spreadsheet.
