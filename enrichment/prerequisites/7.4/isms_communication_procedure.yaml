leaf_id: req:7.4:isms_communication_procedure
control_ref: '7.4'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The communication procedure must be aligned with the defined scope of the ISMS, ensuring
    that all relevant areas, processes, and stakeholders are covered. Without a clear scope, you cannot
    determine who needs to be communicated with or about what.
  good_enough: The ISMS scope statement should exist and clearly identify the boundaries and applicability
    of the ISMS, even if it is high-level or draft.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The communication procedure must support and reflect the organisation’s information security
    policy, as this sets the overall direction and expectations for security communications.
  good_enough: A published or draft information security policy that outlines the organisation’s commitment
    and approach to information security.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Effective communication depends on knowing who is responsible for sending, receiving, and
    acting on ISMS-related information. Defined roles and responsibilities are essential to assign communication
    duties.
  good_enough: A basic mapping of key ISMS roles and their responsibilities, even if not fully detailed,
    is available.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The communication procedure must address how information of different classifications is
    communicated internally and externally, to prevent inappropriate disclosure or mishandling.
  good_enough: A documented or draft classification scheme that identifies at least the main categories
    of information and their handling requirements.
