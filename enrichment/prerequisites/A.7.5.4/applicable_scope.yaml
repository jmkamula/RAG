leaf_id: req:A.7.5.4:applicable_scope
control_ref: A.7.5.4
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines the organizational and process boundaries for all information security
    and privacy controls, including where PII processing and disclosure may occur. Without this, you cannot
    meaningfully define which disclosure contexts are in or out of scope.
  good_enough: A documented, management-approved scope statement that clearly identifies the organizational
    units, processes, and systems covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register is needed to identify all information assets, including PII,
    and their flows. This is essential for mapping where PII could be disclosed to third parties.
  good_enough: A current inventory of information assets, including data types and owners, with enough
    detail to trace PII flows to external parties.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: A data classification scheme ensures that PII is properly identified and handled according
    to its sensitivity, which is critical for determining which disclosures are relevant under A.7.5.4.
  good_enough: A documented classification scheme that includes PII as a category and is applied to the
    asset register.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Knowing the purpose for which PII is processed is necessary to understand and justify any
    disclosure to third parties, as required by A.7.5.4.
  good_enough: Documented purposes for all PII processing activities, covering both internal use and third-party
    disclosures.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The lawful basis for processing PII must be established before disclosing it to third parties,
    to ensure disclosures are legitimate and compliant.
  good_enough: Each PII processing activity has a recorded lawful basis (e.g., consent, contract, legal
    obligation), especially for those involving third-party disclosures.
