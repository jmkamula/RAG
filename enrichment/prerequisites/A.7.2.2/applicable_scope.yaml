leaf_id: req:A.7.2.2:applicable_scope
control_ref: A.7.2.2
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know the organizational and operational boundaries of your ISMS before you can
    define which jurisdictions and privacy laws apply to your processing activities. This ensures the
    privacy extension is anchored to the right scope.
  good_enough: A clear, current ISMS scope statement that covers all business units, locations, and activities
    relevant to personal data processing.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must first identify and document the purposes for which personal data is processed. This
    is essential for determining which jurisdictions and lawful bases are relevant, as different purposes
    may trigger different legal requirements.
  good_enough: A documented list of processing purposes for all personal data, even if some are high-level
    or still being refined.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: Knowing what information assets exist and where personal data resides is crucial for mapping
    which jurisdictions' laws apply. Without this, you can't reliably determine the applicable scope.
  good_enough: An up-to-date inventory of information assets that includes systems and repositories where
    personal data is processed or stored.
- ref: Art.3
  standard_id: GDPR:2016/679
  title: Territorial Scope
  category: cross_role
  rationale: Understanding the territorial scope of GDPR (and similar laws) is necessary to decide if
    and how these regulations apply to your organization. This legal yardstick shapes your applicable
    jurisdiction list.
  good_enough: A basic legal interpretation or summary of which laws (like GDPR) are triggered by your
    processing activities, even if some edge cases are still under review.
