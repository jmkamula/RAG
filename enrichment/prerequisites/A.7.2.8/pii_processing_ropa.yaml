leaf_id: req:A.7.2.8:pii_processing_ropa
control_ref: A.7.2.8
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The RoPA must accurately reflect all PII processing activities within the defined ISMS scope.
    Without a clear scope, you risk omitting relevant processes or including out-of-scope activities.
  good_enough: The scope statement should be documented and up-to-date, clearly identifying the organizational
    boundaries and activities covered by the ISMS.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Each entry in the RoPA requires a documented purpose for processing PII. Without this, you
    cannot meaningfully describe or justify processing activities in the register.
  good_enough: A list of processing activities with their associated purposes should be available, even
    if some details are still being refined.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The RoPA must include the lawful basis for each processing activity to demonstrate compliance
    and accountability. This is also a GDPR requirement.
  good_enough: For each processing activity, a lawful basis (e.g., consent, contract, legal obligation)
    should be identified and recorded, even if supporting evidence is still being gathered.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: To accurately describe categories of PII and data subjects in the RoPA, you need a working
    data classification scheme. This ensures consistency and completeness.
  good_enough: A basic classification scheme should exist, with clear definitions for types and categories
    of PII relevant to your processing activities.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: cross_role
  rationale: The GDPR’s Article 30 sets the legal yardstick for what must be included in a RoPA. Aligning
    with these requirements ensures your register meets both ISO and regulatory expectations.
  good_enough: The key fields required by Art.30 should be mapped out and understood, even if not all
    data is fully populated yet.
