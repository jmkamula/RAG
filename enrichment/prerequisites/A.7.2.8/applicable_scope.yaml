leaf_id: req:A.7.2.8:applicable_scope
control_ref: A.7.2.8
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The RoPA coverage scope must align with the overall ISMS scope to ensure all relevant processing
    activities are captured and nothing outside the program's boundaries is mistakenly included or omitted.
  good_enough: A clear, documented ISMS scope that identifies included business units, locations, and
    activities is available and up to date.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: The RoPA must map to every in-scope processing purpose; without a complete and current register
    of purposes, you cannot determine which activities require RoPA entries.
  good_enough: A draft or working list of all processing purposes relevant to the ISMS scope, even if
    not fully finalized, is available for reference.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Each processing activity in the RoPA must have a lawful basis identified; this ensures the
    RoPA is not just a list but is legally grounded.
  good_enough: Each identified purpose has at least a provisional lawful basis mapped, even if some details
    need refinement.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: Knowing which information assets are involved in processing activities helps ensure the RoPA
    scope is comprehensive and accurate.
  good_enough: An initial asset register exists that covers key data and systems involved in personal
    data processing, even if some minor assets are pending inclusion.
