leaf_id: req:A.7.3.3:applicable_scope
control_ref: A.7.3.3
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know the overall boundaries of your information security management system before
    you can specify which delivery contexts are in scope for privacy notices. This ensures alignment between
    your security and privacy scoping.
  good_enough: A clear, current ISMS scope statement that lists included business units, systems, and
    geographies is available—even if it's high-level.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purposes for which personal data is processed in each delivery context
    before you can determine where notice-at-collection applies. This underpins the mapping of contexts
    to notice requirements.
  good_enough: A draft or working list of processing purposes tied to each delivery context exists, even
    if not fully finalized.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for processing in each context is essential to determine if
    and how notice-at-collection obligations apply. This helps clarify which contexts require explicit
    notice.
  good_enough: A preliminary mapping of lawful bases to delivery contexts is documented, even if some
    edge cases are still under review.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: A current asset register helps identify all delivery channels (web, mobile, etc.) and ensures
    none are missed when defining the applicable scope for privacy notices.
  good_enough: An up-to-date list of information assets and delivery platforms is available, even if some
    minor assets are pending inclusion.
