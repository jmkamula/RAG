leaf_id: req:A.7.3.3:program_review
control_ref: A.7.3.3
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which business units, processes, and systems are covered by the
    ISMS and PIMS, ensuring the notice delivery review covers all relevant touchpoints.
  good_enough: A documented scope that clearly identifies all in-scope systems and processes where privacy
    notices are required.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purposes for which personal data is processed to ensure notices are accurate
    and relevant at each touchpoint.
  good_enough: A current list of processing purposes mapped to business processes, even if not fully detailed,
    to inform notice content.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Notices must communicate the lawful basis for processing; you need this mapped before reviewing
    notice delivery.
  good_enough: A draft or working table mapping each processing activity to its lawful basis, covering
    all major data flows.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures accountability for maintaining and reviewing privacy notices
    across all touchpoints.
  good_enough: A named owner or team responsible for privacy notices and their review, even if broader
    responsibilities are still being clarified.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register helps identify all systems and interfaces where privacy notices
    must be delivered and reviewed.
  good_enough: A basic inventory of IT systems and data flows that touch personal data, sufficient to
    identify notice delivery points.
