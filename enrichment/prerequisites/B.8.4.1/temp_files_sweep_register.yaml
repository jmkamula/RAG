leaf_id: req:B.8.4.1:temp_files_sweep_register
control_ref: B.8.4.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The sweep register must clearly align with the defined ISMS scope to ensure only relevant
    customer-service infrastructure and data are included. Without a scope statement, you can't reliably
    determine what systems or temp files should be swept and recorded.
  good_enough: A documented scope that explicitly covers customer-service infrastructure and related data
    flows is available and referenced.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: You need an up-to-date asset register to identify which systems and storage locations generate
    or hold temporary files that must be swept. Without this, the sweep register may miss critical infrastructure
    or include irrelevant assets.
  good_enough: A current list of customer-service infrastructure assets, including storage locations for
    temp files, is available to inform sweep activities.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: foundational
  rationale: The purpose for processing (including creation and deletion of temp files) must be documented
    to justify why sweeps are performed and what should be included in the register. This ensures the
    register aligns with privacy requirements.
  good_enough: A brief documented statement of the processing purpose for temp files in customer-service
    infrastructure exists and is accessible.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: cross_role
  rationale: Clear assignment of roles is needed so it’s obvious who is responsible for performing sweeps
    and maintaining the register. Without this, the register may not be reliably updated or owned.
  good_enough: Named individuals or teams are assigned responsibility for temp file sweeps and register
    maintenance, documented in a policy or procedure.
