leaf_id: req:5.3:isms_raci_framework
control_ref: '5.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries and applicability of your ISMS before you can define who
    is responsible, accountable, consulted, or informed for its processes. The RACI framework must align
    with the agreed scope.
  good_enough: A documented scope statement that clearly defines what parts of the organization and which
    processes are covered by the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: direct
  rationale: A current list of roles and their basic responsibilities is essential before you can map
    those roles into a RACI or similar decision-rights model. Without this, you can't assign or clarify
    accountability.
  good_enough: A list or chart showing all key ISMS roles and a brief description of their main responsibilities.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding where duties must be separated is critical for designing a RACI framework that
    prevents conflicts of interest and enforces proper checks and balances.
  good_enough: A summary of which duties must be segregated, with enough detail to inform how roles are
    split in the RACI model.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The ISMS RACI framework must be consistent with the organization's overarching information
    security policy, which sets the tone for accountability and authority.
  good_enough: A current, approved information security policy that outlines the organization's approach
    to security governance.
