leaf_id: req:5.3:isms_roles_program_review
control_ref: '5.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS Roles Program Review must be conducted with a clear understanding of the ISMS scope,
    as this defines which organizational units, processes, and assets are in play for roles and responsibilities.
  good_enough: A documented scope statement that identifies the boundaries and applicability of the ISMS,
    even if minor updates are pending.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: direct
  rationale: The review verifies that assigned roles and responsibilities are current and effective, so
    a documented matrix or register of roles must already exist.
  good_enough: A roles and responsibilities matrix or register that covers all key ISMS functions, even
    if some job titles or names need minor updates.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: The review checks that segregation of duties is maintained, so the current approach to separating
    conflicting roles must be documented.
  good_enough: A description or mapping of how duties are segregated for ISMS-relevant processes, even
    if not yet fully automated or formalized.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the expectations for roles, responsibilities, and the RACI framework, which
    the review must assess for alignment.
  good_enough: A published information security policy that references roles and responsibilities, even
    if due for its annual review.
