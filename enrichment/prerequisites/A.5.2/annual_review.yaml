leaf_id: req:A.5.2:annual_review
control_ref: A.5.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization and which roles are included
    in the ISMS, ensuring the review covers all relevant roles and responsibilities.
  good_enough: A documented scope that clearly identifies the organizational boundaries and functions
    covered by the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the baseline for security roles and responsibilities, providing the reference
    point for what should be reviewed and maintained.
  good_enough: A current, approved policy that assigns or references key security roles and responsibilities.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are segregated is essential for reviewing whether roles and responsibilities
    remain appropriate and effective.
  good_enough: A documented approach or matrix showing how critical duties are separated to prevent conflicts
    of interest or fraud.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what assets exist and who is responsible for them is necessary to ensure all relevant
    roles are included in the review.
  good_enough: An up-to-date list of key information assets with assigned owners or custodians.
