leaf_id: req:Art.30:data_flow_inventory
control_ref: Art.30
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The data flow inventory must align with the defined scope of the ISMS to ensure all relevant
    systems, processes, and locations are included. Without a clear scope, the inventory may miss critical
    data flows or include irrelevant ones.
  good_enough: A documented ISMS scope that clearly identifies the organizational boundaries and information
    assets relevant to personal data processing.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Understanding the lawful basis for each processing activity is essential to accurately map
    personal data flows and justify why data is being collected, stored, or transferred.
  good_enough: A list or matrix mapping each processing activity to its lawful basis, even if some are
    provisional or pending legal review.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer (DPO) Designation
  category: foundational
  rationale: The DPO is typically responsible for overseeing data mapping and ensuring the inventory is
    accurate and up to date. Without a designated DPO or equivalent, ownership and accountability for
    the data flow inventory may be unclear.
  good_enough: A named individual or team responsible for data protection tasks, with contact details
    and a basic description of their role, even if formal appointment is in progress.
