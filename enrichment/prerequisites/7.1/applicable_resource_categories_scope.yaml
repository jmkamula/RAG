leaf_id: req:7.1:applicable_resource_categories_scope
control_ref: '7.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines the boundaries of the management system, including which
    parts of the organization and which resources are included or excluded. You cannot determine which
    resource categories are in or out of scope for tracking until the overall ISMS scope is clear.
  good_enough: A documented scope statement that identifies the organizational units, processes, and locations
    covered by the ISMS, even if some details are still being finalized.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An initial asset register is needed to identify what resource categories exist, so you can
    decide which ones are tracked within the ISMS and which are not. Without this, you can't meaningfully
    define the scope of applicable resource categories.
  good_enough: A draft list of major information assets and resource types, even if not fully classified
    or complete.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A basic classification scheme helps group resources into categories, making it possible to
    define which categories are in or out of scope for the ISMS. This supports consistent scoping decisions.
  good_enough: A simple, documented set of resource categories or classes, even if not all assets have
    been assigned to them yet.
