leaf_id: req:6.2:applicable_functions_scope
control_ref: '6.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the overall boundaries of your ISMS before you can specify which functions
    and levels are relevant for objectives under 6.2. The ISMS scope sets the context for what is in or
    out.
  good_enough: A draft scope statement that clearly describes the organizational units, locations, and
    activities included in the ISMS—even if some details are still being finalized.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the direction and priorities for information security, which informs which
    functions and levels should carry objectives. Without this, it's unclear how to allocate responsibilities.
  good_enough: A published or draft policy that outlines the organization's commitment to information
    security and high-level objectives.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: direct
  rationale: Clear assignment of roles and responsibilities is necessary to identify which functions and
    levels are accountable for meeting objectives. This ensures objectives are not assigned to undefined
    or ambiguous groups.
  good_enough: A working list or matrix of key roles and their information security responsibilities,
    even if not fully formalized.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are segregated helps define which functions and levels should be
    scoped for objectives, avoiding conflicts of interest or gaps.
  good_enough: A documented approach or summary of how critical duties are separated, especially for sensitive
    or high-risk activities.
