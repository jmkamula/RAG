leaf_id: req:A.8.4:source_code_monitoring_log
control_ref: A.8.4
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope must clearly define whether source code repositories are in-scope for monitoring
    and protection. Without this, it's unclear if source code access monitoring is required or applicable.
  good_enough: The scope statement explicitly includes (or excludes) source code repositories and related
    systems.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need an up-to-date asset register to identify which source code repositories and related
    systems require access monitoring. This ensures all relevant assets are covered by monitoring controls.
  good_enough: A current list of source code repositories and their owners exists, even if not fully detailed.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of source code assets helps determine the level of monitoring
    and logging required. Higher sensitivity may demand stricter monitoring.
  good_enough: Source code assets have at least a preliminary classification assigned (e.g., confidential,
    internal).
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures accountability for monitoring, reviewing, and responding
    to source code access events. Without this, logs may be collected but not acted upon.
  good_enough: Named individuals or teams are responsible for source code access monitoring, even if processes
    are still maturing.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies threats and vulnerabilities related to source code access, helping
    prioritize what monitoring is necessary and why.
  good_enough: A recent risk assessment covers source code repositories and highlights access risks, even
    if mitigation plans are still in progress.
