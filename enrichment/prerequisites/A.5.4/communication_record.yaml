leaf_id: req:A.5.4:communication_record
control_ref: A.5.4
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which personnel are in-scope for ISMS
    communications. Without a clear scope, you can’t ensure directives reach everyone required.
  good_enough: A documented scope that identifies all relevant business units and personnel groups is
    available and up to date.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The communication record must show distribution of management directives, which are typically
    derived from the main security policy. You can’t record communication of directives that don’t exist.
  good_enough: A current, approved information security policy exists and is accessible for reference.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Information security roles and responsibilities
  category: direct
  rationale: You must know who is responsible for communicating directives and who must receive them.
    Clear roles and responsibilities are essential to target and evidence communication.
  good_enough: Roles and responsibilities for information security are defined and assigned to named individuals
    or functions.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding segregation of duties helps ensure that communication records reflect the correct
    distribution of directives to all relevant personnel, especially where duties are split.
  good_enough: A basic mapping of key duties and their segregation exists, so you can identify all personnel
    who must receive directives.
