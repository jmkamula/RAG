leaf_id: req:A.7.6:work_session_register
control_ref: A.7.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which physical areas and operations are covered by your ISMS before defining
    which secure areas require work session registers. Without this, you risk missing key locations or
    over-documenting irrelevant ones.
  good_enough: A clear, approved scope statement that identifies all secure areas relevant to the ISMS
    is available.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register helps identify which secure areas contain critical assets, ensuring
    the work session register covers all necessary locations.
  good_enough: A current list of physical locations and assets classified as secure areas exists, even
    if not fully detailed.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures you know who is responsible for supervising, recording,
    and reviewing non-routine work sessions in secure areas.
  good_enough: Documented responsibilities for secure area oversight and register maintenance are assigned,
    even if not fully operationalized.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: A classification scheme helps determine which areas are considered 'secure' and therefore
    require special controls like session registers.
  good_enough: A basic classification scheme exists that distinguishes secure areas from general areas,
    even if refinement is ongoing.
