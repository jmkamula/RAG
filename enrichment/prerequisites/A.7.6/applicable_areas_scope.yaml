leaf_id: req:A.7.6:applicable_areas_scope
control_ref: A.7.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines the physical and logical boundaries of the information security management
    system, which is essential to determine which areas could be considered 'secure areas' under A.7.6.
  good_enough: A documented scope statement that clearly identifies all locations, assets, and processes
    included in the ISMS, even if not fully detailed yet.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme determines how information and assets are categorized, which directly
    informs which areas require enhanced security controls as 'secure areas.'
  good_enough: A basic, documented classification scheme that identifies at least the main tiers or categories
    relevant to physical and logical areas.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to identify which physical and logical assets are
    present in each area, supporting the identification of secure areas.
  good_enough: A preliminary asset register listing key assets and their locations, even if some details
    are pending.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment results help determine which areas need to be designated as secure based
    on the threats and vulnerabilities identified.
  good_enough: An initial risk assessment that highlights areas or assets of higher risk, sufficient to
    inform early secure area decisions.
