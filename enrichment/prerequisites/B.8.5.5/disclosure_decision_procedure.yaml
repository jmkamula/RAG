leaf_id: req:B.8.5.5:disclosure_decision_procedure
control_ref: B.8.5.5
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Disclosure Decision Procedure must be aligned with the defined scope of the ISMS to ensure
    it covers all relevant information assets and processing activities. Without a clear scope, you cannot
    determine which requests or data are in play.
  good_enough: The ISMS scope statement should be documented and approved, with boundaries clear enough
    to identify which customer data and processing activities are covered.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: You need to know who is authorised to make, review, or approve disclosure decisions, and
    who is responsible for consulting with customers. Without this, the procedure cannot assign or enforce
    accountability.
  good_enough: Key roles for handling disclosure requests are named, with responsibilities outlined at
    least at a high level.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The procedure must distinguish between legally binding and non-legally-binding requests,
    which requires clarity on what constitutes a lawful basis for disclosure under applicable laws and
    contracts.
  good_enough: A documented list or matrix of lawful bases for disclosure exists, even if not fully exhaustive,
    to guide decision-making.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: Knowing the classification of information helps determine the sensitivity of data subject
    to disclosure requests and whether special handling or customer consultation is required.
  good_enough: There is a basic classification scheme in place, and the data types relevant to customer
    information are identified.
- ref: B.8.5.4
  standard_id: ISO27701:2019
  title: Notification of Compulsory Requests
  category: direct
  rationale: The procedure for handling compulsory requests (B.8.5.4) must be understood so that the Disclosure
    Decision Procedure (B.8.5.5) can clearly address non-compulsory requests and avoid overlap or gaps.
  good_enough: The organisation has at least a draft or outline of its compulsory request notification
    process, so the distinction can be made in the new procedure.
