leaf_id: req:A.8.20:networks_security_policy
control_ref: A.8.20
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Networks Security Policy must clearly define which networks and devices are in-scope
    for security controls. Without a defined ISMS scope, the policy cannot specify coverage or boundaries.
  good_enough: A documented scope statement that lists included business units, locations, and technology
    types is available and approved.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The policy should be informed by the risks identified in the organization’s risk assessment,
    ensuring controls are proportionate and relevant to actual threats to networks and devices.
  good_enough: A recent risk assessment exists that identifies key network-related risks and their impact,
    even if mitigation plans are still in progress.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to identify which networks and devices require protection
    and management under the policy.
  good_enough: A basic inventory of network assets and devices is available, even if not fully detailed
    or automated.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The policy must assign responsibility for network security management, monitoring, and change
    control. Without defined roles, policy enforcement is unclear.
  good_enough: A simple matrix or list showing who is accountable for network security exists, even if
    not fully mapped to all assets.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The Networks Security Policy should align with and support the organization’s overarching
    information security policy, ensuring consistency in principles and objectives.
  good_enough: The top-level security policy is published and accessible, even if not recently reviewed.
