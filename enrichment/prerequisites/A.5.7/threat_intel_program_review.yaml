leaf_id: req:A.5.7:threat_intel_program_review
control_ref: A.5.7
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which assets are covered by the ISMS
    to ensure the threat intelligence program review is relevant and comprehensive.
  good_enough: A documented scope statement that clearly defines the organizational and asset boundaries
    for the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The threat intelligence program should be aligned with the organization's risk profile, so
    a current risk assessment is needed to identify which threats are most relevant.
  good_enough: A recent risk assessment identifying key threats and risks to the organization, even if
    not fully detailed, is available for reference.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what assets are being protected helps focus the threat intelligence review on the
    most critical and relevant areas.
  good_enough: An up-to-date list of information assets, even if some attributes are pending, is available
    to inform the review.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are involved in the review and that
    feedback and actions are tracked.
  good_enough: Documented roles and responsibilities for the threat intelligence process and review participants,
    even if not fully formalized.
