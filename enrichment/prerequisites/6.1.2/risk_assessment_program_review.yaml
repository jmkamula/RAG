leaf_id: req:6.1.2:risk_assessment_program_review
control_ref: 6.1.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of the organization and which assets are covered by the ISMS
    before you can meaningfully review whether the risk assessment program is fit for purpose.
  good_enough: A documented scope statement that clearly defines the boundaries and applicability of the
    ISMS is available and up to date.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The information security policy sets the overall direction and expectations for risk management,
    which the risk assessment program review must align with.
  good_enough: A current, approved information security policy exists and is accessible to those conducting
    the review.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment Process
  category: direct
  rationale: You must have a documented risk assessment process in place to review—otherwise, there is
    nothing to verify for adherence or suitability.
  good_enough: A written risk assessment methodology and procedure exist, even if they are basic, and
    have been communicated to relevant staff.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is essential to ensure the risk assessment program is reviewing
    all relevant assets and that the register referenced in the review is current.
  good_enough: A maintained list of key information assets exists, even if not exhaustive, and is referenced
    in risk assessments.
