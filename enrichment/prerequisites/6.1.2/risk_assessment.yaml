leaf_id: req:6.1.2:risk_assessment
control_ref: 6.1.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The risk assessment procedure must operate within the defined boundaries of the ISMS. Without
    a clear scope, you cannot determine which assets, processes, or risks are relevant.
  good_enough: A documented scope statement that identifies the organisational units, assets, and processes
    covered by the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the organisation’s risk appetite and objectives, which the risk assessment
    process must align with. It frames how risks are evaluated and accepted.
  good_enough: A published information security policy that includes risk management objectives and acceptance
    criteria.
- ref: '5.3'
  standard_id: ISO27001:2022
  title: Organisational Roles, Responsibilities and Authorities
  category: foundational
  rationale: Risk assessment requires clearly assigned roles, especially for risk owners who have the
    authority to accept or treat risks. Without this, the process cannot be meaningfully applied.
  good_enough: A list or matrix showing who is responsible for risk assessment activities and who can
    accept residual risk.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Inventory of Information and Other Associated Assets
  category: direct
  rationale: Risks are assessed in relation to assets. An up-to-date asset register is essential to identify
    what needs protection and to scope the risk assessment.
  good_enough: A draft or working asset register that covers key information assets, even if not fully
    complete.
