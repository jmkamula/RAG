leaf_id: req:A.7.9:applicable_classes_scope
control_ref: A.7.9
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the overall boundaries of your ISMS before you can define which asset classes
    and destinations are in scope for special handling. This ensures alignment and prevents accidental
    omissions or overreach.
  good_enough: A documented scope statement that clearly lists included business units, locations, and
    technologies is available and approved.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You must have an inventory of assets to identify which asset classes are relevant and require
    inclusion or exclusion in the scope for special handling.
  good_enough: A basic, up-to-date asset register exists, listing key information assets by type or class.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A defined classification scheme is needed to categorize assets and determine which require
    special handling or controls, directly informing the scope of applicable classes.
  good_enough: A documented scheme exists that assigns at least basic categories (e.g., public, internal,
    confidential) to asset types.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Understanding which assets and scenarios present significant risks helps prioritize which
    asset classes and destinations need to be in scope for special handling.
  good_enough: A recent risk assessment has been performed, identifying key risks related to asset classes
    and their destinations.
