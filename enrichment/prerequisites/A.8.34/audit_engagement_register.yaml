leaf_id: req:A.8.34:audit_engagement_register
control_ref: A.8.34
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The audit engagement register must align with the defined scope of the ISMS to ensure that
    only relevant systems, processes, and assets are included in audit activities. Without a clear scope,
    the register could be incomplete or misaligned.
  good_enough: A documented scope statement that identifies the boundaries and applicability of the ISMS,
    even if not fully detailed, is sufficient to proceed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what assets exist is essential for planning and recording audit engagements, as audits
    typically target specific assets or asset groups. The register should reference these assets accurately.
  good_enough: A basic, up-to-date list of key assets within the ISMS scope is enough to start drafting
    the audit engagement register.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The register must record who is responsible for each audit engagement, including testers
    and approvers. Clear assignment of roles ensures accountability and traceability.
  good_enough: A current list of assigned roles for audit-related activities, even if not exhaustive,
    will unblock the drafting of the register.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Audit engagements should be prioritized based on risk. Understanding the organization's risk
    landscape helps determine which areas require more frequent or in-depth audits.
  good_enough: A recent risk assessment covering major risks to information security, sufficient to guide
    audit focus, is adequate for this stage.
