leaf_id: req:A.7.2.1:applicable_scope
control_ref: A.7.2.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The ISMS scope defines the organizational and business boundaries for information security,
    which is essential to determine which activities could involve PII processing. Without this, you can't
    reliably identify which business activities are in play for privacy controls.
  good_enough: A clear, documented ISMS scope that covers all business units, processes, and systems where
    PII might be processed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register helps identify all information assets and systems, which is
    necessary to pinpoint where PII is processed and which activities should be included in the privacy
    scope.
  good_enough: A working list of information assets and systems, with enough detail to spot those that
    handle or store PII.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: A classification scheme ensures you can distinguish PII from non-PII data, which is critical
    for scoping only the relevant processing activities for privacy management.
  good_enough: A basic data classification policy that flags PII and non-PII, even if not fully rolled
    out to all assets yet.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: cross_role
  rationale: Clear assignment of roles and responsibilities ensures that someone is accountable for identifying
    and documenting PII processing activities, which is necessary to define the applicable scope.
  good_enough: Named individuals or teams responsible for privacy and information security, with roles
    documented at a high level.
