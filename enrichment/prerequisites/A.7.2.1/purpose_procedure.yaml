leaf_id: req:A.7.2.1:purpose_procedure
control_ref: A.7.2.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which business units, processes, and systems are in-scope for privacy management
    before you can identify and document purposes for PII processing. Without a clear scope, purpose identification
    will be incomplete or misaligned.
  good_enough: A documented scope statement that clearly defines the organizational and process boundaries
    for the ISMS and privacy extension.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: An up-to-date asset register is essential to identify all information assets and processing
    activities that may involve PII. You can't reliably identify purposes for processing if you don't
    know what assets and data flows exist.
  good_enough: A basic, current list of information assets and processing activities, with enough detail
    to map PII flows.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: A data classification scheme helps distinguish PII from other data types, ensuring that the
    purpose identification procedure targets the right processing activities.
  good_enough: A documented scheme that clearly marks PII and sensitive data, even if not fully rolled
    out.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Purpose identification is tightly linked to identifying the lawful basis for processing.
    You need a method for determining lawful basis to ensure each purpose is valid and compliant.
  good_enough: A draft or template process for mapping purposes to lawful bases, even if not yet fully
    implemented.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities (RoPA)
  category: cross_role
  rationale: RoPA requires you to document the purposes of processing for each activity. Understanding
    what RoPA expects ensures your procedure captures the right information for compliance.
  good_enough: A RoPA template or outline showing required fields for purpose documentation, even if not
    fully populated.
