leaf_id: req:7.3:applicable_audience_scope
control_ref: '7.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS—what parts of the organisation and which activities
    are in-scope—before you can define who must be included in the awareness program. This ensures the
    audience is aligned with the ISMS's actual coverage.
  good_enough: A clear, documented scope statement that identifies the organisational units, activities,
    and locations covered by the ISMS.
- ref: '7.2'
  standard_id: ISO27001:2022
  title: Competence
  category: direct
  rationale: The competence requirements help determine which roles and individuals need specific awareness,
    so you can identify who must be included in the awareness audience.
  good_enough: A list or mapping of roles/functions with their required competence levels for information
    security, even if not fully detailed.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Understanding who is responsible for what within the ISMS helps clarify which persons are
    'doing work under the organisation's control' and must be included in the awareness scope.
  good_enough: A basic roles and responsibilities matrix or document that covers key ISMS-related functions
    and personnel.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets are managed and by whom can help identify additional individuals (like
    contractors or embedded suppliers) who should be included in the awareness audience.
  good_enough: An initial asset register that lists key information assets and their custodians, even
    if not exhaustive.
