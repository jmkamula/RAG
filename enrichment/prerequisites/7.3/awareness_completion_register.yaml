leaf_id: req:7.3:awareness_completion_register
control_ref: '7.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which people, processes, and locations are in-scope for the ISMS to ensure
    the awareness register covers everyone required. Without a clear scope, you can't be sure your register
    is complete or accurate.
  good_enough: A documented scope statement that clearly lists the organisational boundaries and included
    personnel is available and up to date.
- ref: '7.2'
  standard_id: ISO27001:2022
  title: Competence
  category: direct
  rationale: Competence requirements define which roles need what level of awareness and training. The
    awareness completion register must align with these requirements to show the right people have completed
    the right modules.
  good_enough: A list of roles and their required competence levels is documented, even if not fully mapped
    to every individual yet.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures you know who is accountable for awareness
    delivery and tracking, and who should be included in the register.
  good_enough: A basic roles and responsibilities matrix exists, showing who is responsible for awareness
    and who must participate.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register helps identify all users (e.g., employees, contractors) with
    access to information assets, ensuring no one is missed from the awareness program and register.
  good_enough: A current list of information assets and associated users is available, even if not fully
    detailed.
