leaf_id: req:7.3:isms_awareness_evidence
control_ref: '7.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS — which people, processes, and locations are
    in-scope — to determine who must be covered by the awareness programme.
  good_enough: A documented scope statement that clearly identifies the organisational and operational
    boundaries for the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The awareness programme must communicate the core policy requirements, so the policy must
    exist and be approved before you can design the programme content.
  good_enough: A formally approved, published information security policy that outlines the organisation’s
    security objectives and principles.
- ref: '7.2'
  standard_id: ISO27001:2022
  title: Competence
  category: direct
  rationale: Competence requirements help define what staff need to know and do, shaping the topics and
    depth of the awareness programme.
  good_enough: A list or matrix of required competencies for relevant roles, even if not fully assessed
    yet.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles ensures the awareness programme targets the
    right audiences and addresses specific responsibilities.
  good_enough: A documented overview of key information security roles and their main responsibilities,
    sufficient to identify training audiences.
