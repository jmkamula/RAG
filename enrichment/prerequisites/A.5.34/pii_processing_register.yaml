leaf_id: req:A.5.34:pii_processing_register
control_ref: A.5.34
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of your organization and which information assets are in scope
    for your ISMS before you can accurately catalog all PII processing activities. Without a clear scope,
    your PII Processing Register may be incomplete or misaligned.
  good_enough: A documented ISMS scope that clearly identifies the business units, processes, and systems
    covered by the ISMS, including those handling PII.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all information assets (systems, databases,
    documents) that may process or store PII. This ensures the PII Processing Register is comprehensive
    and not missing key processing activities.
  good_enough: A basic inventory of information assets, with enough detail to identify which assets process
    or store PII.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A working classification scheme is needed to distinguish PII from other types of information,
    so you can accurately identify and describe processing activities involving PII in the register.
  good_enough: A documented scheme that defines PII as a classification category and is applied to assets
    and data types.
- ref: A.5.31
  standard_id: ISO27001:2022
  title: Legal, statutory, regulatory and contractual requirements
  category: direct
  rationale: You must know which privacy laws and contractual obligations apply to your organization,
    as these define what must be included in the PII Processing Register and how it should be maintained.
  good_enough: A list or register of applicable privacy laws and contractual privacy requirements, even
    if not fully mapped yet.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities (RoPA)
  category: cross_role
  rationale: If your organization is subject to GDPR, the RoPA requirements directly inform the structure
    and content of your PII Processing Register. Leveraging RoPA ensures you meet both ISO and GDPR obligations
    efficiently.
  good_enough: A draft or template RoPA that outlines required fields and processing activities, even
    if not fully populated.
