leaf_id: req:Art.15:dsar_handling_procedure
control_ref: Art.15
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.12
  standard_id: GDPR:2016/679
  title: Transparent information, communication and modalities for the exercise of the rights of the data
    subject
  category: direct
  rationale: Art.12 defines the required modalities for handling DSARs, including communication methods,
    response deadlines, and extension conditions. Without this, the DSAR procedure cannot be properly
    structured or timed.
  good_enough: You have a clear summary of Art.12’s requirements for DSARs, especially the 1-month deadline
    and extension rules, to inform your procedure draft.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: Up-to-date RoPA is essential for identifying what personal data is held, where, and by whom,
    so you can locate and provide the correct information in response to a DSAR.
  good_enough: You have a current, working RoPA that lists processing activities and data locations, even
    if not fully optimized, so you can reference it when fulfilling access requests.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Knowing the lawful basis for each processing activity is necessary to explain to data subjects
    why their data is processed, as required in DSAR responses.
  good_enough: You have a mapped list of lawful bases for your main processing activities, sufficient
    to answer “why do we process this data?” in a DSAR context.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer Designation
  category: foundational
  rationale: If a DPO is required, their involvement is critical for overseeing and advising on DSAR handling,
    ensuring compliance and acting as a contact point for data subjects.
  good_enough: You have determined if a DPO is needed and, if so, have designated one with clear responsibilities
    for DSAR oversight.
