leaf_id: req:A.8.32:change_program_review
control_ref: A.8.32
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, processes, and assets are in-scope for the ISMS to ensure
    the change management program review covers all relevant areas. Without a clear scope, the review
    could miss critical systems or include irrelevant ones.
  good_enough: A documented scope statement that identifies the boundaries and applicability of the ISMS,
    even if some minor clarifications are pending.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that responsibilities for change management, review, and
    follow-up actions are understood. Without this, it's unclear who should participate in or act on the
    review.
  good_enough: A current list or matrix showing who is responsible for change management and its review,
    even if not all roles are fully trained yet.
- ref: A.8.19
  standard_id: ISO27001:2022
  title: Installation of software on operational systems
  category: direct
  rationale: The rules and controls for software installation are a key part of change management. Reviewing
    the change management program requires knowing how software changes are governed and tracked.
  good_enough: Documented procedures or rules for software installation, with evidence that they are being
    followed in practice.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is needed to verify that all relevant assets are included in
    the change management program and its review. Missing assets could mean incomplete change tracking.
  good_enough: A reasonably current asset register that covers major systems and applications, even if
    some minor assets are still being catalogued.
