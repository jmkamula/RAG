leaf_id: req:4.2:applicable_stakeholder_domains_scope
control_ref: '4.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS Scope Statement defines the overall boundaries of the management system, which is
    essential to determine which stakeholder domains are relevant and should be included or excluded.
    Without this, you cannot meaningfully identify or justify stakeholder categories in or out of scope.
  good_enough: A draft scope statement that lists the business units, locations, and activities covered
    by the ISMS—even if not fully ratified—is sufficient to proceed.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The Information Security Policy sets the direction and priorities for information security,
    which guides decisions about which stakeholder domains are relevant and how exclusions are justified.
  good_enough: A current or draft policy that outlines the organization’s security objectives and commitments
    is enough to inform stakeholder scope decisions.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that the right people are involved
    in identifying and documenting stakeholder domains, and that accountability for inclusions/exclusions
    is established.
  good_enough: A basic roles and responsibilities matrix or list showing who owns stakeholder mapping
    and scope decisions is sufficient at this stage.
