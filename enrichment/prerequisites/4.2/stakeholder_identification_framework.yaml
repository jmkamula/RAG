leaf_id: req:4.2:stakeholder_identification_framework
control_ref: '4.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS before you can identify relevant stakeholders.
    The scope defines which business units, processes, and assets are in play, directly influencing who
    your stakeholders are.
  good_enough: A documented scope statement that clearly outlines what is included and excluded from the
    ISMS. It should be specific enough to guide stakeholder identification, even if not fully optimized.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Understanding who holds key roles and responsibilities within the ISMS helps ensure all internal
    stakeholders are captured. This prevents gaps or overlaps when mapping out who needs to be engaged.
  good_enough: A current list or chart of ISMS roles and their main responsibilities, even if some job
    descriptions are still being finalized.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what information assets exist and who owns or uses them is essential for identifying
    stakeholders. The asset register points to individuals or groups with a vested interest in ISMS outcomes.
  good_enough: A basic inventory of key information assets and their owners or custodians. It doesn't
    need to be exhaustive, but should cover the main assets in scope.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A classification scheme helps determine which stakeholders are relevant based on the sensitivity
    and criticality of information. This ensures the stakeholder framework covers all necessary perspectives.
  good_enough: A draft or working version of the classification scheme that distinguishes at least between
    public, internal, and confidential information.
