leaf_id: req:Art.33:notification_procedure
control_ref: Art.33
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a clear and up-to-date record of processing activities to quickly identify which
    data, systems, and stakeholders are affected by a breach. Without this, timely and accurate notification
    under Art.33 is nearly impossible.
  good_enough: A current, accessible RoPA that covers all relevant processing activities and responsible
    contacts is available to the breach response team.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a DPO is required, they must be involved in breach notification. The procedure must clarify
    who coordinates with authorities and data subjects, and this is impossible if the DPO role is undefined.
  good_enough: A named DPO (or documented rationale for not appointing one) is in place, with contact
    details known to those drafting notifications.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You must know which parts of your organization and which data are covered by your ISMS to
    determine if a breach falls within the notification procedure’s remit.
  good_enough: A documented ISMS scope exists, and the breach response team knows which systems and data
    are in-scope for GDPR notification.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis
  category: foundational
  rationale: Understanding the lawful basis for processing helps assess breach impact and informs what
    must be disclosed in notifications. This shapes the content and urgency of the notification.
  good_enough: Each processing activity in the RoPA has a stated lawful basis, even if not exhaustively
    reviewed for every edge case.
