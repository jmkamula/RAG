leaf_id: req:8.1:applicable_processes_scope
control_ref: '8.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS Scope Statement defines the organizational and physical boundaries of the ISMS,
    which is essential to determine which operational processes are relevant for clause 8.1. Without this,
    you cannot accurately identify or justify the inclusion or exclusion of processes.
  good_enough: A documented scope statement that clearly describes what parts of the organization and
    which activities are covered by the ISMS, even if some details are still being finalized.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register helps identify which processes handle or depend on ISMS-relevant
    assets, supporting decisions about process inclusion or exclusion in the 8.1 scope.
  good_enough: A basic inventory of key information assets and their associated processes, sufficient
    to map assets to operational activities.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that process ownership and accountability
    are established, which is necessary for scoping and managing ISMS-relevant processes.
  good_enough: A list or matrix showing who is responsible for key ISMS processes, even if some roles
    are still being clarified.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: The risk assessment identifies which processes are critical from an information security
    perspective, helping to justify their inclusion or exclusion in the 8.1 scope.
  good_enough: A preliminary risk assessment that highlights major process-related risks, even if not
    all risks are fully analyzed yet.
