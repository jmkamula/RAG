leaf_id: req:8.1:operational_planning_program_review
control_ref: '8.1'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which processes, assets, and organizational units are covered
    by the ISMS, ensuring the operational planning review is relevant and complete.
  good_enough: A documented scope statement exists that clearly identifies the boundaries and applicability
    of the ISMS for the organization.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the direction and principles for information security, providing the baseline
    against which operational planning and reviews are measured.
  good_enough: A current, approved information security policy is available and communicated to relevant
    stakeholders.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Understanding current risks is essential for meaningful operational planning and for verifying
    that controls and processes address those risks during the review.
  good_enough: A recent risk assessment has been performed and documented, identifying key risks relevant
    to the ISMS scope.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is necessary to confirm that all relevant assets are included
    in operational planning and that their management is reviewed.
  good_enough: A maintained asset register exists, listing key information assets within the ISMS scope.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clearly defined roles ensure that responsibilities for operational planning, execution, and
    review are assigned and understood.
  good_enough: Roles and responsibilities for ISMS operation and review are documented and assigned to
    specific personnel.
