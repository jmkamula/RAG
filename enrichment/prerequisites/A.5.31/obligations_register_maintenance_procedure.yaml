leaf_id: req:A.5.31:obligations_register_maintenance_procedure
control_ref: A.5.31
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the organizational and jurisdictional boundaries of your ISMS to determine
    which laws, regulations, and contractual obligations are relevant for the register. Without a clear
    scope, you can't reliably identify what needs to be tracked or updated.
  good_enough: A documented scope statement that lists included business units, geographies, and activities
    is available and approved.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The procedure must assign responsibility for maintaining the register. If roles and responsibilities
    are unclear, you can't specify who is accountable for updates or intake.
  good_enough: A current roles and responsibilities matrix or document exists, showing who owns compliance
    and register maintenance tasks.
- ref: A.5.31
  standard_id: ISO27001:2022
  title: Identification of Legal, Statutory, Regulatory and Contractual Requirements (Register)
  category: direct
  rationale: The maintenance procedure depends on the existence of the actual register. You can't describe
    how to keep something up to date if it doesn't exist yet.
  good_enough: A draft or working version of the obligations register exists, even if incomplete, listing
    at least some current legal and regulatory requirements.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the organization's commitment to compliance and continuous improvement, which
    underpins the need for a maintenance procedure. Without this, the rationale for keeping the register
    current may be unclear.
  good_enough: A published information security policy that references compliance obligations and the
    need for up-to-date registers.
