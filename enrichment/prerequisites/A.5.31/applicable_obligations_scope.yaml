leaf_id: req:A.5.31:applicable_obligations_scope
control_ref: A.5.31
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines the organisational boundaries, business activities, and
    locations covered by the management system. You need this clarity to identify which jurisdictions,
    services, and data types are relevant when determining applicable obligations.
  good_enough: A documented scope that clearly lists the business units, locations, and activities included
    in the ISMS—even if some details are high-level or pending refinement.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what information assets exist (and where) is essential for mapping which obligations
    apply to which data, systems, or processes. Without an asset register, you can't reliably identify
    the surfaces that obligations touch.
  good_enough: A basic inventory of key information assets, with enough detail to distinguish major data
    types, systems, and locations—even if not yet exhaustive.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A classification scheme helps you understand the categories of data processed (e.g., personal,
    confidential, regulated), which is critical for determining the scope of applicable obligations.
  good_enough: A draft or adopted scheme that categorises data types relevant to the business, even if
    some categories are still being refined.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Risk assessment identifies business activities and contexts that may attract regulatory or
    contractual obligations. This informs which surfaces and scenarios must be considered in your obligations
    scope.
  good_enough: A recent risk assessment covering core business activities and data flows, highlighting
    areas of regulatory or contractual exposure.
