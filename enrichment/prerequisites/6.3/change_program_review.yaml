leaf_id: req:6.3:change_program_review
control_ref: '6.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need a clear ISMS scope to ensure the change program review covers all relevant systems,
    processes, and boundaries. Without this, you can't confirm that changes are being identified and tracked
    across the correct organizational areas.
  good_enough: A documented and approved scope statement that identifies what is in and out of scope for
    the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is essential to verify that all assets impacted by changes are
    tracked and that the change program review can confirm completeness and accuracy.
  good_enough: A current list of key information assets, with owners and basic attributes, is available
    and referenced in the change process.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessments inform which changes are significant and should trigger updates in the change
    register. The review process relies on this context to judge if triggers are firing as intended.
  good_enough: A recent risk assessment exists, covering major assets and processes, and is referenced
    in change management decisions.
- ref: A.8.32
  standard_id: ISO27001:2022
  title: Change Management
  category: direct
  rationale: The change management process itself must be defined and operational before you can review
    whether its triggers and boundaries are effective and up-to-date.
  good_enough: A documented change management process exists, with clear triggers and a register of changes,
    even if not fully mature.
