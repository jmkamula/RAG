leaf_id: req:A.8.1:user_endpoint_devices_policy
control_ref: A.8.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organisation, business units, and device types are in
    scope for the ISMS before defining which user endpoint devices the policy will cover.
  good_enough: A clear, current scope statement that identifies the organisational and technical boundaries
    relevant to endpoint devices.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which endpoint devices exist, their
    owners, and their risk profile, so the policy can address all relevant device classes.
  good_enough: A basic inventory of user endpoint devices (e.g., laptops, mobiles, tablets) with ownership
    and location details.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment helps determine which threats and vulnerabilities are most relevant to
    endpoint devices, shaping the baseline protections required in the policy.
  good_enough: A recent risk assessment that includes risks related to user endpoint devices, even if
    mitigation actions are still in progress.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The policy must align with how information is classified, since device controls depend on
    the sensitivity of data they store or process.
  good_enough: A documented classification scheme that is referenced by the endpoint device policy, even
    if not all data is yet classified.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The overarching information security policy sets the tone and principles that the endpoint
    device policy must follow.
  good_enough: A published information security policy that includes high-level commitments to device
    security, even if details are pending.
