leaf_id: req:A.8.1:applicable_endpoint_scope
control_ref: A.8.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines the organisational and technical boundaries for the entire
    information security management system, including which assets and processes are in-scope. You cannot
    meaningfully define which endpoint classes are applicable unless you know what is covered by the ISMS.
  good_enough: A documented, approved scope statement that clearly lists included business units, locations,
    and technologies.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The asset register provides the inventory of information assets, including endpoint types,
    that must be considered when determining which endpoints are in scope. Without this, you cannot reliably
    identify or justify inclusions or exclusions.
  good_enough: A current, basic inventory of endpoint types (e.g., laptops, desktops, servers, mobile
    devices) with ownership and location details.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme helps determine which endpoints process or store sensitive or critical
    information, influencing which endpoints must be included or may be excluded from scope.
  good_enough: A simple, documented scheme that assigns at least basic sensitivity levels to asset types,
    including endpoints.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies threats and vulnerabilities related to endpoints, supporting
    decisions about which endpoint classes are relevant for inclusion or exclusion in scope.
  good_enough: A recent risk assessment that covers endpoint-related risks, even if only at a high level.
