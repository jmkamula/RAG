leaf_id: req:7.2:applicable_roles_scope
control_ref: '7.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the overall boundaries of your ISMS before you can identify which roles
    actually affect its performance. The scope statement defines what parts of the organization and which
    activities are covered.
  good_enough: A clear, documented ISMS scope that identifies included business units, locations, and
    activities. It doesn't need to be perfect, but must exist and be agreed upon.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: direct
  rationale: A basic mapping of roles and their information security responsibilities is needed to determine
    which roles' work affects the ISMS. This helps filter out irrelevant roles.
  good_enough: A draft or working list of roles with assigned information security responsibilities. It
    can be high-level, but must exist.
- ref: '7.1'
  standard_id: ISO27001:2022
  title: Resources
  category: direct
  rationale: You must know what resources (including people) are allocated to the ISMS before you can
    assess which roles impact its effectiveness. Resource provision precedes competence determination.
  good_enough: A summary of allocated ISMS resources, especially personnel, is available. It doesn't need
    to be exhaustive, but should cover key areas.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are separated helps clarify which roles have a material impact on
    ISMS performance, especially where conflicts of interest or risk concentration may exist.
  good_enough: A basic outline of how key duties are separated in the ISMS context. Detailed matrices
    aren't required, but main separations should be documented.
