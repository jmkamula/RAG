leaf_id: req:7.2:competence_record
control_ref: '7.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The competence record must align with the defined ISMS scope, ensuring only relevant roles
    and activities are included. Without a clear scope, you can't reliably identify which roles impact
    ISMS performance.
  good_enough: A documented, management-approved ISMS scope statement that identifies the boundaries and
    applicability of the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: direct
  rationale: You need a current mapping of information security roles and responsibilities to know which
    positions require competence assessment. This ensures the register covers all relevant personnel.
  good_enough: A list or matrix of roles with assigned ISMS responsibilities, reviewed and agreed by management.
- ref: '7.1'
  standard_id: ISO27001:2022
  title: Resources
  category: direct
  rationale: Resource provision must be considered before assessing competence, as it affects training,
    hiring, and support for competence development. You can't close competence gaps without knowing available
    resources.
  good_enough: A summary of available and planned resources (people, budget, tools) for ISMS operations,
    sufficient to inform competence planning.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: Risk assessment results inform which roles are critical and what competencies are necessary
    to address ISMS risks. This ensures the competence record is risk-driven, not generic.
  good_enough: A recent risk assessment identifying key ISMS risks and the roles responsible for mitigating
    them.
