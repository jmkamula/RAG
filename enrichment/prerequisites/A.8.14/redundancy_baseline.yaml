leaf_id: req:A.8.14:redundancy_baseline
control_ref: A.8.14
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organisation and which services are in scope for the
    ISMS before you can define redundancy baselines for critical services. Otherwise, you risk omitting
    key systems or including irrelevant ones.
  good_enough: A documented scope statement that clearly lists the business units, locations, and services
    covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which information assets and services
    are critical and require redundancy. Without this, you can't reliably determine what needs protection.
  good_enough: A current list of information assets and services, with enough detail to identify those
    that are critical to business operations.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: You need a risk assessment to understand which services are critical and what level of availability
    is required. This informs the redundancy approach for each service.
  good_enough: A recent risk assessment that identifies threats to service availability and highlights
    critical services needing redundancy.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: A classification scheme helps you prioritise which services and assets require higher levels
    of redundancy based on their criticality and sensitivity.
  good_enough: A documented scheme that classifies assets and services by importance or sensitivity, used
    to guide redundancy decisions.
