leaf_id: req:A.8.14:failover_test_register
control_ref: A.8.14
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which systems, locations, and processes are covered by the ISMS,
    ensuring that failover testing is performed on the correct assets and environments.
  good_enough: The scope must be documented and clear enough to identify which systems require failover
    capability and testing.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is essential to identify all critical assets that require failover
    protection and should be included in failover tests.
  good_enough: A current list of key information assets and systems, with enough detail to select relevant
    targets for failover testing.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that staff know who is responsible for conducting, witnessing,
    and recording failover tests and outcomes.
  good_enough: Documented roles for failover testing and record-keeping, even if not fully detailed, so
    responsibilities are unambiguous.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The risk assessment identifies which systems and scenarios require failover measures and
    testing, guiding the focus of the failover test register.
  good_enough: A recent risk assessment that highlights critical systems and scenarios where failover
    is a relevant control.
