leaf_id: req:Art.12:transparency_procedure
control_ref: Art.12
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a clear, up-to-date record of what personal data is processed, for what purposes,
    and by whom, to ensure your transparency procedure covers all relevant processing activities and data
    subject rights.
  good_enough: A basic RoPA exists that lists core processing activities, purposes, and contact points,
    even if some details are pending refinement.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Knowing the lawful basis for each processing activity is essential to explain to data subjects
    why their data is processed and which rights apply, as required by the transparency procedure.
  good_enough: Each processing activity in the RoPA has at least a draft lawful basis assigned, even if
    some are under review.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer Designation
  category: foundational
  rationale: If a DPO is required, their contact details must be included in all communications with data
    subjects, and they play a key role in handling rights requests under the transparency procedure.
  good_enough: A DPO (or designated privacy contact) is named and reachable, even if formal notification
    to authorities is pending.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The ISMS scope defines which parts of the organization and which processing activities are
    covered, ensuring the transparency procedure aligns with actual operational boundaries.
  good_enough: A draft scope statement exists that identifies the main business units and systems handling
    personal data.
