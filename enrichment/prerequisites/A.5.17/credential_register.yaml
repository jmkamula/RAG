leaf_id: req:A.5.17:credential_register
control_ref: A.5.17
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, teams, and processes are in-scope for your ISMS before you
    can catalogue all credential types. Otherwise, your register may miss credentials used outside the
    defined boundaries.
  good_enough: A documented scope statement that clearly lists included systems and business units is
    sufficient to start the credential register.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The asset register identifies all information assets and systems, which is essential for
    mapping where credentials are used and what they protect. Without this, you risk missing credentials
    tied to unknown assets.
  good_enough: A basic, up-to-date inventory of key information assets and systems is enough to begin
    mapping credential types.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing how information is classified helps determine which credentials require stronger
    controls, such as MFA or stricter rotation. This ensures the register captures the right level of
    detail for each credential type.
  good_enough: A documented, working classification scheme that distinguishes at least between public,
    internal, and sensitive/confidential data is sufficient.
- ref: A.6.5
  standard_id: ISO27001:2022
  title: Responsibilities after termination or change of employment
  category: direct
  rationale: Credential registers must support timely revocation when staff leave or change roles. Understanding
    offboarding responsibilities ensures the register tracks credential ownership and revocation triggers.
  good_enough: A clear process or checklist for revoking access and credentials during offboarding is
    enough to inform the register’s ownership and lifecycle fields.
