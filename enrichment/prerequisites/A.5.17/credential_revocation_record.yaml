leaf_id: req:A.5.17:credential_revocation_record
control_ref: A.5.17
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: A.5.16
  standard_id: ISO27001:2022
  title: Identity Management
  category: direct
  rationale: You need a clear record of identity lifecycle events (creation, modification, revocation)
    to correctly pair credential revocation records with the underlying identity events. Without this,
    you can't reliably track which credentials belong to which identities or when an identity-level trigger
    should fire a credential revocation.
  good_enough: A basic register of identity events, with unique identifiers linking identities to their
    credentials, is in place and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: Credential records must reference the assets (systems, applications, devices) they grant
    access to. Without an asset register, you can't meaningfully record or audit which credentials protect
    which resources.
  good_enough: A working asset inventory exists, with enough detail to map credentials to specific assets
    or systems.
- ref: A.6.5
  standard_id: ISO27001:2022
  title: Responsibilities after Termination or Change of Employment
  category: direct
  rationale: Credential revocation is often triggered by employment changes. You need clarity on post-employment
    responsibilities to ensure revocation records are created promptly and comprehensively when staff
    leave or change roles.
  good_enough: Documented procedures exist for handling access and credential revocation during offboarding
    or role changes, even if not fully automated.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Someone must be clearly accountable for managing and recording credential revocation events.
    Without defined roles, revocation records may be missed or incomplete.
  good_enough: Named individuals or teams are assigned responsibility for credential management and revocation
    recordkeeping.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: Credential sensitivity (e.g., admin vs. user) affects how revocation is handled and recorded.
    A classification scheme ensures revocation records reflect the risk and criticality of each credential.
  good_enough: A simple scheme exists to distinguish high-risk credentials from ordinary ones, and this
    is referenced in revocation procedures.
