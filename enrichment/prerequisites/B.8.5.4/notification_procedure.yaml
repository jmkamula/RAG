leaf_id: req:B.8.5.4:notification_procedure
control_ref: B.8.5.4
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You must know which services, systems, and processing activities are in scope to determine
    when and how to notify customers about legally-binding disclosure requests. Without a clear scope,
    you can't reliably identify which requests are relevant.
  good_enough: A documented scope that clearly covers all processor activities and systems relevant to
    customer data is available and referenced.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that notification responsibilities are understood and that
    requests are handled by authorized personnel. This prevents delays or mishandling of sensitive legal
    requests.
  good_enough: A current roles and responsibilities matrix or policy exists, showing who is responsible
    for handling and escalating disclosure requests.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: foundational
  rationale: Understanding the lawful basis for processing is essential to determine when a disclosure
    is legally required and when notification to the customer is permitted or restricted (e.g., gag orders).
  good_enough: A summary or register of lawful bases for all relevant processing activities is available,
    even if not fully mapped to every data flow.
- ref: Art.28
  standard_id: GDPR:2016/679
  title: Processor Obligations
  category: cross_role
  rationale: GDPR Article 28 sets the legal expectation that processors must notify controllers of legally-binding
    disclosure requests unless prohibited. This article is the legal yardstick for the notification procedure.
  good_enough: A copy of the relevant customer contract or DPA referencing Article 28 obligations is available,
    even if not fully tailored to every customer.
