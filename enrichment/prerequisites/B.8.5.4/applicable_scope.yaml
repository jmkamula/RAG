leaf_id: req:B.8.5.4:applicable_scope
control_ref: B.8.5.4
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You must know the organizational and system boundaries before you can determine which legally-binding
    requests are relevant to your privacy program. Without a clear scope, you can't reliably identify
    which requests fall under your responsibility.
  good_enough: A documented scope that covers all business units, systems, and data types in-scope for
    privacy management, even if not perfectly detailed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: You need an up-to-date inventory of information assets to determine which data or systems
    could be subject to legally-binding disclosure requests. This ensures you don't miss any relevant
    assets.
  good_enough: A basic, current list of key information assets (systems, databases, applications) with
    ownership identified.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful bases for processing personal data is essential to assess whether
    a legally-binding request is valid and how it should be handled. This underpins your ability to scope
    such requests properly.
  good_enough: A summary table or register showing lawful bases for main processing activities, even if
    some edge cases are still being clarified.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purposes for which personal data is processed to determine if a legally-binding
    request aligns with or overrides those purposes. This helps define the scope of what can be disclosed.
  good_enough: A documented list of processing purposes for each main data set or activity, even if not
    yet mapped to every single asset.
