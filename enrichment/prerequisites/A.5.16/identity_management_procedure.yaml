leaf_id: req:A.5.16:identity_management_procedure
control_ref: A.5.16
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, users, and processes are in-scope for identity lifecycle
    management before you can define procedures. The scope statement ensures the procedure covers all
    relevant identities.
  good_enough: A current, approved scope statement that clearly lists included business units, systems,
    and user types is available.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities is essential to define who initiates, approves,
    and executes each step in the identity lifecycle. Without this, the procedure cannot specify accountability.
  good_enough: A documented matrix or list showing who is responsible for identity-related tasks (e.g.,
    HR, IT, managers) exists and is up to date.
- ref: A.6.5
  standard_id: ISO27001:2022
  title: Responsibilities after termination or change of employment
  category: direct
  rationale: Procedures for identity revocation and modification must align with requirements for handling
    access after employment changes. This ensures timely and compliant deactivation or adjustment of identities.
  good_enough: A summary or policy statement describing how access is handled after employment ends or
    changes is available, even if detailed workflows are still being refined.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to link identities to the systems, applications, and
    data they access. This ensures the procedure covers all relevant assets and account types.
  good_enough: A basic inventory of key systems and applications with user accounts is available, even
    if not fully detailed.
