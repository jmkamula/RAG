leaf_id: req:A.8.22:zone_register
control_ref: A.8.22
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Network Zone Register must only cover networks and systems within the defined ISMS scope.
    Without a clear scope statement, you can't know which zones to include or exclude.
  good_enough: A documented scope statement exists, identifying the boundaries and applicability of the
    ISMS, and referencing relevant network environments.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The Network Zone Register relies on an up-to-date asset register to accurately list the systems
    and assets contained within each zone. Missing or outdated asset information will undermine the register's
    completeness.
  good_enough: A current asset register exists, listing key information assets and systems relevant to
    the network zones being catalogued.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: Each network zone in the register must be classified according to the organization's information
    classification scheme. Without this, you cannot assign or justify zone classifications.
  good_enough: A documented classification scheme is available, with clear categories that can be applied
    to network zones.
- ref: A.8.20
  standard_id: ISO27001:2022
  title: Networks security
  category: direct
  rationale: The overall approach to network security, including segmentation and protection, must be
    established before cataloguing zones. This frames how zones are defined and what boundaries or controls
    are expected.
  good_enough: A documented network security policy or baseline exists, outlining the segmentation strategy
    and principles for defining network zones.
