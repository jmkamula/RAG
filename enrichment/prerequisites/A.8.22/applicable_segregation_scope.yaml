leaf_id: req:A.8.22:applicable_segregation_scope
control_ref: A.8.22
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization and infrastructure are covered by your
    ISMS before you can define which network domains require segregation. This ensures the segregation
    scope aligns with your overall security boundaries.
  good_enough: A clear, documented ISMS scope that identifies included business units, systems, and network
    environments.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which network domains, systems, and
    environments exist and need to be considered for segregation. Without this, you can't reliably determine
    what needs to be separated.
  good_enough: A basic inventory of networked assets, including cloud VPCs, on-premises networks, and
    critical systems, even if some details are still being refined.
- ref: A.8.20
  standard_id: ISO27001:2022
  title: Networks security
  category: direct
  rationale: Your overall network security approach sets the baseline for how segmentation and segregation
    should be applied. This context is needed to define the specific scope for segregation.
  good_enough: A documented network security policy or baseline that outlines general controls and protections
    for network environments.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing how information and systems are classified helps prioritize which network domains
    require stricter segregation, especially for sensitive or regulated data.
  good_enough: A simple classification scheme that distinguishes at least between public, internal, and
    sensitive/confidential data or systems.
