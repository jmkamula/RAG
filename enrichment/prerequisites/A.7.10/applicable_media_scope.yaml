leaf_id: req:A.7.10:applicable_media_scope
control_ref: A.7.10
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which information assets are covered
    by the ISMS before you can define which media classes are in scope for handling controls.
  good_enough: A documented scope statement that clearly identifies the organizational boundaries and
    information types covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all media types and devices that may
    store or transmit information, so you can determine which media classes are relevant.
  good_enough: A current list of information assets, including physical and electronic media, with enough
    detail to identify media classes.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need a defined classification scheme to understand the sensitivity of information on
    different media, which informs which media classes require special handling.
  good_enough: A documented scheme that defines at least the main information classification levels used
    by the organization.
- ref: A.5.13
  standard_id: ISO27001:2022
  title: Labelling of information
  category: direct
  rationale: Media handling controls depend on information being properly labelled according to its classification;
    without labelling, you cannot apply appropriate handling rules.
  good_enough: A basic process or policy for labelling information assets, even if not yet fully implemented
    across all media.
