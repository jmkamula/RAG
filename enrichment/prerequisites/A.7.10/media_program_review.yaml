leaf_id: req:A.7.10:media_program_review
control_ref: A.7.10
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which assets, locations, and processes are covered by the ISMS,
    ensuring the media program review only considers relevant storage media.
  good_enough: The scope must be documented and include all storage media types and locations to be reviewed,
    even if not fully detailed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all storage media subject to review,
    track their lifecycle, and verify register currency.
  good_enough: A current list of storage media assets exists, with basic details (type, location, owner)
    for each item.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme defines how storage media should be categorized by sensitivity,
    which is necessary for assessing compliance with handling and lifecycle requirements.
  good_enough: There is a documented scheme that assigns sensitivity levels to media types, even if not
    all media are yet classified.
- ref: A.5.13
  standard_id: ISO27001:2022
  title: Labelling of information
  category: direct
  rationale: Media handling and review depend on correct labelling; without labels, it is impossible to
    verify if media are managed according to their sensitivity.
  good_enough: Media are labelled according to the classification scheme, or there is a process in place
    to apply labels during the review.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The risk assessment identifies threats and vulnerabilities related to storage media, informing
    what should be checked during the program review.
  good_enough: A recent risk assessment exists that covers storage media risks, even if mitigation actions
    are still in progress.
