leaf_id: req:A.7.4:monitoring_event_register
control_ref: A.7.4
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Monitoring Event Register must align with the defined ISMS scope to ensure only relevant
    locations, assets, and processes are included. Without a clear scope, you risk missing critical events
    or over-monitoring irrelevant areas.
  good_enough: A documented scope statement that clearly defines which sites, systems, and processes are
    in-scope for security monitoring.
- ref: A.7.1
  standard_id: ISO27001:2022
  title: Physical security perimeters
  category: direct
  rationale: Physical security perimeters determine which areas require monitoring and what constitutes
    an event worth registering. The register cannot be meaningfully drafted until these boundaries are
    defined.
  good_enough: A list or diagram of established physical perimeters, with enough detail to identify where
    monitoring controls are or should be applied.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: Knowing which assets exist and where they are located is essential for identifying which
    events and alarms should be monitored and registered. The register must map events to specific assets.
  good_enough: An up-to-date inventory of physical and logical assets within the monitoring scope, sufficient
    to reference in the event register.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of monitoring and response responsibilities is needed to ensure events in
    the register are actioned appropriately. Without this, the register may be ignored or misused.
  good_enough: Documented roles showing who is responsible for monitoring, investigating, and responding
    to registered events.
