leaf_id: req:A.7.12:applicable_runs_scope
control_ref: A.7.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines the organizational and physical boundaries for information
    security management, which is essential to determine which cabling runs are included or excluded from
    protection requirements.
  good_enough: A documented scope statement that clearly identifies all relevant locations, assets, and
    processes, including physical infrastructure, is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An asset register lists all information assets, including physical infrastructure like cabling,
    enabling identification of which cabling runs exist and could be in scope for protection.
  good_enough: A current inventory of physical assets, including cabling runs or types, is available—even
    if not all details are finalized.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme determines the sensitivity and required protection levels for information
    transmitted over different cabling runs, guiding which runs need enhanced controls.
  good_enough: A basic classification scheme is documented and applied to asset types, including physical
    transmission media.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies threats and vulnerabilities related to physical cabling, helping
    justify why certain runs are in or out of scope and what protection levels are appropriate.
  good_enough: An initial risk assessment covering physical infrastructure risks is completed and available
    for reference.
