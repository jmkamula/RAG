leaf_id: req:A.7.12:cabling_program_review
control_ref: A.7.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The cabling program review must align with the defined ISMS scope to ensure all relevant
    locations, assets, and systems are included. Without a clear scope, you can't be sure what cabling
    assets or areas should be covered.
  good_enough: The ISMS scope statement exists and clearly identifies all sites and systems where cabling
    is in use.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all cabling infrastructure that needs
    to be reviewed. If the register is missing or outdated, the review cannot be comprehensive or accurate.
  good_enough: There is a current asset register listing all cabling-related assets, even if some minor
    details are pending.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are accountable for inspections,
    register maintenance, and remediation. Without this, the review process may be incomplete or lack
    ownership.
  good_enough: Key responsibilities for cabling inspection, register updates, and remediation are assigned
    to named individuals or roles.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Understanding risks related to cabling helps prioritize what needs to be reviewed and remediated.
    The review should be risk-driven to focus on critical areas.
  good_enough: A basic risk assessment exists that identifies risks related to cabling infrastructure,
    even if it needs refinement.
