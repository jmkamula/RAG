leaf_id: req:A.7.12:cabling_register
control_ref: A.7.12
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The cabling register must only cover sites, assets, and infrastructure within the defined
    ISMS scope. Without a clear scope, you can't know which cabling runs are in or out of compliance boundaries.
  good_enough: A documented scope statement that clearly lists included locations and infrastructure,
    even if not fully detailed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The cabling register relies on an up-to-date asset register to identify physical sites, network
    equipment, and infrastructure endpoints for each cabling run.
  good_enough: A basic inventory of relevant physical assets and locations, even if some details are pending.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need a classification scheme to assign the correct "carried traffic class" and "routing
    class" to each cabling run in the register.
  good_enough: A simple, documented scheme for classifying information and network traffic, even if not
    all assets are classified yet.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment identifies which cabling runs are critical or sensitive, helping prioritize
    which runs require tracking and inspection in the register.
  good_enough: A recent risk assessment that at least flags critical network infrastructure, even if not
    exhaustive.
