leaf_id: req:A.7.3.2:notice_artifact_register
control_ref: A.7.3.2
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Notice Artifact Register must align with the defined scope of the ISMS to ensure all
    relevant business units, processes, and systems are included. Without a clear scope, you risk missing
    notices for in-scope processing activities.
  good_enough: A documented scope statement that clearly defines the organizational and process boundaries
    for the ISMS, including privacy-relevant areas.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Each privacy notice must describe the purposes of processing; you cannot register or maintain
    notices without first identifying and documenting these purposes for each processing activity.
  good_enough: A list or summary of processing purposes for all relevant activities, even if not fully
    detailed, to support mapping notices to processing contexts.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Notices must communicate the lawful basis for processing personal data. You need this information
    to accurately populate and maintain the register for each notice artifact.
  good_enough: A basic mapping of each processing activity to its lawful basis, sufficient to inform the
    content of privacy notices.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: Knowing how information is classified helps determine which notices are required and what
    information must be included or protected in each notice artifact.
  good_enough: A documented classification scheme that covers personal and sensitive data, even if not
    fully rolled out, to guide notice content and audience.
