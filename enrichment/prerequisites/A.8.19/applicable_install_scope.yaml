leaf_id: req:A.8.19:applicable_install_scope
control_ref: A.8.19
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines which parts of the organization, systems, and processes
    are covered by the ISMS. You cannot determine what installations are in-scope for A.8.19 without first
    knowing the overall ISMS boundaries.
  good_enough: A clear, documented scope statement exists that identifies included business units, locations,
    and system types.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to identify which operational systems, environments
    (production, dev, test), and installations exist. This is essential to decide which installations
    are subject to A.8.19 controls.
  good_enough: There is a current list of information assets and systems, with enough detail to distinguish
    between production, development, and test environments.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme helps determine the criticality and sensitivity of different environments
    (e.g., production vs. test), which informs whether they should be included in the A.8.19 scope.
  good_enough: A documented classification scheme exists and is applied to environments, so you can justify
    inclusion or exclusion in the A.8.19 scope.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment results guide which systems and environments require operational controls
    under A.8.19. If risks in dev/test are low and mitigated differently, this supports scoping decisions.
  good_enough: A recent risk assessment has been performed that covers all relevant environments, with
    rationale for any exclusions.
