leaf_id: req:A.8.19:software_installation_procedure
control_ref: A.8.19
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, locations, and business units are in-scope for your ISMS
    before defining which operational systems require software installation controls. This ensures the
    procedure covers all relevant assets and avoids gaps.
  good_enough: A current, approved scope statement that clearly lists in-scope systems and environments
    is available and referenced.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A reliable asset register is essential to identify which operational systems exist, so you
    can specify where software installation procedures must apply. Without it, you risk missing systems
    or applying controls inconsistently.
  good_enough: An up-to-date asset register exists, listing all operational systems where software may
    be installed.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities is needed to define who can approve, install,
    and verify software installations. The procedure must reference these roles to be actionable and enforceable.
  good_enough: Documented roles exist for system owners, administrators, and approvers involved in software
    installation.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment helps prioritize which systems and types of software require stricter installation
    controls, based on their risk profile. This informs the level of rigor and checks needed in your procedure.
  good_enough: A recent risk assessment covering operational systems and software installation risks is
    available to inform control design.
