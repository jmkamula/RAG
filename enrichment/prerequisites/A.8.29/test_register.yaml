leaf_id: req:A.8.29:test_register
control_ref: A.8.29
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Security Test Register must align with the defined ISMS scope to ensure only relevant
    applications and systems are included. Without a clear scope, you risk missing critical assets or
    over-documenting irrelevant ones.
  good_enough: A documented scope statement that clearly lists the systems, applications, and environments
    covered by the ISMS and, by extension, the test register.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: You need an up-to-date asset register to identify which applications and systems require
    security testing and should appear in the register. Missing this means you can't ensure coverage or
    traceability.
  good_enough: A current list of information assets, especially applications and systems, with enough
    detail to link each to security testing activities.
- ref: A.8.25
  standard_id: ISO27001:2022
  title: Secure development life cycle
  category: direct
  rationale: The SDLC defines when and how security testing is performed, which directly informs the structure
    and content of the Security Test Register. Without this, you can't reliably record or interpret test
    activities.
  good_enough: A documented SDLC process that specifies security testing steps, triggers, and responsibilities
    for relevant assets.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures accountability for conducting, recording, and reviewing
    security tests. Without this, the register may be incomplete or inaccurate.
  good_enough: A list or matrix showing who is responsible for security testing and maintaining the test
    register for in-scope assets.
