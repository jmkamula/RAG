leaf_id: req:A.5.23:cloud_posture_review
control_ref: A.5.23
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines which cloud services, assets, and environments are covered by your
    security management system. Without a clear scope, you can't determine which cloud services require
    posture review or which controls apply.
  good_enough: A documented scope statement that explicitly includes all relevant cloud services and environments
    is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An accurate asset register is essential to identify all cloud services and related assets
    that must be included in the posture review. Missing or outdated asset records will result in incomplete
    or ineffective reviews.
  good_enough: A current list of all cloud services and related assets is maintained, even if some metadata
    is pending refinement.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of data and assets in each cloud service helps prioritize review
    activities and focus on higher-risk or regulated data. Without this, reviews may overlook critical
    exposures.
  good_enough: A basic classification scheme exists and has been applied to cloud assets, even if some
    classifications are provisional.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The risk assessment identifies threats and vulnerabilities relevant to cloud services, informing
    what to look for during the posture review. Without this, reviews may miss key risks or compliance
    gaps.
  good_enough: A recent risk assessment includes cloud services and highlights at least the major risks
    associated with their use.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are accountable for conducting the
    cloud posture review and following up on findings. Ambiguity here can stall or invalidate the review
    process.
  good_enough: Roles for cloud service management and review are assigned and communicated, even if some
    responsibilities are still being refined.
