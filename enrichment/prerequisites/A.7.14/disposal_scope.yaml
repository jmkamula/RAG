leaf_id: req:A.7.14:disposal_scope
control_ref: A.7.14
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines which parts of the organization, assets, and processes are covered
    by security controls, including equipment disposal. Without a clear scope, you cannot reliably determine
    which equipment classes and disposal activities are in or out of scope.
  good_enough: A documented scope statement that lists included business units, locations, and asset types
    is available and approved.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which equipment exists, its ownership,
    and lifecycle status. You cannot define disposal scope or triggers without knowing what equipment
    is present.
  good_enough: Asset inventory exists and includes all major equipment types relevant to disposal, even
    if some metadata is still being refined.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme determines the sensitivity and handling requirements for information
    stored on equipment. This impacts disposal requirements and exclusions.
  good_enough: A basic classification scheme is in place, with at least high-level categories (e.g., confidential,
    internal, public) mapped to asset types.
- ref: A.7.10
  standard_id: ISO27001:2022
  title: Storage media
  category: direct
  rationale: Media handling rules inform how equipment containing storage media must be disposed of, especially
    regarding data erasure and destruction. You need these rules to set appropriate disposal triggers
    and exclusions.
  good_enough: Media handling procedures exist and specify at least minimum requirements for secure storage
    and erasure prior to disposal.
