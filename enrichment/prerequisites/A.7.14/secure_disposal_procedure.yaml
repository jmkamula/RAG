leaf_id: req:A.7.14:secure_disposal_procedure
control_ref: A.7.14
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which equipment, locations, and business units are in-scope for secure disposal.
    The procedure must align with the defined ISMS boundaries.
  good_enough: A documented scope statement that clearly lists what equipment and sites are covered is
    sufficient to proceed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A current asset register is needed to identify all equipment containing storage media that
    may require secure disposal or re-use. Without it, you can't ensure all relevant assets are covered.
  good_enough: An up-to-date list of assets with storage media, even if not perfect, is enough to draft
    the disposal procedure.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme determines the sensitivity of data on equipment, which drives the
    required disposal or destruction methods.
  good_enough: A basic classification scheme that distinguishes at least between confidential and non-confidential
    data is sufficient to unblock drafting.
- ref: A.7.10
  standard_id: ISO27001:2022
  title: Storage Media
  category: direct
  rationale: Media handling rules (e.g., encryption, labeling) inform how disposal must be performed and
    verified. You need to know how media was managed during its lifecycle.
  good_enough: A summary of current media handling practices and requirements is enough to inform the
    disposal procedure.
