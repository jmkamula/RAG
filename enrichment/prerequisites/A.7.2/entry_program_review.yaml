leaf_id: req:A.7.2:entry_program_review
control_ref: A.7.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which physical locations and areas are in scope for the ISMS before you
    can review entry controls or area classifications. This ensures the review covers all relevant spaces.
  good_enough: A documented scope statement that clearly lists all physical sites and areas included in
    the ISMS is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which areas and assets require entry
    controls and to verify that the register is being maintained as part of the review.
  good_enough: A current list of physical assets and their locations is maintained, even if some details
    need refinement.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Area classifications (e.g., public, restricted, confidential) must be defined so you can
    check if entry controls match the required protection level for each area.
  good_enough: A basic classification scheme exists and is applied to all relevant areas, even if some
    categories are broad.
- ref: A.7.1
  standard_id: ISO27001:2022
  title: Physical security perimeters
  category: direct
  rationale: Security perimeters must be established before you can review the effectiveness and appropriateness
    of entry controls for those perimeters.
  good_enough: Documented descriptions or diagrams of physical security perimeters are available, even
    if some boundaries are still being finalized.
