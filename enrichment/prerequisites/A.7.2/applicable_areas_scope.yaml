leaf_id: req:A.7.2:applicable_areas_scope
control_ref: A.7.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the overall boundaries of your ISMS before you can specify which physical
    areas fall under secure area controls. This ensures that only relevant locations are considered for
    entry controls.
  good_enough: A documented scope statement that clearly lists all sites, offices, and facilities covered
    by the ISMS—even if high-level—is sufficient to proceed.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing what assets are present and where they are located is essential to determine which
    areas require physical protection and what classification tier applies.
  good_enough: A basic inventory of physical and information assets mapped to their locations is enough
    to start defining secure areas.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You must have a way to classify information and assets so you can assign the correct security
    tier to each area. This underpins decisions about entry controls.
  good_enough: A simple, documented classification scheme with at least two levels (e.g., public, confidential)
    is sufficient for initial scoping.
- ref: A.7.1
  standard_id: ISO27001:2022
  title: Physical security perimeters
  category: direct
  rationale: You need to define the physical boundaries of secure areas before you can specify which require
    entry controls and how they are classified.
  good_enough: A rough map or description of physical perimeters (walls, doors, zones) is enough to identify
    candidate secure areas for further scoping.
