leaf_id: req:A.5.29:disruption_scenario_register
control_ref: A.5.29
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The disruption scenario register must only cover scenarios relevant to the defined ISMS scope.
    Without a clear scope, you cannot determine which disruptions are in or out of bounds for the register.
  good_enough: The ISMS scope statement should be formally documented, with boundaries and exclusions
    clearly described.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Identifying relevant disruption scenarios depends on understanding the organisation’s risk
    landscape. A current risk assessment is essential to ensure the register is comprehensive and not
    missing critical scenarios.
  good_enough: A recent risk assessment exists, listing key threats and vulnerabilities relevant to the
    ISMS scope.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: Disruption scenarios are tied to assets—without knowing what assets exist and are in-scope,
    you cannot meaningfully identify or catalogue disruption scenarios.
  good_enough: There is a basic, up-to-date inventory of information assets within the ISMS scope.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Each disruption scenario in the register must have an assigned owner. Without defined roles
    and responsibilities, ownership and accountability for scenarios cannot be established.
  good_enough: Key ISMS roles are assigned and documented, with clear responsibility for risk and incident
    management.
