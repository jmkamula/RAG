leaf_id: req:A.5.29:continuity_program_review
control_ref: A.5.29
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which assets are covered by the continuity
    plan before you can meaningfully review its effectiveness. The scope sets the boundaries for what
    the review should address.
  good_enough: A documented and approved scope statement that clearly defines the organizational and asset
    boundaries for the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register ensures the continuity plan review covers all relevant information
    assets, including any new or retired assets since the last review. Missing assets could mean critical
    gaps in continuity coverage.
  good_enough: A current list of information assets, with enough detail to identify what must be protected
    and included in continuity planning.
- ref: A.5.29
  standard_id: ISO27001:2022
  title: Information Security Continuity Plan
  category: direct
  rationale: You can't review the effectiveness or currency of the continuity plan unless the plan itself
    exists and is documented. The review is about evaluating and updating this plan.
  good_enough: A documented continuity plan that outlines scenarios, fallback procedures, and communication
    paths, even if it's a first draft.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: The review should be informed by the latest risk assessment to ensure the continuity plan
    addresses current threats and vulnerabilities. Outdated risk data could make the review irrelevant.
  good_enough: A recent risk assessment identifying key threats and vulnerabilities relevant to continuity,
    even if some risks are still being mitigated.
