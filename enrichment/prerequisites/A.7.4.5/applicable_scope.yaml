leaf_id: req:A.7.4.5:applicable_scope
control_ref: A.7.4.5
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know the overall boundaries of your ISMS before you can define which processing
    activities fall under end-of-processing considerations. Without this, you can't reliably identify
    which activities are in or out of scope.
  good_enough: A clear, up-to-date scope statement that lists included business units, locations, and
    systems is available—even if some details are still being refined.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purpose for each processing activity to determine when processing should
    end (e.g., after contract termination or consent withdrawal). This is essential for distinguishing
    between finite and ongoing processing.
  good_enough: A documented list of processing activities with their stated purposes exists, even if some
    purposes are still being validated.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The lawful basis for processing (e.g., consent, contract, legal obligation) directly impacts
    when processing must cease. This is critical for mapping end-of-processing triggers.
  good_enough: Each processing activity has a recorded lawful basis, even if some are provisional or pending
    legal review.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: You need to know what information assets (systems, databases, records) are involved in processing
    to map which ones are affected by end-of-processing events.
  good_enough: A working asset register exists that covers the main data stores and systems used for personal
    data processing, even if some minor assets are still being added.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities (RoPA)
  category: cross_role
  rationale: A RoPA provides a structured inventory of processing activities, which is necessary to identify
    which activities have foreseeable endpoints and which are ongoing.
  good_enough: A draft or working RoPA is available that lists core processing activities, even if some
    details are incomplete or under review.
