leaf_id: req:A.8.21:service_register
control_ref: A.8.21
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization and which network services are in-scope
    for your ISMS before you can build a meaningful register. This ensures the register is complete and
    relevant.
  good_enough: A clear, current scope statement that identifies the organizational boundaries and major
    service types covered by the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: The asset register provides the inventory of information assets, including network services,
    that must be catalogued in the service register. Without this, you risk missing key services.
  good_enough: A basic, up-to-date list of information assets and network services, even if not fully
    detailed, so you can identify what to include in the service register.
- ref: A.8.20
  standard_id: ISO27001:2022
  title: Networks security
  category: direct
  rationale: The network security baseline defines the minimum controls and expectations for all network
    services. The service register must reflect these controls and their implementation status.
  good_enough: Documented network security requirements and a summary of how they apply to each service,
    even if some details are still being finalized.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment identifies which network services are critical and what threats they face,
    guiding what details must be tracked in the register.
  good_enough: A recent risk assessment that covers network services, highlighting key risks and priorities,
    even if some risk treatments are still pending.
