leaf_id: req:10.2:nc_program_review
control_ref: '10.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '10.1'
  standard_id: ISO27001:2022
  title: Continual improvement
  category: direct
  rationale: You need a working continual improvement process to ensure that nonconformities and corrective
    actions are actually being identified and tracked. Without this, there is nothing to review for effectiveness
    or recurrence.
  good_enough: There is a documented, operational continual improvement process that logs nonconformities
    and corrective actions, even if it is not yet fully mature.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization and which processes are covered
    by the ISMS, including the NC/CA process. Without a clear scope, you can't know which nonconformities
    or corrective actions should be included in the review.
  good_enough: A current, approved scope statement exists that clearly defines the organizational and
    process boundaries for the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The information security policy sets the overall direction and expectations for continual
    improvement and corrective action. The NC/CA review must be aligned with these policy requirements.
  good_enough: There is a published information security policy that references continual improvement
    and corrective action expectations.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that nonconformities are reported,
    investigated, and reviewed by the right people. Without this, the review process may be incomplete
    or ineffective.
  good_enough: Roles for reporting, investigating, and reviewing nonconformities are defined and communicated,
    even if not yet fully embedded in practice.
