leaf_id: req:10.2:nonconformity_register
control_ref: '10.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of the organisation and which processes are covered by the ISMS
    before you can track nonconformities. The register must only include nonconformities relevant to the
    defined scope.
  good_enough: A clear, approved scope statement that identifies the boundaries and applicability of the
    ISMS is available.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The nonconformity register tracks failures against the organisation’s information security
    policy and objectives. Without a policy, you can’t determine what counts as a nonconformity.
  good_enough: A published, current information security policy that sets out the organisation’s security
    objectives and expectations.
- ref: '10.1'
  standard_id: ISO27001:2022
  title: Continual improvement
  category: direct
  rationale: The process for continual improvement defines how nonconformities are identified, analysed,
    and addressed. You need this process in place to ensure the register is actionable and not just a
    log.
  good_enough: A documented continual improvement process that describes how nonconformities are managed,
    even if it is still being refined.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that nonconformities are reported, investigated, and resolved
    by the right people. Without this, the register will lack accountability.
  good_enough: A basic roles and responsibilities matrix or list that covers who is responsible for reporting,
    investigating, and closing nonconformities.
