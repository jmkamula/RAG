leaf_id: req:9.3:management_review
control_ref: '9.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: Management review must consider the full scope of the ISMS. Without a clear, current scope
    statement, the review cannot meaningfully assess ISMS performance or coverage.
  good_enough: A documented and approved ISMS scope statement that identifies included business units,
    locations, and processes.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: Management review requires up-to-date information on risk status and treatment. If risk assessments
    are missing or outdated, the review cannot evaluate ISMS effectiveness or risk posture.
  good_enough: A recent risk assessment report and summary of risk treatment actions, even if not fully
    comprehensive, covering major risks in scope.
- ref: '6.2'
  standard_id: ISO27001:2022
  title: Information Security Objectives
  category: direct
  rationale: Reviewing progress against information security objectives is a mandatory input for management
    review. Without defined objectives, management cannot assess ISMS performance.
  good_enough: A documented set of current information security objectives, with basic tracking of progress
    or status.
- ref: '9.1'
  standard_id: ISO27001:2022
  title: Monitoring, Measurement, Analysis and Evaluation
  category: direct
  rationale: Management review must consider monitoring and measurement results. If these are missing,
    management cannot make informed decisions about ISMS effectiveness.
  good_enough: Recent monitoring and measurement data for key ISMS controls, even if some metrics are
    still being refined.
- ref: '9.2'
  standard_id: ISO27001:2022
  title: Internal Audit
  category: direct
  rationale: Results of the most recent internal audit are a required input for management review. Without
    this, management cannot address audit findings or systemic issues.
  good_enough: A completed internal audit report from the most recent cycle, with major findings summarized.
- ref: '10.1'
  standard_id: ISO27001:2022
  title: Nonconformity and Corrective Action
  category: direct
  rationale: Management review must consider the status of nonconformities and corrective actions. Without
    this, recurring issues may go unaddressed.
  good_enough: A current register or summary of open and recently closed nonconformities and corrective
    actions.
