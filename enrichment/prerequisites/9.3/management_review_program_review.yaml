leaf_id: req:9.3:management_review_program_review
control_ref: '9.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: Management review must consider the full scope of the ISMS. Without a clear, approved scope
    statement, it's impossible to verify that all relevant areas are being reviewed.
  good_enough: A documented scope statement exists, is approved, and covers all intended organizational
    boundaries for the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The management review checks alignment with the information security policy. The policy sets
    the direction and objectives that the review must measure progress against.
  good_enough: A current, approved information security policy is available and communicated to relevant
    stakeholders.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: direct
  rationale: Management review requires up-to-date risk assessment results to evaluate risk treatment
    effectiveness and emerging risks.
  good_enough: A recent risk assessment has been performed and results are available for management to
    review.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that management review inputs, actions,
    and follow-ups are owned and tracked.
  good_enough: Roles and responsibilities for ISMS operation and review are documented and assigned to
    named individuals.
