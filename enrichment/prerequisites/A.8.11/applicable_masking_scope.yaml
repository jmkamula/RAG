leaf_id: req:A.8.11:applicable_masking_scope
control_ref: A.8.11
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organisation and which information assets are covered
    by your ISMS before you can define which datasets require masking in non-production environments.
  good_enough: A clear, current scope statement that identifies the business units, systems, and data
    types included in the ISMS is available.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all datasets and information assets
    that could be subject to masking controls.
  good_enough: A working inventory of information assets exists, with enough detail to identify datasets
    that may enter non-production environments.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You must know the classification of each dataset to determine which ones contain sensitive
    or personal data requiring masking.
  good_enough: A documented classification scheme is in place and key datasets have been classified according
    to sensitivity and data type.
- ref: A.5.34
  standard_id: ISO27001:2022
  title: Protection of PII in Non-Production Environments
  category: direct
  rationale: Understanding which datasets contain PII and how they are handled in non-production is critical
    to defining the masking scope.
  good_enough: A list or inventory of PII datasets and their current handling in non-production environments
    is available, even if not fully comprehensive.
