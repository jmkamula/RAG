leaf_id: req:A.8.11:data_masking_procedure
control_ref: A.8.11
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which systems, environments, and data types are in scope for the ISMS before
    defining masking procedures, to ensure the procedure covers all relevant non-production environments.
  good_enough: A documented scope that clearly identifies which environments and data types are included
    in the ISMS, especially those relevant to non-production use.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is necessary to identify which information assets (including
    personal data) exist in non-production environments and therefore require masking.
  good_enough: A basic inventory listing key information assets, with at least a flag or note for those
    present in non-production environments.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You must know how data is classified to determine which data types require masking, as masking
    typically applies to personal or sensitive data.
  good_enough: A documented scheme that defines data categories (e.g., personal, confidential) and is
    applied to assets in the register.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that responsibilities for implementing and maintaining
    data masking procedures are understood and actionable.
  good_enough: A list or matrix showing who is responsible for data masking decisions and procedure maintenance.
