leaf_id: req:A.7.3.5:applicable_scope
control_ref: A.7.3.5
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know which parts of your organisation and which processing activities are covered
    by your privacy management system before you can specify where objection rights apply.
  good_enough: A clear, up-to-date scope statement that identifies the business units, systems, and processing
    activities included in the ISMS and PIMS.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Objection rights depend on the stated purposes for processing personal data. You must have
    documented purposes for each processing activity to determine if and where objections are relevant.
  good_enough: A register or list of processing activities with their associated purposes, even if some
    purposes are still being clarified.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The right to object only applies to certain lawful bases (e.g., legitimate interests, public
    interest, direct marketing). You must know the lawful basis for each processing activity to identify
    applicable objection contexts.
  good_enough: Each processing activity has a documented lawful basis, at least at a draft or working
    level.
- ref: Art.21
  standard_id: GDPR:2016/679
  title: Right to Object
  category: cross_role
  rationale: GDPR Article 21 defines the legal contexts in which data subjects can object to processing.
    This legal yardstick is essential for mapping your processing activities to objection rights.
  good_enough: A summary or working interpretation of Article 21, highlighting which processing contexts
    are in-scope for objection rights.
