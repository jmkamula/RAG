leaf_id: req:Art.39:dpo_tasks_procedure
control_ref: Art.39
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Designation of the Data Protection Officer
  category: foundational
  rationale: You cannot define or assign DPO tasks without first formally designating a DPO as required
    by Art.37. This establishes the role and its mandate within your organisation.
  good_enough: A documented DPO appointment with clear contact details and reporting lines is in place.
- ref: Art.38
  standard_id: GDPR:2016/679
  title: Position of the Data Protection Officer
  category: direct
  rationale: Art.39 tasks assume the DPO’s independence, resources, and protections are established as
    per Art.38. Without this, the DPO cannot effectively carry out their tasks.
  good_enough: There is evidence that the DPO’s independence, access to resources, and protection from
    dismissal are documented and communicated.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: direct
  rationale: The DPO’s tasks include monitoring processing activities and advising on compliance. Up-to-date
    records of processing are essential for the DPO to fulfil these tasks.
  good_enough: A basic, current record of processing activities exists, covering key data flows and purposes.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawfulness of Processing
  category: direct
  rationale: The DPO is tasked with advising on and monitoring lawful processing. The organisation must
    have identified lawful bases for its processing activities to enable the DPO to perform this advisory
    role.
  good_enough: Each processing activity has a documented lawful basis, even if not yet fully mapped to
    all data flows.
