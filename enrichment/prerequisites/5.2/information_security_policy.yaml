leaf_id: req:5.2:information_security_policy
control_ref: '5.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The information security policy must be tailored to the organisation's ISMS scope. Without
    a defined scope, the policy cannot meaningfully specify what is covered or excluded.
  good_enough: A documented and approved ISMS scope statement exists, clearly defining the organisational
    boundaries and assets the policy will apply to.
- ref: '5.1'
  standard_id: ISO27001:2022
  title: Leadership and commitment
  category: foundational
  rationale: Top management's commitment is essential for establishing and enforcing the information security
    policy. Without their buy-in, the policy lacks authority and direction.
  good_enough: There is clear evidence (e.g. meeting minutes, memo) that top management supports and is
    engaged in the ISMS and policy development.
- ref: 6.1.1
  standard_id: ISO27001:2022
  title: Actions to address risks and opportunities
  category: direct
  rationale: The policy must reflect the organisation's approach to information security risks and objectives.
    Understanding key risks ensures the policy is relevant and actionable.
  good_enough: A basic risk assessment or summary of key information security risks and objectives is
    available to inform the policy's content.
