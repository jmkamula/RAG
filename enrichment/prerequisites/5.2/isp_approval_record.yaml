leaf_id: req:5.2:isp_approval_record
control_ref: '5.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The approval record must clearly reference the scope of the ISMS, as top management approval
    is only meaningful if it is tied to a defined scope. Without a finalized scope, it is unclear what
    the policy (and its approval) actually covers.
  good_enough: A documented and approved ISMS scope statement that identifies the organizational boundaries
    and applicability of the ISMS.
- ref: '5.1'
  standard_id: ISO27001:2022
  title: Leadership and commitment
  category: direct
  rationale: Demonstrable leadership commitment is required before a policy can be formally approved.
    The approval record must show that top management is actively involved and accountable for the ISMS.
  good_enough: Evidence (such as meeting minutes or a signed statement) that top management is engaged
    with and supports the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: The approval record must identify who is authorized to approve the information security policy.
    Clear assignment of roles ensures the approval is valid and traceable.
  good_enough: A documented list of ISMS roles and responsibilities, including who has authority to approve
    policies.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The information security policy should be informed by the organization’s risk assessment.
    Approval is only meaningful if it is based on an understanding of current risks.
  good_enough: A completed risk assessment that identifies key risks relevant to the ISMS scope, even
    if it is a high-level or initial version.
