leaf_id: req:5.2:isp_program_review
control_ref: '5.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of the organization and which information assets are covered
    by the ISMS before reviewing whether the information security policy is current and relevant.
  good_enough: A documented scope statement that clearly defines the organizational and system boundaries
    for the ISMS.
- ref: '5.1'
  standard_id: ISO27001:2022
  title: Leadership and commitment
  category: direct
  rationale: Leadership must demonstrate commitment to the ISMS and its policies, as their support is
    essential for policy approval, communication, and ongoing review.
  good_enough: Documented evidence (e.g., meeting minutes, sign-off) showing top management's endorsement
    of the ISMS and its policies.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles ensures that policy review, approval, and
    communication responsibilities are understood and actioned.
  good_enough: A current list or matrix showing who is responsible for policy management and review within
    the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information security risk assessment
  category: foundational
  rationale: Risk assessment results inform whether the policy remains adequate and relevant to the organization's
    current risk environment.
  good_enough: A recent risk assessment report or summary that identifies key risks relevant to the policy's
    scope.
