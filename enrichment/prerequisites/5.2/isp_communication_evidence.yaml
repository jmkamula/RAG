leaf_id: req:5.2:isp_communication_evidence
control_ref: '5.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries and applicability of your ISMS before communicating the information
    security policy, so you can target the right audience and ensure coverage.
  good_enough: A documented scope statement that clearly defines what parts of the organization and which
    activities are covered by the ISMS.
- ref: '5.1'
  standard_id: ISO27001:2022
  title: Leadership and commitment
  category: direct
  rationale: Leadership must first endorse and support the information security policy before it is communicated,
    as their commitment gives the policy authority and relevance.
  good_enough: Documented evidence (e.g., meeting minutes or a signed statement) that top management has
    approved and supports the information security policy.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles and responsibilities is needed to identify
    who should receive, acknowledge, and act on the policy communication.
  good_enough: A current list or matrix showing who holds key information security roles and their responsibilities,
    sufficient to identify the communication audience.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information security risk assessment
  category: foundational
  rationale: Understanding the main information security risks helps tailor the policy communication to
    address relevant threats and ensure the right people are informed.
  good_enough: A recent risk assessment summary that identifies key risks and affected stakeholders, so
    communication can be prioritized accordingly.
