leaf_id: req:B.8.4.2:program_review
control_ref: B.8.4.2
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know which systems, processes, and services are in-scope for privacy management
    before you can review end-of-service controls. Without a clear scope, you can't reliably verify return,
    transfer, or disposal activities.
  good_enough: A documented, approved scope statement that clearly identifies what is covered by the ISMS
    and privacy extension.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: cross_role
  rationale: A current asset register is essential to identify all personal data and related assets that
    must be considered during end-of-service review. You can't verify return or disposal if you don't
    know what assets exist.
  good_enough: An up-to-date list of relevant information assets, including those containing personal
    data, with basic ownership and location details.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: cross_role
  rationale: Knowing how data is classified ensures that end-of-service actions (return, transfer, disposal)
    are appropriate to the sensitivity of the information. This prevents accidental exposure or mishandling
    of personal data.
  good_enough: A documented scheme that defines at least basic categories for personal and sensitive data,
    and is applied to assets in the register.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the documented purposes for processing personal data to determine when end-of-service
    activities are triggered and what is required for each data set.
  good_enough: A list or register of processing activities with stated purposes for each, covering all
    in-scope personal data.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for processing is necessary to determine retention requirements
    and when data must be returned, transferred, or disposed of at end-of-service.
  good_enough: Each processing activity has a documented lawful basis, sufficient to guide retention and
    disposal decisions.
