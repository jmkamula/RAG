leaf_id: req:A.5.24:framework_exercise_record
control_ref: A.5.24
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization and which information assets
    are covered by the ISMS and, therefore, by the exercise. Without a clear scope, you cannot credibly
    record or evidence which areas were included in the exercise.
  good_enough: The scope must be documented and approved, with clear boundaries for what is in and out
    of scope for ISMS activities.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: You need an up-to-date register of who is responsible for incident response and exercise
    participation to accurately record participants and sign-offs for each exercise.
  good_enough: A current list of assigned roles and responsible individuals for ISMS and incident response
    activities is available and accessible.
- ref: A.5.24
  standard_id: ISO27001:2022
  title: Information Security Event Reporting and Management (Exercise Planning)
  category: direct
  rationale: The exercise record must be based on a pre-existing plan or schedule of exercises, so you
    know what was intended to be tested and can compare planned vs. actual execution.
  good_enough: There is a documented exercise plan or schedule outlining at least the type, frequency,
    and responsible parties for ISMS exercises.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets are in scope for the ISMS and for each exercise ensures the record accurately
    reflects what was tested and any gaps identified.
  good_enough: A basic, current asset register exists that lists the key information assets relevant to
    the ISMS and exercises.
