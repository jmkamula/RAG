leaf_id: req:A.8.27:applicable_architecture_scope
control_ref: A.8.27
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS to determine which engineering domains and systems
    fall under the architecture principles. Without a clear scope, you can't reliably say where the principles
    should apply.
  good_enough: A documented ISMS scope that lists included business units, systems, and locations—even
    if it's high-level or draft.
- ref: A.8.25
  standard_id: ISO27001:2022
  title: Secure development life cycle
  category: direct
  rationale: The secure development lifecycle defines the baseline security activities for engineering.
    You must have this in place to identify which domains and teams are subject to architecture principles.
  good_enough: A summary or policy describing the main phases and controls of your secure development
    lifecycle, even if not fully detailed for every project.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: Knowing what information assets and systems exist is essential to map which ones are in scope
    for architecture principles. You can't apply principles to assets you haven't identified.
  good_enough: A basic inventory or list of key information assets and systems, even if not fully classified
    or regularly updated.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures you know who is responsible for applying architecture principles
    in each domain. Without this, accountability is unclear.
  good_enough: A simple matrix or list showing who is responsible for engineering and architecture decisions,
    even if not fully formalized.
