leaf_id: req:A.7.3.1:obligations_register
control_ref: A.7.3.1
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organization, processes, and data are covered
    by the ISMS and PIMS. You can't accurately enumerate applicable obligations unless you know what is
    in-scope.
  good_enough: A documented scope that clearly identifies the organizational and processing boundaries
    relevant to privacy obligations.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Knowing the purposes for which personal data is processed is essential to determine which
    subject-rights obligations apply. The register must map obligations to processing purposes.
  good_enough: A list of processing purposes for all in-scope personal data, even if not fully detailed,
    is available.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Each subject-rights obligation may depend on the lawful basis for processing. Without this,
    you can't reliably determine which obligations are triggered.
  good_enough: A working draft mapping of lawful bases to each processing activity or purpose.
- ref: Art.12
  standard_id: GDPR:2016/679
  title: Transparent Information, Communication and Modalities
  category: cross_role
  rationale: GDPR Article 12 sets the baseline for how subject-rights obligations must be communicated
    and fulfilled. The register must reflect these modalities and response timelines.
  good_enough: A summary of Article 12 requirements and timelines, not a full policy, is available for
    reference.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of privacy roles is needed to ensure the obligations register is maintained
    and that requests are handled by the right people.
  good_enough: Named individuals or teams responsible for privacy obligations are identified, even if
    role descriptions are still being refined.
