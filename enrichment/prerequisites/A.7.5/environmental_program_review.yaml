leaf_id: req:A.7.5:environmental_program_review
control_ref: A.7.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization and which assets are covered by the ISMS
    before you can meaningfully review environmental protection controls. The scope defines what is in
    and out for the review.
  good_enough: A documented scope statement that clearly identifies the organizational boundaries and
    assets included in the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: The review must consider current threat assessments and risk scenarios. Without a recent
    risk assessment, you cannot evaluate whether environmental controls are adequate or up to date.
  good_enough: A completed risk assessment within the last year that identifies relevant environmental
    threats and vulnerabilities.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need an up-to-date inventory of assets to know what requires environmental protection
    and to ensure all relevant systems are included in the review.
  good_enough: A current list of physical and information assets that are subject to environmental controls.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are accountable for environmental
    protection and for conducting the periodic review.
  good_enough: Documented roles and responsibilities for environmental protection and review activities,
    with named individuals or teams.
