leaf_id: req:A.7.5:environmental_threats_procedure
control_ref: A.7.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which sites, locations, and business units are in-scope for your ISMS before
    you can define procedures for protecting against physical and environmental threats. This ensures
    your procedure covers all relevant areas.
  good_enough: A documented scope statement that clearly lists all physical locations and environments
    covered by the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A current risk assessment identifies which physical and environmental threats are relevant
    to your organization. Without this, you can't prioritize or justify the controls and responses in
    your procedure.
  good_enough: A recent risk assessment that specifically addresses physical and environmental threats
    for all in-scope locations.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need an up-to-date asset register to know what physical assets (e.g., servers, network
    equipment) require protection from environmental threats. This ensures your procedure is comprehensive.
  good_enough: A list of key physical assets at each in-scope site, even if some details are still being
    finalized.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that responsibilities for implementing, monitoring, and
    responding to physical and environmental threats are understood and actionable in your procedure.
  good_enough: A documented list of roles with assigned responsibilities for physical and environmental
    security, even if some names are placeholders.
