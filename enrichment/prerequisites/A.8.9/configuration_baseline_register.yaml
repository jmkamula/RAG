leaf_id: req:A.8.9:configuration_baseline_register
control_ref: A.8.9
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The configuration baseline register must only cover assets and systems within the defined
    ISMS scope. Without a clear scope, you can't know which assets require baseline tracking.
  good_enough: A documented scope statement that lists included business units, locations, and technologies
    is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need a current asset register to identify which asset classes require configuration baselines.
    The register is the source of truth for what needs to be tracked.
  good_enough: A list of information assets (hardware, software, etc.) with owners and classifications
    is available, even if not fully detailed.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The configuration baseline register should reflect the classification of assets, as more
    sensitive assets may require stricter baselines or more frequent reviews.
  good_enough: A basic classification scheme (e.g., public, internal, confidential) is defined and applied
    to asset types in the asset register.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the expectation for baseline management and asset configuration. Without
    it, the register lacks authority and context.
  good_enough: A published policy that mentions configuration management or baseline expectations, even
    if high-level.
