leaf_id: req:A.6.2:employment_terms_template
control_ref: A.6.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organisation and which roles are in-scope for information
    security before drafting employment contract terms. This ensures the template covers all relevant
    personnel and operations.
  good_enough: A documented, management-approved scope statement that clearly identifies included business
    units and job roles.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The contract template must reference and align with the organisation’s information security
    policy, so personnel duties and organisational responsibilities are consistent with policy commitments.
  good_enough: A current, approved information security policy that defines high-level responsibilities
    and expectations.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles and responsibilities is needed to accurately
    reflect these in employment contract clauses.
  good_enough: A documented list or matrix of information security roles and their main responsibilities,
    reviewed by management.
- ref: A.6.1
  standard_id: ISO27001:2022
  title: Screening
  category: direct
  rationale: Screening outcomes may affect the terms offered in employment contracts, such as additional
    controls or conditions for certain roles.
  good_enough: A defined screening process and record of its application to relevant roles, even if not
    all hires are fully screened yet.
