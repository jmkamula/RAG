leaf_id: req:A.6.2:terms_template_review
control_ref: A.6.2
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which roles, locations, and business units are in-scope for the ISMS before
    reviewing employment terms templates, so you only review templates relevant to the ISMS.
  good_enough: A documented scope statement that clearly identifies the people and functions covered by
    the ISMS.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The employment terms template must reference and align with the current information security
    policy; otherwise, the review can't check for policy drift.
  good_enough: A current, approved information security policy that is accessible to those drafting or
    reviewing employment terms.
- ref: A.6.1
  standard_id: ISO27001:2022
  title: Screening
  category: direct
  rationale: Screening outcomes may affect employment terms (e.g., background check requirements), so
    you need the screening process defined before reviewing the terms template.
  good_enough: A documented screening process and criteria, even if only in draft, that can be referenced
    in the employment terms template.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Employment terms must reflect current security roles and responsibilities; otherwise, the
    review can't ensure the template is up-to-date with actual job duties.
  good_enough: A list or matrix of key information security roles and their responsibilities, even if
    not fully formalized.
