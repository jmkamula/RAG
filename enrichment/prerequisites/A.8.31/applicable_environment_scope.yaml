leaf_id: req:A.8.31:applicable_environment_scope
control_ref: A.8.31
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines which parts of the organization, systems, and processes
    are covered by the information security management system. You cannot determine which environments
    require separation until you know what is in scope.
  good_enough: A documented scope statement that clearly lists included business units, systems, and locations,
    even if some boundaries are still being finalized.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is needed to identify which platforms, applications, and environments
    exist. Without this, you cannot specify which domains require environment separation.
  good_enough: A basic inventory of key information assets and platforms, with enough detail to distinguish
    between major environments (e.g., production, development).
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of information processed in each environment helps determine where
    separation is necessary and what level of control is appropriate.
  good_enough: A simple, documented classification scheme applied to major asset types, even if not all
    assets are fully classified yet.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Understanding how duties are segregated informs the need for environment separation, especially
    to prevent conflicts of interest or unauthorized changes across environments.
  good_enough: A summary of key segregation-of-duties practices, particularly for roles with access to
    multiple environments.
