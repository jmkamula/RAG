leaf_id: req:A.8.31:environment_program_review
control_ref: A.8.31
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which environments, systems, and data are in-scope for your ISMS before
    you can meaningfully review environment separation controls. This ensures your review covers all relevant
    environments.
  good_enough: A documented scope statement that clearly lists included environments and boundaries is
    available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all environments and assets that require
    separation and review. Without it, you can't verify environment-register currency or conduct access
    reviews.
  good_enough: A current list of environments and major assets exists, even if some minor updates are
    pending.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need a data classification scheme to determine what constitutes 'production data' and
    to check that such data is not present in non-production environments.
  good_enough: A basic, documented classification scheme is in place and in use for identifying production
    data.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that environment owners and reviewers
    are identified for the periodic review process.
  good_enough: Roles for environment management and review are assigned and documented, even if some responsibilities
    are still being refined.
- ref: A.5.3
  standard_id: ISO27001:2022
  title: Segregation of Duties
  category: direct
  rationale: Segregation of duties helps prevent conflicts of interest and ensures independent review
    of environment access and separation.
  good_enough: A documented approach to segregation of duties exists for environment management and review,
    even if not all roles are fully separated yet.
