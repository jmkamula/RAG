leaf_id: req:4.3:isms_scope
control_ref: '4.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.1'
  standard_id: ISO27001:2022
  title: Understanding the organization and its context
  category: foundational
  rationale: You need a clear understanding of your organization's internal and external context before
    you can define what the ISMS should cover. The scope must reflect the realities and boundaries shaped
    by these contextual factors.
  good_enough: A documented register or summary of key internal and external issues that impact information
    security, reviewed by relevant stakeholders.
- ref: '4.2'
  standard_id: ISO27001:2022
  title: Understanding the needs and expectations of interested parties
  category: foundational
  rationale: Identifying interested parties and their expectations ensures that the ISMS scope addresses
    all relevant requirements and interfaces. Missing this step risks overlooking critical obligations
    or stakeholders.
  good_enough: A list or register of interested parties and their information security expectations, with
    enough detail to inform scope boundaries.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles and responsibilities
  category: foundational
  rationale: You need clarity on who is accountable for defining, approving, and maintaining the ISMS
    scope. Without assigned roles, scope decisions may lack authority or buy-in.
  good_enough: Named individuals or roles responsible for ISMS scope determination and approval, documented
    in an org chart or RACI matrix.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information security policy
  category: direct
  rationale: The ISMS scope should align with the overarching information security policy, ensuring consistency
    in objectives and commitments. Drafting scope without this policy risks misalignment.
  good_enough: A current, approved information security policy that sets out the organization's commitment
    and high-level objectives.
