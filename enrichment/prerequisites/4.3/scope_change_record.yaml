leaf_id: req:4.3:scope_change_record
control_ref: '4.3'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.1'
  standard_id: ISO27001:2022
  title: Understanding the organization and its context
  category: foundational
  rationale: You must understand your organization's context before you can justify or record any changes
    to the ISMS scope. This ensures scope changes are grounded in real business drivers, not arbitrary
    decisions.
  good_enough: A current, documented summary of your organization's context and key influencing factors
    is available and referenced in scope discussions.
- ref: '4.2'
  standard_id: ISO27001:2022
  title: Understanding the needs and expectations of interested parties
  category: foundational
  rationale: You need to know which stakeholders and their requirements are relevant to the ISMS before
    you can assess or record scope changes. This prevents scope drift that could miss critical obligations.
  good_enough: A list or summary of relevant interested parties and their key information security expectations
    is documented and accessible.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: direct
  rationale: You must have a current, approved ISMS scope statement before you can meaningfully record
    any changes to it. The change record is only valid if it references a baseline scope.
  good_enough: A written, management-approved ISMS scope statement exists, even if it is subject to change.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: direct
  rationale: The information security policy sets the high-level direction for the ISMS, including how
    scope is determined and changed. Change records should align with this policy.
  good_enough: A published information security policy exists that references scope management or change
    control at a high level.
