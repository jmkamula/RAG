leaf_id: req:9.2:audit_execution_record
control_ref: '9.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know what parts of the organisation and which processes are in-scope for the
    ISMS before you can meaningfully record what was audited. The audit execution record must reference
    the defined scope to be valid.
  good_enough: A documented scope statement that clearly defines the ISMS boundaries and applicability
    is available and up to date.
- ref: A.8.34
  standard_id: ISO27001:2022
  title: Protection of information systems during audit testing
  category: direct
  rationale: Controls must be in place to ensure that audit activities do not compromise the confidentiality,
    integrity, or availability of information systems. This is essential context for recording how audits
    were conducted safely.
  good_enough: Documented procedures or controls exist to protect systems during audit activities, even
    if not fully mature.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The internal audit must be executed in line with the organisation’s information security
    policy. The policy sets the expectations and objectives that the audit execution record should reference.
  good_enough: A current, approved information security policy is available and communicated to relevant
    staff.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Audit planning and execution should be risk-based. The execution record must show alignment
    with identified risks and priorities.
  good_enough: A recent risk assessment exists, identifying key risks relevant to the ISMS scope, even
    if not exhaustive.
