leaf_id: req:9.2:audit_cycle_coverage_scope
control_ref: '9.2'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need a clear ISMS scope to define which processes and assets are in or out of your audit
    cycle. Without this, you can't meaningfully describe what your audit cycle covers or what 'complete'
    means.
  good_enough: A documented scope statement that lists included business units, processes, and locations,
    even if some boundaries are still being refined.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: foundational
  rationale: The risk assessment identifies which areas are most critical and should influence audit frequency
    and coverage. This ensures your audit cycle is risk-based, as required.
  good_enough: A recent risk assessment that highlights key risks and prioritizes areas for audit, even
    if some risk treatments are still in progress.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is needed to know which information assets and systems must
    be considered for audit coverage. Gaps here could leave critical areas unaudited.
  good_enough: A working list of key information assets and systems, with ownership and basic classification,
    even if not fully exhaustive.
- ref: A.8.34
  standard_id: ISO27001:2022
  title: Protection of information systems during audit testing
  category: direct
  rationale: Controls for protecting systems during audit testing must be in place to ensure audits can
    be performed safely and without disrupting operations. This underpins the feasibility of your audit
    cycle.
  good_enough: Documented procedures or safeguards for audit activities, showing that audits won't compromise
    system integrity or availability.
