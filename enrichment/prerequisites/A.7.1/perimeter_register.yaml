leaf_id: req:A.7.1:perimeter_register
control_ref: A.7.1
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The Perimeter Register must only cover sites and areas within the defined ISMS scope. Without
    a clear scope statement, you cannot reliably identify which sites require perimeter definition.
  good_enough: A documented scope listing all included sites and locations, even if the scope boundaries
    are still being refined.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The Asset Register provides the authoritative list of physical sites and locations, which
    is essential for ensuring every relevant site is included in the Perimeter Register.
  good_enough: A basic inventory of all physical sites and facilities, even if some asset details are
    pending.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Each perimeter and site must have an assigned owner or responsible person to ensure accountability
    for perimeter definition and maintenance.
  good_enough: A list of site owners or responsible persons for each location, even if formal role descriptions
    are still being finalized.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Area classification (e.g., public, restricted, secure) is a required field in the Perimeter
    Register. The classification scheme defines these categories.
  good_enough: A draft or working list of area classifications with basic definitions, even if not fully
    ratified.
