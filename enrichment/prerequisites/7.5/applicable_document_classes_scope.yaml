leaf_id: req:7.5:applicable_document_classes_scope
control_ref: '7.5'
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope statement defines the organizational and process boundaries for the management
    system, which is essential to determine which document classes fall within the ISMS and must be controlled.
  good_enough: A clear, approved scope statement exists that identifies the organizational units, activities,
    and assets covered by the ISMS.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme provides the rules for categorizing information and documents,
    which is needed to distinguish between ISMS-documented information and incidental records.
  good_enough: A documented, organization-specific classification scheme is available, even if not fully
    rolled out, that covers major information types relevant to the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The asset register lists key information assets and their types, helping to identify which
    document classes are critical and should be included in the ISMS-documented information scope.
  good_enough: A basic asset register exists that identifies core information assets and their owners,
    even if not exhaustive or fully detailed.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The information security policy sets the high-level intent and requirements for information
    management, which guides decisions about which document classes are necessary for the ISMS.
  good_enough: A current, approved information security policy is in place that references documentation
    and information management expectations.
