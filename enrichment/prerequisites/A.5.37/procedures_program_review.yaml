leaf_id: req:A.5.37:procedures_program_review
control_ref: A.5.37
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS to ensure the procedures program review covers
    all relevant facilities, processes, and information assets. Without a clear scope, you can't verify
    if your procedures register is complete or accurate.
  good_enough: A documented scope statement that clearly defines what is in and out of scope for the ISMS,
    even if it’s high-level or draft.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The procedures program review must ensure that all assets requiring procedures are covered.
    Without an up-to-date asset register, you can’t confirm your procedures register is complete or relevant.
  good_enough: A basic, current list of key information assets and their owners, even if not fully detailed.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: You need to know who is responsible for maintaining and reviewing procedures. The review
    process depends on clear assignment of roles to ensure accountability.
  good_enough: A simple mapping of who is responsible for procedures management and review, even if responsibilities
    are not fully formalized.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Procedures often vary by information classification. You need a basic classification scheme
    to check if your procedures register and reviews address the right protection needs.
  good_enough: A documented outline of classification levels and basic handling rules, even if not fully
    rolled out.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets expectations for maintaining and reviewing procedures. Without it, you lack
    the baseline for what your procedures program and its review should achieve.
  good_enough: A published information security policy that references the need for documented and maintained
    procedures, even if brief.
