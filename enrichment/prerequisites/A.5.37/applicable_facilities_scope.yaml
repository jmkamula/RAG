leaf_id: req:A.5.37:applicable_facilities_scope
control_ref: A.5.37
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS Scope Statement defines the organisational and technical boundaries for the information
    security management system, which is essential to determine which facilities are in-scope for A.5.37.
    Without a clear scope, you can't reliably identify or justify which facilities must be documented.
  good_enough: A written scope statement exists that lists the business units, locations, and systems
    included in the ISMS, even if it's high-level or draft.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The asset register provides the inventory of information assets, including facilities, that
    need to be protected. It is the starting point for identifying which processing facilities should
    be included in the A.5.37 scope.
  good_enough: There is a basic, up-to-date list of key information assets and facilities, even if not
    fully detailed or formally risk-assessed.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme helps determine which facilities process sensitive or critical
    information, guiding which ones must be included in the documented scope for A.5.37.
  good_enough: A simple classification policy exists that distinguishes at least between public and sensitive/confidential
    data, with some mapping to facilities.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: foundational
  rationale: Risk assessment identifies which facilities are critical from a security perspective and
    therefore must be included in the documented scope. It ensures the scope is risk-driven, not arbitrary.
  good_enough: At least one recent risk assessment has been performed that covers major facilities, even
    if not exhaustive or fully formalised.
