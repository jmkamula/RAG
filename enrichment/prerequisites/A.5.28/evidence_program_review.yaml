leaf_id: req:A.5.28:evidence_program_review
control_ref: A.5.28
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organisation and which types of evidence are covered
    by your ISMS before you can meaningfully review the evidence-handling program. The scope defines the
    boundaries for what must be reviewed.
  good_enough: A documented scope statement that clearly identifies the organisational units, processes,
    and information assets included in the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A current asset register ensures you know what evidence assets exist and must be tracked
    for integrity and custody. Without this, you can't verify if all relevant evidence is included in
    the review.
  good_enough: A maintained list of evidence-related assets, with enough detail to identify and locate
    each item for review purposes.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need an established classification scheme to determine which evidence types require special
    handling or review focus. This ensures the review covers all relevant categories and applies appropriate
    standards.
  good_enough: A documented scheme that assigns classification levels to evidence assets, with clear criteria
    for each level.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles is necessary so you know who is authorised to handle evidence,
    conduct reviews, and implement changes. The review must assess competence and training status, which
    depends on defined responsibilities.
  good_enough: A list or matrix showing who is responsible for evidence handling, review, and related
    decisions, with named individuals or roles.
