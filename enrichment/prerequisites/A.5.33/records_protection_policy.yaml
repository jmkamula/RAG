leaf_id: req:A.5.33:records_protection_policy
control_ref: A.5.33
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization and which types of records are covered by
    your ISMS before you can define how records are protected and retained. The scope statement ensures
    your policy applies to the right records and business units.
  good_enough: A documented scope statement that clearly identifies the organizational boundaries and
    information types included in the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Records are a type of information asset. You need an up-to-date asset register to identify
    which records exist, where they are stored, and their owners before you can set protection and retention
    rules.
  good_enough: A basic inventory listing all key record types, their locations, and responsible owners—even
    if not fully exhaustive.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Protection and retention requirements depend on how records are classified (e.g., confidential,
    public, internal). The classification scheme must exist so you can apply the right controls per record
    class.
  good_enough: A documented scheme with clear categories and example types, even if not all records are
    yet classified.
- ref: A.5.31
  standard_id: ISO27001:2022
  title: Legal, statutory, regulatory and contractual requirements
  category: direct
  rationale: You must know which laws, regulations, and contracts affect record retention and protection.
    This register informs the policy about minimum retention periods, protection standards, and legal
    holds.
  good_enough: A working list of key legal and regulatory requirements relevant to records, even if not
    fully comprehensive.
