leaf_id: req:A.5.33:records_program_review
control_ref: A.5.33
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The records protection program review must align with the defined ISMS scope to ensure all
    relevant records classes and business units are covered. Without a clear scope, the review could miss
    critical areas or include irrelevant ones.
  good_enough: A documented and approved ISMS scope statement that identifies the organizational boundaries
    and information assets to which the records management program applies.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all information assets (including records)
    that require protection and review. Missing or outdated asset inventories will cause gaps in the records
    review process.
  good_enough: A current list of information assets, including records types and locations, that is reviewed
    and updated at least annually.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The review must verify that records are managed according to their classification, which
    determines protection and retention requirements. Without a classification scheme, the review cannot
    assess whether records are handled appropriately.
  good_enough: A documented classification scheme that assigns protection requirements to each records
    class, available to those responsible for records management.
- ref: A.5.31
  standard_id: ISO27001:2022
  title: Legal, statutory, regulatory and contractual requirements
  category: direct
  rationale: The records protection program must reflect all applicable legal and regulatory retention
    and disposal obligations. Without a current register of these requirements, the review cannot confirm
    compliance.
  good_enough: A maintained register of legal, regulatory, and contractual requirements relevant to records
    retention and protection, reviewed at least annually.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the records protection program review is performed
    by accountable personnel and that findings are actioned. Without defined responsibilities, the review
    process may be neglected or ineffective.
  good_enough: Documented roles and responsibilities for records management and program review, communicated
    to relevant staff.
