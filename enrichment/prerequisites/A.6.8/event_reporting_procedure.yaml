leaf_id: req:A.6.8:event_reporting_procedure
control_ref: A.6.8
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organisation, systems, and processes are in-scope for
    the ISMS to define who should report events and which events are relevant. Without a clear scope,
    the reporting procedure may miss critical areas or include irrelevant ones.
  good_enough: A documented scope statement that identifies the organisational boundaries and key assets/processes
    covered by the ISMS.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles and responsibilities ensures that staff know
    who is responsible for receiving, triaging, and responding to reported events. This underpins the
    effectiveness of the reporting procedure.
  good_enough: A current list or matrix showing who is responsible for information security event handling
    and reporting oversight.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The policy sets the overall expectations for information security, including the importance
    of reporting events. The procedure must align with and reference these policy commitments.
  good_enough: A published policy that mentions event reporting as an organisational expectation, even
    if details are high-level.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing how information and assets are classified helps define what constitutes a reportable
    event and the urgency or sensitivity of reporting. The procedure should reference these classifications.
  good_enough: A basic classification scheme that distinguishes at least between public, internal, and
    confidential data/assets.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register helps staff identify which assets are in-scope for event reporting
    and ensures the procedure covers all relevant systems and data.
  good_enough: A working list of key information assets and systems, even if not fully comprehensive,
    to guide what should be reported on.
