leaf_id: req:B.8.5.2:destinations_procedure
control_ref: B.8.5.2
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The destinations procedure must align with the defined ISMS scope to ensure only relevant
    processing activities and PII transfers are included. Without a clear scope, you risk omitting or
    misrepresenting transfer destinations.
  good_enough: The scope statement should clearly identify all business units, processes, and systems
    involved in processing customer PII as a processor.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: An up-to-date asset register is essential to identify all systems, applications, and locations
    where customer PII is stored or processed, which directly informs the list of transfer destinations.
  good_enough: A basic inventory of all assets (systems, databases, cloud services) that handle customer
    PII, even if not fully classified, is sufficient to start.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: You need a working classification scheme to distinguish customer PII from other data types,
    ensuring only relevant transfers are captured in the destinations procedure.
  good_enough: A documented approach for identifying and labeling customer PII in your environment, even
    if not fully rolled out, is enough to proceed.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Understanding and documenting the purposes for which customer PII is processed is necessary
    to justify and contextualize any transfers, as required by the destinations procedure.
  good_enough: A summary of processing purposes for each major customer PII flow, even if not fully detailed,
    is sufficient to unblock drafting.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The lawful basis for processing customer PII must be established to ensure that any transfers
    to destinations are legally justified and can be communicated to customers.
  good_enough: A list of lawful bases mapped to each processing activity involving customer PII, even
    if not fully validated, is adequate for initial drafting.
