leaf_id: req:Art.41:monitoring_program_review
control_ref: Art.41
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need a current, accurate record of processing activities to understand what data processing
    is subject to code monitoring and to identify relevant monitoring targets.
  good_enough: A maintained RoPA covering all relevant processing activities, updated within the last
    year, is sufficient to proceed.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: Data Protection Officer (DPO) Designation
  category: foundational
  rationale: A designated DPO is required to oversee and coordinate code monitoring, ensuring independence
    and proper escalation of findings.
  good_enough: A named DPO with documented responsibilities and contact details is in place.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: You must confirm that all monitored processing activities have a documented lawful basis,
    as this underpins the legitimacy of both processing and monitoring actions.
  good_enough: Each processing activity in scope for monitoring has a recorded lawful basis, even if some
    are pending detailed review.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The ISMS scope statement helps define which systems and processes are covered by the monitoring
    program, ensuring alignment between security and privacy oversight.
  good_enough: A current ISMS scope statement exists and includes all systems relevant to GDPR code monitoring,
    even if not all details are finalized.
