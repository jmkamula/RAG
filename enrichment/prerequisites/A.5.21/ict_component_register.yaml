leaf_id: req:A.5.21:ict_component_register
control_ref: A.5.21
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS to determine which ICT components and vendors
    must be included in the register. Without a clear scope, you risk missing critical assets or including
    irrelevant ones.
  good_enough: A documented scope statement that clearly defines the organizational and technical boundaries
    for the ISMS, so you know which ICT assets to consider.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The ICT component register builds on the general asset register, which should already list
    key information assets. This ensures you have a baseline inventory to identify which assets are ICT
    components.
  good_enough: An up-to-date asset register that at least identifies major ICT assets, even if some details
    are pending.
- ref: A.5.20
  standard_id: ISO27001:2022
  title: Addressing information security within supplier agreements
  category: direct
  rationale: You need to know which suppliers are contractually bound to support your ICT components,
    and what security requirements apply. This underpins the accuracy and completeness of your ICT vendor
    register.
  good_enough: A list of active supplier agreements relevant to ICT, with basic security clauses identified.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment helps you identify which ICT components are critical and require special
    attention in the register, such as those with high risk or business impact.
  good_enough: A recent risk assessment that highlights at least the most critical ICT assets and their
    associated risks.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: A classification scheme allows you to tag ICT components in the register by sensitivity or
    criticality, supporting prioritization and appropriate controls.
  good_enough: A documented scheme for classifying assets, even if not all assets are yet classified.
