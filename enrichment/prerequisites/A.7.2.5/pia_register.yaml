leaf_id: req:A.7.2.5:pia_register
control_ref: A.7.2.5
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The PIA/DPIA Register must align with the defined scope of the ISMS, ensuring that only relevant
    processing activities and assets are included. Without a clear scope, you cannot determine which PIAs
    are required or in-scope.
  good_enough: A documented scope statement that clearly defines the organizational and process boundaries
    for privacy management.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Each PIA/DPIA must be tied to a specific processing purpose. Without documented purposes,
    you cannot accurately record or justify PIAs in the register.
  good_enough: A list of processing activities with their documented purposes, sufficient to reference
    in each PIA entry.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: The lawful basis for each processing activity must be established before a PIA can be completed
    and registered. This ensures each PIA is legally grounded.
  good_enough: Each processing activity has an identified lawful basis, documented in a way that can be
    referenced in the PIA register.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of privacy roles is necessary to ensure PIAs are conducted, reviewed, and
    signed off by the right people. The register must reflect accountable individuals.
  good_enough: Documented privacy roles and responsibilities, with named individuals or functions for
    PIA oversight.
