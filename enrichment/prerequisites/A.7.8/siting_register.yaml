leaf_id: req:A.7.8:siting_register
control_ref: A.7.8
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which locations, equipment, and business units are in-scope for your ISMS
    before you can create a meaningful equipment siting register. This ensures the register is complete
    and only covers relevant assets.
  good_enough: A documented scope statement that clearly lists included sites, asset types, and boundaries
    is available and up to date.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The equipment siting register builds on your asset register, which lists all in-scope equipment.
    Without an asset register, you cannot reliably catalogue equipment locations or assign ownership.
  good_enough: A basic asset register exists with enough detail to identify equipment items and their
    owners.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: You need a classification scheme to determine the class or sensitivity of each equipment
    item in the siting register. This informs what protection measures are appropriate.
  good_enough: A simple, documented classification scheme is in place and can be referenced for each asset.
- ref: A.7.12
  standard_id: ISO27001:2022
  title: Cabling Security
  category: direct
  rationale: Cabling security requirements may impact where equipment can be sited and what protections
    are needed. These considerations should be reflected in the siting register.
  good_enough: Cabling security controls are identified for relevant equipment, even if detailed implementation
    is still in progress.
