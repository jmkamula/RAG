leaf_id: req:A.7.8:siting_program_review
control_ref: A.7.8
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which locations, equipment, and business units are in-scope for the ISMS
    before reviewing how equipment is sited. This ensures the review covers all relevant assets and sites.
  good_enough: A documented scope statement that clearly lists included locations and equipment types.
    It should be current enough to guide the review process.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: A current asset register is essential to identify all equipment that must be checked for
    proper siting. Without it, you can't verify if all assets are accounted for or correctly located.
  good_enough: A maintained list of equipment assets, including their locations and classifications, that
    is up-to-date for the review period.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need to know the classification of each equipment asset to verify it is sited according
    to its security requirements. The review depends on these classifications being defined.
  good_enough: A documented scheme that assigns security classes to equipment types, with enough detail
    to inform siting requirements.
- ref: A.7.12
  standard_id: ISO27001:2022
  title: Cabling security
  category: direct
  rationale: Cabling security requirements may dictate or influence where equipment can be sited. Reviewing
    siting without considering cabling controls could miss key risks.
  good_enough: Documented cabling security requirements or controls that are referenced in equipment siting
    decisions, even if not fully implemented yet.
