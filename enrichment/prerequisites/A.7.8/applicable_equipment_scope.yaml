leaf_id: req:A.7.8:applicable_equipment_scope
control_ref: A.7.8
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the overall boundaries of your ISMS before you can define which equipment
    classes are in scope. This ensures that the equipment scope aligns with the organization's agreed
    security perimeter.
  good_enough: A documented scope statement that clearly identifies included locations, assets, and business
    processes is available.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify all equipment types that could be in
    scope. Without this, you can't reliably determine or justify which equipment classes are included
    or excluded.
  good_enough: A basic inventory of equipment assets exists, even if not fully detailed, covering all
    major asset classes.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: You need a classification scheme to determine the protection level required for each equipment
    class. This underpins the rationale for applying different controls to different equipment.
  good_enough: A simple, documented classification scheme is in place, even if not fully rolled out, that
    distinguishes at least between high and low sensitivity equipment.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment results help justify why certain equipment is in or out of scope and what
    protection levels are appropriate. This ensures your scope is risk-driven, not arbitrary.
  good_enough: A recent risk assessment exists that at least references equipment-related risks, even
    if not exhaustive.
