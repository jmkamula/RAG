leaf_id: req:A.8.8:applicable_vuln_scope
control_ref: A.8.8
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organization and which assets are in-scope for your
    ISMS before you can define which assets require vulnerability scanning. This ensures your vulnerability
    management scope aligns with your overall security boundaries.
  good_enough: A clear, current scope statement that lists included business units, locations, and asset
    types. It doesn't need to be perfect, but must cover all areas where vulnerability management will
    apply.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which asset classes exist and need
    to be considered for vulnerability scanning. Without it, you can't map scanning approaches to asset
    types.
  good_enough: A working inventory of major asset classes (e.g., servers, endpoints, cloud resources)
    with enough detail to distinguish scanning needs. It can be high-level but must be more than a placeholder.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Knowing the classification of assets helps prioritize which assets require more rigorous
    vulnerability management. This ensures critical or sensitive assets are not overlooked.
  good_enough: A basic scheme that tags assets by sensitivity or criticality, even if not all assets are
    fully classified yet. Enough to inform initial scanning priorities.
- ref: A.8.9
  standard_id: ISO27001:2022
  title: Configuration Management
  category: direct
  rationale: Configuration baselines are needed to assess whether vulnerabilities exist relative to an
    approved state. Without this, scanning results may be meaningless or misleading.
  good_enough: Documented baseline configurations for key asset types, even if not all are finalized.
    Enough to interpret vulnerability scan findings in context.
