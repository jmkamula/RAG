leaf_id: req:A.6.6:nda_template
control_ref: A.6.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The NDA template must reflect the organisational boundaries and entities covered by the ISMS.
    Without a clear scope, you can't identify which parties or information types the NDA should address.
  good_enough: A documented scope statement that defines the organisational units, activities, and assets
    included in the ISMS.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: The NDA must specify which information assets require protection. An up-to-date asset register
    ensures the NDA template covers all relevant information classes.
  good_enough: A basic inventory of key information assets, even if not fully detailed, that identifies
    what needs confidentiality protection.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The NDA template should reference the organisation's information classification scheme to
    define what is considered confidential. This ensures clarity and consistency in what the NDA covers.
  good_enough: A documented classification scheme that distinguishes at least between confidential and
    non-confidential information.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The NDA template should align with the organisation's overarching information security policy,
    ensuring consistency in confidentiality expectations and obligations.
  good_enough: A current, approved information security policy that sets out basic confidentiality requirements.
