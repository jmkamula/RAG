leaf_id: req:A.6.5:post_employment_program_review
control_ref: A.6.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The ISMS scope defines which parts of the organization and which types of information are
    covered by security controls, including post-employment obligations. Without a clear scope, you cannot
    determine which leavers or obligations should be reviewed.
  good_enough: A documented scope statement that identifies the organizational boundaries and information
    types relevant to post-employment controls.
- ref: '5.2'
  standard_id: ISO27001:2022
  title: Information Security Policy
  category: foundational
  rationale: The security policy sets the overall direction for information security, including expectations
    for handling information after employment ends. This ensures the review aligns with organizational
    intent and legal requirements.
  good_enough: A current, approved security policy that references post-employment obligations and is
    communicated to relevant staff.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are responsible for briefing leavers,
    tracking obligations, and handling breaches. Without this, reviews may miss key actions or accountability.
  good_enough: Documented roles and responsibilities for managing post-employment processes, with named
    individuals or functions.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets (e.g., devices, documents, credentials) are assigned to leavers is essential
    for verifying that post-employment obligations are met and that assets are returned or access revoked.
  good_enough: An up-to-date register of assets assigned to staff, including a process for updating it
    when employment ends.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: The classification scheme helps determine which information is subject to post-employment
    obligations and what level of protection or briefing is required for different types of information.
  good_enough: A documented classification scheme that is referenced during leaver briefings and post-employment
    reviews.
