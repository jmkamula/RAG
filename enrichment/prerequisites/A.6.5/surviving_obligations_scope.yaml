leaf_id: req:A.6.5:surviving_obligations_scope
control_ref: A.6.5
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know the boundaries of your ISMS—what people, processes, and locations are in-scope—before
    you can map which surviving obligations apply and to whom. This ensures the obligations catalogue
    is relevant and enforceable.
  good_enough: A clear, documented scope that identifies included business units, geographies, and personnel
    types is available and approved.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Surviving obligations differ by role (e.g., executive vs. standard staff), so you must have
    a defined set of roles and their responsibilities to map obligations accurately.
  good_enough: A current list of roles with basic descriptions and reporting lines exists, even if not
    fully detailed.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Obligations often depend on the sensitivity or classification of information handled by each
    role. Without a classification scheme, you can't determine which obligations are relevant.
  good_enough: A documented scheme for classifying information assets is in place and roles are aware
    of which classes they handle.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets are managed by which roles helps determine the scope and applicability
    of post-employment obligations, especially for sensitive or regulated assets.
  good_enough: A basic asset register exists, mapping key assets to responsible roles, even if not exhaustive.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: Risk assessment identifies areas where surviving obligations are most critical (e.g., high-risk
    roles or jurisdictions with strict legal caps). This informs which obligations need to be scoped and
    prioritized.
  good_enough: At least one recent risk assessment covering personnel and information handling risks is
    available, even if not fully comprehensive.
