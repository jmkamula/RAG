leaf_id: req:Art.7:consent_management_procedure
control_ref: Art.7
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawfulness of processing
  category: direct
  rationale: You must first determine which processing activities rely on consent as their lawful basis
    under Art.6. Without this, you cannot meaningfully define or document a consent management procedure.
  good_enough: A documented mapping of processing activities to their lawful bases, with those using consent
    (Art.6.1.a) clearly identified.
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: A current RoPA is needed to identify all processing activities, so you can ensure your consent
    management procedure covers every relevant context where consent is required.
  good_enough: A working RoPA that lists all processing activities, even if some details are pending,
    so you can cross-reference where consent applies.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: You need to know the organizational and system boundaries to ensure your consent management
    procedure covers all in-scope processing activities and data subjects.
  good_enough: A draft or approved ISMS scope statement that defines the organizational units, systems,
    and geographies covered by your compliance program.
- ref: Art.37
  standard_id: GDPR:2016/679
  title: DPO Designation
  category: foundational
  rationale: If a DPO is required, their involvement is critical in designing and approving the consent
    management procedure to ensure regulatory alignment.
  good_enough: A documented decision on whether a DPO is required, and if so, their contact details and
    role in privacy governance.
