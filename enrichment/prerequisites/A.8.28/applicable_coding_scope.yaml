leaf_id: req:A.8.28:applicable_coding_scope
control_ref: A.8.28
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of the organization, systems, and processes are included in
    the ISMS before you can define which code repositories and languages are in scope for secure coding.
  good_enough: A clear, approved ISMS scope statement that identifies the organizational and technical
    boundaries relevant to software development.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: An up-to-date asset register is essential to identify which code repositories, tools, and
    environments exist and are potentially in scope for secure coding controls.
  good_enough: A current list of code repositories, development tools, and related assets, even if not
    fully classified, to enable scoping decisions.
- ref: A.8.25
  standard_id: ISO27001:2022
  title: Secure development life cycle
  category: direct
  rationale: The secure development life cycle (SDLC) defines the organization's approach to secure coding,
    which directly informs which repositories, languages, and tooling must be covered.
  good_enough: A documented SDLC process or policy that outlines secure coding requirements, even if not
    fully mature.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles ensures that the right people are involved in identifying and maintaining
    the scope of secure coding practices.
  good_enough: Documented roles for development, security, and code ownership, with at least basic responsibility
    assignments for secure coding.
