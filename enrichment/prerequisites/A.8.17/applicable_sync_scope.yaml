leaf_id: req:A.8.17:applicable_sync_scope
control_ref: A.8.17
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You must know which systems, processes, and locations are in-scope for your ISMS before you
    can define which system classes need synchronization and set drift tolerances. Without a clear scope,
    you risk omitting critical systems or including irrelevant ones.
  good_enough: A documented, management-approved ISMS scope that clearly lists included system types and
    boundaries.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: You need a current asset register to identify which system classes exist and are relevant
    for synchronization. This ensures you don't overlook any assets that require sync or mistakenly include
    non-existent ones.
  good_enough: A basic, up-to-date inventory of information assets and system classes, even if not fully
    detailed.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Classification helps determine which systems are forensics-critical and which are less sensitive,
    guiding the appropriate sync drift tolerances for each class.
  good_enough: A simple, working classification scheme that tags system classes by criticality or sensitivity.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Risk Assessment
  category: foundational
  rationale: A risk assessment identifies which systems are critical for security and compliance, informing
    the required sync precision and tolerance for each class.
  good_enough: A recent risk assessment that at least highlights key system classes and their risk profiles.
