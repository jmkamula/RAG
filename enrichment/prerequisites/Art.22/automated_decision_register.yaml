leaf_id: req:Art.22:automated_decision_register
control_ref: Art.22
standard_id: GDPR:2016/679
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: Art.30
  standard_id: GDPR:2016/679
  title: Records of Processing Activities
  category: foundational
  rationale: You need an up-to-date inventory of all processing activities to identify which involve solely
    automated decision-making. Without this, you can't reliably determine which systems require registration.
  good_enough: A current, reasonably complete RoPA that lists processing purposes, systems, and legal
    bases, even if not perfectly detailed.
- ref: Art.6
  standard_id: GDPR:2016/679
  title: Lawful Basis for Processing
  category: foundational
  rationale: Each automated decision system must have a documented lawful basis for processing personal
    data. This is essential to justify the existence and operation of the system in the register.
  good_enough: A mapped lawful basis (e.g., consent, contract) for each relevant processing activity,
    with basic documentation supporting the choice.
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: cross_role
  rationale: The scope statement clarifies which business units, systems, and processes are in-scope for
    compliance, ensuring the register covers all relevant automated decision systems.
  good_enough: A documented scope that includes all business areas and systems subject to GDPR, even if
    some boundaries are still being finalized.
