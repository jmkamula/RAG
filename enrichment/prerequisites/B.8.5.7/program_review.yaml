leaf_id: req:B.8.5.7:program_review
control_ref: B.8.5.7
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which parts of the organisation, processes, and information assets
    are covered by the ISMS and its privacy extension. You need to know which subcontractor engagements
    fall within scope before reviewing the program.
  good_enough: A documented scope that clearly includes subcontractor relationships and privacy-relevant
    activities is available and up to date.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of roles and responsibilities ensures that someone is accountable for managing
    subcontractor engagements and for conducting the required program review.
  good_enough: Documented roles exist for managing subcontractors and performing annual reviews, even
    if detailed job descriptions are still being refined.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the documented purposes for which personal data is processed by subcontractors
    to verify that customer authorisation and flow-down requirements are being met.
  good_enough: A list or register of processing purposes for each subcontractor engagement is available,
    even if some purposes are high-level.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for each subcontractor's processing activities is essential
    to confirm that customer authorisation aligns with legal requirements.
  good_enough: Each subcontractor engagement has a stated lawful basis for processing, even if the supporting
    documentation is still being finalised.
