leaf_id: req:B.8.5.7:subcontractor_engagement_register
control_ref: B.8.5.7
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: You need to know which parts of your organisation and which processing activities are in
    scope for privacy management before you can identify relevant subcontractors and document their engagement.
  good_enough: A clear, current scope statement that covers all business units and processes where subcontractors
    might be engaged for personal data processing.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of privacy and security roles is necessary to ensure someone is accountable
    for managing subcontractor relationships and maintaining the register.
  good_enough: Documented roles showing who is responsible for subcontractor onboarding, contract management,
    and register upkeep.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: You must know the purpose for which each subcontractor is engaged, especially regarding personal
    data processing, to justify their inclusion and the controls applied.
  good_enough: A list or matrix mapping subcontractors to processing purposes, even if not yet fully detailed.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Understanding the lawful basis for processing is essential before engaging subcontractors,
    as it affects contract terms and audit requirements.
  good_enough: A summary of lawful bases for each processing activity involving subcontractors, sufficient
    to inform contract drafting and register entries.
- ref: Art.28
  standard_id: GDPR:2016/679
  title: Processor Requirements
  category: cross_role
  rationale: GDPR Article 28 sets the legal requirements for engaging processors (subcontractors), including
    contract content and due diligence, which the register must evidence.
  good_enough: A checklist or template showing how Article 28 requirements are addressed in subcontractor
    contracts, even if not all contracts are yet fully reviewed.
