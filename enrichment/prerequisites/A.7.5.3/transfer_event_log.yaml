leaf_id: req:A.7.5.3:transfer_event_log
control_ref: A.7.5.3
standard_id: ISO27701:2019
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The PII Transfer Event Log must only cover transfers within the defined ISMS and PIMS scope.
    Without a clear scope, you cannot reliably identify which PII transfers need to be logged.
  good_enough: A documented scope statement that clearly defines the organizational and system boundaries
    for PII processing and transfer activities.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: foundational
  rationale: You need an up-to-date asset register to know which information assets contain PII and may
    be subject to transfer, ensuring all relevant events are logged.
  good_enough: A basic, current list of information assets that includes those containing PII and their
    owners.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: The log must focus on PII transfers, so you need a way to identify and classify data as PII
    before tracking its movement.
  good_enough: A simple documented scheme or tags that distinguish PII from other data types in your environment.
- ref: A.7.2.1
  standard_id: ISO27701:2019
  title: Identify and Document Purpose
  category: direct
  rationale: Each transfer event log entry must include the purpose of transfer. You need a list of approved
    purposes for PII processing and sharing to populate this field accurately.
  good_enough: A working list or register of documented purposes for PII processing and transfer, even
    if not exhaustive.
- ref: A.7.2.2
  standard_id: ISO27701:2019
  title: Identify Lawful Basis
  category: direct
  rationale: Knowing the lawful basis for each PII transfer is essential for compliance and may be required
    in the event log. This ensures transfers are justified and defensible.
  good_enough: A summary table or mapping of lawful bases for the main categories of PII transfers, covering
    the most common scenarios.
