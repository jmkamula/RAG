leaf_id: req:A.5.6:risk_topic_scope
control_ref: A.5.6
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The SIG Engagement Risk-Topic Scope must align with the overall ISMS scope to ensure that
    all identified risk topics and SIG memberships are relevant to the organization's defined boundaries
    and context.
  good_enough: A documented scope statement that clearly defines what parts of the organization, processes,
    and assets are covered by the ISMS.
- ref: 6.1.2
  standard_id: ISO27001:2022
  title: Information Security Risk Assessment
  category: direct
  rationale: Understanding the organization's risk landscape is essential to justify SIG memberships and
    select relevant threat categories, technologies, and domains for engagement.
  good_enough: A recent risk assessment identifying key threats, assets, and vulnerabilities, even if
    not fully detailed, to inform SIG engagement decisions.
- ref: A.5.9
  standard_id: ISO27001:2022
  title: Asset Register
  category: direct
  rationale: Knowing which assets are critical helps determine which SIGs and risk topics are relevant,
    ensuring engagement is not random or legacy-driven.
  good_enough: An initial asset inventory listing major information assets and systems, sufficient to
    identify which areas need SIG coverage.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: direct
  rationale: Asset classification helps prioritize which risk topics and SIGs are most relevant based
    on the sensitivity and criticality of information handled.
  good_enough: A basic classification scheme that distinguishes at least between public, internal, and
    confidential information, applied to key assets.
