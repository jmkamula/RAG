leaf_id: req:A.6.3:training_completion_register
control_ref: A.6.3
standard_id: ISO27001:2022
curation_status: draft
authored_by: llm-4.1
authored_at: '2026-08-07'
prerequisites:
- ref: '4.3'
  standard_id: ISO27001:2022
  title: ISMS Scope Statement
  category: foundational
  rationale: The scope statement defines which personnel, business units, and activities are covered by
    the ISMS and, by extension, who must be included in the training completion register.
  good_enough: A documented scope that clearly identifies all in-scope personnel and functions for information
    security management.
- ref: A.5.2
  standard_id: ISO27001:2022
  title: Roles & Responsibilities
  category: foundational
  rationale: Clear assignment of information security roles ensures you know who is required to complete
    which training, and who is responsible for tracking completion.
  good_enough: A current list of security roles and responsibilities, with named individuals or job titles,
    sufficient to map training requirements.
- ref: A.6.2
  standard_id: ISO27001:2022
  title: Terms and conditions of employment
  category: direct
  rationale: Terms and conditions typically require personnel to complete mandatory information security
    training as a condition of employment, establishing the contractual basis for tracking completion.
  good_enough: Signed or acknowledged terms of employment for all in-scope personnel, with clauses referencing
    information security training obligations.
- ref: A.5.12
  standard_id: ISO27001:2022
  title: Classification Scheme
  category: foundational
  rationale: The classification scheme informs which training modules are mandatory for different personnel
    based on the sensitivity of information they handle.
  good_enough: A documented scheme that categorizes information and links categories to required training
    modules for relevant staff.
